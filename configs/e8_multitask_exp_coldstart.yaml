schema_version: 1
experiment_id: EXT-C-E8-MULTITASK-EXP-COLDSTART-01
result_status: not_run

parent:
  experiment_id: EXT-C-E8-MULTITASK-P0-01
  qualified_banks_required: true

reference:
  checkpoint_kind: fresh_lora_from_base_model
  optimizer_updates: 0
  validation_rows_seen: 0
  test_rows_seen: 0

initialization:
  source: base_model
  optimizer_updates: 0
  external_adapter_allowed: false
  deterministic_fresh_lora: true
  seed: 2026070803

model:
  base_model: Qwen/Qwen2.5-0.5B-Instruct
  revision: 7ae557604adf67be50417f59c2c2f167def9a775
  parameterization: lora
  lora_rank: 32
  lora_alpha: 64
  lora_dropout: 0.05
  dtype: auto
  max_length: 256
  max_new_tokens: 80
  gradient_checkpointing: true

suite:
  tasks:
    - countdown
    - word_sorting
    - mini_sudoku
    - maze
    - word_ladder
    - knights_knaves
    - graph_color
    - wikisql
  p0_tasks:
    - word_sorting
    - mini_sudoku
    - maze
    - word_ladder
    - knights_knaves
    - graph_color
    - wikisql
  external_tasks: [countdown]
  excluded_tasks:
    spiral_matrix: old_warmstart_positive_only_and_all_exp_cells_exactly_saturated

split:
  p0_train_rows: 5000
  p0_validation_rows: 500
  p0_test_rows: 500
  countdown_train_rows: 6000
  countdown_validation_rows: 500
  hash_seed: 2026072901
  test_access_allowed: false
  countdown_subsampling_forbidden: true

training:
  optimizer_updates: 1200
  micro_batch: 1
  gradient_accumulation: 8
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  evaluation_every_updates: 100
  early_stopping: false
  late_window_updates: [800, 900, 1000, 1100, 1200]
  terminal_adapter_required: true

evaluation:
  greedy_prompt_rows: 500
  passk_prompt_rows: 500
  pass_k: 8
  auxiliary_pass_ks: [64]
  batch_size: 8
  sampling_temperature: 0.8
  top_p: 0.95
  max_new_tokens: 80
  generation_seed: 2026070801
  primary_checkpoint_policy: late_window_and_terminal
  best_checkpoint_role: supplementary_only

negative_sampling:
  negatives_per_prompt: 16
  consumer: all_unique_negatives_per_prompt
  deduplicate_rule: first_canonical_completion_occurrence
  denominator: unique_negative_count_per_prompt
  near_far_selection: false
  selection_stop_gradient: true
  weight_sum_normalization: false
  gradient_budget_matching: false

remoteness_calibration:
  enabled: false
  mode: paper_linear_surprisal_no_calibration
  coordinate: current_sequence_surprisal_div_2
  detached: true
  extra_square: false
  gradient_rms_matching: false

# These are the only scientific-interface differences allowed outside Countdown.
task_runtime:
  override_whitelist:
    - model.max_length
    - model.max_new_tokens
    - evaluation.batch_size
    - evaluation.greedy_prompt_rows
    - evaluation.passk_prompt_rows
  countdown:
    {max_length: 256, max_new_tokens: 80, evaluation_batch_size: 8,
     greedy_prompt_rows: 500, passk_prompt_rows: 500}
  word_sorting: &task_transfer_runtime
    {max_length: 512, max_new_tokens: 128, evaluation_batch_size: 8,
     greedy_prompt_rows: 500, passk_prompt_rows: 128}
  mini_sudoku: *task_transfer_runtime
  maze: *task_transfer_runtime
  word_ladder: *task_transfer_runtime
  knights_knaves: *task_transfer_runtime
  graph_color: *task_transfer_runtime
  wikisql: *task_transfer_runtime

