execution:
  max_concurrent_cells: 8
  gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
  slots_per_gpu: 1
  expected_waves: 24
  scheduler: dynamic_slot_queue
  wave_barriers: false
  identity_checked_resume: true
  retry_incomplete_requires_explicit_flag: true
  fail_closed: true
