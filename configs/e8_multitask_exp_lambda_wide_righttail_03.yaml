result_status: not_run
claim: >-
  For the five transfer tasks whose high-lambda response boundary remains unresolved,
  extend the Exp taper coefficient substantially beyond the predecessor scans to determine
  whether the response exhibits a clear right-tail decline, a broad plateau or saturation,
  or continued increase over the newly tested finite range. This is external-validity
  curve-shape evidence only and does not establish an asymptotic regime.
