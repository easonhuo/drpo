  block_id: e8-multitask-baseline-launch-semantics-timestamp-correction-2026-09-10
  content: '- **E8 multitask baseline launch-semantics / timestamp correction (`EXT-C-E8-MULTITASK-BASELINE-MATRIX-01`)：**本条覆盖前一
    provenance correction 中仅关于“canonical hardened-v1 planned + blocked 因而 176-cell
    scientific run blocked”的表述。按照当前 `GOV-EXPERIMENT-LAUNCH-SIMPLIFICATION-01`，registry/READY/schema-v3/formal-channel/lane
    activation 不是 workload launch permission，也不得仅因其缺失、stale 或未激活而阻塞已经冻结且 source/config-valid
    的科学 workload。现有 E8 scientific runner 与 hardened shell execution path 记为 **implemented**；仍计划中的
    hardened-v1 formal-channel registration completeness 只保留为 optional legacy operational
    bookkeeping，`launch_blocked_by_formal_channel=false`，既不授权 launch，也没有 launch veto。科学状态仍为
    **not_run**；实际启动仍须满足 exact commit、clean checkout、frozen science、provenance、recovery、supervision、terminal
    audit、artifact 与现行 merge/launch 决策要求。另将已批准的 scientific execution chronology 写入端改为
    fail-closed：`_run_subprocess_cell()` 必须实际返回 present、numeric-convertible、finite
    且 `finished_unix >= started_unix` 的 `started_unix/finished_unix`，缺失、非法、非有限或倒序都必须失败，禁止使用
    `time.time()` 现场补造 authoritative evidence。本修正不改变 176-cell 矩阵、tasks、seeds、AsymRE/TOPR/DPO
    网格、1200-update horizon、optimizer 或 historical Countdown PR #268 DPO 语义。'
