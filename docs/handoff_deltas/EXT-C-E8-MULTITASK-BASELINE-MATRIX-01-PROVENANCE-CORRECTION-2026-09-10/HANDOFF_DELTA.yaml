  content: '- **E8 multitask baseline provenance / formal-channel correction (`EXT-C-E8-MULTITASK-BASELINE-MATRIX-01`)：**本条只纠正前一登记中的执行
    provenance 与 formal-channel 表述，不改变 176-cell 科学矩阵、8 个 transfer tasks、seeds `[4000,5000]`、AsymRE/TOPR/DPO
    网格、1200-update horizon 或 historical Countdown PR #268 DPO 语义；科学状态继续为 **not_run**。`scheduler/queue_events.jsonl`
    只承担 start/successful-finish `cell_key` 集合、重复/缺失和 `execution_origin` 身份审计，不能在 recovery/reuse
    时作为 seed 先后时间的科学证据。seed 顺序的时间证据必须读取各 cell manifest 持久化的原始 `scientific_execution_provenance.started_unix`
    与 `scientific_execution_provenance.successful_finish_unix`；reuse 必须保留原始 provenance，并验证
    `max(seed4000 successful finish time) <= min(seed5000 start time)`。另外，现有 `src/drpo/e8_multitask_exp_tuning.py`
    的科学 runner 已实现并完成回归验证，但仍包含直接 ZIP package subcommand，因此在 `GOV-FORMAL-ENTRYPOINT-01`
    语义下 canonical hardened-v1 formal entrypoint 仍是 **planned + blocked**，`implementation_state=not_implemented`
    指的是该 formal entrypoint integration，而不是科学 runner 未实现；这不改变当前 launch simplification
    规则，也不构成启动授权。'
