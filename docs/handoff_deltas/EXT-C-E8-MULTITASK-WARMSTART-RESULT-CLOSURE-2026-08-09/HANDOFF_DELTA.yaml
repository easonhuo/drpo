  block_id: e8-multitask-warmstart-result-closure-2026-08-09
  content: '- **E8 multitask warm-started pilot result closure（2026-08-09）：**保留 `EXT-C-E8-MULTITASK-P0-01`、`EXT-C-E8-MULTITASK-EXP-TUNING-01`
    与 `EXT-C-E8-MULTITASK-TOPR-ASYMRE-TUNING-01` 的 development-pilot 结果并新增初始化协议纠错记录。P0 八任务 implemented-gradient diagnostic
    已完成，最高 surprisal bin 的 task-equal relative implemented actor-gradient 为 `3.638`（95% CI `[3.256,4.095]`）；其 100-step Positive-only
    warm start 是为获得可诊断的 task-specific reference policy 而有意设置，因此 P0 只应解释为 **100-step warmstarted reference policy 上的 occurrence/implemented-gradient
    diagnostic**，而不是 untouched-Qwen 初始化诊断。后续 Exp method tuning（`72/72` cells）以及 fitted-reference TOPR/AsymRE tuning（当前 durable
    delivery `71/80` cells，partial）却把 `train_only_task_positive_warmstart_100` 继续作为方法训练初始化；post-run review 将这一继承认定为 **warm-start
    carryover protocol error**：该 warm start 来自梯度诊断的 reference-policy preparation，并非旧 Countdown 方法训练协议的必要组成。旧 Countdown DRPO/Positive-only/AsymRE/TOPR
    使用 pretrained Qwen + fresh LoRA，而新 multitask training 先经过 100-step Positive-only，因此两者不得组成严格 apples-to-apples 的九任务 cold-start
    方法比较。现有 Exp/TOPR/AsymRE 曲线不删除，可继续作为 **conditional on the warmstarted initialization** 的 pilot response evidence；在 authoritative
    protocol-matched 方法比较前必须执行 cold-start rerun。TOPR 仍是 joint fitted-reference beta-TOPR（`beta=0` 为 uncontrolled-negative
    boundary），AsymRE `delta_v=-1` 仍是 zero-negative boundary；固定 1200 steps 不等于 convergence，单 tuning seed/partial delivery 不授权
    significance 或正式 method ranking。D-U1 继续是 categorical causal-identification authority；task performance、valid/structure
    behavior 与 NaN/Inf numerical failure 必须分开报告。完整闭环见 `docs/results/E8_MULTITASK_WARMSTARTED_PILOTS_RESULT_2026-08-09.md`
    与 `experiments/results/e8_multitask_warmstarted_pilots_20260809/RESULT_CLOSURE.json`。'
