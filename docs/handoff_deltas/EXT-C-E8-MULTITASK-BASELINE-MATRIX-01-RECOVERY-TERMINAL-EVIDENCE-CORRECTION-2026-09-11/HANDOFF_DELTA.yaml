  block_id: e8-multitask-baseline-recovery-terminal-evidence-correction-2026-09-11
  content: '- **E8 multitask baseline recovery / terminal-evidence successor correction
    (`EXT-C-E8-MULTITASK-BASELINE-MATRIX-01`)：**本条覆盖旧字段名可能造成的歧义，不改动已冻结的 176-cell 科学矩阵、8
    个 transfer tasks、seeds `[4000,5000]`、AsymRE/TOPR/DPO 网格、1200-update horizon、optimizer
    或 historical Countdown PR #268 DPO 语义。`scheduler/queue_events.jsonl` 的 wall-clock
    时间明确**不**作为 seed chronology 科学证据；其职责仅为 exact cell identity、无重复/无缺失和 `execution_origin`
    审计，因此 registry 中旧的 `seed_batch_temporal_event_history_check` 退役为 `false`。真正的 seed-4000→5000
    时间顺序继续只由各 cell manifest 中持久化的 `scientific_execution_provenance.started_unix/successful_finish_unix`
    证明。recovery reuse 按全局 seed chronology 计算：任一较早 seed 需要重跑时，所有较晚 seed 的旧 reuse 一并失效；reuse
    必须保留原始 scientific provenance，禁止把 complete-but-reuse-invalid cell 重新打时间戳。终态证据链进一步
    fail-closed：aggregate 绑定当前全部 cell-manifest bytes 与 deterministic aggregate CSV/diagnostic
    bytes；terminal audit 绑定 aggregate、`scheduler/dynamic_run.json` 和 `queue_events.jsonl`
    bytes；`RUN_COMPLETE.json` 继续绑定 audit/aggregate/scheduler evidence，completed-attempt
    fast path 还要求 live terminal evidence 与 packaged workload 对应文件逐字节一致。任何 post-aggregate
    / post-audit mutation 都必须使 recovery/finalize/reuse 退回到相应阶段。科学状态继续为 **not_run**，本修正既不启动实验，也不授予
    merge/launch permission。'
