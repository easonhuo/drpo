[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drpo"
version = "0.1.0"
description = "DRPO research code for offline reinforcement learning experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "torch",
  "gymnasium",
  "minari",
  "h5py",
  "matplotlib",
  "pyyaml",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "src/drpo/drpo_cu1_reproduction_results_smoke/source_snapshot",
  "src/drpo/e7_canonical_vendor/d4rl",
]

# The E8 orchestration module deliberately preserves fail-closed exception
# boundaries and immediate task-local closures around a byte-locked scientific
# kernel.  These four Ruff diagnostics are style-only in this file; suppressing
# them avoids behavior-changing cleanup during the third-audit closure.
[tool.ruff.lint.per-file-ignores]
"src/drpo/e8_multitask_exp_tuning.py" = ["B023", "BLE001", "C401", "TRY004"]
