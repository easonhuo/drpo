name: Temporary correct frozen lambda config

on:
  push:
    branches:
      - dev/e8-multitask-lambda-completion-minimal-03

permissions:
  contents: write

jobs:
  correct-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-lambda-completion-minimal-03
          fetch-depth: 0
      - name: Re-materialize from reviewed implementation commit
        run: |
          git show bd5b04890eb590fe3c4a5686c2b7d3d258a9cd57:configs/e8_multitask_exp_lambda_completion.yaml > configs/e8_multitask_exp_lambda_completion.yaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('configs/e8_multitask_exp_lambda_completion.yaml')
          config = yaml.safe_load(path.read_text(encoding='utf-8'))
          config['sweep']['profile'] = 'eight_task_lambda_completion_v1'
          sentinels = [0.105360516, 0.430782916, 0.916290732, 1.897119985, 2.302585093, 2.995732274]
          config['sweep']['countdown_sentinel_coefficients'] = sentinels
          config['sweep']['task_lambda']['countdown'] = sentinels
          config.pop('engineering_liveness', None)
          path.write_text(yaml.safe_dump(config, sort_keys=False), encoding='utf-8')
          PY
          rm .github/workflows/tmp-e8-lambda-config-correct.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configs/e8_multitask_exp_lambda_completion.yaml .github/workflows/tmp-e8-lambda-config-correct.yml
          git commit -m 'Config: pin reviewed lambda-completion matrix'
          git push origin HEAD:dev/e8-multitask-lambda-completion-minimal-03
