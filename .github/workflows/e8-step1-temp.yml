name: TEMP E8 Step1 minimal repair
on:
  push:
    branches: [dev/e8-coldstart-step1-correctness-01]
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply exact reviewed replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/drpo/e8_multitask_exp_tuning.py'); t=p.read_text()
          R=[]
          R.append(('METHOD_GLOBAL = "global"\n', 'METHOD_GLOBAL = "global"\nTRANSFER_SYSTEM_PROMPT = "Answer with only the requested final output and no explanation."\n'))
          R.append(('            "expression": str(item.get("canonical_completion", item["completion"])),', '            "expression": str(item["completion"]),'))
          R.append(('    oracle_verification = row.get("oracle_verification", {})\n    oracle = str(\n        oracle_verification.get("canonical_completion", row["oracle_completion"])\n        if isinstance(oracle_verification, Mapping)\n        else row["oracle_completion"]\n    )', '    oracle = str(row["oracle_completion"])\n    if any(item["expression"] == oracle for item in bank):\n        raise RuntimeError(f"{task}/{prompt_id} negative completion matches the positive")'))
          R.append(('                prompt,\n                str(item["canonical_completion"]),\n                max_length,', '                prompt,\n                str(item["completion"]),\n                max_length,'))
          R.append(('            surprisal = -arena.completion_stats(model, packed)["seq_lp"]', '            surprisal = arena.sequence_surprisal_only(model, packed)'))
          R.append(('                "task_runtime": dict(config["task_runtime"][task]),\n                "selector": selector,', '                "task_runtime": dict(config["task_runtime"][task]),\n                "model_facing_text": "raw_completion_generic_prompt_v1",\n                "selector": selector,'))
          R.append(('        model.eval()\n        original_clean_expression = arena.clean_expression\n        try:\n            arena.clean_expression = lambda value: str(value)', '        model.eval()\n        original_clean_expression = arena.clean_expression\n        original_system_prompt = arena.SYSTEM_PROMPT\n        try:\n            arena.clean_expression = lambda value: str(value)\n            arena.SYSTEM_PROMPT = TRANSFER_SYSTEM_PROMPT'))
          R.append(('        finally:\n            arena.clean_expression = original_clean_expression\n            del model', '        finally:\n            arena.clean_expression = original_clean_expression\n            arena.SYSTEM_PROMPT = original_system_prompt\n            del model'))
          R.append(('        original_evaluate_rows = arena.evaluate_rows\n        original_clean_expression = arena.clean_expression\n        original_trainer_evaluate = scan_trainer._evaluate_validation', '        original_evaluate_rows = arena.evaluate_rows\n        original_clean_expression = arena.clean_expression\n        original_system_prompt = arena.SYSTEM_PROMPT\n        original_completion_stats = arena.completion_stats\n        original_trainer_evaluate = scan_trainer._evaluate_validation'))
          R.append(('                arena.evaluate_rows = evaluator\n                # Non-arithmetic task outputs', '                arena.evaluate_rows = evaluator\n                arena.SYSTEM_PROMPT = TRANSFER_SYSTEM_PROMPT\n                arena.completion_stats = lambda model, batch: {"seq_lp": -arena.sequence_surprisal_only(model, batch)}\n                # Non-arithmetic task outputs'))
          R.append(('            arena.evaluate_rows = original_evaluate_rows\n            arena.clean_expression = original_clean_expression\n            scan_trainer._evaluate_validation = original_trainer_evaluate', '            arena.evaluate_rows = original_evaluate_rows\n            arena.clean_expression = original_clean_expression\n            arena.SYSTEM_PROMPT = original_system_prompt\n            arena.completion_stats = original_completion_stats\n            scan_trainer._evaluate_validation = original_trainer_evaluate'))
          for old,new in R: assert t.count(old)==1,(old[:80],t.count(old)); t=t.replace(old,new,1)
          p.write_text(t)
          PY
          rm .github/workflows/e8-step1-temp.yml
          git diff --check && python -m py_compile src/drpo/e8_multitask_exp_tuning.py
          python -m pip install --disable-pip-version-check -q pytest==8.3.5 PyYAML==6.0.2 numpy==1.26.4 && PYTHONPATH=src python -m pytest -q tests/test_e8_multitask_p0.py -k 'coldstart or verified_wrong_candidate or task_base_config_transfer'
          test "$(git diff --name-only ea2c6d60084acd3e87d6f4118161747364bfe9b4)" = src/drpo/e8_multitask_exp_tuning.py
          test "$(git diff --numstat ea2c6d60084acd3e87d6f4118161747364bfe9b4 | awk '{s+=$1+$2} END{print s+0}')" -le 40
          git config user.name drpo-step1-bot; git config user.email actions@users.noreply.github.com
          git add -A && git commit -m 'E8 coldstart: fix transfer task interface' && git push origin HEAD:${GITHUB_REF_NAME}
