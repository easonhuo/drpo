name: E8 baseline source snapshot

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-baselines-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0

      - name: Package implementation context
        run: |
          tar -czf /tmp/e8-baselines-source-snapshot.tar.gz \
            AGENTS.md \
            pyproject.toml \
            docs/scopes/E8_MULTITASK_ASYMRE_CAPABILITY_DEV.md \
            docs/scopes/E8_MULTITASK_BASELINES_CAPABILITY_DEV.md \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_p0.py \
            src/drpo/e8_multitask_tasks.py \
            tests/test_e8_multitask_p0.py \
            configs/e8_multitask_exp_coldstart.yaml \
            configs/e8_multitask_exp_lambda_completion.yaml \
            configs/e8_multitask_exp_lambda_curve_completion.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: e8-baselines-source-snapshot
          path: /tmp/e8-baselines-source-snapshot.tar.gz
          retention-days: 1
