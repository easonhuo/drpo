name: E8 Runtime Propagation Fix Once

on:
  push:
    branches: [dev/e8-config-driven-sweep-01]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply runtime propagation repair
        run: bash scripts/.tmp_e8_runtime_propagation_fix.sh

      - name: Normalize positional load-model bridge assertion
        run: >-
          python -c 'from pathlib import Path; p=Path("tests/test_e8_multitask_p0.py"); t=p.read_text(encoding="utf-8"); old="    def fake_load_model(*args, **kwargs):\n        calls[\"load_model\"] = dict(kwargs)\n        return \"model\"\n"; new="    def fake_load_model(*args, **kwargs):\n        calls[\"load_model_args\"] = tuple(args)\n        calls[\"load_model\"] = dict(kwargs)\n        return \"model\"\n"; assert old in t, "fake_load_model test block not found"; t=t.replace(old,new,1); old2="    assert calls[\"load_model\"][\"gradient_checkpointing\"] is True\n"; new2="    assert (\n        calls[\"load_model\"].get(\n            \"gradient_checkpointing\",\n            calls[\"load_model_args\"][5],\n        )\n        is True\n    )\n"; assert old2 in t, "gradient-checkpointing assertion not found"; p.write_text(t.replace(old2,new2,1),encoding="utf-8")'

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Format changed Python
        run: |
          ruff format \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py

      - name: Engineering regression checks
        run: |
          python -m py_compile \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh
          ruff check \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check

      - name: Commit repair and remove one-shot machinery
        run: |
          rm .github/workflows/e8-runtime-propagation-fix-once.yml
          rm scripts/.tmp_e8_runtime_propagation_fix.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: propagate E8 config into canonical runtime"
          git push origin HEAD:dev/e8-config-driven-sweep-01
