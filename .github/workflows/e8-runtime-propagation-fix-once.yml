name: E8 Runtime Propagation Fix Once

on:
  push:
    branches: [dev/e8-config-driven-sweep-01]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply runtime propagation repair
        run: bash scripts/.tmp_e8_runtime_propagation_fix.sh

      - name: Normalize positional load-model bridge assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_e8_multitask_p0.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def fake_load_model(*args, **kwargs):
              calls["load_model"] = dict(kwargs)
              return "model"
          '''.replace("              ", "    ")
          new = '''    def fake_load_model(*args, **kwargs):
              calls["load_model_args"] = tuple(args)
              calls["load_model"] = dict(kwargs)
              return "model"
          '''.replace("              ", "    ")
          if old not in text:
              raise SystemExit("fake_load_model test block not found")
          text = text.replace(old, new, 1)
          old_assert = '    assert calls["load_model"]["gradient_checkpointing"] is True\n'
          new_assert = '''    assert (
              calls["load_model"].get(
                  "gradient_checkpointing",
                  calls["load_model_args"][5],
              )
              is True
          )
          '''.replace("              ", "    ")
          if old_assert not in text:
              raise SystemExit("gradient-checkpointing assertion not found")
          path.write_text(text.replace(old_assert, new_assert, 1), encoding="utf-8")
          PY

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Format changed Python
        run: |
          ruff format \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py

      - name: Engineering regression checks
        run: |
          python -m py_compile \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh
          ruff check \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check

      - name: Commit repair and remove one-shot machinery
        run: |
          rm .github/workflows/e8-runtime-propagation-fix-once.yml
          rm scripts/.tmp_e8_runtime_propagation_fix.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: propagate E8 config into canonical runtime"
          git push origin HEAD:dev/e8-config-driven-sweep-01
