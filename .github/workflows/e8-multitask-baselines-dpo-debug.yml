name: E8 multitask DPO generated-code debug

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-multitask-baselines-dpo-debug.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
      - name: Apply DPO patch and repair generated indentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/e8-multitask-baselines-dpo-impl.yml').read_text(encoding='utf-8')
          prefix = '      - name: Apply DPO capability patch\n        shell: bash\n        run: |\n'
          suffix = '      - name: Install focused dependencies\n'
          start = source.index(prefix) + len(prefix)
          end = source.index(suffix, start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/dpo_patch.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/dpo_patch.sh
          python - <<'PY'
          from pathlib import Path
          path = Path('src/drpo/e8_multitask_exp_tuning.py')
          text = path.read_text(encoding='utf-8')
          repairs = [
              (
                  '        if existing.get("identity_hash") == identity["identity_hash"] and existing.get("complete"):\n  return existing\n',
                  '        if existing.get("identity_hash") == identity["identity_hash"] and existing.get("complete"):\n            return existing\n',
              ),
              (
                  '    if cell_root.exists():\n        if not force:\n  raise RuntimeError(f"DPO cell output exists without reusable identity: {cell_root}")\n',
                  '    if cell_root.exists():\n        if not force:\n            raise RuntimeError(f"DPO cell output exists without reusable identity: {cell_root}")\n',
              ),
              (
                  '        if expected_parent not in cell_root.resolve().parents:\n  raise RuntimeError(f"Refusing unsafe DPO cell removal: {cell_root}")\n',
                  '        if expected_parent not in cell_root.resolve().parents:\n            raise RuntimeError(f"Refusing unsafe DPO cell removal: {cell_root}")\n',
              ),
          ]
          for old, new in repairs:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'expected exactly one contextual repair target, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile src/drpo/e8_multitask_exp_tuning.py || {
            status=$?
            nl -ba src/drpo/e8_multitask_exp_tuning.py | sed -n '4080,4700p'
            exit $status
          }
          echo 'PY_COMPILE_PASS'
