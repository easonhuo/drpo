name: E8 baseline independent review repair

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-baselines-independent-review-fix.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply independent-review repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runner_path = Path('src/drpo/e8_multitask_exp_tuning.py')
          tests_path = Path('tests/test_e8_multitask_p0.py')
          runner = runner_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          marker = 'def _train_canonical_dpo_transfer_cell(\n'
          if '_is_nan_inf_numerical_failure' not in runner:
              at = runner.index(marker)
              helpers = '''def _dpo_quantile(values: Any, q: float) -> float:\n    return float(torch.quantile(values.detach().float().cpu(), q).item())\n\n\ndef _is_nan_inf_numerical_failure(value: Any) -> bool:\n    return isinstance(value, str) and value.startswith("nonfinite_")\n\n\n'''
              runner = runner[:at] + helpers + runner[at:]

          dpo_start = runner.index(marker)
          dpo_end = runner.index('def _cmd_dpo_liveness(\n', dpo_start)
          dpo = runner[dpo_start:dpo_end]

          dpo = once(
              dpo,
              '    eval_every = int(effective["training"]["evaluation_every_updates"])\n'
              '    seed = int(train_cfg["seed"]) + int(cell.seed)\n',
              '    eval_every = int(effective["training"]["evaluation_every_updates"])\n'
              '    log_every = int(train_cfg["log_every"])\n'
              '    seed = int(train_cfg["seed"]) + int(cell.seed)\n',
              'DPO log cadence',
          )
          dpo = once(
              dpo,
              '            num_workers=0,\n',
              '            num_workers=int(train_cfg["num_workers"]),\n',
              'DPO canonical dataloader workers',
          )
          dpo = once(
              dpo,
              '            loss_total = 0.0\n'
              '            pair_margin_total = 0.0\n'
              '            preference_accuracy_total = 0.0\n'
              '            saturation_total = 0.0\n'
              '            abort_update = False\n',
              '            loss_total = 0.0\n'
              '            diagnostic_totals = {\n'
              '                "policy_chosen_sum_lp": 0.0,\n'
              '                "policy_rejected_sum_lp": 0.0,\n'
              '                "reference_chosen_sum_lp": 0.0,\n'
              '                "reference_rejected_sum_lp": 0.0,\n'
              '                "pair_margin_mean": 0.0,\n'
              '                "pair_margin_p10": 0.0,\n'
              '                "pair_margin_p50": 0.0,\n'
              '                "pair_margin_p90": 0.0,\n'
              '                "preference_accuracy": 0.0,\n'
              '                "logit_saturation_fraction": 0.0,\n'
              '                "unique_negative_count_mean": 0.0,\n'
              '                "raw_bank_count_mean": 0.0,\n'
              '                "duplicates_removed_mean": 0.0,\n'
              '            }\n'
              '            abort_update = False\n',
              'DPO audited diagnostic accumulator',
          )
          dpo = once(
              dpo,
              '                (loss / accumulation).backward()\n'
              '                loss_total += float(loss.detach().cpu())\n'
              '                pair_margin_total += float(pair_margin.detach().mean().cpu())\n'
              '                preference_accuracy_total += float(\n'
              '                    (pair_margin.detach() > 0.0).float().mean().cpu()\n'
              '                )\n'
              '                saturation_total += float((logits.detach().abs() >= 10.0).float().mean().cpu())\n',
              '                (loss / accumulation).backward()\n'
              '                loss_total += float(loss.detach().cpu())\n'
              '                policy_rejected_mean = _dpo_prompt_balanced_mean(\n'
              '                    policy_rejected.detach(),\n'
              '                    row_index,\n'
              '                    unique_counts,\n'
              '                    paper_common=paper_common,\n'
              '                )\n'
              '                reference_rejected_mean = _dpo_prompt_balanced_mean(\n'
              '                    reference_rejected,\n'
              '                    row_index,\n'
              '                    unique_counts,\n'
              '                    paper_common=paper_common,\n'
              '                )\n'
              '                diagnostics = {\n'
              '                    "policy_chosen_sum_lp": float(policy_chosen.detach().mean().cpu()),\n'
              '                    "policy_rejected_sum_lp": float(policy_rejected_mean.detach().cpu()),\n'
              '                    "reference_chosen_sum_lp": float(reference_chosen.mean().cpu()),\n'
              '                    "reference_rejected_sum_lp": float(reference_rejected_mean.cpu()),\n'
              '                    "pair_margin_mean": float(pair_margin.detach().mean().cpu()),\n'
              '                    "pair_margin_p10": _dpo_quantile(pair_margin, 0.10),\n'
              '                    "pair_margin_p50": _dpo_quantile(pair_margin, 0.50),\n'
              '                    "pair_margin_p90": _dpo_quantile(pair_margin, 0.90),\n'
              '                    "preference_accuracy": float(\n'
              '                        (pair_margin.detach() > 0.0).float().mean().cpu()\n'
              '                    ),\n'
              '                    "logit_saturation_fraction": float(\n'
              '                        (logits.detach().abs() >= 10.0).float().mean().cpu()\n'
              '                    ),\n'
              '                    "unique_negative_count_mean": float(\n'
              '                        packed["unique_counts"].float().mean().cpu()\n'
              '                    ),\n'
              '                    "raw_bank_count_mean": float(\n'
              '                        packed["raw_bank_counts"].float().mean().cpu()\n'
              '                    ),\n'
              '                    "duplicates_removed_mean": float(\n'
              '                        (packed["raw_bank_counts"] - packed["unique_counts"])\n'
              '                        .float()\n'
              '                        .mean()\n'
              '                        .cpu()\n'
              '                    ),\n'
              '                }\n'
              '                for key, value in diagnostics.items():\n'
              '                    diagnostic_totals[key] += value\n',
              'DPO audited diagnostics',
          )
          dpo = once(
              dpo,
              '            sample_update_norm = update % 10 == 0 or update == updates\n',
              '            sample_update_norm = update % log_every == 0 or update == updates\n',
              'DPO config log cadence for update norm',
          )
          dpo = once(
              dpo,
              '            if update % 10 == 0 or update == updates:\n',
              '            if update % log_every == 0 or update == updates:\n',
              'DPO config log cadence for diagnostics',
          )
          dpo = once(
              dpo,
              '                        "dpo_pair_loss": loss_total / accumulation,\n'
              '                        "pair_margin_mean": pair_margin_total / accumulation,\n'
              '                        "preference_accuracy": preference_accuracy_total / accumulation,\n'
              '                        "logit_saturation_fraction": saturation_total / accumulation,\n',
              '                        "dpo_pair_loss": loss_total / accumulation,\n'
              '                        **{\n'
              '                            key: value / accumulation\n'
              '                            for key, value in diagnostic_totals.items()\n'
              '                        },\n',
              'DPO training diagnostic record',
          )
          dpo = once(
              dpo,
              '            "optimizer_updates": terminal_step,\n'
              '            "optimizer_updates_requested": updates,\n',
              '            "optimizer_updates": terminal_step,\n'
              '            "terminal_step": terminal_step,\n'
              '            "optimizer_updates_requested": updates,\n',
              'DPO terminal step provenance',
          )
          dpo = once(
              dpo,
              '            "nan_inf_failure": bool(\n'
              '                numerical_failure is not None and numerical_failure.startswith("nonfinite_")\n'
              '            ),\n',
              '            "nan_inf_failure": _is_nan_inf_numerical_failure(numerical_failure),\n',
              'DPO nan-inf classification helper',
          )
          dpo = once(
              dpo,
              '        atomic_json(manifest_path, result)\n'
              '        return result\n',
              '        if not engineering_liveness:\n'
              '            summary_path = cell_root / "summary.json"\n'
              '            atomic_json(summary_path, result)\n'
              '            result["canonical_summary"] = str(summary_path.resolve())\n'
              '            result["canonical_summary_sha256"] = sha256_file(summary_path)\n'
              '            result["canonical_output"] = str(cell_root.resolve())\n'
              '        atomic_json(manifest_path, result)\n'
              '        return result\n',
              'DPO recovery summary contract',
          )
          runner = runner[:dpo_start] + dpo + runner[dpo_end:]

          canonical_start = runner.index('def _train_canonical_cold_cell(\n')
          canonical_end = runner.index('def _train_cell_impl(\n', canonical_start)
          canonical = runner[canonical_start:canonical_end]
          canonical = once(
              canonical,
              '    metrics_summary = _summarize_evaluations(evaluations, config)\n'
              '    numerical_failure = canonical_summary.get("numerical_failure")\n',
              '    numerical_failure = canonical_summary.get("numerical_failure")\n'
              '    metrics_summary = (\n'
              '        _summarize_evaluations(evaluations, config)\n'
              '        if numerical_failure is None\n'
              '        else {}\n'
              '    )\n',
              'canonical failed-cell late-window handling',
          )
          canonical = once(
              canonical,
              '        "best_step": metrics_summary["supplementary_best_step"],\n'
              '        "terminal_step": canonical_summary.get("terminal_step"),\n'
              '        "stop_reason": canonical_summary.get("stop_reason"),\n'
              '        "validation_best_pass8": metrics_summary["supplementary_best_pass8"],\n'
              '        "validation_terminal_pass8": metrics_summary["validation_terminal_pass8"],\n'
              '        "validation_best_greedy": metrics_summary["supplementary_best_greedy"],\n'
              '        "validation_terminal_greedy": metrics_summary["validation_terminal_greedy"],\n'
              '        "validation_best_greedy_valid_rate": max(\n'
              '            float(row["greedy_valid_rate"]) for row in evaluations\n'
              '        ),\n'
              '        "validation_terminal_greedy_valid_rate": metrics_summary[\n'
              '            "validation_terminal_greedy_valid_rate"\n'
              '        ],\n'
              '        "validation_terminal_sampled_valid_rate": metrics_summary[\n'
              '            "validation_terminal_sampled_valid_rate"\n'
              '        ],\n'
              '        "optimizer_updates": int(canonical_summary.get("terminal_step", 0)),\n'
              '        "numerical_failure": numerical_failure,\n'
              '        "nan_inf_failure": numerical_failure is not None,\n'
              '        "evaluation_status": "complete" if evaluations else "incomplete",\n'
              '        "test_partition_accessed": False,\n'
              '        "complete": bool(evaluations and numerical_failure is None),\n',
              '        "best_step": metrics_summary.get("supplementary_best_step"),\n'
              '        "terminal_step": canonical_summary.get("terminal_step"),\n'
              '        "stop_reason": canonical_summary.get("stop_reason"),\n'
              '        "validation_best_pass8": metrics_summary.get("supplementary_best_pass8"),\n'
              '        "validation_terminal_pass8": metrics_summary.get("validation_terminal_pass8"),\n'
              '        "validation_best_greedy": metrics_summary.get("supplementary_best_greedy"),\n'
              '        "validation_terminal_greedy": metrics_summary.get("validation_terminal_greedy"),\n'
              '        "validation_best_greedy_valid_rate": (\n'
              '            max(float(row["greedy_valid_rate"]) for row in evaluations)\n'
              '            if numerical_failure is None and evaluations\n'
              '            else None\n'
              '        ),\n'
              '        "validation_terminal_greedy_valid_rate": metrics_summary.get(\n'
              '            "validation_terminal_greedy_valid_rate"\n'
              '        ),\n'
              '        "validation_terminal_sampled_valid_rate": metrics_summary.get(\n'
              '            "validation_terminal_sampled_valid_rate"\n'
              '        ),\n'
              '        "optimizer_updates": int(canonical_summary.get("terminal_step") or 0),\n'
              '        "numerical_failure": numerical_failure,\n'
              '        "nan_inf_failure": _is_nan_inf_numerical_failure(numerical_failure),\n'
              '        "evaluation_status": (\n'
              '            "complete" if evaluations and numerical_failure is None else "incomplete"\n'
              '        ),\n'
              '        "test_partition_accessed": False,\n'
              '        "complete": bool(evaluations and numerical_failure is None),\n',
              'canonical failed-cell reporting separation',
          )
          runner = runner[:canonical_start] + canonical + runner[canonical_end:]

          tests += r'''


def test_nan_inf_failure_classifier_separates_identity_mismatch() -> None:
    from drpo import e8_multitask_exp_tuning as exp_tuning

    assert exp_tuning._is_nan_inf_numerical_failure(None) is False
    assert (
        exp_tuning._is_nan_inf_numerical_failure(
            "initial_policy_reference_ratio_mismatch"
        )
        is False
    )
    assert exp_tuning._is_nan_inf_numerical_failure("nonfinite_loss_at_step_1") is True
    assert exp_tuning._is_nan_inf_numerical_failure("nonfinite_parameters_at_step_9") is True


def test_canonical_failed_cell_preserves_manifest_without_late_window_summary() -> None:
    import inspect

    from drpo import e8_multitask_exp_tuning as exp_tuning

    source = inspect.getsource(exp_tuning._train_canonical_cold_cell)
    assert 'numerical_failure = canonical_summary.get("numerical_failure")' in source
    assert 'if numerical_failure is None' in source
    assert 'else {}' in source
    assert '"nan_inf_failure": _is_nan_inf_numerical_failure(numerical_failure)' in source
    assert '"evaluation_status": (' in source
    assert 'metrics_summary.get("supplementary_best_step")' in source


def test_dpo_emits_recovery_summary_and_audited_pr268_diagnostics() -> None:
    import inspect

    from drpo import e8_multitask_exp_tuning as exp_tuning

    source = inspect.getsource(exp_tuning._train_canonical_dpo_transfer_cell)
    required = (
        'summary_path = cell_root / "summary.json"',
        'result["canonical_summary_sha256"] = sha256_file(summary_path)',
        '"policy_chosen_sum_lp"',
        '"policy_rejected_sum_lp"',
        '"reference_chosen_sum_lp"',
        '"reference_rejected_sum_lp"',
        '"pair_margin_p10"',
        '"pair_margin_p50"',
        '"pair_margin_p90"',
        '"unique_negative_count_mean"',
        '"raw_bank_count_mean"',
        '"duplicates_removed_mean"',
        'num_workers=int(train_cfg["num_workers"])',
        'log_every = int(train_cfg["log_every"])',
        '"terminal_step": terminal_step',
    )
    for fragment in required:
        assert fragment in source

    reusable = inspect.getsource(exp_tuning._reusable_cell_manifests)
    assert 'value.get("canonical_summary"' in reusable
    assert 'value.get("canonical_summary_sha256"' in reusable
'''

          runner_path.write_text(runner, encoding='utf-8')
          tests_path.write_text(tests, encoding='utf-8')
          PY
      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -q numpy pyyaml pytest ruff
          python -m pip install --disable-pip-version-check -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Format newly added test imports
        run: ruff check tests/test_e8_multitask_p0.py --select I001 --fix
      - name: Compile
        run: python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
      - name: Focused regression with CPU Torch
        run: PYTHONPATH=.:src pytest -q -rs tests/test_e8_multitask_p0.py
      - name: Diff check
        run: git diff --check
      - name: Ruff excluding known main-branch BLE001/B023 debt
        run: ruff check src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py --ignore BLE001,B023
      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git commit -m 'fix: close E8 baseline review gaps'
          git push origin HEAD:dev/e8-multitask-baselines-capability-01
