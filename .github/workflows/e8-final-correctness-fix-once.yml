name: E8 Final Correctness Fix Once

on:
  push:
    branches: [dev/e8-config-driven-sweep-01]
    paths:
      - .github/workflows/e8-final-correctness-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply audited correctness fixes only
        run: |
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          BASE = "6ed153d5ad7361a4e52348610b86b51b71e25e47"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          runner_path = Path("scripts/run_e8_multitask_exp_coldstart.sh")
          runner = runner_path.read_text(encoding="utf-8")

          preflight_anchor = '''config_preflight() {
            [[ -x "${VENV_DIR}/bin/python" ]] || fail "runtime Python is unavailable for config preflight"
            "${VENV_DIR}/bin/python" "${ROOT_DIR}/scripts/preflight_e8_multitask_config.py" \\
              --repo-root "${ROOT_DIR}" \\
              --config "${CONFIG_PATH}"
          }

          setup() {
          '''.replace("          ", "")
          preflight_replacement = '''config_preflight() {
            [[ -x "${VENV_DIR}/bin/python" ]] || fail "runtime Python is unavailable for config preflight"
            "${VENV_DIR}/bin/python" "${ROOT_DIR}/scripts/preflight_e8_multitask_config.py" \\
              --repo-root "${ROOT_DIR}" \\
              --config "${CONFIG_PATH}"
          }

          bootstrap_config_preflight() {
            command -v python3 >/dev/null || fail "python3 is unavailable"
            if [[ ! -x "${VENV_DIR}/bin/python" ]]; then
              python3 -m venv --system-site-packages "${VENV_DIR}"
            fi
            # shellcheck disable=SC1091
            source "${VENV_DIR}/bin/activate"
            if ! python - <<'PY_PREFLIGHT_DEPS'
          import numpy
          import yaml
          PY_PREFLIGHT_DEPS
            then
              python -m pip install --disable-pip-version-check "numpy==1.26.4" "PyYAML==6.0.2"
            fi
            mkdir -p "${RECOVERY_ROOT}"
            config_preflight | tee "${RECOVERY_ROOT}/CONFIG_PREFLIGHT.json"
          }

          setup() {
          '''.replace("          ", "")
          runner = replace_once(runner, preflight_anchor, preflight_replacement, "insert early preflight")

          setup_start = runner.find("\nsetup() {\n")
          runtime_ready_start = runner.find("\nruntime_ready() {\n", setup_start)
          if setup_start < 0 or runtime_ready_start < 0:
              raise SystemExit("setup/runtime_ready function boundaries not found")
          setup = runner[setup_start:runtime_ready_start]
          setup = replace_once(
              setup,
              '  mkdir -p "${RUNTIME_ROOT}"\n  python3 - <<\'PY\'\n',
              '  mkdir -p "${RUNTIME_ROOT}"\n  bootstrap_config_preflight\n  python3 - <<\'PY\'\n',
              "call early preflight in setup",
          )
          setup = replace_once(
              setup,
              '  python3 -m venv --system-site-packages "${VENV_DIR}"\n',
              "",
              "remove duplicate setup venv creation",
          )
          setup = replace_once(
              setup,
              '  mkdir -p "${RECOVERY_ROOT}"\n  config_preflight | tee "${RECOVERY_ROOT}/CONFIG_PREFLIGHT.json"\n',
              "",
              "remove late setup preflight",
          )
          runner = runner[:setup_start] + setup + runner[runtime_ready_start:]

          gate_start = runner.find("\nrequire_registered_ready() {\n")
          prepare_start = runner.find("\nprepare() {\n", gate_start)
          if gate_start < 0 or prepare_start < 0:
              raise SystemExit("obsolete registration/channel function block not found")
          runner = runner[:gate_start] + runner[prepare_start:]
          formal_gate_call = '''  if [[ "${RUN_CLASS}" == "formal" ]]; then
            require_registered_ready
            validate_registered_channel
          fi
          '''.replace("          ", "")
          runner = replace_once(runner, formal_gate_call, "", "remove obsolete launch authorization")

          provenance_old = '''import json
          from pathlib import Path
          value = {
              "schema_version": 1,
              "run_id": "${RUN_ID}",
              "source_commit": "${EXPECTED_COMMIT}",
              "model_repo": "${MODEL_REPO}",
              "model_revision": "${MODEL_REVISION}",
          '''.replace("          ", "")
          provenance_new = '''import json
          from pathlib import Path
          from drpo.e8_multitask_exp_tuning import load_config
          config = load_config(Path("${CONFIG_PATH}"))
          value = {
              "schema_version": 1,
              "run_id": "${RUN_ID}",
              "source_commit": "${EXPECTED_COMMIT}",
              "model_repo": config["model"]["base_model"],
              "model_revision": config["model"]["revision"],
          '''.replace("          ", "")
          runner = replace_once(runner, provenance_old, provenance_new, "repair model provenance")
          if "${MODEL_REPO}" in runner or "${MODEL_REVISION}" in runner:
              raise SystemExit("removed model shell variables still have consumers")
          runner_path.write_text(runner, encoding="utf-8")

          config_path = Path("src/drpo/e8_experiment_config.py")
          config = config_path.read_text(encoding="utf-8")
          config = replace_once(
              config,
              '    if current_id in (RHO_EXPERIMENT_ID, DENSE_EXPERIMENT_ID):\n        raise ValueError("RHO/DENSE historical IDs may not be reused for cold-start")\n',
              '    if current_id in (P0_EXPERIMENT_ID, RHO_EXPERIMENT_ID, DENSE_EXPERIMENT_ID):\n        raise ValueError("P0/RHO/DENSE experiment IDs may not be reused for cold-start")\n',
              "close P0 experiment-ID collision",
          )
          config_path.write_text(config, encoding="utf-8")

          tuning_path = Path("src/drpo/e8_multitask_exp_tuning.py")
          tuning = tuning_path.read_text(encoding="utf-8")
          tuning = replace_once(
              tuning,
              '    original_generate_outputs = arena.generate_outputs\n    contract = _runtime_bridge_contract(effective)\n',
              '    original_generate_outputs = arena.generate_outputs\n    original_scheduler = getattr(arena, "get_cosine_schedule_with_warmup", None)\n    contract = _runtime_bridge_contract(effective)\n',
              "capture scheduler interface",
          )
          install_anchor = '''    arena.LoraConfig = configured_lora_config
          arena.load_model = configured_load_model
          arena.generate_outputs = configured_generate_outputs
          try:
          '''.replace("          ", "")
          install_replacement = '''    def configured_scheduler(
              optimizer: Any,
              num_warmup_steps: int,
              num_training_steps: int,
              *args: Any,
              **kwargs: Any,
          ) -> Any:
              if original_scheduler is None:
                  raise RuntimeError("Canonical arena scheduler is unavailable")
              if float(effective["training"]["warmup_ratio"]) == 0.0:
                  num_warmup_steps = 0
              return original_scheduler(
                  optimizer,
                  num_warmup_steps,
                  num_training_steps,
                  *args,
                  **kwargs,
              )

          arena.LoraConfig = configured_lora_config
          arena.load_model = configured_load_model
          arena.generate_outputs = configured_generate_outputs
          if original_scheduler is not None:
              arena.get_cosine_schedule_with_warmup = configured_scheduler
          try:
          '''.replace("          ", "")
          tuning = replace_once(tuning, install_anchor, install_replacement, "install zero-warmup adapter")
          restore_anchor = '''        arena.LoraConfig = original_lora_config
              arena.load_model = original_load_model
              arena.generate_outputs = original_generate_outputs
          '''.replace("              ", "        ")
          restore_replacement = '''        arena.LoraConfig = original_lora_config
              arena.load_model = original_load_model
              arena.generate_outputs = original_generate_outputs
              if original_scheduler is not None:
                  arena.get_cosine_schedule_with_warmup = original_scheduler
          '''.replace("              ", "        ")
          tuning = replace_once(tuning, restore_anchor, restore_replacement, "restore scheduler interface")
          tuning_path.write_text(tuning, encoding="utf-8")

          tests_path = Path("tests/test_e8_multitask_p0.py")
          tests = tests_path.read_text(encoding="utf-8")
          additions = r'''

          def test_generic_coldstart_rejects_p0_experiment_id_collision() -> None:
              from drpo import e8_multitask_exp_tuning as exp_tuning

              config = exp_tuning.load_config(Path("configs/e8_multitask_exp_lambda_curve_completion.yaml"))
              config["experiment_id"] = exp_tuning.P0_EXPERIMENT_ID
              with pytest.raises(ValueError, match="P0/RHO/DENSE"):
                  exp_tuning.validate_config(config)


          def test_coldstart_runner_has_no_stale_model_or_registration_consumers() -> None:
              runner = Path("scripts/run_e8_multitask_exp_coldstart.sh").read_text(encoding="utf-8")
              assert "${MODEL_REPO}" not in runner
              assert "${MODEL_REVISION}" not in runner
              assert "require_registered_ready" not in runner
              assert "validate_registered_channel" not in runner
              setup = runner.split("\nsetup() {\n", 1)[1].split("\nruntime_ready() {\n", 1)[0]
              assert setup.index("bootstrap_config_preflight") < setup.index("torch.cuda.is_available")
              assert setup.index("bootstrap_config_preflight") < setup.index("pip install -r")
              assert 'config["model"]["base_model"]' in runner
              assert 'config["model"]["revision"]' in runner


          def test_zero_warmup_reaches_legacy_scheduler(tmp_path: Path) -> None:
              from drpo import e8_experiment_config as experiment_config
              from drpo import e8_multitask_exp_tuning as exp_tuning

              config = exp_tuning.load_config(Path("configs/e8_multitask_exp_lambda_curve_completion.yaml"))
              config["experiment_id"] = "EXT-C-E8-MULTITASK-ZERO-WARMUP-TEST"
              config["training"]["warmup_ratio"] = 0.0
              exp_tuning.validate_config(config)
              effective = experiment_config.effective_coldstart_runtime(config, "word_sorting")
              task_root = tmp_path / "word_sorting"
              task_root.mkdir()
              grids = exp_tuning._task_grid_configs(
                  config,
                  canonical_paths=exp_tuning._canonical_paths(config),
                  task_root=task_root,
              )
              observed = {}

              def fake_scheduler(optimizer, num_warmup_steps, num_training_steps, *args, **kwargs):
                  del optimizer, args, kwargs
                  observed["warmup"] = num_warmup_steps
                  observed["training"] = num_training_steps
                  return "scheduler"

              def fake_lora(*args, **kwargs):
                  return args, kwargs

              def fake_load_model(*args, **kwargs):
                  return args, kwargs

              def fake_generate(*args, **kwargs):
                  return [["x"]]

              arena = SimpleNamespace(
                  LoraConfig=fake_lora,
                  load_model=fake_load_model,
                  generate_outputs=fake_generate,
                  get_cosine_schedule_with_warmup=fake_scheduler,
              )
              optim = SimpleNamespace(AdamW=lambda *args, **kwargs: (args, kwargs))

              def strict_validator(value):
                  assert int(value["training"]["steps"]) == 1200
                  assert int(value["training"]["eval_every"]) == 100

              paper_common = SimpleNamespace(validate_grid_config=strict_validator)
              modules = {
                  "arena": arena,
                  "paper_common": paper_common,
                  "scan_common": SimpleNamespace(validate_grid_config=strict_validator),
                  "scan_runtime": SimpleNamespace(validate_grid_config=strict_validator),
                  "scan_trainer": SimpleNamespace(
                      validate_grid_config=strict_validator,
                      torch=SimpleNamespace(optim=optim),
                  ),
              }
              original_scheduler = arena.get_cosine_schedule_with_warmup
              with exp_tuning._legacy_paper_runtime_bridge(
                  modules,
                  effective,
                  grid_path=grids["round1_grid"]["path"],
                  grid_source_path=grids["round1_grid"]["source"],
              ):
                  arena.get_cosine_schedule_with_warmup("optimizer", 1, 1200)
              assert observed == {"warmup": 0, "training": 1200}
              assert arena.get_cosine_schedule_with_warmup is original_scheduler
          '''
          additions = additions.replace("          ", "")
          if "def test_generic_coldstart_rejects_p0_experiment_id_collision" in tests:
              raise SystemExit("correctness regression tests already present")
          tests_path.write_text(tests.rstrip() + additions + "\n", encoding="utf-8")

          subprocess.run(
              ["git", "checkout", BASE, "--", ".github/workflows/code-change-budget.yml"],
              check=True,
          )
          PY

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Validate final correctness after-image
        run: |
          BASE=6ed153d5ad7361a4e52348610b86b51b71e25e47
          python -m py_compile \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh
          ruff check \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check
          git diff --exit-code "$BASE" -- .github/workflows/code-change-budget.yml

      - name: Commit fixes and self-remove
        run: |
          rm -f .github/workflows/e8-final-correctness-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(e8): close config-driven correctness gaps"
          git push origin HEAD:dev/e8-config-driven-sweep-01
