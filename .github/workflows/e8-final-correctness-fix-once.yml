name: E8 Final Correctness Fix Once

on:
  push:
    branches: [dev/e8-config-driven-sweep-01]
    paths:
      - .github/workflows/e8-final-correctness-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply audited correctness fixes only
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          BASE = "6ed153d5ad7361a4e52348610b86b51b71e25e47"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # 1) Runner: fail-fast preflight before expensive setup, remove obsolete launch
          # authorization, and source model provenance from the selected config.
          runner_path = Path("scripts/run_e8_multitask_exp_coldstart.sh")
          runner = runner_path.read_text(encoding="utf-8")

          preflight_anchor = '''config_preflight() {
            [[ -x "${VENV_DIR}/bin/python" ]] || fail "runtime Python is unavailable for config preflight"
            "${VENV_DIR}/bin/python" "${ROOT_DIR}/scripts/preflight_e8_multitask_config.py" \\
              --repo-root "${ROOT_DIR}" \\
              --config "${CONFIG_PATH}"
          }

          setup() {
          '''.replace("          ", "")
          preflight_replacement = '''config_preflight() {
            [[ -x "${VENV_DIR}/bin/python" ]] || fail "runtime Python is unavailable for config preflight"
            "${VENV_DIR}/bin/python" "${ROOT_DIR}/scripts/preflight_e8_multitask_config.py" \\
              --repo-root "${ROOT_DIR}" \\
              --config "${CONFIG_PATH}"
          }

          bootstrap_config_preflight() {
            command -v python3 >/dev/null || fail "python3 is unavailable"
            python3 -m venv --system-site-packages "${VENV_DIR}"
            # shellcheck disable=SC1091
            source "${VENV_DIR}/bin/activate"
            if ! python - <<'PY_PREFLIGHT_DEPS'
          import numpy
          import yaml
          PY_PREFLIGHT_DEPS
            then
              python -m pip install --disable-pip-version-check "numpy==1.26.4" "PyYAML==6.0.2"
            fi
            mkdir -p "${RECOVERY_ROOT}"
            config_preflight | tee "${RECOVERY_ROOT}/CONFIG_PREFLIGHT.json"
          }

          setup() {
          '''.replace("          ", "")
          runner = replace_once(runner, preflight_anchor, preflight_replacement, "insert early preflight")

          runner = replace_once(
              runner,
              '  mkdir -p "${RUNTIME_ROOT}"\n  python3 - <<\'PY\'\n',
              '  mkdir -p "${RUNTIME_ROOT}"\n  bootstrap_config_preflight\n  python3 - <<\'PY\'\n',
              "call early preflight",
          )
          runner = replace_once(
              runner,
              '  python3 -m venv --system-site-packages "${VENV_DIR}"\n',
              "",
              "remove duplicate full-runtime venv creation",
          )
          runner = replace_once(
              runner,
              '  mkdir -p "${RECOVERY_ROOT}"\n  config_preflight | tee "${RECOVERY_ROOT}/CONFIG_PREFLIGHT.json"\n',
              "",
              "remove late duplicate preflight",
          )

          formal_gate_call = '''  if [[ "${RUN_CLASS}" == "formal" ]]; then
            require_registered_ready
            validate_registered_channel
          fi
          '''.replace("          ", "")
          runner = replace_once(runner, formal_gate_call, "", "remove obsolete formal launch gate call")

          gate_start = runner.find("\nrequire_registered_ready() {\n")
          prepare_start = runner.find("\nprepare() {\n", gate_start)
          if gate_start < 0 or prepare_start < 0:
              raise SystemExit("obsolete registration/channel function block not found")
          runner = runner[:gate_start] + runner[prepare_start:]

          provenance_old = '''import json
          from pathlib import Path
          value = {
              "schema_version": 1,
              "run_id": "${RUN_ID}",
              "source_commit": "${EXPECTED_COMMIT}",
              "model_repo": "${MODEL_REPO}",
              "model_revision": "${MODEL_REVISION}",
          '''.replace("          ", "")
          provenance_new = '''import json
          from pathlib import Path
          from drpo.e8_multitask_exp_tuning import load_config
          config = load_config(Path("${CONFIG_PATH}"))
          value = {
              "schema_version": 1,
              "run_id": "${RUN_ID}",
              "source_commit": "${EXPECTED_COMMIT}",
              "model_repo": config["model"]["base_model"],
              "model_revision": config["model"]["revision"],
          '''.replace("          ", "")
          runner = replace_once(runner, provenance_old, provenance_new, "repair source provenance model identity")
          if "${MODEL_REPO}" in runner or "${MODEL_REVISION}" in runner:
              raise SystemExit("deleted MODEL_REPO/MODEL_REVISION shell variables still have consumers")
          runner_path.write_text(runner, encoding="utf-8")

          # 2) Config scope: P0 is a parent identity, never a generic cold-start experiment ID.
          config_path = Path("src/drpo/e8_experiment_config.py")
          config = config_path.read_text(encoding="utf-8")
          config = replace_once(
              config,
              '    if current_id in (RHO_EXPERIMENT_ID, DENSE_EXPERIMENT_ID):\n        raise ValueError("RHO/DENSE historical IDs may not be reused for cold-start")\n',
              '    if current_id in (P0_EXPERIMENT_ID, RHO_EXPERIMENT_ID, DENSE_EXPERIMENT_ID):\n        raise ValueError("P0/RHO/DENSE experiment IDs may not be reused for cold-start")\n',
              "close P0 experiment-ID collision",
          )
          config_path.write_text(config, encoding="utf-8")

          # 3) Runtime propagation: preserve canonical positive-ratio semantics, but when
          # reviewed config explicitly requests warmup_ratio=0, override the legacy
          # max(1, ...) interface so the scheduler actually receives zero warmup steps.
          tuning_path = Path("src/drpo/e8_multitask_exp_tuning.py")
          tuning = tuning_path.read_text(encoding="utf-8")
          tuning = replace_once(
              tuning,
              '    original_generate_outputs = arena.generate_outputs\n    contract = _runtime_bridge_contract(effective)\n',
              '    original_generate_outputs = arena.generate_outputs\n    original_get_cosine_schedule_with_warmup = arena.get_cosine_schedule_with_warmup\n    contract = _runtime_bridge_contract(effective)\n',
              "capture scheduler interface",
          )
          scheduler_anchor = '''    arena.LoraConfig = configured_lora_config
              arena.load_model = configured_load_model
              arena.generate_outputs = configured_generate_outputs
          '''.replace("              ", "    ")
          scheduler_replacement = '''    def configured_get_cosine_schedule_with_warmup(
                  optimizer: Any,
                  num_warmup_steps: int,
                  num_training_steps: int,
                  *args: Any,
                  **kwargs: Any,
              ) -> Any:
                  if float(effective["training"]["warmup_ratio"]) == 0.0:
                      num_warmup_steps = 0
                  return original_get_cosine_schedule_with_warmup(
                      optimizer,
                      num_warmup_steps,
                      num_training_steps,
                      *args,
                      **kwargs,
                  )

              arena.LoraConfig = configured_lora_config
              arena.load_model = configured_load_model
              arena.generate_outputs = configured_generate_outputs
              arena.get_cosine_schedule_with_warmup = configured_get_cosine_schedule_with_warmup
          '''.replace("              ", "    ")
          tuning = replace_once(tuning, scheduler_anchor, scheduler_replacement, "install zero-warmup adapter")
          tuning = replace_once(
              tuning,
              '        arena.generate_outputs = original_generate_outputs\n',
              '        arena.generate_outputs = original_generate_outputs\n        arena.get_cosine_schedule_with_warmup = original_get_cosine_schedule_with_warmup\n',
              "restore scheduler interface",
          )
          tuning_path.write_text(tuning, encoding="utf-8")

          # 4) Regression coverage for each audited gap.
          tests_path = Path("tests/test_e8_multitask_p0.py")
          tests = tests_path.read_text(encoding="utf-8")

          runner_assertions_old = '''    assert 'MODEL_REPO="' not in runner
              assert 'MODEL_REVISION="' not in runner
              assert 'model = preflight["model"]' in runner
          '''.replace("              ", "    ")
          runner_assertions_new = '''    assert 'MODEL_REPO="' not in runner
              assert 'MODEL_REVISION="' not in runner
              assert "${MODEL_REPO}" not in runner
              assert "${MODEL_REVISION}" not in runner
              assert "require_registered_ready" not in runner
              assert "validate_registered_channel" not in runner
              setup_source = runner.split("setup() {", 1)[1].split("\\nruntime_ready() {", 1)[0]
              assert setup_source.index("bootstrap_config_preflight") < setup_source.index(
                  "torch.cuda.is_available"
              )
              assert setup_source.index("bootstrap_config_preflight") < setup_source.index(
                  "pip install -r"
              )
              assert 'model = preflight["model"]' in runner
          '''.replace("              ", "    ")
          tests = replace_once(tests, runner_assertions_old, runner_assertions_new, "runner regression assertions")

          profile_marker = '''    dense["experiment_id"] = "GENERIC-DENSE-ID"
              with pytest.raises(ValueError, match="requires experiment_id"):
                  exp_tuning.validate_config(dense)
          '''.replace("              ", "    ")
          profile_replacement = '''    dense["experiment_id"] = "GENERIC-DENSE-ID"
              with pytest.raises(ValueError, match="requires experiment_id"):
                  exp_tuning.validate_config(dense)

              cold = exp_tuning.load_config(Path("configs/e8_multitask_exp_lambda_curve_completion.yaml"))
              cold["experiment_id"] = exp_tuning.P0_EXPERIMENT_ID
              with pytest.raises(ValueError, match="P0/RHO/DENSE"):
                  exp_tuning.validate_config(cold)
          '''.replace("              ", "    ")
          tests = replace_once(tests, profile_marker, profile_replacement, "P0 ID collision regression")

          warmup_test_start = tests.find("def test_legacy_runtime_bridge_forwards_configured_interface_values")
          warmup_test_end = tests.find("\ndef test_", warmup_test_start + 10)
          if warmup_test_start < 0 or warmup_test_end < 0:
              raise SystemExit("legacy runtime bridge test block not found")
          warmup = tests[warmup_test_start:warmup_test_end]
          warmup = replace_once(
              warmup,
              '            "optimizer_updates": 1500,\n            "weight_decay": 0.02,\n',
              '            "optimizer_updates": 1500,\n            "weight_decay": 0.02,\n            "warmup_ratio": 0.0,\n',
              "zero-warmup test config",
          )
          warmup = replace_once(
              warmup,
              '''    arena = SimpleNamespace(
                  LoraConfig=fake_lora_config,
                  load_model=fake_load_model,
                  generate_outputs=fake_generate_outputs,
              )
              '''.replace("              ", "    "),
              '''    def fake_get_cosine_schedule_with_warmup(
                  optimizer,
                  num_warmup_steps,
                  num_training_steps,
                  *args,
                  **kwargs,
              ):
                  del optimizer, args, kwargs
                  calls["scheduler"] = (num_warmup_steps, num_training_steps)
                  return "scheduler"

              arena = SimpleNamespace(
                  LoraConfig=fake_lora_config,
                  load_model=fake_load_model,
                  generate_outputs=fake_generate_outputs,
                  get_cosine_schedule_with_warmup=fake_get_cosine_schedule_with_warmup,
              )
              '''.replace("              ", "    "),
              "fake scheduler interface",
          )
          warmup = replace_once(
              warmup,
              '        scan_trainer.torch.optim.AdamW([], lr=5.0e-5, weight_decay=0.01)\n',
              '        scan_trainer.torch.optim.AdamW([], lr=5.0e-5, weight_decay=0.01)\n        arena.get_cosine_schedule_with_warmup("optimizer", 1, 1500)\n',
              "exercise scheduler adapter",
          )
          warmup = replace_once(
              warmup,
              '    assert calls["adamw"]["weight_decay"] == pytest.approx(0.02)\n',
              '    assert calls["adamw"]["weight_decay"] == pytest.approx(0.02)\n    assert calls["scheduler"] == (0, 1500)\n',
              "assert zero warmup",
          )
          warmup = replace_once(
              warmup,
              '    assert arena.generate_outputs is fake_generate_outputs\n',
              '    assert arena.generate_outputs is fake_generate_outputs\n    assert arena.get_cosine_schedule_with_warmup is fake_get_cosine_schedule_with_warmup\n',
              "assert scheduler restoration",
          )
          tests = tests[:warmup_test_start] + warmup + tests[warmup_test_end:]
          tests_path.write_text(tests, encoding="utf-8")

          # 5) Scope cleanup: #341 is the isolated owner-approved ancestry bugfix.
          # Keep #340 focused by restoring this workflow to the exact main/base version.
          import subprocess
          subprocess.run(
              ["git", "checkout", BASE, "--", ".github/workflows/code-change-budget.yml"],
              check=True,
          )
          PY

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Validate final correctness after-image
        run: |
          python -m py_compile \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh
          ruff check \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check
          git diff --exit-code "$BASE" -- .github/workflows/code-change-budget.yml

      - name: Commit fixes and self-remove
        run: |
          rm -f .github/workflows/e8-final-correctness-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(e8): close config-driven correctness gaps"
          git push origin HEAD:dev/e8-config-driven-sweep-01
