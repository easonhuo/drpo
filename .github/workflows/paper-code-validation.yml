name: Paper Code Validation

"on":
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q -e '.[dev]' -e 'paper_code[test]'

      - name: Test and lint
        run: |
          python -m pytest -q paper_code/tests
          python -m ruff check --line-length 100 paper_code/src paper_code/tests
          python -m ruff format --check --line-length 100 paper_code/src paper_code/tests

      - name: Build reviewer package
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path

          source = Path("paper_code")
          root = Path("dist/drpo-reference-v0.1")
          shutil.rmtree(root.parent, ignore_errors=True)
          shutil.copytree(source, root)
          shutil.make_archive(
              "dist/drpo-reference-v0.1",
              "zip",
              root_dir="dist",
              base_dir="drpo-reference-v0.1",
          )
          PY

      - name: Upload reviewer package
        uses: actions/upload-artifact@v4
        with:
          name: drpo-reference-v0.1
          path: dist/drpo-reference-v0.1.zip
