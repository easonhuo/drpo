name: Final Stage3 Stage5 authoritative history compatibility repair

on:
  push:
    branches:
      - fix/stage3-stage5-authoritative-history-compat-20260907

permissions:
  contents: write

jobs:
  repair-test-and-land-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: fix/stage3-stage5-authoritative-history-compat-20260907
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: python -m pip install pytest pyyaml ruff

      - name: Apply existing compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          set +e
          patch -p1 --forward < stage3_stage5_compat.patch
          patch_rc=$?
          set -e
          if [ "$patch_rc" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          reject = Path("scripts/handoff_delta_shadow.py.rej")
          if not reject.is_file():
              raise SystemExit("expected only the helper insertion hunk to be rejected")
          added = [
              line[1:]
              for line in reject.read_text(encoding="utf-8").splitlines()
              if line.startswith("+") and not line.startswith("+++")
          ]
          helper = "\n".join(added) + "\n"
          if "def first_parent_repository_commit_for_path(" not in helper:
              raise SystemExit("unexpected rejected hunk")
          script = Path("scripts/handoff_delta_shadow.py")
          text = script.read_text(encoding="utf-8")
          marker = "def authoritative_report_metadata("
          if "def first_parent_repository_commit_for_path(" not in text:
              index = text.index(marker)
              script.write_text(text[:index] + helper + text[index:], encoding="utf-8")
          reject.unlink()
          Path("scripts/handoff_delta_shadow.py.orig").unlink(missing_ok=True)
          PY
          fi

      - name: Align resolver with Stage5 integration semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          script = Path("scripts/handoff_delta_shadow.py")
          text = script.read_text(encoding="utf-8")
          start = text.index("def first_parent_repository_commit_for_path(")
          end = text.index("def authoritative_report_metadata(", start)
          replacement = textwrap.dedent('''\
          def first_parent_repository_commit_for_path(repo_root: Path, path: Path) -> str:
              """Map an authoritative path to its unique first-parent integration commit."""

              relative = path.resolve().relative_to(repo_root.resolve()).as_posix()
              touches = git_text(repo_root, "log", "--format=%H", "--", relative).splitlines()
              adds = git_text(
                  repo_root,
                  "log",
                  "--diff-filter=A",
                  "--format=%H",
                  "--",
                  relative,
              ).splitlines()
              if not touches:
                  raise HandoffDeltaError(
                      "authoritative path must have non-empty history: " + relative
                  )
              if len(adds) == 1:
                  first_add = adds[0]
              elif not adds:
                  first_add = touches[-1]
                  parents = git_text(
                      repo_root, "rev-list", "--parents", "-n", "1", first_add
                  ).split()
                  if len(parents) != 3:
                      raise HandoffDeltaError(
                          "authoritative path lacks a bounded two-parent merge origin: "
                          + relative
                      )
                  if git(
                      repo_root,
                      "cat-file",
                      "-e",
                      f"{parents[1]}:{relative}",
                      check=False,
                  ).returncode == 0:
                      raise HandoffDeltaError(
                          "authoritative path predates its merge-introduced origin: "
                          + relative
                      )
              else:
                  raise HandoffDeltaError(
                      "authoritative path has multiple addition commits: " + relative
                  )

              candidates: list[str] = []
              for commit in git_text(
                  repo_root, "rev-list", "--first-parent", "--reverse", "HEAD"
              ).splitlines():
                  if git(
                      repo_root,
                      "merge-base",
                      "--is-ancestor",
                      first_add,
                      commit,
                      check=False,
                  ).returncode != 0:
                      continue
                  if git(
                      repo_root,
                      "cat-file",
                      "-e",
                      f"{commit}:{relative}",
                      check=False,
                  ).returncode != 0:
                      continue
                  parents = git_text(
                      repo_root, "rev-list", "--parents", "-n", "1", commit
                  ).split()
                  if len(parents) < 2:
                      continue
                  if git(
                      repo_root,
                      "cat-file",
                      "-e",
                      f"{parents[1]}:{relative}",
                      check=False,
                  ).returncode == 0:
                      continue
                  candidates.append(commit)
              if len(candidates) != 1:
                  raise HandoffDeltaError(
                      "authoritative path must have exactly one first-parent integration: "
                      + relative
                  )
              return candidates[0]


          def verify_authoritative_path_unchanged_after_integration(
              repo_root: Path, path: Path, integration_commit: str
          ) -> None:
              """Reject every path touch that is not already integrated."""

              relative = path.resolve().relative_to(repo_root.resolve()).as_posix()
              touches = git_text(repo_root, "log", "--format=%H", "--", relative).splitlines()
              for touch in touches:
                  if git(
                      repo_root,
                      "merge-base",
                      "--is-ancestor",
                      touch,
                      integration_commit,
                      check=False,
                  ).returncode != 0:
                      raise HandoffDeltaError(
                          "authoritative delta/report changed after first-parent integration"
                      )
              if git_show_text(repo_root, integration_commit, relative) != path.read_text(
                  encoding="utf-8"
              ):
                  raise HandoffDeltaError(
                      "authoritative delta/report bytes differ from integration commit"
                  )


          ''')
          script.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Honor Stage5 legacy-inert quarantine in Stage3 observations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          script = Path("scripts/handoff_delta_shadow.py")
          text = script.read_text(encoding="utf-8")
          old = textwrap.dedent('''\
              records: list[dict[str, Any]] = []
              authoritative_verified = False
              for delta_path in sorted(root.glob(f"*/{DELTA_FILENAME}")):
                  delta = load_yaml(delta_path, "handoff delta")
                  if delta.get("schema_version") == AUTHORITATIVE_DELTA_SCHEMA_VERSION:
                      if authority_mode(repo_root) != "delta":
                          raise HandoffDeltaError(
                              "schema-v3 authoritative delta exists while authority mode is not delta"
                          )
                      if replay and not authoritative_verified:
                          verify_authoritative_state(repo_root)
                          authoritative_verified = True
                      report_meta = authoritative_report_metadata(repo_root, delta_path)
                      repository_commit = report_meta["repository_commit"]
          ''')
          new = textwrap.dedent('''\
              records: list[dict[str, Any]] = []
              authoritative_verified = False
              authority_payload: dict[str, Any] | None = None
              legacy_inert_update_ids: set[str] = set()
              for delta_path in sorted(root.glob(f"*/{DELTA_FILENAME}")):
                  delta = load_yaml(delta_path, "handoff delta")
                  if delta.get("schema_version") == AUTHORITATIVE_DELTA_SCHEMA_VERSION:
                      if authority_mode(repo_root) != "delta":
                          raise HandoffDeltaError(
                              "schema-v3 authoritative delta exists while authority mode is not delta"
                          )
                      report_path = delta_path.parent / AUTHORITY_REPORT_FILENAME
                      if (replay or not report_path.is_file()) and authority_payload is None:
                          authority_payload = verify_authoritative_state(repo_root)
                          authoritative_verified = True
                          raw_legacy_ids = authority_payload.get("legacy_inert_update_ids", [])
                          if not isinstance(raw_legacy_ids, list) or not all(
                              isinstance(value, str) for value in raw_legacy_ids
                          ):
                              raise HandoffDeltaError(
                                  "Stage 5 authority verifier returned invalid legacy_inert_update_ids"
                              )
                          legacy_inert_update_ids = set(raw_legacy_ids)
                      if delta.get("update_id") in legacy_inert_update_ids:
                          continue
                      if replay and not authoritative_verified:
                          authority_payload = verify_authoritative_state(repo_root)
                          authoritative_verified = True
                      report_meta = authoritative_report_metadata(repo_root, delta_path)
                      repository_commit = report_meta["repository_commit"]
          ''')
          if old not in text:
              raise SystemExit("observation_records target block not found")
          script.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_handoff_delta_shadow.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_observation_records_skips_stage5_legacy_inert_without_report"
          if marker not in tests:
              tests += textwrap.dedent('''\


              def test_observation_records_skips_stage5_legacy_inert_without_report(
                  tmp_path: Path, monkeypatch: pytest.MonkeyPatch
              ) -> None:
                  repo, _base = make_repo(tmp_path)
                  update_id = "TEST-LEGACY-INERT-V3"
                  delta_dir = repo / "docs/handoff_deltas" / update_id
                  delta_dir.mkdir(parents=True)
                  delta = delta_dir / MODULE.DELTA_FILENAME
                  delta.write_text(
                      "schema_version: 3\nupdate_id: TEST-LEGACY-INERT-V3\n",
                      encoding="utf-8",
                  )
                  git(repo, "add", delta.relative_to(repo).as_posix())
                  git(repo, "commit", "-m", "add inert v3 delta")

                  monkeypatch.setattr(MODULE, "authority_mode", lambda _repo: "delta")
                  monkeypatch.setattr(
                      MODULE,
                      "verify_authoritative_state",
                      lambda _repo: {
                          "status": "PASS",
                          "legacy_inert_update_ids": [update_id],
                      },
                  )

                  assert MODULE.observation_records(repo, replay=False) == []


              def test_observation_records_missing_unlisted_v3_report_fails_closed(
                  tmp_path: Path, monkeypatch: pytest.MonkeyPatch
              ) -> None:
                  repo, _base = make_repo(tmp_path)
                  update_id = "TEST-MISSING-V3-REPORT"
                  delta_dir = repo / "docs/handoff_deltas" / update_id
                  delta_dir.mkdir(parents=True)
                  delta = delta_dir / MODULE.DELTA_FILENAME
                  delta.write_text(
                      "schema_version: 3\nupdate_id: TEST-MISSING-V3-REPORT\n",
                      encoding="utf-8",
                  )
                  git(repo, "add", delta.relative_to(repo).as_posix())
                  git(repo, "commit", "-m", "add unlisted v3 delta")

                  monkeypatch.setattr(MODULE, "authority_mode", lambda _repo: "delta")
                  monkeypatch.setattr(
                      MODULE,
                      "verify_authoritative_state",
                      lambda _repo: {"status": "PASS", "legacy_inert_update_ids": []},
                  )

                  with pytest.raises(MODULE.HandoffDeltaError, match="materialization report"):
                      MODULE.observation_records(repo, replay=False)
              ''')
              test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Focused regression tests
        run: python -m pytest tests/test_handoff_delta_shadow.py -q

      - name: Current repository authority and Stage3 fast gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/handoff_authority.py verify --repo-root . --json
          python scripts/handoff_delta_shadow.py auto-check --repo-root .
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .

      - name: Changed-file lint and diff check
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check scripts/handoff_delta_shadow.py tests/test_handoff_delta_shadow.py
          git diff --check

      - name: Remove temporary repair carriers
        shell: bash
        run: |
          set -euo pipefail
          rm -f stage3_stage5_compat.patch
          rm -f .github/workflows/stage3-stage5-authoritative-history-compat-20260907.yml
          rm -f .github/workflows/stage3-stage5-authoritative-history-compat-final-20260907.yml

      - name: Commit tested repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "easonhuo"
          git config user.email "huoyusen1@126.com"
          git add -A
          git commit -m "Fix Stage3 Stage5 authoritative history compatibility"
          git push origin HEAD:fix/stage3-stage5-authoritative-history-compat-20260907
