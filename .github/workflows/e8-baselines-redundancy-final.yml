name: E8 baseline redundancy final cleanup

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-baselines-redundancy-final.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify reviewed refactor head
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet a930c9455b6072de4732651f26dcc5922b705ac6 HEAD -- \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_experiment_config.py \
            tests/test_e8_multitask_p0.py
      - name: Deduplicate plot/group mechanics and test config fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runner = Path('src/drpo/e8_multitask_exp_tuning.py')
          text = runner.read_text(encoding='utf-8')

          provenance_marker = 'def _coldstart_run_provenance(output_root: Path) -> tuple[str, str]:\n'
          if text.count(provenance_marker) != 1:
              raise RuntimeError('coldstart provenance marker drifted')
          helpers = '''def _coldstart_plot_metrics(row: Mapping[str, Any]) -> dict[str, Any]:\n    return {\n        "late_window_pass8_mean": row["late_window_pass8_mean"],\n        "late_window_greedy_mean": row["late_window_greedy_mean"],\n        "best_validation_pass8": row["best_pass8"],\n        "terminal_pass8": row["terminal_pass8"],\n        "best_validation_greedy": row["best_greedy"],\n        "terminal_greedy": row["terminal_greedy"],\n        "best_greedy_valid_rate": row["best_greedy_valid_rate"],\n        "terminal_greedy_valid_rate": row["terminal_greedy_valid_rate"],\n        "best_step": row["best_step"],\n        "terminal_step": row["terminal_step"],\n        "stop_reason": row["stop_reason"],\n        "nan_inf_failure": row["nan_inf_failure"],\n        "complete": True,\n    }\n\n\ndef _coldstart_group_metrics(group: Sequence[Mapping[str, Any]]) -> dict[str, Any]:\n    def mean(key: str) -> float:\n        return float(np.mean([float(row[key]) for row in group]))\n\n    return {\n        "seeds": sorted(int(row["seed"]) for row in group),\n        "late_window_pass8_mean": mean("late_window_pass8_mean"),\n        "late_window_greedy_mean": mean("late_window_greedy_mean"),\n        "terminal_pass8_mean": mean("terminal_pass8"),\n        "terminal_greedy_valid_rate_mean": mean("terminal_greedy_valid_rate"),\n        "nan_inf_failure": any(bool(row["nan_inf_failure"]) for row in group),\n    }\n\n\n'''
          text = text.replace(provenance_marker, helpers + provenance_marker, 1)

          task_start = text.index('def _write_coldstart_task_result(')
          task_end = text.index('\ndef _materialize_completed_coldstart_task_results(', task_start)
          block = text[task_start:task_end]
          plot_start = block.index('    plot_rows = [\n')
          plot_end = block.index('    _write_csv(plot_path, plot_rows)\n', plot_start)
          replacement = '''    plot_rows = [\n        {\n            "experiment_id": experiment_id(config),\n            "run_id": run_id,\n            "source_commit": source_commit,\n            "task": row["task"],\n            "method": row["method"],\n            "delta_v": row.get("delta_v"),\n            "beta": row.get("beta"),\n            "dpo_initialization": row.get("dpo_initialization"),\n            "lambda": row["lambda"],\n            "rho": row["rho"],\n            "seed": row["seed"],\n            "stage": row["stage"],\n            **_coldstart_plot_metrics(row),\n        }\n        for row in rows\n    ]\n'''
          block = block[:plot_start] + replacement + block[plot_end:]
          text = text[:task_start] + block + text[task_end:]

          unranked_start = text.index('def _aggregate_coldstart_unranked(')
          unranked_end = text.index('\ndef _aggregate_coldstart(', unranked_start)
          block = text[unranked_start:unranked_end]
          plot_start = block.index('    direct_fields = (\n')
          plot_end = block.index('    _write_csv(output_root / "aggregate" / "plot_curve_points.csv", plot_rows)\n', plot_start)
          replacement = '''    plot_rows = [\n        {\n            "task": row["task"],\n            "method": row["method"],\n            "dpo_initialization": row["dpo_initialization"],\n            "seed": row["seed"],\n            "stage": row["stage"],\n            "experiment_id": experiment_id(config),\n            "run_id": run_id,\n            "source_commit": source_commit,\n            parameter_name: row.get(parameter_name),\n            **_coldstart_plot_metrics(row),\n        }\n        for row in rows\n    ]\n'''
          block = block[:plot_start] + replacement + block[plot_end:]
          grouped_start = block.index('        grouped_curve = []\n')
          grouped_end = block.index('        summaries[task] = {\n', grouped_start)
          grouped = '''        grouped_curve = [\n            {\n                "task": task,\n                "method": method,\n                parameter_name: value,\n                **_coldstart_group_metrics(group),\n            }\n            for value, group in sorted(groups.items())\n        ]\n'''
          block = block[:grouped_start] + grouped + block[grouped_end:]
          text = text[:unranked_start] + block + text[unranked_end:]

          exp_start = text.index('def _aggregate_coldstart(')
          exp_end = text.index('\ndef cmd_aggregate(', exp_start)
          block = text[exp_start:exp_end]
          plot_start = block.index('    plot_rows: list[dict[str, Any]] = []\n')
          plot_end = block.index('    _write_csv(output_root / "aggregate" / "plot_curve_points.csv", plot_rows)\n', plot_start)
          replacement = '''    plot_rows = [\n        {\n            "experiment_id": experiment_id(config),\n            "run_id": run_id,\n            "source_commit": source_commit,\n            "task": row["task"],\n            "method": row["method"],\n            "lambda": row["lambda"],\n            "rho": row["rho"],\n            "seed": row["seed"],\n            "stage": row["stage"],\n            **_coldstart_plot_metrics(row),\n        }\n        for row in rows\n    ]\n'''
          block = block[:plot_start] + replacement + block[plot_end:]
          agg_start = block.index('        def aggregate_group(group: Sequence[Mapping[str, Any]]) -> dict[str, Any]:\n')
          agg_end = block.index('        coefficient_groups:', agg_start)
          aggregate_group = '''        def aggregate_group(group: Sequence[Mapping[str, Any]]) -> dict[str, Any]:\n            first = group[0]\n            return {\n                "task": task,\n                "method": first["method"],\n                "lambda": first["lambda"],\n                "rho": first["rho"],\n                **_coldstart_group_metrics(group),\n                "best_pass8_mean": float(\n                    np.mean([float(row["best_pass8"]) for row in group])\n                ),\n            }\n\n'''
          block = block[:agg_start] + aggregate_group + block[agg_end:]
          text = text[:exp_start] + block + text[exp_end:]
          runner.write_text(text, encoding='utf-8')

          tests = Path('tests/test_e8_multitask_p0.py')
          text = tests.read_text(encoding='utf-8')
          asym_start = text.index('def _asymre_capability_test_config() -> dict:\n')
          asym_end = text.index('\ndef test_asymre_capability_is_config_driven_and_identity_safe', asym_start)
          factory = '''def _method_capability_test_config(\n    *,\n    experiment_id: str,\n    method: str,\n    parameterization: str,\n    grid_field: str,\n    values: list[float],\n    formula: str,\n) -> dict:\n    config = copy.deepcopy(\n        yaml.safe_load(\n            Path("configs/e8_multitask_exp_lambda_curve_completion.yaml").read_text(\n                encoding="utf-8"\n            )\n        )\n    )\n    config["experiment_id"] = experiment_id\n    sweep = config["sweep"]\n    sweep["method"] = method\n    sweep["parameterization"] = parameterization\n    sweep.pop("task_lambda", None)\n    sweep[grid_field] = {task: [] for task in config["suite"]["tasks"]}\n    for task in config["suite"]["p0_tasks"]:\n        sweep[grid_field][task] = list(values)\n    sweep.update(\n        {\n            "countdown_seed_offsets": [],\n            "countdown_include_positive_only": False,\n            "include_global_endpoint": False,\n            "transfer_positive_only_seed_offsets": [],\n            "task_transfer_seed_offset": 4000,\n            "tuning_seed": 4000,\n            "expected_cells": 16,\n        }\n    )\n    config["execution"]["expected_waves"] = 1\n    config["canonical_coldstart"]["formula"] = formula\n    return config\n\n\ndef _asymre_capability_test_config() -> dict:\n    from drpo import e8_multitask_exp_tuning as exp_tuning\n\n    config = _method_capability_test_config(\n        experiment_id="DEV-E8-MULTITASK-ASYMRE-CAPABILITY-TEST",\n        method="asymre",\n        parameterization="asymre_delta_v",\n        grid_field="task_delta_v",\n        values=[-0.75, -0.25],\n        formula="A_equals_R_minus_delta_v",\n    )\n    exp_tuning.validate_config(config)\n    return config\n\n'''
          text = text[:asym_start] + factory + text[asym_end:]

          topr_start = text.index('def _topr_capability_test_config() -> dict:\n')
          topr_end = text.index('\ndef test_topr_capability_is_config_driven_and_identity_safe', topr_start)
          topr = '''def _topr_capability_test_config() -> dict:\n    from drpo import e8_multitask_exp_tuning as exp_tuning\n\n    config = _method_capability_test_config(\n        experiment_id="DEV-E8-MULTITASK-TOPR-CAPABILITY-TEST",\n        method="joint_fitted_reference_topr",\n        parameterization="joint_fitted_reference_beta_topr",\n        grid_field="task_beta",\n        values=[0.25, 1.0],\n        formula="joint_fitted_reference_beta_ratio_taper",\n    )\n    exp_tuning.validate_config(config)\n    return config\n\n'''
          text = text[:topr_start] + topr + text[topr_end:]

          dpo_start = text.index('def _dpo_capability_test_config(*, shared_sft: bool = False) -> dict:\n')
          dpo_end = text.index('\ndef test_dpo_capability_is_config_driven_and_excludes_countdown', dpo_start)
          dpo = '''def _dpo_capability_test_config(*, shared_sft: bool = False) -> dict:\n    from drpo import e8_multitask_exp_tuning as exp_tuning\n\n    config = _method_capability_test_config(\n        experiment_id=(\n            "DEV-E8-MULTITASK-DPO-SHARED-SFT-CAPABILITY-TEST"\n            if shared_sft\n            else "DEV-E8-MULTITASK-DPO-COLD-CAPABILITY-TEST"\n        ),\n        method="canonical_dpo",\n        parameterization="canonical_dpo_beta",\n        grid_field="task_beta",\n        values=[0.1, 1.0],\n        formula="canonical_sigmoid_dpo_frozen_initial_reference",\n    )\n    config["canonical_coldstart"].update(\n        {\n            "scientific_kernel": "historical_pr268_semantics_port_in_existing_multitask_runner",\n            "initialization": "config_driven_dpo_initial_policy_plus_exact_frozen_copy",\n            "countdown_entry": "disabled_no_countdown_dpo_cells",\n            "transfer_entry": "e8_multitask_exp_tuning._train_canonical_dpo_transfer_cell",\n        }\n    )\n    config["dpo"] = {\n        "initialization_mode": "shared_sft_adapter" if shared_sft else "base_model_fresh_lora",\n        "shared_sft_adapter_env": "E8_DPO_SHARED_SFT_ADAPTER" if shared_sft else None,\n        "policy_adapter": "default",\n        "reference_adapter": "reference",\n        "reference_role": "exact_frozen_initial_policy",\n        "copy_policy_to_reference_before_update_1": True,\n        "reference_trainable": False,\n        "label_smoothing": 0.0,\n        "sequence_log_probability": "full_completion_summed_log_probability",\n        "pair_aggregation": "mean_unique_negative_within_prompt_then_mean_prompts",\n        "initial_pair_margin_max_abs_tolerance": 1.0e-5,\n        "liveness_task": "word_sorting",\n        "liveness_beta": 0.1,\n    }\n    if shared_sft:\n        config["reference"]["checkpoint_kind"] = "exact_frozen_copy_of_initialized_policy"\n        config["initialization"].update(\n            {\n                "source": "shared_sft_adapter",\n                "external_adapter_allowed": True,\n                "deterministic_fresh_lora": False,\n            }\n        )\n    exp_tuning.validate_config(config)\n    return config\n\n'''
          text = text[:dpo_start] + dpo + text[dpo_end:]
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Install focused dependencies
        run: python -m pip install -q numpy pyyaml pytest torch ruff
      - name: Validate final cleanup
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check
          python - <<'PY'
          import inspect
          from drpo import e8_multitask_exp_tuning as module
          assert '_coldstart_plot_metrics' in inspect.getsource(module._aggregate_coldstart)
          assert '_coldstart_plot_metrics' in inspect.getsource(module._aggregate_coldstart_unranked)
          assert '_coldstart_group_metrics' in inspect.getsource(module._aggregate_coldstart)
          assert '_coldstart_group_metrics' in inspect.getsource(module._aggregate_coldstart_unranked)
          dpo = inspect.getsource(module._train_canonical_dpo_transfer_cell)
          assert 'F.softplus(-logits)' in dpo
          assert 'full_sequence_log_probability' in dpo
          PY
          ruff check src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py --output-format concise > /tmp/ruff.txt 2>&1 || true
          cat /tmp/ruff.txt
      - name: Report reduction
        run: |
          git diff --numstat a930c9455b6072de4732651f26dcc5922b705ac6 -- \
            src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git diff --numstat 8a21fd16e63ea96a0cde2a477353d24562624655 -- \
            src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
      - name: Commit validated cleanup and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/e8-baselines-redundancy-final.yml
          git add src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git diff --cached --check
          git commit -m 'refactor: compact E8 result plumbing and test fixtures'
          git push origin HEAD:dev/e8-multitask-baselines-capability-01
