name: Temporary E8 launch semantics timestamp closure v4

on:
  push:
    branches: [dev/e8-multitask-baselines-capability-01]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install validation dependencies
        run: python -m pip install pyyaml pytest ruff numpy
      - name: Execute already-validated closure with force-clean temp removal
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/tmp_e8_launch_semantics_timestamp_closure.sh')
          text = path.read_text(encoding='utf-8')
          old_eof = "path.write_text(text.rstrip() + block + '\\n', encoding='utf-8')"
          new_eof = "path.write_text(text.rstrip() + block.rstrip() + '\\n', encoding='utf-8')"
          if text.count(old_eof) != 1:
              raise SystemExit(f'EOF normalization anchor count={text.count(old_eof)}')
          text = text.replace(old_eof, new_eof, 1)
          old_cleanup = "git rm .github/workflows/tmp_e8_launch_semantics_timestamp_closure.yml .github/workflows/tmp_e8_launch_semantics_timestamp_closure.sh .github/workflows/tmp_e8_launch_semantics_timestamp_closure_v2.yml\n"
          new_cleanup = "git rm -f .github/workflows/tmp_e8_launch_semantics_timestamp_closure.yml .github/workflows/tmp_e8_launch_semantics_timestamp_closure.sh .github/workflows/tmp_e8_launch_semantics_timestamp_closure_v2.yml .github/workflows/tmp_e8_launch_semantics_timestamp_closure_v3.yml .github/workflows/tmp_e8_launch_semantics_timestamp_closure_v4.yml\n"
          if text.count(old_cleanup) != 1:
              raise SystemExit(f'cleanup anchor count={text.count(old_cleanup)}')
          path.write_text(text.replace(old_cleanup, new_cleanup, 1), encoding='utf-8')
          PY
          bash .github/workflows/tmp_e8_launch_semantics_timestamp_closure.sh
