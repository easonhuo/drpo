name: tmp-e8-protocol-fix
on:
  push:
    branches: [dev/e8-multitask-baselines-capability-01]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - name: Verify retry base
        run: test "$(git rev-parse HEAD^)" = "8c5b4c49311075dfdfee0447a128f3c51e42b45c"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Reapply reviewed implementation patch
        run: |
          set -euo pipefail
          git show 9977772a49369fdf12049240d7b82fa789cb9017:.github/workflows/tmp_e8_protocol_fix.yml | awk '
            /- name: Patch implementation and tests/ {seen=1; next}
            seen && /run: \|/ {body=1; next}
            body && /^      - name: Install/ {exit}
            body {sub(/^          /, ""); print}
          ' > /tmp/e8_patch.sh
          bash /tmp/e8_patch.sh
      - name: Reapply seed-barrier isolation patch
        run: |
          set -euo pipefail
          git show 8c5b4c49311075dfdfee0447a128f3c51e42b45c:.github/workflows/tmp_e8_protocol_fix.yml | awk '
            /- name: Isolate seed barrier from historical dynamic queue/ {seen=1; next}
            seen && /run: \|/ {body=1; next}
            body && /^      - name: Install/ {exit}
            body {sub(/^          /, ""); print}
          ' > /tmp/e8_barrier_patch.sh
          bash /tmp/e8_barrier_patch.sh
      - name: Install
        run: python -m pip install -e . pytest ruff
      - name: Validate historical refill repeatedly
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            pytest -q tests/test_e8_multitask_p0.py::test_exp_coldstart_scheduler_refills_without_nominal_batch_barriers
          done
      - name: Full validation
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          pytest -q tests/test_e8_multitask_p0.py
          ruff check src/drpo/e8_experiment_config.py tests/test_e8_multitask_p0.py
          ruff check src/drpo/e8_multitask_exp_tuning.py --ignore BLE001,B023
          git diff --check
          python - <<'PY'
          import inspect
          from drpo import e8_multitask_exp_tuning as e
          source = inspect.getsource(e._train_canonical_dpo_transfer_cell)
          required = (
              "full_sequence_log_probability",
              "policy_chosen[row_index]",
              "- policy_rejected",
              "- reference_chosen[row_index]",
              "+ reference_rejected",
              "F.softplus(-logits)",
              "_dpo_prompt_balanced_mean",
              "reference_terminal_sha256 != reference_initial_sha256",
              '"label_smoothing": 0.0',
          )
          for fragment in required:
              assert fragment in source, fragment
          print("CANONICAL_DPO_PR268_SEMANTICS_PRESERVED")
          PY
          rm -rf /tmp/e8-plan
          python -m drpo.e8_multitask_exp_tuning --config configs/e8_multitask_baseline_matrix_formal.yaml --output-root /tmp/e8-plan plan > /tmp/plan.json
          python - <<'PY'
          import json
          x = json.load(open("/tmp/plan.json"))
          assert x["cell_count"] == 176
          assert x["wave_count"] == 12
          assert x["wave_sizes"] == [16, 16, 16, 16, 16, 8] * 2
          assert x["seed_batch_order"] == [4000, 5000]
          assert x["seed_batch_barriers"] is True
          assert x["execution_class"] == "formal"
          assert {row["seed"] for row in x["rows"][:88]} == {4000}
          assert {row["seed"] for row in x["rows"][88:]} == {5000}
          PY
      - name: Commit validated implementation
        run: |
          git add src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git diff --cached --check
          git commit -m "fix: enforce E8 formal seed and terminal protocol"
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/tmp_e8_protocol_fix.yml
          git commit -m "chore: remove temporary E8 protocol workflow"
      - name: Push
        run: git push origin HEAD:dev/e8-multitask-baselines-capability-01
