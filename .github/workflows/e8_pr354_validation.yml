name: E8 PR354 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/drpo/e8_multitask_orchestration.py"
      - "tests/test_e8_method_integration_contract.sh"
      - ".github/workflows/e8_pr354_validation.yml"

jobs:
  method-integration-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run E8 method integration contract
        run: bash tests/test_e8_method_integration_contract.sh
