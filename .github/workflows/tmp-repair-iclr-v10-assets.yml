name: TEMP repair ICLR V10 bibliography and PDF containers

on:
  push:
    branches:
      - dev/manuscript-iclr2027-v10-clean-01

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: dev/manuscript-iclr2027-v10-clean-01
      - name: Repair bibliography and damaged PDF containers
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qpdf

          BIB='paper/overleaf/missing_references.bib'
          if ! grep -q '^@.*{stojanovski2025reasoninggym,' "$BIB"; then
            cat >> "$BIB" <<'EOF'

@inproceedings{stojanovski2025reasoninggym,
  author    = {Zafir Stojanovski and Oliver Stanley and Joe Sharratt and
               Richard Jones and Abdulhakeem Adefioye and Jean Kaddour and
               Andreas K{\"o}pf},
  title     = {{REASONING GYM}: Reasoning Environments for Reinforcement
               Learning with Verifiable Rewards},
  booktitle = {Advances in Neural Information Processing Systems},
  volume    = {38},
  year      = {2025},
  note      = {Datasets and Benchmarks Track},
  doi       = {10.52202/085713-1913}
}
EOF
          fi

          if ! grep -q '^@.*{zhong2017seq2sql,' "$BIB"; then
            cat >> "$BIB" <<'EOF'

@article{zhong2017seq2sql,
  author  = {Victor Zhong and Caiming Xiong and Richard Socher},
  title   = {{Seq2SQL}: Generating Structured Queries from Natural Language
             using Reinforcement Learning},
  journal = {CoRR},
  volume  = {abs/1709.00103},
  year    = {2017}
}
EOF
          fi

          candidates=(
            'paper/overleaf/figures/fig_app_d4rl9_gradient_panels.pdf'
            'paper/overleaf/figures/fig_app_structured9_gradient_panels.pdf'
          )
          for f in "${candidates[@]}"; do
            echo "=== qpdf precheck: $f ==="
            set +e
            qpdf --check "$f"
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              tmp="${f%.pdf}.normalized.pdf"
              echo "Normalizing damaged PDF container: $f"
              qpdf --warning-exit-0 --stream-data=preserve --object-streams=preserve "$f" "$tmp"
              mv "$tmp" "$f"
            fi
            echo "=== qpdf postcheck: $f ==="
            qpdf --check "$f"
          done

          qpdf --check paper/overleaf/figures/fig_app_structured9_drpo_coefficient_response.pdf
          git diff --check
          echo '--- diff stat before commit ---'
          git diff --stat

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-repair-iclr-v10-assets.yml
          git add paper/overleaf/missing_references.bib \
                  paper/overleaf/figures/fig_app_d4rl9_gradient_panels.pdf \
                  paper/overleaf/figures/fig_app_structured9_gradient_panels.pdf
          git diff --cached --check
          git commit -m 'paper: repair ICLR bibliography and gradient PDF containers'
          git push origin HEAD:dev/manuscript-iclr2027-v10-clean-01
