name: TEMP repair ICLR V10 bibliography and PDF containers

on:
  push:
    branches:
      - dev/manuscript-iclr2027-v10-clean-01

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: dev/manuscript-iclr2027-v10-clean-01
      - name: Repair bibliography and regenerate structured-gradient PDF
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qpdf python3-numpy python3-matplotlib

          BIB='paper/overleaf/missing_references.bib'
          if ! grep -q '^@.*{stojanovski2025reasoninggym,' "$BIB"; then
            printf '%s\n' \
              '' \
              '@inproceedings{stojanovski2025reasoninggym,' \
              '  author    = {Zafir Stojanovski and Oliver Stanley and Joe Sharratt and' \
              '               Richard Jones and Abdulhakeem Adefioye and Jean Kaddour and' \
              '               Andreas K{\"o}pf},' \
              '  title     = {{REASONING GYM}: Reasoning Environments for Reinforcement' \
              '               Learning with Verifiable Rewards},' \
              '  booktitle = {Advances in Neural Information Processing Systems},' \
              '  volume    = {38},' \
              '  year      = {2025},' \
              '  note      = {Datasets and Benchmarks Track},' \
              '  doi       = {10.52202/085713-1913}' \
              '}' >> "$BIB"
          fi

          if ! grep -q '^@.*{zhong2017seq2sql,' "$BIB"; then
            printf '%s\n' \
              '' \
              '@article{zhong2017seq2sql,' \
              '  author  = {Victor Zhong and Caiming Xiong and Richard Socher},' \
              '  title   = {{Seq2SQL}: Generating Structured Queries from Natural Language' \
              '             using Reinforcement Learning},' \
              '  journal = {CoRR},' \
              '  volume  = {abs/1709.00103},' \
              '  year    = {2017}' \
              '}' >> "$BIB"
          fi

          echo '=== D4RL gradient PDF check ==='
          qpdf --check paper/overleaf/figures/fig_app_d4rl9_gradient_panels.pdf

          echo '=== regenerate structured-gradient figure from canonical main plotting source ==='
          git fetch --depth=1 origin main:refs/remotes/origin/main
          git worktree add --detach /tmp/drpo-main origin/main
          python3 /tmp/drpo-main/scripts/figures/plot_e8_multitask_countdown_nine_panel.py \
            --output-png /tmp/structured9.png \
            --output-pdf /tmp/structured9.pdf \
            --output-svg /tmp/structured9.svg
          qpdf --check /tmp/structured9.pdf
          cp /tmp/structured9.pdf paper/overleaf/figures/fig_app_structured9_gradient_panels.pdf
          qpdf --check paper/overleaf/figures/fig_app_structured9_gradient_panels.pdf

          echo '=== coefficient placeholder PDF check ==='
          qpdf --check paper/overleaf/figures/fig_app_structured9_drpo_coefficient_response.pdf
          git diff --check
          echo '--- diff stat before commit ---'
          git diff --stat

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-repair-iclr-v10-assets.yml
          git add paper/overleaf/missing_references.bib \
                  paper/overleaf/figures/fig_app_structured9_gradient_panels.pdf
          git diff --cached --check
          git commit -m 'paper: repair ICLR bibliography and structured gradient figure'
          git push origin HEAD:dev/manuscript-iclr2027-v10-clean-01
