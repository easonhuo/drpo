name: Temporary lambda completion launcher fix2

on:
  push:
    branches:
      - dev/e8-multitask-lambda-completion-clean-02

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-lambda-completion-clean-02
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply repaired launcher payload
        run: |
          python - <<'PY'
          import subprocess
          old = subprocess.check_output(
              ['git', 'show', 'abd4ea4cba9cb5ab2d78914f35087550e4486149:.github/workflows/tmp-e8-lambda-launch-fix.yml'],
              text=True,
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Install"
          start = old.index(start_marker) + len(start_marker)
          end = old.index(end_marker, start)
          lines = old[start:end].splitlines()
          payload = "\n".join(line[10:] if line.startswith('          ') else line for line in lines) + "\n"
          payload = payload.replace('assert count == 2, count', 'assert count == 3, count')
          exec(compile(payload, '<launcher-payload>', 'exec'), {})
          PY
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile and shell syntax
        run: |
          python -m compileall -q src tests
          bash -n scripts/run_e8_multitask_exp_coldstart.sh scripts/run_e8_multitask_exp_lambda_completion.sh
      - name: Targeted tests
        run: >-
          python -m pytest -q tests/test_e8_multitask_p0.py
          -k 'lambda_completion or lambda_only_canonical_transport_is_exactly_equivalent or exp_coldstart_matrix_is_208_cells_in_13_hard_waves'
      - name: Full multitask test file
        run: python -m pytest -q tests/test_e8_multitask_p0.py
      - name: Fatal Ruff
        run: ruff check --select E9,F63,F7,F82 src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
      - name: Scientific-core identity gate
        run: |
          git diff --quiet 5260ca58ecb67509838a1e5480f6dcaafdb7a773 -- \
            src/drpo/countdown_qwen_arena_onefile.py \
            src/drpo/countdown_e8_alpha1_c_scan_common.py \
            src/drpo/countdown_e8_alpha1_c_scan_runtime.py \
            src/drpo/countdown_e8_alpha1_c_scan_trainer.py \
            src/drpo/countdown_e8_alpha1_highc_scan_common.py \
            src/drpo/countdown_e8_alpha1_highc_scan_runtime.py
      - name: Config-only successor facts gate
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          text = Path('src/drpo/e8_multitask_exp_tuning.py').read_text(encoding='utf-8')
          tree = ast.parse(text)
          literals = {str(node.value) for node in ast.walk(tree) if isinstance(node, ast.Constant)}
          assert '8000' not in literals and '9000' not in literals
          for value in ('34.538776395', '11.5', '40.0', '30.0', '26.0'):
              assert value not in text
          PY
      - name: Commit validated launcher support
        run: |
          rm .github/workflows/tmp-e8-lambda-launch-fix2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configs/e8_multitask_exp_lambda_completion.yaml src/drpo/e8_multitask_exp_tuning.py scripts/run_e8_multitask_exp_coldstart.sh scripts/run_e8_multitask_exp_lambda_completion.sh .github/workflows/tmp-e8-lambda-launch-fix2.yml
          git commit -m 'E8: add config-driven successor launch support'
          git push origin HEAD:dev/e8-multitask-lambda-completion-clean-02
