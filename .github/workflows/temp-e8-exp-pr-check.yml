name: TEMP E8 Exp PR validation

on:
  pull_request:
    branches:
      - dev/e8-multitask-p0-01
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-exp-tuning-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct exact leakage-safe source and targeted tests
        shell: bash
        run: |
          set -euo pipefail
          transport_dir=.github/e8-exp-source
          printf '%s  %s\n' '976eebc09d9b31968dbe41dff0290d21b3288facf47095a687de434bf8fa37ff' "$transport_dir/e8_multitask_exp_tuning.py.gz.b64.part00" | sha256sum --check --strict
          printf '%s  %s\n' 'c225907f1277b05461084441232155bbbe7dfdb3be96a91a58d8c89e6e89aa4c' "$transport_dir/e8_multitask_exp_tuning.py.gz.b64.part01" | sha256sum --check --strict
          printf '%s  %s\n' '595a7c05eaa53b1f415dd1bd08744fd7a7febe66f7fd6c60e9dba15bb562dcf4' "$transport_dir/e8_multitask_exp_tuning.py.gz.b64.part02a" | sha256sum --check --strict
          printf '%s  %s\n' 'abe02e2dfa5aff36cc3b5cc4900294b74ad6d64a7a8a0dff85c5863eba425f32' "$transport_dir/e8_multitask_exp_tuning.py.gz.b64.part02b" | sha256sum --check --strict
          printf '%s  %s\n' '1de1250cbc797d0c3550caab8afc0b476e2fb695409777ffaa54d09ce02ad279' "$transport_dir/e8_multitask_exp_tuning.py.gz.b64.part02c" | sha256sum --check --strict
          printf '%s  %s\n' '55835aff64116978a22ea7a72bd366df4ea4d249b47bca8b0eb1550c739faf86' "$transport_dir/e8_multitask_exp_tuning.py.gz.b64.part03" | sha256sum --check --strict
          printf '%s  %s\n' 'cf7ddd5f8ac0ccf852283b49e8cca92f2a54dd20452ef6d0f52df5877182d966' "$transport_dir/e8_multitask_exp_tuning.py.gz.b64.part04" | sha256sum --check --strict
          cat \
            "$transport_dir/e8_multitask_exp_tuning.py.gz.b64.part00" \
            "$transport_dir/e8_multitask_exp_tuning.py.gz.b64.part01" \
            "$transport_dir/e8_multitask_exp_tuning.py.gz.b64.part02a" \
            "$transport_dir/e8_multitask_exp_tuning.py.gz.b64.part02b" \
            "$transport_dir/e8_multitask_exp_tuning.py.gz.b64.part02c" \
            "$transport_dir/e8_multitask_exp_tuning.py.gz.b64.part03" \
            "$transport_dir/e8_multitask_exp_tuning.py.gz.b64.part04" \
            | base64 --decode > /tmp/e8_multitask_exp_tuning.py.gz
          printf '%s  %s\n' \
            'cd206ca89e66938c280579b6748fd9c2d00b86d398c12d1245aba3aecbc2bae6' \
            '/tmp/e8_multitask_exp_tuning.py.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/e8_multitask_exp_tuning.py.gz > /tmp/e8_multitask_exp_tuning.py
          printf '%s  %s\n' \
            '4fb580228e1832f6f04f47cf28ff4fdca665698dc435bb3ebd1a655eefa564c4' \
            '/tmp/e8_multitask_exp_tuning.py' | sha256sum --check --strict
          test "$(wc -l < /tmp/e8_multitask_exp_tuning.py)" -eq 2370
          python -m py_compile /tmp/e8_multitask_exp_tuning.py
          install -m 0644 /tmp/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_exp_tuning.py
          marker='def test_exp_tuning_matrix_has_one_positive_and_seven_exp_per_task'
          if ! grep -q "$marker" tests/test_e8_multitask_p0.py; then
            cat .github/e8-exp-source/test_e8_multitask_exp_append.txt \
              >> tests/test_e8_multitask_p0.py
          fi
          grep -q "$marker" tests/test_e8_multitask_p0.py

      - name: Install project test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate reconstructed branch state
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          python -m ruff format --check \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          python -m py_compile \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_tuning.sh
          tmp_dir="$(mktemp -d)"
          scripts/run_e8_multitask_exp_tuning.sh \
            --output-root "$tmp_dir/output" \
            plan > "$tmp_dir/plan_stdout.json"
          python - "$tmp_dir/output/plan.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          plan = json.loads(Path(sys.argv[1]).read_text())
          assert plan['cell_count'] == 72
          assert plan['wave_sizes'] == [16, 16, 13, 16, 11]
          assert sum(row['method'] == 'positive_only' for row in plan['rows']) == 9
          assert sum(row['method'] == 'exponential' for row in plan['rows']) == 63
          PY
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check

      - name: Commit exact validated source and tests
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          if git diff --cached --quiet; then
            echo 'Exact source and targeted tests already committed.'
            exit 0
          fi
          git commit -m 'EXT-C-E8-MULTITASK-EXP-TUNING-01: install validated implementation'
          git push origin "HEAD:${HEAD_BRANCH}"
