name: TEMP E8 Exp PR validation

on:
  pull_request:
    branches:
      - dev/e8-multitask-p0-01
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-exp-tuning-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct exact leakage-safe source and targeted tests
        shell: bash
        run: |
          set -euo pipefail
          gzip_file=.github/e8-exp-source/e8_multitask_exp_tuning.py.gz
          printf '%s  %s\n' \
            'cd206ca89e66938c280579b6748fd9c2d00b86d398c12d1245aba3aecbc2bae6' \
            "$gzip_file" | sha256sum --check --strict
          gzip --decompress --stdout "$gzip_file" > /tmp/e8_multitask_exp_tuning.py
          printf '%s  %s\n' \
            '4fb580228e1832f6f04f47cf28ff4fdca665698dc435bb3ebd1a655eefa564c4' \
            '/tmp/e8_multitask_exp_tuning.py' | sha256sum --check --strict
          test "$(wc -l < /tmp/e8_multitask_exp_tuning.py)" -eq 2370
          python -m py_compile /tmp/e8_multitask_exp_tuning.py
          install -m 0644 /tmp/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_exp_tuning.py
          marker='def test_exp_tuning_matrix_has_one_positive_and_seven_exp_per_task'
          if ! grep -q "$marker" tests/test_e8_multitask_p0.py; then
            cat .github/e8-exp-source/test_e8_multitask_exp_append.txt \
              >> tests/test_e8_multitask_p0.py
          fi
          grep -q "$marker" tests/test_e8_multitask_p0.py

      - name: Install project test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate reconstructed branch state
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          python -m ruff format --check \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          python -m py_compile \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_tuning.sh
          tmp_dir="$(mktemp -d)"
          scripts/run_e8_multitask_exp_tuning.sh \
            --output-root "$tmp_dir/output" \
            plan > "$tmp_dir/plan_stdout.json"
          python - "$tmp_dir/output/plan.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          plan = json.loads(Path(sys.argv[1]).read_text())
          assert plan['cell_count'] == 72
          assert plan['wave_sizes'] == [16, 16, 13, 16, 11]
          assert sum(row['method'] == 'positive_only' for row in plan['rows']) == 9
          assert sum(row['method'] == 'exponential' for row in plan['rows']) == 63
          PY
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check

      - name: Commit exact validated source and tests
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          if git diff --cached --quiet; then
            echo 'Exact source and targeted tests already committed.'
            exit 0
          fi
          git commit -m 'EXT-C-E8-MULTITASK-EXP-TUNING-01: install validated implementation'
          git push origin "HEAD:${HEAD_BRANCH}"
