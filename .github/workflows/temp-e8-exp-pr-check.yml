name: TEMP E8 Exp PR validation

on:
  pull_request:
    branches:
      - dev/e8-multitask-p0-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-exp-tuning-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate current committed branch state
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check src/drpo/e8_multitask_exp_tuning.py
          python -m ruff format --check src/drpo/e8_multitask_exp_tuning.py
          python -m py_compile src/drpo/e8_multitask_exp_tuning.py
          bash -n scripts/run_e8_multitask_exp_tuning.sh
          tmp_dir="$(mktemp -d)"
          scripts/run_e8_multitask_exp_tuning.sh \
            --output-root "$tmp_dir/output" \
            plan > "$tmp_dir/plan_stdout.json"
          python - "$tmp_dir/output/plan.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          plan = json.loads(Path(sys.argv[1]).read_text())
          assert plan['cell_count'] == 72
          assert plan['wave_sizes'] == [16, 16, 13, 16, 11]
          assert sum(row['method'] == 'positive_only' for row in plan['rows']) == 9
          PY
          if grep -q 'def test_exp_tuning_matrix_has_one_positive_and_seven_exp_per_task' \
            tests/test_e8_multitask_p0.py; then
            python -m ruff check tests/test_e8_multitask_p0.py
            python -m ruff format --check tests/test_e8_multitask_p0.py
            python -m pytest -q tests/test_e8_multitask_p0.py
          else
            echo 'Targeted test append has not been committed yet.'
            exit 1
          fi
          git diff --check
