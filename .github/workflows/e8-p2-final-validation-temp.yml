name: E8 P2 Final Validation (temporary)

on:
  push:
    branches:
      - dev/e8-multitask-training-splits-01
    paths:
      - .github/workflows/e8-p2-final-validation-temp.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Compile exact head
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_selftest.py \
            src/drpo/e8_multitask_warmstart_training.py

      - name: Focused E8 regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_e8_multitask_p0.py -q
          bash tests/test_e8_method_integration_contract.sh

      - name: Full pytest
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Ruff split surfaces
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_selftest.py \
            src/drpo/e8_multitask_warmstart_training.py

      - name: Remove temporary workflow after success
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/e8-p2-final-validation-temp.yml
          git config user.name 'drpo-p2-validation-bot'
          git config user.email 'drpo-p2-validation-bot@users.noreply.github.com'
          git commit -m 'chore: remove temporary P2 validation workflow'
          git push origin HEAD:dev/e8-multitask-training-splits-01
