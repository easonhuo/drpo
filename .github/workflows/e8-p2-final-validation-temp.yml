name: E8 P2 Final Validation (temporary)

on:
  push:
    branches:
      - dev/e8-multitask-training-splits-01
    paths:
      - .github/workflows/e8-p2-final-validation-temp.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Apply one-line Ruff correctness cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/drpo/e8_multitask_selftest.py")
          text = path.read_text(encoding="utf-8")
          old = '        raise RuntimeError("Engineering failure scheduler results are missing")\n'
          new = '        raise TypeError("Engineering failure scheduler results are missing")\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one scheduler-results RuntimeError, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Verify the two broad-suite failures already exist on the PR base
        shell: bash
        run: |
          set -euo pipefail
          base_sha=79009c487be6d64ef7f1d54b3f5dfa33808cc4c2
          base_dir="$RUNNER_TEMP/p2-base"
          git worktree add --detach "$base_dir" "$base_sha"
          set +e
          (
            cd "$base_dir"
            PYTHONPATH="$base_dir/src" python -m pytest -q \
              tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells \
              tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test
          ) >"$RUNNER_TEMP/base-known-failures.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/base-known-failures.log"
          test "$rc" -eq 1
          grep -Fq "test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells" "$RUNNER_TEMP/base-known-failures.log"
          grep -Fq "test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test" "$RUNNER_TEMP/base-known-failures.log"
          grep -Fq "2 failed" "$RUNNER_TEMP/base-known-failures.log"

      - name: Compile exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_selftest.py \
            src/drpo/e8_multitask_warmstart_training.py

      - name: Focused E8 regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_e8_multitask_p0.py -q
          bash tests/test_e8_method_integration_contract.sh

      - name: Broad pytest excluding only the two base-proven failures
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            --deselect=tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells \
            --deselect=tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test

      - name: Ruff split surfaces
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_selftest.py \
            src/drpo/e8_multitask_warmstart_training.py

      - name: Commit validated cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/e8-p2-final-validation-temp.yml
          git config user.name 'drpo-p2-validation-bot'
          git config user.email 'drpo-p2-validation-bot@users.noreply.github.com'
          git add src/drpo/e8_multitask_selftest.py
          git diff --cached --check
          git commit -m 'refactor: finish P2 validation cleanup'
          git push origin HEAD:dev/e8-multitask-training-splits-01
