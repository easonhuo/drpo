name: E8 multitask baseline capability final audit

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-multitask-baselines-final-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: python -m pip install -q numpy pyyaml pytest ruff torch
      - name: Compile modified Python
        run: >-
          python -m py_compile
          src/drpo/e8_experiment_config.py
          src/drpo/e8_multitask_exp_tuning.py
          tests/test_e8_multitask_p0.py
      - name: Focused multitask regression
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest -q tests/test_e8_multitask_p0.py
      - name: Canonical AsymRE TOPR regression except known main failure
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: >-
          python -m pytest -q
          tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py
          -k 'not asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells'
      - name: Confirm excluded canonical failure is pre-existing on exact main base
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/drpo-main 8a21fd16e63ea96a0cde2a477353d24562624655
          set +e
          PYTHONPATH=/tmp/drpo-main/src python -m pytest -q \
            /tmp/drpo-main/tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py \
            -k asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells \
            > /tmp/main-known-failure.log 2>&1
          main_rc=$?
          PYTHONPATH=${GITHUB_WORKSPACE}/src python -m pytest -q \
            tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py \
            -k asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells \
            > /tmp/target-known-failure.log 2>&1
          target_rc=$?
          set -e
          cat /tmp/main-known-failure.log
          cat /tmp/target-known-failure.log
          test "$main_rc" -eq 1
          test "$target_rc" -eq 1
          grep -q '0.050000000000000044' /tmp/main-known-failure.log
          grep -q '0.050000000000000044' /tmp/target-known-failure.log
          grep -q '1 failed' /tmp/main-known-failure.log
          grep -q '1 failed' /tmp/target-known-failure.log
      - name: Ruff changed Python
        run: >-
          ruff check
          src/drpo/e8_experiment_config.py
          src/drpo/e8_multitask_exp_tuning.py
          tests/test_e8_multitask_p0.py
      - name: Diff hygiene and scope audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 8a21fd16e63ea96a0cde2a477353d24562624655...HEAD
          changed="$(git diff --name-only 8a21fd16e63ea96a0cde2a477353d24562624655...HEAD | grep -v '^.github/workflows/e8-multitask-baselines-final-audit.yml$')"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 5
          printf '%s\n' "$changed" | grep -qx 'docs/scopes/E8_MULTITASK_ASYMRE_CAPABILITY_DEV.md'
          printf '%s\n' "$changed" | grep -qx 'docs/scopes/E8_MULTITASK_BASELINES_CAPABILITY_DEV.md'
          printf '%s\n' "$changed" | grep -qx 'src/drpo/e8_experiment_config.py'
          printf '%s\n' "$changed" | grep -qx 'src/drpo/e8_multitask_exp_tuning.py'
          printf '%s\n' "$changed" | grep -qx 'tests/test_e8_multitask_p0.py'
          ! printf '%s\n' "$changed" | grep -q '^.github/workflows/e8-multitask-baselines-'
