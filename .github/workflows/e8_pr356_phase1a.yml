name: E8 PR356 Inputs Split

on:
  push:
    branches:
      - dev/e8-multitask-inputs-split-01

permissions:
  contents: write

jobs:
  extract-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-inputs-split-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Extract Phase 1C safe input helpers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/drpo/e8_multitask_exp_tuning.py")
          target_path = Path("src/drpo/e8_multitask_inputs.py")
          source = source_path.read_text(encoding="utf-8")
          target = target_path.read_text(encoding="utf-8")

          if (
              "def _load_task_adapter_and_instances(" not in source
              and "def _task_base_config(" not in source
          ):
              raise SystemExit(0)

          if "import copy\n" not in target:
              target = target.replace("import json\n", "import copy\nimport json\n", 1)
          target = target.replace(
              "from drpo.e8_multitask_tasks import TaskInstance, stable_hash\n",
              "from drpo.e8_multitask_tasks import TaskInstance, build_adapters, stable_hash\n",
              1,
          )

          def extract(text: str, start_marker: str, end_marker: str):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[start:end].rstrip() + "\n", text[:start] + text[end:]

          config_block, source = extract(
              source,
              "def _leaf_values(",
              "\ndef _score_reference_candidates(",
          )
          adapter_block, source = extract(
              source,
              "def _load_task_adapter_and_instances(",
              "\ndef _canonical_environment_evaluator(",
          )
          target = (
              target.rstrip()
              + "\n\n\n"
              + config_block.rstrip()
              + "\n\n\n"
              + adapter_block.rstrip()
              + "\n"
          )

          source = source.replace(
              "    build_adapters,\n",
              "",
              1,
          )
          compat_anchor = "write_split_manifest = e8_inputs.write_split_manifest\n"
          compat_block = (
              "write_split_manifest = e8_inputs.write_split_manifest\n"
              "_leaf_values = e8_inputs._leaf_values\n"
              "_changed_leaf_paths = e8_inputs._changed_leaf_paths\n"
              "_atomic_yaml = e8_inputs._atomic_yaml\n"
              "_task_base_config = e8_inputs._task_base_config\n"
              "_task_grid_configs = e8_inputs._task_grid_configs\n"
              "_load_task_adapter_and_instances = e8_inputs._load_task_adapter_and_instances\n"
          )
          if compat_anchor not in source:
              raise SystemExit("missing input compatibility anchor for Phase 1C")
          source = source.replace(compat_anchor, compat_block, 1)

          target_path.write_text(target, encoding="utf-8")
          source_path.write_text(source, encoding="utf-8")
          PY
      - name: Static extraction assertions
        shell: bash
        run: |
          for name in _leaf_values _changed_leaf_paths _atomic_yaml _task_base_config _task_grid_configs _load_task_adapter_and_instances; do
            grep -q "^def ${name}" src/drpo/e8_multitask_inputs.py
            ! grep -q "^def ${name}" src/drpo/e8_multitask_exp_tuning.py
          done
          grep -q '^def _score_reference_candidates' src/drpo/e8_multitask_exp_tuning.py
          grep -q '^def _derive_reference_remoteness_banks' src/drpo/e8_multitask_exp_tuning.py
          grep -q '^def write_canonical_cold_inputs' src/drpo/e8_multitask_exp_tuning.py
      - name: Python compile
        run: python -m py_compile src/drpo/e8_multitask_inputs.py src/drpo/e8_multitask_exp_tuning.py
      - name: Focused E8 tests
        run: python -m pytest -q tests/test_e8_multitask_p0.py
      - name: Method integration contract
        run: bash tests/test_e8_method_integration_contract.sh
      - name: Ruff
        run: python -m ruff check src/drpo/e8_multitask_inputs.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
      - name: Commit validated extraction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No implementation diff to commit."
            exit 0
          fi
          git config user.name "easonhuo"
          git config user.email "huoyusen1@126.com"
          git add src/drpo/e8_multitask_inputs.py src/drpo/e8_multitask_exp_tuning.py
          git commit -m "Complete safe E8 input layer extraction"
          git push origin HEAD:dev/e8-multitask-inputs-split-01
