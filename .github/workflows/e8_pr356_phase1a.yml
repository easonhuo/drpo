name: E8 PR356 Final Validation

on:
  push:
    branches:
      - dev/e8-multitask-inputs-split-01

permissions:
  contents: write

jobs:
  validate-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-inputs-split-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Structural boundary assertions
        shell: bash
        run: |
          test -f src/drpo/e8_multitask_inputs.py
          for name in split_p0_rows split_countdown_rows _canonical_train_row _canonical_validation_row _ordered_by_prompt_hash _audit_training_rows _evenly_spaced_rank_indices _coverage_first_reference_rank_indices _reference_surprisal_summary _reference_error_class_audit _verified_wrong_candidates resolve_task_inputs write_split_manifest _leaf_values _changed_leaf_paths _atomic_yaml _task_base_config _task_grid_configs _load_task_adapter_and_instances; do
            grep -q "^def ${name}" src/drpo/e8_multitask_inputs.py
            ! grep -q "^def ${name}" src/drpo/e8_multitask_exp_tuning.py
          done
          grep -q '^class TaskInputs:' src/drpo/e8_multitask_inputs.py
          ! grep -q '^class TaskInputs:' src/drpo/e8_multitask_exp_tuning.py
          grep -q '^def _score_reference_candidates' src/drpo/e8_multitask_exp_tuning.py
          grep -q '^def _derive_reference_remoteness_banks' src/drpo/e8_multitask_exp_tuning.py
          grep -q '^def write_canonical_cold_inputs' src/drpo/e8_multitask_exp_tuning.py
      - name: Python compile
        run: python -m py_compile src/drpo/e8_multitask_inputs.py src/drpo/e8_multitask_exp_tuning.py
      - name: Focused E8 tests
        run: python -m pytest -q tests/test_e8_multitask_p0.py
      - name: Method integration contract
        run: bash tests/test_e8_method_integration_contract.sh
      - name: Handoff authority
        run: python scripts/handoff_authority.py verify --repo-root .
      - name: Governance stage validation
        run: python scripts/validate_governance_pipeline_stage_status.py --repo-root .
      - name: Ruff changed Python files
        run: python -m ruff check src/drpo/e8_multitask_inputs.py src/drpo/e8_multitask_exp_tuning.py
      - name: Full pytest
        run: python -m pytest -q
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          git config user.name "easonhuo"
          git config user.email "huoyusen1@126.com"
          git rm .github/workflows/e8_pr356_phase1a.yml
          git commit -m "Remove temporary PR356 validation workflow"
          git push origin HEAD:dev/e8-multitask-inputs-split-01
