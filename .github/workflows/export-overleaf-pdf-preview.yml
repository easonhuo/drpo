name: Export arXiv 2602.10430 replacement package

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'dev/paper-kdd2027-latest-content-sync-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Reconstruct approved arXiv source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/kdd-sync-payload/chunk-* | base64 --decode > /tmp/payload.tar.xz
          echo '2a3196380a7611ede4b309e94f2d4eb8aec4b0902c90fa07c51dca79b2d35900  /tmp/payload.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/payload.tar.xz -C .
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path('paper/overleaf/main_replacement.tex')
          s = p.read_text(encoding='utf-8')
          if '\\usepackage{makecell}\n' not in s:
              s = s.replace(
                  '\\usepackage{booktabs}\n',
                  '\\usepackage{booktabs}\n\\usepackage{makecell}\n',
                  1,
              )
          s = s.replace('  \\icmlsetsymbol{equal}{*}\n\n', '', 1)

          pattern = re.compile(
              r'  \\begin\{icmlauthorlist\}\n'
              r'.*?'
              r'  \\icmlcorrespondingauthor\{Jun Zhang\}\{neoxzhang@tencent\.com\}\n',
              re.S,
          )
          replacement = (
              '  \\begin{icmlauthorlist}\n'
              '    \\icmlauthor{Yusen Huo}{comp}\n'
              '    \\icmlauthor{Changping Wang}{comp}\n'
              '    \\icmlauthor{Yangru Huang}{comp}\n'
              '    \\icmlauthor{Jun Zhang}{comp}\n'
              '    \\icmlauthor{Jie Jiang}{comp}\n'
              '  \\end{icmlauthorlist}\n'
              '  \\icmlaffiliation{comp}{Tencent Inc, China}\n\n'
              '  \\icmlcorrespondingauthor{Jun Zhang}{neoxzhang@tencent.com}\n'
          )
          s, count = pattern.subn(lambda _: replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'author block replacement count={count}')
          s = s.replace(
              '\\printAffiliationsAndNotice{\\icmlEqualContribution}',
              '\\printAffiliationsAndNotice{}',
              1,
          )
          p.write_text(s, encoding='utf-8')
          PY
          grep -Fq '\icmlauthor{Yusen Huo}{comp}' paper/overleaf/main_replacement.tex
          grep -Fq '\icmlauthor{Changping Wang}{comp}' paper/overleaf/main_replacement.tex
          grep -Fq '\icmlauthor{Yangru Huang}{comp}' paper/overleaf/main_replacement.tex
          grep -Fq '\icmlauthor{Jun Zhang}{comp}' paper/overleaf/main_replacement.tex
          grep -Fq '\icmlauthor{Jie Jiang}{comp}' paper/overleaf/main_replacement.tex
          grep -Fq '\icmlcorrespondingauthor{Jun Zhang}{neoxzhang@tencent.com}' paper/overleaf/main_replacement.tex
          ! grep -Fq '\icmlcorrespondingauthor{Yangru Huang}' paper/overleaf/main_replacement.tex
          ! grep -Fq 'equal,comp' paper/overleaf/main_replacement.tex
          ! grep -Fq '\icmlsetsymbol{equal}' paper/overleaf/main_replacement.tex
          ! grep -Fq '\printAffiliationsAndNotice{\icmlEqualContribution}' paper/overleaf/main_replacement.tex

          rm -rf paper/overleaf/figures
          mkdir -p paper/overleaf/figures
          for figure in \
            figure1_external_gradient_d4rl9.pdf \
            fig_6_3_1_source_heatmap.pdf \
            fig_6_3_2_rescue_plot.pdf \
            fig_6_4_1_phase_transition.pdf \
            fig_6_4_2_leftfig_bigtext_legend_protocol.pdf \
            fig_app_d4rl9_gradient_panels.pdf \
            fig_app_countdown_asymre_parameter_response.pdf \
            fig_app_countdown_topr_parameter_response.pdf \
            fig_app_countdown_taper_coefficient_response.pdf
          do
            test -s "paper/kdd2027/figures/${figure}"
            cp "paper/kdd2027/figures/${figure}" paper/overleaf/figures/
          done
          test "$(find paper/overleaf/figures -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 9

      - name: Compile final source with TeX Live 2025
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2025
          os: debian
          run: |
            set -euo pipefail
            cd paper/overleaf
            latexmk -C main.tex >/dev/null 2>&1 || true
            latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
            test -s main.pdf
            test -s main.bbl
            ! grep -Eiq 'undefined references|undefined citations|Citation .* undefined|Reference .* undefined|Fatal error|LaTeX Error' main.log

      - name: Assemble and clean-room test arXiv package
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2025
          os: debian
          run: |
            set -euo pipefail
            apt-get update >/dev/null
            DEBIAN_FRONTEND=noninteractive apt-get install -y poppler-utils zip unzip >/dev/null
            rm -rf .arxiv-stage .arxiv-test
            mkdir -p .arxiv-stage/figures .arxiv-test
            cp paper/overleaf/main.tex .arxiv-stage/
            cp paper/overleaf/main_replacement.tex .arxiv-stage/
            cp paper/overleaf/icml2026.sty .arxiv-stage/
            cp paper/overleaf/icml2026.bst .arxiv-stage/
            cp paper/overleaf/example_paper.bib .arxiv-stage/
            cp paper/overleaf/missing_references.bib .arxiv-stage/
            cp paper/overleaf/main.bbl .arxiv-stage/
            cp paper/overleaf/figures/*.pdf .arxiv-stage/figures/
            test "$(find .arxiv-stage/figures -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 9

            cd .arxiv-stage
            zip -q -r ../DRPO_ARXIV_2602.10430_REPLACEMENT.zip \
              main.tex main_replacement.tex icml2026.sty icml2026.bst \
              example_paper.bib missing_references.bib main.bbl figures
            cd ..

            cd .arxiv-test
            unzip -q ../DRPO_ARXIV_2602.10430_REPLACEMENT.zip
            test "$(find . -maxdepth 2 -type f | wc -l)" -eq 16
            test ! -e main.pdf
            test ! -e build.sh
            test ! -e README.md
            test ! -e BUILD.md
            test ! -e PACKAGE_AUDIT.txt
            test "$(find figures -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 9
            latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
            test -s main.pdf
            test -s main.bbl
            ! grep -Eiq 'undefined references|undefined citations|Citation .* undefined|Reference .* undefined|Fatal error|LaTeX Error' main.log
            pages="$(pdfinfo main.pdf | awk '/^Pages:/{print $2}')"
            test "$pages" -eq 46
            pdftotext -f 1 -l 1 main.pdf /tmp/arxiv-page1.txt
            grep -Fq 'Yusen Huo' /tmp/arxiv-page1.txt
            grep -Fq 'Changping Wang' /tmp/arxiv-page1.txt
            grep -Fq 'Yangru Huang' /tmp/arxiv-page1.txt
            grep -Fq 'Jun Zhang' /tmp/arxiv-page1.txt
            grep -Fq 'Jie Jiang' /tmp/arxiv-page1.txt
            grep -Fq 'neoxzhang@tencent.com' /tmp/arxiv-page1.txt
            ! grep -Fiq 'Equal contribution' /tmp/arxiv-page1.txt
            ! grep -Fiq 'yarayrhuang@tencent.com' /tmp/arxiv-page1.txt
            cd ..
            sha256sum DRPO_ARXIV_2602.10430_REPLACEMENT.zip

      - name: Upload arXiv replacement package
        uses: actions/upload-artifact@v4
        with:
          name: DRPO_ARXIV_2602.10430_REPLACEMENT
          path: DRPO_ARXIV_2602.10430_REPLACEMENT.zip
          if-no-files-found: error
          retention-days: 7
