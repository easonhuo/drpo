name: Export complete Overleaf package

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'dev/paper-kdd2027-latest-content-sync-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Reconstruct approved Overleaf source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/kdd-sync-payload/chunk-* | base64 --decode > /tmp/payload.tar.xz
          echo '2a3196380a7611ede4b309e94f2d4eb8aec4b0902c90fa07c51dca79b2d35900  /tmp/payload.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/payload.tar.xz -C .
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path('paper/overleaf/main_replacement.tex')
          s = p.read_text(encoding='utf-8')
          if '\\usepackage{makecell}\n' not in s:
              s = s.replace('\\usepackage{booktabs}\n', '\\usepackage{booktabs}\n\\usepackage{makecell}\n', 1)

          pattern = re.compile(
              r'  \\begin\{icmlauthorlist\}\n'
              r'.*?'
              r'  \\icmlcorrespondingauthor\{Jun Zhang\}\{neoxzhang@tencent\.com\}\n',
              re.S,
          )
          replacement = (
              '  \\begin{icmlauthorlist}\n'
              '    \\icmlauthor{Yusen Huo}{comp}\n'
              '    \\icmlauthor{Changping Wang}{comp}\n'
              '    \\icmlauthor{Yangru Huang}{comp}\n'
              '    \\icmlauthor{Jun Zhang}{comp}\n'
              '    \\icmlauthor{Jie Jiang}{comp}\n'
              '  \\end{icmlauthorlist}\n'
              '  \\icmlaffiliation{comp}{Tencent Inc, China}\n\n'
              '  \\icmlcorrespondingauthor{Jun Zhang}{neoxzhang@tencent.com}\n'
          )
          s, count = pattern.subn(lambda _: replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'author block replacement count={count}')
          s = s.replace(
              '\\printAffiliationsAndNotice{\\icmlEqualContribution}',
              '\\printAffiliationsAndNotice{}',
              1,
          )
          p.write_text(s, encoding='utf-8')
          PY
          grep -Fq '\icmlauthor{Yusen Huo}{comp}' paper/overleaf/main_replacement.tex
          grep -Fq '\icmlauthor{Changping Wang}{comp}' paper/overleaf/main_replacement.tex
          grep -Fq '\icmlauthor{Yangru Huang}{comp}' paper/overleaf/main_replacement.tex
          grep -Fq '\icmlauthor{Jun Zhang}{comp}' paper/overleaf/main_replacement.tex
          grep -Fq '\icmlauthor{Jie Jiang}{comp}' paper/overleaf/main_replacement.tex
          grep -Fq '\icmlcorrespondingauthor{Jun Zhang}{neoxzhang@tencent.com}' paper/overleaf/main_replacement.tex
          ! grep -Fq '\icmlcorrespondingauthor{Yangru Huang}' paper/overleaf/main_replacement.tex
          ! grep -Fq 'equal,comp' paper/overleaf/main_replacement.tex
          ! grep -Fq '\printAffiliationsAndNotice{\icmlEqualContribution}' paper/overleaf/main_replacement.tex
          mkdir -p paper/overleaf/figures
          cp -a paper/kdd2027/figures/. paper/overleaf/figures/
          test "$(find paper/overleaf/figures -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 9

      - name: Compile Overleaf/arXiv PDF with TeX Live 2025
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2025
          os: debian
          run: |
            set -euo pipefail
            cd paper/overleaf
            latexmk -C main.tex >/dev/null 2>&1 || true
            bash build.sh
            test -s main.pdf

      - name: Audit and assemble upload-ready ZIP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y poppler-utils >/dev/null
          pages="$(pdfinfo paper/overleaf/main.pdf | awk '/^Pages:/{print $2}')"
          test "$pages" -eq 46
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import zipfile
          from pathlib import Path

          root = Path('paper/overleaf')
          output = Path('/tmp/DRPO_OVERLEAF_FINAL_PACKAGE.zip')
          audit = root / 'PACKAGE_AUDIT.txt'
          pdf = root / 'main.pdf'
          source = root / 'main_replacement.tex'

          required = [
              root / 'main.tex',
              source,
              root / 'icml2026.sty',
              root / 'example_paper.bib',
              root / 'missing_references.bib',
              root / 'build.sh',
              root / 'README.md',
              root / 'BUILD.md',
              pdf,
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit(f'missing required Overleaf files: {missing}')

          figures = sorted((root / 'figures').glob('*.pdf'))
          if len(figures) != 9:
              raise SystemExit(f'expected 9 figures, found {len(figures)}')

          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          audit.write_text(
              '\n'.join([
                  'claim=PAPER-KDD2027-LATEST-CONTENT-SYNC-01',
                  'author_order=Yusen_Huo;Changping_Wang;Yangru_Huang;Jun_Zhang;Jie_Jiang',
                  'equal_contribution=NONE',
                  'corresponding_author=Jun_Zhang',
                  'corresponding_email=neoxzhang@tencent.com',
                  'overleaf_compile=PASS',
                  'pages=46',
                  'figures=9',
                  f'main_replacement_tex_sha256={sha(source)}',
                  f'main_pdf_sha256={sha(pdf)}',
              ]) + '\n',
              encoding='utf-8',
          )

          generated_names = {
              'main.aux', 'main.bbl', 'main.blg', 'main.fdb_latexmk',
              'main.fls', 'main.log', 'main.out', 'main.toc',
              'main.synctex.gz',
          }
          files = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if path.name in generated_names:
                  continue
              if any(part in {'__pycache__', 'renders'} for part in rel.parts):
                  continue
              files.append(path)

          if output.exists():
              output.unlink()
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(files, key=lambda p: str(p.relative_to(root))):
                  zf.write(path, path.relative_to(root))

          with zipfile.ZipFile(output) as zf:
              names = set(zf.namelist())
              required_names = {
                  'main.tex', 'main_replacement.tex', 'icml2026.sty',
                  'example_paper.bib', 'missing_references.bib',
                  'build.sh', 'README.md', 'BUILD.md', 'main.pdf',
                  'PACKAGE_AUDIT.txt',
              }
              missing_names = sorted(required_names - names)
              if missing_names:
                  raise SystemExit(f'package missing: {missing_names}')
              figure_names = [n for n in names if n.startswith('figures/') and n.endswith('.pdf')]
              if len(figure_names) != 9:
                  raise SystemExit(f'package figure count={len(figure_names)}')

          print(f'package={output}')
          print(f'package_sha256={sha(output)}')
          print(f'package_files={len(files)}')
          PY
          test -s /tmp/DRPO_OVERLEAF_FINAL_PACKAGE.zip

      - name: Upload complete Overleaf package
        uses: actions/upload-artifact@v4
        with:
          name: DRPO_OVERLEAF_FINAL_PACKAGE
          path: /tmp/DRPO_OVERLEAF_FINAL_PACKAGE.zip
          if-no-files-found: error
          retention-days: 7
