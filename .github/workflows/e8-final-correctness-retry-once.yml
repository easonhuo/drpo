name: E8 Final Correctness Retry Once

on:
  push:
    branches: [dev/e8-config-driven-sweep-01]
    paths:
      - .github/workflows/e8-final-correctness-retry-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Reuse reviewed transform with exact EOF
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/e8-final-correctness-fix-once.yml')
          text = workflow.read_text(encoding='utf-8')
          old = 'tests_path.write_text(tests.rstrip() + additions + "\\n", encoding="utf-8")'
          new = 'tests_path.write_text((tests.rstrip() + additions).rstrip() + "\\n", encoding="utf-8")'
          if text.count(old) != 1:
              raise SystemExit(f'EOF writer match count={text.count(old)}')
          text = text.replace(old, new, 1)
          workflow.write_text(text, encoding='utf-8')

          marker = '      - name: Apply audited correctness fixes only\n        run: |\n'
          start = text.index(marker) + len(marker)
          end = text.index('\n      - name:', start)
          block = text[start:end]
          lines = block.splitlines()
          script_lines = []
          for line in lines:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif not line:
                  script_lines.append('')
              else:
                  raise SystemExit(f'unexpected transform indentation: {line!r}')
          subprocess.run(['bash', '-euo', 'pipefail', '-c', '\n'.join(script_lines) + '\n'], check=True)
          PY

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Validate final correctness after-image
        run: |
          BASE=6ed153d5ad7361a4e52348610b86b51b71e25e47
          python -m py_compile \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh
          ruff check \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check
          git diff --exit-code "$BASE" -- .github/workflows/code-change-budget.yml

      - name: Commit fixes and self-remove
        run: |
          rm -f \
            .github/workflows/e8-final-correctness-fix-once.yml \
            .github/workflows/e8-final-correctness-retry-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(e8): close config-driven correctness gaps"
          git push origin HEAD:dev/e8-config-driven-sweep-01
