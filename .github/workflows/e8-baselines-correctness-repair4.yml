name: E8 baseline correctness repair 4

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-baselines-correctness-repair4.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed correctness patch
        shell: bash
        run: |
          awk 'BEGIN{take=0} /python - <<'\''PY'\''/{if (!take) {take=1; next}} take && /^          PY$/ {exit} take {sub(/^          /, ""); print}' .github/workflows/e8-baselines-correctness-repair.yml > /tmp/e8_correctness_patch.py
          sed -i "/count = text.count(old)/a\\    if label == 'cell identity DPO initialization' and count == 2:\\n        return text.replace(old, new, 1)" /tmp/e8_correctness_patch.py
          python /tmp/e8_correctness_patch.py
          echo '' | base64 -d > /tmp/fix_test.py
          python /tmp/fix_test.py
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pyyaml pytest ruff
      - name: Compile
        run: python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
      - name: Focused regression
        run: PYTHONPATH=.:src pytest -q tests/test_e8_multitask_p0.py
      - name: Diff check
        run: git diff --check
      - name: Ruff excluding known main-branch BLE001/B023 debt
        run: ruff check src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py --ignore BLE001,B023
      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git commit -m 'fix: close E8 baseline correctness gaps'
          git push origin HEAD:dev/e8-multitask-baselines-capability-01
