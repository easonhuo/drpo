name: E8 PR362 final acceptance

on:
  push:
    branches:
      - dev/e8-multitask-recovery-runtime-split-01

permissions:
  contents: write

concurrency:
  group: e8-pr362-final-acceptance
  cancel-in-progress: true

jobs:
  final-acceptance:
    if: github.event.head_commit.message != 'Remove temporary PR362 final acceptance workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev/e8-multitask-recovery-runtime-split-01

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Engineering self-test regression
        run: python -m pytest -q tests/test_e8_multitask_p0.py::test_coldstart_engineering_self_test_exercises_208_cell_recovery_and_dynamic_refill

      - name: Scheduler timing probe repeated
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            python -m pytest -q tests/test_e8_multitask_p0.py::test_exp_coldstart_scheduler_refills_without_nominal_batch_barriers
          done

      - name: Method integration contract
        run: bash tests/test_e8_method_integration_contract.sh

      - name: Remove temporary validation workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/e8_pr362_final_acceptance.yml
          git commit -m "Remove temporary PR362 final acceptance workflow"
          git push origin HEAD:dev/e8-multitask-recovery-runtime-split-01
