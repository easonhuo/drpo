name: E8 Third Audit Final Validation Once

on:
  push:
    branches:
      - dev/e8-config-driven-sweep-01
    paths:
      - .github/workflows/e8-third-audit-final-validation-once.yml

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_SHA: 6ed153d5ad7361a4e52348610b86b51b71e25e47
      PR_NUMBER: "340"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install repository and E8 validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r requirements/e8_multitask_exp_coldstart.txt

      - name: Validate implementation head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA"...HEAD
          python -m py_compile \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh

          python -m pytest -q tests/test_e8_multitask_p0.py | tee /tmp/e8-focused.log

          set +e
          python -m pytest -q | tee /tmp/e8-full.log
          full_rc=${PIPESTATUS[0]}
          set -e
          if (( full_rc == 0 )); then
            echo "FULL_BASELINE_NOTE=full repository pytest passed with no failures" >> "$GITHUB_ENV"
          else
            awk '/^FAILED / {print $2}' /tmp/e8-full.log | LC_ALL=C sort -u > /tmp/e8-head-failures.txt
            cat > /tmp/e8-expected-baseline-failures.txt <<'EOF'
          tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells
          tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test
          EOF
            LC_ALL=C sort -u /tmp/e8-expected-baseline-failures.txt -o /tmp/e8-expected-baseline-failures.txt
            cmp /tmp/e8-expected-baseline-failures.txt /tmp/e8-head-failures.txt

            git worktree add --detach /tmp/e8-base "$BASE_SHA"
            set +e
            (
              cd /tmp/e8-base
              PYTHONPATH="$PWD/src" python -m pytest -q \
                tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells \
                tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test
            ) | tee /tmp/e8-base-known-failures.log
            base_rc=${PIPESTATUS[0]}
            set -e
            (( base_rc != 0 ))
            awk '/^FAILED / {print $2}' /tmp/e8-base-known-failures.log | LC_ALL=C sort -u > /tmp/e8-base-failures.txt
            cmp /tmp/e8-expected-baseline-failures.txt /tmp/e8-base-failures.txt
            echo "FULL_BASELINE_NOTE=head full pytest has exactly two failures and both reproduce on the unchanged base main; no branch-specific full-suite failure ID was observed" >> "$GITHUB_ENV"
          fi

          python -m ruff check \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py | tee /tmp/e8-ruff.log
          python -m ruff format --check \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py

          python scripts/validate_evidence_locator.py \
            --repo-root . --base "$BASE_SHA" --head HEAD --json | tee /tmp/e8-evidence-locator.log
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .
          python scripts/handoff_authority.py verify --repo-root .
          bash tests/test_new_python_file_gate.sh
          bash tests/test_human_approval_record_gate.sh

          test "$(git rev-parse --is-shallow-repository)" = "false"
          current_head="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$BASE_SHA" "$current_head"
          git fetch --no-tags origin "$current_head"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git merge-base --is-ancestor "$BASE_SHA" "$current_head"

          new_python_file="$RUNNER_TEMP/new-python-files.txt"
          bash scripts/check_new_python_file_gate.sh \
            --repo-root . --base "$BASE_SHA" --head HEAD --output "$new_python_file"
          comments_json="$RUNNER_TEMP/approval-records.json"
          {
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100"
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100"
          } | jq -s 'add' >"$comments_json"
          bash scripts/check_human_approval_record.sh \
            --comments-json "$comments_json" \
            --approval-author "$GITHUB_REPOSITORY_OWNER" \
            --new-python-paths "$new_python_file" \
            --approval-reason new_python_file \
            --approval-reason hard_gate_policy_change \
            --approval-reason large_or_structural_python_change

          for path in \
            .github/workflows/e8-second-audit-fix-once.yml \
            .github/workflows/e8-second-audit-fix-v2-once.yml \
            .github/workflows/e8-second-audit-fix-v3-once.yml \
            scripts/.tmp_e8_second_audit_fix.sh \
            scripts/.tmp_e8_second_audit_fix_v3.sh \
            .github/workflows/e8-third-audit-loader-fix-once.yml \
            scripts/.tmp_e8_third_audit_loader_fix.sh \
            .github/workflows/e8-third-audit-identity-fix-once.yml \
            scripts/.tmp_e8_third_audit_identity_fix.sh; do
            test ! -e "$path"
          done

      - name: Record evidence and remove temporary validator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export IMPLEMENTATION_HEAD="$(git rev-parse HEAD)"
          export FOCUSED_SUMMARY="$(tail -n 1 /tmp/e8-focused.log)"
          export FULL_SUMMARY="$(tail -n 1 /tmp/e8-full.log)"
          export RUFF_SUMMARY="$(tail -n 1 /tmp/e8-ruff.log)"
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md")
          block = f"""

          ## 2026-09-01 third-audit final-head validation evidence

          - Base main commit: `{os.environ['BASE_SHA']}`.
          - Implementation head validated before evidence-only cleanup: `{os.environ['IMPLEMENTATION_HEAD']}`.
          - GitHub Actions final-validation run: `{os.environ['GITHUB_RUN_ID']}`.
          - Focused E8 suite: **{os.environ['FOCUSED_SUMMARY']}**.
          - Full repository pytest was executed: **{os.environ['FULL_SUMMARY']}**. Baseline audit: **{os.environ['FULL_BASELINE_NOTE']}**. The two baseline failures are outside the PR's changed scientific/runtime paths and were not repaired or reinterpreted by this E8 task.
          - Ruff on all touched Python paths completed successfully: **{os.environ['RUFF_SUMMARY']}**; format check passed for all touched Python paths.
          - Python compilation passed for the config module, preflight, cold-start orchestration module, and focused E8 tests.
          - Shell syntax passed for the cold-start runner, bootstrap, and lambda-completion launcher.
          - `git diff --check`, evidence-locator validation, governance-stage validation, handoff-authority verification, new-Python-file gate fixtures, human-approval-record gate fixtures, and the PR #340 durable oral-approval record checks for new Python paths, the approved hard-gate ancestry repair, and the large/structural refactor all passed.
          - The Code Change Budget after-image was exercised from a full-history checkout: fetching the exact head without `--depth=1` preserved a non-shallow repository and `BASE_SHA` remained an ancestor before and after the fetch. The production `pull_request_target` gate is still a separate base-branch concern and is not claimed green by this exact-head validation.
          - The stranded second-audit temporary artifacts and the third-audit loader/identity temporary artifacts were absent from the validated implementation tree.
          - This validation executed no model training, GPU sweep, task-performance experiment, support/variance-boundary experiment, convergence test, significance test, or method-ranking experiment. It is engineering validation only.
          - Independent review remains a separate mandatory merge gate; this evidence does not authorize merge or scientific execution.
          """
          path.write_text(path.read_text(encoding="utf-8") + block, encoding="utf-8")
          PY
          git rm -f .github/workflows/e8-third-audit-final-validation-once.yml
          git add docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'docs(e8): record third-audit final validation'

          final_head="$(git rev-parse HEAD)"
          git diff --check "$BASE_SHA"..."$final_head"
          python scripts/validate_evidence_locator.py \
            --repo-root . --base "$BASE_SHA" --head "$final_head" --json
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .
          python scripts/handoff_authority.py verify --repo-root .
          bash scripts/check_new_python_file_gate.sh \
            --repo-root . --base "$BASE_SHA" --head "$final_head" \
            --output "$RUNNER_TEMP/final-new-python-files.txt"
          comments_json="$RUNNER_TEMP/final-approval-records.json"
          {
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100"
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100"
          } | jq -s 'add' >"$comments_json"
          bash scripts/check_human_approval_record.sh \
            --comments-json "$comments_json" \
            --approval-author "$GITHUB_REPOSITORY_OWNER" \
            --new-python-paths "$RUNNER_TEMP/final-new-python-files.txt" \
            --approval-reason new_python_file \
            --approval-reason hard_gate_policy_change \
            --approval-reason large_or_structural_python_change
          git push origin HEAD:dev/e8-config-driven-sweep-01
