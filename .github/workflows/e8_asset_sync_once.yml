name: E8 asset sync once

on:
  push:
    branches:
      - dev/e8-exp-response-asset-sync-01

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev/e8-exp-response-asset-sync-01
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install figure dependencies
        run: python -m pip install -r scripts/figures/requirements.txt

      - name: Render manuscript asset
        run: |
          python scripts/figures/plot_e8_multitask_exp_response_curves.py \
            --output-pdf paper/overleaf/figures/fig_app_structured9_drpo_coefficient_response.pdf \
            --output-png /tmp/e8_multitask_exp_response.png \
            --output-svg /tmp/e8_multitask_exp_response.svg

      - name: Commit asset and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/overleaf/figures/fig_app_structured9_drpo_coefficient_response.pdf
          git rm .github/workflows/e8_asset_sync_once.yml
          git commit -m "Sync generated E8 response figure asset"
          git push origin HEAD:dev/e8-exp-response-asset-sync-01
