name: E8 baseline final correctness v3

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-baselines-final-correctness-v3.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse validated correctness patch payload
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          source = Path('.github/workflows/e8-baselines-final-correctness-v2.yml').read_text(encoding='utf-8')
          marker = "printf '%s' '"
          start = source.index(marker) + len(marker)
          end = source.index("' | base64 -d > /tmp/e8_final_patch.py", start)
          payload = source[start:end]
          Path('/tmp/e8_final_patch.py').write_bytes(base64.b64decode(payload))
          PY
          python /tmp/e8_final_patch.py
      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -q numpy pyyaml pytest ruff
          python -m pip install --disable-pip-version-check -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Fix import formatting in newly added tests
        run: ruff check tests/test_e8_multitask_p0.py --select I001 --fix
      - name: Compile
        run: python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
      - name: Focused regression with CPU Torch
        run: PYTHONPATH=.:src pytest -q -rs tests/test_e8_multitask_p0.py
      - name: Diff check
        run: git diff --check
      - name: Ruff excluding known main-branch BLE001/B023 debt
        run: ruff check src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py --ignore BLE001,B023
      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git commit -m 'fix: align DPO transfer runtime and liveness identity'
          git push origin HEAD:dev/e8-multitask-baselines-capability-01
