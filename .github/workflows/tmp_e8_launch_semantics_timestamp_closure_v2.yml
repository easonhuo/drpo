name: Temporary E8 launch semantics timestamp closure v2

on:
  push:
    branches: [dev/e8-multitask-baselines-capability-01]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install validation dependencies
        run: python -m pip install pyyaml pytest ruff numpy
      - name: Execute reviewed closure
        run: bash .github/workflows/tmp_e8_launch_semantics_timestamp_closure.sh
