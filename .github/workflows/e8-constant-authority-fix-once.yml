name: E8 constant authority cleanup once

"on":
  push:
    branches:
      - dev/e8-config-driven-sweep-01
    paths:
      - .github/workflows/e8-constant-authority-fix-once.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0
      - name: Verify repair base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ee3c1e814cc2873423134e4aa20838a646a8fcac HEAD
          test "$(git diff --name-only ee3c1e814cc2873423134e4aa20838a646a8fcac HEAD)" = ".github/workflows/e8-constant-authority-fix-once.yml"
      - name: Install repository test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip install --disable-pip-version-check numpy==1.26.4 PyYAML==6.0.2 pytest==8.3.5 ruff==0.9.10
      - name: Apply authority cleanup and validate
        shell: bash
        run: |
          set -euo pipefail
          user_site="$(python -c 'import site; print(site.getusersitepackages())')"
          export PYTHONPATH="$PWD:${user_site}${PYTHONPATH:+:${PYTHONPATH}}"

          python - <<'PY'
          from pathlib import Path

          path = Path("src/drpo/e8_multitask_exp_tuning.py")
          text = path.read_text(encoding="utf-8")
          old = '''EXPERIMENT_ID = "EXT-C-E8-MULTITASK-EXP-TUNING-01"
          DENSE_EXPERIMENT_ID = "EXT-C-E8-MULTITASK-EXP-LAMBDA-DENSE-01"
          COLDSTART_EXPERIMENT_ID = "EXT-C-E8-MULTITASK-EXP-COLDSTART-01"
          LAMBDA_COMPLETION_EXPERIMENT_ID = "EXT-C-E8-MULTITASK-EXP-LAMBDA-COMPLETION-01"
          LAMBDA_CURVE_COMPLETION_EXPERIMENT_ID = "EXT-C-E8-MULTITASK-EXP-LAMBDA-CURVE-COMPLETION-02"
          P0_EXPERIMENT_ID = "EXT-C-E8-MULTITASK-P0-01"
          # Backward-compatible name used by predecessor tests and downstream callers.
          PARENT_EXPERIMENT_ID = P0_EXPERIMENT_ID
          DEFAULT_CONFIG = Path("configs/e8_multitask_exp_tuning.yaml")
          DEFAULT_P0_CONFIG = Path("configs/e8_multitask_p0.yaml")
          METHOD_POSITIVE_ONLY = "positive_only"
          METHOD_EXPONENTIAL = "exponential"
          METHOD_GLOBAL = "global"
          TRANSFER_SYSTEM_PROMPT = "Answer with only the requested final output and no explanation."
          SWEEP_PROFILE_RHO = "nine_task_rho_v1"
          SWEEP_PROFILE_DENSE = "task_lambda_dense_v1"
          SWEEP_PROFILE_COLDSTART = "eight_task_coldstart_lambda_v1"
          '''
          new = '''# Backward-compatible aliases; e8_experiment_config is the single authority for
          # experiment IDs and sweep-profile names.
          EXPERIMENT_ID = experiment_config.RHO_EXPERIMENT_ID
          DENSE_EXPERIMENT_ID = experiment_config.DENSE_EXPERIMENT_ID
          COLDSTART_EXPERIMENT_ID = experiment_config.COLDSTART_EXPERIMENT_ID
          LAMBDA_COMPLETION_EXPERIMENT_ID = experiment_config.LAMBDA_COMPLETION_EXPERIMENT_ID
          LAMBDA_CURVE_COMPLETION_EXPERIMENT_ID = (
              experiment_config.LAMBDA_CURVE_COMPLETION_EXPERIMENT_ID
          )
          P0_EXPERIMENT_ID = experiment_config.P0_EXPERIMENT_ID
          # Backward-compatible name used by predecessor tests and downstream callers.
          PARENT_EXPERIMENT_ID = P0_EXPERIMENT_ID
          DEFAULT_CONFIG = Path("configs/e8_multitask_exp_tuning.yaml")
          DEFAULT_P0_CONFIG = Path("configs/e8_multitask_p0.yaml")
          METHOD_POSITIVE_ONLY = "positive_only"
          METHOD_EXPONENTIAL = "exponential"
          METHOD_GLOBAL = "global"
          TRANSFER_SYSTEM_PROMPT = "Answer with only the requested final output and no explanation."
          SWEEP_PROFILE_RHO = experiment_config.SWEEP_PROFILE_RHO
          SWEEP_PROFILE_DENSE = experiment_config.SWEEP_PROFILE_DENSE
          SWEEP_PROFILE_COLDSTART = experiment_config.SWEEP_PROFILE_COLDSTART
          '''
          if text.count(old) != 1:
              raise SystemExit("expected constant block not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          python -m py_compile \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            scripts/preflight_e8_multitask_config.py \
            tests/test_e8_multitask_p0.py
          ruff check \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            scripts/preflight_e8_multitask_config.py \
            tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh

          for config in \
            configs/e8_multitask_exp_coldstart.yaml \
            configs/e8_multitask_exp_lambda_completion.yaml \
            configs/e8_multitask_exp_lambda_curve_completion.yaml
          do
            python scripts/preflight_e8_multitask_config.py --repo-root . --config "${config}" >/dev/null
          done

          python - <<'PY'
          from drpo import e8_experiment_config as authority
          from drpo import e8_multitask_exp_tuning as tuning

          assert tuning.EXPERIMENT_ID == authority.RHO_EXPERIMENT_ID
          assert tuning.DENSE_EXPERIMENT_ID == authority.DENSE_EXPERIMENT_ID
          assert tuning.COLDSTART_EXPERIMENT_ID == authority.COLDSTART_EXPERIMENT_ID
          assert tuning.LAMBDA_COMPLETION_EXPERIMENT_ID == authority.LAMBDA_COMPLETION_EXPERIMENT_ID
          assert (
              tuning.LAMBDA_CURVE_COMPLETION_EXPERIMENT_ID
              == authority.LAMBDA_CURVE_COMPLETION_EXPERIMENT_ID
          )
          assert tuning.P0_EXPERIMENT_ID == authority.P0_EXPERIMENT_ID
          assert tuning.PARENT_EXPERIMENT_ID == authority.P0_EXPERIMENT_ID
          assert tuning.SWEEP_PROFILE_RHO == authority.SWEEP_PROFILE_RHO
          assert tuning.SWEEP_PROFILE_DENSE == authority.SWEEP_PROFILE_DENSE
          assert tuning.SWEEP_PROFILE_COLDSTART == authority.SWEEP_PROFILE_COLDSTART
          PY

          pytest -q tests/test_e8_multitask_p0.py
          pytest -q \
            tests/test_experiment_artifact_protocol.py \
            tests/test_experiment_artifact_hardening.py
          pytest -q \
            --deselect tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells \
            --deselect tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test
          git diff --check

          git diff --exit-code ee3c1e814cc2873423134e4aa20838a646a8fcac -- \
            configs/e8_multitask_exp_coldstart.yaml \
            configs/e8_multitask_exp_lambda_completion.yaml \
            configs/e8_multitask_exp_lambda_curve_completion.yaml
          git diff --exit-code ee3c1e814cc2873423134e4aa20838a646a8fcac -- \
            src/drpo/countdown_e8_alpha1_c_scan_common.py \
            src/drpo/countdown_e8_alpha1_c_scan_runtime.py \
            src/drpo/countdown_e8_alpha1_c_scan_trainer.py \
            src/drpo/countdown_e8_alpha1_highc_scan_common.py \
            src/drpo/countdown_e8_alpha1_highc_scan_runtime.py

          git rm .github/workflows/e8-constant-authority-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/drpo/e8_multitask_exp_tuning.py
          git commit -m "refactor(e8): centralize experiment identity constants"
          git push origin HEAD:dev/e8-config-driven-sweep-01
