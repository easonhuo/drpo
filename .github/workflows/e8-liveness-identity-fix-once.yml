name: E8 liveness identity repair once

"on":
  push:
    branches:
      - dev/e8-config-driven-sweep-01
    paths:
      - .github/workflows/e8-liveness-identity-fix-once.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0
      - name: Install complete repository test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Apply repair, validate, commit, and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/.tmp_e8_liveness_identity_fix.sh
