name: E8 liveness identity repair once

on:
  push:
    branches:
      - dev/e8-config-driven-sweep-01
    paths:
      - .github/workflows/e8-liveness-identity-fix-once.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0

      - name: Verify repair base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "733b132bcdec0bc1ccb11128a465b1b9cff0f0a1"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Apply narrow liveness identity repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          tuning = "src/drpo/e8_multitask_exp_tuning.py"
          replace_once(
              tuning,
              '''def _cmd_canonical_cold_liveness(
              config: Mapping[str, Any],
              config_path: Path,
              output_root: Path,
              *,
              cell: Cell,
              inputs: TaskInputs,
              splits: Mapping[str, Any],
              base_model_path: str,
              force: bool,
          ) -> dict[str, Any]:
              if cell.task != "countdown":
                  raise RuntimeError("The paper-runtime liveness anchor must be Countdown")
              modules = _canonical_cold_modules(config)
              runtime = modules["paper_runtime"]
              record = _canonical_task_record(splits, cell.task)
              grid_path = Path(str(record["round1_grid"]))
          ''',
              '''def _canonical_cold_liveness_cell(grid_path: Path) -> Cell:
              """Derive the wrapper identity from the exact grid consumed by canonical smoke."""

              grid = yaml.safe_load(grid_path.read_text(encoding="utf-8"))
              if not isinstance(grid, dict):
                  raise TypeError("Canonical liveness grid root must be a mapping")
              liveness = grid["execution"]["liveness"]
              seed_offsets = grid["sweep"]["seed_offsets"]
              coefficient = float(liveness["representative_c"])
              return Cell(
                  "countdown",
                  METHOD_EXPONENTIAL,
                  math.exp(-coefficient),
                  int(seed_offsets[0]),
                  "liveness",
                  coefficient,
              )


          def _cmd_canonical_cold_liveness(
              config: Mapping[str, Any],
              config_path: Path,
              output_root: Path,
              *,
              inputs: TaskInputs,
              splits: Mapping[str, Any],
              base_model_path: str,
              force: bool,
          ) -> dict[str, Any]:
              modules = _canonical_cold_modules(config)
              runtime = modules["paper_runtime"]
              record = _canonical_task_record(splits, "countdown")
              grid_path = Path(str(record["round1_grid"]))
              cell = _canonical_cold_liveness_cell(grid_path)
          ''',
          )

          replace_once(
              tuning,
              '''def cmd_liveness(
              config: Mapping[str, Any],
              config_path: Path,
              output_root: Path,
              *,
              task: str,
              rho: float,
              base_model_path: str,
              force: bool,
          ) -> dict[str, Any]:
              if task not in config["suite"]["tasks"]:
                  raise ValueError(f"Unknown liveness task: {task}")
              if rho not in _task_rhos(config, task):
                  raise ValueError("Liveness rho must be one frozen grid point")
              splits, inputs = _load_ready_inputs(
                  output_root,
                  config,
                  base_model_path=base_model_path,
              )
              lambda_value = None
              if _uses_task_lambdas(config):
                  lambda_value = next(
                      value
                      for value in _task_lambdas(config, task)
                      if math.isclose(math.exp(-value), rho, rel_tol=0.0, abs_tol=1.0e-15)
                  )
              cell = Cell(
                  task,
                  METHOD_EXPONENTIAL,
                  rho,
                  int(config["sweep"]["tuning_seed"]),
                  "liveness",
                  lambda_value,
              )
              if _is_coldstart(config):
                  return _cmd_canonical_cold_liveness(
                      config,
                      config_path,
                      output_root,
                      cell=cell,
                      inputs=inputs[task],
                      splits=splits,
                      base_model_path=base_model_path,
                      force=force,
                  )
          ''',
              '''def cmd_liveness(
              config: Mapping[str, Any],
              config_path: Path,
              output_root: Path,
              *,
              task: str,
              rho: float | None,
              base_model_path: str,
              force: bool,
          ) -> dict[str, Any]:
              if task not in config["suite"]["tasks"]:
                  raise ValueError(f"Unknown liveness task: {task}")
              if _is_coldstart(config):
                  if task != "countdown":
                      raise RuntimeError("The paper-runtime liveness anchor must be Countdown")
                  splits, inputs = _load_ready_inputs(
                      output_root,
                      config,
                      base_model_path=base_model_path,
                  )
                  return _cmd_canonical_cold_liveness(
                      config,
                      config_path,
                      output_root,
                      inputs=inputs["countdown"],
                      splits=splits,
                      base_model_path=base_model_path,
                      force=force,
                  )
              if rho is None:
                  raise ValueError("Liveness rho is required outside cold-start")
              if rho not in _task_rhos(config, task):
                  raise ValueError("Liveness rho must be one frozen grid point")
              splits, inputs = _load_ready_inputs(
                  output_root,
                  config,
                  base_model_path=base_model_path,
              )
              lambda_value = None
              if _uses_task_lambdas(config):
                  lambda_value = next(
                      value
                      for value in _task_lambdas(config, task)
                      if math.isclose(math.exp(-value), rho, rel_tol=0.0, abs_tol=1.0e-15)
                  )
              cell = Cell(
                  task,
                  METHOD_EXPONENTIAL,
                  rho,
                  int(config["sweep"]["tuning_seed"]),
                  "liveness",
                  lambda_value,
              )
          ''',
          )

          replace_once(
              tuning,
              '''    elif args.command == "liveness":
                  rho = args.rho
                  if args.lambda_value is not None:
                      rho = math.exp(-float(args.lambda_value))
                  if rho is None:
                      rho = _task_rhos(config, str(args.task))[0]
                  result = cmd_liveness(
                      config,
                      config_path,
                      output_root,
                      task=args.task,
                      rho=float(rho),
                      base_model_path=args.base_model_path,
                      force=bool(args.force),
                  )
          ''',
              '''    elif args.command == "liveness":
                  rho = args.rho
                  if args.lambda_value is not None:
                      rho = math.exp(-float(args.lambda_value))
                  if rho is None and not _is_coldstart(config):
                      rho = _task_rhos(config, str(args.task))[0]
                  result = cmd_liveness(
                      config,
                      config_path,
                      output_root,
                      task=args.task,
                      rho=None if rho is None else float(rho),
                      base_model_path=args.base_model_path,
                      force=bool(args.force),
                  )
          ''',
          )

          runner = "scripts/run_e8_multitask_exp_coldstart.sh"
          replace_once(
              runner,
              '''liveness() {
            check_source
            activate_runtime
            CUDA_VISIBLE_DEVICES=0 LOCAL_RANK=0 run_module liveness \\
              --task countdown \\
              --lambda 0.916290732 \\
              --base-model-path "${MODEL_DIR}"
          }
          ''',
              '''liveness() {
            check_source
            activate_runtime
            CUDA_VISIBLE_DEVICES=0 LOCAL_RANK=0 run_module liveness \\
              --task countdown \\
              --base-model-path "${MODEL_DIR}"
          }
          ''',
          )

          tests = "tests/test_e8_multitask_p0.py"
          replace_once(
              tests,
              '''    assert "--lambda 0.916290732" in runner
              assert "--lambda 0.693147181" not in runner
          ''',
              '''    liveness = runner.split("\\nliveness() {\\n", 1)[1].split("\\nrun_queue() {\\n", 1)[0]
              assert "--lambda " not in liveness
          ''',
          )

          test_path = Path(tests)
          text = test_path.read_text(encoding="utf-8")
          marker = "def test_coldstart_liveness_identity_is_derived_from_canonical_smoke_grid()"
          if marker in text:
              raise SystemExit("liveness regression tests already present")
          text += '''


def test_coldstart_liveness_identity_is_derived_from_canonical_smoke_grid() -> None:
    import inspect

    from drpo import e8_multitask_exp_tuning as exp_tuning

    config = exp_tuning.load_config(
        Path("configs/e8_multitask_exp_lambda_curve_completion.yaml")
    )
    grid_path = exp_tuning._canonical_paths(config)["round1_grid"]
    cell = exp_tuning._canonical_cold_liveness_cell(grid_path)
    grid = yaml.safe_load(grid_path.read_text(encoding="utf-8"))
    expected_c = float(grid["execution"]["liveness"]["representative_c"])
    expected_seed = int(grid["sweep"]["seed_offsets"][0])

    assert cell.task == "countdown"
    assert cell.method == exp_tuning.METHOD_EXPONENTIAL
    assert cell.lambda_value == pytest.approx(expected_c)
    assert cell.rho == pytest.approx(math.exp(-expected_c))
    assert cell.seed == expected_seed
    assert cell.stage == "liveness"
    assert not math.isclose(expected_c, 0.916290732, rel_tol=0.0, abs_tol=1.0e-12)

    source = inspect.getsource(exp_tuning._cmd_canonical_cold_liveness)
    assert "cell = _canonical_cold_liveness_cell(grid_path)" in source


def test_coldstart_liveness_cli_path_needs_no_scientific_grid_selector(
    tmp_path: Path, monkeypatch: pytest.MonkeyPatch
) -> None:
    from drpo import e8_multitask_exp_tuning as exp_tuning

    config = exp_tuning.load_config(
        Path("configs/e8_multitask_exp_lambda_curve_completion.yaml")
    )
    fake_inputs = {task: object() for task in config["suite"]["tasks"]}
    monkeypatch.setattr(
        exp_tuning,
        "_load_ready_inputs",
        lambda *args, **kwargs: ({"tasks": {}}, fake_inputs),
    )
    observed: dict[str, object] = {}

    def fake_canonical(
        config_arg,
        config_path,
        output_root,
        *,
        inputs,
        splits,
        base_model_path,
        force,
    ):
        observed.update(
            {
                "config": config_arg,
                "config_path": config_path,
                "output_root": output_root,
                "inputs": inputs,
                "splits": splits,
                "base_model_path": base_model_path,
                "force": force,
            }
        )
        return {"complete": True}

    monkeypatch.setattr(exp_tuning, "_cmd_canonical_cold_liveness", fake_canonical)
    result = exp_tuning.cmd_liveness(
        config,
        Path("configs/e8_multitask_exp_lambda_curve_completion.yaml"),
        tmp_path,
        task="countdown",
        rho=None,
        base_model_path=str(tmp_path / "model"),
        force=False,
    )

    assert result == {"complete": True}
    assert observed["inputs"] is fake_inputs["countdown"]
    runner = Path("scripts/run_e8_multitask_exp_coldstart.sh").read_text(encoding="utf-8")
    liveness = runner.split("\\nliveness() {\\n", 1)[1].split("\\nrun_queue() {\\n", 1)[0]
    assert "--lambda " not in liveness
'''
          test_path.write_text(text, encoding="utf-8")

          protocol = Path("docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md")
          protocol_text = protocol.read_text(encoding="utf-8")
          heading = "## 2026-09-03 canonical liveness identity alignment"
          if heading in protocol_text:
              raise SystemExit("protocol closure already present")
          protocol_text += f'''\n\n{heading}\n\nA final pre-independent-review audit found that the shared shell passed `--lambda 0.916290732` into the outer liveness selector while the byte-locked canonical `paper_runtime.smoke()` actually derives its representative cell from the round-1 grid, where `execution.liveness.representative_c=0.693147181` and the first frozen seed offset is `4000`. The smoke itself was correct, but the wrapper `Cell` used for the liveness manifest could therefore claim a different coefficient from the cell actually executed.\n\nThe repair removes the shell-level scientific-grid selector from cold-start liveness. Cold-start `cmd_liveness()` now delegates directly to the canonical smoke path, and the wrapper identity is derived from the exact materialized round-1 grid passed to `paper_runtime.smoke()`. Non-cold-start liveness retains its existing rho/grid behavior. This does **not** introduce `0.693147181` as a new E8 scientific gate or mutable experiment parameter; it records the already byte-locked smoke specification as the provenance of the engineering liveness action that actually ran.\n\nNo tracked scientific config, data volume, seed, lambda grid, optimizer/training formula, canonical paper loss/trainer, task-performance metric, result status, or method ranking is changed. No scientific experiment is launched.\n'''
          protocol.write_text(protocol_text, encoding="utf-8")
          PY

      - name: Install lightweight validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip install --disable-pip-version-check \
            "numpy==1.26.4" "PyYAML==6.0.2" "pytest==8.3.5" "ruff==0.9.10"

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            scripts/preflight_e8_multitask_config.py \
            tests/test_e8_multitask_p0.py
          ruff check \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            scripts/preflight_e8_multitask_config.py \
            tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh
          git diff --check

      - name: Config preflights
        shell: bash
        run: |
          set -euo pipefail
          for config in \
            configs/e8_multitask_exp_coldstart.yaml \
            configs/e8_multitask_exp_lambda_completion.yaml \
            configs/e8_multitask_exp_lambda_curve_completion.yaml
          do
            python scripts/preflight_e8_multitask_config.py --repo-root . --config "${config}" >/dev/null
          done

      - name: Focused E8 tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_e8_multitask_p0.py

      - name: Artifact protocol tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_experiment_artifact_protocol.py \
            tests/test_experiment_artifact_hardening.py

      - name: Repository tests excluding two known baseline failures
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            --deselect tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells \
            --deselect tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test

      - name: Confirm narrow change surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 733b132bcdec0bc1ccb11128a465b1b9cff0f0a1 -- configs/
          git diff --quiet 733b132bcdec0bc1ccb11128a465b1b9cff0f0a1 -- \
            src/drpo/countdown_qwen_arena_onefile.py \
            src/drpo/countdown_e8_alpha1_c_scan_common.py \
            src/drpo/countdown_e8_alpha1_c_scan_runtime.py \
            src/drpo/countdown_e8_alpha1_c_scan_trainer.py \
            src/drpo/countdown_e8_alpha1_highc_scan_common.py \
            src/drpo/countdown_e8_alpha1_highc_scan_runtime.py

      - name: Commit validated repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/e8-liveness-identity-fix-once.yml
          git add \
            src/drpo/e8_multitask_exp_tuning.py \
            scripts/run_e8_multitask_exp_coldstart.sh \
            tests/test_e8_multitask_p0.py \
            docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md
          git diff --cached --check
          git commit -m "fix(e8): align liveness identity with canonical smoke"
          git push origin HEAD:dev/e8-config-driven-sweep-01
