name: TEMP fix KDD Figure 1 workflow output capture

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'dev/paper-kdd2027-fig1-float-placement-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/paper-kdd2027-fig1-float-placement-01
          fetch-depth: 0
      - name: Fix deterministic hash handoff and remove fixer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/temp-apply-kdd-fig1-float-placement.yml')
          text = path.read_text(encoding='utf-8')
          old_redirect = "python - <<'PY' > /tmp/fig1_hashes.env"
          new_redirect = "python - <<'PY'"
          if text.count(old_redirect) != 1:
              raise SystemExit('unexpected Python heredoc redirect count')
          text = text.replace(old_redirect, new_redirect, 1)
          old_prints = '''          print(f"SOURCE_SHA={new_source}")
          print(f"CONTENT_SHA={new_content}")
          print(f"MAIN_SHA={hashlib.sha256(generated_main.encode()).hexdigest()}")'''
          new_prints = '''          Path("/tmp/fig1_hashes.env").write_text(
              "\\n".join(
                  [
                      f"SOURCE_SHA={new_source}",
                      f"CONTENT_SHA={new_content}",
                      f"MAIN_SHA={hashlib.sha256(generated_main.encode()).hexdigest()}",
                  ]
              )
              + "\\n",
              encoding="utf-8",
          )'''
          if text.count(old_prints) != 1:
              raise SystemExit('unexpected hash print block count')
          path.write_text(text.replace(old_prints, new_prints, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/temp-fix-kdd-fig1-workflow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'TEMP: fix Figure 1 workflow hash handoff'
          git push origin HEAD:dev/paper-kdd2027-fig1-float-placement-01
