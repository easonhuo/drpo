name: TEMP fix KDD Figure 1 workflow output capture

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'dev/paper-kdd2027-fig1-float-placement-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/paper-kdd2027-fig1-float-placement-01
          fetch-depth: 0
      - name: Fix deterministic hash handoff and remove fixers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/temp-apply-kdd-fig1-float-placement.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace("python - <<'PY' > /tmp/fig1_hashes.env", "python - <<'PY'", 1)
          start_token = '          print(f"SOURCE_SHA={new_source}")\n'
          end_token = '          PY\n'
          start = text.index(start_token)
          end = text.index(end_token, start)
          replacement = '''          Path("/tmp/fig1_hashes.env").write_text(
              "\\n".join(
                  [
                      f"SOURCE_SHA={new_source}",
                      f"CONTENT_SHA={new_content}",
                      f"MAIN_SHA={hashlib.sha256(generated_main.encode()).hexdigest()}",
                  ]
              )
              + "\\n",
              encoding="utf-8",
          )
'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/temp-fix-kdd-fig1-workflow.yml
          rm -f .github/workflows/temp-fix2-kdd-fig1-workflow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'TEMP: robustly fix Figure 1 workflow hash handoff'
          git push origin HEAD:dev/paper-kdd2027-fig1-float-placement-01
