name: E8 Second Audit Docs Once

on:
  push:
    branches:
      - dev/e8-config-driven-sweep-01

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0
      - name: Apply docs-first second-audit closure
        run: bash scripts/.tmp_e8_second_audit_docs.sh
