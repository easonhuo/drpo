name: E8 PR360 Artifact Split

on:
  push:
    branches:
      - dev/e8-multitask-artifact-split-01

permissions:
  contents: write

jobs:
  transform-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-artifact-split-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Recover and run transformation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/e8_pr360_transform_source.txt').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Structural checks"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          raw = source[start:end]
          output = []
          in_artifact_literal = False
          for line in raw.splitlines():
              if in_artifact_literal:
                  output.append(line)
                  if line == "'''":
                      in_artifact_literal = False
                  continue
              clean = line[10:] if line.startswith('          ') else line
              output.append(clean)
              if clean == "artifact_block = r'''":
                  in_artifact_literal = True
          Path('/tmp/e8_pr360_transform.py').write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          python /tmp/e8_pr360_transform.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/drpo/e8_multitask_exp_tuning.py')
          text = path.read_text(encoding='utf-8')
          old = 'from pathlib import Path, PurePosixPath\n'
          if old not in text:
              raise SystemExit('expected stale PurePosixPath import was not found')
          path.write_text(text.replace(old, 'from pathlib import Path\n', 1), encoding='utf-8')
          PY
      - name: Structural checks
        shell: bash
        run: |
          grep -q '^PACKAGE_REQUIRED_MEMBERS = e8_results.PACKAGE_REQUIRED_MEMBERS' src/drpo/e8_multitask_exp_tuning.py
          grep -q '^# Artifact/package ownership' src/drpo/e8_multitask_results.py
          grep -q '^def verify_result_package' src/drpo/e8_multitask_results.py
          grep -q '^def cmd_package' src/drpo/e8_multitask_results.py
          grep -q '^def cmd_finalize' src/drpo/e8_multitask_results.py
          python - <<'PY'
          import ast
          from pathlib import Path
          main = ast.parse(Path('src/drpo/e8_multitask_exp_tuning.py').read_text())
          results = ast.parse(Path('src/drpo/e8_multitask_results.py').read_text())
          names = {'_write_completion_manifests', '_result_payload_paths', 'verify_result_package', 'cmd_package', 'cmd_finalize'}
          main_defs = {n.name: n for n in main.body if isinstance(n, ast.FunctionDef) and n.name in names}
          result_defs = {n.name: n for n in results.body if isinstance(n, ast.FunctionDef) and n.name in names}
          assert set(main_defs) == names
          assert set(result_defs) == names
          assert all((node.end_lineno - node.lineno + 1) <= 18 for node in main_defs.values())
          PY
      - name: Python compile
        run: python -m py_compile src/drpo/e8_multitask_results.py src/drpo/e8_multitask_exp_tuning.py
      - name: Engineering self-test regression
        run: python -m pytest -q tests/test_e8_multitask_p0.py::test_coldstart_engineering_self_test_exercises_208_cell_recovery_and_dynamic_refill
      - name: Focused E8 tests excluding timing-sensitive scheduler probe
        run: >-
          python -m pytest -q tests/test_e8_multitask_p0.py
          -k 'not test_exp_coldstart_scheduler_refills_without_nominal_batch_barriers'
      - name: Scheduler timing probe repeated
        shell: bash
        run: |
          for attempt in 1 2 3; do
            python -m pytest -q tests/test_e8_multitask_p0.py::test_exp_coldstart_scheduler_refills_without_nominal_batch_barriers
          done
      - name: Method integration contract
        run: bash tests/test_e8_method_integration_contract.sh
      - name: Ruff changed Python files
        run: python -m ruff check src/drpo/e8_multitask_results.py src/drpo/e8_multitask_exp_tuning.py
      - name: Handoff authority
        run: python scripts/handoff_authority.py verify --repo-root .
      - name: Governance stage validation
        run: python scripts/validate_governance_pipeline_stage_status.py --repo-root .
      - name: Broad pytest excluding characterized base failures and timing probe
        run: >-
          python -m pytest -q
          -k 'not test_exp_coldstart_scheduler_refills_without_nominal_batch_barriers and not test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells and not test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test'
      - name: Report line counts
        run: wc -l src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_results.py
      - name: Commit successful split and remove temporary files
        shell: bash
        run: |
          git config user.name "easonhuo"
          git config user.email "huoyusen1@126.com"
          git add src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_results.py
          git commit -m "Refactor E8 artifact packaging into results module"
          git rm .github/workflows/e8_pr360_artifact_split.yml .github/e8_pr360_transform_source.txt
          git commit -m "Remove temporary PR360 validation files"
          git push origin HEAD:dev/e8-multitask-artifact-split-01
