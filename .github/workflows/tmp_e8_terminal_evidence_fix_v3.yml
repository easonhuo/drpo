name: Temporary E8 terminal evidence hardening v3

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/tmp_e8_terminal_evidence_fix_v3.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install validation dependencies
        run: python -m pip install pyyaml pytest ruff numpy
      - name: Complete scoped terminal evidence hardening
        shell: bash
        run: |
          set -euo pipefail
          # The v1 patch intentionally stopped on its first regression failure.
          # Reapply it in this fresh checkout, retain its docs-first local commit,
          # then narrow the stronger terminal binding to the new formal baseline matrix.
          bash .github/workflows/tmp_e8_terminal_evidence_fix.sh || true
          python - <<'PY'
          from pathlib import Path
          path = Path('src/drpo/e8_multitask_exp_tuning.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if artifact_path is None:
                      return True
                  if not _completed_workload_terminal_evidence_matches(
                      config, workload_root, source_commit=source_commit
                  ):
                      return False
                  prefix = f"results/{expected_id}"
                  workload_members = (
                      "source_provenance.json",
                      "prepare_manifest.json",
                      "scheduler/dynamic_run.json",
                      "aggregate/aggregate_summary.json",
                      "aggregate/plot_curve_points.csv",
                      "terminal_audit.json",
                      "run_manifest.json",
                      "scientific_run_manifest.json",
                      "RUN_COMPLETE.json",
                  )
          '''
          # YAML block indentation is stripped by GitHub Actions before bash; the
          # Python heredoc itself sees the intended source indentation below.
          old = old.replace('                  ', '')
          new = '''        if artifact_path is None:
              return True
          baseline_terminal_binding = _is_baseline_matrix(config)
          if baseline_terminal_binding and not _completed_workload_terminal_evidence_matches(
              config, workload_root, source_commit=source_commit
          ):
              return False
          prefix = f"results/{expected_id}"
          workload_members = (
              (
                  "source_provenance.json",
                  "prepare_manifest.json",
                  "scheduler/dynamic_run.json",
                  "aggregate/aggregate_summary.json",
                  "aggregate/plot_curve_points.csv",
                  "terminal_audit.json",
                  "run_manifest.json",
                  "scientific_run_manifest.json",
                  "RUN_COMPLETE.json",
              )
              if baseline_terminal_binding
              else ("source_provenance.json", "prepare_manifest.json")
          )
          '''
          new = new.replace('          ', '')
          if old not in text:
              raise SystemExit('expected completed-attempt block not found after v1 patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py
          ruff check src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python scripts/handoff_authority.py verify --repo-root .
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .
          git diff --check
          git add src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git diff --cached --check
          git commit -m 'fix: bind E8 completed attempt terminal evidence'
          git rm \
            .github/workflows/tmp_e8_terminal_evidence_fix.sh \
            .github/workflows/tmp_e8_terminal_evidence_fix.yml \
            .github/workflows/tmp_e8_terminal_evidence_fix_v2.yml \
            .github/workflows/tmp_e8_terminal_evidence_fix_v3.yml
          git commit -m 'chore: remove temporary E8 terminal evidence transport'
          git push origin HEAD:dev/e8-multitask-baselines-capability-01
