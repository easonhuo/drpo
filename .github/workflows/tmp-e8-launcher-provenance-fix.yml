name: Temporary E8 launcher provenance fix

on:
  push:
    branches:
      - dev/e8-multitask-lambda-completion-clean-05

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-lambda-completion-clean-05
          fetch-depth: 0

      - name: Apply one-time launcher governance and provenance fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          launcher_path = Path("scripts/run_e8_multitask_exp_coldstart.sh")
          text = launcher_path.read_text(encoding="utf-8")

          anchor = '''fail() {
            echo "ERROR: $*" >&2
            exit 2
          }

          is_expected_origin() {
          '''
          replacement = '''fail() {
            echo "ERROR: $*" >&2
            exit 2
          }

          resolve_config_repo_path() {
            command -v python3 >/dev/null || fail "python3 is unavailable"
            local resolved
            resolved="$(python3 - "${ROOT_DIR}" "${CONFIG_PATH}" <<'PY_CONFIG'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1]).resolve()
          candidate = Path(sys.argv[2])
          if not candidate.is_absolute():
              candidate = root / candidate
          path = candidate.resolve()
          try:
              relative = path.relative_to(root)
          except ValueError as exc:
              raise SystemExit(f"config path escapes repository: {path}") from exc
          if not path.is_file():
              raise SystemExit(f"config file is missing: {path}")
          print(relative.as_posix())
          PY_CONFIG
          )" || fail "config path must resolve to a tracked file inside the repository: ${CONFIG_PATH}"
            CONFIG_REPO_PATH="${resolved}"
            CONFIG_PATH="${ROOT_DIR}/${CONFIG_REPO_PATH}"
            export CONFIG_REPO_PATH CONFIG_PATH
          }

          is_expected_origin() {
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f"resolver insertion anchor count={text.count(anchor)}")
          text = text.replace(anchor, replacement, 1)

          clean_anchor = '''    fail "source checkout must be fully clean; keep runtime files outside the repository"
          }

          activate_runtime() {
          '''
          clean_replacement = '''    fail "source checkout must be fully clean; keep runtime files outside the repository"
            resolve_config_repo_path
            git -C "${ROOT_DIR}" cat-file -e "${EXPECTED_COMMIT}:${CONFIG_REPO_PATH}" 2>/dev/null || \\
              fail "runtime config is unavailable at launch commit ${EXPECTED_COMMIT}: ${CONFIG_REPO_PATH}"
          }

          activate_runtime() {
          '''
          if text.count(clean_anchor) != 1:
              raise SystemExit(f"check_source anchor count={text.count(clean_anchor)}")
          text = text.replace(clean_anchor, clean_replacement, 1)

          literal = '--source-file configs/e8_multitask_exp_coldstart.yaml'
          if text.count(literal) != 3:
              raise SystemExit(f"expected 3 hard-coded config snapshot paths, found {text.count(literal)}")
          text = text.replace(literal, '--source-file "${CONFIG_REPO_PATH}"')

          legacy_anchor = '\nrequire_registered_ready() {\n'
          if text.count(legacy_anchor) != 1:
              raise SystemExit("legacy helper anchor drifted")
          text = text.replace(
              legacy_anchor,
              '\n# Legacy pre-GOV-EXPERIMENT-LAUNCH-SIMPLIFICATION-01 audit helper retained for provenance only.\n# The normal full launch path below no longer treats registry/READY/channel state as permission.\nrequire_registered_ready() {\n',
              1,
          )

          full_anchor = '''guarded_full() {
            require_registered_ready
            ensure_setup
            validate_registered_channel
            command -v flock >/dev/null || fail "flock is required for single-writer recovery safety"
          '''
          full_replacement = '''guarded_full() {
            check_source
            ensure_setup
            command -v flock >/dev/null || fail "flock is required for single-writer recovery safety"
          '''
          if text.count(full_anchor) != 1:
              raise SystemExit(f"guarded_full anchor count={text.count(full_anchor)}")
          text = text.replace(full_anchor, full_replacement, 1)
          launcher_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_e8_multitask_p0.py")
          tests = test_path.read_text(encoding="utf-8")
          test_anchor = '''    assert 'export E8_COLDSTART_EXPERIMENT_ID="EXT-C-E8-MULTITASK-EXP-LAMBDA-COMPLETION-01"' in successor_launcher
              assert 'EXPERIMENT_ID="${E8_COLDSTART_EXPERIMENT_ID:-EXT-C-E8-MULTITASK-EXP-COLDSTART-01}"' in historical_launcher
              for task in config["suite"]["p0_tasks"]:
          '''.replace("              ", "    ")
          test_replacement = '''    assert 'export E8_COLDSTART_EXPERIMENT_ID="EXT-C-E8-MULTITASK-EXP-LAMBDA-COMPLETION-01"' in successor_launcher
              assert 'EXPERIMENT_ID="${E8_COLDSTART_EXPERIMENT_ID:-EXT-C-E8-MULTITASK-EXP-COLDSTART-01}"' in historical_launcher
              guarded_full_body = historical_launcher.split("guarded_full() {", 1)[1].split("\\n}", 1)[0]
              assert "require_registered_ready" not in guarded_full_body
              assert "validate_registered_channel" not in guarded_full_body
              assert "check_source" in guarded_full_body
              assert "resolve_config_repo_path" in historical_launcher
              assert '--source-file "${CONFIG_REPO_PATH}"' in historical_launcher
              assert "--source-file configs/e8_multitask_exp_coldstart.yaml" not in historical_launcher
              assert '"${EXPECTED_COMMIT}:${CONFIG_REPO_PATH}"' in historical_launcher
              for task in config["suite"]["p0_tasks"]:
          '''.replace("              ", "    ")
          if tests.count(test_anchor) != 1:
              raise SystemExit(f"test insertion anchor count={tests.count(test_anchor)}")
          tests = tests.replace(test_anchor, test_replacement, 1)
          test_path.write_text(tests, encoding="utf-8")

          Path(".github/workflows/tmp-e8-launcher-provenance-fix.yml").unlink()
          PY

      - name: Validate patched tree
        shell: bash
        run: |
          git diff --check
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh
          python -m py_compile tests/test_e8_multitask_p0.py
          python -m pip install -q "numpy==1.26.4" "PyYAML==6.0.2" pytest ruff
          python -m pip install -q --no-deps -e .
          ruff check --select E9,F63,F7,F82 src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py
          python - <<'PY'
          from pathlib import Path
          launcher = Path("scripts/run_e8_multitask_exp_coldstart.sh").read_text()
          body = launcher.split("guarded_full() {", 1)[1].split("\n}", 1)[0]
          assert "require_registered_ready" not in body
          assert "validate_registered_channel" not in body
          assert "check_source" in body
          assert launcher.count('--source-file "${CONFIG_REPO_PATH}"') == 3
          assert "--source-file configs/e8_multitask_exp_coldstart.yaml" not in launcher
          PY

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "E8: retire legacy launch gates and bind config provenance"
          git push origin HEAD:dev/e8-multitask-lambda-completion-clean-05
