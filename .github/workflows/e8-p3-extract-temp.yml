name: E8 P3 Extract (temporary)

on:
  push:
    branches:
      - dev/e8-multitask-training-splits-01
    paths:
      - .github/workflows/e8-p3-extract-temp.yml

permissions:
  contents: write

jobs:
  extract-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Extract canonical bridge mechanically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import builtins
          import symtable
          from pathlib import Path

          main_path = Path('src/drpo/e8_multitask_exp_tuning.py')
          bridge_path = Path('src/drpo/e8_multitask_canonical_bridge.py')
          text = main_path.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          tree = ast.parse(text)

          candidate_names = [
              '_cold_train_paper', '_cold_train_dpo', '_run_canonical_method_liveness',
              '_run_dpo_method_liveness', '_paper_grid_paths_exponential',
              '_paper_params_reciprocal', '_paper_params_exponential',
              '_paper_params_asymre', '_paper_params_topr',
              '_canonical_cold_modules', '_activate_paper_grid_modules',
              '_canonical_task_record', '_paper_grid_for_cell',
              '_canonical_environment_evaluator', '_canonical_generic_posthoc',
              '_runtime_bridge_contract', '_legacy_arena_runtime_bridge',
              '_validated_runtime_grid', '_legacy_paper_runtime_bridge',
              '_canonical_baseline_grid_identity', '_normalized_adapter_config_sequence',
              '_dpo_shared_sft_adapter_identity', '_dpo_shared_sft_adapter',
              '_parameter_sequence_sha256', '_dpo_prompt_balanced_mean', '_dpo_quantile',
              '_is_nan_inf_numerical_failure', '_load_verified_canonical_calibration',
              '_train_canonical_dpo_transfer_cell', '_cmd_dpo_liveness',
              '_train_canonical_cold_cell', '_cmd_canonical_cold_liveness',
          ]
          candidate_set = set(candidate_names)
          nodes = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name in candidate_set
          }
          missing = candidate_set - nodes.keys()
          if missing:
              raise SystemExit(f'missing P3 candidates: {sorted(missing)}')

          def source_range(node: ast.FunctionDef | ast.AsyncFunctionDef) -> tuple[int, int]:
              first = node.lineno
              if node.decorator_list:
                  first = min(first, *(decorator.lineno for decorator in node.decorator_list))
              assert node.end_lineno is not None
              return first, node.end_lineno

          def source_for(node: ast.FunctionDef | ast.AsyncFunctionDef) -> str:
              start, end = source_range(node)
              return ''.join(lines[start - 1:end])

          builtin_names = set(dir(builtins))

          def globals_for(name: str, source: str) -> list[str]:
              table = symtable.symtable(source, f'<{name}>', 'exec')
              globals_used: set[str] = set()
              def walk(scope: symtable.SymbolTable) -> None:
                  for symbol in scope.get_symbols():
                      if symbol.is_referenced() and symbol.is_global():
                          globals_used.add(symbol.get_name())
                  for child in scope.get_children():
                      walk(child)
              walk(table)
              globals_used -= builtin_names
              globals_used -= candidate_set
              return sorted(globals_used)

          bridge_parts = [
              '"""Canonical cold-start compatibility bridge for E8 multitask.\n\n'
              'This module owns adaptation/dispatch only. Scientific kernels remain in the\n'
              'frozen canonical Countdown/paper modules. Dependencies on the composition root\n'
              'are supplied per call through CanonicalBridgeBindings; this module never imports\n'
              'e8_multitask_exp_tuning back and keeps no process-global host binding.\n'
              '"""\n\n',
              'from __future__ import annotations\n\n',
              'from dataclasses import dataclass\n',
              'from typing import Any, Callable\n\n\n',
              '@dataclass(frozen=True)\n',
              'class CanonicalBridgeBindings:\n',
              '    host: Any\n\n\n',
              '@dataclass(frozen=True)\n',
              'class CanonicalBridge:\n',
          ]
          for name in candidate_names:
              bridge_parts.append(f'    {name}: Callable[..., Any]\n')
          bridge_parts.append('\n\ndef build_bridge(bindings: CanonicalBridgeBindings) -> CanonicalBridge:\n')
          bridge_parts.append('    """Build one call-scoped bridge with explicit host dependencies."""\n')
          bridge_parts.append('    host = bindings.host\n\n')

          all_deps: set[str] = set()
          candidate_sources: dict[str, str] = {}
          for name in candidate_names:
              src = source_for(nodes[name])
              candidate_sources[name] = src
              all_deps.update(globals_for(name, src))
          for dep in sorted(all_deps):
              if dep in {'__name__', '__file__'}:
                  continue
              bridge_parts.append(f'    {dep} = host.{dep}\n')
          bridge_parts.append('\n')
          for name in candidate_names:
              indented = ''.join(
                  ('    ' + line if line.strip() else line)
                  for line in candidate_sources[name].splitlines(keepends=True)
              )
              bridge_parts.append(indented)
              if not indented.endswith('\n'):
                  bridge_parts.append('\n')
              bridge_parts.append('\n')
          bridge_parts.append('    return CanonicalBridge(\n')
          for name in candidate_names:
              bridge_parts.append(f'        {name}={name},\n')
          bridge_parts.append('    )\n')
          bridge_path.write_text(''.join(bridge_parts), encoding='utf-8')

          replacements: list[tuple[int, int, str]] = []
          for name in candidate_names:
              start, end = source_range(nodes[name])
              wrapper = (
                  f'def {name}(*args: Any, **kwargs: Any) -> Any:\n'
                  f'    return getattr(_canonical_bridge(), "{name}")(*args, **kwargs)\n'
              )
              replacements.append((start, end, wrapper))
          for start, end, wrapper in sorted(replacements, reverse=True):
              lines[start - 1:end] = [wrapper]
          updated = ''.join(lines)

          import_anchor = 'from drpo import e8_multitask_warmstart_training as e8_warmstart\n'
          if import_anchor not in updated:
              raise SystemExit('warmstart import anchor missing')
          updated = updated.replace(
              import_anchor,
              import_anchor + 'from drpo import e8_multitask_canonical_bridge as e8_canonical_bridge\n',
              1,
          )
          helper_anchor = '_load_task_adapter_and_instances = e8_inputs._load_task_adapter_and_instances\n\n'
          helper = (
              '_load_task_adapter_and_instances = e8_inputs._load_task_adapter_and_instances\n\n\n'
              'def _canonical_bridge() -> e8_canonical_bridge.CanonicalBridge:\n'
              '    return e8_canonical_bridge.build_bridge(\n'
              '        e8_canonical_bridge.CanonicalBridgeBindings(host=sys.modules[__name__])\n'
              '    )\n\n'
          )
          if helper_anchor not in updated:
              raise SystemExit('composition helper anchor missing')
          updated = updated.replace(helper_anchor, helper, 1)
          main_path.write_text(updated, encoding='utf-8')

          # The implementation must exist only in the bridge; main keeps thin delegates.
          reparsed = ast.parse(updated)
          for node in reparsed.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in candidate_set:
                  if len(node.body) != 1 or not isinstance(node.body[0], ast.Return):
                      raise SystemExit(f'{node.name} is not a thin P3 delegate')
          print(f'bridge_lines={len(bridge_path.read_text().splitlines())}')
          print(f'main_lines={len(updated.splitlines())}')
          print(f'candidate_functions={len(candidate_names)}')
          print('bound_dependencies=', ','.join(sorted(all_deps)))
          PY

      - name: Compile and focused regression
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_selftest.py \
            src/drpo/e8_multitask_warmstart_training.py \
            src/drpo/e8_multitask_canonical_bridge.py
          python -m pytest tests/test_e8_multitask_p0.py -q
          bash tests/test_e8_method_integration_contract.sh
          ruff check \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_selftest.py \
            src/drpo/e8_multitask_warmstart_training.py \
            src/drpo/e8_multitask_canonical_bridge.py
          git diff --check

      - name: Broad regression excluding only base-proven failures
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            --deselect=tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells \
            --deselect=tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test

      - name: Commit validated P3 extraction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/e8-p3-extract-temp.yml
          git add src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_canonical_bridge.py
          git config user.name 'drpo-p3-extraction-bot'
          git config user.email 'drpo-p3-extraction-bot@users.noreply.github.com'
          git commit -m 'refactor: extract E8 canonical cold-start bridge'
          git push origin HEAD:dev/e8-multitask-training-splits-01
