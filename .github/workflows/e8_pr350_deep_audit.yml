name: E8 PR350 deep audit

on:
  push:
    branches:
      - dev/e8-remove-source-snapshot-gate-01

permissions:
  contents: write

jobs:
  deep-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest==8.3.5 numpy==1.26.4 PyYAML==6.0.2 ruff==0.9.10
      - name: Run deep audit
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          python -m py_compile src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py scripts/artifact_protocol_hardened.py
          python scripts/preflight_e8_multitask_config.py --repo-root . --config configs/e8_multitask_baseline_matrix_formal.yaml >/tmp/e8_pr350_preflight.json
          python -m pytest -q tests/test_e8_multitask_p0.py tests/test_experiment_artifact_hardening.py
          python -m ruff check src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python - <<'PY'
          from pathlib import Path
          runner = Path('scripts/run_e8_multitask_exp_coldstart.sh').read_text(encoding='utf-8')
          tuning = Path('src/drpo/e8_multitask_exp_tuning.py').read_text(encoding='utf-8')
          for start, end, label in [
              ('\nrun_formal_guard_attempt() {\n', '\nreport_formal_success() {\n', 'formal guard'),
              ('\nengineering_self_test() {\n', '\nprepare() {\n', 'engineering self-test'),
              ('\ndelivery_preflight() {\n', '\nguarded_full_internal() {\n', 'delivery preflight'),
          ]:
              block = runner.split(start, 1)[1].split(end, 1)[0]
              assert '--source-file' not in block, label
          checkpoint = tuning.split('\ndef _publish_recovery_checkpoint(\n', 1)[1].split('\ndef cmd_compact_logs(', 1)[0]
          assert '--source-file' not in checkpoint, 'recovery checkpoint'
          assert 'CONFIG_SOURCE_ARGS' not in runner
          PY
          git diff --check 4deb00030426446cc3b66efc0e31b875c3f41698...HEAD
      - name: Remove temporary audit workflow
        if: success()
        run: |
          git rm .github/workflows/e8_pr350_deep_audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary PR350 deep-audit workflow"
          git push origin HEAD:dev/e8-remove-source-snapshot-gate-01
