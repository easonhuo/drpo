name: E8 Final Correctness Apply Once

on:
  push:
    branches:
      - dev/e8-config-driven-sweep-01
    paths:
      - .github/workflows/e8-final-correctness-apply-once.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify starting after-image
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "20d6b1d3c338774475fcc8446f2a4f6e43c42651"
          test "$(git rev-parse HEAD^^^^)" = "3e4ebd8ea77af9769445e17ecae1b138d4461233"
          git diff --quiet origin/main -- .github/workflows/code-change-budget.yml

      - name: Apply source repairs
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("src/drpo/e8_experiment_config.py"); s=p.read_text(); old="        \"selection\": (\"finite_required\", \"report_grid_edge\"),\n"; assert s.count(old)==1; p.write_text(s.replace(old,"",1))'
          python -c 'from pathlib import Path; p=Path("src/drpo/e8_experiment_config.py"); s=p.read_text(); old="    evaluation = config[\"evaluation\"]\n    if (\n        evaluation.get(\"primary_checkpoint_policy\") != \"late_window_and_terminal\"\n        or evaluation.get(\"best_checkpoint_role\") != \"supplementary_only\"\n    ):\n        raise ValueError(\"Cold-start checkpoint-selection mode is not implemented\")\n\n"; assert s.count(old)==1; p.write_text(s.replace(old,"",1))'
          python -c 'from pathlib import Path; p=Path("src/drpo/e8_experiment_config.py"); s=p.read_text(); old="    selection = config[\"selection\"]\n    if (\n        selection.get(\"primary_metric\") != \"validation_late_window_pass8_mean\"\n        or selection.get(\"finite_required\") is not True\n        or selection.get(\"report_grid_edge\") is not True\n        or selection.get(\"terminal_valid_rate_role\") != \"diagnostic_only_not_selection_eligibility\"\n        or tuple(selection.get(\"tie_breakers\", ()))\n        != (\n            \"validation_terminal_pass8\",\n            \"validation_late_window_greedy_mean\",\n            \"smaller_lambda\",\n        )\n    ):\n        raise ValueError(\"Cold-start selection mode is not implemented\")\n\n"; assert s.count(old)==1; p.write_text(s.replace(old,"",1))'
          python -c 'from pathlib import Path; p=Path("src/drpo/e8_multitask_exp_tuning.py"); s=p.read_text(); old="def sweep_profile(config: Mapping[str, Any]) -> str:\n    return str(config.get(\"sweep\", {}).get(\"profile\", SWEEP_PROFILE_RHO))\n"; new="def sweep_profile(config: Mapping[str, Any]) -> str:\n    return experiment_config.sweep_profile(config)\n"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("scripts/run_e8_multitask_exp_coldstart.sh"); s=p.read_text(); assert s.count("--lambda 0.693147181")==1; p.write_text(s.replace("--lambda 0.693147181","--lambda 0.916290732",1))'
          python -c 'from pathlib import Path; p=Path("scripts/run_e8_multitask_exp_coldstart.sh"); s=p.read_text(); bs=chr(92); d=chr(36); old=f"    --source-file src/drpo/e8_multitask_exp_tuning.py {bs}\n    --source-file \"{d}{{CONFIG_REPO_PATH}}\" {bs}\n"; parts=old.splitlines(True); new=parts[0]+f"    --source-file src/drpo/e8_experiment_config.py {bs}\n    --source-file scripts/preflight_e8_multitask_config.py {bs}\n"+parts[1]; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'

      - name: Add exact regression coverage
        run: |
          cat >> tests/test_e8_multitask_p0.py <<'PYTEST'


          def test_final_correctness_audit_after_image() -> None:
              from drpo import e8_multitask_exp_tuning as exp_tuning

              config = exp_tuning.load_config(Path("configs/e8_multitask_exp_lambda_curve_completion.yaml"))
              config["experiment_id"] = "EXT-C-E8-MULTITASK-FINAL-CORRECTNESS-TEST"
              config["evaluation"]["primary_checkpoint_policy"] = "report_only_metadata"
              config["evaluation"]["best_checkpoint_role"] = "report_only_metadata"
              config["selection"]["primary_metric"] = "report_only_metadata"
              config["selection"]["finite_required"] = False
              config["selection"]["report_grid_edge"] = False
              config["selection"]["terminal_valid_rate_role"] = "report_only_metadata"
              config["selection"]["tie_breakers"] = []
              exp_tuning.validate_config(config)

              runner = Path("scripts/run_e8_multitask_exp_coldstart.sh").read_text(encoding="utf-8")
              formal = runner.split("\nrun_formal_guard_attempt() {\n", 1)[1].split(
                  "\nreport_formal_success() {\n", 1
              )[0]
              assert "--source-file src/drpo/e8_experiment_config.py" in formal
              assert "--source-file scripts/preflight_e8_multitask_config.py" in formal
              assert "--lambda 0.916290732" in runner
              assert "--lambda 0.693147181" not in runner
              assert exp_tuning.sweep_profile(config) == "eight_task_coldstart_lambda_v1"
          PYTEST

      - name: Update protocol current override
        run: |
          set -euo pipefail
          sed -i 's|^Status: third adversarial audit closure specified / implementation repair pending / final-head repository gates pending / independent review pending / not a scientific result\.$|Status: latest correctness repair applied / focused final-head checks pending this repair run / independent review pending / not a scientific result.|' docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md
          grep -Fqx 'Status: latest correctness repair applied / focused final-head checks pending this repair run / independent review pending / not a scientific result.' docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md
          cat >> docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md <<'PROTOCOL'


          ## 2026-09-02 final correctness after-image correction

          This section supersedes the remaining inconsistent implementation details found after gate liquidation. It does not change scientific variables, historical configs, the canonical paper trainer/loss, or any scientific result.

          - Formal raw guarded-run provenance includes both approved config-authority Python paths: `src/drpo/e8_experiment_config.py` and `scripts/preflight_e8_multitask_config.py`; delivery-preflight provenance is no longer the only place that records them.
          - Residual runtime rejection of reporting/selection-policy declarations is removed. The actual canonical selection/reporting behavior remains implemented by the existing runtime; this change only removes the unapproved second policy lock.
          - The post-audit hard-coded Countdown liveness coefficient `0.693147181` is reverted to the pre-audit/main runner value `0.916290732`; no new exact liveness identity is introduced.
          - `e8_multitask_exp_tuning.sweep_profile()` delegates to the approved config-authority module rather than re-parsing the same field.
          - This remains engineering-only evidence. No model training, GPU sweep, task-performance result, support/variance-boundary result, numerical-collapse result, convergence result, significance result, or method ranking is produced.
          PROTOCOL

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q "numpy==1.26.4" "PyYAML==6.0.2" "pytest>=8,<9" "ruff>=0.9,<1"

      - name: Format and static checks
        run: |
          set -euo pipefail
          ruff format src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python -m py_compile src/drpo/e8_experiment_config.py scripts/preflight_e8_multitask_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          ruff check src/drpo/e8_experiment_config.py scripts/preflight_e8_multitask_config.py tests/test_e8_multitask_p0.py
          ruff format --check src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py scripts/preflight_e8_multitask_config.py tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh

      - name: Focused E8 regression
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m pytest -q tests/test_e8_multitask_p0.py | tee /tmp/e8-focused.log
          PYTHONPATH=src python -m pytest -q tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py -k 'not reciprocal and not asymre' | tee /tmp/e8-countdown.log

      - name: Real config preflights and governance verification
        run: |
          set -euo pipefail
          for config in configs/e8_multitask_exp_coldstart.yaml configs/e8_multitask_exp_lambda_completion.yaml configs/e8_multitask_exp_lambda_curve_completion.yaml; do
            PYTHONPATH=src python scripts/preflight_e8_multitask_config.py --repo-root . --config "$config" >/dev/null
          done
          python scripts/handoff_authority.py verify --repo-root .
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .
          git diff --check
          git diff --quiet origin/main -- .github/workflows/code-change-budget.yml

      - name: Record validation evidence
        env:
          RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          FOCUSED_SUMMARY="$(awk 'NF{line=$0} END{print line}' /tmp/e8-focused.log)"
          COUNTDOWN_SUMMARY="$(awk 'NF{line=$0} END{print line}' /tmp/e8-countdown.log)"
          sed -i 's|^Status: latest correctness repair applied / focused final-head checks pending this repair run / independent review pending / not a scientific result\.$|Status: latest correctness repair applied / focused final-head checks passed / independent review pending / not a scientific result.|' docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md
          printf '\nLatest correctness validation run: `%s`. Focused E8: `%s`; Countdown subset: `%s`. Python compilation, Ruff, shell syntax, three real config preflights, handoff authority, governance-stage validation, `git diff --check`, and the #340 no-diff check for `.github/workflows/code-change-budget.yml` all passed in the same run.\n' "$RUN_ID_VALUE" "$FOCUSED_SUMMARY" "$COUNTDOWN_SUMMARY" >> docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md

      - name: Commit verified after-image and remove temporary workflows
        run: |
          set -euo pipefail
          rm .github/workflows/e8-final-correctness-fix-once.yml
          rm .github/workflows/e8-final-correctness-fix-retry-once.yml
          rm .github/workflows/e8-final-correctness-fix-final-once.yml
          rm .github/workflows/e8-final-correctness-apply-once.yml
          git diff --check
          test ! -e .github/workflows/e8-final-correctness-fix-once.yml
          test ! -e .github/workflows/e8-final-correctness-fix-retry-once.yml
          test ! -e .github/workflows/e8-final-correctness-fix-final-once.yml
          test ! -e .github/workflows/e8-final-correctness-apply-once.yml
          git diff --quiet origin/main -- .github/workflows/code-change-budget.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix(e8): close final correctness audit gaps"
          git push origin HEAD:dev/e8-config-driven-sweep-01
