          addition = r'''


def _asymre_capability_test_config() -> dict:
    from drpo import e8_multitask_exp_tuning as exp_tuning

    config = copy.deepcopy(
        yaml.safe_load(
            Path("configs/e8_multitask_exp_lambda_curve_completion.yaml").read_text(
                encoding="utf-8"
            )
        )
    )
