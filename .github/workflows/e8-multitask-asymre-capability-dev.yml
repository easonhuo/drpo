          aggregate = replace_once(
              aggregate,
              ') -> dict[str, Any]:\n    provenance_path = output_root / "source_provenance.json"\n',
              ') -> dict[str, Any]:\n'
              '    if _coldstart_method(config) == METHOD_ASYMRE:\n'
              '        return _aggregate_coldstart_asymre(config, output_root, rows)\n'
              '    provenance_path = output_root / "source_provenance.json"\n',
