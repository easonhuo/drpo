          '''
          asymre_aggregate = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in asymre_aggregate.splitlines()
          )
          tuning = replace_once(
              tuning,
              'def _aggregate_coldstart(\n',
              asymre_aggregate + 'def _aggregate_coldstart(\n',
              'insert AsymRE cold-start aggregator',
