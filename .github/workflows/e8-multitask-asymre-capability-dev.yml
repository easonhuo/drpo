          tuning = tuning[:agg_start] + aggregate + tuning[agg_end:]

          cmd_agg_start = tuning.index('def cmd_aggregate(config: Mapping[str, Any], output_root: Path)')
          cmd_agg_end = tuning.index('\n\ndef cmd_audit(', cmd_agg_start)
          cmd_agg = tuning[cmd_agg_start:cmd_agg_end]
