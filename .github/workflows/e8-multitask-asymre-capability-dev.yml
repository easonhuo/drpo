              '    cell = _canonical_cold_liveness_cell(grid_path)\n',
              'method-aware liveness grid activation',
          )
          tuning = tuning[:liveness_start] + liveness + tuning[liveness_end:]

          # Liveness reuse must match the configured scientific family.
          gate_start = tuning.index('def _require_liveness_gate(\n')
          gate_end = tuning.index('\n\ndef cmd_run_wave(', gate_start)
          gate = tuning[gate_start:gate_end]
          gate = replace_once(
              gate,
              '            and result.get("finite_old_core_updates") is True\n',
              '            and result.get("finite_old_core_updates") is True\n'
              '            and result.get("cell", {}).get("method") == _coldstart_method(config)\n',
