name: Repair and apply E8 method refactor

on:
  push:
    branches:
      - dev/e8-method-integration-cost-refactor-01

permissions:
  contents: write

jobs:
  repair-and-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-method-integration-cost-refactor-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt || pip install pytest pyyaml numpy ruff
      - name: Repair embedded refactor script and extract it
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/e8-method-refactor-apply.yml')
          text = workflow.read_text(encoding='utf-8')
          anchor = "          new_cold = textwrap.dedent(r'''\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one new_cold anchor, found {text.count(anchor)}')
          text = text.replace(
              anchor,
              "          new_cold = textwrap.indent(textwrap.dedent(r'''\n",
              1,
          )
          start = text.index("          new_cold = textwrap.indent(")
          close = "              ''').lstrip('\\n')\n"
          close_at = text.index(close, start)
          text = (
              text[:close_at]
              + "              ''').lstrip('\\n'), '    ')\n"
              + text[close_at + len(close):]
          )
          workflow.write_text(text, encoding='utf-8')

          marker = "          cat > /tmp/refactor_e8.py <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(marker) + len(marker)
          end = text.index(end_marker, start)
          body = text[start:end]
          lines = body.splitlines()
          extracted = []
          for line in lines:
              if line and not line.startswith('          '):
                  raise SystemExit(f'unexpected embedded indentation: {line[:80]!r}')
              extracted.append(line[10:] if line else '')
          Path('/tmp/refactor_e8.py').write_text('\n'.join(extracted) + '\n', encoding='utf-8')
          PY
          python /tmp/refactor_e8.py
      - name: Static compile
        run: |
          python -m py_compile \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_orchestration.py \
            src/drpo/e8_multitask_results.py \
            src/drpo/e8_multitask_runtime.py
      - name: Method contract regression
        run: bash tests/test_e8_method_integration_contract.sh
      - name: Focused E8 regression
        run: pytest -q tests/test_e8_multitask_p0.py
      - name: Ruff
        run: ruff check src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_orchestration.py src/drpo/e8_multitask_results.py src/drpo/e8_multitask_runtime.py
      - name: Commit refactor and remove temporary transport workflows
        run: |
          git diff --check
          git rm .github/workflows/e8-method-refactor-apply.yml .github/workflows/e8-method-refactor-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_orchestration.py src/drpo/e8_multitask_results.py
          git commit -m 'refactor: wire E8 method contract through generic layers'
          git push origin HEAD:dev/e8-method-integration-cost-refactor-01
