name: E8 Multitask AsymRE Capability Finalize 2

"on":
  push:
    branches:
      - dev/e8-multitask-asymre-capability-01

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-asymre-capability-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply scoped implementation and normalize generated blocks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/e8-multitask-asymre-capability-dev.yml')
          text = source.read_text(encoding='utf-8')
          prefix = (
              '      - name: Apply scoped AsymRE capability edits\n'
              '        shell: bash\n'
              '        run: |\n'
          )
          suffix = '      - name: Install focused test dependencies\n'
          start = text.index(prefix) + len(prefix)
          end = text.index(suffix, start)
          block = text[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/e8_asymre_patcher.sh').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8'
          )
          PY
          bash /tmp/e8_asymre_patcher.sh

          python - <<'PY'
          from pathlib import Path

          def replace_between(text: str, start_marker: str, end_marker: str, lines: list[str]) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + '\n'.join(lines) + text[end:]

          config_path = Path('src/drpo/e8_experiment_config.py')
          text = config_path.read_text(encoding='utf-8')
          text = replace_between(
              text,
              'def _validate_sweep(config: Mapping[str, Any], tasks: tuple[str, ...]) -> None:\n',
              'def _validate_canonical_and_execution(config: Mapping[str, Any]) -> None:\n',
              [
                  'def _validate_sweep(config: Mapping[str, Any], tasks: tuple[str, ...]) -> None:',
                  '    sweep = _mapping(config.get("sweep"), "sweep")',
                  '    method = coldstart_method(config)',
                  '    if method == COLDSTART_METHOD_EXPONENTIAL:',
                  '        if sweep.get("parameterization") not in (',
                  '            "paper_coefficient_c",',
                  '            "paper_lambda_c1",',
                  '        ):',
                  '            raise ValueError("Unsupported exponential cold-start parameterization")',
                  '        task_values = _mapping(sweep.get("task_lambda"), "sweep.task_lambda")',
                  '        if set(task_values) != set(tasks):',
                  '            raise ValueError("Cold-start task_lambda must contain the exact nine tasks")',
                  '        read_values = task_lambdas',
                  '    elif method == COLDSTART_METHOD_ASYMRE:',
                  '        if sweep.get("parameterization") != ASYMRE_PARAMETERIZATION:',
                  '            raise ValueError("AsymRE cold-start requires asymre_delta_v parameterization")',
                  '        task_values = _mapping(sweep.get("task_delta_v"), "sweep.task_delta_v")',
                  '        if set(task_values) != set(tasks):',
                  '            raise ValueError("Cold-start task_delta_v must contain the exact nine tasks")',
                  '        read_values = task_delta_vs',
                  '    else:',
                  '        raise ValueError(f"Unsupported cold-start method: {method}")',
                  '',
                  '    countdown_values = read_values(config, "countdown")',
                  '    if len(set(countdown_values)) != len(countdown_values):',
                  '        raise ValueError("Countdown parameter grid contains duplicates")',
                  '    if method == COLDSTART_METHOD_EXPONENTIAL and any(',
                  '        value not in COUNTDOWN_PAPER_COEFFICIENTS for value in countdown_values',
                  '    ):',
                  '        raise ValueError("Countdown coefficients exceed the implemented paper-worker domain")',
                  '',
                  '    countdown_seeds = tuple(',
                  '        _integer(value, "Countdown seed offset")',
                  '        for value in _sequence(',
                  '            sweep.get("countdown_seed_offsets", ()),',
                  '            "countdown_seed_offsets",',
                  '        )',
                  '    )',
                  '    if len(set(countdown_seeds)) != len(countdown_seeds):',
                  '        raise ValueError("Countdown seed offsets must be unique")',
                  '    if any(seed not in COUNTDOWN_PAPER_SEEDS for seed in countdown_seeds):',
                  '        raise ValueError("Countdown seed exceeds the implemented paper-worker domain")',
                  '    if countdown_seeds and not countdown_values:',
                  '        raise ValueError("Scheduled Countdown seeds require a non-empty parameter grid")',
                  '',
                  '    countdown_positive = _boolean(',
                  '        sweep.get("countdown_include_positive_only", True),',
                  '        "countdown_include_positive_only",',
                  '    )',
                  '    include_global = _boolean(',
                  '        sweep.get("include_global_endpoint", False),',
                  '        "include_global_endpoint",',
                  '    )',
                  '    positive_seeds = tuple(',
                  '        _integer(value, "Transfer Positive-only seed offset")',
                  '        for value in _sequence(',
                  '            sweep.get("transfer_positive_only_seed_offsets", ()),',
                  '            "transfer_positive_only_seed_offsets",',
                  '        )',
                  '    )',
                  '    if len(set(positive_seeds)) != len(positive_seeds):',
                  '        raise ValueError("Transfer Positive-only seed offsets must be unique")',
                  '    _integer(sweep.get("task_transfer_seed_offset"), "task_transfer_seed_offset")',
                  '    _integer(sweep.get("tuning_seed"), "tuning_seed")',
                  '',
                  '    transfer_tasks = set(tasks) - {"countdown"}',
                  '    provenance = _mapping(sweep.get("task_grid_provenance"), "task_grid_provenance")',
                  '    if set(provenance) != transfer_tasks:',
                  '        raise ValueError("Task-grid provenance must cover the exact eight transfer tasks")',
                  '',
                  '    transfer_cell_count = 0',
                  '    for task in transfer_tasks:',
                  '        values = read_values(config, task)',
                  '        if len(set(values)) != len(values):',
                  '            raise ValueError(f"{task} parameter grid contains duplicates")',
                  '        if not str(provenance[task]).strip():',
                  '            raise ValueError(f"{task} task-grid provenance must be non-empty")',
                  '        if values:',
                  '            transfer_cell_count += len(positive_seeds) + int(include_global) + len(values)',
                  '',
                  '    expanded = (',
                  '        len(countdown_seeds) * (1 + int(countdown_positive) + len(countdown_values))',
                  '        + transfer_cell_count',
                  '    )',
                  '    expected = _integer(sweep.get("expected_cells"), "sweep.expected_cells")',
                  '    if expected != expanded:',
                  '        raise ValueError("sweep.expected_cells must match the expanded scientific matrix")',
                  '    if expected == 0:',
                  '        raise ValueError("Cold-start sweep must contain at least one scientific cell")',
                  '',
                  '',
              ],
          )
          config_path.write_text(text, encoding='utf-8')

          tuning_path = Path('src/drpo/e8_multitask_exp_tuning.py')
          text = tuning_path.read_text(encoding='utf-8')
          text = replace_between(
              text,
              '@dataclass(frozen=True)\nclass Cell:\n',
              '@dataclass(frozen=True)\nclass TaskInputs:\n',
              [
                  '@dataclass(frozen=True)',
                  'class Cell:',
                  '    task: str',
                  '    method: str',
                  '    rho: float | None',
                  '    seed: int',
                  '    stage: str',
                  '    lambda_value: float | None = None',
                  '    delta_v: float | None = None',
                  '',
                  '    @property',
                  '    def key(self) -> str:',
                  '        if self.method == METHOD_POSITIVE_ONLY:',
                  '            return f"{self.task}__positive_only__seed{self.seed}"',
                  '        if self.method == METHOD_GLOBAL:',
                  '            return f"{self.task}__global__seed{self.seed}"',
                  '        if self.method == METHOD_ASYMRE:',
                  '            if self.delta_v is None:',
                  '                raise AssertionError("AsymRE cell requires delta_v")',
                  '            tag = f"{self.delta_v:.12g}".replace("-", "m").replace(".", "p")',
                  '            return f"{self.task}__asymre_delta_v{tag}__seed{self.seed}"',
                  '        if self.lambda_value is not None:',
                  '            tag = f"{self.lambda_value:.12g}".replace(".", "p")',
                  '            return f"{self.task}__exp_lambda{tag}__seed{self.seed}"',
                  '        if self.rho is None:',
                  '            raise AssertionError("Exponential cell requires rho or lambda")',
                  '        tag = f"{self.rho:.6f}".rstrip("0").rstrip(".").replace(".", "p")',
                  '        return f"{self.task}__exp_rho{tag}__seed{self.seed}"',
                  '',
                  '',
              ],
          )
          text = replace_between(
              text,
              'def _coldstart_method(config: Mapping[str, Any]) -> str:\n',
              'def _task_rhos(config: Mapping[str, Any], task: str) -> tuple[float, ...]:\n',
              [
                  'def _coldstart_method(config: Mapping[str, Any]) -> str:',
                  '    if not _is_coldstart(config):',
                  '        raise ValueError("Cold-start method is defined only for the cold-start profile")',
                  '    return experiment_config.coldstart_method(config)',
                  '',
                  '',
                  'def _task_method_values(config: Mapping[str, Any], task: str) -> tuple[float, ...]:',
                  '    if _coldstart_method(config) == METHOD_ASYMRE:',
                  '        return experiment_config.task_delta_vs(config, task)',
                  '    return _task_lambdas(config, task)',
                  '',
                  '',
              ],
          )
          build_start = text.index('def build_cells(config: Mapping[str, Any]) -> tuple[Cell, ...]:\n')
          cold_start = text.index('    if _is_coldstart(config):\n', build_start)
          cold_end = text.index('    coarse = _tuple_floats(config["sweep"]["coarse_rho"])\n', cold_start)
          cold_lines = [
              '    if _is_coldstart(config):',
              '        cells: list[Cell] = []',
              '        method = _coldstart_method(config)',
              '        lambda_only = (',
              '            method == METHOD_EXPONENTIAL',
              '            and config["sweep"]["parameterization"] == "paper_lambda_c1"',
              '        )',
              '        countdown_values = _task_method_values(config, "countdown")',
              '        countdown_include_positive_only = bool(',
              '            config["sweep"].get("countdown_include_positive_only", True)',
              '        )',
              '        include_global_endpoint = bool(',
              '            config["sweep"].get("include_global_endpoint", False)',
              '        )',
              '        for seed_offset in tuple(',
              '            int(value) for value in config["sweep"]["countdown_seed_offsets"]',
              '        ):',
              '            if countdown_include_positive_only:',
              '                cells.append(',
              '                    Cell(',
              '                        "countdown", METHOD_POSITIVE_ONLY, None, seed_offset, "countdown_sentinel"',
              '                    )',
              '                )',
              '            cells.append(',
              '                Cell(',
              '                    "countdown", METHOD_GLOBAL, 1.0, seed_offset, "countdown_sentinel", 0.0',
              '                )',
              '            )',
              '            if method == METHOD_ASYMRE:',
              '                cells.extend(',
              '                    Cell(',
              '                        "countdown", METHOD_ASYMRE, None, seed_offset, "countdown_sentinel", None, delta_v',
              '                    )',
              '                    for delta_v in countdown_values',
              '                )',
              '            else:',
              '                cells.extend(',
              '                    Cell(',
              '                        "countdown",',
              '                        METHOD_EXPONENTIAL,',
              '                        None if lambda_only else math.exp(-coefficient),',
              '                        seed_offset,',
              '                        "countdown_sentinel",',
              '                        coefficient,',
              '                    )',
              '                    for coefficient in countdown_values',
              '                )',
              '        positive_seeds = tuple(',
              '            int(value)',
              '            for value in config["sweep"]["transfer_positive_only_seed_offsets"]',
              '        )',
              '        method_seed = int(config["sweep"]["task_transfer_seed_offset"])',
              '        for task in tasks:',
              '            if task == "countdown":',
              '                continue',
              '            values = _task_method_values(config, task)',
              '            if not values:',
              '                continue',
              '            cells.extend(',
              '                Cell(task, METHOD_POSITIVE_ONLY, None, seed_offset, "task_transfer")',
              '                for seed_offset in positive_seeds',
              '            )',
              '            if include_global_endpoint:',
              '                cells.append(',
              '                    Cell(task, METHOD_GLOBAL, 1.0, method_seed, "task_transfer", 0.0)',
              '                )',
              '            if method == METHOD_ASYMRE:',
              '                cells.extend(',
              '                    Cell(',
              '                        task, METHOD_ASYMRE, None, method_seed, "task_transfer", None, delta_v',
              '                    )',
              '                    for delta_v in values',
              '                )',
              '            else:',
              '                cells.extend(',
              '                    Cell(',
              '                        task,',
              '                        METHOD_EXPONENTIAL,',
              '                        None if lambda_only else math.exp(-coefficient),',
              '                        method_seed,',
              '                        "task_transfer",',
              '                        coefficient,',
              '                    )',
              '                    for coefficient in values',
              '                )',
              '        result = tuple(cells)',
              '        if len(result) != int(config["sweep"]["expected_cells"]) or len(',
              '            {cell.key for cell in result}',
              '        ) != len(result):',
              '            raise AssertionError("Internal cold-start cell identity failure")',
              '        return result',
          ]
          text = text[:cold_start] + '\n'.join(cold_lines) + '\n' + text[cold_end:]

          text = replace_between(
              text,
              'def _aggregate_coldstart_asymre(\n',
              'def _aggregate_coldstart(\n',
              [
                  'def _aggregate_coldstart_asymre(',
                  '    config: Mapping[str, Any],',
                  '    output_root: Path,',
                  '    rows: list[dict[str, Any]],',
                  ') -> dict[str, Any]:',
                  '    """Aggregate the declared AsymRE response curve without selecting a winner."""',
                  '',
                  '    provenance_path = output_root / "source_provenance.json"',
                  '    provenance = (',
                  '        json.loads(provenance_path.read_text(encoding="utf-8"))',
                  '        if provenance_path.is_file()',
                  '        else {}',
                  '    )',
                  '    run_id = str(provenance.get("run_id", output_root.name))',
                  '    source_commit = str(provenance.get("source_commit", "unrecorded"))',
                  '    plot_rows = [',
                  '        {',
                  '            "experiment_id": experiment_id(config),',
                  '            "run_id": run_id,',
                  '            "source_commit": source_commit,',
                  '            "task": row["task"],',
                  '            "method": row["method"],',
                  '            "delta_v": row.get("delta_v"),',
                  '            "seed": row["seed"],',
                  '            "stage": row["stage"],',
                  '            "late_window_pass8_mean": row["late_window_pass8_mean"],',
                  '            "late_window_greedy_mean": row["late_window_greedy_mean"],',
                  '            "best_validation_pass8": row["best_pass8"],',
                  '            "terminal_pass8": row["terminal_pass8"],',
                  '            "best_validation_greedy": row["best_greedy"],',
                  '            "terminal_greedy": row["terminal_greedy"],',
                  '            "best_greedy_valid_rate": row["best_greedy_valid_rate"],',
                  '            "terminal_greedy_valid_rate": row["terminal_greedy_valid_rate"],',
                  '            "best_step": row["best_step"],',
                  '            "terminal_step": row["terminal_step"],',
                  '            "stop_reason": row["stop_reason"],',
                  '            "nan_inf_failure": row["nan_inf_failure"],',
                  '            "complete": True,',
                  '        }',
                  '        for row in rows',
                  '    ]',
                  '    _write_csv(output_root / "aggregate" / "plot_curve_points.csv", plot_rows)',
                  '',
                  '    summaries: dict[str, Any] = {}',
                  '    summary_rows: list[dict[str, Any]] = []',
                  '    configured_cells = build_cells(config)',
                  '    for task_value in config["suite"]["tasks"]:',
                  '        task = str(task_value)',
                  '        task_cells = [cell for cell in configured_cells if cell.task == task]',
                  '        if not task_cells:',
                  '            continue',
                  '        task_rows = [row for row in rows if row["task"] == task]',
                  '        asymre_rows = [row for row in task_rows if row["method"] == METHOD_ASYMRE]',
                  '        positive_rows = [',
                  '            row for row in task_rows if row["method"] == METHOD_POSITIVE_ONLY',
                  '        ]',
                  '        global_rows = [row for row in task_rows if row["method"] == METHOD_GLOBAL]',
                  '        expected = (',
                  '            sum(cell.method == METHOD_ASYMRE for cell in task_cells),',
                  '            sum(cell.method == METHOD_POSITIVE_ONLY for cell in task_cells),',
                  '            sum(cell.method == METHOD_GLOBAL for cell in task_cells),',
                  '        )',
                  '        if (len(asymre_rows), len(positive_rows), len(global_rows)) != expected:',
                  '            raise RuntimeError(f"{task} AsymRE cold-start cell geometry is incomplete")',
                  '',
                  '        groups: dict[float, list[dict[str, Any]]] = {}',
                  '        for row in asymre_rows:',
                  '            if row.get("delta_v") is None:',
                  '                raise RuntimeError(f"{task} AsymRE row is missing delta_v")',
                  '            groups.setdefault(float(row["delta_v"]), []).append(row)',
                  '        grouped_curve: list[dict[str, Any]] = []',
                  '        for delta_v, group in sorted(groups.items()):',
                  '            grouped_curve.append(',
                  '                {',
                  '                    "task": task,',
                  '                    "method": METHOD_ASYMRE,',
                  '                    "delta_v": delta_v,',
                  '                    "seeds": sorted(int(row["seed"]) for row in group),',
                  '                    "late_window_pass8_mean": float(',
                  '                        np.mean([float(row["late_window_pass8_mean"]) for row in group])',
                  '                    ),',
                  '                    "late_window_greedy_mean": float(',
                  '                        np.mean([float(row["late_window_greedy_mean"]) for row in group])',
                  '                    ),',
                  '                    "terminal_pass8_mean": float(',
                  '                        np.mean([float(row["terminal_pass8"]) for row in group])',
                  '                    ),',
                  '                    "terminal_greedy_valid_rate_mean": float(',
                  '                        np.mean([float(row["terminal_greedy_valid_rate"]) for row in group])',
                  '                    ),',
                  '                    "nan_inf_failure": any(',
                  '                        bool(row["nan_inf_failure"]) for row in group',
                  '                    ),',
                  '                }',
                  '            )',
                  '        summaries[task] = {',
                  '            "task": task,',
                  '            "grouped_curve": grouped_curve,',
                  '            "positive_only": positive_rows or None,',
                  '            "global": global_rows or None,',
                  '            "parameter_selection_deferred_to_reviewed_protocol": True,',
                  '            "terminal_valid_rate_role": "diagnostic_only_not_selection_eligibility",',
                  '        }',
                  '        summary_rows.append(',
                  '            {',
                  '                "task": task,',
                  '                "asymre_parameter_points": len(grouped_curve),',
                  '                "finite_parameter_points": sum(',
                  '                    not bool(row["nan_inf_failure"]) for row in grouped_curve',
                  '                ),',
                  '                "parameter_selection_deferred": True,',
                  '            }',
                  '        )',
                  '    _write_csv(output_root / "aggregate" / "task_summary.csv", summary_rows)',
                  '',
                  '    protocol_diagnostic = _countdown_protocol_diagnostic(',
                  '        config,',
                  '        output_root,',
                  '        destination=output_root / "aggregate" / "countdown_protocol_diagnostic.json",',
                  '    )',
                  '    summary = {',
                  '        "schema_version": 1,',
                  '        "experiment_id": experiment_id(config),',
                  '        "run_id": run_id,',
                  '        "source_commit": source_commit,',
                  '        "cell_count": len(rows),',
                  '        "plot_curve_point_count": len(plot_rows),',
                  '        "method": METHOD_ASYMRE,',
                  '        "tasks": summaries,',
                  '        "excluded_tasks": dict(config["suite"]["excluded_tasks"]),',
                  '        "initialization": dict(config["initialization"]),',
                  '        "scientific_kernel": "canonical_old_coldstart_imports",',
                  '        "canonical_asymre_grid": str(_canonical_asymre_grid_path()),',
                  '        "canonical_asymre_grid_sha256": sha256_file(_canonical_asymre_grid_path()),',
                  '        "countdown_protocol_diagnostic": protocol_diagnostic,',
                  '        "countdown_result_gate": False,',
                  '        "primary_metric": "validation_late_window_pass8_mean",',
                  '        "parameter_selection_deferred_to_reviewed_protocol": True,',
                  '        "test_partition_accessed": False,',
                  '        "method_ranking_allowed": False,',
                  '        "significance_claim_allowed": False,',
                  '        "fixed_horizon_is_convergence": False,',
                  '        "task_performance_reported_separately": True,',
                  '        "structure_diagnostic_reported_separately": True,',
                  '        "nan_inf_reported_separately": True,',
                  '        "scientific_status": "not_run" if _is_engineering_self_test(config) else "pilot",',
                  '        "engineering_placeholder_backend": _is_engineering_self_test(config),',
                  '    }',
                  '    atomic_json(output_root / "aggregate" / "aggregate_summary.json", summary)',
                  '    return summary',
                  '',
                  '',
              ],
          )
          tuning_path.write_text(text, encoding='utf-8')
          PY

      - name: Install focused test dependencies
        run: python -m pip install -q numpy pyyaml pytest ruff

      - name: Compile and run focused regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py -k 'asymre_capability'
          python -m ruff check \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          git diff --check

      - name: Commit implementation and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm \
            .github/workflows/e8-multitask-asymre-capability-dev.yml \
            .github/workflows/e8-multitask-asymre-capability-repair.yml \
            .github/workflows/e8-multitask-asymre-capability-finalize.yml \
            .github/workflows/e8-multitask-asymre-capability-finalize2.yml
          git add \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          git diff --cached --check
          git commit -m 'feat: add config-driven E8 multitask AsymRE capability'
          git push origin HEAD:dev/e8-multitask-asymre-capability-01
