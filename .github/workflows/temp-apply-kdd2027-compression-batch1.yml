name: TEMP apply KDD 2027 compression batch 1

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: temp-kdd2027-compression-batch1
  cancel-in-progress: false

jobs:
  apply-exact-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: dev/paper-kdd2027-compression-batch1-01
          fetch-depth: 0

      - name: Verify protected base blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object paper/kdd2027/main.tex)" = "ad797351bb274bc598498651213d52642b335fc0"
          test "$(git hash-object paper/kdd2027/source_locked.tex)" = "32dcd9a05b43096d968789aaf9b380d9f8cbbb1d"
          test "$(git hash-object paper/overleaf/main_replacement.tex)" = "b1f2c58b17977f30947579feb44896568088aaed"
          test "$(git hash-object paper/kdd2027/missing_references.bib)" = "3e5c85468a3787b12f32cba94a56b3af31e765f4"
          git merge-base --is-ancestor 620758fd2f2bc1037a26a791c7e9521d814f6814 HEAD

      - name: Compile deterministic applicator
        run: python -m py_compile scripts/temp_apply_kdd2027_compression_batch1.py

      - name: Apply approved prose changes to all manuscript mirrors
        shell: bash
        run: |
          set -euo pipefail
          python scripts/temp_apply_kdd2027_compression_batch1.py \
            paper/kdd2027/main.tex \
            paper/kdd2027/missing_references.bib
          python scripts/temp_apply_kdd2027_compression_batch1.py \
            paper/kdd2027/source_locked.tex
          python scripts/temp_apply_kdd2027_compression_batch1.py \
            paper/overleaf/main_replacement.tex

      - name: Triple-check completeness, exactness, and scope purity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            paper/kdd2027/main.tex
            paper/kdd2027/missing_references.bib
            paper/kdd2027/source_locked.tex
            paper/overleaf/main_replacement.tex
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected changed paths:\n%s\n' "${changed[*]}"
            exit 1
          fi

          for f in \
            paper/kdd2027/main.tex \
            paper/kdd2027/source_locked.tex \
            paper/overleaf/main_replacement.tex; do
            test "$(grep -Fxc 'Negative dominance admits no finite stable equilibrium, but its score' "$f")" -eq 1
            test "$(grep -Fxc 'Both policy coordinates satisfy the theorem'\''s convexity assumption' "$f")" -eq 1
            test "$(grep -Fxc '\paragraph{Utility boundary.}' "$f")" -eq 1
            test "$(grep -Fxc '\paragraph{Conventions.}' "$f")" -eq 1
            ! grep -Fq 'We use the broader term' "$f"
            ! grep -Fq 'Neither policy-family conclusion alone implies' "$f"
            ! grep -Fq 'Thus, categorical logits can become unbounded' "$f"
            grep -Fq '\begin{proposition}[Quantitative Gaussian reuse rates]' "$f"
            grep -Fq 'This hierarchy ranks' "$f"
          done

          test "$(grep -Fc '@article{sana2026hpo,' paper/kdd2027/missing_references.bib)" -eq 1
          test "$(grep -Fc '\citep{sana2026hpo}' paper/kdd2027/main.tex)" -eq 1

          echo '--- final scope diff stat ---'
          git diff --stat
          echo '--- final changed paths ---'
          printf '%s\n' "${changed[@]}"

      - name: Commit clean final tree and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm scripts/temp_apply_kdd2027_compression_batch1.py
          rm .github/workflows/temp-apply-kdd2027-compression-batch1.yml
          git add -A
          git commit -m "PAPER-KDD2027-COMPRESSION-BATCH1-01: apply approved prose compression"
          git push origin HEAD:dev/paper-kdd2027-compression-batch1-01
