name: Temporary E8 recovery chronology repair v5
on:
  push:
    branches: [dev/e8-multitask-baselines-capability-01]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install pyyaml pytest ruff numpy
      - name: Execute final recovery chronology repair
        run: bash .github/workflows/tmp_e8_recovery_reuse_fix_v5.sh
