name: E8 wide right-tail result closure canonical registration v6

on:
  push:
    branches:
      - automation/e8-wide-righttail-result-closure-normalize-20260907-v6

permissions:
  contents: write

jobs:
  normalize-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout target source branch
        uses: actions/checkout@v4
        with:
          ref: dev/e8-wide-righttail-result-closure-20260907-v6
          fetch-depth: 0
          path: target
          persist-credentials: true

      - name: Checkout trusted current main
        uses: actions/checkout@v4
        with:
          ref: 8a21fd16e63ea96a0cde2a477353d24562624655
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Checkout immutable payload carrier
        uses: actions/checkout@v4
        with:
          ref: 7cdaec5ba70eb2718963b63ebd79e869bb55da83
          fetch-depth: 1
          path: payload-carrier
          persist-credentials: false

      - name: Verify locked refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "8a21fd16e63ea96a0cde2a477353d24562624655"
          test "$(git -C trusted rev-parse HEAD)" = "8a21fd16e63ea96a0cde2a477353d24562624655"
          test "$(git -C payload-carrier rev-parse HEAD)" = "7cdaec5ba70eb2718963b63ebd79e869bb55da83"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: target/pyproject.toml

      - name: Install repository test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e './target[dev]'

      - name: Recover reviewed payload and prepare docs-scoped evidence
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          carrier = Path('../payload-carrier/.github/workflows/e8-wide-righttail-result-closure-normalize-v2.yml').read_text(encoding='utf-8')
          match = re.search(r'^\s*SOURCE_PAYLOAD_B64:\s*"([A-Za-z0-9+/=]+)"\s*$', carrier, re.MULTILINE)
          if not match:
              raise SystemExit('Could not recover immutable SOURCE_PAYLOAD_B64 from payload carrier')
          Path('/tmp/e8-wide-source-patch.b64').write_text(match.group(1), encoding='ascii')
          PY
          base64 -d /tmp/e8-wide-source-patch.b64 > /tmp/e8-wide-source-patch.tar.gz
          test "$(sha256sum /tmp/e8-wide-source-patch.tar.gz | awk '{print $1}')" = "3b435ca2308812bdc59f6f5ea66257d336dbf5e2be300c96b060112de68d645e"
          tar -xzf /tmp/e8-wide-source-patch.tar.gz -C .

          mkdir -p docs/results/evidence
          mv experiments/results/e8_multitask_lambda_wide_righttail_03_20260904_01 \
            docs/results/evidence/e8_multitask_lambda_wide_righttail_03_20260904_01

          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import yaml

          BASE = '8a21fd16e63ea96a0cde2a477353d24562624655'
          OLD = '1be7ee757188498e42128d2710e1b30ab573bba5'
          OLD_EVIDENCE = 'experiments/results/e8_multitask_lambda_wide_righttail_03_20260904_01/'
          NEW_EVIDENCE = 'docs/results/evidence/e8_multitask_lambda_wide_righttail_03_20260904_01/'

          sys.path.insert(0, str(Path('../trusted/scripts').resolve()))
          import handoff_delta_shadow as shadow

          delta_path = Path('docs/handoff_deltas/EXT-C-E8-MULTITASK-EXP-LAMBDA-WIDE-RIGHTTAIL-03-RESULT-CLOSURE-2026-09-07/HANDOFF_DELTA.yaml')
          result_path = Path('docs/results/E8_MULTITASK_LAMBDA_WIDE_RIGHTTAIL_03_20260904_01_RESULT_2026-09-07.md')

          delta = yaml.safe_load(delta_path.read_text(encoding='utf-8'))
          delta['base']['commit'] = BASE
          for op in delta['operations']:
              if 'content' in op:
                  op['content'] = op['content'].replace(OLD_EVIDENCE, NEW_EVIDENCE)

          base_handoff = subprocess.check_output(
              ['git', 'show', f'{BASE}:docs/handoff.md'], text=True
          )
          base_registry = subprocess.check_output(
              ['git', 'show', f'{BASE}:experiments/registry.yaml'], text=True
          )
          if shadow.sha256_text(base_handoff) != delta['base']['handoff_sha256']:
              raise SystemExit('Current main handoff hash differs from reviewed closure base')
          if shadow.sha256_text(base_registry) != delta['base']['registry_sha256']:
              raise SystemExit('Current main registry hash differs from reviewed closure base')
          rendered = shadow.render(base_handoff, delta['operations'])
          shadow.verify_history_preservation(base_handoff, rendered.text, delta['operations'])
          delta['expected']['exact_base_candidate_sha256'] = shadow.sha256_text(rendered.text)
          delta_path.write_text(
              yaml.safe_dump(delta, sort_keys=False, allow_unicode=True),
              encoding='utf-8',
          )

          result = result_path.read_text(encoding='utf-8')
          result = result.replace(OLD, BASE)
          result = result.replace(OLD_EVIDENCE, NEW_EVIDENCE)
          result_path.write_text(result, encoding='utf-8')

          print('candidate_sha256=' + delta['expected']['exact_base_candidate_sha256'])
          print('evidence_path=' + NEW_EVIDENCE)
          PY

          test ! -e experiments/results/e8_multitask_lambda_wide_righttail_03_20260904_01
          test -f docs/results/evidence/e8_multitask_lambda_wide_righttail_03_20260904_01/RESULT_MANIFEST.json
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/results/E8_MULTITASK_LAMBDA_WIDE_RIGHTTAIL_03_20260904_01_RESULT_2026-09-07.md \
            docs/results/evidence/e8_multitask_lambda_wide_righttail_03_20260904_01 \
            docs/handoff_deltas/EXT-C-E8-MULTITASK-EXP-LAMBDA-WIDE-RIGHTTAIL-03-RESULT-CLOSURE-2026-09-07/HANDOFF_DELTA.yaml
          git diff --cached --check
          git commit -m 'E8 wide right-tail 03: temporary trusted source patch'
          echo "SOURCE_PATCH_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate schema-v3 exact-base intent
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python ../trusted/scripts/handoff_authority.py validate-delta \
            --repo-root . \
            --delta docs/handoff_deltas/EXT-C-E8-MULTITASK-EXP-LAMBDA-WIDE-RIGHTTAIL-03-RESULT-CLOSURE-2026-09-07/HANDOFF_DELTA.yaml \
            --source-patch-commit "$SOURCE_PATCH_COMMIT" \
            --json

      - name: Trusted Stage-5 normalization
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python ../trusted/scripts/handoff_authority.py normalize \
            --repo-root . \
            --trusted-repo-root ../trusted \
            --current-before 8a21fd16e63ea96a0cde2a477353d24562624655 \
            --source-base 8a21fd16e63ea96a0cde2a477353d24562624655 \
            --source-patch-commit "$SOURCE_PATCH_COMMIT" \
            --json

      - name: Enforce normalization write boundary
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          report = 'docs/handoff_deltas/EXT-C-E8-MULTITASK-EXP-LAMBDA-WIDE-RIGHTTAIL-03-RESULT-CLOSURE-2026-09-07/MATERIALIZATION_REPORT.json'
          allowed_exact = {'docs/handoff.md', report}
          allowed_prefix = 'docs/handoff_shadow/stage4/minimal/generated/'
          out = subprocess.check_output(['git','status','--porcelain'], text=True)
          paths=[]
          for line in out.splitlines():
              if not line.strip():
                  continue
              path=line[3:]
              if ' -> ' in path:
                  path=path.split(' -> ',1)[1]
              paths.append(path)
          bad=sorted(p for p in paths if p not in allowed_exact and not p.startswith(allowed_prefix))
          if bad:
              raise SystemExit('Unexpected normalization paths: '+', '.join(bad))
          if 'docs/handoff.md' not in paths:
              raise SystemExit('Normalizer did not materialize docs/handoff.md')
          if report not in paths:
              raise SystemExit('Normalizer did not create MATERIALIZATION_REPORT.json')
          print('\n'.join(paths))
          PY
          git diff --check

      - name: Create immutable same-add registration commit
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          BASE=8a21fd16e63ea96a0cde2a477353d24562624655
          DELTA=docs/handoff_deltas/EXT-C-E8-MULTITASK-EXP-LAMBDA-WIDE-RIGHTTAIL-03-RESULT-CLOSURE-2026-09-07/HANDOFF_DELTA.yaml
          REPORT=docs/handoff_deltas/EXT-C-E8-MULTITASK-EXP-LAMBDA-WIDE-RIGHTTAIL-03-RESULT-CLOSURE-2026-09-07/MATERIALIZATION_REPORT.json

          git reset --soft "$BASE"
          git add -A
          git diff --cached --check
          git commit -m 'Register E8 wide right-tail 03 pilot result closure'
          FINAL_HEAD=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^1)" = "$BASE"
          test "$(git log --diff-filter=A --format=%H -- "$DELTA")" = "$FINAL_HEAD"
          test "$(git log --diff-filter=A --format=%H -- "$REPORT")" = "$FINAL_HEAD"
          echo "FINAL_HEAD=$FINAL_HEAD" >> "$GITHUB_ENV"

      - name: Required Stage-5 and governance gates
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python scripts/handoff_authority.py verify --repo-root . --json
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .
          python scripts/validate_governance_rule_inventory.py --repo-root .
          python scripts/validate_formal_execution_channel.py --repo-root .
          git diff --check 8a21fd16e63ea96a0cde2a477353d24562624655..HEAD

      - name: Canonical test selection and execution
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select_update_tests.py \
            --repo . \
            --base 8a21fd16e63ea96a0cde2a477353d24562624655 \
            --head HEAD \
            --mode auto \
            --json | tee "$RUNNER_TEMP/canonical-test-plan.json"
          python scripts/select_update_tests.py \
            --repo . \
            --base 8a21fd16e63ea96a0cde2a477353d24562624655 \
            --head HEAD \
            --mode auto \
            --execute \
            --json 2>&1 | tee "$RUNNER_TEMP/canonical-tests.log"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e8-wide-righttail-v6-diagnostics
          path: |
            ${{ runner.temp }}/canonical-test-plan.json
            ${{ runner.temp }}/canonical-tests.log
          if-no-files-found: warn

      - name: Confirm clean validated worktree
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"

      - name: Push validated registration to source branch
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/dev/e8-wide-righttail-result-closure-20260907-v6
          echo "PUSHED_VALIDATED_HEAD=$(git rev-parse HEAD)"
