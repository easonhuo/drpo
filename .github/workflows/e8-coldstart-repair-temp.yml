name: TEMP E8 coldstart repair

on:
  push:
    branches:
      - dev/e8-coldstart-repair-bot-20260815

permissions:
  contents: write

jobs:
  repair-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed repair
        run: bash .drpo_tmp/repair.sh

      - name: Structural and scope checks
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          python -m py_compile src/drpo/e8_multitask_exp_tuning.py
          grep -Fq 'expected_cells: 208' configs/e8_multitask_exp_coldstart.yaml
          grep -Fq 'expected_waves: 13' configs/e8_multitask_exp_coldstart.yaml
          grep -Fq 'slots_per_gpu: 2' configs/e8_multitask_exp_coldstart.yaml
          grep -Fq 'wave_barriers: true' configs/e8_multitask_exp_coldstart.yaml
          grep -Fq 'spiral_matrix' configs/e8_multitask_exp_coldstart.yaml
          ! grep -Fq 'terminal_valid_rate_minimum' configs/e8_multitask_exp_coldstart.yaml
          ! grep -Fq 'countdown_reproduction_gate' configs/e8_multitask_exp_coldstart.yaml
          ! grep -Fq 'countdown_reproduction_gate' docs/experiments/EXT-C-E8-MULTITASK-EXP-COLDSTART-01_RUNBOOK.md
          ! grep -Fq 'require_peak_above_positive_only' configs/e8_multitask_exp_coldstart.yaml
          ! grep -Fq 'late_window_pass8_absolute_tolerance' configs/e8_multitask_exp_coldstart.yaml
          ! grep -Fq 'non_countdown_training_released' src/drpo/e8_multitask_exp_tuning.py
          ! grep -Fq 'countdown_reproduction_gate' src/drpo/e8_multitask_exp_tuning.py
          ! grep -Fq 'Internal 188-cell paper-aligned identity failure' src/drpo/e8_multitask_exp_tuning.py
          ! grep -Fq '23x8 plus one 4-cell batch' src/drpo/e8_multitask_exp_tuning.py
          ! grep -Fq 'later_cell_started_before_first_batch_finished' src/drpo/e8_multitask_exp_tuning.py

      - name: Install test-only dependencies
        run: python -m pip install --disable-pip-version-check -q pytest==8.3.5 PyYAML==6.0.2 numpy==1.26.4

      - name: Run coldstart unit and engineering tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_e8_multitask_p0.py -k 'coldstart or verified_wrong_candidate or task_base_config_transfer'

      - name: Verify locked scientific files are unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object src/drpo/countdown_qwen_arena_onefile.py)" = d8a04f3ae3edd08042aa1004b4cbf927fc5cea72
          test "$(git hash-object src/drpo/countdown_e8_alpha1_c_scan_common.py)" = 572f6ad98bf063c88e52a4594fde892842c4fe15
          test "$(git hash-object src/drpo/countdown_e8_alpha1_c_scan_runtime.py)" = b4ad8581f0afd6e4d24069524f909eaa1b0c9563
          test "$(git hash-object src/drpo/countdown_e8_alpha1_c_scan_trainer.py)" = e026afbefc09205bb1632b5dd1bd6db33b5df358
          test "$(git hash-object src/drpo/countdown_e8_alpha1_highc_scan_common.py)" = 720415583e9e372fafa5aa3520e07de04e6494d8
          test "$(git hash-object src/drpo/countdown_e8_alpha1_highc_scan_runtime.py)" = a57cd88287daf95864f7e30caf658473a32d3602
          test "$(git hash-object src/drpo/e8_multitask_p0.py)" = 3482967fe656156500f4598f16f5e7031e198d48
          test "$(git hash-object src/drpo/e8_multitask_tasks.py)" = 454f3076171ee25636109c33f5a177ee2201b5f8
          test "$(git hash-object configs/e8_multitask_p0.yaml)" = 14605ae3a79f18e435feafd3927bc21485edbbc9

      - name: Commit clean implementation tree
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e .drpo_tmp
          test ! -e .github/workflows/e8-coldstart-repair-temp.yml
          git status --short
          git config user.name 'drpo-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'E8 coldstart: restore frozen multitask protocol'
          git push origin HEAD:${GITHUB_REF_NAME}
