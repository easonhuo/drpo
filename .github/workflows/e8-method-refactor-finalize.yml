name: Finalize E8 method refactor

on:
  push:
    branches:
      - dev/e8-method-integration-cost-refactor-01

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-method-integration-cost-refactor-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Finalize and optimize method wiring
        run: |
          python .github/workflows/e8_method_refactor_finalize.py
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/e8_method_refactor_lintfix.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''text = replace_once(
    text,
    "        key=lambda item: spec.group_order(item[0]),\\n",
    "        key=lambda item: e8_results.parameter_sort_key(item[0]),\\n",
    label="generic grouped-curve ordering",
)
''',
                  '''if "spec.group_order(item[0])" in text:
    text = text.replace(
        "spec.group_order(item[0])",
        "e8_results.parameter_sort_key(item[0])",
        1,
    )
''',
                  'grouped-curve ordering',
              ),
              (
                  '''text = replace_once(
    text,
    "                **dict(spec.group_projection(parameters)),\\n",
    "                **parameters,\\n",
    label="generic grouped-curve projection",
)
''',
                  '''if "spec.group_projection(parameters)" in text:
    text = text.replace(
        "**dict(spec.group_projection(parameters))",
        "**parameters",
        1,
    )
''',
                  'grouped-curve projection',
              ),
              (
                  '''text = replace_once(
    text,
    "            projection = dict(spec.plot_projection(cells_by_key[cell_key]))\\n"
    "            parameter_columns = {\\n"
    "                column: projection.get(column)\\n"
    "                for column in spec.plot_columns\\n"
    "                if column != \\\"dpo_initialization\\\"\\n"
    "            }\\n",
    "            projection = dict(spec.parameters(cells_by_key[cell_key]))\\n"
    "            parameter_columns = {\\n"
    "                name: value\\n"
    "                for name, value in projection.items()\\n"
    "                if name != \\\"dpo_initialization\\\"\\n"
    "            }\\n",
    label="single-method plot parameters",
)
''',
                  '''if "spec.plot_projection(cells_by_key[cell_key])" in text:
    text = text.replace(
        "spec.plot_projection(cells_by_key[cell_key])",
        "spec.parameters(cells_by_key[cell_key])",
        1,
    )
    text = text.replace("column: projection.get(column)", "name: value", 1)
    text = text.replace("for column in spec.plot_columns", "for name, value in projection.items()", 1)
    text = text.replace('if column != "dpo_initialization"', 'if name != "dpo_initialization"', 1)
''',
                  'single-method plot parameters',
              ),
          ]
          for old, new, label in replacements:
              if old not in text:
                  raise RuntimeError(f'cannot locate {label} transform')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python .github/workflows/e8_method_refactor_lintfix.py
      - name: Static compile
        run: |
          python -m py_compile \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_orchestration.py \
            src/drpo/e8_multitask_results.py \
            src/drpo/e8_multitask_runtime.py \
            tests/test_e8_multitask_p0.py
      - name: Method contract acceptance
        run: bash tests/test_e8_method_integration_contract.sh
      - name: Focused E8 regression
        run: python -m pytest -q tests/test_e8_multitask_p0.py
      - name: Ruff
        run: python -m ruff check src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_orchestration.py src/drpo/e8_multitask_results.py src/drpo/e8_multitask_runtime.py tests/test_e8_multitask_p0.py
      - name: Governance stage status
        run: python3 scripts/validate_governance_pipeline_stage_status.py --repo-root .
      - name: Handoff authority verification
        run: python3 scripts/handoff_authority.py verify --repo-root .
      - name: Full suite excluding characterized main-baseline failures
        run: |
          python -m pytest -q -k 'not test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells and not test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test'
      - name: Verify excluded tests match main baseline
        run: |
          set +e
          python -m pytest -q tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells
          branch_asymre=$?
          python -m pytest -q tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test
          branch_docs=$?
          git worktree add /tmp/drpo-main 3f9e66fd29c6e7c2f0a1bf8b948c82680545566b
          (
            cd /tmp/drpo-main
            PYTHONPATH=/tmp/drpo-main/src python -m pytest -q tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells
          )
          base_asymre=$?
          (
            cd /tmp/drpo-main
            PYTHONPATH=/tmp/drpo-main/src python -m pytest -q tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test
          )
          base_docs=$?
          set -e
          test "$branch_asymre" -eq "$base_asymre"
          test "$branch_docs" -eq "$base_docs"
          git worktree remove /tmp/drpo-main --force
      - name: Diff and code-volume review
        run: |
          git diff --check
          git diff --stat 3f9e66fd29c6e7c2f0a1bf8b948c82680545566b
          git diff --numstat 3f9e66fd29c6e7c2f0a1bf8b948c82680545566b -- \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_orchestration.py \
            src/drpo/e8_multitask_results.py \
            src/drpo/e8_multitask_runtime.py
      - name: Land optimized refactor and remove transport files
        run: |
          git rm \
            .github/workflows/e8-method-refactor-finalize.yml \
            .github/workflows/e8_method_refactor_finalize.py \
            .github/workflows/e8_method_refactor_lintfix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_orchestration.py \
            src/drpo/e8_multitask_results.py \
            src/drpo/e8_multitask_runtime.py \
            tests/test_e8_multitask_p0.py \
            tests/test_e8_method_integration_contract.sh
          git commit -m 'refactor: optimize E8 method integration seam'
          git push origin HEAD:dev/e8-method-integration-cost-refactor-01
