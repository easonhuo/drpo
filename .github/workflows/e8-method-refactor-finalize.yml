name: Finalize E8 method refactor

on:
  push:
    branches:
      - dev/e8-method-integration-cost-refactor-01

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-method-integration-cost-refactor-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Finalize and optimize method wiring
        run: |
          python .github/workflows/e8_method_refactor_finalize.py
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/e8_method_refactor_lintfix.py')
          text = path.read_text(encoding='utf-8')
          patches = {
              'generic grouped-curve ordering': (
                  'if "spec.group_order(item[0])" in text:\n'
                  '    text = text.replace("spec.group_order(item[0])", '
                  '"e8_results.parameter_sort_key(item[0])", 1)\n'
              ),
              'generic grouped-curve projection': (
                  'if "spec.group_projection(parameters)" in text:\n'
                  '    text = text.replace("**dict(spec.group_projection(parameters))", '
                  '"**parameters", 1)\n'
              ),
              'single-method plot parameters': (
                  'if "spec.plot_projection(cells_by_key[cell_key])" in text:\n'
                  '    text = text.replace("spec.plot_projection(cells_by_key[cell_key])", '
                  '"spec.parameters(cells_by_key[cell_key])", 1)\n'
                  '    text = text.replace("column: projection.get(column)", "name: value", 1)\n'
                  '    text = text.replace("for column in spec.plot_columns", '
                  '"for name, value in projection.items()", 1)\n'
                  '    text = text.replace("if column != \\\"dpo_initialization\\\"", '
                  '"if name != \\\"dpo_initialization\\\"", 1)\n'
              ),
          }
          for label, replacement in patches.items():
              marker = f'label="{label}"'
              marker_pos = text.index(marker)
              start = text.rfind('text = replace_once(', 0, marker_pos)
              if start < 0:
                  raise RuntimeError(f'cannot locate start of {label} transform')
              end = text.index(')\n', marker_pos) + 2
              text = text[:start] + replacement + text[end:]

          for label in (
              'matrix generic plot parameters',
              'task-result generic plot parameters',
          ):
              old_call = f'text = replace_once(text, old, new, label="{label}")'
              new_call = (
                  'if text.count(old) != 1:\n'
                  '    old = "".join(line[4:] if line.startswith("    ") else line '
                  'for line in old.splitlines(keepends=True))\n'
                  '    new = "".join(line[4:] if line.startswith("    ") else line '
                  'for line in new.splitlines(keepends=True))\n'
                  f'text = replace_once(text, old, new, label="{label}")'
              )
              if old_call not in text:
                  raise RuntimeError(f'cannot locate {label} call')
              text = text.replace(old_call, new_call, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python .github/workflows/e8_method_refactor_lintfix.py
          python - <<'PY'
          import ast
          import textwrap
          from pathlib import Path

          exp = Path('src/drpo/e8_multitask_exp_tuning.py')
          text = exp.read_text(encoding='utf-8')
          anchor = (
              '    canonical_liveness_grid: Callable[[Mapping[str, Any], Mapping[str, Any]], Path] | None\n'
          )
          if text.count(anchor) != 1:
              raise RuntimeError('unexpected MethodSpec canonical_liveness_grid field')
          text = text.replace(
              anchor,
              anchor + '    canonical_liveness_parameter: str | None\n',
              1,
          )
          default_anchor = (
              '            canonical_liveness_grid=lambda config, record: Path(\n'
              '                str(record["round1_grid"])\n'
              '            ),\n'
          )
          if text.count(default_anchor) != 3:
              raise RuntimeError('expected three default canonical liveness registrations')
          text = text.replace(
              default_anchor,
              default_anchor + '            canonical_liveness_parameter="representative_c",\n',
          )
          asymre_anchor = (
              '            canonical_liveness_grid=lambda config, record: _canonical_asymre_grid_path(),\n'
          )
          if text.count(asymre_anchor) != 1:
              raise RuntimeError('expected one AsymRE liveness registration')
          text = text.replace(
              asymre_anchor,
              asymre_anchor + '            canonical_liveness_parameter="representative_delta_v",\n',
              1,
          )
          topr_anchor = (
              '            canonical_liveness_grid=lambda config, record: _canonical_topr_grid_path(),\n'
          )
          if text.count(topr_anchor) != 1:
              raise RuntimeError('expected one TOPR liveness registration')
          text = text.replace(
              topr_anchor,
              topr_anchor + '            canonical_liveness_parameter="representative_c",\n',
              1,
          )
          dpo_anchor = '            canonical_liveness_grid=None,\n'
          if text.count(dpo_anchor) != 1:
              raise RuntimeError('expected one DPO liveness registration')
          text = text.replace(
              dpo_anchor,
              dpo_anchor + '            canonical_liveness_parameter=None,\n',
              1,
          )
          exp.write_text(text, encoding='utf-8')

          source = exp.read_text(encoding='utf-8')
          tree = ast.parse(source)
          node = next(
              item for item in tree.body
              if isinstance(item, ast.FunctionDef)
              and item.name == '_canonical_cold_liveness_cell'
          )
          lines = source.splitlines(keepends=True)
          replacement = textwrap.dedent('''
          def _canonical_cold_liveness_cell(grid_path: Path) -> Cell:
              """Derive one liveness cell through the registered method contract."""

              grid = yaml.safe_load(grid_path.read_text(encoding="utf-8"))
              if not isinstance(grid, dict):
                  raise TypeError("Canonical liveness grid root must be a mapping")
              liveness = grid["execution"]["liveness"]
              seed_offsets = grid["sweep"]["seed_offsets"]
              method = str(liveness.get("representative_family", METHOD_EXPONENTIAL))
              spec = _method_spec(method)
              parameter_key = spec.canonical_liveness_parameter
              if parameter_key is None:
                  raise RuntimeError(f"{method} has no canonical cold-liveness parameter")
              if parameter_key not in liveness:
                  raise RuntimeError(
                      f"Canonical liveness grid for {method} lacks {parameter_key}"
                  )
              return spec.build_cell(
                  task="countdown",
                  method=method,
                  seed=int(seed_offsets[0]),
                  stage="liveness",
                  value=float(liveness[parameter_key]),
                  lambda_only=False,
                  dpo_initialization=None,
              )
          ''').lstrip()
          source = ''.join(lines[:node.lineno - 1]) + replacement + ''.join(lines[node.end_lineno:])
          exp.write_text(source, encoding='utf-8')

          contract = Path('tests/test_e8_method_integration_contract.sh')
          contract_text = contract.read_text(encoding='utf-8')
          dummy_anchor = '    canonical_liveness_grid=None,\n'
          if contract_text.count(dummy_anchor) != 1:
              raise RuntimeError('expected one dummy liveness registration')
          contract_text = contract_text.replace(
              dummy_anchor,
              dummy_anchor + '    canonical_liveness_parameter="representative_temperature",\n',
              1,
          )
          contract.write_text(contract_text, encoding='utf-8')
          PY
      - name: Static compile
        run: |
          python -m py_compile \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_orchestration.py \
            src/drpo/e8_multitask_results.py \
            src/drpo/e8_multitask_runtime.py \
            tests/test_e8_multitask_p0.py
      - name: Method contract acceptance
        run: bash tests/test_e8_method_integration_contract.sh
      - name: Focused E8 regression
        run: python -m pytest -q tests/test_e8_multitask_p0.py
      - name: Ruff
        run: python -m ruff check src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_orchestration.py src/drpo/e8_multitask_results.py src/drpo/e8_multitask_runtime.py tests/test_e8_multitask_p0.py
      - name: Governance stage status
        run: python3 scripts/validate_governance_pipeline_stage_status.py --repo-root .
      - name: Handoff authority verification
        run: python3 scripts/handoff_authority.py verify --repo-root .
      - name: Full suite excluding characterized main-baseline failures
        run: |
          python -m pytest -q -k 'not test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells and not test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test'
      - name: Verify excluded tests match main baseline
        run: |
          set +e
          python -m pytest -q tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells
          branch_asymre=$?
          python -m pytest -q tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test
          branch_docs=$?
          git worktree add /tmp/drpo-main 3f9e66fd29c6e7c2f0a1bf8b948c82680545566b
          (
            cd /tmp/drpo-main
            PYTHONPATH=/tmp/drpo-main/src python -m pytest -q tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells
          )
          base_asymre=$?
          (
            cd /tmp/drpo-main
            PYTHONPATH=/tmp/drpo-main/src python -m pytest -q tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test
          )
          base_docs=$?
          set -e
          test "$branch_asymre" -eq "$base_asymre"
          test "$branch_docs" -eq "$base_docs"
          git worktree remove /tmp/drpo-main --force
      - name: Diff and code-volume review
        run: |
          git diff --check
          git diff --stat 3f9e66fd29c6e7c2f0a1bf8b948c82680545566b
          git diff --numstat 3f9e66fd29c6e7c2f0a1bf8b948c82680545566b -- \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_orchestration.py \
            src/drpo/e8_multitask_results.py \
            src/drpo/e8_multitask_runtime.py
      - name: Land optimized refactor and remove transport files
        run: |
          git rm \
            .github/workflows/e8-method-refactor-finalize.yml \
            .github/workflows/e8_method_refactor_finalize.py \
            .github/workflows/e8_method_refactor_lintfix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_orchestration.py \
            src/drpo/e8_multitask_results.py \
            src/drpo/e8_multitask_runtime.py \
            tests/test_e8_multitask_p0.py \
            tests/test_e8_method_integration_contract.sh
          git commit -m 'refactor: optimize E8 method integration seam'
          git push origin HEAD:dev/e8-method-integration-cost-refactor-01
