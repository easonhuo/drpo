name: Finalize E8 method refactor

on:
  push:
    branches:
      - dev/e8-method-integration-cost-refactor-01

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-method-integration-cost-refactor-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Finalize generic method wiring
        run: |
          python .github/workflows/e8_method_refactor_finalize.py
          python .github/workflows/e8_method_refactor_lintfix.py
      - name: Functional and redundancy optimization
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import textwrap
          from pathlib import Path


          def replace_top_level_function(path: Path, name: str, replacement: str) -> None:
              source = path.read_text(encoding="utf-8")
              tree = ast.parse(source)
              node = next(
                  (
                      item
                      for item in tree.body
                      if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef))
                      and item.name == name
                  ),
                  None,
              )
              if node is None or node.end_lineno is None:
                  raise RuntimeError(f"cannot find top-level function {name} in {path}")
              start = min([node.lineno, *(d.lineno for d in node.decorator_list)])
              lines = source.splitlines(keepends=True)
              new = textwrap.dedent(replacement).strip("\n") + "\n"
              path.write_text(
                  "".join(lines[: start - 1]) + new + "".join(lines[node.end_lineno :]),
                  encoding="utf-8",
              )


          def remove_top_level_function(path: Path, name: str) -> None:
              source = path.read_text(encoding="utf-8")
              tree = ast.parse(source)
              node = next(
                  (
                      item
                      for item in tree.body
                      if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef))
                      and item.name == name
                  ),
                  None,
              )
              if node is None or node.end_lineno is None:
                  raise RuntimeError(f"cannot find top-level function {name} in {path}")
              start = min([node.lineno, *(d.lineno for d in node.decorator_list)])
              lines = source.splitlines(keepends=True)
              path.write_text(
                  "".join(lines[: start - 1]) + "".join(lines[node.end_lineno :]),
                  encoding="utf-8",
              )


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)


          def remove_methodspec_projection_surface(path: Path) -> None:
              names = {"group_projection", "group_order", "plot_columns", "plot_projection"}
              source = path.read_text(encoding="utf-8")
              tree = ast.parse(source)
              ranges: list[tuple[int, int]] = []
              method_spec = next(
                  node for node in tree.body if isinstance(node, ast.ClassDef) and node.name == "MethodSpec"
              )
              for item in method_spec.body:
                  if isinstance(item, ast.AnnAssign) and isinstance(item.target, ast.Name):
                      if item.target.id in names:
                          ranges.append((item.lineno, item.end_lineno or item.lineno))
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  if not isinstance(node.func, ast.Name) or node.func.id != "MethodSpec":
                      continue
                  for keyword in node.keywords:
                      if keyword.arg in names:
                          ranges.append((keyword.lineno, keyword.end_lineno or keyword.lineno))
              lines = source.splitlines(keepends=True)
              for start, end in sorted(ranges, reverse=True):
                  del lines[start - 1 : end]
              path.write_text("".join(lines), encoding="utf-8")


          exp = Path("src/drpo/e8_multitask_exp_tuning.py")
          results = Path("src/drpo/e8_multitask_results.py")
          runtime = Path("src/drpo/e8_multitask_runtime.py")
          contract = Path("tests/test_e8_method_integration_contract.sh")
          p0_tests = Path("tests/test_e8_multitask_p0.py")

          # Keep one result projection/group identity implementation only.
          results.write_text(
              textwrap.dedent(
                  r'''
                  """Method-agnostic result projection helpers for E8 multitask experiments."""

                  from __future__ import annotations

                  import csv
                  import json
                  from collections.abc import Callable, Mapping, Sequence
                  from dataclasses import dataclass
                  from pathlib import Path
                  from typing import Any, Protocol


                  class CellLike(Protocol):
                      @property
                      def key(self) -> str: ...

                      task: str
                      method: str
                      seed: int
                      stage: str


                  @dataclass(frozen=True)
                  class MethodResultProjection:
                      parameters: Mapping[str, Any]
                      compatibility_columns: Mapping[str, Any]


                  @dataclass(frozen=True)
                  class ResultRecord:
                      public: Mapping[str, Any]
                      method_parameters: Mapping[str, Any]

                      def public_row(self) -> dict[str, Any]:
                          return dict(self.public)


                  _RESERVED_COMMON_COLUMNS = frozenset(
                      {"source", "task", "method", "seed", "stage", "cell_key"}
                  )


                  def _checked_merge(
                      target: dict[str, Any], values: Mapping[str, Any], *, label: str
                  ) -> None:
                      collisions = sorted(set(target).intersection(values))
                      if collisions:
                          raise ValueError(f"{label} attempted to overwrite result columns: {collisions}")
                      target.update(values)


                  def common_result_record(
                      cell: CellLike,
                      value: Mapping[str, Any],
                      *,
                      source: str,
                      project_method: Callable[[CellLike], MethodResultProjection],
                      project_metrics: Callable[[Mapping[str, Any]], Mapping[str, Any]],
                  ) -> ResultRecord:
                      projection = project_method(cell)
                      compatibility = dict(projection.compatibility_columns)
                      reserved = sorted(_RESERVED_COMMON_COLUMNS.intersection(compatibility))
                      if reserved:
                          raise ValueError(
                              f"Method compatibility projection uses reserved columns: {reserved}"
                          )
                      public: dict[str, Any] = {
                          "source": source,
                          "task": cell.task,
                          "method": cell.method,
                      }
                      _checked_merge(
                          public,
                          compatibility,
                          label="Method compatibility projection",
                      )
                      public.update(
                          {
                              "seed": int(cell.seed),
                              "stage": cell.stage,
                              "cell_key": cell.key,
                          }
                      )
                      _checked_merge(
                          public,
                          dict(project_metrics(value)),
                          label="Metric projection",
                      )
                      return ResultRecord(
                          public=public,
                          method_parameters=dict(projection.parameters),
                      )


                  def parameter_identity(parameters: Mapping[str, Any]) -> str:
                      return json.dumps(
                          dict(parameters),
                          sort_keys=True,
                          separators=(",", ":"),
                          ensure_ascii=False,
                      )


                  def parameter_sort_key(parameters: Mapping[str, Any]) -> tuple[Any, ...]:
                      def sortable(value: Any) -> tuple[int, Any]:
                          if value is None:
                              return (0, "")
                          if isinstance(value, bool):
                              return (1, int(value))
                          if isinstance(value, (int, float)):
                              return (2, float(value))
                          return (3, str(value))

                      return tuple(
                          (str(key), *sortable(value))
                          for key, value in sorted(parameters.items(), key=lambda item: str(item[0]))
                      )


                  def write_csv(
                      path: Path, rows: Sequence[Mapping[str, Any] | ResultRecord]
                  ) -> None:
                      if not rows:
                          raise ValueError(f"Cannot write empty CSV: {path}")
                      materialized = [
                          row.public_row() if isinstance(row, ResultRecord) else dict(row)
                          for row in rows
                      ]
                      path.parent.mkdir(parents=True, exist_ok=True)
                      fieldnames = list(materialized[0])
                      for row in materialized[1:]:
                          for key in row:
                              if key not in fieldnames:
                                  fieldnames.append(key)
                      with path.open("w", encoding="utf-8", newline="") as handle:
                          writer = csv.DictWriter(handle, fieldnames=fieldnames)
                          writer.writeheader()
                          writer.writerows(materialized)
                  '''
              ).lstrip(),
              encoding="utf-8",
          )

          # Keep runtime abstraction on the real production seam only: recovery identity
          # plus method-owned audit result. Production cmd_audit remains the terminal gate.
          runtime.write_text(
              textwrap.dedent(
                  r'''
                  """Method-agnostic recovery primitives for E8 multitask experiments."""

                  from __future__ import annotations

                  import hashlib
                  import json
                  from collections.abc import Mapping
                  from dataclasses import dataclass
                  from typing import Any, Protocol


                  class CellLike(Protocol):
                      @property
                      def key(self) -> str: ...

                      task: str
                      method: str
                      seed: int
                      stage: str


                  @dataclass(frozen=True)
                  class MethodAuditResult:
                      passed: bool
                      evidence: Mapping[str, Any]
                      failures: tuple[str, ...] = ()


                  def stable_json_hash(value: Any) -> str:
                      payload = json.dumps(
                          value,
                          sort_keys=True,
                          separators=(",", ":"),
                          ensure_ascii=False,
                      ).encode("utf-8")
                      return hashlib.sha256(payload).hexdigest()


                  def recovery_identity(
                      cell: CellLike,
                      *,
                      experiment_id: str,
                      config_hash: str,
                      cell_identity_fields: Mapping[str, Any],
                      common_identity_fields: Mapping[str, Any],
                      schema_version: int = 1,
                  ) -> dict[str, Any]:
                      cell_identity: dict[str, Any] = {
                          "task": cell.task,
                          "method": cell.method,
                      }
                      collisions = sorted(
                          set(cell_identity).intersection(cell_identity_fields)
                      )
                      if collisions:
                          raise ValueError(
                              f"Method cell identity attempted to overwrite: {collisions}"
                          )
                      cell_identity.update(cell_identity_fields)
                      for reserved, expected in (
                          ("seed", int(cell.seed)),
                          ("stage", cell.stage),
                      ):
                          if reserved in cell_identity:
                              raise ValueError(
                                  f"Method cell identity attempted to overwrite: ['{reserved}']"
                              )
                          cell_identity[reserved] = expected

                      identity: dict[str, Any] = {
                          "schema_version": int(schema_version),
                          "experiment_id": experiment_id,
                          "config_hash": config_hash,
                          "cell": cell_identity,
                      }
                      collisions = sorted(
                          set(identity).intersection(common_identity_fields)
                      )
                      if collisions:
                          raise ValueError(
                              f"Common recovery identity attempted to overwrite: {collisions}"
                          )
                      identity.update(common_identity_fields)
                      identity["identity_hash"] = stable_json_hash(identity)
                      return identity
                  '''
              ).lstrip(),
              encoding="utf-8",
          )

          text = exp.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "    paper_grid_source: Callable[[Mapping[str, Any], Cell], Path]\n",
              "    paper_grid_paths: Callable[[Mapping[str, Any], Mapping[str, Any], Cell], tuple[Path, Path]] | None\n",
              "MethodSpec paper grid hook",
          )
          text = replace_once(
              text,
              "    paper_cell_parameters: Callable[[Cell], tuple[str, float, float]]\n",
              "    paper_cell_parameters: Callable[[Cell], tuple[str, float, float]] | None\n",
              "MethodSpec optional paper parameters",
          )
          text = text.replace(
              "            parameters=lambda cell: {\n"
              "                \"beta\": cell.beta,\n"
              "                \"dpo_initialization\": cell.dpo_initialization,\n"
              "            },\n",
              "            parameters=lambda cell: {\"beta\": cell.beta},\n",
          )
          text = text.replace(
              "            paper_grid_source=_paper_grid_source_exponential,\n",
              "            paper_grid_paths=_paper_grid_paths_exponential,\n",
          )
          if text.count("paper_grid_paths=_paper_grid_paths_exponential") != 3:
              raise RuntimeError("expected three exponential paper-grid registrations")
          text = replace_once(
              text,
              "            paper_grid_source=lambda config, cell: _canonical_asymre_grid_path(),\n",
              "            paper_grid_paths=lambda config, record, cell: (\n"
              "                _canonical_asymre_grid_path(), _canonical_asymre_grid_path()\n"
              "            ),\n",
              "AsymRE paper grid registration",
          )
          text = replace_once(
              text,
              "            paper_grid_source=lambda config, cell: _canonical_topr_grid_path(),\n",
              "            paper_grid_paths=lambda config, record, cell: (\n"
              "                _canonical_topr_grid_path(), _canonical_topr_grid_path()\n"
              "            ),\n",
              "TOPR paper grid registration",
          )
          text = replace_once(
              text,
              "            paper_grid_source=_unsupported_paper_grid,\n",
              "            paper_grid_paths=None,\n",
              "DPO paper grid registration",
          )
          text = replace_once(
              text,
              "            paper_cell_parameters=_unsupported_paper_params,\n",
              "            paper_cell_parameters=None,\n",
              "DPO paper parameter registration",
          )
          exp.write_text(text, encoding="utf-8")

          replace_top_level_function(
              exp,
              "_paper_grid_source_exponential",
              r'''
              def _paper_grid_paths_exponential(
                  config: Mapping[str, Any],
                  record: Mapping[str, Any],
                  cell: Cell,
              ) -> tuple[Path, Path]:
                  grid_source_name = (
                      "round1_grid"
                      if cell.task != "countdown"
                      else _paper_grid_name(
                          0.0 if cell.lambda_value is None else float(cell.lambda_value)
                      )
                  )
                  return (
                      Path(str(record[grid_source_name])),
                      _canonical_paths(config)[grid_source_name],
                  )
              ''',
          )
          remove_top_level_function(exp, "_unsupported_paper_grid")
          remove_top_level_function(exp, "_unsupported_paper_params")

          replace_top_level_function(
              exp,
              "_paper_grid_for_cell",
              r'''
              def _paper_grid_for_cell(
                  config: Mapping[str, Any],
                  record: Mapping[str, Any],
                  cell: Cell,
              ) -> tuple[Path, Path]:
                  spec = _method_spec(cell.method)
                  if spec.paper_grid_paths is None:
                      raise RuntimeError(
                          f"{cell.method} does not use the canonical paper grid runtime"
                      )
                  return spec.paper_grid_paths(config, record, cell)
              ''',
          )

          text = exp.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "    grid_path = _paper_grid_for_cell(record, cell)\n"
              "    method_spec = _method_spec(cell.method)\n"
              "    grid_source_path = method_spec.paper_grid_source(config, cell)\n",
              "    method_spec = _method_spec(cell.method)\n"
              "    grid_path, grid_source_path = _paper_grid_for_cell(config, record, cell)\n"
              "    if method_spec.paper_cell_parameters is None:\n"
              "        raise RuntimeError(\n"
              "            f\"{cell.method} does not use canonical paper cell parameters\"\n"
              "        )\n",
              "canonical train grid dispatch",
          )
          exp.write_text(text, encoding="utf-8")

          replace_top_level_function(
              exp,
              "_canonical_cold_liveness_cell",
              r'''
              def _canonical_cold_liveness_cell(grid_path: Path, method: str) -> Cell:
                  """Build the liveness cell through the registered method contract."""

                  grid = yaml.safe_load(grid_path.read_text(encoding="utf-8"))
                  if not isinstance(grid, dict):
                      raise TypeError("Canonical liveness grid root must be a mapping")
                  liveness = grid["execution"]["liveness"]
                  seed_offsets = grid["sweep"]["seed_offsets"]
                  if "representative_delta_v" in liveness:
                      value = float(liveness["representative_delta_v"])
                  elif "representative_c" in liveness:
                      value = float(liveness["representative_c"])
                  else:
                      raise RuntimeError(
                          "Canonical liveness grid has no representative method parameter"
                      )
                  return _method_spec(method).build_cell(
                      task="countdown",
                      method=method,
                      seed=int(seed_offsets[0]),
                      stage="liveness",
                      value=value,
                      lambda_only=False,
                      dpo_initialization=None,
                  )
              ''',
          )
          text = exp.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "    cell = _canonical_cold_liveness_cell(grid_path)\n",
              "    cell = _canonical_cold_liveness_cell(grid_path, method)\n",
              "canonical liveness cell dispatch",
          )
          exp.write_text(text, encoding="utf-8")

          # Remove four parallel projection descriptions. Method parameters are now the
          # one grouping/plot source; compatibility_columns remains only for frozen legacy schemas.
          remove_methodspec_projection_surface(exp)

          replace_top_level_function(
              exp,
              "_coldstart_method_grouped_curve",
              r'''
              def _coldstart_method_grouped_curve(
                  *,
                  task: str,
                  method: str,
                  method_rows: Sequence[Mapping[str, Any]],
                  cells_by_key: Mapping[str, Cell],
              ) -> list[dict[str, Any]]:
                  """Group one method by its opaque parameter contract."""

                  spec = _method_spec(method)
                  groups: dict[
                      str,
                      tuple[dict[str, Any], list[Mapping[str, Any]]],
                  ] = {}
                  for row in method_rows:
                      cell_key = str(row["cell_key"])
                      if cell_key not in cells_by_key:
                          raise RuntimeError(f"Unknown cold-start cell in aggregate: {cell_key}")
                      cell = cells_by_key[cell_key]
                      if cell.task != task or cell.method != method:
                          raise RuntimeError(
                              f"Cold-start aggregate identity mismatch for {cell_key}"
                          )
                      parameters = dict(spec.parameters(cell))
                      identity = e8_results.parameter_identity(parameters)
                      if identity not in groups:
                          groups[identity] = (parameters, [])
                      elif groups[identity][0] != parameters:
                          raise RuntimeError(
                              f"Method parameter identity changed for {cell_key}"
                          )
                      groups[identity][1].append(row)

                  ordered = sorted(
                      groups.values(),
                      key=lambda item: e8_results.parameter_sort_key(item[0]),
                  )
                  return [
                      {
                          "task": task,
                          "method": method,
                          **parameters,
                          **_coldstart_group_metrics(group),
                      }
                      for parameters, group in ordered
                  ]
              ''',
          )

          replace_top_level_function(
              exp,
              "_aggregate_coldstart_unranked",
              r'''
              def _aggregate_coldstart_unranked(
                  config: Mapping[str, Any],
                  output_root: Path,
                  rows: list[dict[str, Any]],
              ) -> dict[str, Any]:
                  """Aggregate one registered non-Exp curve without selection or ranking."""

                  method = _coldstart_method(config)
                  spec = _method_spec(method)
                  configured_cells = build_cells(config)
                  cells_by_key = {cell.key: cell for cell in configured_cells}
                  if len(cells_by_key) != len(configured_cells):
                      raise RuntimeError("Cold-start aggregate contains duplicate cell keys")
                  target_cells = [cell for cell in configured_cells if cell.method == method]
                  parameter_names = tuple(
                      dict.fromkeys(
                          name
                          for cell in target_cells
                          for name in spec.parameters(cell)
                          if name != "dpo_initialization"
                      )
                  )

                  run_id, source_commit = _coldstart_run_provenance(output_root)
                  plot_rows: list[dict[str, Any]] = []
                  for row in rows:
                      cell_key = str(row["cell_key"])
                      if cell_key not in cells_by_key:
                          raise RuntimeError(
                              f"Unknown cold-start cell in plot aggregate: {cell_key}"
                          )
                      cell = cells_by_key[cell_key]
                      parameters = dict(spec.parameters(cell)) if cell.method == method else {}
                      plot_rows.append(
                          {
                              "task": row["task"],
                              "method": row["method"],
                              "dpo_initialization": row["dpo_initialization"],
                              "seed": row["seed"],
                              "stage": row["stage"],
                              "experiment_id": experiment_id(config),
                              "run_id": run_id,
                              "source_commit": source_commit,
                              **{name: parameters.get(name) for name in parameter_names},
                              **_coldstart_plot_metrics(row),
                          }
                      )
                  _write_csv(output_root / "aggregate" / "plot_curve_points.csv", plot_rows)

                  summaries: dict[str, Any] = {}
                  summary_rows: list[dict[str, Any]] = []
                  for task_value in config["suite"]["tasks"]:
                      task = str(task_value)
                      task_cells = [cell for cell in configured_cells if cell.task == task]
                      if not task_cells:
                          continue
                      task_rows = [row for row in rows if row["task"] == task]
                      controls = {
                          control: [row for row in task_rows if row["method"] == control]
                          for control in (METHOD_POSITIVE_ONLY, METHOD_GLOBAL)
                      }
                      method_rows = [row for row in task_rows if row["method"] == method]
                      expected = {
                          candidate: sum(cell.method == candidate for cell in task_cells)
                          for candidate in (method, *controls)
                      }
                      if len(method_rows) != expected[method] or any(
                          len(group) != expected[control]
                          for control, group in controls.items()
                      ):
                          raise RuntimeError(
                              f"{task} {method} cold-start cell geometry is incomplete"
                          )
                      grouped_curve = _coldstart_method_grouped_curve(
                          task=task,
                          method=method,
                          method_rows=method_rows,
                          cells_by_key=cells_by_key,
                      )
                      summaries[task] = {
                          "task": task,
                          "grouped_curve": grouped_curve,
                          "positive_only": controls[METHOD_POSITIVE_ONLY] or None,
                          "global": controls[METHOD_GLOBAL] or None,
                          "parameter_selection_deferred_to_reviewed_protocol": True,
                          "terminal_valid_rate_role": "diagnostic_only_not_selection_eligibility",
                      }
                      summary_rows.append(
                          {
                              "task": task,
                              f"{method}_parameter_points": len(grouped_curve),
                              "finite_parameter_points": sum(
                                  not bool(row["nan_inf_failure"])
                                  for row in grouped_curve
                              ),
                              "parameter_selection_deferred": True,
                          }
                      )
                  _write_csv(output_root / "aggregate" / "task_summary.csv", summary_rows)

                  summary = {
                      "schema_version": 1,
                      "experiment_id": experiment_id(config),
                      "run_id": run_id,
                      "source_commit": source_commit,
                      "cell_count": len(rows),
                      "plot_curve_point_count": len(plot_rows),
                      "method": method,
                      "tasks": summaries,
                      "excluded_tasks": dict(config["suite"]["excluded_tasks"]),
                      "initialization": dict(config["initialization"]),
                      "scientific_kernel": spec.scientific_kernel,
                      **dict(spec.single_aggregate_metadata(config)),
                      "countdown_protocol_diagnostic": _countdown_protocol_diagnostic(
                          config,
                          output_root,
                          destination=(
                              output_root / "aggregate" / "countdown_protocol_diagnostic.json"
                          ),
                      ),
                      "countdown_result_gate": False,
                      "primary_metric": "validation_late_window_pass8_mean",
                      "parameter_selection_deferred_to_reviewed_protocol": True,
                      "test_partition_accessed": False,
                      "method_ranking_allowed": False,
                      "significance_claim_allowed": False,
                      "fixed_horizon_is_convergence": False,
                      "task_performance_reported_separately": True,
                      "structure_diagnostic_reported_separately": True,
                      "nan_inf_reported_separately": True,
                      "scientific_status": (
                          "not_run" if _is_engineering_self_test(config) else "pilot"
                      ),
                      "engineering_placeholder_backend": _is_engineering_self_test(config),
                  }
                  atomic_json(output_root / "aggregate" / "aggregate_summary.json", summary)
                  return summary
              ''',
          )

          replace_top_level_function(
              exp,
              "_aggregate_coldstart_matrix_unranked",
              r'''
              def _aggregate_coldstart_matrix_unranked(
                  config: Mapping[str, Any],
                  output_root: Path,
                  rows: list[dict[str, Any]],
              ) -> dict[str, Any]:
                  """Aggregate a registered multi-method matrix without ranking methods."""

                  methods = _coldstart_methods(config)
                  run_id, source_commit = _coldstart_run_provenance(output_root)
                  configured_cells = build_cells(config)
                  cells_by_key = {cell.key: cell for cell in configured_cells}
                  if len(cells_by_key) != len(configured_cells):
                      raise RuntimeError("Baseline matrix contains duplicate cell keys")
                  legacy_parameter_columns = ("delta_v", "beta", "dpo_initialization")
                  extra_parameter_names = tuple(
                      dict.fromkeys(
                          name
                          for cell in configured_cells
                          if cell.method in methods
                          for name in _method_spec(cell.method).parameters(cell)
                          if name not in legacy_parameter_columns
                      )
                  )
                  plot_rows: list[dict[str, Any]] = []
                  for row in rows:
                      cell = cells_by_key[str(row["cell_key"])]
                      parameters = dict(_method_spec(cell.method).parameters(cell))
                      plot_rows.append(
                          {
                              "task": row["task"],
                              "method": row["method"],
                              "delta_v": row.get("delta_v"),
                              "beta": row.get("beta"),
                              "dpo_initialization": row.get("dpo_initialization"),
                              **{
                                  name: parameters.get(name)
                                  for name in extra_parameter_names
                              },
                              "seed": row["seed"],
                              "stage": row["stage"],
                              "experiment_id": experiment_id(config),
                              "run_id": run_id,
                              "source_commit": source_commit,
                              **_coldstart_plot_metrics(row),
                          }
                      )
                  _write_csv(output_root / "aggregate" / "plot_curve_points.csv", plot_rows)

                  task_summaries: dict[str, Any] = {}
                  summary_rows: list[dict[str, Any]] = []
                  for task_value in config["suite"]["p0_tasks"]:
                      task = str(task_value)
                      task_rows = [row for row in rows if row["task"] == task]
                      task_cells = [cell for cell in configured_cells if cell.task == task]
                      method_summaries: dict[str, Any] = {}
                      summary_row: dict[str, Any] = {"task": task}
                      for method in methods:
                          method_rows = [
                              row for row in task_rows if row["method"] == method
                          ]
                          expected = sum(
                              cell.method == method for cell in task_cells
                          )
                          if len(method_rows) != expected:
                              raise RuntimeError(
                                  f"{task} {method} baseline-matrix cell geometry is incomplete"
                              )
                          grouped_curve = _coldstart_method_grouped_curve(
                              task=task,
                              method=method,
                              method_rows=method_rows,
                              cells_by_key=cells_by_key,
                          )
                          method_summaries[method] = {
                              "grouped_curve": grouped_curve,
                              "parameter_selection_deferred_to_reviewed_protocol": True,
                              "terminal_valid_rate_role": "diagnostic_only_not_selection_eligibility",
                          }
                          summary_row[f"{method}_parameter_points"] = len(grouped_curve)
                      task_summaries[task] = {
                          "task": task,
                          "methods": method_summaries,
                      }
                      summary_rows.append(summary_row)
                  _write_csv(output_root / "aggregate" / "task_summary.csv", summary_rows)

                  method_metadata = {
                      method: dict(_method_spec(method).matrix_aggregate_metadata(config))
                      for method in methods
                  }
                  summary = {
                      "schema_version": 1,
                      "experiment_id": experiment_id(config),
                      "run_id": run_id,
                      "source_commit": source_commit,
                      "cell_count": len(rows),
                      "plot_curve_point_count": len(plot_rows),
                      "method": METHOD_BASELINE_MATRIX,
                      "methods": list(methods),
                      "execution_class": _execution_class(config),
                      "method_metadata": method_metadata,
                      "transfer_seed_offsets": list(
                          experiment_config.task_transfer_seeds(config)
                      ),
                      "tasks": task_summaries,
                      "excluded_tasks": dict(config["suite"]["excluded_tasks"]),
                      "countdown_protocol_diagnostic": _countdown_protocol_diagnostic(
                          config,
                          output_root,
                          destination=(
                              output_root / "aggregate" / "countdown_protocol_diagnostic.json"
                          ),
                      ),
                      "countdown_result_gate": False,
                      "primary_metric": "validation_late_window_pass8_mean",
                      "parameter_selection_deferred_to_reviewed_protocol": True,
                      "method_ranking_allowed": False,
                      "significance_claim_allowed": False,
                      "test_partition_accessed": False,
                      "fixed_horizon_is_convergence": False,
                      "task_performance_reported_separately": True,
                      "structure_diagnostic_reported_separately": True,
                      "nan_inf_reported_separately": True,
                      "scientific_status": (
                          "not_run" if _is_engineering_self_test(config) else "pilot"
                      ),
                      "engineering_placeholder_backend": _is_engineering_self_test(config),
                  }
                  atomic_json(output_root / "aggregate" / "aggregate_summary.json", summary)
                  return summary
              ''',
          )

          replace_top_level_function(
              exp,
              "_write_coldstart_task_result",
              r'''
              def _write_coldstart_task_result(
                  config: Mapping[str, Any],
                  output_root: Path,
                  task: str,
                  rows: list[dict[str, Any]],
              ) -> dict[str, Any]:
                  """Publish deterministic task-local CSVs and write TASK_COMPLETE.json last."""

                  provenance_path = output_root / "source_provenance.json"
                  if not provenance_path.is_file():
                      raise RuntimeError(
                          "Per-task result materialization requires source_provenance.json"
                      )
                  provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
                  source_commit = str(provenance.get("source_commit", ""))
                  if len(source_commit) != 40 or any(
                      character not in "0123456789abcdef" for character in source_commit
                  ):
                      raise RuntimeError(
                          "Per-task result materialization requires one full source commit"
                      )
                  run_id = str(provenance.get("run_id", output_root.name))
                  root = output_root / "task_results" / task
                  root.mkdir(parents=True, exist_ok=True)
                  marker_path = root / "TASK_COMPLETE.json"
                  marker_path.unlink(missing_ok=True)

                  all_cells_path = root / "all_cells.csv"
                  plot_path = root / "plot_curve_points.csv"
                  _write_csv(all_cells_path, rows)
                  cells_by_key = {
                      cell.key: cell for cell in build_cells(config) if cell.task == task
                  }
                  legacy_parameter_columns = (
                      "delta_v",
                      "beta",
                      "dpo_initialization",
                      "lambda",
                      "rho",
                  )
                  extra_parameter_names = tuple(
                      dict.fromkeys(
                          name
                          for cell in cells_by_key.values()
                          for name in _method_spec(cell.method).parameters(cell)
                          if name not in legacy_parameter_columns
                      )
                  )
                  plot_rows: list[dict[str, Any]] = []
                  for row in rows:
                      cell = cells_by_key[str(row["cell_key"])]
                      parameters = dict(_method_spec(cell.method).parameters(cell))
                      plot_rows.append(
                          {
                              "experiment_id": experiment_id(config),
                              "run_id": run_id,
                              "source_commit": source_commit,
                              "task": row["task"],
                              "method": row["method"],
                              "delta_v": row.get("delta_v"),
                              "beta": row.get("beta"),
                              "dpo_initialization": row.get("dpo_initialization"),
                              "lambda": row["lambda"],
                              "rho": row["rho"],
                              **{
                                  name: parameters.get(name)
                                  for name in extra_parameter_names
                              },
                              "seed": row["seed"],
                              "stage": row["stage"],
                              **_coldstart_plot_metrics(row),
                          }
                      )
                  _write_csv(plot_path, plot_rows)
                  cell_manifest_sha256 = {
                      row["cell_key"]: sha256_file(
                          output_root
                          / "cells"
                          / str(row["cell_key"])
                          / "cell_manifest.json"
                      )
                      for row in rows
                  }
                  marker = {
                      "schema_version": 1,
                      "experiment_id": experiment_id(config),
                      "config_hash": stable_config_hash(config),
                      "run_id": run_id,
                      "source_commit": source_commit,
                      "task": task,
                      "expected_cells": len(rows),
                      "cell_count": len(rows),
                      "all_cells_csv": f"task_results/{task}/all_cells.csv",
                      "all_cells_csv_sha256": sha256_file(all_cells_path),
                      "plot_curve_points_csv": f"task_results/{task}/plot_curve_points.csv",
                      "plot_curve_points_csv_sha256": sha256_file(plot_path),
                      "cell_manifest_sha256": cell_manifest_sha256,
                      "analysis_ready": True,
                      "final_aggregate_authority": False,
                      "test_partition_accessed": False,
                      "method_ranking_allowed": False,
                      "complete": True,
                      "scientific_status": (
                          "not_run" if _is_engineering_self_test(config) else "pilot"
                      ),
                      "note": (
                          "Deterministic early task snapshot from completed identity-matched "
                          "cells; the terminal aggregate remains the final reporting authority."
                      ),
                  }
                  atomic_json(marker_path, marker)
                  return marker
              ''',
          )

          # Characterization tests generated by the first finalizer should follow the
          # narrowed paper-grid seam rather than the removed field name.
          text = p0_tests.read_text(encoding="utf-8")
          text = text.replace(
              'assert "method_spec.paper_grid_source(config, cell)" in source',
              'assert "_paper_grid_for_cell(config, record, cell)" in source',
          )
          p0_tests.write_text(text, encoding="utf-8")

          # One real dummy MethodSpec acceptance path; remove parallel test-only runtime abstractions.
          contract.write_text(
              textwrap.dedent(
                  r'''#!/usr/bin/env bash
                  set -euo pipefail
                  ROOT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
                  export PYTHONPATH="${ROOT_DIR}/src${PYTHONPATH:+:${PYTHONPATH}}"
                  python3 -m py_compile \
                    "${ROOT_DIR}/src/drpo/e8_multitask_orchestration.py" \
                    "${ROOT_DIR}/src/drpo/e8_multitask_results.py" \
                    "${ROOT_DIR}/src/drpo/e8_multitask_runtime.py"
                  python3 - <<'PYTEST'
                  from __future__ import annotations

                  import inspect
                  import json
                  import tempfile
                  import threading
                  import time
                  from pathlib import Path

                  import yaml

                  from drpo import e8_multitask_exp_tuning as exp_tuning
                  from drpo.e8_multitask_orchestration import (
                      SchedulerCallbacks,
                      execution_geometry,
                      nominal_batches,
                      plan_rows,
                      run_dynamic_queue,
                  )
                  from drpo.e8_multitask_runtime import MethodAuditResult, recovery_identity

                  repo_root = Path(__import__("os").environ["PYTHONPATH"].split(":", 1)[0]).parent
                  for relative in (
                      "src/drpo/e8_multitask_orchestration.py",
                      "src/drpo/e8_multitask_results.py",
                      "src/drpo/e8_multitask_runtime.py",
                  ):
                      text = (repo_root / relative).read_text(encoding="utf-8").lower()
                      for forbidden in ("asymre", "topr", "canonical_dpo"):
                          assert forbidden not in text, (relative, forbidden)

                  dummy_name = "dummy_contract_method"


                  def build_dummy(
                      *, task, method, seed, stage, value, lambda_only, dpo_initialization
                  ):
                      del lambda_only, dpo_initialization
                      return exp_tuning.Cell(
                          task=task,
                          method=method,
                          rho=None,
                          seed=seed,
                          stage=stage,
                          method_parameters={"temperature": float(value)},
                      )


                  def parameters(cell):
                      return dict(cell.method_parameters or {})


                  def compatibility(cell):
                      value = parameters(cell)["temperature"]
                      return {
                          "delta_v": None,
                          "beta": None,
                          "dpo_initialization": None,
                          "rho": None,
                          "lambda": None,
                          "temperature": value,
                      }


                  def cell_key(cell):
                      value = parameters(cell)["temperature"]
                      tag = f"{value:.3f}".replace(".", "p")
                      return f"{cell.task}__{cell.method}_{tag}__seed{cell.seed}"


                  spec = exp_tuning.MethodSpec(
                      name=dummy_name,
                      build_cell=build_dummy,
                      cell_key=cell_key,
                      parameters=parameters,
                      compatibility_columns=compatibility,
                      cell_initialization=lambda config: None,
                      initialization_identity=lambda config: {},
                      train_cold=lambda cell, **kwargs: {"complete": True},
                      liveness_task=lambda config: "countdown",
                      liveness_runner=lambda **kwargs: {"complete": True},
                      canonical_liveness_grid=None,
                      paper_grid_paths=None,
                      paper_cell_parameters=None,
                      paper_formula="dummy_contract_only",
                      audit_record=lambda cell, record: MethodAuditResult(
                          True, {"temperature": parameters(cell)["temperature"]}
                      ),
                      audit_failure_bucket="terminal_contract_failures",
                      scientific_kernel="dummy_contract_only",
                      single_aggregate_metadata=lambda config: {},
                      matrix_aggregate_metadata=lambda config: {},
                  )
                  exp_tuning._register_method_spec(spec)
                  try:
                      cells = tuple(
                          exp_tuning._coldstart_method_cell(
                              task,
                              dummy_name,
                              seed,
                              "task_transfer",
                              value,
                              lambda_only=False,
                          )
                          for seed in (4000, 5000)
                          for task in ("a", "b")
                          for value in (0.1, 0.2)
                      )
                      batches = nominal_batches(
                          cells,
                          slot_count=4,
                          seed_barrier=True,
                          seed_order=(4000, 5000),
                      )
                      assert [len(batch) for batch in batches] == [4, 4]
                      rows = plan_rows(
                          batches,
                          gpu_ids=(0, 1),
                          project_cell=lambda cell: exp_tuning._method_spec(
                              cell.method
                          ).compatibility_columns(cell),
                      )
                      assert len(rows) == 8
                      assert {row["temperature"] for row in rows} == {0.1, 0.2}
                      geometry = execution_geometry(
                          cells,
                          gpu_ids=(0, 1),
                          slots_per_gpu=2,
                          max_concurrent_cells=4,
                          seed_barrier=True,
                          seed_order=(4000, 5000),
                      )
                      assert geometry.expected_cells_by_seed == {4000: 4, 5000: 4}

                      lock = threading.Lock()
                      seed4000_hooks = 0
                      released_early = False

                      def run_cell(cell, slot, gpu_id):
                          nonlocal_vars = None
                          del nonlocal_vars, slot, gpu_id
                          global released_early
                          with lock:
                              if cell.seed == 5000 and seed4000_hooks < 4:
                                  released_early = True
                          time.sleep(0.001)
                          return {"returncode": 0}

                      def after_success(cell, row):
                          global seed4000_hooks
                          del row
                          if cell.seed == 4000:
                              with lock:
                                  seed4000_hooks += 1

                      run = run_dynamic_queue(
                          cells,
                          gpu_ids=(0, 1),
                          slots_per_gpu=2,
                          max_concurrent_cells=4,
                          seed_barrier=True,
                          seed_order=(4000, 5000),
                          callbacks=SchedulerCallbacks(
                              run_cell=run_cell,
                              after_success=after_success,
                          ),
                      )
                      assert len(run) == 8
                      assert not released_early
                      assert seed4000_hooks == 4

                      aggregate_rows = []
                      for cell in cells:
                          aggregate_rows.append(
                              {
                                  "cell_key": cell.key,
                                  "task": cell.task,
                                  "method": cell.method,
                                  "seed": cell.seed,
                                  "late_window_pass8_mean": parameters(cell)["temperature"],
                                  "late_window_greedy_mean": 0.0,
                                  "terminal_pass8": parameters(cell)["temperature"],
                                  "terminal_greedy_valid_rate": 1.0,
                                  "nan_inf_failure": False,
                              }
                          )
                      curve = exp_tuning._coldstart_method_grouped_curve(
                          task="a",
                          method=dummy_name,
                          method_rows=[row for row in aggregate_rows if row["task"] == "a"],
                          cells_by_key={cell.key: cell for cell in cells},
                      )
                      assert [row["temperature"] for row in curve] == [0.1, 0.2]
                      assert all(row["seeds"] == [4000, 5000] for row in curve)

                      identity = recovery_identity(
                          cells[0],
                          experiment_id="DEV-DUMMY-METHOD-SPEC",
                          config_hash="cfg",
                          cell_identity_fields=compatibility(cells[0]),
                          common_identity_fields={"bank_hash": "bank"},
                      )
                      assert len(identity["identity_hash"]) == 64

                      with tempfile.TemporaryDirectory() as temporary:
                          grid_path = Path(temporary) / "liveness.yaml"
                          grid_path.write_text(
                              yaml.safe_dump(
                                  {
                                      "execution": {
                                          "liveness": {"representative_c": 0.1}
                                      },
                                      "sweep": {"seed_offsets": [4000]},
                                  }
                              ),
                              encoding="utf-8",
                          )
                          live_cell = exp_tuning._canonical_cold_liveness_cell(
                              grid_path, dummy_name
                          )
                          assert parameters(live_cell) == {"temperature": 0.1}

                      assert spec.audit_record(cells[0], {}).passed
                      audit_source = inspect.getsource(exp_tuning.cmd_audit)
                      assert "_method_spec(cell.method).audit_record" in audit_source
                      matrix_source = inspect.getsource(
                          exp_tuning._aggregate_coldstart_matrix_unranked
                      )
                      for forbidden in (
                          "METHOD_ASYMRE",
                          "METHOD_TOPR",
                          "METHOD_DPO",
                      ):
                          assert forbidden not in matrix_source
                      method_spec_fields = set(exp_tuning.MethodSpec.__dataclass_fields__)
                      assert not {
                          "group_projection",
                          "group_order",
                          "plot_columns",
                          "plot_projection",
                      }.intersection(method_spec_fields)
                  finally:
                      removed = exp_tuning._METHOD_SPECS.pop(dummy_name)
                      assert removed is spec

                  print(
                      json.dumps(
                          {
                              "dummy_cells": len(cells),
                              "method_name_leakage": "pass",
                              "production_grouping": "pass",
                              "production_audit_hook": "pass",
                              "recovery_identity": "pass",
                              "seed_barrier": "pass",
                              "generic_liveness_cell": "pass",
                              "matrix_parameter_extensibility": "pass",
                              "methodspec_surface_reduced": "pass",
                          },
                          sort_keys=True,
                      )
                  )
                  PYTEST
                  '''
              ).lstrip(),
              encoding="utf-8",
          )

          # No stale projection or unsupported paper hooks may remain in production/tests.
          combined = "\n".join(
              path.read_text(encoding="utf-8")
              for path in (exp, results, runtime, contract, p0_tests)
          )
          for forbidden in (
              ".group_projection",
              ".group_order",
              ".plot_columns",
              ".plot_projection",
              "_unsupported_paper_grid",
              "_unsupported_paper_params",
              "paper_grid_source",
          ):
              if forbidden in combined:
                  raise RuntimeError(f"stale refactor surface remains: {forbidden}")
          PY
      - name: Static compile
        run: |
          python -m py_compile \
