name: E8 Final Correctness Fix Retry Once

on:
  push:
    branches:
      - dev/e8-config-driven-sweep-01
    paths:
      - .github/workflows/e8-final-correctness-fix-retry-once.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify starting after-image
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "af305dcd8b57ad7bb355e756967fea6aeb39b8bb"
          test "$(git rev-parse HEAD^^)" = "3e4ebd8ea77af9769445e17ecae1b138d4461233"
          git diff --quiet origin/main -- .github/workflows/code-change-budget.yml

      - name: Apply minimal correctness repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          config_path = "src/drpo/e8_experiment_config.py"
          replace_once(config_path, '        "selection": ("finite_required", "report_grid_edge"),\n', "")
          replace_once(
              config_path,
              '''    evaluation = config["evaluation"]
    if (
        evaluation.get("primary_checkpoint_policy") != "late_window_and_terminal"
        or evaluation.get("best_checkpoint_role") != "supplementary_only"
    ):
        raise ValueError("Cold-start checkpoint-selection mode is not implemented")

''',
              "",
          )
          replace_once(
              config_path,
              '''    selection = config["selection"]
    if (
        selection.get("primary_metric") != "validation_late_window_pass8_mean"
        or selection.get("finite_required") is not True
        or selection.get("report_grid_edge") is not True
        or selection.get("terminal_valid_rate_role") != "diagnostic_only_not_selection_eligibility"
        or tuple(selection.get("tie_breakers", ()))
        != (
            "validation_terminal_pass8",
            "validation_late_window_greedy_mean",
            "smaller_lambda",
        )
    ):
        raise ValueError("Cold-start selection mode is not implemented")

''',
              "",
          )

          replace_once(
              "src/drpo/e8_multitask_exp_tuning.py",
              '''def sweep_profile(config: Mapping[str, Any]) -> str:
    return str(config.get("sweep", {}).get("profile", SWEEP_PROFILE_RHO))
''',
              '''def sweep_profile(config: Mapping[str, Any]) -> str:
    return experiment_config.sweep_profile(config)
''',
          )

          runner_path = Path("scripts/run_e8_multitask_exp_coldstart.sh")
          runner = runner_path.read_text(encoding="utf-8")
          if runner.count("--lambda 0.693147181") != 1:
              raise SystemExit("unexpected liveness coefficient occurrence count")
          runner = runner.replace("--lambda 0.693147181", "--lambda 0.916290732", 1)
          start = runner.index("\nrun_formal_guard_attempt() {\n")
          end = runner.index("\nreport_formal_success() {\n", start)
          formal = runner[start:end]
          bs = chr(92)
          needle = f"    --source-file src/drpo/e8_multitask_exp_tuning.py {bs}\n"
          if formal.count(needle) != 1:
              raise SystemExit("formal source provenance insertion point changed")
          replacement = (
              needle
              + f"    --source-file src/drpo/e8_experiment_config.py {bs}\n"
              + f"    --source-file scripts/preflight_e8_multitask_config.py {bs}\n"
          )
          formal = formal.replace(needle, replacement, 1)
          runner = runner[:start] + formal + runner[end:]
          runner_path.write_text(runner, encoding="utf-8")

          tests = Path("tests/test_e8_multitask_p0.py")
          text = tests.read_text(encoding="utf-8")
          marker = "\ndef test_zero_warmup_reaches_legacy_scheduler(tmp_path: Path) -> None:\n"
          if text.count(marker) != 1:
              raise SystemExit("focused-test insertion marker changed")
          addition = r'''

def test_final_correctness_audit_after_image() -> None:
    from drpo import e8_multitask_exp_tuning as exp_tuning

    config = exp_tuning.load_config(Path("configs/e8_multitask_exp_lambda_curve_completion.yaml"))
    config["experiment_id"] = "EXT-C-E8-MULTITASK-FINAL-CORRECTNESS-TEST"
    config["evaluation"]["primary_checkpoint_policy"] = "report_only_metadata"
    config["evaluation"]["best_checkpoint_role"] = "report_only_metadata"
    config["selection"]["primary_metric"] = "report_only_metadata"
    config["selection"]["finite_required"] = False
    config["selection"]["report_grid_edge"] = False
    config["selection"]["terminal_valid_rate_role"] = "report_only_metadata"
    config["selection"]["tie_breakers"] = []
    exp_tuning.validate_config(config)

    runner = Path("scripts/run_e8_multitask_exp_coldstart.sh").read_text(encoding="utf-8")
    formal = runner.split("\nrun_formal_guard_attempt() {\n", 1)[1].split(
        "\nreport_formal_success() {\n", 1
    )[0]
    assert "--source-file src/drpo/e8_experiment_config.py" in formal
    assert "--source-file scripts/preflight_e8_multitask_config.py" in formal
    assert "--lambda 0.916290732" in runner
    assert "--lambda 0.693147181" not in runner
    assert exp_tuning.sweep_profile(config) == "eight_task_coldstart_lambda_v1"
'''
          tests.write_text(text.replace(marker, addition + marker, 1), encoding="utf-8")

          protocol = Path("docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md")
          text = protocol.read_text(encoding="utf-8")
          old_status = "Status: third adversarial audit closure specified / implementation repair pending / final-head repository gates pending / independent review pending / not a scientific result."
          new_status = "Status: latest correctness repair applied / focused final-head checks pending this repair run / independent review pending / not a scientific result."
          if text.count(old_status) != 1:
              raise SystemExit("protocol status marker changed")
          text = text.replace(old_status, new_status, 1)
          text += '''

## 2026-09-02 final correctness after-image correction

This section supersedes the remaining inconsistent implementation details found after gate liquidation. It does not change scientific variables, historical configs, the canonical paper trainer/loss, or any scientific result.

- Formal raw guarded-run provenance includes both approved config-authority Python paths: `src/drpo/e8_experiment_config.py` and `scripts/preflight_e8_multitask_config.py`; delivery-preflight provenance is no longer the only place that records them.
- Residual runtime rejection of reporting/selection-policy declarations is removed. The actual canonical selection/reporting behavior remains implemented by the existing runtime; this change only removes the unapproved second policy lock.
- The post-audit hard-coded Countdown liveness coefficient `0.693147181` is reverted to the pre-audit/main runner value `0.916290732`; no new exact liveness identity is introduced.
- `e8_multitask_exp_tuning.sweep_profile()` delegates to the approved config-authority module rather than re-parsing the same field.
- This remains engineering-only evidence. No model training, GPU sweep, task-performance result, support/variance-boundary result, numerical-collapse result, convergence result, significance result, or method ranking is produced.
'''
          protocol.write_text(text, encoding="utf-8")
          PY

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q "numpy==1.26.4" "PyYAML==6.0.2" "pytest>=8,<9" "ruff>=0.9,<1"

      - name: Format and static checks
        run: |
          set -euo pipefail
          ruff format src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python -m py_compile src/drpo/e8_experiment_config.py scripts/preflight_e8_multitask_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          ruff check src/drpo/e8_experiment_config.py scripts/preflight_e8_multitask_config.py tests/test_e8_multitask_p0.py
          ruff format --check src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py scripts/preflight_e8_multitask_config.py tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh

      - name: Focused E8 regression
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m pytest -q tests/test_e8_multitask_p0.py | tee /tmp/e8-focused.log
          PYTHONPATH=src python -m pytest -q tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py -k 'not reciprocal and not asymre' | tee /tmp/e8-countdown.log

      - name: Real config preflights and governance verification
        run: |
          set -euo pipefail
          for config in configs/e8_multitask_exp_coldstart.yaml configs/e8_multitask_exp_lambda_completion.yaml configs/e8_multitask_exp_lambda_curve_completion.yaml; do
            PYTHONPATH=src python scripts/preflight_e8_multitask_config.py --repo-root . --config "$config" >/dev/null
          done
          python scripts/handoff_authority.py verify --repo-root .
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .
          git diff --check
          git diff --quiet origin/main -- .github/workflows/code-change-budget.yml

      - name: Record current validation evidence
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          def last_nonempty(path: str) -> str:
              lines = [line for line in Path(path).read_text().splitlines() if line.strip()]
              return lines[-1]

          protocol = Path("docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md")
          text = protocol.read_text(encoding="utf-8")
          pending = "Status: latest correctness repair applied / focused final-head checks pending this repair run / independent review pending / not a scientific result."
          passed = "Status: latest correctness repair applied / focused final-head checks passed / independent review pending / not a scientific result."
          if text.count(pending) != 1:
              raise SystemExit("protocol pending-status marker changed")
          text = text.replace(pending, passed, 1)
          text += (
              "\nLatest correctness validation run: `" + os.environ["RUN_ID"] + "`. "
              "Focused E8: `" + last_nonempty("/tmp/e8-focused.log") + "`; "
              "Countdown subset: `" + last_nonempty("/tmp/e8-countdown.log") + "`. "
              "Python compilation, Ruff, shell syntax, three real config preflights, handoff authority, governance-stage validation, `git diff --check`, and the #340 no-diff check for `.github/workflows/code-change-budget.yml` all passed in the same run.\n"
          )
          protocol.write_text(text, encoding="utf-8")
          PY

      - name: Commit verified after-image and remove temporary workflows
        run: |
          set -euo pipefail
          rm .github/workflows/e8-final-correctness-fix-once.yml
          rm .github/workflows/e8-final-correctness-fix-retry-once.yml
          git diff --check
          test ! -e .github/workflows/e8-final-correctness-fix-once.yml
          test ! -e .github/workflows/e8-final-correctness-fix-retry-once.yml
          git diff --quiet origin/main -- .github/workflows/code-change-budget.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix(e8): close final correctness audit gaps"
          git push origin HEAD:dev/e8-config-driven-sweep-01
