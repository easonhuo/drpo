name: E8 baseline final correctness

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-baselines-final-correctness.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply final correctness repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runner_path = Path("src/drpo/e8_multitask_exp_tuning.py")
          tests_path = Path("tests/test_e8_multitask_p0.py")
          runner = runner_path.read_text(encoding="utf-8")
          tests = tests_path.read_text(encoding="utf-8")

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          runner = once(
              runner,
              '    greedy_prompt_rows: int,\n'
              '    passk_prompt_rows: int,\n'
              ') -> Any:\n',
              '    greedy_prompt_rows: int,\n'
              '    passk_prompt_rows: int,\n'
              '    sampling_temperature: float = 0.8,\n'
              '    top_p: float = 0.95,\n'
              ') -> Any:\n',
              "task evaluator runtime args",
          )
          runner = once(
              runner,
              '                0.8 if int(pass_k) > 1 else 1.0,\n'
              '                0.95 if int(pass_k) > 1 else 1.0,\n',
              '                float(sampling_temperature) if int(pass_k) > 1 else 1.0,\n'
              '                float(top_p) if int(pass_k) > 1 else 1.0,\n',
              "task evaluator sampling args",
          )

          dpo_call = (
              '            greedy_prompt_rows=int(config["task_runtime"][cell.task]["greedy_prompt_rows"]),\n'
              '            passk_prompt_rows=int(config["task_runtime"][cell.task]["passk_prompt_rows"]),\n'
              '        )\n'
          )
          if runner.count(dpo_call) != 2:
              raise RuntimeError(f"evaluator call sites: expected 2, found {runner.count(dpo_call)}")
          runner = runner.replace(
              dpo_call,
              '            greedy_prompt_rows=int(config["task_runtime"][cell.task]["greedy_prompt_rows"]),\n'
              '            passk_prompt_rows=int(config["task_runtime"][cell.task]["passk_prompt_rows"]),\n'
              '            sampling_temperature=float(effective["evaluation"]["sampling_temperature"]),\n'
              '            top_p=float(effective["evaluation"]["top_p"]),\n'
              '        )\n',
              1,
          )
          runner = runner.replace(
              dpo_call,
              '            greedy_prompt_rows=int(config["task_runtime"][cell.task]["greedy_prompt_rows"]),\n'
              '            passk_prompt_rows=int(config["task_runtime"][cell.task]["passk_prompt_rows"]),\n'
              '            sampling_temperature=float(effective_runtime["evaluation"]["sampling_temperature"]),\n'
              '            top_p=float(effective_runtime["evaluation"]["top_p"]),\n'
              '        )\n',
              1,
          )

          runner = once(
              runner,
              '    if cell.method != METHOD_DPO or cell.beta is None:\n'
              '        raise ValueError("Canonical DPO transfer trainer received a non-DPO cell")\n'
              '    if cell.task == "countdown":\n',
              '    if cell.method != METHOD_DPO or cell.beta is None:\n'
              '        raise ValueError("Canonical DPO transfer trainer received a non-DPO cell")\n'
              '    configured_initialization = str(config["dpo"]["initialization_mode"])\n'
              '    if cell.dpo_initialization != configured_initialization:\n'
              '        raise RuntimeError("DPO cell/config initialization identity mismatch")\n'
              '    if cell.task == "countdown":\n',
              "DPO cell/config initialization match",
          )

          runner = once(
              runner,
              '    model_cfg = base_config["model"]\n'
              '    train_cfg = base_config["offline_training"]\n'
              '    eval_cfg = base_config["evaluation"]\n',
              '    model_cfg = copy.deepcopy(base_config["model"])\n'
              '    model_cfg["max_length"] = int(effective["model"]["max_length"])\n'
              '    model_cfg["max_new_tokens"] = int(effective["model"]["max_new_tokens"])\n'
              '    train_cfg = base_config["offline_training"]\n'
              '    eval_cfg = copy.deepcopy(base_config["evaluation"])\n'
              '    eval_cfg["examples"] = int(effective["evaluation"]["examples"])\n'
              '    eval_cfg["batch_size"] = int(effective["evaluation"]["batch_size"])\n'
              '    eval_cfg["pass_ks"] = list(effective["evaluation"]["pass_ks"])\n'
              '    eval_cfg["seed"] = int(effective["evaluation"]["generation_seed"])\n',
              "DPO effective evaluation runtime",
          )

          old_load = '''        model = arena.load_model(
            str(Path(base_model_path).resolve()),
            adapter_path=None if shared_adapter is None else str(shared_adapter),
            trainable_adapter=True,
            load_in_4bit=bool(model_cfg.get("load_in_4bit", False)),
            dtype=str(effective["model"]["dtype"]),
            gradient_checkpointing=bool(effective["model"]["gradient_checkpointing"]),
            parameterization="lora",
        )
'''
          new_load = '''        with _legacy_arena_runtime_bridge(arena, effective):
            model = arena.load_model(
                str(Path(base_model_path).resolve()),
                adapter_path=None if shared_adapter is None else str(shared_adapter),
                trainable_adapter=True,
                load_in_4bit=bool(model_cfg.get("load_in_4bit", False)),
                dtype=str(effective["model"]["dtype"]),
                gradient_checkpointing=bool(effective["model"]["gradient_checkpointing"]),
                parameterization="lora",
            )
'''
          runner = once(runner, old_load, new_load, "DPO LoRA runtime bridge")

          runner = once(
              runner,
              '        scheduler = arena.get_cosine_schedule_with_warmup(\n'
              '            optimizer,\n'
              '            max(1, int(updates * float(effective["training"]["warmup_ratio"]))),\n'
              '            updates,\n'
              '        )\n',
              '        warmup_ratio = float(effective["training"]["warmup_ratio"])\n'
              '        warmup_steps = 0 if warmup_ratio == 0.0 else max(1, int(updates * warmup_ratio))\n'
              '        scheduler = arena.get_cosine_schedule_with_warmup(\n'
              '            optimizer,\n'
              '            warmup_steps,\n'
              '            updates,\n'
              '        )\n',
              "DPO zero-warmup semantics",
          )

          runner = once(
              runner,
              '            "best_adapter": (\n'
              '                str(best_dir.resolve()) if best_dir.is_dir() else str(terminal_dir.resolve())\n'
              '            ),\n',
              '            "best_adapter": (\n'
              '                str(best_dir.resolve()) if best_dir.is_dir() else str(final_adapter_dir.resolve())\n'
              '            ),\n',
              "DPO failed-cell best adapter fallback",
          )
          runner = once(
              runner,
              '            "finite_old_core_updates": True,\n',
              '            "finite_old_core_updates": numerical_failure is None,\n',
              "DPO finite update provenance",
          )
          runner = once(
              runner,
              '    result["identity_hash"] = stable_hash(result)\n'
              '    atomic_json(output_root / "liveness" / cell.key / "cell_manifest.json", result)\n'
              '    return result\n'
              'def _train_canonical_cold_cell(\n',
              '    atomic_json(output_root / "liveness" / cell.key / "cell_manifest.json", result)\n'
              '    return result\n'
              'def _train_canonical_cold_cell(\n',
              "DPO liveness reusable identity",
          )

          tests += r'''


def test_dpo_transfer_consumes_effective_task_runtime_and_preserves_liveness_identity() -> None:
    import inspect

    from drpo import e8_multitask_exp_tuning as exp_tuning

    source = inspect.getsource(exp_tuning._train_canonical_dpo_transfer_cell)
    assert 'model_cfg["max_length"] = int(effective["model"]["max_length"])' in source
    assert 'model_cfg["max_new_tokens"] = int(effective["model"]["max_new_tokens"])' in source
    assert 'eval_cfg["batch_size"] = int(effective["evaluation"]["batch_size"])' in source
    assert 'eval_cfg["pass_ks"] = list(effective["evaluation"]["pass_ks"])' in source
    assert 'with _legacy_arena_runtime_bridge(arena, effective):' in source
    assert 'warmup_steps = 0 if warmup_ratio == 0.0' in source
    assert 'cell.dpo_initialization != configured_initialization' in source
    assert 'str(final_adapter_dir.resolve())' in source
    assert '"finite_old_core_updates": numerical_failure is None' in source

    liveness = inspect.getsource(exp_tuning._cmd_dpo_liveness)
    assert 'result["identity_hash"] = stable_hash(result)' not in liveness


def test_transfer_evaluator_honors_configured_sampling_values() -> None:
    from types import SimpleNamespace
    from drpo import e8_multitask_exp_tuning as exp_tuning

    calls = []

    class FakeModel:
        training = False

    class FakeAdapter:
        def verify(self, instance, completion):
            del instance, completion
            return SimpleNamespace(correct=False, format_valid=True)

    class FakeArena:
        @staticmethod
        def seed_all(seed):
            del seed

        @staticmethod
        def generate_outputs(model, tokenizer, prompts, max_new_tokens, do_sample,
                             temperature, top_p, num_return_sequences):
            del model, tokenizer, max_new_tokens
            calls.append((do_sample, temperature, top_p, num_return_sequences))
            return [["x"] * num_return_sequences for _ in prompts]

    evaluator = exp_tuning._canonical_environment_evaluator(
        arena=FakeArena(),
        task_adapter=FakeAdapter(),
        instances={"p": object()},
        greedy_prompt_rows=1,
        passk_prompt_rows=1,
        sampling_temperature=0.61,
        top_p=0.87,
    )
    evaluator(
        FakeModel(), object(), [{"prompt_id": "p", "prompt": "q"}],
        1, 4, 8, 123,
    )
    assert calls[0] == (False, 1.0, 1.0, 1)
    assert calls[1] == (True, 0.61, 0.87, 8)
'''

          runner_path.write_text(runner, encoding="utf-8")
          tests_path.write_text(tests, encoding="utf-8")
          PY
      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -q numpy pyyaml pytest ruff
          python -m pip install --disable-pip-version-check -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile
        run: python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
      - name: Focused regression with CPU Torch
        run: PYTHONPATH=.:src pytest -q -rs tests/test_e8_multitask_p0.py
      - name: Diff check
        run: git diff --check
      - name: Ruff excluding known main-branch BLE001/B023 debt
        run: ruff check src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py --ignore BLE001,B023
      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git commit -m 'fix: align DPO transfer runtime and liveness identity'
          git push origin HEAD:dev/e8-multitask-baselines-capability-01
