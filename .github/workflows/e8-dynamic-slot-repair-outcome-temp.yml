name: E8 dynamic-slot audit outcome recorder

on:
  push:
    branches:
      - dev/e8-dynamic-slot-repair-work-20260820

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, 'persist dynamic-slot audit outcome') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-dynamic-slot-repair-work-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate, test, scope-audit, and persist outcome
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set +e
          LOG=/tmp/e8_dynamic_slot_audit.log
          : > "$LOG"
          {
            echo "BASE=4b7c991cd8797412830cb34f76dfe35cc09eb90f"
            echo "START_HEAD=$(git rev-parse HEAD)"
            python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/e8-dynamic-slot-repair-run-temp.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index("          PY\n", start)
          body_lines = workflow[start:end].splitlines()
          script = "\n".join(
              line[10:] if line.startswith("          ") else line for line in body_lines
          ) + "\n"
          bad_dynamic = '''dynamic = "\\n".join(
              line[10:] if line.startswith("          ") else line
              for line in dynamic.splitlines()
          )
'''
          bad_audit = '''audit = "\\n".join(
              line[10:] if line.startswith("          ") else line
              for line in audit.splitlines()
          )
'''
          bad_scheduler = '''scheduler_test = "\\n".join(
              line[10:] if line.startswith("          ") else line
              for line in scheduler_test.splitlines()
          ).rstrip() + "\\n"
'''
          for label, old, new in (
              ('dynamic', bad_dynamic, ''),
              ('audit', bad_audit, ''),
              ('scheduler-test', bad_scheduler, 'scheduler_test = scheduler_test.rstrip() + "\\n"\n'),
          ):
              count = script.count(old)
              print(f'PATCHER_BLOCK_{label}={count}')
              if count != 1:
                  raise RuntimeError(f'{label}: expected one stale dedent block, found {count}')
              script = script.replace(old, new, 1)
          exec(compile(script, '<corrected-dynamic-slot-patcher>', 'exec'), {})
          print('GENERATION=PASS')
          PY
            GEN=$?
            if [ "$GEN" -ne 0 ]; then
              echo "GENERATION=FAIL($GEN)"
              exit "$GEN"
            fi
            python -m pip install -q pytest==8.3.5 PyYAML==6.0.2 numpy==1.26.4
            python -m compileall -q src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
            echo "COMPILE=PASS"
            python -m pytest -q \
              tests/test_e8_multitask_p0.py::test_exp_coldstart_matrix_is_208_cells_in_13_nominal_batches \
              tests/test_e8_multitask_p0.py::test_exp_coldstart_rejects_adapter_runtime_or_grid_drift \
              tests/test_e8_multitask_p0.py::test_exp_coldstart_scheduler_refills_freed_slots_and_caps_two_per_gpu \
              tests/test_e8_multitask_p0.py::test_coldstart_engineering_self_test_exercises_208_cell_recovery_and_dynamic_refill \
              tests/test_e8_multitask_p0.py::test_coldstart_task_results_publish_before_global_aggregate
            echo "TARGETED_TESTS=PASS"
            python -m pytest -q tests/test_e8_multitask_p0.py
            echo "FULL_MULTITASK_TEST_FILE=PASS"
            python - <<'PY'
          import subprocess
          import yaml
          BASE='4b7c991cd8797412830cb34f76dfe35cc09eb90f'
          allowed={
            'src/drpo/e8_multitask_exp_tuning.py',
            'configs/e8_multitask_exp_coldstart.yaml',
            'tests/test_e8_multitask_p0.py',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',BASE],text=True).splitlines())
          code_changed={p for p in changed if not p.startswith('.github/workflows/e8-dynamic-slot-repair-') and not p.startswith('tmp/e8_dynamic_slot_audit_outcome')}
          print('TARGET_CHANGED_FILES=' + ','.join(sorted(code_changed)))
          assert code_changed == allowed
          base=yaml.safe_load(subprocess.check_output(['git','show',f'{BASE}:configs/e8_multitask_exp_coldstart.yaml'],text=True))
          current=yaml.safe_load(open('configs/e8_multitask_exp_coldstart.yaml',encoding='utf-8'))
          assert base['execution']['wave_barriers'] is True
          assert current['execution']['wave_barriers'] is False
          base['execution']['wave_barriers']=False
          assert current == base
          print('CONFIG_ONLY_WAVE_BARRIERS_CHANGED=PASS')
          source=open('src/drpo/e8_multitask_exp_tuning.py',encoding='utf-8').read()
          s=source.index('def cmd_run_dynamic('); e=source.index('\ndef cmd_run_all(',s); dynamic=source[s:e]
          assert 'pending: queue.Queue[Cell] = queue.Queue()' in dynamic
          assert 'executor.submit(worker, slot, gpu_ids[slot % len(gpu_ids)])' in dynamic
          assert '"wave_barriers": False' in dynamic
          assert '"scheduling_barrier": False' in dynamic
          assert '"countdown_result_controls_transfer_release": False' in dynamic
          assert 'for wave_index, wave in enumerate(waves, start=1):' not in dynamic
          print('DYNAMIC_SLOT_INVARIANTS=PASS')
          PY
            git diff --check 4b7c991cd8797412830cb34f76dfe35cc09eb90f
            echo "DIFF_CHECK=PASS"
          } >> "$LOG" 2>&1
          RC=$?
          echo "AUDIT_EXIT=$RC" >> "$LOG"
          mkdir -p tmp
          cp "$LOG" tmp/e8_dynamic_slot_audit_outcome.txt
          git config user.name 'drpo-validation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tmp/e8_dynamic_slot_audit_outcome.txt
          if [ "$RC" -eq 0 ]; then
            git add src/drpo/e8_multitask_exp_tuning.py configs/e8_multitask_exp_coldstart.yaml tests/test_e8_multitask_p0.py
          fi
          git commit -m 'chore: persist dynamic-slot audit outcome' || true
          git push origin HEAD:dev/e8-dynamic-slot-repair-work-20260820
          exit 0
