name: Temporary origin-main retirement validation

on:
  push:
    branches:
      - dev/e8-multitask-lambda-completion-clean-05

permissions:
  contents: read

jobs:
  validate-proposed-retirement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-lambda-completion-clean-05
          fetch-depth: 0

      - name: Verify validation anchor
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "2f943d23e15655d3f7c6925a893b88bc264c4db9"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/tmp-origin-main-retirement-validate.yml"

      - name: Install validation dependencies
        run: python -m pip install -q "PyYAML==6.0.2" pytest ruff

      - name: Materialize proposed cleanup in validation checkout
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          from pathlib import Path

          ROOT = Path.cwd()
          AUTH_ID = "GOV-EXPERIMENT-ORIGIN-MAIN-GATE-RETIREMENT-2026-08-26"

          package_wrapper = '''#!/usr/bin/env python3
          """Build and atomically verify a hardened DRPO artifact."""
          from __future__ import annotations

          import sys

          try:
              from artifact_protocol_hardened import package_main
          except ModuleNotFoundError as exc:
              print(
                  "ERROR: scripts/artifact_protocol_hardened.py is required; "
                  "refusing to fall back to the legacy packaging protocol.",
                  file=sys.stderr,
              )
              raise SystemExit(2) from exc


          def _retire_origin_main_gate(argv: list[str]) -> list[str]:
              """Accept the historical flag as a compatibility no-op."""
              return [arg for arg in argv if arg != "--require-origin-main-match"]


          if __name__ == "__main__":
              raise SystemExit(package_main(_retire_origin_main_gate(sys.argv[1:])))
          '''
          package_wrapper = "\n".join(line[10:] if line.startswith("          ") else line for line in package_wrapper.splitlines()) + "\n"
          (ROOT / "scripts/package_experiment_hardened.py").write_text(package_wrapper, encoding="utf-8")

          guard_wrapper = '''#!/usr/bin/env python3
          """Run a DRPO experiment under the hardened foreground supervisor."""
          from __future__ import annotations

          import sys

          try:
              from artifact_protocol_hardened import guard_main
          except ModuleNotFoundError as exc:
              print(
                  "ERROR: scripts/artifact_protocol_hardened.py is required; "
                  "refusing to run without the hardened supervision protocol.",
                  file=sys.stderr,
              )
              raise SystemExit(2) from exc


          def _normalized_guard_argv(argv: list[str]) -> list[str]:
              """Retire origin/main gating while preserving exact-commit formal launch."""
              args = list(argv)
              try:
                  boundary = args.index("--")
              except ValueError:
                  boundary = len(args)
              public = args[:boundary]
              child = args[boundary:]
              public = [arg for arg in public if arg != "--require-origin-main-match"]

              run_class = "formal"
              for index, arg in enumerate(public):
                  if arg == "--run-class" and index + 1 < len(public):
                      run_class = public[index + 1]
                  elif arg.startswith("--run-class="):
                      run_class = arg.split("=", 1)[1]
              has_expected = any(
                  arg == "--expected-commit" or arg.startswith("--expected-commit=")
                  for arg in public
              )
              if run_class == "formal" and not has_expected:
                  print(
                      "ERROR: formal experiment launch requires an explicit full --expected-commit; "
                      "origin/main equality is retired as launch authority",
                      file=sys.stderr,
                  )
                  raise SystemExit(2)
              return public + child


          if __name__ == "__main__":
              raise SystemExit(guard_main(_normalized_guard_argv(sys.argv[1:])))
          '''
          guard_wrapper = "\n".join(line[10:] if line.startswith("          ") else line for line in guard_wrapper.splitlines()) + "\n"
          (ROOT / "scripts/run_experiment_guard_hardened.py").write_text(guard_wrapper, encoding="utf-8")

          launcher_path = ROOT / "scripts/run_e8_multitask_exp_coldstart.sh"
          launcher = launcher_path.read_text(encoding="utf-8")
          if launcher.count("--require-origin-main-match") != 2:
              raise SystemExit(f"unexpected E8 origin-main flag count: {launcher.count('--require-origin-main-match')}")
          launcher = "\n".join(
              line for line in launcher.splitlines() if "--require-origin-main-match" not in line
          ) + "\n"
          legacy_export = "  export E8_COLDSTART_RECOVERY_REQUIRE_ORIGIN_MAIN=1\n"
          if launcher.count(legacy_export) != 1:
              raise SystemExit("unexpected E8 recovery origin-main export count")
          launcher = launcher.replace(legacy_export, "", 1)
          launcher_path.write_text(launcher, encoding="utf-8")

          tuning_path = ROOT / "src/drpo/e8_multitask_exp_tuning.py"
          tuning = tuning_path.read_text(encoding="utf-8")
          recovery_anchor = '''    if os.environ.get("E8_COLDSTART_RECOVERY_REQUIRE_ORIGIN_MAIN") == "1":
              command.append("--require-origin-main-match")
          '''
          recovery_anchor = "\n".join(line[4:] if line.startswith("    ") else line for line in recovery_anchor.splitlines()) + "\n"
          # Restore the intended four-space indentation after dedenting the literal wrapper.
          recovery_anchor = '    if os.environ.get("E8_COLDSTART_RECOVERY_REQUIRE_ORIGIN_MAIN") == "1":\n        command.append("--require-origin-main-match")\n'
          if tuning.count(recovery_anchor) != 1:
              raise SystemExit(f"unexpected E8 recovery propagation anchor count: {tuning.count(recovery_anchor)}")
          tuning = tuning.replace(recovery_anchor, "", 1)
          tuning_path.write_text(tuning, encoding="utf-8")

          protocol_path = ROOT / "docs/formal_experiment_artifact_protocol.md"
          protocol = protocol_path.read_text(encoding="utf-8")
          old_block = '''A web commits page, search result, or cached repository view is not authoritative for the current `main` SHA. Resolve commit identity in this order:

          1. `git ls-remote --exit-code origin refs/heads/main`;
          2. `git rev-parse HEAD` in the checked-out repository;
          3. an explicitly supplied full expected SHA.

          The local HEAD and expected SHA must match. If an authoritative remote query succeeds, it must also match. If remote resolution is unavailable, record the failure and do not claim that remote `main` was independently verified.
          '''
          old_block = "\n".join(line[10:] if line.startswith("          ") else line for line in old_block.splitlines()) + "\n"
          new_block = '''Formal experiment launch identity is the frozen full Git commit SHA. Resolve and bind it in this order:

          1. an explicitly supplied full `--expected-commit`;
          2. `git rev-parse HEAD` in the checked-out repository, which must equal that expected SHA;
          3. the experiment-specific canonical repository-identity check where applicable.

          `origin/main` may still be resolved for development-base freshness, merge/rebase review, code-delivery freshness, or descriptive provenance, but equality with `origin/main` is not an experiment launch, recovery, or packaging permission. A clean checkout at the exact frozen expected commit remains valid when `origin/main` points elsewhere.
          '''
          new_block = "\n".join(line[10:] if line.startswith("          ") else line for line in new_block.splitlines()) + "\n"
          if protocol.count(old_block) != 1:
              raise SystemExit(f"formal protocol identity block count={protocol.count(old_block)}")
          protocol = protocol.replace(old_block, new_block, 1)
          command_anchor = '''  --artifact-output artifacts/C-U1-E3_RAW_COMPLETE.zip \\
            -- python3 src/drpo/drpo_cu1_e1_e4_oneclick.py
          '''
          command_anchor = "\n".join(line[10:] if line.startswith("          ") else line for line in command_anchor.splitlines()) + "\n"
          command_replacement = '''  --artifact-output artifacts/C-U1-E3_RAW_COMPLETE.zip \\
            --run-class formal \\
            --expected-commit <FROZEN_FULL_SHA> \\
            -- python3 src/drpo/drpo_cu1_e1_e4_oneclick.py
          '''
          command_replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in command_replacement.splitlines()) + "\n"
          if protocol.count(command_anchor) != 1:
              raise SystemExit(f"formal protocol command anchor count={protocol.count(command_anchor)}")
          protocol = protocol.replace(command_anchor, command_replacement, 1)
          protocol_path.write_text(protocol, encoding="utf-8")

          agents_path = ROOT / "AGENTS.md"
          agents = agents_path.read_text(encoding="utf-8")
          override_heading = "## Origin/main experiment-launch gate retirement"
          if override_heading in agents:
              raise SystemExit("origin-main override already exists")
          agents += '''

          ## Origin/main experiment-launch gate retirement

          Under `GOV-EXPERIMENT-ORIGIN-MAIN-GATE-RETIREMENT-01`, equality with `origin/main` is permanently retired as an experiment launch, recovery, checkpoint-package, or experiment-package permission.

          For a formal experiment, the active/new launcher must bind one frozen full expected commit; local `HEAD` must equal that commit, the formal checkout must be clean, and normal source/config/end-provenance checks remain fail-closed. A different `origin/main` SHA must not veto that launch. Historical `--require-origin-main-match` arguments are compatibility input only and must not restore the retired gate.

          This section is the explicit newer override for experiment launch over legacy wording in `Formal commit and artifact hardening` that offered a live `origin/main` match as an alternative formal anchor or said a later `main` movement must stop an already frozen experiment. Remote-main resolution remains mandatory where separately required for development-base freshness, rebase/merge review, or code/update-package delivery; those checks must not be reused as experiment-launch authorization.

          Repository merge still requires explicit user approval, but merging an experiment implementation into `main` is not itself a prerequisite for launching an already frozen exact commit.
          '''
          agents = "\n".join(line[10:] if line.startswith("          ") else line for line in agents.splitlines()) + "\n"
          agents_path.write_text(agents, encoding="utf-8")

          scope_path = ROOT / "docs/scopes/GOV-EXPERIMENT-ORIGIN-MAIN-GATE-RETIREMENT-01.md"
          scope = scope_path.read_text(encoding="utf-8")
          scope = scope.replace(
              "1. the caller supplies one full `--expected-commit`;",
              "1. active/new formal launchers supply one full `--expected-commit`;",
          )
          scope_path.write_text(scope, encoding="utf-8")

          test_path = ROOT / "tests/test_experiment_artifact_hardening.py"
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_origin_main_gate_retirement_guard_allows_frozen_nonmain_commit"
          if marker in tests:
              raise SystemExit("origin-main regression tests already exist")
          tests += r'''


def _detach_frozen_head_while_origin_main_advances(repo: Path) -> tuple[str, str]:
    frozen = head(repo)
    (repo / "README.md").write_text("remote main advanced\n")
    assert run(["git", "add", "README.md"], repo).returncode == 0
    commit = run(["git", "commit", "-m", "advance remote main"], repo)
    assert commit.returncode == 0, commit.stderr
    remote_main = head(repo)
    assert remote_main != frozen
    checkout = run(["git", "checkout", "--detach", frozen], repo)
    assert checkout.returncode == 0, checkout.stderr
    assert head(repo) == frozen
    assert not run(["git", "status", "--porcelain"], repo).stdout.strip()
    return frozen, remote_main


def test_origin_main_gate_retirement_guard_allows_frozen_nonmain_commit(tmp_path: Path) -> None:
    repo = make_repo(tmp_path)
    frozen, remote_main = _detach_frozen_head_while_origin_main_advances(repo)
    resolved = hardened.resolve_origin_main(repo)
    assert resolved["authoritative"] is True
    assert resolved["sha"] == remote_main

    output_root = tmp_path / "guard"
    artifact = tmp_path / "guard-failed.zip"
    result = run(
        [
            sys.executable,
            "scripts/run_experiment_guard_hardened.py",
            "--experiment-id",
            "TEST-ORIGIN-RETIRE-GUARD",
            "--repo-root",
            str(repo),
            "--output-root",
            str(output_root),
            "--artifact-output",
            str(artifact),
            "--run-class",
            "formal",
            "--expected-commit",
            frozen,
            "--require-origin-main-match",
            "--heartbeat-seconds",
            "0.05",
            "--stale-seconds",
            "5",
            "--",
            sys.executable,
            "-c",
            "raise SystemExit(7)",
        ],
        repo,
        timeout=30,
    )
    assert result.returncode == 7, result.stderr
    assert artifact.is_file()


def test_origin_main_gate_retirement_package_allows_frozen_nonmain_commit(tmp_path: Path) -> None:
    repo = make_repo(tmp_path)
    frozen, remote_main = _detach_frozen_head_while_origin_main_advances(repo)
    assert frozen != remote_main
    result_dir = failed_result(tmp_path / "failed", base_commit=frozen)
    output = tmp_path / "failed.zip"
    result = package_failed(repo, result_dir, output, "--require-origin-main-match")
    assert result.returncode == 0, result.stderr
    assert output.is_file()


def test_origin_main_gate_retirement_formal_guard_still_requires_expected_commit(tmp_path: Path) -> None:
    repo = make_repo(tmp_path)
    result = run(
        [
            sys.executable,
            "scripts/run_experiment_guard_hardened.py",
            "--experiment-id",
            "TEST-ORIGIN-RETIRE-PIN",
            "--repo-root",
            str(repo),
            "--output-root",
            str(tmp_path / "guard"),
            "--artifact-output",
            str(tmp_path / "guard.zip"),
            "--run-class",
            "formal",
            "--",
            sys.executable,
            "-c",
            "raise SystemExit(0)",
        ],
        repo,
    )
    assert result.returncode == 2
    assert "explicit full --expected-commit" in result.stderr
          '''
          tests = "\n".join(line[10:] if line.startswith("          ") else line for line in tests.splitlines()) + "\n"
          test_path.write_text(tests, encoding="utf-8")

          def file_sha(path: str) -> str:
              return hashlib.sha256((ROOT / path).read_bytes()).hexdigest()

          protected_paths = [
              "scripts/run_experiment_guard_hardened.py",
              "scripts/package_experiment_hardened.py",
              "docs/formal_experiment_artifact_protocol.md",
          ]
          hashes = {path: file_sha(path) for path in protected_paths}

          auth_path = ROOT / "docs/governance_stage_authorizations/GOV-EXPERIMENT-ORIGIN-MAIN-GATE-RETIREMENT-2026-08-26.yaml"
          auth = auth_path.read_text(encoding="utf-8")
          if "authorized_file_hashes:" in auth:
              raise SystemExit("authorization already has file hashes")
          auth_anchor = "rollback_plan:\n"
          if auth.count(auth_anchor) != 1:
              raise SystemExit("authorization rollback anchor drifted")
          hash_block = "authorized_file_hashes:\n" + "".join(
              f"  {path}: {digest}\n" for path, digest in hashes.items()
          )
          auth = auth.replace(auth_anchor, hash_block + auth_anchor, 1)
          auth_path.write_text(auth, encoding="utf-8")

          ledger_path = ROOT / "docs/governance_pipeline_stage_status.yaml"
          ledger = ledger_path.read_text(encoding="utf-8")
          for path, digest in hashes.items():
              marker = f"    - path: {path}\n"
              start = ledger.find(marker)
              if start < 0:
                  raise SystemExit(f"protected path missing from ledger: {path}")
              next_path = ledger.find("    - path: ", start + len(marker))
              next_stage = ledger.find("  stage_3:", start + len(marker))
              candidates = [value for value in (next_path, next_stage) if value >= 0]
              end = min(candidates) if candidates else len(ledger)
              block = ledger[start:end]
              block, hash_count = re.subn(
                  r"(      sha256: )[0-9a-f]{64}",
                  rf"\g<1>{digest}",
                  block,
                  count=1,
              )
              block, auth_count = re.subn(
                  r"(      authorized_by: )[A-Za-z0-9_-]+",
                  rf"\g<1>{AUTH_ID}",
                  block,
                  count=1,
              )
              if hash_count != 1 or auth_count != 1:
                  raise SystemExit(f"could not update protected ledger block: {path}")
              ledger = ledger[:start] + block + ledger[end:]
          ledger_path.write_text(ledger, encoding="utf-8")
          PY

      - name: Static and governance validation
        shell: bash
        run: |
          git diff --check
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh
          python -m py_compile \
            scripts/run_experiment_guard_hardened.py \
            scripts/package_experiment_hardened.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_experiment_artifact_hardening.py
          ruff check --select E9,F63,F7,F82 \
            scripts/run_experiment_guard_hardened.py \
            scripts/package_experiment_hardened.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_experiment_artifact_hardening.py
          python scripts/validate_governance_rule_inventory.py --repo-root .
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .
          python scripts/handoff_authority.py verify --repo-root .

      - name: Hardened artifact regression suite
        run: python -m pytest -q tests/test_experiment_artifact_hardening.py

      - name: E8 regression suite
        run: python -m pytest -q tests/test_e8_multitask_p0.py

      - name: Exact cleanup assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          launcher = Path("scripts/run_e8_multitask_exp_coldstart.sh").read_text()
          tuning = Path("src/drpo/e8_multitask_exp_tuning.py").read_text()
          guard = Path("scripts/run_experiment_guard_hardened.py").read_text()
          package = Path("scripts/package_experiment_hardened.py").read_text()
          assert "--require-origin-main-match" not in launcher
          assert "E8_COLDSTART_RECOVERY_REQUIRE_ORIGIN_MAIN" not in launcher
          assert "E8_COLDSTART_RECOVERY_REQUIRE_ORIGIN_MAIN" not in tuning
          assert "--require-origin-main-match" not in tuning
          assert "compatibility no-op" in package
          assert "origin/main equality is retired as launch authority" in guard
          PY
          git diff --stat HEAD
