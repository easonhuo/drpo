name: Temporary E8 origin-main unblock

on:
  push:
    branches:
      - dev/e8-multitask-lambda-completion-clean-05

permissions:
  contents: write

jobs:
  unblock-e8:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-lambda-completion-clean-05
          fetch-depth: 0

      - name: Remove only active E8 origin-main launch gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          launcher_path = Path("scripts/run_e8_multitask_exp_coldstart.sh")
          launcher = launcher_path.read_text(encoding="utf-8")
          assert launcher.count("--require-origin-main-match") == 2
          launcher = "\n".join(
              line for line in launcher.splitlines()
              if "--require-origin-main-match" not in line
          ) + "\n"
          legacy_export = "  export E8_COLDSTART_RECOVERY_REQUIRE_ORIGIN_MAIN=1\n"
          assert launcher.count(legacy_export) == 1
          launcher = launcher.replace(legacy_export, "", 1)
          assert '--expected-commit "${EXPECTED_COMMIT}"' in launcher
          assert '[[ "${current_commit}" == "${EXPECTED_COMMIT}" ]]' in launcher
          assert 'status --porcelain=v1 --untracked-files=all' in launcher
          launcher_path.write_text(launcher, encoding="utf-8")

          tuning_path = Path("src/drpo/e8_multitask_exp_tuning.py")
          tuning = tuning_path.read_text(encoding="utf-8")
          block = (
              '    if os.environ.get("E8_COLDSTART_RECOVERY_REQUIRE_ORIGIN_MAIN") == "1":\n'
              '        command.append("--require-origin-main-match")\n'
          )
          assert tuning.count(block) == 1
          tuning = tuning.replace(block, "", 1)
          tuning_path.write_text(tuning, encoding="utf-8")

          Path(".github/workflows/tmp-origin-main-retirement-validate.yml").unlink()
          PY

      - name: Validate minimal unblock
        shell: bash
        run: |
          git diff --check
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh
          python -m py_compile src/drpo/e8_multitask_exp_tuning.py
          ! grep -F -- '--require-origin-main-match' scripts/run_e8_multitask_exp_coldstart.sh
          ! grep -F -- 'E8_COLDSTART_RECOVERY_REQUIRE_ORIGIN_MAIN' src/drpo/e8_multitask_exp_tuning.py
          grep -F -- '--expected-commit "${EXPECTED_COMMIT}"' scripts/run_e8_multitask_exp_coldstart.sh
          grep -F -- '[[ "${current_commit}" == "${EXPECTED_COMMIT}" ]]' scripts/run_e8_multitask_exp_coldstart.sh

      - name: Commit minimal unblock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "E8: disable origin-main launch gate"
          git push origin HEAD:dev/e8-multitask-lambda-completion-clean-05
