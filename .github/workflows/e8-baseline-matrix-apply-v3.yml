name: E8 baseline matrix capability apply v3

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-baseline-matrix-apply-v3.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recover reviewed patch from successful materialization workflow
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import base64
          import gzip
          from pathlib import Path

          source = Path('.github/workflows/e8-baseline-matrix-apply.yml').read_text()
          marker = "payload = '''"
          start = source.index(marker) + len(marker)
          end = source.index("'''", start)
          payload = source[start:end]
          patch = gzip.decompress(base64.b64decode(payload))
          Path('/tmp/update.patch').write_bytes(patch)
          print('PATCH_BYTES', len(patch))
          PY
          test "$(wc -c < /tmp/update.patch)" -eq 61568
          git apply --check /tmp/update.patch
          git apply /tmp/update.patch
          git diff --check

      - name: Install focused validation dependencies
        run: python -m pip install --disable-pip-version-check pytest ruff pyyaml numpy

      - name: Compile
        run: |
          python -m py_compile \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py

      - name: Focused regression
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_e8_multitask_p0.py -k 'baseline_matrix or single_method_coldstart_can_expand_multiple_transfer_seeds or asymre_capability_is_config_driven or topr_capability_is_config_driven or dpo_capability_is_config_driven or fifth_review_rejects_silently_ignored_coldstart_tuning_seed or dpo_train_cell_dispatch_supports_two_update_liveness or historical_coldstart_configs'

      - name: Lint changed Python with historical runner debt excluded
        run: |
          python -m ruff check src/drpo/e8_experiment_config.py tests/test_e8_multitask_p0.py
          python -m ruff check src/drpo/e8_multitask_exp_tuning.py --ignore BLE001,B023

      - name: Commit capability closure
        shell: bash
        run: |
          git add \
            docs/scopes/E8_MULTITASK_BASELINES_CAPABILITY_DEV.md \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat: compose E8 baseline matrix in one config'
          git push origin HEAD:dev/e8-multitask-baselines-capability-01
