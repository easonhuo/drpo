name: tmp-pr352-merge-tree-correctness

on:
  push:
    branches:
      - dev/e8-multitask-reciprocal-shape-128-01

permissions:
  contents: read

jobs:
  merge-tree-correctness:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact GitHub PR merge tree
        uses: actions/checkout@v4
        with:
          ref: 54108acd38f61ef809d2a09edaa289fac32e8e88
          fetch-depth: 0

      - name: Verify tested merge identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "54108acd38f61ef809d2a09edaa289fac32e8e88"
          test "$(git rev-parse HEAD^1)" = "b94fe6bc7002ca052fc056c6f6358251e41237c3"
          test "$(git rev-parse HEAD^2)" = "ed41d12b731873113af6d37a2abbc9d38a96eb75"
          git diff --check HEAD^1..HEAD

      - name: Install focused validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'numpy<2' PyYAML pytest ruff
          python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and lint merged E8 surface
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=.:src
          python3 -m py_compile \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_orchestration.py \
            src/drpo/e8_multitask_results.py \
            src/drpo/e8_multitask_runtime.py
          ruff check \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_orchestration.py \
            src/drpo/e8_multitask_results.py \
            src/drpo/e8_multitask_runtime.py

      - name: Run E8 method and scheduler integration contract
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=.:src
          bash tests/test_e8_method_integration_contract.sh

      - name: Run focused multitask regression suite
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=.:src
          pytest -q tests/test_e8_multitask_p0.py

      - name: Run reciprocal-specific canonical kernel tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=.:src
          pytest -q tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py -k reciprocal

      - name: Run canonical high-c suite excluding known unrelated float-exactness test
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=.:src
          pytest -q tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py \
            --deselect tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells

      - name: Confirm excluded AsymRE float-exactness failure already exists on main parent
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/pr352-main-parent b94fe6bc7002ca052fc056c6f6358251e41237c3
          set +e
          (
            cd /tmp/pr352-main-parent
            export PYTHONPATH=.:src
            pytest -q tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells
          ) > /tmp/pr352-main-parent-test.log 2>&1
          status=$?
          set -e
          cat /tmp/pr352-main-parent-test.log
          test "$status" -ne 0
          grep -q '0.050000000000000044' /tmp/pr352-main-parent-test.log
          git worktree remove --force /tmp/pr352-main-parent

      - name: Verify governance authorities on merge tree
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=.:src
          python3 scripts/handoff_authority.py verify --repo-root .
          python3 scripts/validate_governance_pipeline_stage_status.py --repo-root .
          git diff --check HEAD^1..HEAD
