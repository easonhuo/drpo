name: E8 baseline fifth review repair v2

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-baselines-fifth-review-fix-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard reviewed parent
        run: test "$(git rev-parse HEAD^)" = "8993d05bda37bdcb3e4b412e36ba05207d7942ef"
      - name: Apply fifth-review corrections
        run: |
          echo '' | base64 -d > /tmp/e8_fifth_review_patch.py
          python /tmp/e8_fifth_review_patch.py
      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -q numpy pyyaml pytest ruff
          python -m pip install --disable-pip-version-check -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile
        run: python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
      - name: Focused regression
        run: PYTHONPATH=.:src pytest -q -rs tests/test_e8_multitask_p0.py
      - name: Diff check
        run: git diff --check
      - name: Ruff
        run: ruff check src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py --ignore BLE001,B023
      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git commit -m 'fix: close fifth E8 baseline review gaps'
          git push origin HEAD:dev/e8-multitask-baselines-capability-01
