name: E8 Reuse-Time Identity Recheck Once

on:
  push:
    branches:
      - dev/e8-config-driven-sweep-01

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify reviewed base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2fba00bd72a146a7f97c59f99629ee5943cff0b3"
          unexpected="$(git diff --name-only 2fba00bd72a146a7f97c59f99629ee5943cff0b3 HEAD | grep -v '^.github/workflows/e8-reuse-toctou-recheck-once.yml$' || true)"
          test -z "${unexpected}"
          git diff --quiet origin/main -- .github/workflows/code-change-budget.yml

      - name: Apply reuse-time identity correction
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/run_e8_multitask_exp_coldstart.sh",
              '''  exec 8>"${RECOVERY_ROOT}/runtime.lock"
          flock -n 8 || fail "another engineering self-test still holds the recovery lock"
          if reuse_successful_attempt; then
          ''',
              '''  exec 8>"${RECOVERY_ROOT}/runtime.lock"
          flock -n 8 || fail "another engineering self-test still holds the recovery lock"
          # Re-bind the fast-path decision to the checkout after setup has finished.
          check_source
          if reuse_successful_attempt; then
          ''',
          )

          replace_once(
              "scripts/run_e8_multitask_exp_coldstart.sh",
              '''  if ! flock -n 9; then
            write_local_ai_recovery concurrent_runtime_lock
            fail "another experiment or recovery process still holds ${RECOVERY_ROOT}/runtime.lock"
          fi
          if reuse_successful_attempt; then
          ''',
              '''  if ! flock -n 9; then
            write_local_ai_recovery concurrent_runtime_lock
            fail "another experiment or recovery process still holds ${RECOVERY_ROOT}/runtime.lock"
          fi
          # Setup can be long. Re-check the current checkout and formal main authority
          # under the per-run lock immediately before a completed-attempt fast return.
          check_source
          check_authoritative_main_at_invocation
          if reuse_successful_attempt; then
          ''',
          )

          tests = Path("tests/test_e8_multitask_p0.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "def test_reuse_fast_paths_recheck_source_identity_after_setup_under_run_lock()"
          if marker in test_text:
              raise SystemExit("reuse-time regression test already exists")
          test_text += '''
          
          
          def test_reuse_fast_paths_recheck_source_identity_after_setup_under_run_lock() -> None:
              runner = Path("scripts/run_e8_multitask_exp_coldstart.sh").read_text(encoding="utf-8")
          
              selftest = runner.split("\\nengineering_self_test() {\\n", 1)[1].split(
                  "\\nprepare() {\\n", 1
              )[0]
              selftest_lock = selftest.index("flock -n 8")
              selftest_reuse = selftest.index("reuse_successful_attempt")
              assert selftest_lock < selftest.rfind("check_source", selftest_lock, selftest_reuse)
          
              guarded = runner.split("\\nguarded_full() {\\n", 1)[1].split(
                  '\\ncase "${MODE}" in\\n', 1
              )[0]
              setup_index = guarded.index("ensure_setup")
              formal_reuse = guarded.index("reuse_successful_attempt")
              run_lock = guarded.index("flock -n 9")
              assert run_lock < guarded.rfind("check_source", setup_index, formal_reuse)
              assert run_lock < guarded.rfind(
                  "check_authoritative_main_at_invocation", setup_index, formal_reuse
              )
          '''
          tests.write_text(test_text, encoding="utf-8")

          protocol = Path("docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md")
          protocol_text = protocol.read_text(encoding="utf-8")
          heading = "## 2026-09-03 second pre-independent-review cross-file closure"
          if heading in protocol_text:
              raise SystemExit("second pre-independent-review closure already exists")
          protocol_text += f'''\n\n{heading}\n\nA subsequent cross-file lifecycle audit found one reuse-time TOCTOU class after the prior closure. The fix remains within the already approved source/config identity and formal `origin/main` semantics.\n\n- `full` still checks source and authoritative `origin/main` before setup. After setup completes and the per-run recovery lock is acquired, it checks both again immediately before `reuse_successful_attempt()`. This prevents a long setup from making the earlier fast-path identity check stale.\n- Engineering self-test similarly rechecks the current source after self-test setup and after acquiring its per-run recovery lock, immediately before completed-attempt reuse.\n- Fresh formal guard attempts retain their existing launch-time hardened-guard checks. This correction does not require `origin/main` to remain frozen after a formal guard has launched and does not add model/runtime/backend/run-class identity gates.\n\nNo tracked scientific config, data volume, seed, lambda, optimizer/training formula, canonical paper loss/trainer, metric, result status, or method ranking is changed. No scientific experiment is launched.\n'''
          protocol.write_text(protocol_text, encoding="utf-8")
          PY

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pip install --disable-pip-version-check ruff==0.9.10 pytest==8.3.4 numpy==1.26.4 PyYAML==6.0.2

      - name: Validate final after-image
        run: |
          set -euo pipefail
          python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py scripts/preflight_e8_multitask_config.py tests/test_e8_multitask_p0.py
          python -m ruff check src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py scripts/preflight_e8_multitask_config.py tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh
          python scripts/preflight_e8_multitask_config.py --config configs/e8_multitask_exp_coldstart.yaml >/tmp/preflight-coldstart.json
          python scripts/preflight_e8_multitask_config.py --config configs/e8_multitask_exp_lambda_completion.yaml >/tmp/preflight-completion.json
          python scripts/preflight_e8_multitask_config.py --config configs/e8_multitask_exp_lambda_curve_completion.yaml >/tmp/preflight-curve.json
          python -m pytest -q tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_experiment_artifact_protocol.py tests/test_experiment_artifact_hardening.py
          git diff --quiet 2fba00bd72a146a7f97c59f99629ee5943cff0b3 -- tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py
          git diff --quiet 2fba00bd72a146a7f97c59f99629ee5943cff0b3 -- docs/experiments/E8_COMPLETED_BACKLOG_CLOSURE.md
          git diff --quiet 2fba00bd72a146a7f97c59f99629ee5943cff0b3 -- docs/experiments/E8_RECIPROCAL_JOINT_CLOSURE.md
          python -m pytest -q \
            --deselect=tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells \
            --deselect=tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test
          git diff --check
          git diff --quiet origin/main -- .github/workflows/code-change-budget.yml
          git diff --quiet 2fba00bd72a146a7f97c59f99629ee5943cff0b3 -- configs
          git diff --quiet 2fba00bd72a146a7f97c59f99629ee5943cff0b3 -- src/drpo/countdown_qwen_arena_onefile.py src/drpo/countdown_e8_alpha1_c_scan_common.py src/drpo/countdown_e8_alpha1_c_scan_runtime.py src/drpo/countdown_e8_alpha1_c_scan_trainer.py src/drpo/countdown_e8_alpha1_highc_scan_common.py src/drpo/countdown_e8_alpha1_highc_scan_runtime.py

      - name: Commit validated closure and self-delete
        run: |
          set -euo pipefail
          git rm .github/workflows/e8-reuse-toctou-recheck-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md \
            scripts/run_e8_multitask_exp_coldstart.sh \
            tests/test_e8_multitask_p0.py
          git commit -m "fix(e8): recheck identity at reuse time"
          git push origin HEAD:dev/e8-config-driven-sweep-01
