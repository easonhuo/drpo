name: E8 right-tail pristine-main Stage3 auto-check diagnostic

on:
  push:
    branches:
      - automation/e8-wide-righttail-baseline-autocheck-20260907

permissions:
  contents: read

jobs:
  baseline-autocheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pristine main base
        uses: actions/checkout@v4
        with:
          ref: 8a21fd16e63ea96a0cde2a477353d24562624655
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependency
        run: python -m pip install pyyaml
      - name: Identify authoritative delta report history mismatches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee "$RUNNER_TEMP/authoritative-history-diagnostic.log"
          from pathlib import Path
          import json
          import subprocess
          import yaml

          root = Path('.').resolve()
          bad = []
          rows = []
          for delta in sorted((root / 'docs/handoff_deltas').glob('*/HANDOFF_DELTA.yaml')):
              data = yaml.safe_load(delta.read_text(encoding='utf-8'))
              if data.get('schema_version') != 3:
                  continue
              report = delta.parent / 'MATERIALIZATION_REPORT.json'
              def added(path):
                  rel = path.relative_to(root).as_posix()
                  out = subprocess.check_output(
                      ['git','log','--diff-filter=A','--format=%H','--',rel], text=True
                  ).splitlines()
                  return out[-1].strip() if out else None
              dc = added(delta)
              rc = added(report) if report.exists() else None
              row = {'update_id': delta.parent.name, 'delta_add': dc, 'report_add': rc, 'same': dc == rc and dc is not None}
              rows.append(row)
              if not row['same']:
                  bad.append(row)
          print(json.dumps({'authoritative_count': len(rows), 'mismatches': bad}, indent=2, sort_keys=True))
          if not bad:
              print('NO_AUTHORITATIVE_HISTORY_MISMATCHES')
          PY
      - name: Run pristine-main auto-check
        shell: bash
        run: |
          set +e
          python scripts/handoff_delta_shadow.py auto-check --repo-root . 2>&1 | tee "$RUNNER_TEMP/baseline-autocheck.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "baseline_autocheck_exit_code=$rc" | tee -a "$RUNNER_TEMP/baseline-autocheck.log"
          exit "$rc"
      - name: Upload baseline diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e8-wide-righttail-baseline-autocheck-diagnostic-v2
          path: |
            ${{ runner.temp }}/authoritative-history-diagnostic.log
            ${{ runner.temp }}/baseline-autocheck.log
          if-no-files-found: warn
