name: E8 multitask baseline simplification final

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-multitask-baselines-simplify-final.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fix simplification-local lint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/drpo/e8_multitask_exp_tuning.py')
          text = path.read_text(encoding='utf-8')
          old = '''        grouped_curve = []\n        for value, group in sorted(groups.items()):\n            mean = lambda key: float(np.mean([float(row[key]) for row in group]))  # noqa: E731\n            grouped_curve.append(\n                {\n                    \"task\": task,\n                    \"method\": method,\n                    parameter_name: value,\n                    \"seeds\": sorted(int(row[\"seed\"]) for row in group),\n                    \"late_window_pass8_mean\": mean(\"late_window_pass8_mean\"),\n                    \"late_window_greedy_mean\": mean(\"late_window_greedy_mean\"),\n                    \"terminal_pass8_mean\": mean(\"terminal_pass8\"),\n                    \"terminal_greedy_valid_rate_mean\": mean(\"terminal_greedy_valid_rate\"),\n                    \"nan_inf_failure\": any(bool(row[\"nan_inf_failure\"]) for row in group),\n                }\n            )\n'''
          new = '''        grouped_curve = []\n        for value, group in sorted(groups.items()):\n            grouped_curve.append(\n                {\n                    \"task\": task,\n                    \"method\": method,\n                    parameter_name: value,\n                    \"seeds\": sorted(int(row[\"seed\"]) for row in group),\n                    \"late_window_pass8_mean\": float(\n                        np.mean([float(row[\"late_window_pass8_mean\"]) for row in group])\n                    ),\n                    \"late_window_greedy_mean\": float(\n                        np.mean([float(row[\"late_window_greedy_mean\"]) for row in group])\n                    ),\n                    \"terminal_pass8_mean\": float(\n                        np.mean([float(row[\"terminal_pass8\"]) for row in group])\n                    ),\n                    \"terminal_greedy_valid_rate_mean\": float(\n                        np.mean([float(row[\"terminal_greedy_valid_rate\"]) for row in group])\n                    ),\n                    \"nan_inf_failure\": any(bool(row[\"nan_inf_failure\"]) for row in group),\n                }\n            )\n'''
          if text.count(old) != 1:
              raise RuntimeError(f'expected one simplification-local mean block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: python -m pip install -q numpy pyyaml pytest torch ruff
      - name: Validate and classify lint
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check
          ruff check src/drpo/e8_multitask_exp_tuning.py --output-format concise > /tmp/target-ruff.txt 2>&1 || true
          git show 8a21fd16e63ea96a0cde2a477353d24562624655:src/drpo/e8_multitask_exp_tuning.py > /tmp/base_tuning.py
          ruff check /tmp/base_tuning.py --output-format concise > /tmp/base-ruff.txt 2>&1 || true
          echo '--- target ruff ---'
          cat /tmp/target-ruff.txt
          echo '--- base ruff ---'
          cat /tmp/base-ruff.txt
          ! grep -Eq 'RUF100|:73[0-9][0-9]:.*B023' /tmp/target-ruff.txt
          python - <<'PY'
          from pathlib import Path
          target = Path('/tmp/target-ruff.txt').read_text()
          # The remaining whole-file warnings are historical broad-exception/B023 debt.
          allowed = ('BLE001', 'B023')
          for line in target.splitlines():
              if not line.strip() or line.startswith('Found '):
                  continue
              if not any(code in line for code in allowed):
                  raise SystemExit(f'unexpected target Ruff diagnostic: {line}')
          PY
      - name: Audit final scope and stats
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 8a21fd16e63ea96a0cde2a477353d24562624655 -- . ':!.github/workflows/e8-multitask-baselines-simplify-final.yml')"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 5
          for path in \
            docs/scopes/E8_MULTITASK_ASYMRE_CAPABILITY_DEV.md \
            docs/scopes/E8_MULTITASK_BASELINES_CAPABILITY_DEV.md \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py; do
            printf '%s\n' "$changed" | grep -qx "$path"
          done
          git diff --numstat 8a21fd16e63ea96a0cde2a477353d24562624655 -- \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
      - name: Commit final cleanup and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/e8-multitask-baselines-simplify-final.yml
          git add src/drpo/e8_multitask_exp_tuning.py
          git diff --cached --check
          git commit -m 'refactor: finalize E8 baseline simplification'
          git push origin HEAD:dev/e8-multitask-baselines-capability-01
