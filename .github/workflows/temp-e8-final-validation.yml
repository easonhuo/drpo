name: TEMP E8 final validation

on:
  push:
    branches:
      - dev/e8-multitask-p0-01
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temp-e8-final-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-p0-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate revised E8 implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/drpo/e8_multitask_p0.py \
            src/drpo/e8_multitask_tasks.py \
            tests/test_e8_multitask_p0.py
          python -m ruff format --check \
            src/drpo/e8_multitask_p0.py \
            src/drpo/e8_multitask_tasks.py \
            tests/test_e8_multitask_p0.py
          python -m py_compile \
            src/drpo/e8_multitask_p0.py \
            src/drpo/e8_multitask_tasks.py \
            tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_p0.sh
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check
