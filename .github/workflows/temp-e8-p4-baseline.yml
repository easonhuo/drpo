name: TEMP E8 P4 baseline validation

on:
  push:
    branches:
      - dev/e8-multitask-training-splits-01
    paths:
      - .github/workflows/temp-e8-p4-baseline.yml

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev/e8-multitask-training-splits-01
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Record baseline identity
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD^)" = "472516ba4b21d9bbcf3e877be8ad6bb9bf0669d7"
      - name: Preflight import test with canonical invocation
        run: python -m pytest -q tests/test_e8_multitask_p0.py::test_e8_config_preflight_is_tracked_and_non_scientific
      - name: Scheduler refill baseline repeated
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "scheduler baseline iteration $i"
            python -m pytest -q tests/test_e8_multitask_p0.py::test_exp_coldstart_scheduler_refills_without_nominal_batch_barriers
          done
      - name: Focused suite canonical invocation
        run: python -m pytest -q tests/test_e8_multitask_p0.py
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "drpo-p4-baseline-bot"
          git config user.email "drpo-p4-baseline-bot@users.noreply.github.com"
          git reset --hard HEAD
          git rm .github/workflows/temp-e8-p4-baseline.yml
          git commit -m "chore: remove temporary P4 baseline workflow [skip ci]"
          git push origin HEAD:dev/e8-multitask-training-splits-01
