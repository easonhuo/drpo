name: Stage3 Stage5 authoritative history compatibility repair

on:
  push:
    branches:
      - fix/stage3-stage5-authoritative-history-compat-20260907

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: fix/stage3-stage5-authoritative-history-compat-20260907
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: python -m pip install pytest pyyaml ruff

      - name: Apply compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/handoff_delta_shadow.py')
          text = script.read_text(encoding='utf-8')
          start = text.index('def authoritative_report_metadata(')
          end = text.index('\ndef classify_observation(', start)
          replacement = '''def first_parent_repository_commit_for_path(repo_root: Path, path: Path) -> str:
              """Return the first-parent commit that integrated an immutable authoritative path.

              Stage 5 permits a schema-v3 delta or materialization report to be authored and
              revised on a side branch before one GitHub merge integration.  The Stage 3
              observation ledger only needs the resulting repository integration commit; the
              Stage 5 verifier remains the authority for full pre/post-integration history
              validation.
              """

              relative = path.resolve().relative_to(repo_root.resolve()).as_posix()
              result = git(
                  repo_root,
                  "log",
                  "--first-parent",
                  "--diff-merges=first-parent",
                  "--diff-filter=A",
                  "--format=%H",
                  "--",
                  relative,
                  check=False,
              )
              commits = [line.strip() for line in result.stdout.splitlines() if line.strip()]
              if len(commits) != 1:
                  raise HandoffDeltaError(
                      "authoritative path must have exactly one first-parent integration: "
                      + relative
                  )
              return commits[0]


def verify_authoritative_path_unchanged_after_integration(
              repo_root: Path, path: Path, integration_commit: str
          ) -> None:
              """Reject any first-parent mutation after the Stage 5 integration commit."""

              relative = path.resolve().relative_to(repo_root.resolve()).as_posix()
              head = git_text(repo_root, "rev-parse", "HEAD")
              later_touches = git_text(
                  repo_root,
                  "rev-list",
                  "--first-parent",
                  "--reverse",
                  f"{integration_commit}..{head}",
                  "--",
                  relative,
              ).splitlines()
              if later_touches:
                  raise HandoffDeltaError(
                      "authoritative delta/report changed after first-parent integration"
                  )
              if git_show_text(repo_root, integration_commit, relative) != path.read_text(
                  encoding="utf-8"
              ):
                  raise HandoffDeltaError(
                      "authoritative delta/report bytes differ from integration commit"
                  )


def authoritative_report_metadata(repo_root: Path, delta_path: Path) -> dict[str, Any]:
              report_path = delta_path.parent / AUTHORITY_REPORT_FILENAME
              report = load_json(report_path, "materialization report")
              if report.get("report_schema_version") != 1 or report.get("status") != "PASS":
                  raise HandoffDeltaError("materialization report schema/status mismatch")
              if report.get("mode") != "authoritative":
                  raise HandoffDeltaError("materialization report must be authoritative")
              if report.get("update_id") != delta_path.parent.name:
                  raise HandoffDeltaError("materialization report update_id mismatch")
              repository_commit = first_parent_repository_commit_for_path(repo_root, delta_path)
              report_commit = first_parent_repository_commit_for_path(repo_root, report_path)
              if report_commit != repository_commit:
                  raise HandoffDeltaError(
                      "authoritative delta/report must share one first-parent integration commit"
                  )
              verify_authoritative_path_unchanged_after_integration(
                  repo_root, delta_path, repository_commit
              )
              verify_authoritative_path_unchanged_after_integration(
                  repo_root, report_path, repository_commit
              )
              if report.get("delta_sha256") != sha256_file(delta_path):
                  raise HandoffDeltaError("materialization report delta hash mismatch")
              return {
                  "path": report_path.relative_to(repo_root).as_posix(),
                  "sha256": sha256_file(report_path),
                  "repository_commit": repository_commit,
                  "validation_worktree_head": repository_commit,
                  "legacy_head_commit_field": None,
                  "performance_total_ms": None,
              }

'''
          # Normalize indentation from the triple-quoted workflow payload.
          replacement = '\n'.join(line[12:] if line.startswith('            ') else line for line in replacement.splitlines()) + '\n'
          script.write_text(text[:start] + replacement + text[end + 1:], encoding='utf-8')

          test_path = Path('tests/test_handoff_delta_shadow.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_authoritative_metadata_accepts_side_branch_preintegration_history'
          if marker not in tests:
              tests += r'''


def test_authoritative_metadata_accepts_side_branch_preintegration_history(
    tmp_path: Path,
) -> None:
    repo, _base = make_repo(tmp_path)
    main_branch = git(repo, "branch", "--show-current")
    git(repo, "checkout", "-b", "topic")

    update_id = "TEST-AUTHORITATIVE-MERGE-HISTORY-01"
    delta_dir = repo / "docs/handoff_deltas" / update_id
    delta_dir.mkdir(parents=True)
    delta = delta_dir / MODULE.DELTA_FILENAME
    delta.write_text("schema_version: 3\nupdate_id: TEST-AUTHORITATIVE-MERGE-HISTORY-01\n")
    git(repo, "add", delta.relative_to(repo).as_posix())
    git(repo, "commit", "-m", "add authoritative delta on topic")

    report = delta_dir / MODULE.AUTHORITY_REPORT_FILENAME
    report.write_text(
        json.dumps(
            {
                "report_schema_version": 1,
                "status": "PASS",
                "mode": "authoritative",
                "update_id": update_id,
                "delta_sha256": MODULE.sha256_file(delta),
            },
            indent=2,
            sort_keys=True,
        )
        + "\n"
    )
    git(repo, "add", report.relative_to(repo).as_posix())
    git(repo, "commit", "-m", "add materialization report on topic")

    git(repo, "checkout", main_branch)
    git(repo, "merge", "--no-ff", "topic", "-m", "integrate authoritative update")
    integration = git(repo, "rev-parse", "HEAD")

    metadata = MODULE.authoritative_report_metadata(repo, delta)
    assert metadata["repository_commit"] == integration


def test_authoritative_metadata_rejects_postintegration_mutation(tmp_path: Path) -> None:
    repo, _base = make_repo(tmp_path)
    main_branch = git(repo, "branch", "--show-current")
    git(repo, "checkout", "-b", "topic")

    update_id = "TEST-AUTHORITATIVE-MERGE-HISTORY-02"
    delta_dir = repo / "docs/handoff_deltas" / update_id
    delta_dir.mkdir(parents=True)
    delta = delta_dir / MODULE.DELTA_FILENAME
    delta.write_text("schema_version: 3\nupdate_id: TEST-AUTHORITATIVE-MERGE-HISTORY-02\n")
    report = delta_dir / MODULE.AUTHORITY_REPORT_FILENAME
    report.write_text(
        json.dumps(
            {
                "report_schema_version": 1,
                "status": "PASS",
                "mode": "authoritative",
                "update_id": update_id,
                "delta_sha256": MODULE.sha256_file(delta),
            },
            indent=2,
            sort_keys=True,
        )
        + "\n"
    )
    git(repo, "add", delta_dir.relative_to(repo).as_posix())
    git(repo, "commit", "-m", "add authoritative pair on topic")

    git(repo, "checkout", main_branch)
    git(repo, "merge", "--no-ff", "topic", "-m", "integrate authoritative pair")
    report.write_text(report.read_text() + "\n")
    git(repo, "add", report.relative_to(repo).as_posix())
    git(repo, "commit", "-m", "tamper after integration")

    with pytest.raises(MODULE.HandoffDeltaError, match="changed after first-parent integration"):
        MODULE.authoritative_report_metadata(repo, delta)
'''
              test_path.write_text(tests, encoding='utf-8')

          workflow = Path('.github/workflows/stage3-stage5-authoritative-history-compat-20260907.yml')
          workflow.unlink()
          PY

      - name: Focused regression tests
        run: python -m pytest tests/test_handoff_delta_shadow.py -q

      - name: Current repository authority and Stage3 fast gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/handoff_authority.py verify --repo-root . --json
          python scripts/handoff_delta_shadow.py auto-check --repo-root .
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .

      - name: Changed-file lint and diff check
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check scripts/handoff_delta_shadow.py tests/test_handoff_delta_shadow.py
          git diff --check

      - name: Commit tested repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "easonhuo"
          git config user.email "huoyusen1@126.com"
          git add -A
          git commit -m "Fix Stage3 Stage5 authoritative history compatibility"
          git push origin HEAD:fix/stage3-stage5-authoritative-history-compat-20260907
