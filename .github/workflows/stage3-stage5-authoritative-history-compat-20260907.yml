name: Stage3 Stage5 authoritative history compatibility repair

on:
  push:
    branches:
      - fix/stage3-stage5-authoritative-history-compat-20260907

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: fix/stage3-stage5-authoritative-history-compat-20260907
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: python -m pip install pytest pyyaml ruff

      - name: Apply compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          set +e
          patch -p1 --forward < stage3_stage5_compat.patch
          patch_rc=$?
          set -e
          if [ "$patch_rc" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          reject = Path("scripts/handoff_delta_shadow.py.rej")
          if not reject.is_file():
              raise SystemExit("expected only the helper insertion hunk to be rejected")
          added = [
              line[1:]
              for line in reject.read_text(encoding="utf-8").splitlines()
              if line.startswith("+") and not line.startswith("+++")
          ]
          helper = "\n".join(added) + "\n"
          if "def first_parent_repository_commit_for_path(" not in helper:
              raise SystemExit("unexpected rejected hunk")
          script = Path("scripts/handoff_delta_shadow.py")
          text = script.read_text(encoding="utf-8")
          marker = "def authoritative_report_metadata("
          if "def first_parent_repository_commit_for_path(" not in text:
              index = text.index(marker)
              script.write_text(text[:index] + helper + text[index:], encoding="utf-8")
          reject.unlink()
          Path("scripts/handoff_delta_shadow.py.orig").unlink(missing_ok=True)
          PY
          fi
          rm stage3_stage5_compat.patch
          rm .github/workflows/stage3-stage5-authoritative-history-compat-20260907.yml

      - name: Focused regression tests
        run: python -m pytest tests/test_handoff_delta_shadow.py -q

      - name: Current repository authority and Stage3 fast gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/handoff_authority.py verify --repo-root . --json
          python scripts/handoff_delta_shadow.py auto-check --repo-root .
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .

      - name: Changed-file lint and diff check
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check scripts/handoff_delta_shadow.py tests/test_handoff_delta_shadow.py
          git diff --check

      - name: Commit tested repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "easonhuo"
          git config user.email "huoyusen1@126.com"
          git add -A
          git commit -m "Fix Stage3 Stage5 authoritative history compatibility"
          git push origin HEAD:fix/stage3-stage5-authoritative-history-compat-20260907
