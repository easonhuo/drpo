name: tmp-e8-reciprocal-shape-review-fix
on:
  push:
    branches:
      - dev/e8-multitask-reciprocal-shape-128-01
permissions:
  contents: write
jobs:
  review-fix-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/drpo/e8_multitask_exp_tuning.py')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''def _is_baseline_matrix(config: Mapping[str, Any]) -> bool:\n    return _is_coldstart(config) and _coldstart_method(config) == METHOD_BASELINE_MATRIX\n\n\ndef _is_baseline_matrix(config: Mapping[str, Any]) -> bool:\n    return _is_coldstart(config) and _coldstart_method(config) == METHOD_BASELINE_MATRIX\n\n\n''',
              '''def _is_baseline_matrix(config: Mapping[str, Any]) -> bool:\n    return _is_coldstart(config) and _coldstart_method(config) == METHOD_BASELINE_MATRIX\n\n\n''',
              'duplicate baseline helper',
          )
          replace_once(
              '''def _dpo_initialization_identity(config: Mapping[str, Any]) -> Mapping[str, Any]:\n    if _is_method_matrix(config):\n''',
              '''def _dpo_initialization_identity(config: Mapping[str, Any]) -> Mapping[str, Any]:\n    if _is_baseline_matrix(config):\n''',
              'DPO baseline identity',
          )
          marker = '''def calibrate_canonical_cold_task(\n    task: str,\n'''
          helper = '''def _coldstart_remoteness_metadata(config: Mapping[str, Any]) -> dict[str, Any]:\n    method = _coldstart_method(config)\n    if method in {\n        METHOD_RECIPROCAL_LINEAR,\n        METHOD_RECIPROCAL_QUADRATIC,\n        METHOD_RECIPROCAL_MATRIX,\n    }:\n        return {\n            "enabled": False,\n            "mode": "paper_reciprocal_excess_remoteness_tau_0p125",\n            "coordinate": "relu(current_sequence_surprisal/2-0.125)",\n            "tau_code": 0.125,\n            "detached": True,\n            "extra_square": False,\n            "gradient_rms_matching": False,\n        }\n    return {\n        "enabled": False,\n        "mode": "paper_linear_surprisal_no_calibration",\n        "coordinate": "current_sequence_surprisal/2",\n        "detached": True,\n        "extra_square": False,\n        "gradient_rms_matching": False,\n    }\n\n\n'''
          replace_once(marker, helper + marker, 'remoteness metadata helper')
          replace_once(
              '''        "enabled": False,\n        "mode": "paper_linear_surprisal_no_calibration",\n        "coordinate": "current_sequence_surprisal/2",\n        "detached": True,\n        "extra_square": False,\n        "gradient_rms_matching": False,\n        "canonical_train_sha256": record["train_sha256"],\n''',
              '''        **_coldstart_remoteness_metadata(config),\n        "canonical_train_sha256": record["train_sha256"],\n''',
              'canonical calibration evidence',
          )
          replace_once(
              '''        if _is_coldstart(config) and (\n            result.get("enabled") is not False\n            or result.get("mode") != "paper_linear_surprisal_no_calibration"\n        ):\n            raise RuntimeError(f"Paper calibration must remain disabled for {task}")\n''',
              '''        if _is_coldstart(config):\n            expected_remoteness = _coldstart_remoteness_metadata(config)\n            if (\n                result.get("enabled") is not False\n                or result.get("mode") != expected_remoteness["mode"]\n            ):\n                raise RuntimeError(f"Paper calibration identity mismatch for {task}")\n''',
              'calibration gate mode',
          )
          replace_once(
              '''        result = {\n            **identity,\n            "enabled": False,\n            "mode": "paper_linear_surprisal_no_calibration",\n            "complete": True,\n''',
              '''        result = {\n            **identity,\n            **_coldstart_remoteness_metadata(config),\n            "complete": True,\n''',
              'engineering calibration evidence',
          )
          replace_once(
              '''        "method": METHOD_BASELINE_MATRIX,\n        "methods": list(methods),\n''',
              '''        "method": _coldstart_method(config),\n        "methods": list(methods),\n''',
              'matrix aggregate method identity',
          )
          path.write_text(text)
          PY
      - name: Validate reviewed capability
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py
          python3 -m pip install --quiet numpy PyYAML ruff
          ruff check src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py
          PYTHONPATH=src python3 - <<'PY'
          import copy
          import inspect
          import yaml
          from drpo import e8_experiment_config as cfg
          from drpo import e8_multitask_exp_tuning as exp

          source = inspect.getsource(exp)
          assert source.count('def _is_baseline_matrix(') == 1
          assert 'if _is_baseline_matrix(config):\n        return {' in inspect.getsource(exp._dpo_initialization_identity)

          base = yaml.safe_load(open('configs/e8_multitask_baseline_matrix_formal.yaml'))
          test = copy.deepcopy(base)
          test['experiment_id'] = 'DEV-E8-MULTITASK-RECIPROCAL-SHAPE-128'
          test['execution_class'] = 'pilot'
          test['result_status'] = 'not_run'
          test['remoteness_calibration'] = {
              'enabled': False,
              'mode': 'paper_reciprocal_excess_remoteness_tau_0p125',
              'coordinate': 'relu_current_sequence_surprisal_div_2_minus_0p125',
              'tau_code': 0.125,
              'detached': True,
              'extra_square': False,
              'gradient_rms_matching': False,
          }
          tasks = list(test['suite']['tasks'])
          transfers = list(test['suite']['p0_tasks'])
          def grid(values):
              return {task: ([] if task == 'countdown' else list(values)) for task in tasks}
          prov = {task: 'design_discussion_2026_09_13' for task in transfers}
          test['sweep'] = {
              'profile': cfg.SWEEP_PROFILE_COLDSTART,
              'method': cfg.COLDSTART_METHOD_RECIPROCAL_MATRIX,
              'parameterization': cfg.RECIPROCAL_MATRIX_PARAMETERIZATION,
              'tuning_seed': 4000,
              'countdown_seed_offsets': [],
              'countdown_include_positive_only': False,
              'include_global_endpoint': False,
              'transfer_positive_only_seed_offsets': [],
              'task_transfer_seed_offsets': [4000, 5000],
              'methods': {
                  cfg.COLDSTART_METHOD_RECIPROCAL_LINEAR: {
                      'parameterization': cfg.RECIPROCAL_LINEAR_PARAMETERIZATION,
                      'task_lambda': grid([1.0, 3.0, 7.0, 19.0]),
                      'task_grid_provenance': prov,
                  },
                  cfg.COLDSTART_METHOD_RECIPROCAL_QUADRATIC: {
                      'parameterization': cfg.RECIPROCAL_QUADRATIC_PARAMETERIZATION,
                      'task_lambda': grid([1.0, 9.0, 49.0, 361.0]),
                      'task_grid_provenance': prov,
                  },
              },
              'expected_cells': 128,
          }
          test['canonical_coldstart'].update({
              'scientific_kernel': 'per_cell_canonical_reciprocal_shape_dispatch',
              'initialization': 'qwen_pretrained_base_plus_fresh_lora',
              'formula': 'per_cell_reciprocal_linear_or_quadratic',
              'countdown_entry': 'disabled_reuse_historical_countdown_reciprocal_results',
              'transfer_entry': 'e8_multitask_exp_tuning.train_cell',
          })
          test['execution']['expected_waves'] = 8
          cfg.validate_coldstart_config(test)
          cells = exp.build_cells(test)
          assert len(cells) == 128 and len({cell.key for cell in cells}) == 128
          assert {cell.method for cell in cells} == {
              cfg.COLDSTART_METHOD_RECIPROCAL_LINEAR,
              cfg.COLDSTART_METHOD_RECIPROCAL_QUADRATIC,
          }
          assert {cell.lambda_value for cell in cells if cell.method == cfg.COLDSTART_METHOD_RECIPROCAL_LINEAR} == {1.0,3.0,7.0,19.0}
          assert {cell.lambda_value for cell in cells if cell.method == cfg.COLDSTART_METHOD_RECIPROCAL_QUADRATIC} == {1.0,9.0,49.0,361.0}
          waves = exp.build_waves(test)
          assert len(waves) == 8 and all(len(wave) == 16 for wave in waves)
          meta = exp._coldstart_remoteness_metadata(test)
          assert meta == {
              'enabled': False,
              'mode': 'paper_reciprocal_excess_remoteness_tau_0p125',
              'coordinate': 'relu(current_sequence_surprisal/2-0.125)',
              'tau_code': 0.125,
              'detached': True,
              'extra_square': False,
              'gradient_rms_matching': False,
          }
          baseline_meta = exp._coldstart_remoteness_metadata(base)
          assert baseline_meta['mode'] == 'paper_linear_surprisal_no_calibration'
          assert baseline_meta['coordinate'] == 'current_sequence_surprisal/2'
          print('reviewed reciprocal-128 capability: PASS')
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = 'src/drpo/e8_multitask_exp_tuning.py'
      - name: Remove temporary workflow and commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-e8-reciprocal-shape-review-fix.yml
          git add src/drpo/e8_multitask_exp_tuning.py .github/workflows/tmp-e8-reciprocal-shape-review-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: align reciprocal matrix runtime metadata'
          git push origin HEAD:dev/e8-multitask-reciprocal-shape-128-01
