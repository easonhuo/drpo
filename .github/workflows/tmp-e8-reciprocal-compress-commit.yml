name: tmp-e8-reciprocal-compress-commit
on:
  push:
    branches: [dev/e8-multitask-reciprocal-shape-128-01]
permissions:
  contents: write
jobs:
  compress-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-reciprocal-shape-128-01
          fetch-depth: 0
      - name: Merge current main without committing
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-commit --no-ff origin/main
      - name: Apply reviewed no-semantics-change compression
        shell: bash
        run: |
          set -euo pipefail
          git show ef02b9b98712a07d06beffc1aec575b279012ba1:.github/workflows/tmp-e8-reciprocal-compress-artifact.yml > /tmp/compress.yml
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('/tmp/compress.yml').read_text())
          step = next(
              item for item in workflow['jobs']['compress-review']['steps']
              if item.get('name') == 'Apply no-semantics-change compression in workspace'
          )
          subprocess.run(['bash', '-lc', step['run']], check=True)
          PY
      - name: Validate compressed capability
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'numpy<2' PyYAML pytest ruff
          export PYTHONPATH=.:src
          python3 -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py
          ruff check src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py
          bash tests/test_e8_method_integration_contract.sh
          pytest -q tests/test_e8_multitask_p0.py
          python3 scripts/handoff_authority.py verify --repo-root .
          python3 scripts/validate_governance_pipeline_stage_status.py --repo-root .
          git diff --check
          git diff --cached --check
      - name: Remove temporary workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/tmp-e8-reciprocal-compress-package.yml
          git rm -f .github/workflows/tmp-e8-reciprocal-compress-commit.yml
          git add src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py
          git diff --check
          git diff --cached --check
          echo '--- final diff stat vs current main ---'
          git diff --stat origin/main -- src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py
          echo '--- final numstat vs current main ---'
          git diff --numstat origin/main -- src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Compress reciprocal method plumbing'
          git push origin HEAD:dev/e8-multitask-reciprocal-shape-128-01