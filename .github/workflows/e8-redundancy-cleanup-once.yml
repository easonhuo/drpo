name: E8 Redundancy Cleanup Once

on:
  push:
    branches: [dev/e8-config-driven-sweep-01]
    paths:
      - .github/workflows/e8-redundancy-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Remove approved redundant authorities
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          config_path = Path("src/drpo/e8_experiment_config.py")
          text = config_path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "from drpo.e8_multitask_tasks import TASK_NAMES, stable_hash\n",
              "from drpo.e8_multitask_tasks import TASK_NAMES\n",
              "stable_hash import",
          )
          text = replace_once(
              text,
              '''    transfer_tasks = set(tasks) - {"countdown"}\n    hashes = _mapping(sweep.get("task_grid_hashes"), "task_grid_hashes")\n    provenance = _mapping(sweep.get("task_grid_provenance"), "task_grid_provenance")\n    if set(hashes) != transfer_tasks or set(provenance) != transfer_tasks:\n        raise ValueError("Task-grid hash/provenance maps must cover the exact eight transfer tasks")\n''',
              '''    transfer_tasks = set(tasks) - {"countdown"}\n    provenance = _mapping(sweep.get("task_grid_provenance"), "task_grid_provenance")\n    if set(provenance) != transfer_tasks:\n        raise ValueError("Task-grid provenance must cover the exact eight transfer tasks")\n''',
              "task-grid hash map validation",
          )
          text = replace_once(
              text,
              '''        if stable_hash(list(values)) != str(hashes[task]):\n            raise ValueError(f"{task} lambda grid does not match task_grid_hashes")\n''',
              "",
              "task-grid hash equality gate",
          )
          config_path.write_text(text, encoding="utf-8")

          runner_path = Path("scripts/run_e8_multitask_exp_coldstart.sh")
          text = runner_path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '''MODEL_REPO="Qwen/Qwen2.5-0.5B-Instruct"\nMODEL_REVISION="7ae557604adf67be50417f59c2c2f167def9a775"\n''',
              "",
              "shell model identity constants",
          )
          text = replace_once(
              text,
              ''')" || fail "config path must resolve to a tracked file inside the repository: ${CONFIG_PATH}"\n  CONFIG_REPO_PATH="${resolved}"\n  git -C "${ROOT_DIR}" ls-files --error-unmatch -- "${CONFIG_REPO_PATH}" >/dev/null 2>&1 ||\n    fail "config is not Git-tracked: ${CONFIG_REPO_PATH}"\n  CONFIG_PATH="${ROOT_DIR}/${CONFIG_REPO_PATH}"\n''',
              ''')" || fail "config path must resolve to a file inside the repository: ${CONFIG_PATH}"\n  CONFIG_REPO_PATH="${resolved}"\n  CONFIG_PATH="${ROOT_DIR}/${CONFIG_REPO_PATH}"\n''',
              "shell tracked-config duplicate",
          )
          text = replace_once(
              text,
              '''  python - <<PY\nfrom huggingface_hub import snapshot_download\nsnapshot_download(\n    repo_id="${MODEL_REPO}",\n    revision="${MODEL_REVISION}",\n    local_dir="${MODEL_DIR}",\n)\nPY\n''',
              '''  python - <<PY\nimport json\nfrom pathlib import Path\nfrom huggingface_hub import snapshot_download\npreflight = json.loads((Path("${RECOVERY_ROOT}") / "CONFIG_PREFLIGHT.json").read_text())\nmodel = preflight["model"]\nsnapshot_download(\n    repo_id=model["base_model"],\n    revision=model["revision"],\n    local_dir="${MODEL_DIR}",\n)\nPY\n''',
              "model download authority",
          )
          text = replace_once(
              text,
              '''import json\nfrom pathlib import Path\npath = Path("${RECOVERY_ROOT}") / "SETUP_COMPLETE.json"\npath.write_text(json.dumps({\n    "schema_version": 1,\n    "experiment_id": "${EXPERIMENT_ID}",\n    "source_commit": "${EXPECTED_COMMIT}",\n    "model_revision": "${MODEL_REVISION}",\n''',
              '''import json\nfrom pathlib import Path\npreflight = json.loads((Path("${RECOVERY_ROOT}") / "CONFIG_PREFLIGHT.json").read_text())\npath = Path("${RECOVERY_ROOT}") / "SETUP_COMPLETE.json"\npath.write_text(json.dumps({\n    "schema_version": 1,\n    "experiment_id": "${EXPERIMENT_ID}",\n    "source_commit": "${EXPECTED_COMMIT}",\n    "model_revision": preflight["model"]["revision"],\n''',
              "setup manifest model revision",
          )
          text = replace_once(
              text,
              '''import yaml\nvalue = json.loads((Path("${RECOVERY_ROOT}") / "SETUP_COMPLETE.json").read_text())\nassert value["experiment_id"] == "${EXPERIMENT_ID}"\nassert value["source_commit"] == "${EXPECTED_COMMIT}"\nassert value["model_revision"] == "${MODEL_REVISION}"\n''',
              '''import yaml\nfrom drpo.e8_multitask_exp_tuning import load_config\nvalue = json.loads((Path("${RECOVERY_ROOT}") / "SETUP_COMPLETE.json").read_text())\nconfig = load_config(Path("${CONFIG_PATH}"))\nassert value["experiment_id"] == "${EXPERIMENT_ID}"\nassert value["source_commit"] == "${EXPECTED_COMMIT}"\nassert value["model_revision"] == config["model"]["revision"]\n''',
              "runtime-ready model revision",
          )
          runner_path.write_text(text, encoding="utf-8")

          tests_path = Path("tests/test_e8_multitask_p0.py")
          text = tests_path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '''        assert (\n            exp_tuning.stable_hash(list(exp_tuning._task_lambdas(config, task)))\n            == config["sweep"]["task_grid_hashes"][task]\n        )\n''',
              "",
              "historical task hash assertion",
          )
          text = replace_once(
              text,
              '''    sweep["task_lambda"]["maze"] = []\n    sweep["task_grid_hashes"]["maze"] = exp_tuning.stable_hash([])\n    active = [task for task in config["suite"]["p0_tasks"] if sweep["task_lambda"][task]]\n''',
              '''    sweep["task_lambda"]["maze"] = []\n    sweep.pop("task_grid_hashes", None)\n    active = [task for task in config["suite"]["p0_tasks"] if sweep["task_lambda"][task]]\n''',
              "generic config hash independence",
          )
          text = replace_once(
              text,
              '''def test_runner_uses_real_tracked_config_check_and_standalone_preflight() -> None:\n    runner = Path("scripts/run_e8_multitask_exp_coldstart.sh").read_text(encoding="utf-8")\n    assert 'git -C "${ROOT_DIR}" ls-files --error-unmatch -- "${CONFIG_REPO_PATH}"' in runner\n    assert "scripts/preflight_e8_multitask_config.py" in runner\n    assert "config_preflight | tee" in runner\n    assert "E8_COLDSTART_RUN_ID must match [A-Za-z0-9]" in runner\n''',
              '''def test_runner_delegates_tracked_config_and_model_identity_to_config_authority() -> None:\n    runner = Path("scripts/run_e8_multitask_exp_coldstart.sh").read_text(encoding="utf-8")\n    assert 'git -C "${ROOT_DIR}" ls-files --error-unmatch -- "${CONFIG_REPO_PATH}"' not in runner\n    assert "scripts/preflight_e8_multitask_config.py" in runner\n    assert "config_preflight | tee" in runner\n    assert 'MODEL_REPO="' not in runner\n    assert 'MODEL_REVISION="' not in runner\n    assert 'model = preflight["model"]' in runner\n    assert 'config["model"]["revision"]' in runner\n    assert "E8_COLDSTART_RUN_ID must match [A-Za-z0-9]" in runner\n''',
              "runner authority test",
          )
          tests_path.write_text(text, encoding="utf-8")
          PY

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Validate redundancy cleanup
        run: |
          ruff format \
            src/drpo/e8_experiment_config.py \
            tests/test_e8_multitask_p0.py
          python -m py_compile \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          ruff check \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            tests/test_e8_multitask_p0.py
          ruff format --check \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh
          python -m pytest -q tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py -k 'not reciprocal and not asymre'
          python scripts/preflight_e8_multitask_config.py --repo-root . --config configs/e8_multitask_exp_coldstart.yaml >/tmp/e8-preflight-cold.json
          python scripts/preflight_e8_multitask_config.py --repo-root . --config configs/e8_multitask_exp_lambda_completion.yaml >/tmp/e8-preflight-completion.json
          python scripts/preflight_e8_multitask_config.py --repo-root . --config configs/e8_multitask_exp_lambda_curve_completion.yaml >/tmp/e8-preflight-curve.json
          ! grep -Fq 'task_grid_hashes' src/drpo/e8_experiment_config.py
          ! grep -Eq '^MODEL_(REPO|REVISION)=' scripts/run_e8_multitask_exp_coldstart.sh
          ! grep -Fq 'ls-files --error-unmatch -- "${CONFIG_REPO_PATH}"' scripts/run_e8_multitask_exp_coldstart.sh
          python scripts/handoff_authority.py verify --repo-root .
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .
          git diff --check
          git diff --stat
          changed="$(git diff --name-only HEAD --)"
          printf '%s\n' "${changed}"
          [[ "${changed}" == $'scripts/run_e8_multitask_exp_coldstart.sh\nsrc/drpo/e8_experiment_config.py\ntests/test_e8_multitask_p0.py' ]]

      - name: Commit cleanup and self-remove
        run: |
          rm -f .github/workflows/e8-redundancy-cleanup-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor(e8): remove redundant config authorities"
          git push origin HEAD:dev/e8-config-driven-sweep-01
