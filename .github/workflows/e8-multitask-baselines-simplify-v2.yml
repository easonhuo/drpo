name: E8 multitask baseline simplification v2

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-multitask-baselines-simplify-v2.yml

permissions:
  contents: write

jobs:
  simplify-v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Deduplicate method-cell construction and compact unranked aggregation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/drpo/e8_multitask_exp_tuning.py')
          text = path.read_text(encoding='utf-8')

          marker = 'def build_cells(config: Mapping[str, Any]) -> tuple[Cell, ...]:\n'
          if text.count(marker) != 1:
              raise RuntimeError('build_cells marker drifted')
          helper = '''def _coldstart_method_cell(\n    task: str,\n    method: str,\n    seed: int,\n    stage: str,\n    value: float,\n    *,\n    lambda_only: bool,\n) -> Cell:\n    if method == METHOD_ASYMRE:\n        return Cell(task, method, None, seed, stage, delta_v=value)\n    if method in {METHOD_TOPR, METHOD_DPO}:\n        return Cell(task, method, None, seed, stage, beta=value)\n    if method == METHOD_EXPONENTIAL:\n        rho = None if lambda_only else math.exp(-value)\n        return Cell(task, method, rho, seed, stage, value)\n    raise ValueError(f\"Unsupported cold-start method: {method}\")\n\n\n'''
          text = text.replace(marker, helper + marker, 1)

          start = text.index('            if method == METHOD_ASYMRE:', text.index('for seed_offset in tuple('))
          end = text.index('        positive_seeds = tuple(', start)
          countdown_block = '''            if method == METHOD_DPO:\n                raise AssertionError(\"Countdown DPO cells are disabled by config validation\")\n            cells.extend(\n                _coldstart_method_cell(\n                    \"countdown\",\n                    method,\n                    seed_offset,\n                    \"countdown_sentinel\",\n                    value,\n                    lambda_only=lambda_only,\n                )\n                for value in countdown_values\n            )\n'''
          text = text[:start] + countdown_block + text[end:]

          task_loop = text.index('        for task in tasks:', text.index('positive_seeds = tuple('))
          start = text.index('            if method == METHOD_ASYMRE:', task_loop)
          end = text.index('        result = tuple(cells)', start)
          transfer_block = '''            cells.extend(\n                _coldstart_method_cell(\n                    task,\n                    method,\n                    method_seed,\n                    \"task_transfer\",\n                    value,\n                    lambda_only=lambda_only,\n                )\n                for value in values\n            )\n'''
          text = text[:start] + transfer_block + text[end:]

          start = text.index('def _aggregate_coldstart_unranked(')
          end = text.index('\ndef _aggregate_coldstart(\n', start)
          compact = '''def _aggregate_coldstart_unranked(\n    config: Mapping[str, Any],\n    output_root: Path,\n    rows: list[dict[str, Any]],\n) -> dict[str, Any]:\n    \"\"\"Aggregate AsymRE/TOPR/DPO curves without method selection or ranking.\"\"\"\n\n    method = _coldstart_method(config)\n    if method not in {METHOD_ASYMRE, METHOD_TOPR, METHOD_DPO}:\n        raise ValueError(f\"Unsupported unranked cold-start method: {method}\")\n    parameter_name = \"delta_v\" if method == METHOD_ASYMRE else \"beta\"\n    scientific_kernel = (\n        \"historical_pr268_semantics_port_in_existing_multitask_runner\"\n        if method == METHOD_DPO\n        else \"canonical_old_coldstart_imports\"\n    )\n    method_metadata: dict[str, Any]\n    if method == METHOD_ASYMRE:\n        grid = _canonical_asymre_grid_path()\n        method_metadata = {\n            \"canonical_asymre_grid\": str(grid),\n            \"canonical_asymre_grid_sha256\": sha256_file(grid),\n        }\n    elif method == METHOD_TOPR:\n        grid = CANONICAL_TOPR_GRID.resolve()\n        method_metadata = {\n            \"canonical_topr_grid\": str(grid),\n            \"canonical_topr_grid_sha256\": sha256_file(grid),\n        }\n    else:\n        method_metadata = {\n            \"dpo_initialization_mode\": str(config[\"dpo\"][\"initialization_mode\"]),\n        }\n\n    provenance_path = output_root / \"source_provenance.json\"\n    provenance = (\n        json.loads(provenance_path.read_text(encoding=\"utf-8\"))\n        if provenance_path.is_file()\n        else {}\n    )\n    run_id = str(provenance.get(\"run_id\", output_root.name))\n    source_commit = str(provenance.get(\"source_commit\", \"unrecorded\"))\n    direct_fields = (\n        \"task\", \"method\", \"seed\", \"stage\", \"late_window_pass8_mean\",\n        \"late_window_greedy_mean\", \"terminal_pass8\", \"terminal_greedy\",\n        \"best_greedy_valid_rate\", \"terminal_greedy_valid_rate\", \"best_step\",\n        \"terminal_step\", \"stop_reason\", \"nan_inf_failure\",\n    )\n    plot_rows: list[dict[str, Any]] = []\n    for row in rows:\n        plot = {key: row[key] for key in direct_fields}\n        plot.update(\n            {\n                \"experiment_id\": experiment_id(config),\n                \"run_id\": run_id,\n                \"source_commit\": source_commit,\n                parameter_name: row.get(parameter_name),\n                \"best_validation_pass8\": row[\"best_pass8\"],\n                \"best_validation_greedy\": row[\"best_greedy\"],\n                \"complete\": True,\n            }\n        )\n        plot_rows.append(plot)\n    _write_csv(output_root / \"aggregate\" / \"plot_curve_points.csv\", plot_rows)\n\n    configured_cells = build_cells(config)\n    summaries: dict[str, Any] = {}\n    summary_rows: list[dict[str, Any]] = []\n    for task_value in config[\"suite\"][\"tasks\"]:\n        task = str(task_value)\n        task_cells = [cell for cell in configured_cells if cell.task == task]\n        if not task_cells:\n            continue\n        task_rows = [row for row in rows if row[\"task\"] == task]\n        controls = {\n            control: [row for row in task_rows if row[\"method\"] == control]\n            for control in (METHOD_POSITIVE_ONLY, METHOD_GLOBAL)\n        }\n        method_rows = [row for row in task_rows if row[\"method\"] == method]\n        expected = {\n            candidate: sum(cell.method == candidate for cell in task_cells)\n            for candidate in (method, *controls)\n        }\n        if len(method_rows) != expected[method] or any(\n            len(group) != expected[control] for control, group in controls.items()\n        ):\n            raise RuntimeError(f\"{task} {method} cold-start cell geometry is incomplete\")\n\n        groups: dict[float, list[dict[str, Any]]] = {}\n        for row in method_rows:\n            value = row.get(parameter_name)\n            if value is None:\n                raise RuntimeError(f\"{task} {method} row is missing {parameter_name}\")\n            groups.setdefault(float(value), []).append(row)\n        grouped_curve = []\n        for value, group in sorted(groups.items()):\n            mean = lambda key: float(np.mean([float(row[key]) for row in group]))  # noqa: E731\n            grouped_curve.append(\n                {\n                    \"task\": task,\n                    \"method\": method,\n                    parameter_name: value,\n                    \"seeds\": sorted(int(row[\"seed\"]) for row in group),\n                    \"late_window_pass8_mean\": mean(\"late_window_pass8_mean\"),\n                    \"late_window_greedy_mean\": mean(\"late_window_greedy_mean\"),\n                    \"terminal_pass8_mean\": mean(\"terminal_pass8\"),\n                    \"terminal_greedy_valid_rate_mean\": mean(\"terminal_greedy_valid_rate\"),\n                    \"nan_inf_failure\": any(bool(row[\"nan_inf_failure\"]) for row in group),\n                }\n            )\n        summaries[task] = {\n            \"task\": task,\n            \"grouped_curve\": grouped_curve,\n            \"positive_only\": controls[METHOD_POSITIVE_ONLY] or None,\n            \"global\": controls[METHOD_GLOBAL] or None,\n            \"parameter_selection_deferred_to_reviewed_protocol\": True,\n            \"terminal_valid_rate_role\": \"diagnostic_only_not_selection_eligibility\",\n        }\n        summary_rows.append(\n            {\n                \"task\": task,\n                f\"{method}_parameter_points\": len(grouped_curve),\n                \"finite_parameter_points\": sum(\n                    not bool(row[\"nan_inf_failure\"]) for row in grouped_curve\n                ),\n                \"parameter_selection_deferred\": True,\n            }\n        )\n    _write_csv(output_root / \"aggregate\" / \"task_summary.csv\", summary_rows)\n\n    summary = {\n        \"schema_version\": 1,\n        \"experiment_id\": experiment_id(config),\n        \"run_id\": run_id,\n        \"source_commit\": source_commit,\n        \"cell_count\": len(rows),\n        \"plot_curve_point_count\": len(plot_rows),\n        \"method\": method,\n        \"tasks\": summaries,\n        \"excluded_tasks\": dict(config[\"suite\"][\"excluded_tasks\"]),\n        \"initialization\": dict(config[\"initialization\"]),\n        \"scientific_kernel\": scientific_kernel,\n        **method_metadata,\n        \"countdown_protocol_diagnostic\": _countdown_protocol_diagnostic(\n            config,\n            output_root,\n            destination=output_root / \"aggregate\" / \"countdown_protocol_diagnostic.json\",\n        ),\n        \"countdown_result_gate\": False,\n        \"primary_metric\": \"validation_late_window_pass8_mean\",\n        \"parameter_selection_deferred_to_reviewed_protocol\": True,\n        \"test_partition_accessed\": False,\n        \"method_ranking_allowed\": False,\n        \"significance_claim_allowed\": False,\n        \"fixed_horizon_is_convergence\": False,\n        \"task_performance_reported_separately\": True,\n        \"structure_diagnostic_reported_separately\": True,\n        \"nan_inf_reported_separately\": True,\n        \"scientific_status\": \"not_run\" if _is_engineering_self_test(config) else \"pilot\",\n        \"engineering_placeholder_backend\": _is_engineering_self_test(config),\n    }\n    atomic_json(output_root / \"aggregate\" / \"aggregate_summary.json\", summary)\n    return summary\n\n'''
          text = text[:start] + compact + text[end + 1:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install focused dependencies
        run: python -m pip install -q numpy pyyaml pytest torch ruff
      - name: Validate v2 simplification
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check
          python - <<'PY'
          import inspect
          from drpo import e8_multitask_exp_tuning as module
          build = inspect.getsource(module.build_cells)
          assert build.count('_coldstart_method_cell(') == 2
          shared = inspect.getsource(module._aggregate_coldstart_unranked)
          assert all(name in shared for name in ('METHOD_ASYMRE', 'METHOD_TOPR', 'METHOD_DPO'))
          PY
          ruff check src/drpo/e8_multitask_exp_tuning.py --output-format concise > /tmp/ruff.txt 2>&1 || true
          cat /tmp/ruff.txt
      - name: Report net diff
        run: git diff --numstat 8a21fd16e63ea96a0cde2a477353d24562624655 -- src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
      - name: Commit validated simplification and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/e8-multitask-baselines-simplify-v2.yml
          git add src/drpo/e8_multitask_exp_tuning.py
          git diff --cached --check
          git commit -m 'refactor: deduplicate E8 baseline method plumbing'
          git push origin HEAD:dev/e8-multitask-baselines-capability-01
