name: Temporary compact E8 lambda v4

on:
  push:
    branches:
      - dev/e8-multitask-lambda-completion-minimal-04

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-lambda-completion-minimal-04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compact compatibility edits without changing behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/drpo/e8_multitask_exp_tuning.py')
          s=p.read_text(encoding='utf-8')
          pairs=[
          ('''SUPPORTED_EXPERIMENT_IDS = (\n    EXPERIMENT_ID, DENSE_EXPERIMENT_ID, COLDSTART_EXPERIMENT_ID, LAMBDA_COMPLETION_EXPERIMENT_ID\n)\n''','''SUPPORTED_EXPERIMENT_IDS = (EXPERIMENT_ID, DENSE_EXPERIMENT_ID, COLDSTART_EXPERIMENT_ID, LAMBDA_COMPLETION_EXPERIMENT_ID)\n'''),
          ('''        expected_countdown_seeds = (\n            () if current_experiment == LAMBDA_COMPLETION_EXPERIMENT_ID else PAPER_SEED_OFFSETS\n        )\n''','''        expected_countdown_seeds = () if current_experiment == LAMBDA_COMPLETION_EXPERIMENT_ID else PAPER_SEED_OFFSETS\n'''),
          ('''        if current_experiment == LAMBDA_COMPLETION_EXPERIMENT_ID:\n            if not transfer_positive_seeds or len(transfer_positive_seeds) != len(set(transfer_positive_seeds)):\n                raise ValueError("Successor Positive-only seed offsets must be non-empty and unique")\n        elif transfer_positive_seeds != (4000, 5000, 6000, 7000):\n            raise ValueError("Transfer Positive-only must use the four frozen historical seed streams")\n''','''        if (current_experiment == LAMBDA_COMPLETION_EXPERIMENT_ID and (not transfer_positive_seeds or len(transfer_positive_seeds) != len(set(transfer_positive_seeds)))) or (current_experiment != LAMBDA_COMPLETION_EXPERIMENT_ID and transfer_positive_seeds != (4000, 5000, 6000, 7000)):\n            raise ValueError("Transfer Positive-only seed offsets drifted")\n'''),
          ('''        if not isinstance(grid_hashes, Mapping) or set(grid_hashes) != transfer_tasks:\n            raise ValueError("Transfer task-grid hashes must cover the exact eight tasks")\n        if current_experiment != LAMBDA_COMPLETION_EXPERIMENT_ID and dict(grid_hashes) != expected_hashes:\n            raise ValueError("Historical transfer task-grid hashes drifted")\n''','''        if not isinstance(grid_hashes, Mapping) or set(grid_hashes) != transfer_tasks or (current_experiment != LAMBDA_COMPLETION_EXPERIMENT_ID and dict(grid_hashes) != expected_hashes):\n            raise ValueError("Transfer task-grid hashes drifted")\n'''),
          ('''            if len(values) != len(set(values)) or (\n                current_experiment != LAMBDA_COMPLETION_EXPERIMENT_ID and len(values) != 20\n            ):\n                raise ValueError(f"{task} Exp coefficient grid has invalid cardinality")\n''','''            if len(values) != len(set(values)) or (current_experiment != LAMBDA_COMPLETION_EXPERIMENT_ID and len(values) != 20):\n                raise ValueError(f"{task} Exp coefficient grid has invalid cardinality")\n'''),
          ('''        expanded_cells = len(expected_countdown_seeds) * (2 + len(countdown_sentinels)) + sum(\n            len(transfer_positive_seeds) + len(_task_lambdas(config, str(task)))\n            for task in transfer_tasks\n        )\n''','''        expanded_cells = len(expected_countdown_seeds) * (2 + len(countdown_sentinels)) + sum(len(transfer_positive_seeds) + len(_task_lambdas(config, str(task))) for task in transfer_tasks)\n'''),
          ('''        result = tuple(cells)\n        expected_cells = int(config["sweep"]["expected_cells"])\n        if len(result) != expected_cells or len({cell.key for cell in result}) != expected_cells:\n            raise AssertionError("Internal cold-start cell identity failure")\n''','''        result = tuple(cells)\n        if len(result) != int(config["sweep"]["expected_cells"]) or len({cell.key for cell in result}) != len(result):\n            raise AssertionError("Internal cold-start cell identity failure")\n'''),
          ('''        if (\n            not waves\n            or len(waves) != int(config["execution"]["expected_waves"])\n            or any(len(wave) != capacity for wave in waves[:-1])\n            or not 0 < len(waves[-1]) <= capacity\n        ):\n            raise AssertionError("Cold-start waves must fill capacity except possibly the final wave")\n''','''        if not waves or len(waves) != int(config["execution"]["expected_waves"]) or any(len(wave) != capacity for wave in waves[:-1]) or not 0 < len(waves[-1]) <= capacity:\n            raise AssertionError("Cold-start waves must fill capacity except possibly the final wave")\n'''),
          ('''        configured_cells = [cell for cell in build_cells(config) if cell.task == task]\n        if not configured_cells:\n            continue\n        expected_counts = tuple(\n            sum(cell.method == method for cell in configured_cells)\n            for method in (METHOD_POSITIVE_ONLY, METHOD_GLOBAL, METHOD_EXPONENTIAL)\n        )\n''','''        configured_methods = [cell.method for cell in build_cells(config) if cell.task == task]\n        if not configured_methods:\n            continue\n        expected_counts = tuple(configured_methods.count(method) for method in (METHOD_POSITIVE_ONLY, METHOD_GLOBAL, METHOD_EXPONENTIAL))\n'''),
          ('''            "status": "PASS" if not identity_failures and (\n                len(countdown_cells) == 16 or experiment_id(config) == LAMBDA_COMPLETION_EXPERIMENT_ID\n            ) else "FAIL",\n''','''            "status": "PASS" if not identity_failures and (len(countdown_cells) == 16 or experiment_id(config) == LAMBDA_COMPLETION_EXPERIMENT_ID) else "FAIL",\n'''),
          ]
          for old,new in pairs:
              assert s.count(old)==1, old[:80]
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Install and validate
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests
          python -m pytest -q tests/test_e8_multitask_p0.py
          ruff check --select E9,F63,F7,F82 src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git diff --quiet 5260ca58ecb67509838a1e5480f6dcaafdb7a773 -- scripts/run_e8_multitask_exp_coldstart.sh
          git diff --quiet 5260ca58ecb67509838a1e5480f6dcaafdb7a773 -- src/drpo/countdown_qwen_arena_onefile.py src/drpo/countdown_e8_alpha1_c_scan_common.py src/drpo/countdown_e8_alpha1_c_scan_runtime.py src/drpo/countdown_e8_alpha1_c_scan_trainer.py src/drpo/countdown_e8_alpha1_highc_scan_common.py src/drpo/countdown_e8_alpha1_highc_scan_runtime.py
          python - <<'PY'
          from pathlib import Path
          from drpo import e8_multitask_exp_tuning as m
          c=m.load_config(Path('configs/e8_multitask_exp_lambda_completion.yaml')); cells=m.build_cells(c)
          assert len(cells)==199 and sum(x.method==m.METHOD_EXPONENTIAL for x in cells)==183 and sum(x.method==m.METHOD_POSITIVE_ONLY for x in cells)==16
          assert not any(x.task=='countdown' for x in cells)
          assert all(x.rho is None and x.lambda_value is not None for x in cells if x.method==m.METHOD_EXPONENTIAL)
          assert [len(w) for w in m.build_waves(c)]==[16]*12+[7]
          oldc=m.load_config(Path('configs/e8_multitask_exp_coldstart.yaml')); old=m.build_cells(oldc)
          assert len(old)==208 and [len(w) for w in m.build_waves(oldc)]==[16]*13
          assert all(x.rho is not None for x in old if x.method==m.METHOD_EXPONENTIAL)
          PY
          git diff --numstat 5260ca58ecb67509838a1e5480f6dcaafdb7a773 -- src/drpo/e8_multitask_exp_tuning.py
      - name: Commit compaction
        run: |
          rm .github/workflows/tmp-e8-lambda-compact-v4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/drpo/e8_multitask_exp_tuning.py .github/workflows/tmp-e8-lambda-compact-v4.yml
          git commit -m 'E8: compact config compatibility surface'
          git push origin HEAD:dev/e8-multitask-lambda-completion-minimal-04
