name: TEMP E8 P4 Ruff diagnostic

on:
  push:
    branches:
      - dev/e8-multitask-training-splits-01
    paths:
      - .github/workflows/temp-e8-p4-ruff-diagnostic.yml

permissions:
  contents: write

env:
  STACKED_BASE: 79009c487be6d64ef7f1d54b3f5dfa33808cc4c2
  P4_SOURCE_COMMIT: 5dddfd104c39c80592df033a2d13c66739771446

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev/e8-multitask-training-splits-01
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Capture pre-P4 and stacked-base Ruff
        shell: bash
        run: |
          set +e
          ruff check . > /tmp/ruff_pre.txt 2>&1
          pre_rc=$?
          set -e
          git worktree add --detach /tmp/drpo-p4-base "$STACKED_BASE"
          set +e
          (
            cd /tmp/drpo-p4-base
            ruff check .
          ) > /tmp/ruff_base.txt 2>&1
          base_rc=$?
          set -e
          printf '%s\n' "$pre_rc" > /tmp/ruff_pre.rc
          printf '%s\n' "$base_rc" > /tmp/ruff_base.rc
          diff -u /tmp/ruff_base.txt /tmp/ruff_pre.txt > /tmp/ruff_base_vs_pre.diff || true
          git worktree remove --force /tmp/drpo-p4-base
      - name: Apply exact P4 transformation in working tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          source_commit = os.environ["P4_SOURCE_COMMIT"]
          source_path = ".github/workflows/temp-e8-p4-apply-v2.yml"
          raw = subprocess.check_output(
              ["git", "show", f"{source_commit}:{source_path}"],
              text=True,
          )
          start = raw.index("      - name: Apply P4 call-scoped binding refactor")
          end = raw.index("      - name: Static architecture assertions", start)
          section = raw[start:end]
          marker = "          python - <<'PY'\n"
          payload_start = section.index(marker) + len(marker)
          payload_end = section.rindex("          PY\n")
          payload = section[payload_start:payload_end]
          lines = []
          for line in payload.splitlines():
              if line.startswith("          "):
                  line = line[10:]
              lines.append(line)
          Path("/tmp/apply_p4.py").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python /tmp/apply_p4.py
      - name: Capture post-P4 Ruff and changed-surface proof
        shell: bash
        run: |
          set +e
          ruff check . > /tmp/ruff_post.txt 2>&1
          post_rc=$?
          set -e
          printf '%s\n' "$post_rc" > /tmp/ruff_post.rc
          diff -u /tmp/ruff_pre.txt /tmp/ruff_post.txt > /tmp/ruff_pre_vs_post.diff || true
          ruff check src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_selftest.py tests/test_e8_multitask_p0.py > /tmp/ruff_changed_surface.txt 2>&1
      - name: Summarize diagnostic
        shell: bash
        run: |
          {
            echo "pre_rc=$(cat /tmp/ruff_pre.rc)"
            echo "base_rc=$(cat /tmp/ruff_base.rc)"
            echo "post_rc=$(cat /tmp/ruff_post.rc)"
            echo "base_vs_pre_diff_lines=$(wc -l < /tmp/ruff_base_vs_pre.diff)"
            echo "pre_vs_post_diff_lines=$(wc -l < /tmp/ruff_pre_vs_post.diff)"
          } | tee /tmp/summary.txt
          echo '--- pre-P4 Ruff ---'
          cat /tmp/ruff_pre.txt
          echo '--- stacked-base Ruff ---'
          cat /tmp/ruff_base.txt
          echo '--- post-P4 Ruff ---'
          cat /tmp/ruff_post.txt
          echo '--- base vs pre ---'
          cat /tmp/ruff_base_vs_pre.diff
          echo '--- pre vs post ---'
          cat /tmp/ruff_pre_vs_post.diff
      - uses: actions/upload-artifact@v4
        with:
          name: e8-p4-ruff-diagnostic
          path: |
            /tmp/summary.txt
            /tmp/ruff_pre.txt
            /tmp/ruff_base.txt
            /tmp/ruff_post.txt
            /tmp/ruff_base_vs_pre.diff
            /tmp/ruff_pre_vs_post.diff
            /tmp/ruff_changed_surface.txt
      - name: Remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git config user.name "drpo-p4-diagnostic-bot"
          git config user.email "drpo-p4-diagnostic-bot@users.noreply.github.com"
          git rm .github/workflows/temp-e8-p4-ruff-diagnostic.yml
          git commit -m "chore: remove temporary P4 Ruff diagnostic [skip ci]"
          git push origin HEAD:dev/e8-multitask-training-splits-01
