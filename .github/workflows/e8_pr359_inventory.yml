name: E8 PR359 Results Split

on:
  push:
    branches:
      - dev/e8-multitask-results-split-01

permissions:
  contents: write

jobs:
  transform-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-results-split-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Move result and aggregation responsibilities
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          main_path = Path('src/drpo/e8_multitask_exp_tuning.py')
          results_path = Path('src/drpo/e8_multitask_results.py')
          main_source = main_path.read_text(encoding='utf-8')
          results_source = results_path.read_text(encoding='utf-8')
          tree = ast.parse(main_source)
          nodes = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          expected_sizes = {
              '_coldstart_result_row': 43,
              '_write_coldstart_task_result': 96,
              '_aggregate_dense': 158,
              '_coldstart_plot_metrics': 16,
              '_coldstart_group_metrics': 12,
              '_coldstart_run_provenance': 7,
              '_coldstart_method_grouped_curve': 44,
              '_aggregate_coldstart_unranked': 128,
              '_aggregate_coldstart_matrix_unranked': 115,
              '_aggregate_coldstart': 171,
          }
          for name, size in expected_sizes.items():
              node = nodes.get(name)
              if node is None:
                  raise SystemExit(f'missing expected function: {name}')
              observed = node.end_lineno - node.lineno + 1
              if observed != size:
                  raise SystemExit(f'{name} size drifted: expected {size}, observed {observed}')

          lines = main_source.splitlines(keepends=True)

          def body(name: str) -> str:
              node = nodes[name]
              return ''.join(lines[node.body[0].lineno - 1: node.end_lineno])

          def block(name: str) -> str:
              node = nodes[name]
              return ''.join(lines[node.lineno - 1: node.end_lineno])

          def replace_protocol_call(text: str, *, assignment: bool) -> str:
              call = (
                  '    protocol_diagnostic = _countdown_protocol_diagnostic(\n'
                  '        config,\n'
                  '        output_root,\n'
                  '        destination=output_root / "aggregate" / "countdown_protocol_diagnostic.json",\n'
                  '    )\n'
              )
              if assignment:
                  if call not in text:
                      raise SystemExit('expected countdown protocol assignment not found')
                  return text.replace(call, '    protocol_diagnostic = protocol_diagnostic_value\n', 1)
              field_call = (
                  '        "countdown_protocol_diagnostic": _countdown_protocol_diagnostic(\n'
                  '            config,\n'
                  '            output_root,\n'
                  '            destination=output_root / "aggregate" / "countdown_protocol_diagnostic.json",\n'
                  '        ),\n'
              )
              if field_call not in text:
                  raise SystemExit('expected countdown protocol field call not found')
              return text.replace(
                  field_call,
                  '        "countdown_protocol_diagnostic": protocol_diagnostic,\n',
                  1,
              )

          moved: list[str] = []

          result_row_body = body('_coldstart_result_row')
          result_row_body = result_row_body.replace(
              '    if not _is_engineering_self_test(config) and (\n',
              '    if require_late_window_metrics and (\n',
              1,
          )
          result_row_body = result_row_body.replace(
              'e8_results.common_result_row', 'common_result_row'
          ).replace('_method_output_columns(cell)', 'method_columns')
          moved.append(
              'def _coldstart_result_row(\n'
              '    cell: CellLike,\n'
              '    value: Mapping[str, Any],\n'
              '    *,\n'
              '    source: str,\n'
              '    method_columns: Mapping[str, Any],\n'
              '    require_late_window_metrics: bool,\n'
              ') -> dict[str, Any]:\n'
              + result_row_body
          )

          write_task_body = body('_write_coldstart_task_result')
          write_task_body = write_task_body.replace('build_cells(config)', 'configured_cells')
          write_task_body = write_task_body.replace(
              '_method_spec(cell.method)', 'method_specs[cell.method]'
          )
          write_task_body = write_task_body.replace('_write_csv(', 'write_csv(')
          write_task_body = write_task_body.replace(
              'experiment_id(config)', 'experiment_id_value'
          )
          write_task_body = write_task_body.replace('sha256_file(', 'sha256_fn(')
          write_task_body = write_task_body.replace(
              'stable_config_hash(config)', 'config_hash'
          )
          write_task_body = write_task_body.replace(
              '_is_engineering_self_test(config)', 'engineering_self_test'
          )
          write_task_body = write_task_body.replace('atomic_json(', 'write_json(')
          moved.append(
              'def _write_coldstart_task_result(\n'
              '    config: Mapping[str, Any],\n'
              '    output_root: Path,\n'
              '    task: str,\n'
              '    rows: list[dict[str, Any]],\n'
              '    *,\n'
              '    configured_cells: Sequence[CellLike],\n'
              '    method_specs: Mapping[str, MethodSpecLike],\n'
              '    experiment_id_value: str,\n'
              '    config_hash: str,\n'
              '    engineering_self_test: bool,\n'
              '    write_json: Callable[[Path, Any], None],\n'
              '    sha256_fn: Callable[[Path], str],\n'
              ') -> dict[str, Any]:\n'
              + write_task_body
          )

          dense_body = body('_aggregate_dense')
          dense_body = dense_body.replace('experiment_id(config)', 'experiment_id_value')
          dense_body = dense_body.replace('stable_config_hash(config)', 'config_hash')
          dense_body = dense_body.replace('_task_lambdas(', 'task_lambdas_fn(')
          dense_body = dense_body.replace('METHOD_POSITIVE_ONLY', 'positive_only_method')
          dense_body = dense_body.replace('METHOD_EXPONENTIAL', 'exponential_method')
          dense_body = dense_body.replace('_write_csv(', 'write_csv(')
          dense_body = dense_body.replace('atomic_json(', 'write_json(')
          moved.append(
              'def _aggregate_dense(\n'
              '    config: Mapping[str, Any],\n'
              '    output_root: Path,\n'
              '    rows: list[dict[str, Any]],\n'
              '    *,\n'
              '    experiment_id_value: str,\n'
              '    config_hash: str,\n'
              '    task_lambdas_fn: Callable[[Mapping[str, Any], str], Sequence[float]],\n'
              '    positive_only_method: str,\n'
              '    exponential_method: str,\n'
              '    write_json: Callable[[Path, Any], None],\n'
              ') -> dict[str, Any]:\n'
              + dense_body
          )

          moved.append(block('_coldstart_plot_metrics'))
          moved.append(block('_coldstart_group_metrics'))
          moved.append(block('_coldstart_run_provenance'))

          grouped_body = body('_coldstart_method_grouped_curve')
          grouped_body = grouped_body.replace('    spec = _method_spec(method)\n', '', 1)
          grouped_body = grouped_body.replace('spec.parameters(cell)', 'parameter_fn(cell)')
          grouped_body = grouped_body.replace('e8_results.parameter_identity', 'parameter_identity')
          grouped_body = grouped_body.replace('e8_results.parameter_sort_key', 'parameter_sort_key')
          moved.append(
              'def _coldstart_method_grouped_curve(\n'
              '    *,\n'
              '    task: str,\n'
              '    method: str,\n'
              '    method_rows: Sequence[Mapping[str, Any]],\n'
              '    cells_by_key: Mapping[str, CellLike],\n'
              '    parameter_fn: Callable[[CellLike], Mapping[str, Any]],\n'
              ') -> list[dict[str, Any]]:\n'
              + grouped_body
          )

          unranked_body = body('_aggregate_coldstart_unranked')
          old_prefix = (
              '    method = _coldstart_method(config)\n'
              '    spec = _method_spec(method)\n'
              '    configured_cells = build_cells(config)\n'
          )
          if old_prefix not in unranked_body:
              raise SystemExit('unranked aggregate prefix drifted')
          unranked_body = unranked_body.replace(old_prefix, '    method = spec.name\n', 1)
          unranked_body = unranked_body.replace(
              '            cells_by_key=cells_by_key,\n        )',
              '            cells_by_key=cells_by_key,\n            parameter_fn=spec.parameters,\n        )',
              1,
          )
          unranked_body = unranked_body.replace('METHOD_POSITIVE_ONLY', 'positive_only_method')
          unranked_body = unranked_body.replace('METHOD_GLOBAL', 'global_method')
          unranked_body = unranked_body.replace('experiment_id(config)', 'experiment_id_value')
          unranked_body = replace_protocol_call(unranked_body, assignment=False)
          unranked_body = unranked_body.replace(
              '_is_engineering_self_test(config)', 'engineering_self_test'
          )
          unranked_body = unranked_body.replace('_write_csv(', 'write_csv(')
          unranked_body = unranked_body.replace('atomic_json(', 'write_json(')
          moved.append(
              'def _aggregate_coldstart_unranked(\n'
              '    config: Mapping[str, Any],\n'
              '    output_root: Path,\n'
              '    rows: list[dict[str, Any]],\n'
              '    *,\n'
              '    spec: MethodSpecLike,\n'
              '    configured_cells: Sequence[CellLike],\n'
              '    experiment_id_value: str,\n'
              '    protocol_diagnostic: Mapping[str, Any],\n'
              '    engineering_self_test: bool,\n'
              '    positive_only_method: str,\n'
              '    global_method: str,\n'
              '    write_json: Callable[[Path, Any], None],\n'
              ') -> dict[str, Any]:\n'
              + unranked_body
          )

          matrix_body = body('_aggregate_coldstart_matrix_unranked')
          matrix_body = matrix_body.replace('    methods = _coldstart_methods(config)\n', '', 1)
          matrix_body = matrix_body.replace('    configured_cells = build_cells(config)\n', '', 1)
          matrix_body = matrix_body.replace(
              '_method_spec(cell.method)', 'method_specs[cell.method]'
          )
          matrix_body = matrix_body.replace(
              '            cells_by_key=cells_by_key,\n            )',
              '            cells_by_key=cells_by_key,\n                parameter_fn=method_specs[method].parameters,\n            )',
              1,
          )
          matrix_body = matrix_body.replace(
              '_method_spec(method).matrix_aggregate_metadata(config)',
              'method_specs[method].matrix_aggregate_metadata(config)',
          )
          matrix_body = matrix_body.replace('experiment_id(config)', 'experiment_id_value')
          matrix_body = matrix_body.replace('_coldstart_method(config)', 'matrix_method')
          matrix_body = matrix_body.replace('_execution_class(config)', 'execution_class')
          matrix_body = matrix_body.replace(
              'experiment_config.task_transfer_seeds(config)', 'transfer_seed_offsets'
          )
          matrix_body = replace_protocol_call(matrix_body, assignment=False)
          matrix_body = matrix_body.replace(
              '_is_engineering_self_test(config)', 'engineering_self_test'
          )
          matrix_body = matrix_body.replace('_write_csv(', 'write_csv(')
          matrix_body = matrix_body.replace('atomic_json(', 'write_json(')
          moved.append(
              'def _aggregate_coldstart_matrix_unranked(\n'
              '    config: Mapping[str, Any],\n'
              '    output_root: Path,\n'
              '    rows: list[dict[str, Any]],\n'
              '    *,\n'
              '    methods: Sequence[str],\n'
              '    configured_cells: Sequence[CellLike],\n'
              '    method_specs: Mapping[str, MethodSpecLike],\n'
              '    experiment_id_value: str,\n'
              '    matrix_method: str,\n'
              '    execution_class: str,\n'
              '    transfer_seed_offsets: Sequence[int],\n'
              '    protocol_diagnostic: Mapping[str, Any],\n'
              '    engineering_self_test: bool,\n'
              '    write_json: Callable[[Path, Any], None],\n'
              ') -> dict[str, Any]:\n'
              + matrix_body
          )

          exp_body = body('_aggregate_coldstart')
          dispatch_prefix = (
              '    if _is_method_matrix(config):\n'
              '        return _aggregate_coldstart_matrix_unranked(config, output_root, rows)\n'
              '    if _coldstart_method(config) != METHOD_EXPONENTIAL:\n'
              '        return _aggregate_coldstart_unranked(config, output_root, rows)\n'
          )
          if dispatch_prefix not in exp_body:
              raise SystemExit('coldstart aggregate dispatch prefix drifted')
          exp_body = exp_body.replace(dispatch_prefix, '', 1)
          exp_body = exp_body.replace('build_cells(config)', 'configured_cells')
          exp_body = exp_body.replace('METHOD_POSITIVE_ONLY', 'positive_only_method')
          exp_body = exp_body.replace('METHOD_GLOBAL', 'global_method')
          exp_body = exp_body.replace('METHOD_EXPONENTIAL', 'exponential_method')
          exp_body = exp_body.replace('experiment_id(config)', 'experiment_id_value')
          exp_body = replace_protocol_call(exp_body, assignment=True)
          exp_body = exp_body.replace(
              '_is_engineering_self_test(config)', 'engineering_self_test'
          )
          exp_body = exp_body.replace('_write_csv(', 'write_csv(')
          exp_body = exp_body.replace('atomic_json(', 'write_json(')
          moved.append(
              'def _aggregate_coldstart_exponential(\n'
              '    config: Mapping[str, Any],\n'
              '    output_root: Path,\n'
              '    rows: list[dict[str, Any]],\n'
              '    *,\n'
              '    configured_cells: Sequence[CellLike],\n'
              '    experiment_id_value: str,\n'
              '    protocol_diagnostic_value: Mapping[str, Any],\n'
              '    engineering_self_test: bool,\n'
              '    positive_only_method: str,\n'
              '    global_method: str,\n'
              '    exponential_method: str,\n'
              '    write_json: Callable[[Path, Any], None],\n'
              ') -> dict[str, Any]:\n'
              + exp_body
          )

          # Expand the already-existing results module rather than creating another module.
          results_source = results_source.replace(
              'import json\n', 'import json\nimport math\n', 1
          )
          results_source = results_source.replace(
              'from collections.abc import Mapping, Sequence\n',
              'from collections.abc import Callable, Mapping, Sequence\n',
              1,
          )
          results_source = results_source.replace(
              'from typing import Any, Protocol\n',
              'from typing import Any, Protocol\n\nimport numpy as np\n',
              1,
          )
          protocol_insert = '''\n\nclass MethodSpecLike(Protocol):\n    name: str\n    scientific_kernel: str\n    parameters: Callable[[CellLike], Mapping[str, Any]]\n    single_aggregate_metadata: Callable[[Mapping[str, Any]], Mapping[str, Any]]\n    matrix_aggregate_metadata: Callable[[Mapping[str, Any]], Mapping[str, Any]]\n'''
          marker = '\n\n_RESERVED_COMMON_COLUMNS = frozenset('
          if marker not in results_source:
              raise SystemExit('results module protocol insertion marker missing')
          results_source = results_source.replace(marker, protocol_insert + marker, 1)
          for name in expected_sizes:
              if f'def {name}(' in results_source:
                  raise SystemExit(f'results module already contains moved function {name}')
          results_source = results_source.rstrip() + '\n\n\n' + '\n\n\n'.join(moved) + '\n'

          main_replacements = {
              '_coldstart_result_row': '''def _coldstart_result_row(\n    config: Mapping[str, Any],\n    cell: Cell,\n    value: Mapping[str, Any],\n    *,\n    source: str,\n) -> dict[str, Any]:\n    return e8_results._coldstart_result_row(\n        cell,\n        value,\n        source=source,\n        method_columns=_method_output_columns(cell),\n        require_late_window_metrics=not _is_engineering_self_test(config),\n    )\n''',
              '_write_coldstart_task_result': '''def _write_coldstart_task_result(\n    config: Mapping[str, Any],\n    output_root: Path,\n    task: str,\n    rows: list[dict[str, Any]],\n) -> dict[str, Any]:\n    configured_cells = build_cells(config)\n    return e8_results._write_coldstart_task_result(\n        config,\n        output_root,\n        task,\n        rows,\n        configured_cells=configured_cells,\n        method_specs={cell.method: _method_spec(cell.method) for cell in configured_cells},\n        experiment_id_value=experiment_id(config),\n        config_hash=stable_config_hash(config),\n        engineering_self_test=_is_engineering_self_test(config),\n        write_json=atomic_json,\n        sha256_fn=sha256_file,\n    )\n''',
              '_aggregate_dense': '''def _aggregate_dense(\n    config: Mapping[str, Any],\n    output_root: Path,\n    rows: list[dict[str, Any]],\n) -> dict[str, Any]:\n    return e8_results._aggregate_dense(\n        config,\n        output_root,\n        rows,\n        experiment_id_value=experiment_id(config),\n        config_hash=stable_config_hash(config),\n        task_lambdas_fn=_task_lambdas,\n        positive_only_method=METHOD_POSITIVE_ONLY,\n        exponential_method=METHOD_EXPONENTIAL,\n        write_json=atomic_json,\n    )\n''',
              '_coldstart_plot_metrics': '_coldstart_plot_metrics = e8_results._coldstart_plot_metrics\n',
              '_coldstart_group_metrics': '_coldstart_group_metrics = e8_results._coldstart_group_metrics\n',
              '_coldstart_run_provenance': '_coldstart_run_provenance = e8_results._coldstart_run_provenance\n',
              '_coldstart_method_grouped_curve': '''def _coldstart_method_grouped_curve(\n    *,\n    task: str,\n    method: str,\n    method_rows: Sequence[Mapping[str, Any]],\n    cells_by_key: Mapping[str, Cell],\n) -> list[dict[str, Any]]:\n    return e8_results._coldstart_method_grouped_curve(\n        task=task,\n        method=method,\n        method_rows=method_rows,\n        cells_by_key=cells_by_key,\n        parameter_fn=_method_spec(method).parameters,\n    )\n''',
              '_aggregate_coldstart_unranked': '''def _aggregate_coldstart_unranked(\n    config: Mapping[str, Any],\n    output_root: Path,\n    rows: list[dict[str, Any]],\n) -> dict[str, Any]:\n    method = _coldstart_method(config)\n    protocol_diagnostic = _countdown_protocol_diagnostic(\n        config,\n        output_root,\n        destination=output_root / "aggregate" / "countdown_protocol_diagnostic.json",\n    )\n    return e8_results._aggregate_coldstart_unranked(\n        config,\n        output_root,\n        rows,\n        spec=_method_spec(method),\n        configured_cells=build_cells(config),\n        experiment_id_value=experiment_id(config),\n        protocol_diagnostic=protocol_diagnostic,\n        engineering_self_test=_is_engineering_self_test(config),\n        positive_only_method=METHOD_POSITIVE_ONLY,\n        global_method=METHOD_GLOBAL,\n        write_json=atomic_json,\n    )\n''',
              '_aggregate_coldstart_matrix_unranked': '''def _aggregate_coldstart_matrix_unranked(\n    config: Mapping[str, Any],\n    output_root: Path,\n    rows: list[dict[str, Any]],\n) -> dict[str, Any]:\n    methods = _coldstart_methods(config)\n    protocol_diagnostic = _countdown_protocol_diagnostic(\n        config,\n        output_root,\n        destination=output_root / "aggregate" / "countdown_protocol_diagnostic.json",\n    )\n    return e8_results._aggregate_coldstart_matrix_unranked(\n        config,\n        output_root,\n        rows,\n        methods=methods,\n        configured_cells=build_cells(config),\n        method_specs={method: _method_spec(method) for method in methods},\n        experiment_id_value=experiment_id(config),\n        matrix_method=_coldstart_method(config),\n        execution_class=_execution_class(config),\n        transfer_seed_offsets=experiment_config.task_transfer_seeds(config),\n        protocol_diagnostic=protocol_diagnostic,\n        engineering_self_test=_is_engineering_self_test(config),\n        write_json=atomic_json,\n    )\n''',
              '_aggregate_coldstart': '''def _aggregate_coldstart(\n    config: Mapping[str, Any],\n    output_root: Path,\n    rows: list[dict[str, Any]],\n) -> dict[str, Any]:\n    if _is_method_matrix(config):\n        return _aggregate_coldstart_matrix_unranked(config, output_root, rows)\n    if _coldstart_method(config) != METHOD_EXPONENTIAL:\n        return _aggregate_coldstart_unranked(config, output_root, rows)\n    protocol_diagnostic = _countdown_protocol_diagnostic(\n        config,\n        output_root,\n        destination=output_root / "aggregate" / "countdown_protocol_diagnostic.json",\n    )\n    return e8_results._aggregate_coldstart_exponential(\n        config,\n        output_root,\n        rows,\n        configured_cells=build_cells(config),\n        experiment_id_value=experiment_id(config),\n        protocol_diagnostic_value=protocol_diagnostic,\n        engineering_self_test=_is_engineering_self_test(config),\n        positive_only_method=METHOD_POSITIVE_ONLY,\n        global_method=METHOD_GLOBAL,\n        exponential_method=METHOD_EXPONENTIAL,\n        write_json=atomic_json,\n    )\n''',
          }

          mutable_lines = main_source.splitlines(keepends=True)
          for name in sorted(main_replacements, key=lambda n: nodes[n].lineno, reverse=True):
              node = nodes[name]
              replacement = main_replacements[name].rstrip() + '\n\n'
              mutable_lines[node.lineno - 1: node.end_lineno] = [replacement]
          main_source = ''.join(mutable_lines)

          main_path.write_text(main_source, encoding='utf-8')
          results_path.write_text(results_source, encoding='utf-8')
          PY
      - name: Structural checks
        shell: bash
        run: |
          python -m py_compile src/drpo/e8_multitask_results.py src/drpo/e8_multitask_exp_tuning.py
          python - <<'PY'
          import ast
          from pathlib import Path
          main = ast.parse(Path('src/drpo/e8_multitask_exp_tuning.py').read_text())
          results = ast.parse(Path('src/drpo/e8_multitask_results.py').read_text())
          main_sizes = {
              n.name: n.end_lineno - n.lineno + 1
              for n in main.body if isinstance(n, ast.FunctionDef)
          }
          result_names = {
              n.name for n in results.body if isinstance(n, ast.FunctionDef)
          }
          required = {
              '_coldstart_result_row', '_write_coldstart_task_result', '_aggregate_dense',
              '_coldstart_plot_metrics', '_coldstart_group_metrics', '_coldstart_run_provenance',
              '_coldstart_method_grouped_curve', '_aggregate_coldstart_unranked',
              '_aggregate_coldstart_matrix_unranked', '_aggregate_coldstart_exponential',
          }
          missing = sorted(required - result_names)
          if missing:
              raise SystemExit(f'missing moved result functions: {missing}')
          for name in ('_coldstart_result_row', '_write_coldstart_task_result', '_aggregate_dense',
                       '_coldstart_method_grouped_curve', '_aggregate_coldstart_unranked',
                       '_aggregate_coldstart_matrix_unranked', '_aggregate_coldstart'):
              if main_sizes.get(name, 10_000) > 30:
                  raise SystemExit(f'{name} wrapper unexpectedly large: {main_sizes.get(name)}')
          print('main lines', len(Path('src/drpo/e8_multitask_exp_tuning.py').read_text().splitlines()))
          print('results lines', len(Path('src/drpo/e8_multitask_results.py').read_text().splitlines()))
          PY
      - name: Focused E8 tests
        run: >-
          python -m pytest -q tests/test_e8_multitask_p0.py
          -k 'not test_exp_coldstart_scheduler_refills_without_nominal_batch_barriers'
      - name: Scheduler timing probe
        run: python -m pytest -q tests/test_e8_multitask_p0.py::test_exp_coldstart_scheduler_refills_without_nominal_batch_barriers
      - name: Method integration contract
        run: bash tests/test_e8_method_integration_contract.sh
      - name: Ruff changed Python files
        run: python -m ruff check src/drpo/e8_multitask_results.py src/drpo/e8_multitask_exp_tuning.py
      - name: Commit successful split and remove temporary workflow
        shell: bash
        run: |
          git config user.name "easonhuo"
          git config user.email "huoyusen1@126.com"
          git rm .github/workflows/e8_pr359_inventory.yml
          git add src/drpo/e8_multitask_results.py src/drpo/e8_multitask_exp_tuning.py
          git commit -m "Refactor E8 result aggregation into results module"
          git push origin HEAD:dev/e8-multitask-results-split-01
