name: Temporary E8 Coldstart Atomic Finalizer

on:
  push:
    branches:
      - exec/e8-multitask-coldstart-result-closure-finalize-20260825
    paths:
      - .github/workflows/tmp-e8-coldstart-atomic-finalize.yml

permissions:
  contents: write

concurrency:
  group: tmp-e8-coldstart-atomic-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_COMMIT: e35573be30a5df53dd6201f112fb57fedabd8d15
      RESULT_SOURCE_COMMIT: e8c7109db5663dc9987f53ffd227278e95e42d21
      DELTA_SOURCE_COMMIT: 8a9e1818df8c2f6d63c80138a0d6c9a38bcaf8ed
      FINAL_BRANCH: dev/e8-multitask-coldstart-result-closure-final-20260825
      EXEC_BRANCH: exec/e8-multitask-coldstart-result-closure-finalize-20260825
      SELF_PATH: .github/workflows/tmp-e8-coldstart-atomic-finalize.yml
      DELTA_PATH: docs/handoff_deltas/EXT-C-E8-MULTITASK-EXP-COLDSTART-01-RESULT-CLOSURE-2026-08-25/HANDOFF_DELTA.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exec/e8-multitask-coldstart-result-closure-finalize-20260825
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install authority dependencies
        run: python -m pip install -q PyYAML

      - name: Verify exact inputs and current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$RESULT_SOURCE_COMMIT" "$DELTA_SOURCE_COMMIT"
          test "$(git rev-parse origin/main)" = "$BASE_COMMIT"
          git cat-file -e "$RESULT_SOURCE_COMMIT^{commit}"
          git cat-file -e "$DELTA_SOURCE_COMMIT^{commit}"
          git config user.name drpo-result-closure-bot
          git config user.email actions@users.noreply.github.com

      - name: Build one-parent source patch commit locally
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_COMMIT"
          paths=(
            docs/results/E8_MULTITASK_EXP_COLDSTART_20260820_02_RESULT_2026-08-25.md
            experiments/results/e8_multitask_exp_coldstart_20260820_02/COUNTDOWN_PROTOCOL_DIAGNOSTIC.json
            experiments/results/e8_multitask_exp_coldstart_20260820_02/CURVE_ANCHOR.csv
            experiments/results/e8_multitask_exp_coldstart_20260820_02/RESULT_CLOSURE.json
            experiments/results/e8_multitask_exp_coldstart_20260820_02/RUN_COMPLETE.json
            experiments/results/e8_multitask_exp_coldstart_20260820_02/TASK_SUMMARY.csv
            experiments/results/e8_multitask_exp_coldstart_20260820_02/TERMINAL_AUDIT.json
          )
          git checkout "$RESULT_SOURCE_COMMIT" -- "${paths[@]}"
          git checkout "$DELTA_SOURCE_COMMIT" -- "$DELTA_PATH"
          git add "${paths[@]}" "$DELTA_PATH"
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git diff --cached --check
          git commit -m 'E8 coldstart: source pilot result closure'
          echo "SOURCE_PATCH_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prepare two-parent integration merge state
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "$SOURCE_PATCH_COMMIT"
          git checkout -B e8-coldstart-atomic-integration "$BASE_COMMIT"
          git merge --no-ff --no-commit "$source_commit"
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          test "$(cat .git/MERGE_HEAD)" = "$source_commit"

      - name: Prepare trusted current-main worktree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/trusted-main"
          git worktree add --detach "$RUNNER_TEMP/trusted-main" "$BASE_COMMIT"

      - name: Trusted Stage-5 normalization in merge candidate
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/trusted-main/scripts/handoff_authority.py" validate-delta \
            --repo-root . \
            --delta "$DELTA_PATH" \
            --json
          python "$RUNNER_TEMP/trusted-main/scripts/handoff_authority.py" normalize \
            --repo-root . \
            --trusted-repo-root "$RUNNER_TEMP/trusted-main" \
            --current-before "$BASE_COMMIT" \
            --source-base "$BASE_COMMIT" \
            --source-patch-commit "$SOURCE_PATCH_COMMIT" \
            --json

      - name: Commit atomic two-parent final candidate
        shell: bash
        run: |
          set -euo pipefail
          git add docs/handoff.md docs/handoff_deltas docs/handoff_shadow/stage4/minimal/generated
          git diff --cached --check
          git commit -m 'EXT-C-E8-MULTITASK-EXP-COLDSTART-01: materialize 208-cell pilot closure'
          final_commit="$(git rev-parse HEAD)"
          parents=( $(git show -s --format='%P' HEAD) )
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$BASE_COMMIT"
          test "${parents[1]}" = "$SOURCE_PATCH_COMMIT"
          echo "FINAL_COMMIT=$final_commit" >> "$GITHUB_ENV"

      - name: Verify committed authority and compact result evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/handoff_authority.py verify --repo-root . --json
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .
          git diff --check "$BASE_COMMIT" HEAD
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only "$BASE_COMMIT" HEAD -- experiments/registry.yaml | wc -l)" -eq 0
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('experiments/results/e8_multitask_exp_coldstart_20260820_02')
          closure = json.loads((root / 'RESULT_CLOSURE.json').read_text())
          run = json.loads((root / 'RUN_COMPLETE.json').read_text())
          audit = json.loads((root / 'TERMINAL_AUDIT.json').read_text())
          rows = list(csv.DictReader((root / 'CURVE_ANCHOR.csv').open()))
          assert len(rows) == 208
          assert run['completed_cells'] == 208
          assert closure['scientific_status'] == 'pilot'
          assert audit['nan_inf_numerical_failure_count'] == 0
          assert closure['test_partition_accessed'] is False
          assert closure['run_source_commit_resolved_on_github'] is False
          print('compact closure assertions: PASS')
          PY

      - name: Publish final candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "$FINAL_COMMIT:refs/heads/$FINAL_BRANCH"

      - name: Retire temporary executor workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B executor-cleanup "origin/$EXEC_BRANCH"
          git rm "$SELF_PATH"
          git commit -m 'E8 coldstart: retire temporary atomic finalizer'
          git push origin "HEAD:$EXEC_BRANCH"
