name: tmp-e8-reciprocal-shape-128
on:
  push:
    branches:
      - dev/e8-multitask-reciprocal-shape-128-01
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reciprocal multitask capability
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          cfg_path = Path('src/drpo/e8_experiment_config.py')
          cfg = cfg_path.read_text()
          cfg = replace_once(cfg, '''COLDSTART_METHOD_DPO = "canonical_dpo"\nCOLDSTART_METHOD_BASELINE_MATRIX = "baseline_matrix"\nASYMRE_PARAMETERIZATION = "asymre_delta_v"\nTOPR_PARAMETERIZATION = "joint_fitted_reference_beta_topr"\nDPO_PARAMETERIZATION = "canonical_dpo_beta"\nBASELINE_MATRIX_PARAMETERIZATION = "baseline_family_matrix_v1"\nBASELINE_MATRIX_METHODS = (\n    COLDSTART_METHOD_ASYMRE,\n    COLDSTART_METHOD_TOPR,\n    COLDSTART_METHOD_DPO,\n)\n''', '''COLDSTART_METHOD_DPO = "canonical_dpo"\nCOLDSTART_METHOD_RECIPROCAL_LINEAR = "reciprocal_linear"\nCOLDSTART_METHOD_RECIPROCAL_QUADRATIC = "reciprocal_quadratic"\nCOLDSTART_METHOD_BASELINE_MATRIX = "baseline_matrix"\nCOLDSTART_METHOD_RECIPROCAL_MATRIX = "reciprocal_matrix"\nASYMRE_PARAMETERIZATION = "asymre_delta_v"\nTOPR_PARAMETERIZATION = "joint_fitted_reference_beta_topr"\nDPO_PARAMETERIZATION = "canonical_dpo_beta"\nRECIPROCAL_LINEAR_PARAMETERIZATION = "reciprocal_linear_lambda"\nRECIPROCAL_QUADRATIC_PARAMETERIZATION = "reciprocal_quadratic_lambda"\nBASELINE_MATRIX_PARAMETERIZATION = "baseline_family_matrix_v1"\nRECIPROCAL_MATRIX_PARAMETERIZATION = "reciprocal_shape_matrix_v1"\nBASELINE_MATRIX_METHODS = (\n    COLDSTART_METHOD_ASYMRE,\n    COLDSTART_METHOD_TOPR,\n    COLDSTART_METHOD_DPO,\n)\nRECIPROCAL_MATRIX_METHODS = (\n    COLDSTART_METHOD_RECIPROCAL_LINEAR,\n    COLDSTART_METHOD_RECIPROCAL_QUADRATIC,\n)\n_METHOD_MATRIX_SPECS = {\n    COLDSTART_METHOD_BASELINE_MATRIX: (\n        BASELINE_MATRIX_PARAMETERIZATION, BASELINE_MATRIX_METHODS\n    ),\n    COLDSTART_METHOD_RECIPROCAL_MATRIX: (\n        RECIPROCAL_MATRIX_PARAMETERIZATION, RECIPROCAL_MATRIX_METHODS\n    ),\n}\n''', 'config constants')
          cfg = replace_once(cfg, '''    COLDSTART_METHOD_ASYMRE: (\n''', '''    COLDSTART_METHOD_RECIPROCAL_LINEAR: (\n        (RECIPROCAL_LINEAR_PARAMETERIZATION,), "task_lambda",\n        "Reciprocal-linear requires reciprocal_linear_lambda parameterization",\n        "Reciprocal-linear task_lambda must contain the exact nine tasks",\n    ),\n    COLDSTART_METHOD_RECIPROCAL_QUADRATIC: (\n        (RECIPROCAL_QUADRATIC_PARAMETERIZATION,), "task_lambda",\n        "Reciprocal-quadratic requires reciprocal_quadratic_lambda parameterization",\n        "Reciprocal-quadratic task_lambda must contain the exact nine tasks",\n    ),\n    COLDSTART_METHOD_ASYMRE: (\n''', 'reciprocal sweep specs')
          cfg = replace_once(cfg, '''def coldstart_methods(config: Mapping[str, Any]) -> tuple[str, ...]:\n    method = coldstart_method(config)\n    if method != COLDSTART_METHOD_BASELINE_MATRIX:\n        return (method,)\n    methods = _mapping(config["sweep"].get("methods"), "sweep.methods")\n    configured = {str(value) for value in methods}\n    if configured != set(BASELINE_MATRIX_METHODS):\n        raise ValueError("Baseline matrix must contain exactly AsymRE, TOPR, and canonical DPO")\n    return BASELINE_MATRIX_METHODS\n\n\ndef _method_sweep(config: Mapping[str, Any], method: str) -> Mapping[str, Any]:\n    if coldstart_method(config) == COLDSTART_METHOD_BASELINE_MATRIX:\n        methods = _mapping(config["sweep"].get("methods"), "sweep.methods")\n        if method not in methods:\n            raise ValueError(f"Baseline matrix is missing method specification: {method}")\n        return _mapping(methods[method], f"sweep.methods.{method}")\n    if method != coldstart_method(config):\n        raise ValueError(f"Cold-start config does not contain method: {method}")\n    return _mapping(config.get("sweep"), "sweep")\n''', '''def coldstart_methods(config: Mapping[str, Any]) -> tuple[str, ...]:\n    method = coldstart_method(config)\n    matrix_spec = _METHOD_MATRIX_SPECS.get(method)\n    if matrix_spec is None:\n        return (method,)\n    _, expected_methods = matrix_spec\n    methods = _mapping(config["sweep"].get("methods"), "sweep.methods")\n    configured = {str(value) for value in methods}\n    if configured != set(expected_methods):\n        raise ValueError(\n            f"{method} must contain exactly {', '.join(expected_methods)}"\n        )\n    return expected_methods\n\n\ndef _method_sweep(config: Mapping[str, Any], method: str) -> Mapping[str, Any]:\n    matrix_spec = _METHOD_MATRIX_SPECS.get(coldstart_method(config))\n    if matrix_spec is not None:\n        methods = _mapping(config["sweep"].get("methods"), "sweep.methods")\n        if method not in methods:\n            raise ValueError(f"Method matrix is missing method specification: {method}")\n        return _mapping(methods[method], f"sweep.methods.{method}")\n    if method != coldstart_method(config):\n        raise ValueError(f"Cold-start config does not contain method: {method}")\n    return _mapping(config.get("sweep"), "sweep")\n''', 'matrix method helpers')
          cfg = cfg.replace('method == COLDSTART_METHOD_BASELINE_MATRIX', 'method in _METHOD_MATRIX_SPECS')
          cfg = replace_once(cfg, '''    if method in _METHOD_MATRIX_SPECS:\n        if sweep.get("parameterization") != BASELINE_MATRIX_PARAMETERIZATION:\n            raise ValueError(\n                "Baseline matrix requires baseline_family_matrix_v1 parameterization"\n            )\n        methods = coldstart_methods(config)\n''', '''    if method in _METHOD_MATRIX_SPECS:\n        expected_parameterization, _ = _METHOD_MATRIX_SPECS[method]\n        if sweep.get("parameterization") != expected_parameterization:\n            raise ValueError(\n                f"{method} requires {expected_parameterization} parameterization"\n            )\n        methods = coldstart_methods(config)\n''', 'matrix parameterization')
          cfg = replace_once(cfg, '''        dpo = _mapping(config.get("dpo"), "dpo")\n        liveness_task = str(dpo["liveness_task"])\n        liveness_beta = float(dpo["liveness_beta"])\n        liveness_values = task_method_values(\n            config, liveness_task, method=COLDSTART_METHOD_DPO\n        )\n        if not any(\n            math.isclose(liveness_beta, value, rel_tol=0.0, abs_tol=1.0e-12)\n            for value in liveness_values\n        ):\n            raise ValueError(\n                "DPO liveness_beta must be one configured beta point for dpo.liveness_task"\n            )\n''', '''        if COLDSTART_METHOD_DPO in methods:\n            dpo = _mapping(config.get("dpo"), "dpo")\n            liveness_task = str(dpo["liveness_task"])\n            liveness_beta = float(dpo["liveness_beta"])\n            liveness_values = task_method_values(\n                config, liveness_task, method=COLDSTART_METHOD_DPO\n            )\n            if not any(\n                math.isclose(liveness_beta, value, rel_tol=0.0, abs_tol=1.0e-12)\n                for value in liveness_values\n            ):\n                raise ValueError(\n                    "DPO liveness_beta must be one configured beta point for dpo.liveness_task"\n                )\n''', 'matrix DPO liveness')
          cfg = replace_once(cfg, '''    calibration = config["remoteness_calibration"]\n    if (\n        calibration.get("enabled") is not False\n        or calibration.get("mode") != "paper_linear_surprisal_no_calibration"\n        or calibration.get("coordinate") != "current_sequence_surprisal_div_2"\n        or calibration.get("detached") is not True\n        or calibration.get("extra_square") is not False\n        or calibration.get("gradient_rms_matching") is not False\n    ):\n        raise ValueError("Cold-start remoteness-calibration mode is not implemented")\n''', '''    calibration = config["remoteness_calibration"]\n    reciprocal = method in {\n        COLDSTART_METHOD_RECIPROCAL_LINEAR,\n        COLDSTART_METHOD_RECIPROCAL_QUADRATIC,\n        COLDSTART_METHOD_RECIPROCAL_MATRIX,\n    }\n    expected_mode = (\n        "paper_reciprocal_excess_remoteness_tau_0p125"\n        if reciprocal\n        else "paper_linear_surprisal_no_calibration"\n    )\n    expected_coordinate = (\n        "relu_current_sequence_surprisal_div_2_minus_0p125"\n        if reciprocal\n        else "current_sequence_surprisal_div_2"\n    )\n    if (\n        calibration.get("enabled") is not False\n        or calibration.get("mode") != expected_mode\n        or calibration.get("coordinate") != expected_coordinate\n        or calibration.get("detached") is not True\n        or calibration.get("extra_square") is not False\n        or calibration.get("gradient_rms_matching") is not False\n        or (reciprocal and float(calibration.get("tau_code", -1.0)) != 0.125)\n    ):\n        raise ValueError("Cold-start remoteness-calibration mode is not implemented")\n''', 'reciprocal remoteness contract')
          cfg = replace_once(cfg, '''    elif method in _METHOD_MATRIX_SPECS:\n        expected_kernel = "per_cell_canonical_baseline_dispatch"\n        expected_initialization = "per_method_initial_policy_and_reference_contract"\n        expected_formula = "per_cell_asymre_topr_or_dpo"\n        expected_countdown_entry = "disabled_no_baseline_matrix_countdown_cells"\n        expected_transfer_entry = "e8_multitask_exp_tuning.train_cell"\n''', '''    elif method in _METHOD_MATRIX_SPECS:\n        if method == COLDSTART_METHOD_RECIPROCAL_MATRIX:\n            expected_kernel = "per_cell_canonical_reciprocal_shape_dispatch"\n            expected_initialization = "qwen_pretrained_base_plus_fresh_lora"\n            expected_formula = "per_cell_reciprocal_linear_or_quadratic"\n            expected_countdown_entry = "disabled_reuse_historical_countdown_reciprocal_results"\n        else:\n            expected_kernel = "per_cell_canonical_baseline_dispatch"\n            expected_initialization = "per_method_initial_policy_and_reference_contract"\n            expected_formula = "per_cell_asymre_topr_or_dpo"\n            expected_countdown_entry = "disabled_no_baseline_matrix_countdown_cells"\n        expected_transfer_entry = "e8_multitask_exp_tuning.train_cell"\n''', 'matrix canonical dispatch')
          cfg = replace_once(cfg, '''        expected_formula = {\n            COLDSTART_METHOD_ASYMRE: "A_equals_R_minus_delta_v",\n            COLDSTART_METHOD_TOPR: "joint_fitted_reference_beta_ratio_taper",\n        }.get(method, "alpha_times_exp_minus_c_times_current_sequence_surprisal_div_2")\n''', '''        expected_formula = {\n            COLDSTART_METHOD_ASYMRE: "A_equals_R_minus_delta_v",\n            COLDSTART_METHOD_TOPR: "joint_fitted_reference_beta_ratio_taper",\n            COLDSTART_METHOD_RECIPROCAL_LINEAR: "reciprocal_linear_on_excess_remoteness",\n            COLDSTART_METHOD_RECIPROCAL_QUADRATIC: "reciprocal_quadratic_on_excess_remoteness",\n        }.get(method, "alpha_times_exp_minus_c_times_current_sequence_surprisal_div_2")\n''', 'single reciprocal canonical formula')
          cfg_path.write_text(cfg)

          exp_path = Path('src/drpo/e8_multitask_exp_tuning.py')
          exp = exp_path.read_text()
          exp = replace_once(exp, '''CANONICAL_TOPR_GRID = Path(\n    "configs/countdown_e8_oracle_offline_v2_joint_fitted_reference_beta_topr_dense_0p5b.yaml"\n)\nMETHOD_POSITIVE_ONLY = "positive_only"\n''', '''CANONICAL_TOPR_GRID = Path(\n    "configs/countdown_e8_oracle_offline_v2_joint_fitted_reference_beta_topr_dense_0p5b.yaml"\n)\nCANONICAL_RECIPROCAL_GRID = Path(\n    "configs/countdown_e8_oracle_offline_v2_reciprocal_shape_screen_0p5b.yaml"\n)\nMETHOD_POSITIVE_ONLY = "positive_only"\n''', 'reciprocal grid constant')
          exp = replace_once(exp, '''METHOD_DPO = experiment_config.COLDSTART_METHOD_DPO\nMETHOD_BASELINE_MATRIX = experiment_config.COLDSTART_METHOD_BASELINE_MATRIX\nMETHOD_GLOBAL = "global"\n''', '''METHOD_DPO = experiment_config.COLDSTART_METHOD_DPO\nMETHOD_RECIPROCAL_LINEAR = experiment_config.COLDSTART_METHOD_RECIPROCAL_LINEAR\nMETHOD_RECIPROCAL_QUADRATIC = experiment_config.COLDSTART_METHOD_RECIPROCAL_QUADRATIC\nMETHOD_BASELINE_MATRIX = experiment_config.COLDSTART_METHOD_BASELINE_MATRIX\nMETHOD_RECIPROCAL_MATRIX = experiment_config.COLDSTART_METHOD_RECIPROCAL_MATRIX\nMETHOD_GLOBAL = "global"\n''', 'reciprocal method constants')
          exp = replace_once(exp, '''def _asymre_key(cell: Cell) -> str:\n''', '''def _reciprocal_key(cell: Cell) -> str:\n    if cell.lambda_value is None:\n        raise AssertionError("Reciprocal cell requires lambda")\n    tag = f"{cell.lambda_value:.12g}".replace(".", "p")\n    return f"{cell.task}__{cell.method}_lambda{tag}__seed{cell.seed}"\n\n\ndef _asymre_key(cell: Cell) -> str:\n''', 'reciprocal cell key')
          exp = replace_once(exp, '''def _build_asymre_cell(\n''', '''def _build_reciprocal_cell(\n    *, task: str, method: str, seed: int, stage: str, value: float,\n    lambda_only: bool, dpo_initialization: str | None,\n) -> Cell:\n    del lambda_only, dpo_initialization\n    return Cell(task, method, None, seed, stage, value)\n\n\ndef _build_asymre_cell(\n''', 'reciprocal cell builder')
          exp = replace_once(exp, '''def _paper_params_exponential(cell: Cell) -> tuple[str, float, float]:\n''', '''def _paper_grid_paths_reciprocal(\n    config: Mapping[str, Any],\n    record: Mapping[str, Any],\n    cell: Cell,\n) -> tuple[Path, Path]:\n    del config, record, cell\n    path = _canonical_reciprocal_grid_path()\n    return path, path\n\n\ndef _paper_params_reciprocal(cell: Cell) -> tuple[str, float, float]:\n    if cell.method not in {METHOD_RECIPROCAL_LINEAR, METHOD_RECIPROCAL_QUADRATIC}:\n        raise AssertionError(f"Unsupported reciprocal family: {cell.method}")\n    if cell.lambda_value is None:\n        raise AssertionError("Reciprocal cell has no lambda")\n    return cell.method, 1.0, float(cell.lambda_value)\n\n\ndef _paper_params_exponential(cell: Cell) -> tuple[str, float, float]:\n''', 'reciprocal paper runtime helpers')
          exp = replace_once(exp, '''    _register_method_spec(\n        MethodSpec(\n            name=METHOD_ASYMRE,\n''', '''    reciprocal_formulas = {\n        METHOD_RECIPROCAL_LINEAR: (\n            "1/(1+lambda*sqrt(relu(current_sequence_surprisal/2-0.125)))"\n        ),\n        METHOD_RECIPROCAL_QUADRATIC: (\n            "1/(1+lambda*relu(current_sequence_surprisal/2-0.125))"\n        ),\n    }\n    for method, formula in reciprocal_formulas.items():\n        _register_method_spec(\n            MethodSpec(\n                name=method,\n                build_cell=_build_reciprocal_cell,\n                cell_key=_reciprocal_key,\n                parameters=lambda cell: {"lambda": _cell_lambda(cell)},\n                cell_initialization=lambda config: None,\n                initialization_identity=_default_initialization_identity,\n                train_cold=_cold_train_paper,\n                liveness_task=lambda config: "countdown",\n                liveness_runner=lambda _method=method, **kwargs: (\n                    _run_canonical_method_liveness(_method, **kwargs)\n                ),\n                scientific_kernel="canonical_old_coldstart_imports",\n                paper_runtime=PaperRuntimeSpec(\n                    liveness_grid=lambda config, record: _canonical_reciprocal_grid_path(),\n                    liveness_parameter="representative_c",\n                    grid_paths=_paper_grid_paths_reciprocal,\n                    cell_parameters=_paper_params_reciprocal,\n                    formula=formula,\n                ),\n            )\n        )\n\n    _register_method_spec(\n        MethodSpec(\n            name=METHOD_ASYMRE,\n''', 'register reciprocal specs')
          exp = replace_once(exp, '''def _is_baseline_matrix(config: Mapping[str, Any]) -> bool:\n    return _is_coldstart(config) and _coldstart_method(config) == METHOD_BASELINE_MATRIX\n\n\ndef _task_rhos''', '''def _is_baseline_matrix(config: Mapping[str, Any]) -> bool:\n    return _is_coldstart(config) and _coldstart_method(config) == METHOD_BASELINE_MATRIX\n\n\ndef _is_method_matrix(config: Mapping[str, Any]) -> bool:\n    return _is_coldstart(config) and _coldstart_method(config) in {\n        METHOD_BASELINE_MATRIX, METHOD_RECIPROCAL_MATRIX\n    }\n\n\ndef _task_rhos''', 'method matrix helper')
          exp = exp.replace('_is_baseline_matrix(config)', '_is_method_matrix(config)')
          exp = replace_once(exp, '''def _is_method_matrix(config: Mapping[str, Any]) -> bool:\n    return _is_coldstart(config) and _coldstart_method(config) in {\n        METHOD_BASELINE_MATRIX, METHOD_RECIPROCAL_MATRIX\n    }\n''', '''def _is_baseline_matrix(config: Mapping[str, Any]) -> bool:\n    return _is_coldstart(config) and _coldstart_method(config) == METHOD_BASELINE_MATRIX\n\n\ndef _is_method_matrix(config: Mapping[str, Any]) -> bool:\n    return _is_coldstart(config) and _coldstart_method(config) in {\n        METHOD_BASELINE_MATRIX, METHOD_RECIPROCAL_MATRIX\n    }\n''', 'restore baseline helper after global substitution')
          exp = replace_once(exp, '''        if seed_barrier and tuple(len(wave) for wave in waves) != (\n            16, 16, 16, 16, 16, 8,\n        ) * 2:\n''', '''        if _is_baseline_matrix(config) and seed_barrier and tuple(\n            len(wave) for wave in waves\n        ) != (16, 16, 16, 16, 16, 8) * 2:\n''', 'baseline-only wave geometry')
          exp = replace_once(exp, '''def _canonical_topr_grid_path() -> Path:\n    path = (_repo_root() / CANONICAL_TOPR_GRID).resolve()\n    if not path.is_file():\n        raise FileNotFoundError(f"Canonical TOPR grid is missing: {path}")\n    return path\n''', '''def _canonical_topr_grid_path() -> Path:\n    path = (_repo_root() / CANONICAL_TOPR_GRID).resolve()\n    if not path.is_file():\n        raise FileNotFoundError(f"Canonical TOPR grid is missing: {path}")\n    return path\n\n\ndef _canonical_reciprocal_grid_path() -> Path:\n    path = (_repo_root() / CANONICAL_RECIPROCAL_GRID).resolve()\n    if not path.is_file():\n        raise FileNotFoundError(f"Canonical reciprocal grid is missing: {path}")\n    return path\n''', 'reciprocal canonical grid path')
          exp = replace_once(exp, '''def _canonical_cold_liveness_cell(grid_path: Path) -> Cell:\n''', '''def _method_liveness_grid(\n    grid_path: Path, method: str, output_root: Path\n) -> Path:\n    if method not in {METHOD_RECIPROCAL_LINEAR, METHOD_RECIPROCAL_QUADRATIC}:\n        return grid_path\n    value = yaml.safe_load(grid_path.read_text(encoding="utf-8"))\n    if not isinstance(value, dict):\n        raise TypeError("Canonical reciprocal grid root must be a mapping")\n    value["execution"]["liveness"]["representative_family"] = method\n    path = output_root / "liveness" / f"canonical_liveness_grid_{method}.yaml"\n    path.parent.mkdir(parents=True, exist_ok=True)\n    temporary = path.with_suffix(".yaml.tmp")\n    temporary.write_text(yaml.safe_dump(value, sort_keys=False), encoding="utf-8")\n    temporary.replace(path)\n    return path\n\n\ndef _canonical_cold_liveness_cell(grid_path: Path) -> Cell:\n''', 'method-specific liveness grid')
          exp = replace_once(exp, '''    grid_path = paper_runtime.liveness_grid(config, record)\n    modules = _activate_paper_grid_modules(modules, grid_path)\n''', '''    grid_path = paper_runtime.liveness_grid(config, record)\n    grid_path = _method_liveness_grid(grid_path, method, output_root)\n    modules = _activate_paper_grid_modules(modules, grid_path)\n''', 'activate method liveness grid')
          exp_path.write_text(exp)
          PY
      - name: Validate scope and capability
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py
          python3 -m pip install --quiet numpy PyYAML ruff
          ruff check src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py
          PYTHONPATH=src python3 - <<'PY'
          import copy
          import yaml
          from drpo import e8_experiment_config as cfg
          from drpo import e8_multitask_exp_tuning as exp

          base = yaml.safe_load(open('configs/e8_multitask_baseline_matrix_formal.yaml'))
          test = copy.deepcopy(base)
          test['experiment_id'] = 'DEV-E8-MULTITASK-RECIPROCAL-SHAPE-128'
          test['execution_class'] = 'pilot'
          test['result_status'] = 'not_run'
          test['remoteness_calibration'] = {
              'enabled': False,
              'mode': 'paper_reciprocal_excess_remoteness_tau_0p125',
              'coordinate': 'relu_current_sequence_surprisal_div_2_minus_0p125',
              'tau_code': 0.125,
              'detached': True,
              'extra_square': False,
              'gradient_rms_matching': False,
          }
          tasks = list(test['suite']['tasks'])
          transfers = list(test['suite']['p0_tasks'])
          def grid(values):
              return {task: ([] if task == 'countdown' else list(values)) for task in tasks}
          prov = {task: 'design_discussion_2026_09_13' for task in transfers}
          test['sweep'] = {
              'profile': cfg.SWEEP_PROFILE_COLDSTART,
              'method': cfg.COLDSTART_METHOD_RECIPROCAL_MATRIX,
              'parameterization': cfg.RECIPROCAL_MATRIX_PARAMETERIZATION,
              'tuning_seed': 4000,
              'countdown_seed_offsets': [],
              'countdown_include_positive_only': False,
              'include_global_endpoint': False,
              'transfer_positive_only_seed_offsets': [],
              'task_transfer_seed_offsets': [4000, 5000],
              'methods': {
                  cfg.COLDSTART_METHOD_RECIPROCAL_LINEAR: {
                      'parameterization': cfg.RECIPROCAL_LINEAR_PARAMETERIZATION,
                      'task_lambda': grid([1.0, 3.0, 7.0, 19.0]),
                      'task_grid_provenance': prov,
                  },
                  cfg.COLDSTART_METHOD_RECIPROCAL_QUADRATIC: {
                      'parameterization': cfg.RECIPROCAL_QUADRATIC_PARAMETERIZATION,
                      'task_lambda': grid([1.0, 9.0, 49.0, 361.0]),
                      'task_grid_provenance': prov,
                  },
              },
              'expected_cells': 128,
          }
          test['canonical_coldstart'].update({
              'scientific_kernel': 'per_cell_canonical_reciprocal_shape_dispatch',
              'initialization': 'qwen_pretrained_base_plus_fresh_lora',
              'formula': 'per_cell_reciprocal_linear_or_quadratic',
              'countdown_entry': 'disabled_reuse_historical_countdown_reciprocal_results',
              'transfer_entry': 'e8_multitask_exp_tuning.train_cell',
          })
          test['execution']['expected_waves'] = 8
          cfg.validate_coldstart_config(test)
          cells = exp.build_cells(test)
          assert len(cells) == 128
          assert len({cell.key for cell in cells}) == 128
          assert {cell.method for cell in cells} == {
              cfg.COLDSTART_METHOD_RECIPROCAL_LINEAR,
              cfg.COLDSTART_METHOD_RECIPROCAL_QUADRATIC,
          }
          assert {cell.lambda_value for cell in cells if cell.method == cfg.COLDSTART_METHOD_RECIPROCAL_LINEAR} == {1.0,3.0,7.0,19.0}
          assert {cell.lambda_value for cell in cells if cell.method == cfg.COLDSTART_METHOD_RECIPROCAL_QUADRATIC} == {1.0,9.0,49.0,361.0}
          waves = exp.build_waves(test)
          assert len(waves) == 8 and all(len(wave) == 16 for wave in waves)
          assert exp._method_spec(cfg.COLDSTART_METHOD_RECIPROCAL_LINEAR).paper_runtime is not None
          assert exp._method_spec(cfg.COLDSTART_METHOD_RECIPROCAL_QUADRATIC).paper_runtime is not None
          print('reciprocal-128 capability: PASS')
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = $'src/drpo/e8_experiment_config.py\nsrc/drpo/e8_multitask_exp_tuning.py'
      - name: Commit only approved files and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-e8-reciprocal-shape-128.yml
          git add src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py .github/workflows/tmp-e8-reciprocal-shape-128.yml
          test "$(git diff --cached --name-only | grep -v '^.github/workflows/tmp-e8-reciprocal-shape-128.yml$' | sort)" = $'src/drpo/e8_experiment_config.py\nsrc/drpo/e8_multitask_exp_tuning.py'
