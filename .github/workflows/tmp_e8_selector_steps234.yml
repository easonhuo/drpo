name: TEMP E8 dynamic queue rollback

on:
  pull_request:
    branches:
      - exec/e8-selector-steps234-20260819

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore only work-conserving dynamic queue semantics
        shell: bash
        run: |
          set -euo pipefail
          TARGET='dev/e8-multitask-exp-coldstart-01'
          EXPECTED_HEAD='4b7c991cd8797412830cb34f76dfe35cc09eb90f'
          cp .github/tmp_e8_dynamic_queue_apply.py /tmp/tmp_e8_dynamic_queue_apply.py
          cp .github/tmp_e8_dynamic_queue_apply_v2.py /tmp/tmp_e8_dynamic_queue_apply_v2.py
          git fetch origin "$TARGET"
          ACTUAL_HEAD="$(git rev-parse "origin/$TARGET")"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          git checkout -B "$TARGET" "$EXPECTED_HEAD"
          python /tmp/tmp_e8_dynamic_queue_apply_v2.py
          mapfile -t CHANGED < <(git status --short | awk '{print $2}' | sort)
          test "${#CHANGED[@]}" -eq 3
          test "${CHANGED[0]}" = 'docs/experiments/EXT-C-E8-MULTITASK-EXP-COLDSTART-01_RUNBOOK.md'
          test "${CHANGED[1]}" = 'src/drpo/e8_multitask_exp_tuning.py'
          test "${CHANGED[2]}" = 'tests/test_e8_multitask_p0.py'
          git diff --check
          python -m py_compile src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python - <<'PY'
          from pathlib import Path
          source = Path('src/drpo/e8_multitask_exp_tuning.py').read_text(encoding='utf-8')
          block = source.split('def cmd_run_dynamic(', 1)[1].split('\ndef cmd_run_all(', 1)[0]
          assert 'pending: queue.Queue[Cell] = queue.Queue()' in block
          assert 'ThreadPoolExecutor(max_workers=slot_count)' in block
          assert '"wave_barriers": False' in block
          assert 'for wave_index, wave in enumerate(waves' not in block
          assert 'countdown_result_controls_transfer_release": False' in block
          assert 'task_results = _materialize_completed_coldstart_task_results' in block
          PY
          python -m pip install -q pytest pyyaml numpy
          PYTHONPATH=src python -m pytest -q tests/test_e8_multitask_p0.py -k 'scheduler_refills_freed_slots_and_two_slots_per_gpu or engineering_self_test_exercises_208_cell_recovery_and_dynamic_queue or coldstart_runbook_embeds_bootstrap_and_current_protocol'
          git config user.name 'drpo-e8-scheduler-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py docs/experiments/EXT-C-E8-MULTITASK-EXP-COLDSTART-01_RUNBOOK.md
          git commit -m 'E8 coldstart: restore work-conserving dynamic queue'
          git push origin "HEAD:refs/heads/$TARGET"
