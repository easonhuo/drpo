name: TEMP E8 selector YAML alignment

on:
  push:
    branches:
      - exec/e8-selector-steps234-20260819

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact approved YAML selector line
        shell: bash
        run: |
          set -euo pipefail
          TARGET='dev/e8-multitask-exp-coldstart-01'
          EXPECTED_HEAD='c33cc06eef1ae09e28efcb9c7c6985b71e373481'
          git fetch origin "$TARGET"
          ACTUAL_HEAD="$(git rev-parse "origin/$TARGET")"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          git checkout -B "$TARGET" "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          path = Path('configs/e8_multitask_exp_coldstart.yaml')
          text = path.read_text(encoding='utf-8')
          old = '    selection: coverage_first_error_class_round_robin_then_within_class_reference_rank_spread\n'
          new = '    selection: source_p0_error_class_sequence_then_within_class_reference_rank_spread\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old selector line, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short | awk '{print $2}')" = 'configs/e8_multitask_exp_coldstart.yaml'
          git diff --check
          read ADDS DELS PATH_IGNORED < <(git diff --numstat -- configs/e8_multitask_exp_coldstart.yaml)
          test "$ADDS" -eq 1
          test "$DELS" -eq 1
          git config user.name 'drpo-e8-yaml-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add configs/e8_multitask_exp_coldstart.yaml
          git commit -m 'E8 coldstart: align selector config identity'
          git push origin "HEAD:refs/heads/$TARGET"
