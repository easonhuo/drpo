name: TEMP compile KDD batch2 preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  compile-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/paper-kdd2027-batch2-preview-20260726
          fetch-depth: 0

      - name: Apply exact Batch-2 preview patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object paper/kdd2027/main.tex)" = "55866f6eb5b6f41fddcae683ff793357644009b1"
          git apply --check tmp/batch2_preview.patch
          git apply tmp/batch2_preview.patch
          test "$(git hash-object paper/kdd2027/main.tex)" = "a68cebe5e69e6cc22ccc3c1ed30aa9bd68aceda6"
          test "$(git diff --name-only | tr -d '\r')" = "paper/kdd2027/main.tex"

      - name: Compile current Batch-2 preview with TeX Live 2025
        uses: xu-cheng/texlive-action@v3
        with:
          run: |
            set -u
            cd paper/kdd2027
            set +e
            latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex > batch2_compile_stdout.txt 2>&1
            latex_status=$?
            set -e
            undefined=0
            if test -f main.log && grep -Eq 'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations' main.log; then
              undefined=1
            fi
            pages=unknown
            if test -f main.pdf; then
              mkdir -p batch2_preview_renders
              pdftoppm -png -r 120 main.pdf batch2_preview_renders/page >/dev/null 2>&1 || true
              pages="$(python - <<'PY'
            import re
            from pathlib import Path
            text = Path('main.log').read_text(encoding='utf-8', errors='replace')
            m = re.findall(r'Output written on main\.pdf \((\d+) pages?', text)
            print(m[-1] if m else 'unknown')
            PY
              )"
            fi
            {
              echo "latex_status=${latex_status}"
              echo "undefined_refs_or_citations=${undefined}"
              echo "pages=${pages}"
              echo 'input_git_blob=a68cebe5e69e6cc22ccc3c1ed30aa9bd68aceda6'
              sha256sum main.tex
              if test -f main.pdf; then sha256sum main.pdf; fi
            } > batch2_preview_audit.txt
            cat batch2_preview_audit.txt
            tail -n 80 batch2_compile_stdout.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temp-kdd-batch2-preview
          path: |
            paper/kdd2027/main.tex
            paper/kdd2027/main.pdf
            paper/kdd2027/main.log
            paper/kdd2027/batch2_compile_stdout.txt
            paper/kdd2027/batch2_preview_audit.txt
            paper/kdd2027/batch2_preview_renders/
          if-no-files-found: warn

      - name: Enforce successful preview compile
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'latex_status=0' paper/kdd2027/batch2_preview_audit.txt
          grep -Fxq 'undefined_refs_or_citations=0' paper/kdd2027/batch2_preview_audit.txt
          test -s paper/kdd2027/main.pdf
