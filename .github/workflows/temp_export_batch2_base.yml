name: TEMP compile KDD batch2 preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  compile-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/paper-kdd2027-batch2-preview-20260726
          fetch-depth: 0

      - name: Check preview state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          blob="$(git hash-object paper/kdd2027/main.tex)"
          echo "blob=${blob}" >> "$GITHUB_OUTPUT"
          if [[ "${blob}" == "a68cebe5e69e6cc22ccc3c1ed30aa9bd68aceda6" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ "${blob}" == "55866f6eb5b6f41fddcae683ff793357644009b1" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Batch-2 preview main.tex has not been uploaded yet."
          else
            echo "Unexpected main.tex blob: ${blob}" >&2
            exit 1
          fi

      - name: Compile current Batch-2 preview with TeX Live 2025
        if: steps.state.outputs.ready == 'true'
        uses: xu-cheng/texlive-action@v3
        with:
          run: |
            set -euo pipefail
            cd paper/kdd2027
            latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
            if grep -Eq 'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations' main.log; then
              echo 'Undefined references or citations detected.' >&2
              exit 1
            fi
            mkdir -p batch2_preview_renders
            pdftoppm -png -r 120 main.pdf batch2_preview_renders/page >/dev/null 2>&1
            pages="$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')"
            {
              echo 'compile=PASS'
              echo 'undefined_refs_or_citations=0'
              echo "pages=${pages}"
              echo 'input_git_blob=a68cebe5e69e6cc22ccc3c1ed30aa9bd68aceda6'
              sha256sum main.tex main.pdf
            } > batch2_preview_audit.txt
            cat batch2_preview_audit.txt

      - uses: actions/upload-artifact@v4
        if: steps.state.outputs.ready == 'true'
        with:
          name: temp-kdd-batch2-preview
          path: |
            paper/kdd2027/main.tex
            paper/kdd2027/main.pdf
            paper/kdd2027/main.log
            paper/kdd2027/batch2_preview_audit.txt
            paper/kdd2027/batch2_preview_renders/
          if-no-files-found: error
