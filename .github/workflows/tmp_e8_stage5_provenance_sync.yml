name: Temporary E8 Stage-5 provenance sync

on:
  push:
    branches: [dev/e8-multitask-baselines-capability-01]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install validation dependencies
        run: python -m pip install pyyaml pytest ruff numpy
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Materialize immutable successor delta
        env:
          MAIN_SHA: 8a21fd16e63ea96a0cde2a477353d24562624655
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          ROOT="$PWD"; BASE_HEAD="$(git rev-parse HEAD)"
          TRUSTED=/tmp/e8-trusted; SOURCE=/tmp/e8-source; STAGE=/tmp/e8-stage
          rm -rf "$TRUSTED" "$SOURCE" "$STAGE"
          git worktree add --detach "$TRUSTED" "$MAIN_SHA"
          python "$TRUSTED/scripts/handoff_authority.py" verify --repo-root "$ROOT" --json | tee /tmp/e8-predecessor-verify.json
          git worktree add --detach "$SOURCE" "$BASE_HEAD"
          SOURCE="$SOURCE" TRUSTED="$TRUSTED" BASE_HEAD="$BASE_HEAD" python - <<'PY'
          import hashlib, os, sys
          from pathlib import Path
          import yaml
          source=Path(os.environ['SOURCE']); trusted=Path(os.environ['TRUSTED']); base=os.environ['BASE_HEAD']
          sys.path.insert(0,str(trusted/'scripts')); import handoff_delta_shadow as shadow
          exp='EXT-C-E8-MULTITASK-BASELINE-MATRIX-01'; uid=exp+'-PROVENANCE-CORRECTION-2026-09-10'
          ddir=source/'docs/handoff_deltas'/uid
          if ddir.exists(): raise SystemExit('successor delta already exists')
          rp=source/'experiments/registry.yaml'; hp=source/'docs/handoff.md'
          r0=rp.read_text(encoding='utf-8'); h0=hp.read_text(encoding='utf-8')
          anchor='  registration_state: formal_protocol_registered_not_run\n  claim: >-\n'
          repl=(
            '  registration_state: formal_protocol_registered_not_run\n'
            '  implementation_state: not_implemented\n'
            '  blocking_reason: >-\n'
            '    Under GOV-FORMAL-ENTRYPOINT-01 this field refers to the canonical formal-entrypoint\n'
            '    integration, not to the already implemented and regression-validated scientific runner.\n'
            '    The current tuning module still contains a direct ZIP package subcommand, so a canonical\n'
            '    formal entrypoint that delegates artifact ownership entirely to hardened-v1 remains planned;\n'
            '    formal activation and the 176-cell scientific run remain blocked/not_run pending a separate\n'
            '    implementation and launch decision.\n'
            '  formal_execution:\n'
            '    channel_ref: hardened-v1\n'
            '    activation_state: blocked\n'
            '    entrypoint_status: planned\n'
            '    launch_mode: canonical_guard\n'
            '    artifact_owner: canonical_channel\n'
            '    guard_entrypoint: scripts/run_experiment_guard_hardened.py\n'
            '    package_entrypoint: scripts/package_experiment_hardened.py\n'
            '    verify_entrypoint: scripts/verify_experiment_package_hardened.py\n'
            '    hardened_core: scripts/artifact_protocol_hardened.py\n'
            '    artifact_protocol: docs/formal_experiment_artifact_protocol.md\n'
            '  claim: >-\n')
          prefix=r0.split('- id: C-U1-E3-ADAM-RERUN',1)[0]
          if '  formal_execution:\n' in prefix or '  implementation_state:' in prefix: raise SystemExit('formal correction already present')
          if r0.count(anchor)!=1: raise SystemExit('formal anchor mismatch')
          r1=r0.replace(anchor,repl,1)
          ta=('    temporal_event_source: scheduler/queue_events.jsonl\n'
              '    temporal_condition: max_seed_4000_successful_finish_time_le_min_seed_5000_start_time\n')
          tr=('    temporal_event_source: scheduler/queue_events.jsonl\n'
              '    queue_event_identity_source: scheduler/queue_events.jsonl\n'
              '    temporal_event_semantics: identity_and_execution_origin_only_not_seed_ordering\n'
              '    seed_batch_temporal_scientific_provenance_check: true\n'
              '    scientific_temporal_source: cells/*/cell_manifest.json::scientific_execution_provenance\n'
              '    recovery_reuse_rule: preserve_original_scientific_execution_provenance\n'
              '    temporal_condition: max_seed_4000_successful_finish_time_le_min_seed_5000_start_time\n')
          if r1.count(ta)!=1: raise SystemExit('temporal anchor mismatch')
          r1=r1.replace(ta,tr,1); rp.write_text(r1,encoding='utf-8')
          reg=yaml.safe_load(r1); ent=next(x for x in reg['experiments'] if x['id']==exp); aud=ent['terminal_audit']
          content=(
            '- **E8 multitask baseline provenance / formal-channel correction (`EXT-C-E8-MULTITASK-BASELINE-MATRIX-01`)：**'
            '本条只纠正前一登记中的执行 provenance 与 formal-channel 表述，不改变 176-cell 科学矩阵、8 个 transfer tasks、'
            'seeds `[4000,5000]`、AsymRE/TOPR/DPO 网格、1200-update horizon 或 historical Countdown PR #268 DPO 语义；'
            '科学状态继续为 **not_run**。`scheduler/queue_events.jsonl` 只承担 start/successful-finish `cell_key` 集合、重复/缺失和 '
            '`execution_origin` 身份审计，不能在 recovery/reuse 时作为 seed 先后时间的科学证据。seed 顺序的时间证据必须读取各 cell manifest '
            '持久化的原始 `scientific_execution_provenance.started_unix` 与 `scientific_execution_provenance.successful_finish_unix`；'
            'reuse 必须保留原始 provenance，并验证 `max(seed4000 successful finish time) <= min(seed5000 start time)`。另外，现有 '
            '`src/drpo/e8_multitask_exp_tuning.py` 的科学 runner 已实现并完成回归验证，但仍包含直接 ZIP package subcommand，因此在 '
            '`GOV-FORMAL-ENTRYPOINT-01` 语义下 canonical hardened-v1 formal entrypoint 仍是 **planned + blocked**，'
            '`implementation_state=not_implemented` 指的是该 formal entrypoint integration，而不是科学 runner 未实现；'
            '这不改变当前 launch simplification 规则，也不构成启动授权。')
          op={'operation_id':'append-e8-baseline-provenance-correction','op':'append_to_section',
              'heading_path':['0. 研究与执行原则（每次新会话首先阅读）','0.1 当前执行门禁'],
              'block_id':'e8-multitask-baseline-provenance-correction-2026-09-10','content':content}
          cand=shadow.render(h0,[op]).text
          evidence=['configs/e8_multitask_baseline_matrix_formal.yaml','docs/scopes/E8_MULTITASK_BASELINES_CAPABILITY_DEV.md','experiments/registry.yaml','src/drpo/e8_multitask_exp_tuning.py','tests/test_e8_multitask_p0.py']
          def ch(cid,path,to,reason): return {'change_id':cid,'kind':'update_field','entity_id':exp,'field_path':path,'from':None,'to':to,'reason':reason,'evidence':evidence}
          changes=[ch('add-e8-formal-implementation-state',['implementation_state'],ent['implementation_state'],'Register canonical formal-entrypoint integration state without changing scientific runner readiness.'),ch('add-e8-formal-blocking-reason',['blocking_reason'],ent['blocking_reason'],'Explain why hardened-v1 integration remains planned and blocked while science stays not_run.'),ch('add-e8-formal-execution-state',['formal_execution'],ent['formal_execution'],'Bind the experiment to hardened-v1 as a planned blocked entrypoint.')]
          for k in ['queue_event_identity_source','temporal_event_semantics','seed_batch_temporal_scientific_provenance_check','scientific_temporal_source','recovery_reuse_rule']:
              changes.append(ch('add-e8-'+k.replace('_','-'),['terminal_audit',k],aud[k],'Clarify recovery-safe seed-barrier provenance without changing frozen science.'))
          sha=lambda s:hashlib.sha256(s.encode()).hexdigest()
          delta={'schema_version':3,'update_id':uid,'mode':'authoritative','base':{'commit':base,'handoff_sha256':sha(h0),'registry_sha256':sha(r0)},'renderer_version':1,'operations':[op],'registry':{'mode':'expected_after','exact_base_after_sha256':sha(r1),'changes':changes},'expected':{'exact_base_candidate_sha256':sha(cand)}}
          ddir.mkdir(parents=True); (ddir/'HANDOFF_DELTA.yaml').write_text(yaml.safe_dump(delta,sort_keys=False,allow_unicode=True),encoding='utf-8')
          print('successor_delta',uid); print('base_head',base); print('candidate_handoff_sha256',sha(cand)); print('registry_after_sha256',sha(r1))
          PY
          git -C "$SOURCE" add experiments/registry.yaml docs/handoff_deltas/EXT-C-E8-MULTITASK-BASELINE-MATRIX-01-PROVENANCE-CORRECTION-2026-09-10/HANDOFF_DELTA.yaml
          git -C "$SOURCE" commit -m 'source: append E8 provenance correction delta'
          SOURCE_COMMIT="$(git -C "$SOURCE" rev-parse HEAD)"
          git worktree add --detach "$STAGE" "$SOURCE_COMMIT"
          python "$TRUSTED/scripts/handoff_authority.py" normalize --repo-root "$STAGE" --trusted-repo-root "$TRUSTED" --current-before "$BASE_HEAD" --source-base "$BASE_HEAD" --source-patch-commit "$SOURCE_COMMIT" --json | tee /tmp/e8-normalize.json
          git -C "$STAGE" add -A && git -C "$STAGE" commit --amend --no-edit
          python "$TRUSTED/scripts/handoff_authority.py" verify --repo-root "$STAGE" --json | tee /tmp/e8-stage-verify.json
          python "$TRUSTED/scripts/validate_governance_pipeline_stage_status.py" --repo-root "$STAGE"
          python "$TRUSTED/scripts/validate_formal_execution_channel.py" --repo-root "$STAGE"
          git -C "$STAGE" diff --check "$BASE_HEAD"..HEAD
          while IFS= read -r -d '' f; do
            if test -e "$STAGE/$f"; then mkdir -p "$ROOT/$(dirname "$f")"; cp "$STAGE/$f" "$ROOT/$f"; else rm -f "$ROOT/$f"; fi
          done < <(git -C "$STAGE" diff --name-only -z "$BASE_HEAD"..HEAD)
          git add -A -- ':!.github/workflows/tmp_e8_stage5_provenance_sync.yml'
          test -n "$(git diff --cached --name-only)"
          git commit -m 'docs: append E8 provenance correction authority'
          python "$TRUSTED/scripts/handoff_authority.py" verify --repo-root "$ROOT" --json | tee /tmp/e8-branch-verify.json
          python "$TRUSTED/scripts/validate_governance_pipeline_stage_status.py" --repo-root "$ROOT"
          python "$TRUSTED/scripts/validate_formal_execution_channel.py" --repo-root "$ROOT"
          git diff --check "$MAIN_SHA"..HEAD
      - name: Focused E8 regression suite
        env:
          PYTHONPATH: .:src
        run: |
          python -m pytest -q tests/test_e8_multitask_p0.py
          ruff check src/drpo/e8_experiment_config.py tests/test_e8_multitask_p0.py
          ruff check --ignore BLE001,B023 src/drpo/e8_multitask_exp_tuning.py
          python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/tmp_e8_stage5_provenance_sync.yml
          git commit -m 'chore: remove temporary E8 Stage-5 workflow'
      - name: Push closure commits
        run: git push origin HEAD:dev/e8-multitask-baselines-capability-01
