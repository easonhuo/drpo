name: E8 PR359 Final Validation

on:
  push:
    branches:
      - dev/e8-multitask-results-split-01

permissions:
  contents: write

jobs:
  validate-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-results-split-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Python compile
        run: python -m py_compile src/drpo/e8_multitask_results.py src/drpo/e8_multitask_exp_tuning.py
      - name: Focused E8 tests excluding timing-sensitive scheduler probe
        run: >-
          python -m pytest -q tests/test_e8_multitask_p0.py
          -k 'not test_exp_coldstart_scheduler_refills_without_nominal_batch_barriers'
      - name: Scheduler refill timing probe repeated
        shell: bash
        run: |
          for attempt in 1 2 3; do
            python -m pytest -q tests/test_e8_multitask_p0.py::test_exp_coldstart_scheduler_refills_without_nominal_batch_barriers
          done
      - name: Method integration contract
        run: bash tests/test_e8_method_integration_contract.sh
      - name: Handoff authority
        run: python scripts/handoff_authority.py verify --repo-root .
      - name: Governance stage validation
        run: python scripts/validate_governance_pipeline_stage_status.py --repo-root .
      - name: Ruff changed Python files
        run: python -m ruff check src/drpo/e8_multitask_results.py src/drpo/e8_multitask_exp_tuning.py
      - name: Confirm two broad-suite failures pre-exist on stacked base
        shell: bash
        run: |
          git worktree add --detach /tmp/pr359-base 717bc07ea664ef894b38e9596980c68c854c2878
          set +e
          (
            cd /tmp/pr359-base
            python -m pytest -q \
              tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells \
              tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test
          )
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Expected characterized base failures unexpectedly passed" >&2
            exit 1
          fi
          echo "Confirmed characterized failures are present on stacked base 717bc07ea664ef894b38e9596980c68c854c2878"
      - name: Broad pytest excluding characterized base failures and separately repeated timing probe
        run: >-
          python -m pytest -q
          -k 'not test_exp_coldstart_scheduler_refills_without_nominal_batch_barriers
          and not test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells
          and not test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test'
      - name: Report line counts
        run: wc -l src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_results.py src/drpo/e8_multitask_inputs.py
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          git config user.name "easonhuo"
          git config user.email "huoyusen1@126.com"
          git rm .github/workflows/e8_pr359_final_validation.yml
          git commit -m "Remove temporary PR359 validation workflow"
          git push origin HEAD:dev/e8-multitask-results-split-01
