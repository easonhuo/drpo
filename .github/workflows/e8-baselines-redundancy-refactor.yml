name: E8 baseline redundancy refactor

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-baselines-redundancy-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify reviewed branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "041a6d697a679bcc7e774514a0b2ca485f0376d0" || {
            echo "branch head advanced before redundancy refactor" >&2
            exit 1
          }
      - name: Remove mechanical duplication without changing scientific kernels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/drpo/e8_multitask_exp_tuning.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if text.count(old) != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {text.count(old)}')
              text = text.replace(old, new, 1)

          marker = '''def _is_nan_inf_numerical_failure(value: Any) -> bool:\n    return isinstance(value, str) and value.startswith("nonfinite_")\n\n\n'''
          if text.count(marker) != 1:
              raise RuntimeError('numerical-failure helper marker drifted')
          helpers = '''def _is_nan_inf_numerical_failure(value: Any) -> bool:\n    return isinstance(value, str) and value.startswith("nonfinite_")\n\n\ndef _load_verified_canonical_calibration(\n    task: str,\n    *,\n    split_manifest: Mapping[str, Any],\n    base_model_path: str,\n    config: Mapping[str, Any],\n    output_root: Path,\n    error_prefix: str,\n) -> dict[str, Any]:\n    path = output_root / "calibration" / f"{task}.json"\n    if not path.is_file():\n        raise RuntimeError(f"Run the no-calibration identity gate before {task}")\n    calibration = json.loads(path.read_text(encoding="utf-8"))\n    expected = _canonical_calibration_identity(\n        task,\n        split_manifest=split_manifest,\n        base_model_path=base_model_path,\n        config=config,\n    )\n    if (\n        calibration.get("identity_hash") != expected["identity_hash"]\n        or calibration.get("enabled") is not False\n        or not calibration.get("complete")\n    ):\n        raise RuntimeError(f"{error_prefix} no-calibration identity mismatch for {task}")\n    return calibration\n\n\ndef _prepare_cell_output(\n    output_root: Path,\n    *,\n    root_name: str,\n    cell: Cell,\n    identity: Mapping[str, Any],\n    force: bool,\n    mismatch_prefix: str,\n    existing_prefix: str,\n    unsafe_prefix: str,\n) -> tuple[Path, Path, dict[str, Any] | None]:\n    cell_root = output_root / root_name / cell.key\n    manifest_path = cell_root / "cell_manifest.json"\n    if manifest_path.is_file() and not force:\n        existing = json.loads(manifest_path.read_text(encoding="utf-8"))\n        if existing.get("identity_hash") == identity["identity_hash"] and existing.get("complete"):\n            return cell_root, manifest_path, existing\n        raise RuntimeError(f"{mismatch_prefix}: {cell.key}")\n    if cell_root.exists():\n        if not force:\n            raise RuntimeError(f"{existing_prefix}: {cell_root}")\n        expected_parent = (output_root / root_name).resolve()\n        if expected_parent not in cell_root.resolve().parents:\n            raise RuntimeError(f"{unsafe_prefix}: {cell_root}")\n        shutil.rmtree(cell_root)\n    cell_root.mkdir(parents=True, exist_ok=False)\n    return cell_root, manifest_path, None\n\n\ndef _verify_fresh_process_adapter_reload(\n    config_path: Path,\n    output_root: Path,\n    *,\n    base_model_path: str,\n    adapter_path: Path,\n    expected_adapter_identity: Mapping[str, Any],\n    require_base_identity: bool,\n    label: str,\n) -> dict[str, Any]:\n    command = [\n        sys.executable,\n        "-m",\n        "drpo.e8_multitask_exp_tuning",\n        "--config",\n        str(config_path.resolve()),\n        "--output-root",\n        str(output_root.resolve()),\n        "reload-adapter",\n        "--base-model-path",\n        base_model_path,\n        "--adapter-path",\n        str(adapter_path),\n    ]\n    completed = subprocess.run(\n        command,\n        capture_output=True,\n        text=True,\n        env=os.environ.copy(),\n        check=False,\n    )\n    descriptor = f" {label}" if label else ""\n    if completed.returncode != 0:\n        raise RuntimeError(\n            f"Fresh-process{descriptor} adapter reload failed: {completed.stderr[-2000:]}"\n        )\n    try:\n        result = json.loads(completed.stdout)\n    except json.JSONDecodeError as exc:\n        raise RuntimeError(\n            f"Fresh-process{descriptor} adapter reload returned invalid JSON"\n        ) from exc\n    identity_ok = result.get("adapter_identity") == expected_adapter_identity\n    if require_base_identity:\n        identity_ok = identity_ok and (\n            result.get("base_model_identity") == model_identity(base_model_path, None)["model"]\n        )\n    if (\n        not result.get("complete")\n        or not result.get("finite")\n        or int(result.get("process_id", os.getpid())) == os.getpid()\n        or not identity_ok\n    ):\n        raise RuntimeError(\n            f"Fresh-process{descriptor} adapter reload identity or finiteness mismatch"\n        )\n    return result\n\n\n'''
          text = text.replace(marker, helpers, 1)

          dpo_start = text.index('def _train_canonical_dpo_transfer_cell(')
          dpo_cal_start = text.index('    calibration_path = output_root / "calibration" / f"{cell.task}.json"\n', dpo_start)
          dpo_cal_end = text.index('\n\n    root_name = "liveness" if engineering_liveness else "cells"\n', dpo_cal_start)
          dpo_cal = '''    calibration = _load_verified_canonical_calibration(\n        cell.task,\n        split_manifest=split_manifest,\n        base_model_path=base_model_path,\n        config=config,\n        output_root=output_root,\n        error_prefix="DPO",\n    )'''
          text = text[:dpo_cal_start] + dpo_cal + text[dpo_cal_end:]
          replace_once(
              '''    root_name = "liveness" if engineering_liveness else "cells"\n    cell_root = output_root / root_name / cell.key\n    manifest_path = cell_root / "cell_manifest.json"\n    shared_adapter = _dpo_shared_sft_adapter(config)\n''',
              '''    root_name = "liveness" if engineering_liveness else "cells"\n    shared_adapter = _dpo_shared_sft_adapter(config)\n''',
              'DPO root preamble',
          )
          dpo_start = text.index('def _train_canonical_dpo_transfer_cell(')
          dpo_identity = text.index('    identity["identity_hash"] = stable_hash(identity)\n', dpo_start)
          life_start = dpo_identity + len('    identity["identity_hash"] = stable_hash(identity)\n')
          bank_anchor = text.index('\n    bank = Path(str(record["train"]))\n', life_start)
          dpo_lifecycle = '''    cell_root, manifest_path, reusable = _prepare_cell_output(\n        output_root,\n        root_name=root_name,\n        cell=cell,\n        identity=identity,\n        force=force,\n        mismatch_prefix="Existing DPO cell identity mismatch",\n        existing_prefix="DPO cell output exists without reusable identity",\n        unsafe_prefix="Refusing unsafe DPO cell removal",\n    )\n    if reusable is not None:\n        return reusable\n'''
          text = text[:life_start] + dpo_lifecycle + text[bank_anchor:]

          cold_start = text.index('def _train_canonical_cold_cell(')
          cold_cal_start = text.index('    calibration_path = output_root / "calibration" / f"{cell.task}.json"\n', cold_start)
          cold_cal_end = text.index('\n\n    bank = Path(str(record["train"]))\n', cold_cal_start)
          cold_cal = '''    calibration = _load_verified_canonical_calibration(\n        cell.task,\n        split_manifest=split_manifest,\n        base_model_path=base_model_path,\n        config=config,\n        output_root=output_root,\n        error_prefix="Paper",\n    )'''
          text = text[:cold_cal_start] + cold_cal + text[cold_cal_end:]
          cold_start = text.index('def _train_canonical_cold_cell(')
          cold_identity = text.index('    identity["identity_hash"] = stable_hash(identity)\n', cold_start)
          cold_life_start = cold_identity + len('    identity["identity_hash"] = stable_hash(identity)\n')
          canonical_anchor = text.index('    canonical_output = cell_root / "canonical"\n', cold_life_start)
          cold_lifecycle = '''\n    cell_root, manifest_path, reusable = _prepare_cell_output(\n        output_root,\n        root_name=root_name,\n        cell=cell,\n        identity=identity,\n        force=force,\n        mismatch_prefix="Existing paper cell identity mismatch",\n        existing_prefix="Cell output exists without a reusable manifest",\n        unsafe_prefix="Refusing unsafe paper cell removal",\n    )\n    if reusable is not None:\n        return reusable\n'''
          text = text[:cold_life_start] + cold_lifecycle + text[canonical_anchor:]

          generic_start = text.index('def _train_cell_impl(')
          generic_root_start = text.index('    root_name = "liveness" if engineering_liveness else "cells"\n', generic_start)
          generic_identity_start = text.index('    identity = _cell_identity(\n', generic_root_start)
          generic_root = '''    root_name = "liveness" if engineering_liveness else "cells"\n'''
          text = text[:generic_root_start] + generic_root + text[generic_identity_start:]
          generic_start = text.index('def _train_cell_impl(')
          generic_identity = text.index('    identity["identity_hash"] = stable_hash(identity)\n', generic_start)
          generic_life_start = generic_identity + len('    identity["identity_hash"] = stable_hash(identity)\n')
          init_anchor = text.index('\n    initialization_seed = (\n', generic_life_start)
          generic_lifecycle = '''    cell_root, manifest_path, reusable = _prepare_cell_output(\n        output_root,\n        root_name=root_name,\n        cell=cell,\n        identity=identity,\n        force=force,\n        mismatch_prefix="Existing cell identity mismatch",\n        existing_prefix="Cell output exists without reusable manifest",\n        unsafe_prefix="Refusing unsafe cell removal",\n    )\n    if reusable is not None:\n        return reusable\n'''
          text = text[:generic_life_start] + generic_lifecycle + text[init_anchor:]

          replace_once('        metric_rows: list[dict[str, Any]] = []\n', '', 'DPO dead metric_rows declaration')
          replace_once('            metric_rows.append(row)\n', '', 'DPO dead metric_rows append')
          dpo_start = text.index('def _train_canonical_dpo_transfer_cell(')
          dpo_end = text.index('\ndef _cmd_dpo_liveness(', dpo_start)
          dpo_text = text[dpo_start:dpo_end]
          old = '                        float(row["greedy_valid_rate"]) for row in read_jsonl(evaluation_path)\n'
          if dpo_text.count(old) != 1:
              raise RuntimeError('DPO best-valid reread pattern drifted')
          dpo_text = dpo_text.replace(
              old,
              '                        float(row["greedy_valid_rate"]) for row in evaluations\n',
              1,
          )
          text = text[:dpo_start] + dpo_text + text[dpo_end:]

          dpo_live_start = text.index('def _cmd_dpo_liveness(')
          dpo_live_end = text.index('\ndef _train_canonical_cold_cell(', dpo_live_start)
          dpo_live = text[dpo_live_start:dpo_live_end]
          cell_start = dpo_live.index('    cell = Cell(\n')
          cell_end = dpo_live.index('    result = train_cell(\n', cell_start)
          dpo_live = dpo_live[:cell_start] + '''    cell = _coldstart_method_cell(\n        task,\n        METHOD_DPO,\n        int(config["sweep"]["task_transfer_seed_offset"]),\n        "liveness",\n        beta,\n        lambda_only=False,\n        dpo_initialization=str(config["dpo"]["initialization_mode"]),\n    )\n''' + dpo_live[cell_end:]
          reload_start = dpo_live.index('    reload_command = [\n')
          reload_end = dpo_live.index('    if not math.isfinite(float(result.get("optimizer_update_norm", 0.0)))', reload_start)
          reload_block = '''    reload_result = _verify_fresh_process_adapter_reload(\n        config_path,\n        output_root,\n        base_model_path=base_model_path,\n        adapter_path=Path(result["terminal_adapter"]),\n        expected_adapter_identity=result["terminal_adapter_identity"],\n        require_base_identity=False,\n        label="DPO",\n    )\n'''
          dpo_live = dpo_live[:reload_start] + reload_block + dpo_live[reload_end:]
          text = text[:dpo_live_start] + dpo_live + text[dpo_live_end:]

          canonical_live_start = text.index('def _cmd_canonical_cold_liveness(')
          canonical_live_end = text.index('\ndef cmd_liveness(', canonical_live_start)
          canonical_live = text[canonical_live_start:canonical_live_end]
          reload_start = canonical_live.index('    reload_command = [\n')
          reload_end = canonical_live.index('    calibration = json.loads(\n', reload_start)
          reload_block = '''    reload_result = _verify_fresh_process_adapter_reload(\n        config_path,\n        output_root,\n        base_model_path=base_model_path,\n        adapter_path=terminal_adapter,\n        expected_adapter_identity=model_identity(base_model_path, str(terminal_adapter))["adapter"],\n        require_base_identity=False,\n        label="canonical",\n    )\n'''
          canonical_live = canonical_live[:reload_start] + reload_block + canonical_live[reload_end:]
          text = text[:canonical_live_start] + canonical_live + text[canonical_live_end:]

          live_start = text.index('def cmd_liveness(')
          live_end = text.index('\ndef _read_json_object(', live_start)
          live = text[live_start:live_end]
          reload_start = live.index('    reload_command = [\n')
          reload_end = live.index('    training_rows = read_jsonl(Path(result["training_metrics"]))\n', reload_start)
          reload_block = '''    reload_result = _verify_fresh_process_adapter_reload(\n        config_path,\n        output_root,\n        base_model_path=base_model_path,\n        adapter_path=Path(result["terminal_adapter"]),\n        expected_adapter_identity=result["terminal_adapter_identity"],\n        require_base_identity=True,\n        label="",\n    )\n'''
          live = live[:reload_start] + reload_block + live[reload_end:]
          nested_start = live.index('    def adapter_weight_file(adapter_root: Path) -> Path:\n')
          terminal_hash_anchor = live.index('    terminal_hash = sha256_file(', nested_start)
          live = live[:nested_start] + live[terminal_hash_anchor:]
          live = live.replace('adapter_weight_file(', '_adapter_weight_file(')
          text = text[:live_start] + live + text[live_end:]

          write_csv_marker = 'def _coldstart_completed_task_rows(\n'
          if text.count(write_csv_marker) != 1:
              raise RuntimeError('coldstart task-row marker drifted')
          row_helper = '''def _coldstart_result_row(\n    config: Mapping[str, Any],\n    cell: Cell,\n    value: Mapping[str, Any],\n    *,\n    source: str,\n) -> dict[str, Any]:\n    if not _is_engineering_self_test(config) and (\n        "validation_late_window_pass8_mean" not in value\n        or "validation_late_window_greedy_mean" not in value\n    ):\n        raise RuntimeError(f"{cell.key} is missing the paper primary late-window metric")\n    return {\n        "source": source,\n        "task": cell.task,\n        "method": cell.method,\n        "delta_v": cell.delta_v,\n        "beta": cell.beta,\n        "dpo_initialization": cell.dpo_initialization,\n        "rho": cell.rho,\n        "lambda": (\n            cell.lambda_value\n            if cell.lambda_value is not None\n            else (None if cell.rho is None else coefficient_from_rho(cell.rho))\n        ),\n        "seed": cell.seed,\n        "stage": cell.stage,\n        "cell_key": cell.key,\n        "nan_inf_failure": bool(value["nan_inf_failure"]),\n        "late_window_pass8_mean": value.get(\n            "validation_late_window_pass8_mean", value["validation_best_pass8"]\n        ),\n        "late_window_greedy_mean": value.get(\n            "validation_late_window_greedy_mean", value["validation_best_greedy"]\n        ),\n        "best_pass8": value["validation_best_pass8"],\n        "terminal_pass8": value["validation_terminal_pass8"],\n        "best_greedy": value["validation_best_greedy"],\n        "terminal_greedy": value["validation_terminal_greedy"],\n        "best_greedy_valid_rate": value["validation_best_greedy_valid_rate"],\n        "terminal_greedy_valid_rate": value["validation_terminal_greedy_valid_rate"],\n        "best_step": value["best_step"],\n        "terminal_step": value["terminal_step"],\n        "stop_reason": value["stop_reason"],\n    }\n\n\n'''
          text = text.replace(write_csv_marker, row_helper + write_csv_marker, 1)

          task_rows_start = text.index('def _coldstart_completed_task_rows(')
          task_rows_end = text.index('\ndef _write_coldstart_task_result(', task_rows_start)
          task_rows = text[task_rows_start:task_rows_end]
          check_start = task_rows.index('        if not _is_engineering_self_test(config) and (\n')
          append_end = task_rows.index('        )\n', task_rows.index('        rows.append(\n', check_start)) + len('        )\n')
          replacement = '''        rows.append(\n            _coldstart_result_row(config, cell, value, source="current")\n        )\n'''
          task_rows = task_rows[:check_start] + replacement + task_rows[append_end:]
          text = text[:task_rows_start] + task_rows + text[task_rows_end:]

          aggregate_start = text.index('def cmd_aggregate(')
          common_start = text.index('        common = {\n', aggregate_start)
          common_end = text.index('        rows.append(common)\n', common_start) + len('        rows.append(common)\n')
          aggregate_row_block = '''        source = "dense" if _is_dense(config) else "current"\n        if _is_coldstart(config):\n            rows.append(_coldstart_result_row(config, cell, value, source=source))\n            continue\n        common = {\n            "source": source,\n            "task": cell.task,\n            "method": cell.method,\n            "delta_v": cell.delta_v,\n            "beta": cell.beta,\n            "dpo_initialization": cell.dpo_initialization,\n            "rho": cell.rho,\n            "lambda": (\n                cell.lambda_value\n                if cell.lambda_value is not None\n                else (None if cell.rho is None else coefficient_from_rho(cell.rho))\n            ),\n            "seed": cell.seed,\n            "stage": cell.stage,\n            "cell_key": cell.key,\n            "nan_inf_failure": bool(value["nan_inf_failure"]),\n            "late_window_pass8_mean": value["validation_late_window_pass8_mean"],\n            "terminal_pass8": value["validation_terminal_pass8"],\n            "late_window_greedy_mean": value["validation_late_window_greedy_mean"],\n            "terminal_greedy": value["validation_terminal_greedy"],\n            "terminal_greedy_valid_rate": value["validation_terminal_greedy_valid_rate"],\n        }\n        rows.append(common)\n'''
          text = text[:common_start] + aggregate_row_block + text[common_end:]

          provenance_helper_marker = 'def _aggregate_coldstart_unranked(\n'
          provenance_helper = '''def _coldstart_run_provenance(output_root: Path) -> tuple[str, str]:\n    path = output_root / "source_provenance.json"\n    value = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else {}\n    return (\n        str(value.get("run_id", output_root.name)),\n        str(value.get("source_commit", "unrecorded")),\n    )\n\n\n'''
          if text.count(provenance_helper_marker) != 1:
              raise RuntimeError('unranked aggregate marker drifted')
          text = text.replace(provenance_helper_marker, provenance_helper + provenance_helper_marker, 1)
          for function_name in ('_aggregate_coldstart_unranked', '_aggregate_coldstart'):
              start = text.index(f'def {function_name}(')
              end_marker = '\ndef _aggregate_coldstart(' if function_name == '_aggregate_coldstart_unranked' else '\ndef cmd_aggregate('
              end = text.index(end_marker, start)
              block = text[start:end]
              prov_start = block.index('    provenance_path = output_root / "source_provenance.json"\n')
              run_anchor = block.index('    run_id = str(provenance.get("run_id", output_root.name))\n', prov_start)
              source_line = '    source_commit = str(provenance.get("source_commit", "unrecorded"))\n'
              prov_end = block.index(source_line, run_anchor) + len(source_line)
              block = block[:prov_start] + '    run_id, source_commit = _coldstart_run_provenance(output_root)\n' + block[prov_end:]
              text = text[:start] + block + text[end:]

          path.write_text(text, encoding='utf-8')
          PY
      - name: Install focused dependencies
        run: python -m pip install -q numpy pyyaml pytest torch ruff
      - name: Validate redundancy refactor
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check
          python - <<'PY'
          import inspect
          from drpo import e8_multitask_exp_tuning as module

          dpo = inspect.getsource(module._train_canonical_dpo_transfer_cell)
          assert '_load_verified_canonical_calibration(' in dpo
          assert '_prepare_cell_output(' in dpo
          assert 'F.softplus(-logits)' in dpo
          assert 'metric_rows' not in dpo
          cold = inspect.getsource(module._train_canonical_cold_cell)
          assert '_load_verified_canonical_calibration(' in cold
          assert '_prepare_cell_output(' in cold
          generic = inspect.getsource(module._train_cell_impl)
          assert '_prepare_cell_output(' in generic
          dpo_live = inspect.getsource(module._cmd_dpo_liveness)
          assert '_verify_fresh_process_adapter_reload(' in dpo_live
          assert 'fresh_process_reload_passed' in dpo_live
          live = inspect.getsource(module.cmd_liveness)
          assert 'def adapter_weight_file' not in live
          assert '_adapter_weight_file(' in live
          task_rows = inspect.getsource(module._coldstart_completed_task_rows)
          aggregate = inspect.getsource(module.cmd_aggregate)
          assert '_coldstart_result_row(' in task_rows
          assert '_coldstart_result_row(' in aggregate
          PY
          ruff check src/drpo/e8_multitask_exp_tuning.py --output-format concise > /tmp/ruff.txt 2>&1 || true
          cat /tmp/ruff.txt
      - name: Report net diff
        run: |
          git diff --numstat 8a21fd16e63ea96a0cde2a477353d24562624655 -- src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git diff --stat 041a6d697a679bcc7e774514a0b2ca485f0376d0 -- src/drpo/e8_multitask_exp_tuning.py
      - name: Commit validated refactor and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/e8-baselines-redundancy-refactor.yml
          git add src/drpo/e8_multitask_exp_tuning.py
          git diff --cached --check
          git commit -m 'refactor: deduplicate E8 baseline execution plumbing'
          git push origin HEAD:dev/e8-multitask-baselines-capability-01
