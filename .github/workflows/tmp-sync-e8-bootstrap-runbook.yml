name: Temporary sync E8 bootstrap into runbook

on:
  push:
    branches:
      - dev/e8-multitask-lambda-completion-clean-05

permissions:
  contents: write

jobs:
  sync-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-lambda-completion-clean-05
          fetch-depth: 0

      - name: Sync embedded bootstrap and validate E8 suite
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_PARENT=9c01995b4ad4ff00e274e43254ef073a0800e05c
          WORKFLOW=.github/workflows/tmp-sync-e8-bootstrap-runbook.yml
          git merge-base --is-ancestor "${SOURCE_PARENT}" HEAD
          test "$(git diff --name-only "${SOURCE_PARENT}" HEAD)" = "${WORKFLOW}"

          python - <<'PY'
          from pathlib import Path

          runbook_path = Path("docs/experiments/EXT-C-E8-MULTITASK-EXP-COLDSTART-01_RUNBOOK.md")
          bootstrap_path = Path("scripts/bootstrap_e8_multitask_exp_coldstart.sh")
          runbook = runbook_path.read_text(encoding="utf-8")
          bootstrap = bootstrap_path.read_text(encoding="utf-8").rstrip()
          start = "<!-- ONE_CLICK_BOOTSTRAP_START -->"
          end = "<!-- ONE_CLICK_BOOTSTRAP_END -->"
          assert runbook.count(start) == 1
          assert runbook.count(end) == 1
          prefix, rest = runbook.split(start, 1)
          _, suffix = rest.split(end, 1)
          embedded = f"{start}\n```bash\n{bootstrap}\n```\n{end}"
          runbook_path.write_text(prefix + embedded + suffix, encoding="utf-8")
          Path(".github/workflows/tmp-sync-e8-bootstrap-runbook.yml").unlink()
          PY

          test "$(git diff --name-only "${SOURCE_PARENT}" | sort)" = "docs/experiments/EXT-C-E8-MULTITASK-EXP-COLDSTART-01_RUNBOOK.md"
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh
          python -m py_compile src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python -m pip install -q pytest PyYAML numpy
          python -m pytest -q tests/test_e8_multitask_p0.py
          if python - <<'PY'
          import importlib.util
          raise SystemExit(0 if importlib.util.find_spec("torch") else 1)
          PY
          then
            python -m pytest -q tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py
          else
            echo "COUNTDOWN_TORCH_TEST_NOT_RUN: torch unavailable on GitHub runner"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: sync E8 bootstrap runbook"
          git push origin HEAD:dev/e8-multitask-lambda-completion-clean-05
