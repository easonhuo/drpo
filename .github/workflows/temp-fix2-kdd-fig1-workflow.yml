name: TEMP repair KDD Figure 1 executor namespace

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'dev/paper-kdd2027-fig1-float-placement-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/paper-kdd2027-fig1-float-placement-01
          fetch-depth: 0
      - name: Repair verifier namespace and remove repair workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/temp-apply-kdd-fig1-float-placement.yml')
          text = path.read_text(encoding='utf-8')
          old = '          namespace: dict[str, object] = {}\n'
          new = '          namespace: dict[str, object] = {"__file__": str(root / "paper/kdd2027/verify_content_lock.py")}\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected verifier namespace anchor count')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/temp-fix-kdd-fig1-workflow.yml
          rm -f .github/workflows/temp-fix2-kdd-fig1-workflow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'TEMP: repair Figure 1 executor verifier namespace'
          git push origin HEAD:dev/paper-kdd2027-fig1-float-placement-01
