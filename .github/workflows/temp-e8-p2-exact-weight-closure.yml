name: Temporary E8 P2 exact weight closure

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/temp-e8-p2-exact-weight-closure.yml

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0

      - name: Apply approved P2 exact-weight closure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runner = Path("src/drpo/e8_multitask_exp_tuning.py")
          text = runner.read_text(encoding="utf-8")
          old = '''    adapter_config_path = path / "adapter_config.json"\n    weight_name = str(contract["adapter_weight_file"])\n    weight_path = path / weight_name\n    provenance_relative = Path(str(contract["provenance_file"]))\n'''
          new = '''    adapter_config_path = path / "adapter_config.json"\n    weight_name = str(contract["adapter_weight_file"])\n    recognized_weight_names = {"adapter_model.safetensors", "adapter_model.bin"}\n    present_weight_names = {\n        name for name in recognized_weight_names if (path / name).is_file()\n    }\n    if present_weight_names != {weight_name}:\n        raise ValueError(\n            "Shared-SFT DPO adapter directory must contain exactly the contracted "\n            f"recognized weight file: expected={weight_name}, "\n            f"present={sorted(present_weight_names)}"\n        )\n    weight_path = path / weight_name\n    provenance_relative = Path(str(contract["provenance_file"]))\n'''
          if text.count(old) != 1:
              raise SystemExit(f"runner insertion anchor count={text.count(old)}")
          runner.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_e8_multitask_p0.py")
          text = tests.read_text(encoding="utf-8")
          old = '''    assert identity["adapter_parameterization"]["target_modules"] == ["q_proj", "v_proj"]\n    assert exp_tuning._dpo_shared_sft_adapter(config) == adapter.resolve()\n\n    adapter_config["target_modules"] = ["q_proj", "k_proj"]\n'''
          new = '''    assert identity["adapter_parameterization"]["target_modules"] == ["q_proj", "v_proj"]\n    assert exp_tuning._dpo_shared_sft_adapter(config) == adapter.resolve()\n\n    # PEFT loads safetensors before bin when both recognized files are present.\n    # A contract that hashes the bin file must therefore fail before model loading\n    # if safetensors is also present; otherwise verified identity can differ from\n    # the artifact actually selected by the directory loader.\n    alternate_weight_path = adapter / "adapter_model.bin"\n    alternate_weight_path.write_bytes(b"alternate-loader-weight")\n    contract["adapter_weight_file"] = "adapter_model.bin"\n    contract["adapter_weight_sha256"] = exp_tuning.sha256_file(alternate_weight_path)\n    with pytest.raises(ValueError, match="exactly the contracted recognized weight file"):\n        exp_tuning._dpo_shared_sft_adapter_identity(config)\n    alternate_weight_path.unlink()\n    contract["adapter_weight_file"] = "adapter_model.safetensors"\n    contract["adapter_weight_sha256"] = exp_tuning.sha256_file(weight_path)\n\n    adapter_config["target_modules"] = ["q_proj", "k_proj"]\n'''
          if text.count(old) != 1:
              raise SystemExit(f"test insertion anchor count={text.count(old)}")
          tests.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install lightweight validation dependencies
        run: python3 -m pip install --disable-pip-version-check -q pytest ruff PyYAML numpy

      - name: Validate
        shell: bash
        run: |
          python3 -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          PYTHONPATH=src pytest -q tests/test_e8_multitask_p0.py
          ruff check src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python3 scripts/handoff_authority.py verify --repo-root .
          python3 scripts/validate_governance_pipeline_stage_status.py --repo-root .
          git diff --check

      - name: Commit approved after-image and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-e8-p2-exact-weight-closure.yml
          git add src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git diff --cached --check
          git commit -m "fix: bind shared-SFT identity to loaded weight file"
          git push origin HEAD:dev/e8-multitask-baselines-capability-01
