name: Temporary merge lambda completion into prior E8 execution branch

on:
  push:
    branches:
      - dev/e8-multitask-exp-coldstart-01

permissions:
  contents: write

jobs:
  merge-runnable-successor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-exp-coldstart-01
          fetch-depth: 0

      - name: Import reviewed runnable successor surface
        shell: bash
        run: |
          set -euo pipefail
          TARGET_BASE=1723d0c507b2309a1a352c2459165b86b9625c9d
          SOURCE_SHA=be8d03071ade2cd7172093f6a0f6723a997ced91
          WORKFLOW=.github/workflows/tmp-merge-lambda-into-prior-exec.yml

          git merge-base --is-ancestor "${TARGET_BASE}" HEAD
          test "$(git diff --name-only "${TARGET_BASE}" HEAD)" = "${WORKFLOW}"
          git fetch --no-tags origin dev/e8-multitask-lambda-completion-clean-05
          test "$(git rev-parse FETCH_HEAD)" = "${SOURCE_SHA}"

          RUNNABLE_FILES=(
            configs/e8_multitask_exp_coldstart.yaml
            configs/e8_multitask_exp_lambda_completion.yaml
            docs/experiments/EXT-C-E8-MULTITASK-EXP-COLDSTART-01_RUNBOOK.md
            docs/experiments/E8_MULTITASK_LAMBDA_COMPLETION_PROTOCOL.md
            scripts/bootstrap_e8_multitask_exp_coldstart.sh
            scripts/run_e8_multitask_exp_coldstart.sh
            scripts/run_e8_multitask_exp_lambda_completion.sh
            src/drpo/e8_multitask_exp_tuning.py
            tests/test_e8_multitask_p0.py
          )

          # Targeted integration only: preserve prior execution-branch history and all unrelated files.
          git checkout "${SOURCE_SHA}" -- "${RUNNABLE_FILES[@]}"
          git rm "${WORKFLOW}"

          for path in "${RUNNABLE_FILES[@]}"; do
            echo "VERIFY_SOURCE_IDENTITY ${path}"
            git diff --quiet "${SOURCE_SHA}" -- "${path}"
          done

          EXPECTED=$(printf '%s\n' "${RUNNABLE_FILES[@]}" | sort)
          ACTUAL=$(git diff --name-only "${TARGET_BASE}" | sort)
          test "${ACTUAL}" = "${EXPECTED}"

          git diff --check "${TARGET_BASE}" -- \
            configs/e8_multitask_exp_coldstart.yaml \
            configs/e8_multitask_exp_lambda_completion.yaml \
            scripts/bootstrap_e8_multitask_exp_coldstart.sh \
            scripts/run_e8_multitask_exp_coldstart.sh \
            scripts/run_e8_multitask_exp_lambda_completion.sh \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh
          python -m py_compile src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python -m pip install -q pytest PyYAML numpy
          python -m pytest -q tests/test_e8_multitask_p0.py
          if python - <<'PY'
          import importlib.util
          raise SystemExit(0 if importlib.util.find_spec("torch") else 1)
          PY
          then
            python -m pytest -q tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py
          else
            echo "COUNTDOWN_TORCH_TEST_NOT_RUN: torch unavailable on GitHub runner"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "E8: merge runnable lambda completion into prior execution branch"
          git push origin HEAD:dev/e8-multitask-exp-coldstart-01
