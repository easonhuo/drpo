name: E8 wide right-tail result closure trusted normalize

on:
  push:
    branches:
      - automation/e8-wide-righttail-result-closure-normalize-20260907

permissions:
  contents: write

jobs:
  normalize-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout target source branch
        uses: actions/checkout@v4
        with:
          ref: dev/e8-wide-righttail-result-closure-20260907
          fetch-depth: 0
          path: target
          persist-credentials: true

      - name: Checkout trusted current main
        uses: actions/checkout@v4
        with:
          ref: 1be7ee757188498e42128d2710e1b30ab573bba5
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Verify locked refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "1be7ee757188498e42128d2710e1b30ab573bba5"
          test "$(git -C trusted rev-parse HEAD)" = "1be7ee757188498e42128d2710e1b30ab573bba5"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: target/pyproject.toml

      - name: Install repository test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e './target[dev]'

      - name: Deposit reviewed source closure payload
        working-directory: target
        shell: bash
        env:
          SOURCE_PAYLOAD_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_PAYLOAD_B64" | base64 -d > /tmp/e8-wide-source-patch.tar.gz
          test "$(sha256sum /tmp/e8-wide-source-patch.tar.gz | awk '{print $1}')" = "a062d556861a720f2b7fd6a615d61f693d20ca58f74bd1d09a144fa529b301a6"
          tar -xzf /tmp/e8-wide-source-patch.tar.gz -C .
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/results/E8_MULTITASK_LAMBDA_WIDE_RIGHTTAIL_03_20260904_01_RESULT_2026-09-07.md \
            docs/handoff_deltas/EXT-C-E8-MULTITASK-EXP-LAMBDA-WIDE-RIGHTTAIL-03-RESULT-CLOSURE-2026-09-07/HANDOFF_DELTA.yaml \
            experiments/results/e8_multitask_lambda_wide_righttail_03_20260904_01
          git diff --cached --check
          git commit -m 'E8 wide right-tail 03: deposit pilot result closure source'
          echo "SOURCE_PATCH_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate schema-v3 exact-base intent
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python ../trusted/scripts/handoff_authority.py validate-delta \
            --repo-root . \
            --delta docs/handoff_deltas/EXT-C-E8-MULTITASK-EXP-LAMBDA-WIDE-RIGHTTAIL-03-RESULT-CLOSURE-2026-09-07/HANDOFF_DELTA.yaml \
            --source-patch-commit "$SOURCE_PATCH_COMMIT" \
            --json

      - name: Trusted Stage-5 normalization
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python ../trusted/scripts/handoff_authority.py normalize \
            --repo-root . \
            --trusted-repo-root ../trusted \
            --current-before 1be7ee757188498e42128d2710e1b30ab573bba5 \
            --source-base 1be7ee757188498e42128d2710e1b30ab573bba5 \
            --source-patch-commit "$SOURCE_PATCH_COMMIT" \
            --json

      - name: Enforce normalization write boundary
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          import subprocess
          report = 'docs/handoff_deltas/EXT-C-E8-MULTITASK-EXP-LAMBDA-WIDE-RIGHTTAIL-03-RESULT-CLOSURE-2026-09-07/MATERIALIZATION_REPORT.json'
          allowed_exact = {'docs/handoff.md', report}
          allowed_prefix = 'docs/handoff_shadow/stage4/minimal/generated/'
          out = subprocess.check_output(['git','status','--porcelain'], text=True)
          paths=[]
          for line in out.splitlines():
              if not line.strip():
                  continue
              path=line[3:]
              if ' -> ' in path:
                  path=path.split(' -> ',1)[1]
              paths.append(path)
          bad=sorted(p for p in paths if p not in allowed_exact and not p.startswith(allowed_prefix))
          if bad:
              raise SystemExit('Unexpected normalization paths: '+', '.join(bad))
          if 'docs/handoff.md' not in paths:
              raise SystemExit('Normalizer did not materialize docs/handoff.md')
          if report not in paths:
              raise SystemExit('Normalizer did not create MATERIALIZATION_REPORT.json')
          print('\n'.join(paths))
          PY2
          git diff --check

      - name: Commit materialized after-image
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git add docs/handoff.md \
            docs/handoff_shadow/stage4/minimal/generated \
            docs/handoff_deltas/EXT-C-E8-MULTITASK-EXP-LAMBDA-WIDE-RIGHTTAIL-03-RESULT-CLOSURE-2026-09-07/MATERIALIZATION_REPORT.json
          git diff --cached --check
          git commit -m 'Materialize E8 wide right-tail 03 pilot result closure'

      - name: Required Stage-5 and governance gates
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python scripts/handoff_authority.py verify --repo-root . --json
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .
          python scripts/validate_governance_rule_inventory.py --repo-root .
          python scripts/validate_formal_execution_channel.py --repo-root .
          git diff --check 1be7ee757188498e42128d2710e1b30ab573bba5..HEAD

      - name: Canonical test selection and execution
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select_update_tests.py \
            --repo . \
            --base 1be7ee757188498e42128d2710e1b30ab573bba5 \
            --head HEAD \
            --mode auto \
            --json
          python scripts/select_update_tests.py \
            --repo . \
            --base 1be7ee757188498e42128d2710e1b30ab573bba5 \
            --head HEAD \
            --mode auto \
            --execute \
            --json

      - name: Confirm clean validated worktree
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo "VALIDATED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Push validated materialization to source branch
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/dev/e8-wide-righttail-result-closure-20260907
          echo "PUSHED_VALIDATED_HEAD=$VALIDATED_HEAD"
