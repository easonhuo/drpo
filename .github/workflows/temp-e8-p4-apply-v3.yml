name: TEMP E8 P4 apply v3

on:
  push:
    branches:
      - dev/e8-multitask-training-splits-01
    paths:
      - .github/workflows/temp-e8-p4-apply-v3.yml

permissions:
  contents: write

jobs:
  apply-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev/e8-multitask-training-splits-01
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Configure git
        run: |
          git config user.name "drpo-p4-bindings-bot"
          git config user.email "drpo-p4-bindings-bot@users.noreply.github.com"
      - name: Assert docs-first P4 scope
        run: |
          grep -F "## P4 — call-scoped self-test bindings" docs/scopes/E8_MULTITASK_TRAINING_SPLITS.md
          grep -F 'SelfTestBindings' docs/scopes/E8_MULTITASK_TRAINING_SPLITS.md
      - name: Reuse exact validated P4 transformation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source_commit = "5dddfd104c39c80592df033a2d13c66739771446"
          source_path = ".github/workflows/temp-e8-p4-apply-v2.yml"
          raw = subprocess.check_output(
              ["git", "show", f"{source_commit}:{source_path}"],
              text=True,
          )
          start = raw.index("      - name: Apply P4 call-scoped binding refactor")
          end = raw.index("      - name: Static architecture assertions", start)
          section = raw[start:end]
          marker = "          python - <<'PY'\n"
          payload_start = section.index(marker) + len(marker)
          payload_end = section.rindex("          PY\n")
          payload = section[payload_start:payload_end]
          lines = []
          for line in payload.splitlines():
              if line.startswith("          "):
                  line = line[10:]
              lines.append(line)
          script = "\n".join(lines) + "\n"
          Path("/tmp/apply_p4.py").write_text(script, encoding="utf-8")
          PY
          python /tmp/apply_p4.py
      - name: Static architecture assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/drpo/e8_multitask_selftest.py').read_text(encoding='utf-8')
          r = Path('src/drpo/e8_multitask_exp_tuning.py').read_text(encoding='utf-8')
          assert s.count('class SelfTestBindings') == 1
          assert 'def bind_host(' not in s
          assert '_BOUND_HOST' not in s
          assert 'validate_config: Any = None' not in s
          assert 'host._run_subprocess_cell = placeholder_cell_runner' in s
          assert 'finally:\n        host._run_subprocess_cell = original_runner' in s
          assert 'def _selftest_bindings()' in r
          assert 'e8_selftest.bind_host' not in r
          PY
      - name: Compile
        run: python -m compileall -q src scripts tools tests
      - name: Focused E8 regression
        run: python -m pytest -q tests/test_e8_multitask_p0.py
      - name: Method integration contract
        run: bash tests/test_e8_method_integration_contract.sh
      - name: Ruff changed surface
        run: ruff check src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_selftest.py tests/test_e8_multitask_p0.py
      - name: Governance checks
        run: |
          python scripts/handoff_authority.py verify --repo-root .
          python scripts/validate_governance_rule_inventory.py --repo-root .
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .
          git diff --check
      - name: Broad pytest excluding two proven stacked-base failures
        run: |
          python -m pytest -q \
            --deselect=tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells \
            --deselect=tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test
      - name: Re-prove excluded failures on transformed head and stacked base
        shell: bash
        run: |
          set -euo pipefail
          NODES=(
            tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells
            tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test
          )
          set +e
          python -m pytest -q "${NODES[@]}" > /tmp/p4_head_known_failures.log 2>&1
          head_rc=$?
          set -e
          cat /tmp/p4_head_known_failures.log
          test "$head_rc" -eq 1
          grep -F "0.050000000000000044" /tmp/p4_head_known_failures.log
          grep -F 'temporarily substitutes for the separately materialized `test.jsonl`' /tmp/p4_head_known_failures.log

          git worktree add --detach /tmp/drpo-p4-base 79009c487be6d64ef7f1d54b3f5dfa33808cc4c2
          set +e
          (
            cd /tmp/drpo-p4-base
            PYTHONPATH=src python -m pytest -q "${NODES[@]}"
          ) > /tmp/p4_base_known_failures.log 2>&1
          base_rc=$?
          set -e
          cat /tmp/p4_base_known_failures.log
          test "$base_rc" -eq 1
          grep -F "0.050000000000000044" /tmp/p4_base_known_failures.log
          grep -F 'temporarily substitutes for the separately materialized `test.jsonl`' /tmp/p4_base_known_failures.log
          git worktree remove --force /tmp/drpo-p4-base
      - name: Full Ruff
        run: ruff check .
      - name: Commit validated P4 source
        run: |
          git add src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_selftest.py
          git diff --cached --check
          git commit -m "refactor: make E8 self-test bindings call-scoped [skip ci]"
          git push origin HEAD:dev/e8-multitask-training-splits-01
      - name: Remove temporary workflow
        if: always()
        run: |
          git reset --hard HEAD
          git rm .github/workflows/temp-e8-p4-apply-v3.yml
          git commit -m "chore: remove temporary P4 v3 workflow [skip ci]"
          git push origin HEAD:dev/e8-multitask-training-splits-01
