name: Temporary sync Structured-9 Positive-only and Macro Avg

on:
  push:
    branches:
      - dev/manuscript-structured9-results-01

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev/manuscript-structured9-results-01

      - name: Apply exactly approved Table 2 update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('paper/overleaf/main_replacement.tex')
          text = p.read_text(encoding='utf-8')

          old = r'''\begin{table}[t]
          \centering
          \caption{Pass@8 on structured-generation tasks.}
          \label{tab:structured_generation_performance}

          \small
          \renewcommand{\arraystretch}{1.08}
          \setlength{\tabcolsep}{3.5pt}

          \begin{tabular*}{\columnwidth}{@{\extracolsep{\fill}}lcccc}
          \toprule
          Task
          &
          AsymRE
          &
          \makecell{\(\beta\)-TOPR\\(joint fitted ref.)}
          &
          DPO\(^{\ddagger}\)
          &
          \textbf{DRPO}
          \\
          \midrule

          Countdown
          & 14.38
          & 14.41
          &
          & \textbf{15.72}
          \\

          Word Sorting
          & 61.72
          & 59.61
          &
          & \textbf{63.38}
          \\

          Spiral Matrix
          & 99.92
          & \textbf{100.00}
          &
          & 99.94
          \\

          Mini Sudoku
          & \textbf{97.58}
          & 96.88
          &
          & 97.06
          \\

          Maze
          & \textbf{77.81}
          & 75.86
          &
          & 77.66
          \\

          Word Ladder
          & 12.50
          & 11.41
          &
          & \textbf{13.38}
          \\

          Knights \& Knaves
          & \textbf{70.16}
          & 68.59
          &
          & 69.53
          \\

          Graph Coloring
          & 98.91
          & 99.37
          &
          & \textbf{99.88}
          \\

          WikiSQL
          & 85.78
          & 82.89
          &
          & \textbf{86.69}
          \\

          \midrule

          \textit{Structured-9 total}
          & \textit{618.76}
          & \textit{609.02}
          &
          & \textbf{\textit{623.24}}
          \\

          \bottomrule
          \end{tabular*}

          \vspace{2pt}

          \begin{minipage}{\columnwidth}
          \small
          \textit{Note.}
          AsymRE, \(\beta\)-TOPR, and DRPO initialize their trainable LoRA adapters
          directly from the same Qwen2.5-0.5B-Instruct backbone;
          \(^{\ddagger}\)DPO uses the same parameterization but initializes its policy
          and frozen reference from the short SFT checkpoint described in
          Appendix~\ref{app:structured_generation_methods}. The TOPR arm implements
          the joint fitted-reference \(\beta\)-TOPR variant; it is not a canonical
          frozen-behavior reproduction of \citet{leroux2025tapered}. For DRPO, the reported transfer-task scores are the maximum means over
          contiguous five-point windows of the registered \(\lambda\)-response curves.
          \end{minipage}

          \end{table}'''

          new = r'''\begin{table}[t]
          \centering
          \caption{Pass@8 on structured-generation tasks.}
          \label{tab:structured_generation_performance}

          \small
          \renewcommand{\arraystretch}{1.08}
          \setlength{\tabcolsep}{2.2pt}

          \begin{tabular*}{\columnwidth}{@{\extracolsep{\fill}}lccccc}
          \toprule
          Task
          &
          \makecell{Positive-\\only}
          &
          AsymRE
          &
          \makecell{\(\beta\)-TOPR\\(joint fitted ref.)}
          &
          DPO\(^{\ddagger}\)
          &
          \textbf{DRPO}
          \\
          \midrule

          Countdown
          & 13.98
          & 14.38
          & 14.41
          &
          & \textbf{15.72}
          \\

          Word Sorting
          & 62.06
          & 61.72
          & 59.61
          &
          & \textbf{63.38}
          \\

          Spiral Matrix
          & \textbf{100.00}
          & 99.92
          & \textbf{100.00}
          &
          & 99.94
          \\

          Mini Sudoku
          & 95.91
          & \textbf{97.58}
          & 96.88
          &
          & 97.06
          \\

          Maze
          & 76.74
          & \textbf{77.81}
          & 75.86
          &
          & 77.66
          \\

          Word Ladder
          & 10.68
          & 12.50
          & 11.41
          &
          & \textbf{13.38}
          \\

          Knights \& Knaves
          & 67.53
          & \textbf{70.16}
          & 68.59
          &
          & 69.53
          \\

          Graph Coloring
          & 98.67
          & 98.91
          & 99.37
          &
          & \textbf{99.88}
          \\

          WikiSQL
          & 85.65
          & 85.78
          & 82.89
          &
          & \textbf{86.69}
          \\

          \midrule

          \textit{Macro Avg.}
          & \textit{67.91}
          & \textit{68.75}
          & \textit{67.67}
          &
          & \textbf{\textit{69.25}}
          \\

          \bottomrule
          \end{tabular*}

          \vspace{2pt}

          \begin{minipage}{\columnwidth}
          \small
          \textit{Note.}
          AsymRE, \(\beta\)-TOPR, and DRPO initialize their trainable LoRA adapters
          directly from the same Qwen2.5-0.5B-Instruct backbone;
          \(^{\ddagger}\)DPO uses the same parameterization but initializes its policy
          and frozen reference from the short SFT checkpoint described in
          Appendix~\ref{app:structured_generation_methods}. The TOPR arm implements
          the joint fitted-reference \(\beta\)-TOPR variant; it is not a canonical
          frozen-behavior reproduction of \citet{leroux2025tapered}. For DRPO, the reported transfer-task scores are the maximum means over
          contiguous five-point windows of the registered \(\lambda\)-response curves.
          Macro Avg. is the unweighted mean of the nine task-level Pass@8 percentages.
          \end{minipage}

          \end{table}'''

          n = text.count(old)
          if n != 1:
              raise SystemExit(f'Table 2 block: expected exactly one approved old block, found {n}')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY

          SOURCE_BLOB="$(git hash-object paper/overleaf/main_replacement.tex)"
          python3 - "$SOURCE_BLOB" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path('paper/iclr2027/generate_iclr.sh')
          text = p.read_text(encoding='utf-8')
          new_blob = sys.argv[1]
          updated, n = re.subn(r'EXPECTED_BLOB="[0-9a-f]{40}"', f'EXPECTED_BLOB="{new_blob}"', text, count=1)
          if n != 1:
              raise SystemExit(f'generator lock: expected exactly one lock, found {n}')
          p.write_text(updated, encoding='utf-8')
          PY

      - name: Remove temporary workflows and commit only intended repository files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/_tmp_sync_structured9_po_avg_v2.yml
          if [[ -f .github/workflows/_tmp_update_structured9_po_avg.yml ]]; then
            git rm -f .github/workflows/_tmp_update_structured9_po_avg.yml
          fi
          git add paper/overleaf/main_replacement.tex paper/iclr2027/generate_iclr.sh
          git commit -m 'Paper: add Positive-only and Macro Avg. to Structured-9 table'

      - name: Verify generated main.tex exactly matches the user-approved file
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/drpo-iclr-structured9-po-check
          bash paper/iclr2027/generate_iclr.sh /tmp/drpo-iclr-structured9-po-check
          echo 'b789b0fbce5f60b6a9beefedd224a62acd0ded2478778050bb3be66b2612e429  /tmp/drpo-iclr-structured9-po-check/main.tex' | sha256sum --check --strict
          grep -F '\makecell{Positive-\\only}' /tmp/drpo-iclr-structured9-po-check/main.tex
          grep -F '& \textbf{15.72}' /tmp/drpo-iclr-structured9-po-check/main.tex
          grep -F '\textit{Macro Avg.}' /tmp/drpo-iclr-structured9-po-check/main.tex
          grep -F '& \textit{67.91}' /tmp/drpo-iclr-structured9-po-check/main.tex
          grep -F '& \textbf{\textit{69.25}}' /tmp/drpo-iclr-structured9-po-check/main.tex
          ! grep -F 'Structured-9 total' /tmp/drpo-iclr-structured9-po-check/main.tex

      - name: Push synchronized manuscript source
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:dev/manuscript-structured9-results-01
