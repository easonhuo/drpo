name: TEMP E8 baseline final validation

on:
  pull_request:
    branches:
      - dev/e8-multitask-exp-tuning-01
    types:
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.ref == 'dev/e8-multitask-topr-asymre-tuning-01'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-topr-asymre-tuning-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate final tuning tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f959486b4b1ba1e38613d08d84aeafad30601517"
          python -m ruff check src/drpo/e8_multitask_baseline_tuning.py
          python -m ruff format --check src/drpo/e8_multitask_baseline_tuning.py
          python -m py_compile src/drpo/e8_multitask_baseline_tuning.py
          bash -n scripts/run_e8_multitask_topr_asymre_tuning.sh
          bash -n scripts/test_e8_multitask_topr_asymre_tuning.sh
          bash scripts/test_e8_multitask_topr_asymre_tuning.sh
          tmp_dir="$(mktemp -d)"
          bash scripts/run_e8_multitask_topr_asymre_tuning.sh \
            --output-root "$tmp_dir/output" plan > "$tmp_dir/plan_stdout.json"
          python - "$tmp_dir/output/plan.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          plan = json.loads(Path(sys.argv[1]).read_text())
          assert plan['cell_count'] == 80
          assert plan['wave_sizes'] == [16, 16, 16, 16, 16]
          assert sum(row['method'] == 'joint_fitted_reference_beta_topr' for row in plan['rows']) == 40
          assert sum(row['method'] == 'asymre' for row in plan['rows']) == 40
          assert all(row['task'] != 'countdown' for row in plan['rows'])
          PY
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check
