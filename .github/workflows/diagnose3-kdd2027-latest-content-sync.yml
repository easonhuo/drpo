name: Diagnose3 KDD latest-content sync

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.ref == 'dev/paper-kdd2027-latest-content-sync-01'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout, reconstruct, and normalize payload
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch "$HEAD_BRANCH" https://github.com/easonhuo/drpo.git repo
          cd repo
          cat .github/kdd-sync-payload/chunk-* | base64 --decode > /tmp/payload.tar.xz
          echo '2a3196380a7611ede4b309e94f2d4eb8aec4b0902c90fa07c51dca79b2d35900  /tmp/payload.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/payload.tar.xz -C .
          python3 - <<'PY'
          from pathlib import Path
          old_hash='6a840123406580a5f155db1da0978a06d3b9210aa248260daf964fa637b64c43'
          new_hash='67524d4d3fd614b3d084054aaab1afe9b1638d7cc97f19c8928fc0c5dccb4adb'
          for path in [Path('paper/kdd2027/source_locked.tex'), Path('paper/overleaf/main_replacement.tex')]:
              text=path.read_text()
              text=text.replace('\\usepackage{booktabs}\n','\\usepackage{booktabs}\n\\usepackage{makecell}\n',1)
              path.write_text(text)
          for path in [Path('scripts/generate_kdd2027_stage_a.py'), Path('.github/workflows/build-kdd2027-stage-a.yml')]:
              text=path.read_text()
              path.write_text(text.replace(old_hash,new_hash))
          PY
          mkdir -p diagnostics

      - name: Compile and retain all diagnostics
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2025
          os: debian
          run: |
            set -euo pipefail
            cd repo
            ROOT="$(pwd)"
            run_checked() {
              label="$1"; shift
              log="$ROOT/diagnostics/${label}.log"
              if ! "$@" >"$log" 2>&1; then
                echo "${label}=FAIL" > "$ROOT/diagnostics/result.txt"
                tail -n 50 "$log" >&2
                exit 1
              fi
              echo "${label}=PASS" >> "$ROOT/diagnostics/result.txt"
            }
            run_checked generate python3 scripts/generate_kdd2027_stage_a.py
            run_checked postprocess python3 scripts/postprocess_kdd2027_stage_a.py
            run_checked content-lock python3 paper/kdd2027/verify_content_lock.py
            cd paper/kdd2027
            latexmk -C main.tex >/dev/null 2>&1 || true
            run_checked kdd-compile latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
            cp main.log "$ROOT/diagnostics/kdd-main.log"
            cd ../overleaf
            latexmk -C main.tex >/dev/null 2>&1 || true
            run_checked overleaf-build bash build.sh
            cp main.log "$ROOT/diagnostics/overleaf-main.log"
            if grep -Eqi 'Undefined control sequence|LaTeX Error|Citation .* undefined|Reference .* undefined|There were undefined references|There were undefined citations|multiply defined|Fatal error' main.log; then
              echo 'overleaf-diagnostics=FAIL' >> "$ROOT/diagnostics/result.txt"
              grep -Ein 'Undefined control sequence|LaTeX Error|Citation .* undefined|Reference .* undefined|There were undefined references|There were undefined citations|multiply defined|Fatal error' main.log > "$ROOT/diagnostics/overleaf-errors.txt" || true
              exit 1
            fi
            echo 'overleaf-diagnostics=PASS' >> "$ROOT/diagnostics/result.txt"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kdd-content-sync-diagnostics-3
          path: repo/diagnostics
          if-no-files-found: error
