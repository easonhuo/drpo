name: Temporary apply approved Table 1+2 merge v6

on:
  push:
    branches:
      - dev/manuscript-table1-table2-merge-01
    paths:
      - .github/workflows/_tmp_apply_table_merge_v6.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev/manuscript-table1-table2-merge-01

      - name: Apply exactly approved manuscript edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'aefafc4ce4c6100b42e7eef93fd3dcc572481bf7'
          test "$(git rev-parse 'HEAD^:paper/overleaf/main_replacement.tex')" = '9fad6a78d96b9cc7a306efa7d6f06c8003427629'

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('paper/overleaf/main_replacement.tex')
          text = p.read_text(encoding='utf-8')

          def table_block_for_label(source: str, label: str) -> str:
              marker = rf'\label{{{label}}}'
              if source.count(marker) != 1:
                  raise SystemExit(f'{label}: expected exactly one label, found {source.count(marker)}')
              pos = source.index(marker)
              start = source.rfind(r'\begin{table}[t]', 0, pos)
              if start < 0:
                  raise SystemExit(f'{label}: enclosing table start not found')
              end = source.index(r'\end{table}', pos) + len(r'\end{table}')
              return source[start:end]

          d4rl = table_block_for_label(text, 'tab:d4rl_performance')
          structured = table_block_for_label(text, 'tab:structured_generation_performance')

          new_table = r'''\begin{table*}[t]
          \centering
          \caption{Normalized returns on the D4RL-9 Gym locomotion benchmark in (a)
          and Pass@8 on structured-generation tasks in (b).}
          \label{tab:external_task_performance}
          \label{tab:d4rl_performance}
          \label{tab:structured_generation_performance}
          \vspace{-2pt}

          \begin{minipage}[t]{0.465\textwidth}
          \centering
          \textbf{(a) D4RL-9 normalized return}\par\vspace{2pt}
          {\scriptsize
          \setlength{\tabcolsep}{2.05pt}
          \renewcommand{\arraystretch}{1.04}
          \begin{tabular}{@{}lrrrr@{}}
          \toprule
          Dataset & CQL$^\dagger$ & TD3+BC$^\dagger$ & IQL$^\dagger$ & \textbf{DRPO} \\
          \midrule
          halfcheetah-medium & 44.0 & \textbf{48.3} & \underline{47.4} & 47.3 \\
          hopper-medium & 58.5 & \underline{59.3} & \textbf{66.3} & 57.3 \\
          walker2d-medium & 72.5 & \underline{83.7} & 78.3 & \textbf{85.5} \\
          halfcheetah-replay & \textbf{45.5} & \underline{44.6} & 44.2 & 43.3 \\
          hopper-replay & \textbf{95.0} & 60.9 & \underline{94.7} & 87.8 \\
          walker2d-replay & 77.2 & \textbf{81.8} & 73.9 & \underline{78.1} \\
          halfcheetah-expert & \textbf{91.6} & 90.7 & 86.7 & \underline{91.1} \\
          hopper-expert & \textbf{105.4} & \underline{98.0} & 91.5 & \underline{98.0} \\
          walker2d-expert & 108.8 & \underline{110.1} & 109.6 & \textbf{110.4} \\
          \midrule
          \textit{D4RL-9 total} & \textit{\underline{698.5}} & \textit{677.4} &
          \textit{692.4} & \textbf{\textit{698.8}} \\
          \bottomrule
          \end{tabular}
          }
          \end{minipage}
          \hfill
          \begin{minipage}[t]{0.515\textwidth}
          \centering
          \textbf{(b) Structured generation Pass@8}\par\vspace{2pt}
          {\scriptsize
          \setlength{\tabcolsep}{2.1pt}
          \renewcommand{\arraystretch}{1.04}
          \begin{tabular}{@{}lrrrrr@{}}
          \toprule
          Task & PO & AsymRE & $\beta$-TOPR & DPO$^\ddagger$ & \textbf{DRPO} \\
          \midrule
          Countdown & 13.98 & 14.38 & 14.41 & & \textbf{15.72} \\
          Word Sorting & 62.06 & 61.72 & 59.61 & & \textbf{63.38} \\
          Spiral Matrix & \textbf{100.00} & 99.92 & \textbf{100.00} & & 99.94 \\
          Mini Sudoku & 95.91 & \textbf{97.58} & 96.88 & & 97.06 \\
          Maze & 76.74 & \textbf{77.81} & 75.86 & & 77.66 \\
          Word Ladder & 10.68 & 12.50 & 11.41 & & \textbf{13.38} \\
          Knights \& Knaves & 67.53 & \textbf{70.16} & 68.59 & & 69.53 \\
          Graph Coloring & 98.67 & 98.91 & 99.37 & & \textbf{99.88} \\
          WikiSQL & 85.65 & 85.78 & 82.89 & & \textbf{86.69} \\
          \midrule
          \textit{Macro Avg.} & \textit{67.91} & \textit{68.75} & \textit{67.67} &
          & \textbf{\textit{69.25}} \\
          \bottomrule
          \end{tabular}
          }
          \end{minipage}

          \vspace{3pt}
          \begin{minipage}{0.985\textwidth}
          \scriptsize
          \textit{Note.} PO = Positive-only.
          \textbf{(a)} ``replay'' and ``expert'' abbreviate ``medium-replay'' and
          ``medium-expert'', respectively. $\dagger$: published results rather than
          protocol-matched reruns. Bold/underline: best/second-best among the methods
          shown. DRPO reports the mean over 10 runs.
          \textbf{(b)} AsymRE, $\beta$-TOPR, and DRPO initialize their trainable LoRA
          adapters directly from the same Qwen2.5-0.5B-Instruct backbone;
          $^{\ddagger}$DPO uses the same parameterization but initializes its policy and
          frozen reference from the short SFT checkpoint described in
          Appendix~\ref{app:structured_generation_methods}.
          $\beta$-TOPR denotes the joint fitted-reference variant of TOPR
          \citep{leroux2025tapered}.
          For DRPO, the reported transfer-task scores are the maximum means over
          contiguous five-point windows of the registered $\lambda$-response curves.
          Macro Avg. is the unweighted mean of the nine task-level Pass@8 percentages.
          \end{minipage}
          \end{table*}'''

          old_pointer = r'''The shared objectives, baseline definitions,
          and taper functions are given in
          Appendices~\ref{app:shared_methods}
          and~\ref{app:structured_generation_methods}.'''
          new_pointer = r'''The shared objectives, baseline definitions,
          and taper functions are given in
          Appendices~\ref{app:shared_methods}
          and~\ref{app:structured_generation_methods}; the relation to canonical
          TOPR is detailed in Appendix~\ref{app:topr_relation}.'''

          if text.count(old_pointer) != 1:
              raise SystemExit(f'appendix pointer: expected one old block, found {text.count(old_pointer)}')

          text = text.replace(d4rl, '', 1)
          text = text.replace(structured, new_table, 1)
          text = text.replace(old_pointer, new_pointer, 1)

          if text.count(r'\begin{table*}[t]') < 1:
              raise SystemExit('composite table* missing')
          if text.count(r'\label{tab:d4rl_performance}') != 1:
              raise SystemExit('D4RL label count drift')
          if text.count(r'\label{tab:structured_generation_performance}') != 1:
              raise SystemExit('structured label count drift')
          if text.count('PO = Positive-only.') != 1:
              raise SystemExit('PO definition missing or duplicated')
          if text.count(r'$\beta$-TOPR denotes the joint fitted-reference variant of TOPR') != 1:
              raise SystemExit('TOPR positive definition missing or duplicated')
          if text.count(r'Appendix~\ref{app:topr_relation}.') < 2:
              raise SystemExit('TOPR appendix pointer not added')

          p.write_text(text, encoding='utf-8')
          PY

          SOURCE_BLOB="$(git hash-object paper/overleaf/main_replacement.tex)"
          python3 - "$SOURCE_BLOB" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path('paper/iclr2027/generate_iclr.sh')
          text = p.read_text(encoding='utf-8')
          old = 'EXPECTED_BLOB="9fad6a78d96b9cc7a306efa7d6f06c8003427629"'
          new = f'EXPECTED_BLOB="{sys.argv[1]}"'
          if text.count(old) != 1:
              raise SystemExit(f'generator lock: expected exactly one old lock, found {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_tmp_apply_table_merge_v6.yml
          git add paper/overleaf/main_replacement.tex paper/iclr2027/generate_iclr.sh

          EXPECTED_FILES=$'.github/workflows/_tmp_apply_table_merge_v6.yml\npaper/iclr2027/generate_iclr.sh\npaper/overleaf/main_replacement.tex'
          ACTUAL_FILES="$(git diff --cached --name-only | sort)"
          test "$ACTUAL_FILES" = "$EXPECTED_FILES"
          git diff --cached --check
          git commit -m 'Paper: merge external performance tables'

      - name: Verify generated ICLR main.tex matches approved after-image
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/drpo-iclr-table-merge-check
          bash paper/iclr2027/generate_iclr.sh /tmp/drpo-iclr-table-merge-check
          echo '6c8e7e952b55918586873d0ae75cd62b406abd299c5baf3a3974e0afea855bfb  /tmp/drpo-iclr-table-merge-check/main.tex' | sha256sum --check --strict
          grep -F '\caption{Normalized returns on the D4RL-9 Gym locomotion benchmark in (a)' /tmp/drpo-iclr-table-merge-check/main.tex
          grep -F 'Task & PO & AsymRE & $\beta$-TOPR & DPO$^\ddagger$ & \textbf{DRPO}' /tmp/drpo-iclr-table-merge-check/main.tex
          grep -F '$\beta$-TOPR denotes the joint fitted-reference variant of TOPR' /tmp/drpo-iclr-table-merge-check/main.tex
          grep -F 'TOPR is detailed in Appendix~\ref{app:topr_relation}.' /tmp/drpo-iclr-table-merge-check/main.tex
          test "$(grep -Fc '\label{tab:d4rl_performance}' /tmp/drpo-iclr-table-merge-check/main.tex)" -eq 1
          test "$(grep -Fc '\label{tab:structured_generation_performance}' /tmp/drpo-iclr-table-merge-check/main.tex)" -eq 1

      - name: Compile ICLR paper
        shell: bash
        run: |
          set -euo pipefail
          bash paper/iclr2027/build.sh

      - name: Push approved branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:dev/manuscript-table1-table2-merge-01
