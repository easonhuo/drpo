name: tmp-e8-terminal-evidence-closure
on:
  push:
    branches: [dev/e8-multitask-baselines-capability-01]
permissions:
  contents: write
jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - name: Verify reviewed base
        run: test "$(git rev-parse HEAD^)" = "54e0ec0e20e6d229e2f327ba72c45c33cf4fecea"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Document approved terminal-evidence closure first
        run: |
          cat >> docs/scopes/E8_MULTITASK_BASELINES_CAPABILITY_DEV.md <<'EOF'

## Owner-authorized terminal manifest/recovery evidence closure (2026-09-10)

The owner explicitly approved two final fail-closed terminal-evidence repairs before the formal 176-cell run. First, terminal audit may not accept a cell merely because its path/key, terminal step, and completion flags look correct: every non-engineering baseline-matrix cell manifest must carry a self-verifiable identity-hash payload, and terminal audit must independently verify the recorded `identity_hash`, top-level `experiment_id`, frozen config hash, exact configured cell descriptor, canonical method identity fields, and the nested base-cell identity hash. A stale or mixed cell manifest that does not match the currently frozen experiment/config/cell must therefore fail terminal audit.

Second, recovery/reuse must not manufacture scientific chronology by replaying an already-complete cell through a new scheduler process. The scheduler must mark each queue event as either `executed_current_run` or `reused_existing`. On the first successful scientific execution it must persist immutable `scientific_execution_provenance` in the cell manifest with the actual scheduler run id, cell/seed identity, subprocess start time, and successful finish time. Recovery/import preserves that provenance. Reused cells must retain valid prior execution provenance and must not have it overwritten by the new scheduler run. Terminal audit must use the persisted first-execution provenance—not the timestamps of a later reuse replay—to prove the seed barrier, while also checking that the current scheduler event history has the exact configured cell set and an execution-origin consistent with each manifest's provenance.

These repairs strengthen evidence validation only. They do not change the 176-cell matrix, tasks, seeds, method hyperparameters, 1,200-update horizon, evaluation protocol, model initialization, canonical AsymRE/TOPR mathematics, historical PR #268 DPO semantics, optimizer behavior, or result-status ceiling. The experiment remains **not_run** until a later formal launch from the reviewed merged commit.
EOF
          git add docs/scopes/E8_MULTITASK_BASELINES_CAPABILITY_DEV.md
          git commit -m "docs: approve E8 terminal evidence identity closure"
