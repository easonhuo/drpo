name: tmp-e8-terminal-evidence-closure
on:
  push:
    branches: [dev/e8-multitask-baselines-capability-01]
permissions:
  contents: write
jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - name: Apply function-scoped patch, validate, clean up, and push
        run: bash .github/workflows/tmp_e8_terminal_evidence_retry.sh
