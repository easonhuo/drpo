name: Temporary E8 lambda completion runner

on:
  push:
    branches:
      - dev/e8-multitask-lambda-completion-work-01

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-lambda-completion-work-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install edit dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Execute reviewed edit payload
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/tmp-e8-lambda-completion-apply.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Install package"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          payload = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          exec(compile(payload, str(path) + ':payload', 'exec'), {})
          PY
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Shell syntax
        run: bash -n scripts/run_e8_multitask_exp_coldstart.sh scripts/run_e8_multitask_exp_lambda_completion.sh
      - name: Targeted tests
        run: >-
          python -m pytest -q tests/test_e8_multitask_p0.py
          -k 'lambda_completion or lambda_only_canonical_transport_is_exactly_equivalent or exp_coldstart_matrix_is_208_cells_in_13_hard_waves'
      - name: Fatal Ruff
        run: ruff check --select E9,F63,F7,F82 src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
      - name: Commit implementation tree
        run: |
          rm .github/workflows/tmp-e8-lambda-completion-apply.yml
          rm .github/workflows/tmp-e8-lambda-completion-run.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configs/e8_multitask_exp_lambda_completion.yaml src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py scripts/run_e8_multitask_exp_coldstart.sh scripts/run_e8_multitask_exp_lambda_completion.sh .github/workflows/tmp-e8-lambda-completion-apply.yml .github/workflows/tmp-e8-lambda-completion-run.yml
          git commit -m 'E8: implement 199-cell lambda completion'
          git push origin HEAD:dev/e8-multitask-lambda-completion-work-01
