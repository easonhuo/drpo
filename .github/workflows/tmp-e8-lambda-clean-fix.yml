name: Temporary clean lambda completion fix

on:
  push:
    branches:
      - dev/e8-multitask-lambda-completion-clean-02

permissions:
  contents: write

jobs:
  rewrite-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-lambda-completion-clean-02
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reapply reviewed generic rewrite
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old = subprocess.check_output(
              ['git', 'show', '53460a82bd2646e13ae7f0ae3b9896bb1b6e31c7:.github/workflows/tmp-e8-lambda-clean-redo.yml'],
              text=True,
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Install"
          start = old.index(start_marker) + len(start_marker)
          end = old.index(end_marker, start)
          lines = old[start:end].splitlines()
          payload = "\n".join(line[10:] if line.startswith('          ') else line for line in lines) + "\n"
          exec(compile(payload, '<clean-rewrite-payload>', 'exec'), {})

          tests = Path('tests/test_e8_multitask_p0.py')
          text = tests.read_text(encoding='utf-8')
          marker = r'\n\ndef test_lambda_completion_config_drives_lambda_only_cells() -> None:\n'
          index = text.index(marker)
          repaired = bytes(text[index:], 'utf-8').decode('unicode_escape')
          tests.write_text(text[:index] + repaired, encoding='utf-8')
          PY
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Targeted tests
        run: >-
          python -m pytest -q tests/test_e8_multitask_p0.py
          -k 'lambda_completion or lambda_only_canonical_transport_is_exactly_equivalent or exp_coldstart_matrix_is_208_cells_in_13_hard_waves'
      - name: Fatal Ruff
        run: ruff check --select E9,F63,F7,F82 src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
      - name: Scientific-core identity gate
        run: |
          git diff --quiet 5260ca58ecb67509838a1e5480f6dcaafdb7a773 -- \
            src/drpo/countdown_qwen_arena_onefile.py \
            src/drpo/countdown_e8_alpha1_c_scan_common.py \
            src/drpo/countdown_e8_alpha1_c_scan_runtime.py \
            src/drpo/countdown_e8_alpha1_c_scan_trainer.py \
            src/drpo/countdown_e8_alpha1_highc_scan_common.py \
            src/drpo/countdown_e8_alpha1_highc_scan_runtime.py
      - name: Commit clean implementation
        run: |
          rm .github/workflows/tmp-e8-lambda-clean-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configs/e8_multitask_exp_lambda_completion.yaml src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py .github/workflows/tmp-e8-lambda-clean-fix.yml
          git commit -m 'E8: make lambda completion config-driven'
          git push origin HEAD:dev/e8-multitask-lambda-completion-clean-02
