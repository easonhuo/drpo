name: E8 dynamic-slot repair audit v2 push

on:
  push:
    branches:
      - dev/e8-dynamic-slot-repair-work-20260820

permissions:
  contents: write

jobs:
  generate-audit-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-dynamic-slot-repair-work-20260820
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate corrected scheduler-only candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=4b7c991cd8797412830cb34f76dfe35cc09eb90f
          if git diff --quiet "$BASE" -- \
              src/drpo/e8_multitask_exp_tuning.py \
              configs/e8_multitask_exp_coldstart.yaml \
              tests/test_e8_multitask_p0.py; then
            python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/e8-dynamic-slot-repair-run-temp.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index("          PY\n", start)
          body_lines = workflow[start:end].splitlines()
          script = "\n".join(
              line[10:] if line.startswith("          ") else line for line in body_lines
          ) + "\n"

          bad_dynamic = '''dynamic = "\\n".join(
              line[10:] if line.startswith("          ") else line
              for line in dynamic.splitlines()
          )
'''
          bad_audit = '''audit = "\\n".join(
              line[10:] if line.startswith("          ") else line
              for line in audit.splitlines()
          )
'''
          bad_scheduler = '''scheduler_test = "\\n".join(
              line[10:] if line.startswith("          ") else line
              for line in scheduler_test.splitlines()
          ).rstrip() + "\\n"
'''
          replacements = (
              ('dynamic-dedent', bad_dynamic, ''),
              ('audit-dedent', bad_audit, ''),
              ('scheduler-test-dedent', bad_scheduler, 'scheduler_test = scheduler_test.rstrip() + "\\n"\n'),
          )
          for label, old, new in replacements:
              count = script.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one stale block, found {count}')
              script = script.replace(old, new, 1)

          exec(compile(script, '<corrected-dynamic-slot-patcher>', 'exec'), {})
          PY
          else
            echo 'Candidate code already exists; audit it without regenerating.'
          fi

      - name: Install audit dependencies
        run: python -m pip install -q pytest==8.3.5 PyYAML==6.0.2 numpy==1.26.4

      - name: Compile and targeted scheduler regressions
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python -m pytest -q \
            tests/test_e8_multitask_p0.py::test_exp_coldstart_matrix_is_208_cells_in_13_nominal_batches \
            tests/test_e8_multitask_p0.py::test_exp_coldstart_rejects_adapter_runtime_or_grid_drift \
            tests/test_e8_multitask_p0.py::test_exp_coldstart_scheduler_refills_freed_slots_and_caps_two_per_gpu \
            tests/test_e8_multitask_p0.py::test_coldstart_engineering_self_test_exercises_208_cell_recovery_and_dynamic_refill \
            tests/test_e8_multitask_p0.py::test_coldstart_task_results_publish_before_global_aggregate

      - name: Full existing multitask test file
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_e8_multitask_p0.py

      - name: Prove scope and scientific config invariance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          import yaml

          BASE = '4b7c991cd8797412830cb34f76dfe35cc09eb90f'
          allowed = {
              'src/drpo/e8_multitask_exp_tuning.py',
              'configs/e8_multitask_exp_coldstart.yaml',
              'tests/test_e8_multitask_p0.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', BASE], text=True
          ).splitlines())
          code_changed = {
              p for p in changed
              if not p.startswith('.github/workflows/e8-dynamic-slot-repair-')
          }
          if code_changed != allowed:
              raise AssertionError(f'unexpected target-code change set: {sorted(code_changed)}')

          base = yaml.safe_load(subprocess.check_output(
              ['git', 'show', f'{BASE}:configs/e8_multitask_exp_coldstart.yaml'], text=True
          ))
          current = yaml.safe_load(open('configs/e8_multitask_exp_coldstart.yaml', encoding='utf-8'))
          assert base['execution']['wave_barriers'] is True
          assert current['execution']['wave_barriers'] is False
          base['execution']['wave_barriers'] = False
          assert current == base, 'coldstart YAML drifted outside execution.wave_barriers'

          source = open('src/drpo/e8_multitask_exp_tuning.py', encoding='utf-8').read()
          start = source.index('def cmd_run_dynamic(')
          end = source.index('\ndef cmd_run_all(', start)
          dynamic = source[start:end]
          assert 'pending: queue.Queue[Cell] = queue.Queue()' in dynamic
          assert 'executor.submit(worker, slot, gpu_ids[slot % len(gpu_ids)])' in dynamic
          assert '"wave_barriers": False' in dynamic
          assert '"scheduling_barrier": False' in dynamic
          assert '"countdown_result_controls_transfer_release": False' in dynamic
          assert 'for wave_index, wave in enumerate(waves, start=1):' not in dynamic
          PY
          git diff --check "$BASE"

      - name: Publish validated candidate code only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet HEAD -- \
              src/drpo/e8_multitask_exp_tuning.py \
              configs/e8_multitask_exp_coldstart.yaml \
              tests/test_e8_multitask_p0.py; then
            echo 'Candidate already committed; no publish needed.'
            exit 0
          fi
          git config user.name 'drpo-validation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
              src/drpo/e8_multitask_exp_tuning.py \
              configs/e8_multitask_exp_coldstart.yaml \
              tests/test_e8_multitask_p0.py
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' \
              configs/e8_multitask_exp_coldstart.yaml \
              src/drpo/e8_multitask_exp_tuning.py \
              tests/test_e8_multitask_p0.py | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'E8 coldstart: restore dynamic slot refill'
          git push origin HEAD:dev/e8-dynamic-slot-repair-work-20260820
