name: Temporary E8 lambda-only successor edit

on:
  push:
    branches:
      - dev/e8-multitask-lambda-only-successor-01

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-lambda-only-successor-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply minimal lambda-only transport edit
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/drpo/e8_multitask_exp_tuning.py')
          text = source.read_text(encoding='utf-8')

          old = '''        if self.rho is None:\n            raise AssertionError("Exponential cell requires rho")\n        if self.lambda_value is not None:\n            tag = f"{self.lambda_value:.12g}".replace(".", "p")\n            return f"{self.task}__exp_lambda{tag}__seed{self.seed}"\n        tag = f"{self.rho:.6f}".rstrip("0").rstrip(".").replace(".", "p")\n'''
          new = '''        if self.lambda_value is not None:\n            tag = f"{self.lambda_value:.12g}".replace(".", "p")\n            return f"{self.task}__exp_lambda{tag}__seed{self.seed}"\n        if self.rho is None:\n            raise AssertionError("Exponential cell requires rho or lambda")\n        tag = f"{self.rho:.6f}".rstrip("0").rstrip(".").replace(".", "p")\n'''
          if text.count(old) != 1:
              raise SystemExit('Cell.key transport patch target is not unique')
          text = text.replace(old, new)

          old = '''def coefficient_from_rho(rho: float) -> float:\n    if not math.isfinite(rho) or not 0.0 < rho < 1.0:\n        raise ValueError("rho must be finite and strictly between zero and one")\n    return -math.log(rho)\n\n\ndef _repo_root() -> Path:\n'''
          new = '''def coefficient_from_rho(rho: float) -> float:\n    if not math.isfinite(rho) or not 0.0 < rho < 1.0:\n        raise ValueError("rho must be finite and strictly between zero and one")\n    return -math.log(rho)\n\n\ndef _canonical_exp_coefficient(cell: Cell) -> float:\n    if cell.method in {METHOD_POSITIVE_ONLY, METHOD_GLOBAL}:\n        return 0.0\n    if cell.lambda_value is None:\n        raise AssertionError("Canonical exponential cell requires lambda")\n    return float(cell.lambda_value)\n\n\ndef _repo_root() -> Path:\n'''
          if text.count(old) != 1:
              raise SystemExit('canonical coefficient insertion target is not unique')
          text = text.replace(old, new)

          old = '''    alpha = 0.0 if cell.method == METHOD_POSITIVE_ONLY else 1.0\n    coefficient = 0.0 if cell.method in {METHOD_POSITIVE_ONLY, METHOD_GLOBAL} else float(\n        cell.lambda_value\n    )\n'''
          new = '''    alpha = 0.0 if cell.method == METHOD_POSITIVE_ONLY else 1.0\n    coefficient = _canonical_exp_coefficient(cell)\n'''
          if text.count(old) != 1:
              raise SystemExit('canonical trainer coefficient patch target is not unique')
          text = text.replace(old, new)
          source.write_text(text, encoding='utf-8')

          tests = Path('tests/test_e8_multitask_p0.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = 'def test_lambda_only_canonical_transport_is_exactly_equivalent() -> None:'
          if marker in test_text:
              raise SystemExit('lambda-only equivalence test already exists')
          test_text += r'''


@pytest.mark.skipif(torch is None, reason="Torch is unavailable in the test runtime")
def test_lambda_only_canonical_transport_is_exactly_equivalent() -> None:
    from drpo import countdown_e8_alpha1_highc_scan_common as paper_common
    from drpo import e8_multitask_exp_tuning as exp_tuning

    config = exp_tuning.load_config(Path("configs/e8_multitask_exp_coldstart.yaml"))
    lambdas = sorted(
        {
            float(value)
            for task in config["suite"]["tasks"]
            for value in config["sweep"]["task_lambda"][task]
        }
    )
    row_index = torch.tensor([0, 0, 1, 1], dtype=torch.long)
    unique_counts = torch.tensor([2, 2], dtype=torch.long)

    for lambda_value in lambdas:
        historical = exp_tuning.Cell(
            "maze",
            exp_tuning.METHOD_EXPONENTIAL,
            math.exp(-lambda_value),
            4000,
            "historical",
            lambda_value,
        )
        successor = exp_tuning.Cell(
            "maze",
            exp_tuning.METHOD_EXPONENTIAL,
            None,
            4000,
            "successor",
            lambda_value,
        )
        assert historical.key == successor.key
        historical_coefficient = exp_tuning._canonical_exp_coefficient(historical)
        successor_coefficient = exp_tuning._canonical_exp_coefficient(successor)
        assert historical_coefficient.hex() == successor_coefficient.hex()
        assert successor_coefficient.hex() == float(lambda_value).hex()

        historical_lp = torch.tensor(
            [-0.25, -1.0, -4.0, -9.0], dtype=torch.float64, requires_grad=True
        )
        successor_lp = historical_lp.detach().clone().requires_grad_(True)
        historical_weights = paper_common.continuous_exp_weights(
            historical_lp,
            alpha=1.0,
            c=historical_coefficient,
        )
        successor_weights = paper_common.continuous_exp_weights(
            successor_lp,
            alpha=1.0,
            c=successor_coefficient,
        )
        assert torch.equal(historical_weights, successor_weights)

        historical_loss = paper_common.mean_unique_negative_term(
            historical_lp,
            historical_weights,
            row_index,
            unique_counts,
        )
        successor_loss = paper_common.mean_unique_negative_term(
            successor_lp,
            successor_weights,
            row_index,
            unique_counts,
        )
        assert torch.equal(historical_loss, successor_loss)

        historical_gradient = torch.autograd.grad(historical_loss, historical_lp)[0]
        successor_gradient = torch.autograd.grad(successor_loss, successor_lp)[0]
        assert torch.equal(historical_gradient, successor_gradient)
'''
          tests.write_text(test_text, encoding='utf-8')

          workflow = Path('.github/workflows/tmp-e8-lambda-only-successor-edit.yml')
          workflow.unlink()
          PY

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Compile
        run: python -m compileall -q src tests

      - name: Targeted equivalence tests
        run: >-
          python -m pytest -q tests/test_e8_multitask_p0.py
          -k 'lambda_only_canonical_transport_is_exactly_equivalent or exp_coldstart_matrix_is_208_cells_in_13_hard_waves or exp_tuning_distance_and_rho_parameterization'

      - name: Ruff changed Python
        run: ruff check src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py

      - name: Commit tested edit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py .github/workflows/tmp-e8-lambda-only-successor-edit.yml
          git commit -m 'E8: make canonical successor transport lambda-only'
          git push origin HEAD:dev/e8-multitask-lambda-only-successor-01
