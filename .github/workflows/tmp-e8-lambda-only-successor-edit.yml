name: Temporary E8 lambda-only successor edit

on:
  push:
    branches:
      - dev/e8-multitask-lambda-only-successor-01

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-lambda-only-successor-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact reviewed patch
        run: echo '' | base64 -d | python
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Targeted equivalence tests
        run: python -m pytest -q tests/test_e8_multitask_p0.py -k 'lambda_only_canonical_transport_is_exactly_equivalent or exp_coldstart_matrix_is_208_cells_in_13_hard_waves or exp_tuning_distance_and_rho_parameterization'
      - name: Fatal Ruff checks only
        run: ruff check --select E9,F63,F7,F82 src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
      - name: Commit tested edit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py .github/workflows/tmp-e8-lambda-only-successor-edit.yml
          git commit -m 'E8: make canonical successor transport lambda-only'
          git push origin HEAD:dev/e8-multitask-lambda-only-successor-01
