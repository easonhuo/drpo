name: TEMP diagnose KDD content lock

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/paper-kdd2027-compression-batch1-01
          fetch-depth: 0
      - name: Compute current lock state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import difflib, hashlib, re
          from pathlib import Path
          root = Path('paper/kdd2027')
          source = (root/'source_locked.tex').read_text(encoding='utf-8')
          kdd = (root/'main.tex').read_text(encoding='utf-8')
          verifier = (root/'verify_content_lock.py').read_text(encoding='utf-8')
          ns = {}
          exec(verifier[:verifier.index('source = SOURCE.read_text')], ns)
          original = ns['canonical_original'](source)
          current = ns['canonical_kdd'](kdd)
          diff = ''.join(difflib.unified_diff(original.splitlines(True), current.splitlines(True), fromfile='source-canonical', tofile='kdd-canonical', n=3))
          figs = re.findall(r'\\includegraphics(?:\[[^]]*\])?\{([^{}]+)\}', kdd, flags=re.S)
          lines = [
              'source_sha256=' + hashlib.sha256(source.encode()).hexdigest(),
              'source_canonical_sha256=' + hashlib.sha256(original.encode()).hexdigest(),
              'kdd_canonical_sha256=' + hashlib.sha256(current.encode()).hexdigest(),
              'canonical_equal=' + str(original == current),
              'description_count=' + str(kdd.count('\\Description{')),
              'figures=' + repr(figs),
              'diff_lines=' + str(len(diff.splitlines())),
          ]
          Path('lock_diagnostic.txt').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          Path('content_lock.diff').write_text(diff, encoding='utf-8')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: temp-kdd-lock-diagnostic
          path: |
            lock_diagnostic.txt
            content_lock.diff
          if-no-files-found: error
