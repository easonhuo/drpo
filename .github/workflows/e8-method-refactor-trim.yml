name: Final E8 method refactor trim

on:
  push:
    branches:
      - dev/e8-method-integration-cost-refactor-01

permissions:
  contents: write

jobs:
  trim-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-method-integration-cost-refactor-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Merge current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Fix transport guard and apply final redundancy trim
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/e8_method_refactor_trim.sh')
          text = path.read_text(encoding='utf-8')
          old = '''for forbidden in (\n    "compatibility_columns",\n    "canonical_liveness_grid",\n    "canonical_liveness_parameter",\n    "paper_grid_paths",\n    "paper_cell_parameters",\n    "paper_formula",\n    "audit_failure_bucket",\n    "MethodResultProjection",\n    "ResultRecord",\n):'''
          new = '''for forbidden in (\n    ".compatibility_columns",\n    "canonical_liveness_grid",\n    "canonical_liveness_parameter",\n    "paper_grid_paths",\n    "paper_cell_parameters",\n    "method_spec.paper_formula",\n    "spec.paper_formula",\n    "audit_failure_bucket",\n    "MethodResultProjection",\n    "ResultRecord",\n):'''
          if text.count(old) != 1:
              raise RuntimeError('unexpected stale-surface guard')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          bash .github/workflows/e8_method_refactor_trim.sh
      - name: Static compile
        run: |
          python -m py_compile \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_orchestration.py \
            src/drpo/e8_multitask_results.py \
            src/drpo/e8_multitask_runtime.py \
            tests/test_e8_multitask_p0.py
      - name: Method contract acceptance
        run: bash tests/test_e8_method_integration_contract.sh
      - name: Focused E8 regression
        run: python -m pytest -q tests/test_e8_multitask_p0.py
      - name: Ruff
        run: python -m ruff check src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_orchestration.py src/drpo/e8_multitask_results.py src/drpo/e8_multitask_runtime.py tests/test_e8_multitask_p0.py
      - name: Governance checks
        run: |
          python3 scripts/validate_governance_pipeline_stage_status.py --repo-root .
          python3 scripts/handoff_authority.py verify --repo-root .
      - name: Full regression excluding characterized main-baseline failures
        run: |
          python -m pytest -q -k 'not test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells and not test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test'
      - name: Recheck characterized failures against current main
        run: |
          set +e
          python -m pytest -q tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells
          branch_asymre=$?
          python -m pytest -q tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test
          branch_docs=$?
          git worktree add /tmp/drpo-main origin/main
          (
            cd /tmp/drpo-main
            PYTHONPATH=/tmp/drpo-main/src python -m pytest -q tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells
          )
          base_asymre=$?
          (
            cd /tmp/drpo-main
            PYTHONPATH=/tmp/drpo-main/src python -m pytest -q tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test
          )
          base_docs=$?
          git worktree remove /tmp/drpo-main --force
          set -e
          test "$branch_asymre" -eq "$base_asymre"
          test "$branch_docs" -eq "$base_docs"
      - name: Diff and code-volume review
        run: |
          git diff --check origin/main
          git diff --stat origin/main
          git diff --numstat origin/main -- \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_orchestration.py \
            src/drpo/e8_multitask_results.py \
            src/drpo/e8_multitask_runtime.py
      - name: Land trim and remove transport files
        run: |
          git rm \
            .github/workflows/e8-method-refactor-trim.yml \
            .github/workflows/e8_method_refactor_trim.sh
          git add \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_results.py \
            src/drpo/e8_multitask_runtime.py \
            tests/test_e8_method_integration_contract.sh \
            tests/test_e8_multitask_p0.py
          git commit -m 'refactor: trim E8 method contract redundancy'
          git push origin HEAD:dev/e8-method-integration-cost-refactor-01
