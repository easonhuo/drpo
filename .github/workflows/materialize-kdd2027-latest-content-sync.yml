name: Materialize approved KDD latest-content sync

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'dev/paper-kdd2027-latest-content-sync-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Reconstruct hash-pinned approved payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/kdd-sync-payload/chunk-* > /tmp/kdd-sync-payload.b64
          base64 --decode /tmp/kdd-sync-payload.b64 > /tmp/kdd-sync-payload.tar.gz
          echo '38ff5991fb063cbbcae5dc1d7dd7ea62739c5a0ddbdbf9fe7e63aab8375dd3bf  /tmp/kdd-sync-payload.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/kdd-sync-payload.tar.gz -C .
          echo '6a840123406580a5f155db1da0978a06d3b9210aa248260daf964fa637b64c43  paper/kdd2027/source_locked.tex' | sha256sum --check --strict
          cmp -s paper/kdd2027/source_locked.tex paper/overleaf/main_replacement.tex
          cmp -s paper/kdd2027/example_paper.bib paper/overleaf/example_paper.bib
          cmp -s paper/kdd2027/missing_references.bib paper/overleaf/missing_references.bib

      - name: Install PDF audit and packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y poppler-utils zip

      - name: Generate, compile, and audit both manuscript formats
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2025
          os: debian
          run: |
            python scripts/generate_kdd2027_stage_a.py
            python scripts/postprocess_kdd2027_stage_a.py
            python paper/kdd2027/verify_content_lock.py
            bash paper/kdd2027/build.sh

            cd paper/overleaf
            latexmk -C main.tex >/dev/null 2>&1 || true
            bash build.sh
            test -s main.pdf
            if grep -Eqi \
              'Undefined control sequence|LaTeX Error|Citation .* undefined|Reference .* undefined|There were undefined references|There were undefined citations|multiply defined|Fatal error' \
              main.log; then
              echo 'Unresolved Overleaf/arXiv LaTeX diagnostic detected' >&2
              exit 1
            fi

      - name: Publish exact compiled release files and audit
        shell: bash
        env:
          BUILD_INPUT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p paper/releases
          cp paper/kdd2027/main.pdf paper/releases/DRPO_KDD2027_STAGE_A.pdf
          rm -f paper/releases/DRPO_KDD2027_OVERLEAF.zip
          (
            cd paper/kdd2027
            zip -q -r ../releases/DRPO_KDD2027_OVERLEAF.zip \
              main.tex \
              acmart.cls \
              ACM-Reference-Format.bst \
              example_paper.bib \
              missing_references.bib \
              figures \
              README.md
          )
          test -s paper/releases/DRPO_KDD2027_STAGE_A.pdf
          test -s paper/releases/DRPO_KDD2027_OVERLEAF.zip
          test -s paper/overleaf/main.pdf
          first_entry="$(unzip -Z1 paper/releases/DRPO_KDD2027_OVERLEAF.zip | head -n 1)"
          [[ "$first_entry" == 'main.tex' ]]
          test "$(unzip -Z1 paper/releases/DRPO_KDD2027_OVERLEAF.zip | grep -Ec '^figures/.*\.pdf$')" -eq 9
          pdftotext -f 8 -l 8 paper/kdd2027/main.pdf /tmp/kdd-page-8.txt
          grep -Fxq 'References' /tmp/kdd-page-8.txt
          pages="$(awk -F= '$1 == "pages" {print $2}' paper/kdd2027/BUILD_AUDIT.txt)"
          rendered_pages="$(awk -F= '$1 == "rendered_pages" {print $2}' paper/kdd2027/BUILD_AUDIT.txt)"
          page_size="$(awk -F= '$1 == "page_size" {sub(/^page_size=/, ""); print}' paper/kdd2027/BUILD_AUDIT.txt)"
          overleaf_pages="$(pdfinfo paper/overleaf/main.pdf | awk '/^Pages:/ {print $2}')"
          cat > paper/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt <<EOF
          claim=PAPER-KDD2027-LATEST-CONTENT-SYNC-01
          build_input_commit=${BUILD_INPUT_COMMIT}
          main_tex_sha256=$(sha256sum paper/kdd2027/main.tex | awk '{print $1}')
          source_sha256=6a840123406580a5f155db1da0978a06d3b9210aa248260daf964fa637b64c43
          canonical_content_sha256=e19c7b65da96ffd92611c083e8d6a2c7dc8a4865fd531013026badfe9d6d9717
          pages=${pages}
          page_size=${page_size}
          texlive_version=2025
          required_figures=9
          rendered_pages=${rendered_pages}
          pdf_sha256=$(sha256sum paper/releases/DRPO_KDD2027_STAGE_A.pdf | awk '{print $1}')
          kdd_overleaf_zip_sha256=$(sha256sum paper/releases/DRPO_KDD2027_OVERLEAF.zip | awk '{print $1}')
          overleaf_arxiv_pages=${overleaf_pages}
          overleaf_arxiv_pdf_sha256=$(sha256sum paper/overleaf/main.pdf | awk '{print $1}')
          content_lock=PASS
          overleaf_content_mirror=PASS
          bibliography_mirror=PASS
          anonymous_pdf=PASS
          latex_diagnostics=PASS
          overleaf_arxiv_compile=PASS
          font_embedding=PASS
          render_gate=PASS
          main_text_pages=8
          all_pages_rendered_for_visual_audit=PASS
          EOF
          sed -i 's/^          //' paper/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt
          cat paper/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt

      - name: Commit canonical sources and exact build outputs
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -rf .github/kdd-sync-payload
          rm -f .github/workflows/materialize-kdd2027-latest-content-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/build-kdd2027-stage-a.yml \
            paper/kdd2027/source_locked.tex \
            paper/kdd2027/main.tex \
            paper/kdd2027/verify_content_lock.py \
            paper/kdd2027/build.sh \
            paper/kdd2027/README.md \
            paper/kdd2027/CONTENT_LOCK.txt \
            paper/overleaf/main_replacement.tex \
            paper/overleaf/missing_references.bib \
            scripts/generate_kdd2027_stage_a.py \
            scripts/postprocess_kdd2027_stage_a.py \
            paper/releases/DRPO_KDD2027_STAGE_A.pdf \
            paper/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt \
            paper/releases/DRPO_KDD2027_OVERLEAF.zip
          git add -A .github/kdd-sync-payload .github/workflows/materialize-kdd2027-latest-content-sync.yml
          git status --short
          git commit -m 'PAPER-KDD2027-LATEST-CONTENT-SYNC-01: synchronize KDD and preprint sources'
          git push origin "HEAD:${HEAD_BRANCH}"
