name: TEMP E8 config-driven sweep refactor

on:
  push:
    branches:
      - dev/e8-config-driven-sweep-01
    paths:
      - '.github/workflows/tmp-e8-config-driven-sweep-edit.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0
      - name: Install focused test dependencies
        run: python3 -m pip install --quiet pytest pyyaml numpy
      - name: Apply and validate refactor
        run: bash .github/scripts/tmp_e8_config_driven_sweep_edit.sh
