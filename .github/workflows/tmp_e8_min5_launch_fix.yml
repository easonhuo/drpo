name: tmp-e8-min5-launch-fix

on:
  push:
    branches:
      - dev/e8-baseline-matrix-launchable-50cd-01-min5

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exactly the approved minimal launch changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runner = Path('scripts/run_e8_multitask_exp_coldstart.sh')
          text = runner.read_text(encoding='utf-8')
          old = 'CONFIG_PATH="${E8_COLDSTART_CONFIG:-${ROOT_DIR}/configs/e8_multitask_exp_coldstart.yaml}"'
          new = 'CONFIG_PATH="${E8_COLDSTART_CONFIG:-${ROOT_DIR}/configs/e8_multitask_baseline_matrix_formal.yaml}"'
          assert text.count(old) == 1, text.count(old)
          runner.write_text(text.replace(old, new), encoding='utf-8')

          bootstrap = Path('scripts/bootstrap_e8_multitask_exp_coldstart.sh')
          text = bootstrap.read_text(encoding='utf-8')
          old = 'CONFIG_REPO_PATH="${E8_COLDSTART_CONFIG:-configs/e8_multitask_exp_coldstart.yaml}"'
          new = 'CONFIG_REPO_PATH="${E8_COLDSTART_CONFIG:-configs/e8_multitask_baseline_matrix_formal.yaml}"'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          old_block = '''if [[ "${MODE}" == "full" && "${SOURCE_COMMIT}" != "${TARGET_COMMIT}" ]]; then
            fail "full mode refuses source commit switching: selected checkout HEAD ${SOURCE_COMMIT} != authoritative ${TARGET_REF} ${TARGET_COMMIT}"
          fi
          '''
          assert text.count(old_block) == 1, text.count(old_block)
          text = text.replace(old_block, '')
          bootstrap.write_text(text, encoding='utf-8')
          PY

      - name: Validate exact scope and preflight
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          runner = Path('scripts/run_e8_multitask_exp_coldstart.sh').read_text(encoding='utf-8')
          bootstrap = Path('scripts/bootstrap_e8_multitask_exp_coldstart.sh').read_text(encoding='utf-8')
          assert 'CONFIG_PATH="${E8_COLDSTART_CONFIG:-${ROOT_DIR}/configs/e8_multitask_baseline_matrix_formal.yaml}"' in runner
          assert 'CONFIG_REPO_PATH="${E8_COLDSTART_CONFIG:-configs/e8_multitask_baseline_matrix_formal.yaml}"' in bootstrap
          assert 'full mode refuses source commit switching' not in bootstrap
          assert 'git -C "${SOURCE_REPO}" worktree add --detach "${CHECKOUT}" "${TARGET_COMMIT}"' in bootstrap
          PY

          python3 -m pip install --disable-pip-version-check -q 'numpy==1.26.4' 'PyYAML==6.0.2'
          PYTHONPATH=src python3 scripts/preflight_e8_multitask_config.py \
            --repo-root . \
            --config configs/e8_multitask_baseline_matrix_formal.yaml \
            > /tmp/e8-preflight.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/e8-preflight.json', encoding='utf-8'))
          assert data['experiment_id'] == 'EXT-C-E8-MULTITASK-BASELINE-MATRIX-01', data
          assert data['scientific_status'] == 'not_run', data
          assert data['cell_count'] == 176, data
          assert data['cells_per_task']['countdown'] == 0, data
          active = {k: v for k, v in data['cells_per_task'].items() if v}
          assert len(active) == 8 and set(active.values()) == {22}, active
          print(json.dumps({'experiment_id': data['experiment_id'], 'cell_count': data['cell_count'], 'cells_per_task': active}, sort_keys=True))
          PY

      - name: Remove temporary workflow, assert final diff, commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp_e8_min5_launch_fix.yml

          mapfile -t changed < <(git diff --name-only d0a8a74dbac0d5dd627d1504ee06422dd5305692 | sort)
          expected=(
            scripts/bootstrap_e8_multitask_exp_coldstart.sh
            scripts/run_e8_multitask_exp_coldstart.sh
          )
          [[ "${changed[*]}" == "${expected[*]}" ]] || {
            printf 'Unexpected final changed files:\n%s\n' "${changed[*]}" >&2
            exit 1
          }

          runner_numstat=$(git diff --numstat d0a8a74dbac0d5dd627d1504ee06422dd5305692 -- scripts/run_e8_multitask_exp_coldstart.sh)
          bootstrap_numstat=$(git diff --numstat d0a8a74dbac0d5dd627d1504ee06422dd5305692 -- scripts/bootstrap_e8_multitask_exp_coldstart.sh)
          [[ "$runner_numstat" == $'1\t1\tscripts/run_e8_multitask_exp_coldstart.sh' ]] || { echo "$runner_numstat"; exit 1; }
          [[ "$bootstrap_numstat" == $'1\t4\tscripts/bootstrap_e8_multitask_exp_coldstart.sh' ]] || { echo "$bootstrap_numstat"; exit 1; }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run_e8_multitask_exp_coldstart.sh scripts/bootstrap_e8_multitask_exp_coldstart.sh
          git commit -m 'fix: bind E8 baseline matrix launch path'
          git push origin HEAD:dev/e8-baseline-matrix-launchable-50cd-01-min5
