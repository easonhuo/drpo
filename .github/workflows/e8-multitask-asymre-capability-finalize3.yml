name: E8 Multitask AsymRE Capability Finalize 3

"on":
  push:
    branches:
      - dev/e8-multitask-asymre-capability-01

permissions:
  contents: write

jobs:
  implement-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-asymre-capability-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply the reviewed implementation normalizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/e8-multitask-asymre-capability-finalize2.yml')
          text = source.read_text(encoding='utf-8')
          prefix = (
              '      - name: Apply scoped implementation and normalize generated blocks\n'
              '        shell: bash\n'
              '        run: |\n'
          )
          suffix = '      - name: Install focused test dependencies\n'
          start = text.index(prefix) + len(prefix)
          end = text.index(suffix, start)
          block = text[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          path = Path('/tmp/e8_asymre_finalizer.sh')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/e8_asymre_finalizer.sh

          python - <<'PY'
          from pathlib import Path

          config_path = Path('src/drpo/e8_experiment_config.py')
          config = config_path.read_text(encoding='utf-8')
          old = 'raise ValueError(f"Unsupported cold-start method: {method}")'
          new = 'raise ValueError(f"Unsupported sweep.method for cold-start: {method}")'
          if config.count(old) != 1:
              raise RuntimeError(
                  f'expected one unsupported-method validator message, found {config.count(old)}'
              )
          config_path.write_text(config.replace(old, new, 1), encoding='utf-8')

          tuning_path = Path('src/drpo/e8_multitask_exp_tuning.py')
          tuning = tuning_path.read_text(encoding='utf-8')
          old = '        "cell": {"task": "countdown"},\n'
          new = (
              '        "cell": {\n'
              '            "task": "countdown",\n'
              '            "method": _coldstart_method(config),\n'
              '        },\n'
          )
          if tuning.count(old) != 1:
              raise RuntimeError(
                  f'expected one engineering liveness cell marker, found {tuning.count(old)}'
              )
          tuning_path.write_text(tuning.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install validation dependencies
        run: python -m pip install -q numpy pyyaml pytest ruff

      - name: Compile and run E8 multitask regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check

      - name: Ruff-check only touched source lines
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py \
            --output-format json > /tmp/ruff.json || true
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          files = (
              'src/drpo/e8_experiment_config.py',
              'src/drpo/e8_multitask_exp_tuning.py',
              'tests/test_e8_multitask_p0.py',
          )
          diff = subprocess.check_output(
              ['git', 'diff', '--unified=0', '--', *files], text=True
          )
          touched: dict[str, set[int]] = {name: set() for name in files}
          current = None
          for line in diff.splitlines():
              if line.startswith('+++ b/'):
                  current = line[6:]
                  continue
              if current is None or not line.startswith('@@'):
                  continue
              match = re.search(r'\+(\d+)(?:,(\d+))?', line)
              if match is None:
                  continue
              start = int(match.group(1))
              count = int(match.group(2) or '1')
              touched.setdefault(current, set()).update(range(start, start + count))

          diagnostics = json.loads(Path('/tmp/ruff.json').read_text(encoding='utf-8'))
          failures = []
          for item in diagnostics:
              filename = str(Path(item['filename']).as_posix())
              if filename.startswith(str(Path.cwd().as_posix()) + '/'):
                  filename = filename[len(str(Path.cwd().as_posix())) + 1:]
              row = int(item['location']['row'])
              if row in touched.get(filename, set()):
                  failures.append(item)
          if failures:
              for item in failures:
                  print(
                      f"{item['filename']}:{item['location']['row']}: "
                      f"{item['code']} {item['message']}"
                  )
              raise SystemExit(f"ruff reported {len(failures)} issue(s) on touched lines")
          print('Ruff: no diagnostics on touched lines; pre-existing diagnostics are unchanged scope.')
          PY

      - name: Commit implementation and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm \
            .github/workflows/e8-multitask-asymre-capability-dev.yml \
            .github/workflows/e8-multitask-asymre-capability-repair.yml \
            .github/workflows/e8-multitask-asymre-capability-finalize.yml \
            .github/workflows/e8-multitask-asymre-capability-finalize2.yml \
            .github/workflows/e8-multitask-asymre-capability-finalize3.yml
          git add \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          git diff --cached --check
          git commit -m 'feat: add config-driven E8 multitask AsymRE capability'
          git push origin HEAD:dev/e8-multitask-asymre-capability-01
