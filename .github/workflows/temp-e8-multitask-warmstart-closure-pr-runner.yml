name: TEMP E8 multitask warmstart closure PR runner

on:
  pull_request:
    branches:
      - exec/e8-multitask-warmstart-result-closure-20260809

permissions:
  contents: write

jobs:
  run-materializer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute reviewed standalone materializer
        shell: bash
        run: |
          set -euo pipefail
          bash -n .tmp/e8_multitask_warmstart_result_closure_materialize.sh
          bash .tmp/e8_multitask_warmstart_result_closure_materialize.sh
