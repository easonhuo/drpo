name: TEMP E8 multitask warmstart closure PR runner

on:
  pull_request:
    branches:
      - exec/e8-multitask-warmstart-result-closure-20260809

permissions:
  contents: write

jobs:
  run-materializer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute reviewed standalone materializer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.tmp/e8_multitask_warmstart_result_closure_materialize.sh')
          text = path.read_text(encoding='utf-8')
          old = 'registry_after = registry_before.rstrip("\\n") + registry_append + "\\n"'
          new = 'registry_after = registry_before.rstrip("\\n") + registry_append.rstrip("\\n") + "\\n"'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one registry EOF construction')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          bash -n .tmp/e8_multitask_warmstart_result_closure_materialize.sh
          bash .tmp/e8_multitask_warmstart_result_closure_materialize.sh
