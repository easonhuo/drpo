name: E8 baseline P1-P4 hardening

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-baselines-p1-p4-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0

      - name: Verify reviewed business base and temporary-only staging
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c81100145182e781628527ebd16320f830a19616 HEAD
          mapfile -t changed < <(git diff --name-only c81100145182e781628527ebd16320f830a19616 HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/e8-baselines-p1-p4-hardening-script.txt"
          test "${changed[1]}" = ".github/workflows/e8-baselines-p1-p4-hardening.yml"

      - name: Apply P1-P4 hardening
        shell: bash
        run: |
          set -euo pipefail
          python .github/workflows/e8-baselines-p1-p4-hardening-script.txt

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff

      - name: Validate exact after-image
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== py_compile ==='
            python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
            echo '=== pytest ==='
            python -m pytest -q tests/test_e8_multitask_p0.py
            echo '=== ruff config/tests ==='
            python -m ruff check src/drpo/e8_experiment_config.py tests/test_e8_multitask_p0.py
            echo '=== ruff runner ==='
            python -m ruff check src/drpo/e8_multitask_exp_tuning.py --ignore BLE001,B023
            echo '=== diff check ==='
            git diff --check
            echo '=== DPO PR268 invariants ==='
            python - <<'PY'
          import inspect
          from drpo import e8_multitask_exp_tuning as e
          source = inspect.getsource(e._train_canonical_dpo_transfer_cell)
          required = (
              "full_sequence_log_probability",
              "policy_chosen[row_index]",
              "- policy_rejected",
              "- reference_chosen[row_index]",
              "+ reference_rejected",
              "F.softplus(-logits)",
              "_dpo_prompt_balanced_mean",
              "reference_terminal_sha256 != reference_initial_sha256",
              '"label_smoothing": 0.0',
          )
          for fragment in required:
              assert fragment in source, fragment
          print("CANONICAL_DPO_PR268_SEMANTICS_PRESERVED")
          PY
          } 2>&1 | tee /tmp/e8-p1p4-validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e8-p1-p4-validation-log
          path: /tmp/e8-p1p4-validation.log
          if-no-files-found: warn

      - name: Commit validated changes and remove temporary validation files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/e8-baselines-p1-p4-hardening.yml .github/workflows/e8-baselines-p1-p4-hardening-script.txt
          git add src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: harden E8 baseline matrix tail and provenance"
          git push origin HEAD:dev/e8-multitask-baselines-capability-01
