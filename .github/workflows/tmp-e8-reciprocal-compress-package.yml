name: tmp-e8-reciprocal-compress-package
on:
  push:
    branches: [dev/e8-multitask-reciprocal-shape-128-01]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed compression transform
        shell: bash
        run: |
          set -euo pipefail
          git show ef02b9b98712a07d06beffc1aec575b279012ba1:.github/workflows/tmp-e8-reciprocal-compress-artifact.yml > /tmp/compress.yml
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          import subprocess
          import yaml
          from pathlib import Path
          wf = yaml.safe_load(Path('/tmp/compress.yml').read_text())
          step = next(
              step for step in wf['jobs']['compress-review']['steps']
              if step.get('name') == 'Apply no-semantics-change compression in workspace'
          )
          subprocess.run(['bash', '-lc', step['run']], check=True)
          PY
      - name: Validate compressed capability
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'numpy<2' PyYAML pytest ruff
          export PYTHONPATH=.:src
          python3 -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py
          ruff check src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py
          bash tests/test_e8_method_integration_contract.sh
          pytest -q tests/test_e8_multitask_p0.py
          python3 scripts/handoff_authority.py verify --repo-root .
          python3 scripts/validate_governance_pipeline_stage_status.py --repo-root .
          git diff --check
      - name: Build drpo-update package against current main
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse origin/main)"
          PKG=/tmp/drpo_reciprocal_compression_update
          rm -rf "$PKG" /tmp/drpo-main-check
          mkdir -p "$PKG/modified_files/src/drpo"
          printf '%s\n' "$BASE" > "$PKG/BASE_COMMIT.txt"
          git diff --binary "$BASE" -- src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py > "$PKG/update.patch"
          cp src/drpo/e8_experiment_config.py "$PKG/modified_files/src/drpo/e8_experiment_config.py"
          cp src/drpo/e8_multitask_exp_tuning.py "$PKG/modified_files/src/drpo/e8_multitask_exp_tuning.py"
          cat > "$PKG/CHANGE_SUMMARY.md" <<EOF
          # Reciprocal multitask capability compression

          Base commit: $BASE

          Claim/scope: capability-only support for the proposed 128-cell eight-transfer-task Reciprocal-Linear / Reciprocal-Quadratic extension. No scientific experiment was launched and no successor experiment ID is registered by this package.

          Modified production files:
          - src/drpo/e8_experiment_config.py
          - src/drpo/e8_multitask_exp_tuning.py

          Changes:
          - preserve the existing reciprocal MethodSpec/canonical trainer dispatch and 128-cell geometry;
          - centralize cold-start remoteness metadata in e8_experiment_config.py;
          - remove the duplicate runtime remoteness helper;
          - remove one thin reciprocal grid wrapper;
          - preserve legacy 176-cell baseline-matrix behavior.

          Remaining work: freeze the successor experiment ID/YAML protocol and perform real GPU liveness only after explicit approval. No scientific launch is authorized by this package.
          EOF
          cat > "$PKG/TEST_COMMANDS.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          export PYTHONPATH=.:src
          python3 -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py
          ruff check src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py
          bash tests/test_e8_method_integration_contract.sh
          pytest -q tests/test_e8_multitask_p0.py
          python3 scripts/handoff_authority.py verify --repo-root .
          python3 scripts/validate_governance_pipeline_stage_status.py --repo-root .
          git diff --check
          EOF
          chmod +x "$PKG/TEST_COMMANDS.sh"
          git worktree add --detach /tmp/drpo-main-check "$BASE"
          git -C /tmp/drpo-main-check apply --check "$PKG/update.patch"
          (cd /tmp && zip -qr drpo_reciprocal_compression_update.zip drpo_reciprocal_compression_update)
          cp /tmp/drpo_reciprocal_compression_update.zip ./drpo_reciprocal_compression_update.zip
          echo "BASE=$BASE"
          echo "PATCH_LINES=$(wc -l < "$PKG/update.patch")"
          git diff --stat "$BASE" -- src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py
      - uses: actions/upload-artifact@v4
        with:
          name: drpo-reciprocal-compression-update
          path: drpo_reciprocal_compression_update.zip
