name: E8 dynamic-slot candidate CI

on:
  push:
    branches:
      - dev/e8-dynamic-slot-candidate-ci-20260820
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev/e8-multitask-exp-coldstart-01

permissions:
  contents: write

jobs:
  build-test-publish:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[validated candidate]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-dynamic-slot-candidate-ci-20260820
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize scheduler-only candidate from locked patcher blob
        shell: bash
        run: |
          set -euo pipefail
          BASE=4b7c991cd8797412830cb34f76dfe35cc09eb90f
          OLD_PATCHER_BLOB=c009d394717b65e8d9e251885f8f08ada59ea7b6
          git checkout "$BASE" -- \
            src/drpo/e8_multitask_exp_tuning.py \
            configs/e8_multitask_exp_coldstart.yaml \
            tests/test_e8_multitask_p0.py
          git fetch --no-tags origin dev/e8-dynamic-slot-repair-work-20260820:refs/remotes/origin/dev/e8-dynamic-slot-repair-work-20260820
          git show "$OLD_PATCHER_BLOB" > /tmp/patcher.yml
          python - <<'PY'
          from pathlib import Path

          workflow = Path('/tmp/patcher.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index("          PY\n", start)
          body_lines = workflow[start:end].splitlines()
          script = "\n".join(
              line[10:] if line.startswith("          ") else line for line in body_lines
          ) + "\n"
          bad_dynamic = '''dynamic = "\\n".join(
              line[10:] if line.startswith("          ") else line
              for line in dynamic.splitlines()
          )
'''
          bad_audit = '''audit = "\\n".join(
              line[10:] if line.startswith("          ") else line
              for line in audit.splitlines()
          )
'''
          bad_scheduler = '''scheduler_test = "\\n".join(
              line[10:] if line.startswith("          ") else line
              for line in scheduler_test.splitlines()
          ).rstrip() + "\\n"
'''
          for label, old, new in (
              ('dynamic', bad_dynamic, ''),
              ('audit', bad_audit, ''),
              ('scheduler-test', bad_scheduler, 'scheduler_test = scheduler_test.rstrip() + "\\n"\n'),
          ):
              count = script.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one faulty dedent block, found {count}')
              script = script.replace(old, new, 1)
          exec(compile(script, '<corrected-dynamic-slot-patcher>', 'exec'), {})
          PY

      - name: Install project test dependencies
        run: python -m pip install -q -e '.[dev]'

      - name: Compile candidate
        run: python -m compileall -q src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py

      - name: Targeted dynamic-slot regressions
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_e8_multitask_p0.py::test_exp_coldstart_matrix_is_208_cells_in_13_nominal_batches \
            tests/test_e8_multitask_p0.py::test_exp_coldstart_rejects_adapter_runtime_or_grid_drift \
            tests/test_e8_multitask_p0.py::test_exp_coldstart_scheduler_refills_freed_slots_and_caps_two_per_gpu \
            tests/test_e8_multitask_p0.py::test_coldstart_engineering_self_test_exercises_208_cell_recovery_and_dynamic_refill \
            tests/test_e8_multitask_p0.py::test_coldstart_task_results_publish_before_global_aggregate

      - name: Ten-pass focused dynamic-slot audit
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "FOCUSED_AUDIT_PASS=$i"
            python -m pytest -q \
              tests/test_e8_multitask_p0.py::test_exp_coldstart_scheduler_refills_freed_slots_and_caps_two_per_gpu \
              tests/test_e8_multitask_p0.py::test_coldstart_engineering_self_test_exercises_208_cell_recovery_and_dynamic_refill \
              tests/test_e8_multitask_p0.py::test_coldstart_task_results_publish_before_global_aggregate
          done

      - name: Full E8 multitask test file
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_e8_multitask_p0.py

      - name: Full repository pytest
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Ruff changed Python
        run: python -m ruff check src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py

      - name: Scope and scientific-protocol audit
        shell: bash
        run: |
          set -euo pipefail
          BASE=4b7c991cd8797412830cb34f76dfe35cc09eb90f
          python - <<'PY'
          import subprocess
          import yaml
          BASE='4b7c991cd8797412830cb34f76dfe35cc09eb90f'
          allowed={
              'src/drpo/e8_multitask_exp_tuning.py',
              'configs/e8_multitask_exp_coldstart.yaml',
              'tests/test_e8_multitask_p0.py',
          }
          changed=set(subprocess.check_output([
              'git','diff','--name-only',BASE,'--',
              'src/drpo/e8_multitask_exp_tuning.py',
              'configs/e8_multitask_exp_coldstart.yaml',
              'tests/test_e8_multitask_p0.py',
          ], text=True).splitlines())
          assert changed == allowed, changed
          base=yaml.safe_load(subprocess.check_output([
              'git','show',f'{BASE}:configs/e8_multitask_exp_coldstart.yaml'
          ], text=True))
          current=yaml.safe_load(open('configs/e8_multitask_exp_coldstart.yaml', encoding='utf-8'))
          assert base['execution']['wave_barriers'] is True
          assert current['execution']['wave_barriers'] is False
          base['execution']['wave_barriers']=False
          assert current == base, 'config changed outside execution.wave_barriers'
          source=open('src/drpo/e8_multitask_exp_tuning.py', encoding='utf-8').read()
          s=source.index('def cmd_run_dynamic(')
          e=source.index('\ndef cmd_run_all(', s)
          dynamic=source[s:e]
          assert source.count('def cmd_run_dynamic(') == 1
          assert source.count('def _audit_engineering_queue(') == 1
          assert 'pending: queue.Queue[Cell] = queue.Queue()' in dynamic
          assert 'executor.submit(worker, slot, gpu_ids[slot % len(gpu_ids)])' in dynamic
          assert '"wave_barriers": False' in dynamic
          assert '"scheduling_barrier": False' in dynamic
          assert '"countdown_result_controls_transfer_release": False' in dynamic
          assert 'for wave_index, wave in enumerate(waves, start=1):' not in dynamic
          print('SCOPE_AND_PROTOCOL_AUDIT=PASS')
          PY
          git diff --check "$BASE" -- \
            src/drpo/e8_multitask_exp_tuning.py \
            configs/e8_multitask_exp_coldstart.yaml \
            tests/test_e8_multitask_p0.py

      - name: Commit validated candidate files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'drpo-validation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/drpo/e8_multitask_exp_tuning.py \
            configs/e8_multitask_exp_coldstart.yaml \
            tests/test_e8_multitask_p0.py
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' \
            configs/e8_multitask_exp_coldstart.yaml \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'E8 coldstart: restore dynamic slot refill [validated candidate]'
          git push origin HEAD:dev/e8-dynamic-slot-candidate-ci-20260820