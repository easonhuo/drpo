name: TEMP E8 Exp append targeted tests

on:
  push:
    branches:
      - dev/e8-multitask-exp-tuning-01
    paths:
      - .github/e8-exp-source/test_e8_multitask_exp_append.txt
      - .github/workflows/temp-e8-exp-test-append.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-e8-exp-test-append
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-exp-tuning-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Append governed tests without creating another Python path
        shell: bash
        run: |
          set -euo pipefail
          marker='def test_exp_tuning_matrix_has_one_positive_and_seven_exp_per_task'
          if ! grep -q "$marker" tests/test_e8_multitask_p0.py; then
            cat .github/e8-exp-source/test_e8_multitask_exp_append.txt \
              >> tests/test_e8_multitask_p0.py
          fi
          grep -q "$marker" tests/test_e8_multitask_p0.py
          python -m py_compile \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          git diff --check

      - name: Commit targeted tests for PR validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_e8_multitask_p0.py
          if git diff --cached --quiet; then
            echo 'Targeted tests already present.'
            exit 0
          fi
          git commit -m 'EXT-C-E8-MULTITASK-EXP-TUNING-01: add targeted tests'
          git push origin HEAD:dev/e8-multitask-exp-tuning-01
