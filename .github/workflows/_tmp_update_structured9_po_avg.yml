name: Temporary update Structured-9 PO and macro average

on:
  push:
    branches:
      - dev/manuscript-structured9-results-01
    paths:
      - .github/workflows/_tmp_update_structured9_po_avg.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev/manuscript-structured9-results-01

      - name: Apply approved table update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('paper/overleaf/main_replacement.tex')
          text = path.read_text(encoding='utf-8')

          old = r'''\begin{tabular*}{\columnwidth}{@{\extracolsep{\fill}}lcccc}
\toprule
Task
&
AsymRE
&
\makecell{\(\beta\)-TOPR\\(joint fitted ref.)}
&
DPO\(^{\ddagger}\)
&
\textbf{DRPO}
\\
\midrule

Countdown
& 14.38
& 14.41
&
& \textbf{15.72}
\\

Word Sorting
& 61.72
& 59.61
&
& \textbf{63.38}
\\

Spiral Matrix
& 99.92
& \textbf{100.00}
&
& 99.94
\\

Mini Sudoku
& \textbf{97.58}
& 96.88
&
& 97.06
\\

Maze
