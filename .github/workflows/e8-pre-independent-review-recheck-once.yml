name: E8 Pre-Independent-Review Recheck Once

on:
  push:
    branches:
      - dev/e8-config-driven-sweep-01

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify reviewed base
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only 6b9c5f7b44204caf3f1f25bb65ed9b8d0891b542 HEAD | grep -v '^.github/workflows/e8-pre-independent-review-recheck-once.yml$' || true)"
          test -z "${unexpected}"
          git diff --quiet origin/main -- .github/workflows/code-change-budget.yml

      - name: Apply final internal-review corrections
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/drpo/e8_experiment_config.py",
              '''    expected_waves = _integer(
                  execution.get("expected_waves"), "execution.expected_waves", positive=True
              )
              configured_cells = _integer(config["sweep"].get("expected_cells"), "sweep.expected_cells")
              required_waves = math.ceil(configured_cells / capacity)
              if expected_waves != required_waves:
                  raise ValueError("execution.expected_waves must match the expanded matrix and capacity")
          ''',
              '''    configured_expected_waves = execution.get("expected_waves")
              if configured_expected_waves is not None:
                  expected_waves = _integer(
                      configured_expected_waves, "execution.expected_waves", positive=True
                  )
                  configured_cells = _integer(
                      config["sweep"].get("expected_cells"), "sweep.expected_cells"
                  )
                  required_waves = math.ceil(configured_cells / capacity)
                  if expected_waves != required_waves:
                      raise ValueError(
                          "execution.expected_waves must match the expanded matrix and capacity"
                      )
          ''',
          )

          replace_once(
              "src/drpo/e8_multitask_exp_tuning.py",
              '''    return (
                  artifact_manifest.get("experiment_id") == expected_id
                  and artifact_manifest.get("base_commit") == source_commit
          ''',
              '''    if not all(
                  isinstance(value, dict)
                  for value in (
                      artifact_manifest,
                      run_manifest,
                      packaged_provenance,
                      packaged_prepare,
                  )
              ):
                  return False
              return (
                  artifact_manifest.get("package_kind") == "experiment-raw-complete"
                  and artifact_manifest.get("experiment_id") == expected_id
                  and artifact_manifest.get("base_commit") == source_commit
          ''',
          )

          replace_once(
              "scripts/run_e8_multitask_exp_coldstart.sh",
              '''recover_import_if_requested() {
            [[ -n "${RECOVERY_SOURCE_OUTPUT:-}" ]] || return 0
            [[ -d "${RECOVERY_SOURCE_OUTPUT}" ]] || fail "recovery source vanished: ${RECOVERY_SOURCE_OUTPUT}"
            local recovery_model="${MODEL_DIR}"
            if [[ "${MODE}" == "self-test" || "${MODE}" == "engineering-self-test-internal" ]]; then
              recovery_model="${RECOVERY_SOURCE_OUTPUT}/engineering_fixtures/placeholder_model"
            fi
            run_module import-recovery \\
              --source-output-root "${RECOVERY_SOURCE_OUTPUT}" \\
              --base-model-path "${recovery_model}" \\
              --source-commit "${EXPECTED_COMMIT}"
          }
          ''',
              '''recover_import_if_requested() {
            [[ -n "${RECOVERY_SOURCE_OUTPUT:-}" ]] || return 0
            [[ -d "${RECOVERY_SOURCE_OUTPUT}" ]] || fail "recovery source vanished: ${RECOVERY_SOURCE_OUTPUT}"
            local recovery_source_commit
            if ! recovery_source_commit="$(
              python - "${RECOVERY_SOURCE_OUTPUT}/source_provenance.json" <<'PY_RECOVERY_SOURCE'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(value, dict) or not isinstance(value.get("source_commit"), str):
              raise SystemExit(2)
          print(value["source_commit"])
          PY_RECOVERY_SOURCE
            )"; then
              echo "Recovery source provenance is unreadable; starting fresh instead of retrying stale import." >&2
              RECOVERY_SOURCE_OUTPUT=""
              export RECOVERY_SOURCE_OUTPUT
              return 0
            fi
            if [[ "${recovery_source_commit}" != "${EXPECTED_COMMIT}" ]]; then
              echo "Recovery source commit ${recovery_source_commit} != ${EXPECTED_COMMIT}; starting fresh instead of retrying stale import." >&2
              RECOVERY_SOURCE_OUTPUT=""
              export RECOVERY_SOURCE_OUTPUT
              return 0
            fi
            local recovery_model="${MODEL_DIR}"
            if [[ "${MODE}" == "self-test" || "${MODE}" == "engineering-self-test-internal" ]]; then
              recovery_model="${RECOVERY_SOURCE_OUTPUT}/engineering_fixtures/placeholder_model"
            fi
            run_module import-recovery \\
              --source-output-root "${RECOVERY_SOURCE_OUTPUT}" \\
              --base-model-path "${recovery_model}" \\
              --source-commit "${EXPECTED_COMMIT}"
          }
          ''',
          )

          replace_once(
              "scripts/run_e8_multitask_exp_coldstart.sh",
              '  setup) setup ;;\n',
              '  setup) runtime_setup_lock; setup; runtime_setup_unlock ;;\n',
          )

          replace_once(
              "tests/test_e8_multitask_p0.py",
              '    def write_artifact(*, packaged_source: str, packaged_hash: str) -> None:\n',
              '''    def write_artifact(
                  *,
                  packaged_source: str,
                  packaged_hash: str,
                  package_kind: str = "experiment-raw-complete",
              ) -> None:
          ''',
          )

          replace_once(
              "tests/test_e8_multitask_p0.py",
              '''                    {
                                  "experiment_id": exp_tuning.experiment_id(config),
                                  "base_commit": source_commit,
                              }
                          ),
                      )
                      archive.writestr("BASE_COMMIT.txt", source_commit + "\\n")
          ''',
              '''                    {
                                  "package_kind": package_kind,
                                  "experiment_id": exp_tuning.experiment_id(config),
                                  "base_commit": source_commit,
                              }
                          ),
                      )
                      archive.writestr("BASE_COMMIT.txt", source_commit + "\\n")
          ''',
          )

          replace_once(
              "tests/test_e8_multitask_p0.py",
              '''    assert not exp_tuning._successful_attempt_matches_current_identity(
                  config,
                  workload,
                  source_commit=source_commit,
                  artifact_path=artifact,
              )
          
              runner = Path("scripts/run_e8_multitask_exp_coldstart.sh").read_text(encoding="utf-8")
          ''',
              '''    assert not exp_tuning._successful_attempt_matches_current_identity(
                  config,
                  workload,
                  source_commit=source_commit,
                  artifact_path=artifact,
              )
              write_artifact(
                  packaged_source=source_commit,
                  packaged_hash=exp_tuning.stable_config_hash(config),
                  package_kind="experiment-failed",
              )
              assert not exp_tuning._successful_attempt_matches_current_identity(
                  config,
                  workload,
                  source_commit=source_commit,
                  artifact_path=artifact,
              )
          
              runner = Path("scripts/run_e8_multitask_exp_coldstart.sh").read_text(encoding="utf-8")
          ''',
          )

          replace_once(
              "tests/test_e8_multitask_p0.py",
              '''    assert selftest.index("runtime_setup_lock") < selftest.index("python3 -m venv")
              assert selftest.index("runtime_setup_unlock") > selftest.index("python3 -m venv")
          
              bootstrap = Path("scripts/bootstrap_e8_multitask_exp_coldstart.sh").read_text(
          ''',
              '''    assert selftest.index("runtime_setup_lock") < selftest.index("python3 -m venv")
              assert selftest.index("runtime_setup_unlock") > selftest.index("python3 -m venv")
              mode_dispatch = runner.split('\\ncase "${MODE}" in\\n', 1)[1]
              assert "setup) runtime_setup_lock; setup; runtime_setup_unlock ;;" in mode_dispatch
              recovery = runner.split("\\nrecover_import_if_requested() {\\n", 1)[1].split(
                  "\\nengineering_self_test_internal() {\\n", 1
              )[0]
              assert recovery.index("source_provenance.json") < recovery.index("run_module import-recovery")
              assert 'RECOVERY_SOURCE_OUTPUT=""' in recovery
              assert "starting fresh instead of retrying stale import" in recovery
          
              bootstrap = Path("scripts/bootstrap_e8_multitask_exp_coldstart.sh").read_text(
          ''',
          )

          test_path = Path("tests/test_e8_multitask_p0.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_text += '''
          
          
          def test_expected_waves_is_optional_metadata_but_consistent_when_declared() -> None:
              from drpo import e8_multitask_exp_tuning as exp_tuning
          
              config = exp_tuning.load_config(
                  Path("configs/e8_multitask_exp_lambda_curve_completion.yaml")
              )
              config["experiment_id"] = "EXT-C-E8-MULTITASK-OPTIONAL-WAVES-TEST"
              config["execution"].pop("expected_waves")
              exp_tuning.validate_config(config)
              waves = exp_tuning.build_waves(config)
              assert len(waves) == math.ceil(
                  config["sweep"]["expected_cells"] / config["execution"]["max_concurrent_cells"]
              )
          '''
          test_path.write_text(test_text, encoding="utf-8")

          protocol = Path("docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md")
          protocol_text = protocol.read_text(encoding="utf-8")
          heading = "## 2026-09-03 pre-independent-review internal recheck closure"
          if heading in protocol_text:
              raise SystemExit("pre-independent-review closure already exists")
          protocol_text += f'''\n\n{heading}\n\nA final internal read-through before the independent-review gate found four narrow engineering after-image gaps. These corrections stay within already approved semantics and do not authorize or modify a scientific experiment.\n\n- `execution.expected_waves` is optional reporting/plan metadata. When declared it must equal the wave count implied by the configured scientific matrix and scheduler capacity; omitting it does not create a new launch blocker.\n- A completed-attempt success fast path accepts only a guarded ZIP whose manifest is `package_kind=experiment-raw-complete`, in addition to the already approved source/experiment/config identity binding and hardened package verification.\n- A recoverable attempt recorded under a different source commit is not repeatedly fed to the existing importer until automatic retries are exhausted. The old evidence is preserved, recovery import is skipped, and the new isolated attempt starts fresh. This adds no config/model/runtime/backend recovery-eligibility gate.\n- The explicit `setup` subcommand uses the same shared-runtime `flock` serialization already required by `ensure_setup()` and self-test setup, closing the remaining direct-entry race on the common venv/model runtime.\n\nNo tracked scientific config, data volume, seed, lambda, optimizer/training formula, canonical paper loss/trainer, metric, result status, or method ranking is changed by this closure. No scientific experiment is launched.\n'''
          protocol.write_text(protocol_text, encoding="utf-8")
          PY

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pip install --disable-pip-version-check ruff==0.9.10 pytest==8.3.4 numpy==1.26.4 PyYAML==6.0.2

      - name: Validate final after-image
        run: |
          set -euo pipefail
          python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py scripts/preflight_e8_multitask_config.py tests/test_e8_multitask_p0.py
          python -m ruff check src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py scripts/preflight_e8_multitask_config.py tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh
          python scripts/preflight_e8_multitask_config.py --config configs/e8_multitask_exp_coldstart.yaml >/tmp/preflight-coldstart.json
          python scripts/preflight_e8_multitask_config.py --config configs/e8_multitask_exp_lambda_completion.yaml >/tmp/preflight-completion.json
          python scripts/preflight_e8_multitask_config.py --config configs/e8_multitask_exp_lambda_curve_completion.yaml >/tmp/preflight-curve.json
          python -m pytest -q tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_experiment_artifact_protocol.py tests/test_experiment_artifact_hardening.py
          git diff --quiet 6b9c5f7b44204caf3f1f25bb65ed9b8d0891b542 -- tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py
          git diff --quiet 6b9c5f7b44204caf3f1f25bb65ed9b8d0891b542 -- docs/experiments/E8_COMPLETED_BACKLOG_CLOSURE.md
          git diff --quiet 6b9c5f7b44204caf3f1f25bb65ed9b8d0891b542 -- docs/experiments/E8_RECIPROCAL_JOINT_CLOSURE.md
          python -m pytest -q \
            --deselect=tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells \
            --deselect=tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test
          git diff --check
          git diff --quiet origin/main -- .github/workflows/code-change-budget.yml

      - name: Commit validated closure and self-delete
        run: |
          set -euo pipefail
          git rm .github/workflows/e8-pre-independent-review-recheck-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md \
            scripts/run_e8_multitask_exp_coldstart.sh \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          git commit -m "fix(e8): close pre-review recovery and reuse gaps"
          git push origin HEAD:dev/e8-config-driven-sweep-01
