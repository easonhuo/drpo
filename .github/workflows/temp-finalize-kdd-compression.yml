name: TEMP finalize KDD compression

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'dev/paper-kdd2027-compression-batch1-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/paper-kdd2027-compression-batch1-01
          fetch-depth: 0

      - name: Apply and commit approved manuscript without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .github/paper-compression-finalize/chunk-00.zb64 ]]; then
            echo 'Final manuscript payload already consumed.'
            exit 0
          fi
          cat .github/paper-compression-finalize/chunk-*.zb64 > /tmp/finalizer.zb64
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path
          payload = Path('/tmp/finalizer.zb64').read_text(encoding='ascii')
          Path('.github/paper-compression-finalize/apply_final.py').write_bytes(
              zlib.decompress(base64.b64decode(payload))
          )
          PY
          python .github/paper-compression-finalize/apply_final.py
          git checkout -- .github/workflows/build-kdd2027-stage-a.yml
          rm -rf .github/paper-compression-finalize
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/kdd2027 paper/overleaf/main_replacement.tex scripts/generate_kdd2027_stage_a.py scripts/postprocess_kdd2027_stage_a.py .github/paper-compression-finalize
          git commit -m 'PAPER-KDD2027-COMPRESSION-8PAGE-01: apply approved three-batch revision'
          git push origin HEAD:dev/paper-kdd2027-compression-batch1-01
