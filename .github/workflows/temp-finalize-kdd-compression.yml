name: TEMP finalize KDD compression

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'dev/paper-kdd2027-compression-batch1-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/paper-kdd2027-compression-batch1-01
          fetch-depth: 0

      - name: Apply and diagnose final commit
        shell: bash
        run: |
          set -euo pipefail
          cat .github/paper-compression-finalize/chunk-*.zb64 > /tmp/finalizer.zb64
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path
          payload = Path('/tmp/finalizer.zb64').read_text(encoding='ascii')
          Path('.github/paper-compression-finalize/apply_final.py').write_bytes(
              zlib.decompress(base64.b64decode(payload))
          )
          PY
          python .github/paper-compression-finalize/apply_final.py > /tmp/apply.log 2>&1
          rm -rf .github/paper-compression-finalize
          rm -f .github/workflows/temp-finalize-kdd-compression.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short > /tmp/status.log
          set +e
          git commit -m 'PAPER-KDD2027-COMPRESSION-8PAGE-01: apply approved three-batch revision' > /tmp/commit.log 2>&1
          commit_status=$?
          git push origin HEAD:dev/paper-kdd2027-compression-batch1-01 > /tmp/push.log 2>&1
          push_status=$?
          set -e
          printf '%s\n' "$commit_status" > /tmp/commit.status
          printf '%s\n' "$push_status" > /tmp/push.status
          cat /tmp/apply.log
          cat /tmp/status.log
          cat /tmp/commit.log
          cat /tmp/push.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temp-final-commit-diagnostics
          path: |
            /tmp/apply.log
            /tmp/status.log
            /tmp/commit.log
            /tmp/push.log
            /tmp/commit.status
            /tmp/push.status
          if-no-files-found: error

      - name: Enforce commit and push
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /tmp/commit.status)" = '0'
          test "$(cat /tmp/push.status)" = '0'
