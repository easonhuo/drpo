name: TEMP finalize KDD compression

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'dev/paper-kdd2027-compression-batch1-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/paper-kdd2027-compression-batch1-01
          fetch-depth: 0

      - name: Reconstruct and diagnose approved three-batch manuscript
        shell: bash
        run: |
          set -u
          cat .github/paper-compression-finalize/chunk-*.zb64 > /tmp/finalizer.zb64
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path
          payload = Path('/tmp/finalizer.zb64').read_text(encoding='ascii')
          Path('/tmp/apply_final.py').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          set +e
          python /tmp/apply_final.py > /tmp/finalizer.log 2>&1
          status=$?
          set -e
          cat /tmp/finalizer.log
          echo "$status" > /tmp/finalizer.status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temp-finalizer-diagnostics
          path: |
            /tmp/finalizer.log
            /tmp/finalizer.status
          if-no-files-found: error

      - name: Enforce diagnostic result
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /tmp/finalizer.status)" = '0'
