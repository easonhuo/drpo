name: PR Gate Log

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-gate-log-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  log-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: PR362 engineering self-test regression
        run: python -m pytest -q tests/test_e8_multitask_p0.py::test_coldstart_engineering_self_test_exercises_208_cell_recovery_and_dynamic_refill

      - name: PR362 scheduler timing probe repeated
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            python -m pytest -q tests/test_e8_multitask_p0.py::test_exp_coldstart_scheduler_refills_without_nominal_batch_barriers
          done

      - name: PR362 method integration contract
        run: bash tests/test_e8_method_integration_contract.sh

      - name: Tiered test plan (shadow only)
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          python scripts/select_update_tests.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --mode auto \
            --json | tee tiered-test-plan.json
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Tiered test plan (shadow only)"
            echo
            echo '```json'
            cat tiered-test-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Python compile
        continue-on-error: true
        run: python -m compileall -q src scripts tools tests

      - name: Shell syntax
        continue-on-error: true
        run: bash -n tools/drpo-update/drpo-update tools/drpo-update/install.sh

      - name: Handoff authority
        continue-on-error: true
        run: python scripts/handoff_authority.py verify --repo-root .

      - name: Governance inventory
        continue-on-error: true
        run: python scripts/validate_governance_rule_inventory.py --repo-root .

      - name: Governance stage status
        continue-on-error: true
        run: python scripts/validate_governance_pipeline_stage_status.py --repo-root .

      - name: Full pytest
        continue-on-error: true
        run: python -m pytest -q

      - name: Ruff
        continue-on-error: true
        run: ruff check .
