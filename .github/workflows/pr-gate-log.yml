name: PR Gate Log

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pr-gate-log-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-fix:
    if: github.event.pull_request.head.ref == 'dev/e8-config-driven-sweep-01'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply third-pass review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target, found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          py = Path("src/drpo/e8_multitask_exp_tuning.py")
          runner = Path("scripts/run_e8_multitask_exp_coldstart.sh")
          bootstrap = Path("scripts/bootstrap_e8_multitask_exp_coldstart.sh")
          tests = Path("tests/test_e8_multitask_p0.py")

          # Recovery must bind the exact canonical liveness identity, not only completion flags.
          marker = '''def _require_liveness_gate(\n'''
          helper = '''def _matches_canonical_cold_liveness_manifest(\n    result: Mapping[str, Any],\n) -> bool:\n    cell = result.get("cell")\n    if not isinstance(cell, Mapping):\n        return False\n    expected = _canonical_cold_liveness_cell()\n    try:\n        rho = float(cell.get("rho"))\n        coefficient = float(cell.get("lambda"))\n    except (TypeError, ValueError):\n        return False\n    return (\n        cell.get("task") == expected.task\n        and cell.get("method") == expected.method\n        and cell.get("seed") == expected.seed\n        and cell.get("stage") == expected.stage\n        and expected.rho is not None\n        and math.isclose(rho, expected.rho, rel_tol=0.0, abs_tol=1.0e-15)\n        and math.isclose(\n            coefficient,\n            COUNTDOWN_LIVENESS_COEFFICIENT,\n            rel_tol=0.0,\n            abs_tol=1.0e-15,\n        )\n        and result.get("canonical_dispatch")\n        == "countdown_e8_alpha1_highc_scan_runtime.smoke"\n    )\n\n\n'''
          text = py.read_text(encoding="utf-8")
          if text.count(marker) != 1 or "def _matches_canonical_cold_liveness_manifest" in text:
              raise SystemExit("cannot insert canonical liveness manifest matcher")
          py.write_text(text.replace(marker, helper + marker, 1), encoding="utf-8")

          replace_once(
              py,
              '''        canonical_cold = (\n            _is_coldstart(config)\n            and result.get("canonical_dispatch_verified") is True\n            and result.get("finite_old_core_updates") is True\n''',
              '''        canonical_cold = (\n            _is_coldstart(config)\n            and _matches_canonical_cold_liveness_manifest(result)\n            and result.get("canonical_dispatch_verified") is True\n            and result.get("finite_old_core_updates") is True\n''',
          )

          replace_once(
              py,
              '''        "canonical_dispatch_verified": True,\n        "finite_old_core_updates": True,\n        "optimizer_update_norm": 1.0,\n        "initial_adapter_weight_sha256": "0" * 64,\n        "terminal_adapter_weight_sha256": "1" * 64,\n        "cell": {"task": "countdown"},\n''',
              '''        "canonical_dispatch": "countdown_e8_alpha1_highc_scan_runtime.smoke",\n        "canonical_dispatch_verified": True,\n        "finite_old_core_updates": True,\n        "optimizer_update_norm": 1.0,\n        "initial_adapter_weight_sha256": "0" * 64,\n        "terminal_adapter_weight_sha256": "1" * 64,\n        "cell": {\n            "task": "countdown",\n            "method": METHOD_EXPONENTIAL,\n            "rho": math.exp(-COUNTDOWN_LIVENESS_COEFFICIENT),\n            "lambda": COUNTDOWN_LIVENESS_COEFFICIENT,\n            "seed": COUNTDOWN_LIVENESS_SEED_OFFSET,\n            "stage": "liveness",\n        },\n''',
          )

          parser_function = r'''read_config_experiment_id() {
            command -v python3 >/dev/null || return 127
            python3 - "$1" <<'PY_EXPERIMENT_ID'
          from pathlib import Path
          import re
          import sys

          safe = r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}"
          plain = re.compile(rf"^({safe})(?:[ \\t]+#.*)?$")
          single = re.compile(rf"^'({safe})'(?:[ \\t]+#.*)?$")
          double = re.compile(rf'^"({safe})"(?:[ \\t]+#.*)?$')
          values = []
          malformed = False
          for raw in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              if raw[:1].isspace() or not raw.startswith("experiment_id:"):
                  continue
              rhs = raw.split(":", 1)[1].strip()
              match = plain.fullmatch(rhs) or single.fullmatch(rhs) or double.fullmatch(rhs)
              if match is None:
                  malformed = True
              else:
                  values.append(match.group(1))
          if malformed or len(values) != 1:
              raise SystemExit(2)
          print(values[0])
          PY_EXPERIMENT_ID
          }
          '''

          # Dedent the embedded shell/Python block before insertion.
          import textwrap
          parser_function = textwrap.dedent(parser_function)

          text = runner.read_text(encoding="utf-8")
          anchor = '''resolve_experiment_id() {\n'''
          if text.count(anchor) != 1 or "read_config_experiment_id()" in text:
              raise SystemExit("cannot insert runner config ID parser")
          text = text.replace(anchor, parser_function + "\n" + anchor, 1)
          old = '''resolve_experiment_id() {\n  local matches=()\n  mapfile -t matches < <(\n    sed -nE 's/^experiment_id:[[:space:]]*([A-Za-z0-9][A-Za-z0-9._-]{0,127})[[:space:]]*$/\\1/p' "${CONFIG_PATH}"\n  )\n  [[ "${#matches[@]}" -eq 1 ]] || \\\n    fail "config must contain exactly one well-formed top-level experiment_id: ${CONFIG_REPO_PATH}"\n  local config_experiment_id="${matches[0]}"\n'''
          new = '''resolve_experiment_id() {\n  local config_experiment_id\n  config_experiment_id="$(read_config_experiment_id "${CONFIG_PATH}")" || \\\n    fail "config must contain exactly one well-formed top-level experiment_id: ${CONFIG_REPO_PATH}"\n'''
          if text.count(old) != 1:
              raise SystemExit("cannot replace runner sed identity parser")
          runner.write_text(text.replace(old, new, 1), encoding="utf-8")

          text = bootstrap.read_text(encoding="utf-8")
          insert_before = '''CURRENT_STAGE="resolve_config_identity"\n'''
          if text.count(insert_before) != 1 or "read_config_experiment_id()" in text:
              raise SystemExit("cannot insert bootstrap config ID parser")
          text = text.replace(insert_before, parser_function + "\n" + insert_before, 1)
          old = '''mapfile -t config_experiment_ids < <(\n  sed -nE 's/^experiment_id:[[:space:]]*([A-Za-z0-9][A-Za-z0-9._-]{0,127})[[:space:]]*$/\\1/p' "${CONFIG_PATH}"\n)\n[[ "${#config_experiment_ids[@]}" -eq 1 ]] || \\\n  fail "config must contain exactly one well-formed top-level experiment_id: ${CONFIG_REPO_PATH}"\nCONFIG_EXPERIMENT_ID="${config_experiment_ids[0]}"\n'''
          new = '''CONFIG_EXPERIMENT_ID="$(read_config_experiment_id "${CONFIG_PATH}")" || \\\n  fail "config must contain exactly one well-formed top-level experiment_id: ${CONFIG_REPO_PATH}"\n'''
          if text.count(old) != 1:
              raise SystemExit("cannot replace bootstrap sed identity parser")
          bootstrap.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Add direct regression coverage for liveness reuse and the exact embedded parsers.
          text = tests.read_text(encoding="utf-8")
          marker = '''def test_canonical_coldstart_liveness_identity_is_independent_of_sweep_grid() -> None:\n'''
          extra = '''def test_canonical_liveness_manifest_matcher_rejects_stale_identity() -> None:\n    from drpo import e8_multitask_exp_tuning as exp_tuning\n\n    cell = exp_tuning._canonical_cold_liveness_cell()\n    good = {\n        "canonical_dispatch": "countdown_e8_alpha1_highc_scan_runtime.smoke",\n        "cell": {\n            "task": cell.task,\n            "method": cell.method,\n            "rho": cell.rho,\n            "lambda": cell.lambda_value,\n            "seed": cell.seed,\n            "stage": cell.stage,\n        },\n    }\n    assert exp_tuning._matches_canonical_cold_liveness_manifest(good)\n    for key, value in (\n        ("lambda", 0.916290732),\n        ("rho", math.exp(-0.916290732)),\n        ("seed", 5000),\n        ("stage", "countdown_sentinel"),\n        ("method", exp_tuning.METHOD_GLOBAL),\n    ):\n        stale = copy.deepcopy(good)\n        stale["cell"][key] = value\n        assert not exp_tuning._matches_canonical_cold_liveness_manifest(stale)\n    stale = copy.deepcopy(good)\n    stale["canonical_dispatch"] = "countdown_e8_alpha1_highc_scan_runtime.worker"\n    assert not exp_tuning._matches_canonical_cold_liveness_manifest(stale)\n\n\n'''
          if text.count(marker) != 1 or "test_canonical_liveness_manifest_matcher_rejects_stale_identity" in text:
              raise SystemExit("cannot insert liveness manifest matcher test")
          text = text.replace(marker, extra + marker, 1)

          # The two launchers intentionally carry the same no-PyYAML bootstrap parser.
          marker = '''def test_runner_and_bootstrap_derive_experiment_id_from_config() -> None:\n'''
          extra = r'''def test_runner_and_bootstrap_config_id_parser_accepts_yaml_presentation(tmp_path: Path) -> None:
              import re
              import subprocess

              scripts = [
                  Path("scripts/run_e8_multitask_exp_coldstart.sh").read_text(encoding="utf-8"),
                  Path("scripts/bootstrap_e8_multitask_exp_coldstart.sh").read_text(encoding="utf-8"),
              ]
              parser_bodies = []
              for script in scripts:
                  match = re.search(
                      r"python3 - \"\$1\" <<'PY_EXPERIMENT_ID'\n(.*?)\nPY_EXPERIMENT_ID",
                      script,
                      flags=re.S,
                  )
                  assert match is not None
                  parser_bodies.append(match.group(1))
              assert parser_bodies[0] == parser_bodies[1]

              valid = (
                  "experiment_id: EXT-C-E8-PLAIN-01\n",
                  "experiment_id: 'EXT-C-E8-SINGLE-01'\n",
                  'experiment_id: "EXT-C-E8-DOUBLE-01"\n',
                  "experiment_id: EXT-C-E8-COMMENT-01  # metadata\n",
                  "experiment_id: 'EXT-C-E8-SINGLE-COMMENT-01' # metadata\n",
              )
              for index, payload in enumerate(valid):
                  config = tmp_path / f"valid-{index}.yaml"
                  config.write_text(payload, encoding="utf-8")
                  completed = subprocess.run(
                      [sys.executable, "-c", parser_bodies[0], str(config)],
                      check=False,
                      capture_output=True,
                      text=True,
                  )
                  assert completed.returncode == 0, completed.stderr
                  assert completed.stdout.strip().startswith("EXT-C-E8-")

              invalid = (
                  "experiment_id: bad id\n",
                  "experiment_id: 'bad id'\n",
                  "  experiment_id: NESTED-NOT-TOPLEVEL\n",
                  "experiment_id: FIRST\nexperiment_id: SECOND\n",
              )
              for index, payload in enumerate(invalid):
                  config = tmp_path / f"invalid-{index}.yaml"
                  config.write_text(payload, encoding="utf-8")
                  completed = subprocess.run(
                      [sys.executable, "-c", parser_bodies[0], str(config)],
                      check=False,
                      capture_output=True,
                      text=True,
                  )
                  assert completed.returncode != 0


'''
          extra = textwrap.dedent(extra)
          if text.count(marker) != 1 or "test_runner_and_bootstrap_config_id_parser_accepts_yaml_presentation" in text:
              raise SystemExit("cannot insert config parser test")
          text = text.replace(marker, extra + marker, 1)
          tests.write_text(text, encoding="utf-8")
          PY

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy PyYAML

      - name: Compile and shell syntax
        run: |
          PYTHONPATH=src python -m py_compile src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh scripts/bootstrap_e8_multitask_exp_coldstart.sh

      - name: Run broad E8 orchestration regression tests
        run: >-
          PYTHONPATH=src python -m pytest -q tests/test_e8_multitask_p0.py
          -k 'coldstart or lambda_completion or lambda_curve_completion or experiment_id_is_generic or runner_and_bootstrap or generic_countdown_grid or config_id_parser'

      - name: Check patch and remove temporary workflow
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/pr-gate-log.yml
          git diff --check

      - name: Commit validated third-pass fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'E8: harden liveness reuse and config identity parsing'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  log-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Tiered test plan (shadow only)
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          python scripts/select_update_tests.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --mode auto \
            --json | tee tiered-test-plan.json
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Tiered test plan (shadow only)"
            echo
            echo '```json'
            cat tiered-test-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Python compile
        continue-on-error: true
        run: python -m compileall -q src scripts tools tests

      - name: Shell syntax
        continue-on-error: true
        run: bash -n tools/drpo-update/drpo-update tools/drpo-update/install.sh

      - name: Handoff authority
        continue-on-error: true
        run: python scripts/handoff_authority.py verify --repo-root .

      - name: Governance inventory
        continue-on-error: true
        run: python scripts/validate_governance_rule_inventory.py --repo-root .

      - name: Governance stage status
        continue-on-error: true
        run: python scripts/validate_governance_pipeline_stage_status.py --repo-root .

      - name: Full pytest
        continue-on-error: true
        run: python -m pytest -q

      - name: Ruff
        continue-on-error: true
        run: ruff check .
