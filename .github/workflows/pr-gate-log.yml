name: PR Gate Log

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pr-gate-log-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-fix:
    if: github.event.pull_request.head.ref == 'dev/e8-config-driven-sweep-01'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply second-pass review fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one target, found {text.count(old)}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          py = Path("src/drpo/e8_multitask_exp_tuning.py")
          runner = Path("scripts/run_e8_multitask_exp_coldstart.sh")
          tests = Path("tests/test_e8_multitask_p0.py")

          replace_once(
              py,
              '''PAPER_SEED_OFFSETS = (4000, 5000)\nCOUNTDOWN_DIAGNOSTIC_SENTINELS = (\n''',
              '''PAPER_SEED_OFFSETS = (4000, 5000)\nCOUNTDOWN_LIVENESS_COEFFICIENT = 0.693147181\nCOUNTDOWN_LIVENESS_SEED_OFFSET = PAPER_SEED_OFFSETS[0]\nFROZEN_COLDSTART_TASK_ORDER = (\n    "countdown",\n    "word_sorting",\n    "spiral_matrix",\n    "mini_sudoku",\n    "maze",\n    "word_ladder",\n    "knights_knaves",\n    "graph_color",\n    "wikisql",\n)\nFROZEN_COLDSTART_P0_TASK_ORDER = FROZEN_COLDSTART_TASK_ORDER[1:]\nCOUNTDOWN_DIAGNOSTIC_SENTINELS = (\n''',
          )

          replace_once(
              py,
              '''    if expected is None:\n        return\n    sweep = config["sweep"]\n''',
              '''    if expected is None:\n        return\n    if (\n        tuple(str(value) for value in config["suite"]["tasks"])\n        != FROZEN_COLDSTART_TASK_ORDER\n        or tuple(str(value) for value in config["suite"]["p0_tasks"])\n        != FROZEN_COLDSTART_P0_TASK_ORDER\n    ):\n        raise ValueError(\n            f"Frozen cold-start suite/task order drifted for {experiment_id(config)}"\n        )\n    sweep = config["sweep"]\n''',
          )

          replace_once(
              py,
              '''        if (\n            not countdown_values\n            or len(countdown_values) != len(set(countdown_values))\n            or any(value not in LOCKED_COUNTDOWN_COEFFICIENTS for value in countdown_values)\n        ):\n            raise ValueError(\n                "Countdown task_lambda must be a non-empty unique subset of the locked paper grids"\n            )\n''',
              '''        if (\n            len(countdown_values) != len(set(countdown_values))\n            or any(value not in LOCKED_COUNTDOWN_COEFFICIENTS for value in countdown_values)\n        ):\n            raise ValueError(\n                "Countdown task_lambda must be a unique subset of the locked paper grids"\n            )\n''',
          )

          replace_once(
              py,
              '''        if any(value not in PAPER_SEED_OFFSETS for value in countdown_seeds):\n            raise ValueError(\n                "Countdown seed offsets must be a subset of the locked paper seed offsets"\n            )\n        countdown_include_positive_only = sweep.get(\n''',
              '''        if any(value not in PAPER_SEED_OFFSETS for value in countdown_seeds):\n            raise ValueError(\n                "Countdown seed offsets must be a subset of the locked paper seed offsets"\n            )\n        if countdown_seeds and not countdown_values:\n            raise ValueError(\n                "Scheduled Countdown seeds require a non-empty locked paper coefficient grid"\n            )\n        countdown_include_positive_only = sweep.get(\n''',
          )

          marker = '''def _cmd_canonical_cold_liveness(\n'''
          helper = '''def _canonical_cold_liveness_cell() -> Cell:\n    coefficient = COUNTDOWN_LIVENESS_COEFFICIENT\n    return Cell(\n        "countdown",\n        METHOD_EXPONENTIAL,\n        math.exp(-coefficient),\n        COUNTDOWN_LIVENESS_SEED_OFFSET,\n        "liveness",\n        coefficient,\n    )\n\n\n'''
          text = py.read_text(encoding="utf-8")
          if text.count(marker) != 1 or "def _canonical_cold_liveness_cell()" in text:
              raise SystemExit("cannot insert canonical liveness helper")
          py.write_text(text.replace(marker, helper + marker, 1), encoding="utf-8")

          replace_once(
              py,
              '''    if cell.task != "countdown":\n        raise RuntimeError("The paper-runtime liveness anchor must be Countdown")\n    modules = _canonical_cold_modules(config)\n    runtime = modules["paper_runtime"]\n''',
              '''    expected_cell = _canonical_cold_liveness_cell()\n    if cell != expected_cell:\n        raise RuntimeError(\n            "Canonical paper-runtime liveness must use the locked c=0.693147181, seed=4000 identity"\n        )\n    modules = _canonical_cold_modules(config)\n    runtime = modules["paper_runtime"]\n    paper_common = modules["paper_common"]\n    expected_paper_cell = paper_common.Cell(\n        alpha=1.0,\n        coefficient=COUNTDOWN_LIVENESS_COEFFICIENT,\n        seed_offset=COUNTDOWN_LIVENESS_SEED_OFFSET,\n        family="exponential",\n    )\n''',
          )

          replace_once(
              py,
              '''    gate = json.loads((smoke_root / "SMOKE_GATE.json").read_text(encoding="utf-8"))\n    if int(returncode) != 0 or gate.get("status") != "PASS":\n        raise RuntimeError("Paper-runtime two-update smoke gate failed")\n''',
              '''    gate = json.loads((smoke_root / "SMOKE_GATE.json").read_text(encoding="utf-8"))\n    if (\n        int(returncode) != 0\n        or gate.get("status") != "PASS"\n        or gate.get("cell") != expected_paper_cell.name\n    ):\n        raise RuntimeError(\n            "Paper-runtime two-update smoke gate failed or returned the wrong locked cell identity"\n        )\n''',
          )

          text = py.read_text(encoding="utf-8")
          pattern = re.compile(r"def cmd_liveness\(\n.*?\n\ndef _read_json_object", re.S)
          replacement = '''def cmd_liveness(\n    config: Mapping[str, Any],\n    config_path: Path,\n    output_root: Path,\n    *,\n    task: str,\n    rho: float,\n    base_model_path: str,\n    force: bool,\n) -> dict[str, Any]:\n    if task not in config["suite"]["tasks"]:\n        raise ValueError(f"Unknown liveness task: {task}")\n    if _is_coldstart(config):\n        cell = _canonical_cold_liveness_cell()\n        if task != cell.task or cell.rho is None or not math.isclose(\n            rho, cell.rho, rel_tol=0.0, abs_tol=1.0e-15\n        ):\n            raise ValueError(\n                "Cold-start liveness is fixed to Countdown c=0.693147181, seed=4000"\n            )\n        splits, inputs = _load_ready_inputs(\n            output_root,\n            config,\n            base_model_path=base_model_path,\n        )\n        return _cmd_canonical_cold_liveness(\n            config,\n            config_path,\n            output_root,\n            cell=cell,\n            inputs=inputs[cell.task],\n            splits=splits,\n            base_model_path=base_model_path,\n            force=force,\n        )\n\n    if rho not in _task_rhos(config, task):\n        raise ValueError("Liveness rho must be one frozen grid point")\n    splits, inputs = _load_ready_inputs(\n        output_root,\n        config,\n        base_model_path=base_model_path,\n    )\n    lambda_value = None\n    if _uses_task_lambdas(config):\n        lambda_value = next(\n            value\n            for value in _task_lambdas(config, task)\n            if math.isclose(math.exp(-value), rho, rel_tol=0.0, abs_tol=1.0e-15)\n        )\n    cell = Cell(\n        task,\n        METHOD_EXPONENTIAL,\n        rho,\n        int(config["sweep"]["tuning_seed"]),\n        "liveness",\n        lambda_value,\n    )\n    result = train_cell(\n        cell,\n        inputs=inputs[task],\n        split_manifest=splits,\n        base_model_path=base_model_path,\n        config=config,\n        output_root=output_root,\n        force=force,\n        updates_override=2,\n        engineering_liveness=True,\n    )\n    reload_command = [\n        sys.executable,\n        "-m",\n        "drpo.e8_multitask_exp_tuning",\n        "--config",\n        str(config_path.resolve()),\n        "--output-root",\n        str(output_root.resolve()),\n        "reload-adapter",\n        "--base-model-path",\n        base_model_path,\n        "--adapter-path",\n        str(result["terminal_adapter"]),\n    ]\n    reload_process = subprocess.run(\n        reload_command,\n        capture_output=True,\n        text=True,\n        env=os.environ.copy(),\n        check=False,\n    )\n    if reload_process.returncode != 0:\n        raise RuntimeError(f"Fresh-process adapter reload failed: {reload_process.stderr[-2000:]}")\n    try:\n        reload_result = json.loads(reload_process.stdout)\n    except json.JSONDecodeError as exc:\n        raise RuntimeError("Fresh-process adapter reload returned invalid JSON") from exc\n    if (\n        not reload_result.get("complete")\n        or not reload_result.get("finite")\n        or int(reload_result.get("process_id", os.getpid())) == os.getpid()\n        or reload_result.get("base_model_identity")\n        != model_identity(base_model_path, None)["model"]\n        or reload_result.get("adapter_identity") != result["terminal_adapter_identity"]\n    ):\n        raise RuntimeError("Fresh-process adapter reload identity or finiteness mismatch")\n    training_rows = read_jsonl(Path(result["training_metrics"]))\n    if not training_rows:\n        raise RuntimeError("Liveness training metrics are missing")\n    terminal_metrics = training_rows[-1]\n    positive_loss = float(terminal_metrics["positive_loss"])\n    negative_scalar = float(terminal_metrics["negative_scalar"])\n    raw_gradient_norm = float(terminal_metrics["raw_gradient_norm_before_clip"])\n    if not math.isfinite(positive_loss) or positive_loss <= 0.0:\n        raise RuntimeError("Liveness positive loss is not finite and positive")\n    if not math.isfinite(negative_scalar) or negative_scalar == 0.0:\n        raise RuntimeError("Liveness repulsive scalar is not finite and nonzero")\n    if not math.isfinite(raw_gradient_norm) or raw_gradient_norm <= 0.0:\n        raise RuntimeError("Liveness raw gradient norm is not finite and positive")\n\n    terminal_hash = sha256_file(_adapter_weight_file(Path(result["terminal_adapter"])))\n    reference_adapter = inputs[task].reference_adapter\n    if reference_adapter is None:\n        raise RuntimeError("Liveness reference adapter is missing")\n    reference_hash = sha256_file(_adapter_weight_file(reference_adapter))\n    if reference_hash == terminal_hash:\n        raise RuntimeError("Liveness adapter weights did not change after two updates")\n    result.update(\n        {\n            "reload_gate_pending": False,\n            "reload_gate_passed": True,\n            "positive_loss_finite_nonzero": True,\n            "repulsive_scalar_finite_nonzero": True,\n            "raw_gradient_finite_nonzero": True,\n            "adapter_weight_changed": True,\n            "fresh_process_reload_passed": True,\n            "liveness_parent_process_id": os.getpid(),\n            "reload_process_id": int(reload_result["process_id"]),\n            "reference_adapter_weight_sha256": reference_hash,\n            "terminal_adapter_weight_sha256": terminal_hash,\n            "initialization_trainable_state_sha256": result.get("initialization_state_sha256"),\n            "terminal_trainable_state_sha256": result.get("terminal_trainable_state_sha256"),\n        }\n    )\n    atomic_json(\n        output_root / "liveness" / cell.key / "cell_manifest.json",\n        result,\n    )\n    return result\n\n\ndef _read_json_object'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("could not replace cmd_liveness")
          py.write_text(text, encoding="utf-8")

          replace_once(
              py,
              '''        if rho is None:\n            rho = _task_rhos(config, str(args.task))[0]\n''',
              '''        if rho is None:\n            rho = (\n                math.exp(-COUNTDOWN_LIVENESS_COEFFICIENT)\n                if _is_coldstart(config)\n                else _task_rhos(config, str(args.task))[0]\n            )\n''',
          )

          text = runner.read_text(encoding="utf-8")
          pattern = re.compile(r"liveness\(\) \{\n.*?\n\}\n\nrun_queue\(\) \{", re.S)
          replacement = '''liveness() {\n  check_source\n  activate_runtime\n  CUDA_VISIBLE_DEVICES=0 LOCAL_RANK=0 run_module liveness \\\n    --task countdown \\\n    --lambda 0.693147181 \\\n    --base-model-path "${MODEL_DIR}"\n}\n\nrun_queue() {'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("could not replace runner liveness")
          runner.write_text(text, encoding="utf-8")

          text = tests.read_text(encoding="utf-8")
          pattern = re.compile(
              r'''    historical_bootstrap = subprocess\.check_output\(\n        \["git", "show", "8bdd07590f155ad26bc8cfbd641d40647eab57d2:scripts/bootstrap_e8_multitask_exp_coldstart\.sh"\],\n        text=True,\n    \)\n    normalized = bootstrap\.replace\(\n        'EXPERIMENT_ID="\$\{E8_COLDSTART_EXPERIMENT_ID:-EXT-C-E8-MULTITASK-EXP-COLDSTART-01\}"',\n        'EXPERIMENT_ID="EXT-C-E8-MULTITASK-EXP-COLDSTART-01"',\n        1,\n    \)\n    assert normalized == historical_bootstrap\n'''
          )
          replacement = '''    assert 'EXPERIMENT_ID_OVERRIDE="${E8_COLDSTART_EXPERIMENT_ID:-}"' in bootstrap\n    assert 'CURRENT_STAGE="resolve_config_identity"' in bootstrap\n    assert 'CONFIG_EXPERIMENT_ID="${config_experiment_ids[0]}"' in bootstrap\n    assert 'export E8_COLDSTART_EXPERIMENT_ID="${EXPERIMENT_ID}"' in bootstrap\n    assert 'E8_COLDSTART_EXPERIMENT_ID:-EXT-C-E8-MULTITASK-EXP-COLDSTART-01' not in bootstrap\n'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("could not replace stale historical bootstrap equality test")

          old = '''    both_empty = copy.deepcopy(completion)\n    both_empty["experiment_id"] = "EXT-C-E8-MULTITASK-EXP-EMPTY-COUNTDOWN-UNSEEN-TEST"\n    both_empty["sweep"]["task_lambda"]["countdown"] = []\n    with pytest.raises(ValueError, match="locked paper grids"):\n        exp_tuning.validate_config(both_empty)\n\n    cold = exp_tuning.load_config(Path("configs/e8_multitask_exp_coldstart.yaml"))\n    seeds_without_values = copy.deepcopy(cold)\n    seeds_without_values["experiment_id"] = "EXT-C-E8-MULTITASK-EXP-COUNTDOWN-SEEDS-NO-GRID-TEST"\n    seeds_without_values["sweep"]["task_lambda"]["countdown"] = []\n    with pytest.raises(ValueError, match="locked paper grids"):\n        exp_tuning.validate_config(seeds_without_values)\n'''
          new = '''    both_empty = copy.deepcopy(completion)\n    both_empty["experiment_id"] = "EXT-C-E8-MULTITASK-EXP-EMPTY-COUNTDOWN-UNSEEN-TEST"\n    both_empty["sweep"]["task_lambda"]["countdown"] = []\n    exp_tuning.validate_config(both_empty)\n    assert not any(cell.task == "countdown" for cell in exp_tuning.build_cells(both_empty))\n\n    cold = exp_tuning.load_config(Path("configs/e8_multitask_exp_coldstart.yaml"))\n    seeds_without_values = copy.deepcopy(cold)\n    seeds_without_values["experiment_id"] = "EXT-C-E8-MULTITASK-EXP-COUNTDOWN-SEEDS-NO-GRID-TEST"\n    seeds_without_values["sweep"]["task_lambda"]["countdown"] = []\n    with pytest.raises(ValueError, match="Scheduled Countdown seeds require"):\n        exp_tuning.validate_config(seeds_without_values)\n'''
          if text.count(old) != 1:
              raise SystemExit("could not update Countdown empty-grid test")
          text = text.replace(old, new, 1)

          old = '''    assert "experiment_id mismatch: bootstrap=" in bootstrap\n    assert '--lambda "${liveness_lambda}"' in runner\n'''
          new = '''    assert "experiment_id mismatch: bootstrap=" in bootstrap\n    assert "--lambda 0.693147181" in runner\n    assert "liveness_lambda" not in runner\n'''
          if text.count(old) != 1:
              raise SystemExit("could not update runner liveness assertion")
          text = text.replace(old, new, 1)

          marker = '''def test_generic_coldstart_global_endpoint_and_countdown_controls_are_config_driven() -> None:\n'''
          extra = '''def test_canonical_coldstart_liveness_identity_is_independent_of_sweep_grid() -> None:\n    from drpo import e8_multitask_exp_tuning as exp_tuning\n\n    cell = exp_tuning._canonical_cold_liveness_cell()\n    assert cell.task == "countdown"\n    assert cell.method == exp_tuning.METHOD_EXPONENTIAL\n    assert cell.lambda_value == exp_tuning.COUNTDOWN_LIVENESS_COEFFICIENT == 0.693147181\n    assert cell.seed == exp_tuning.COUNTDOWN_LIVENESS_SEED_OFFSET == 4000\n    assert math.isclose(float(cell.rho), math.exp(-0.693147181), rel_tol=0.0, abs_tol=1e-15)\n\n    config = exp_tuning.load_config(Path("configs/e8_multitask_exp_lambda_completion.yaml"))\n    config["experiment_id"] = "EXT-C-E8-MULTITASK-EXP-LIVENESS-INDEPENDENT-UNSEEN-TEST"\n    config["sweep"]["task_lambda"]["countdown"] = []\n    exp_tuning.validate_config(config)\n    assert not any(candidate.task == "countdown" for candidate in exp_tuning.build_cells(config))\n    assert exp_tuning._canonical_cold_liveness_cell() == cell\n\n\n'''
          if text.count(marker) != 1 or "test_canonical_coldstart_liveness_identity_is_independent_of_sweep_grid" in text:
              raise SystemExit("cannot insert canonical liveness regression test")
          text = text.replace(marker, extra + marker, 1)

          marker = '''def test_generic_coldstart_global_endpoint_and_countdown_controls_are_config_driven() -> None:\n'''
          order_test = '''def test_frozen_coldstart_ids_reject_suite_order_drift() -> None:\n    from drpo import e8_multitask_exp_tuning as exp_tuning\n\n    for path in (\n        Path("configs/e8_multitask_exp_coldstart.yaml"),\n        Path("configs/e8_multitask_exp_lambda_completion.yaml"),\n        Path("configs/e8_multitask_exp_lambda_curve_completion.yaml"),\n    ):\n        config = exp_tuning.load_config(path)\n        bad = copy.deepcopy(config)\n        bad["suite"]["tasks"][1], bad["suite"]["tasks"][2] = (\n            bad["suite"]["tasks"][2],\n            bad["suite"]["tasks"][1],\n        )\n        with pytest.raises(ValueError, match="suite/task order drifted"):\n            exp_tuning.validate_config(bad)\n\n        bad = copy.deepcopy(config)\n        bad["suite"]["p0_tasks"][0], bad["suite"]["p0_tasks"][1] = (\n            bad["suite"]["p0_tasks"][1],\n            bad["suite"]["p0_tasks"][0],\n        )\n        with pytest.raises(ValueError, match="suite/task order drifted"):\n            exp_tuning.validate_config(bad)\n\n\n'''
          if "test_frozen_coldstart_ids_reject_suite_order_drift" in text:
              raise SystemExit("suite-order regression test already exists")
          text = text.replace(marker, order_test + marker, 1)

          tests.write_text(text, encoding="utf-8")
          PY

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy PyYAML

      - name: Compile and shell syntax
        run: |
          PYTHONPATH=src python -m py_compile src/drpo/e8_multitask_exp_tuning.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh scripts/bootstrap_e8_multitask_exp_coldstart.sh

      - name: Run broad E8 orchestration regression tests
        run: >-
          PYTHONPATH=src python -m pytest -q tests/test_e8_multitask_p0.py
          -k 'coldstart or lambda_completion or lambda_curve_completion or experiment_id_is_generic or runner_and_bootstrap or generic_countdown_grid'

      - name: Check patch and remove temporary workflow
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/pr-gate-log.yml
          git diff --check

      - name: Commit validated second-pass fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'E8: align canonical liveness provenance'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  log-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Tiered test plan (shadow only)
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          python scripts/select_update_tests.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --mode auto \
            --json | tee tiered-test-plan.json
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Tiered test plan (shadow only)"
            echo
            echo '```json'
            cat tiered-test-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Python compile
        continue-on-error: true
        run: python -m compileall -q src scripts tools tests

      - name: Shell syntax
        continue-on-error: true
        run: bash -n tools/drpo-update/drpo-update tools/drpo-update/install.sh

      - name: Handoff authority
        continue-on-error: true
        run: python scripts/handoff_authority.py verify --repo-root .

      - name: Governance inventory
        continue-on-error: true
        run: python scripts/validate_governance_rule_inventory.py --repo-root .

      - name: Governance stage status
        continue-on-error: true
        run: python scripts/validate_governance_pipeline_stage_status.py --repo-root .

      - name: Full pytest
        continue-on-error: true
        run: python -m pytest -q

      - name: Ruff
        continue-on-error: true
        run: ruff check .
