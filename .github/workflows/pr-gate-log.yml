name: PR Gate Log

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pr-gate-log-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-fix:
    if: github.event.pull_request.head.ref == 'dev/e8-config-driven-sweep-01'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Repair temporary patcher quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/_tmp_apply_e8_config_driven_review_fixes.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("\\\n", "\\\\\n")
          path.write_text(text, encoding="utf-8")
          compile(text, str(path), "exec")
          PY

      - name: Apply reviewer fixes
        run: python scripts/_tmp_apply_e8_config_driven_review_fixes.py

      - name: Preserve fixed Countdown liveness anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          py = Path("src/drpo/e8_multitask_exp_tuning.py")
          text = py.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(\s+raise ValueError\(\n\s+"Countdown task_lambda must be a non-empty unique subset of the locked paper grids"\n\s+\)\n)(\s+countdown_seeds = tuple\()'
          )
          text, count = pattern.subn(
              r'\1        if 0.916290732 not in countdown_values:\n'
              r'            raise ValueError(\n'
              r'                "Countdown task_lambda must retain canonical liveness anchor 0.916290732"\n'
              r'            )\n\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not locate Countdown grid validator for liveness-anchor hardening")
          py.write_text(text, encoding="utf-8")

          runner = Path("scripts/run_e8_multitask_exp_coldstart.sh")
          text = runner.read_text(encoding="utf-8")
          pattern = re.compile(r"liveness\(\) \{\n.*?\n\}\n\nrun_queue\(\) \{", re.S)
          replacement = '''liveness() {
            check_source
            activate_runtime
            CUDA_VISIBLE_DEVICES=0 LOCAL_RANK=0 run_module liveness \\
              --task countdown \\
              --lambda 0.916290732 \\
              --base-model-path "${MODEL_DIR}"
          }

          run_queue() {'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("could not restore fixed Countdown liveness function")
          runner.write_text(text, encoding="utf-8")

          tests = Path("tests/test_e8_multitask_p0.py")
          test_text = tests.read_text(encoding="utf-8")
          old = '    config["sweep"]["task_lambda"]["countdown"] = [3.506557897]\n'
          new = '    config["sweep"]["task_lambda"]["countdown"] = [0.916290732, 3.506557897]\n'
          if test_text.count(old) != 1:
              raise SystemExit("could not locate generic Countdown grid test")
          test_text = test_text.replace(old, new, 1)
          old = '    assert \'--lambda "${liveness_lambda}"\' in runner\n'
          new = '    assert "--lambda 0.916290732" in runner\n    assert "liveness_lambda" not in runner\n'
          if test_text.count(old) != 1:
              raise SystemExit("could not locate runner liveness assertion")
          test_text = test_text.replace(old, new, 1)
          marker_name = "def test_generic_countdown_grid_must_retain_liveness_anchor()"
          if marker_name not in test_text:
              test_text += '''\n\ndef test_generic_countdown_grid_must_retain_liveness_anchor() -> None:\n    config = exp_tuning.load_config(Path("configs/e8_multitask_exp_lambda_curve_completion.yaml"))\n    config = copy.deepcopy(config)\n    config["experiment_id"] = "EXT-C-E8-MULTITASK-EXP-COUNTDOWN-NO-LIVENESS-ANCHOR-TEST"\n    config["sweep"]["task_lambda"]["countdown"] = [0.105360516, 0.430782916]\n    with pytest.raises(ValueError, match="canonical liveness anchor"):\n        exp_tuning.validate_config(config)\n'''
          tests.write_text(test_text, encoding="utf-8")
          PY

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy PyYAML

      - name: Compile and shell syntax
        run: |
          PYTHONPATH=src python -m py_compile src/drpo/e8_multitask_exp_tuning.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh scripts/bootstrap_e8_multitask_exp_coldstart.sh

      - name: Focused config-driven regression suite
        run: >-
          PYTHONPATH=src python -m pytest -q tests/test_e8_multitask_p0.py
          -k 'lambda_completion or lambda_curve_completion or coldstart_sweep_instance_is_config_only or experiment_id_is_generic or coldstart_config_rejects_non_integer_seeds or coldstart_countdown_anchor or generic_coldstart_runner or frozen_coldstart_ids or generic_coldstart_global_endpoint or generic_countdown_grid or generic_coldstart_rejects_zero or runner_and_bootstrap or aggregate_accepts_zero_positive_only'

      - name: Restore workflow and remove temporary scaffolding
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/pr-gate-log.yml
          rm -f .github/workflows/_tmp_e8_config_driven_review_fix.yml
          rm -f scripts/_tmp_apply_e8_config_driven_review_fixes.py
          rm -f .e8-config-driven-ci-trigger
          rm -f .e8-config-driven-review-fix-trigger
          git diff --check

      - name: Commit validated fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'E8: harden config-driven sweep boundaries'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  log-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Tiered test plan (shadow only)
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          python scripts/select_update_tests.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --mode auto \
            --json | tee tiered-test-plan.json
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Tiered test plan (shadow only)"
            echo
            echo '```json'
            cat tiered-test-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Python compile
        continue-on-error: true
        run: python -m compileall -q src scripts tools tests

      - name: Shell syntax
        continue-on-error: true
        run: bash -n tools/drpo-update/drpo-update tools/drpo-update/install.sh

      - name: Handoff authority
        continue-on-error: true
        run: python scripts/handoff_authority.py verify --repo-root .

      - name: Governance inventory
        continue-on-error: true
        run: python scripts/validate_governance_rule_inventory.py --repo-root .

      - name: Governance stage status
        continue-on-error: true
        run: python scripts/validate_governance_pipeline_stage_status.py --repo-root .

      - name: Full pytest
        continue-on-error: true
        run: python -m pytest -q

      - name: Ruff
        continue-on-error: true
        run: ruff check .
