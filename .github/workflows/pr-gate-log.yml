name: PR Gate Log

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pr-gate-log-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  transform-selftest-p1:
    if: github.event.pull_request.head.ref == 'dev/e8-multitask-training-splits-01'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Mechanically extract engineering self-test harness
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          source_path = Path('src/drpo/e8_multitask_exp_tuning.py')
          target_path = Path('src/drpo/e8_multitask_selftest.py')
          source = source_path.read_text(encoding='utf-8')
          if target_path.exists():
              raise SystemExit('self-test module already exists; refusing repeated transformation')

          tree = ast.parse(source)
          functions = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          names = [
              '_engineering_self_test_config',
              '_write_engineering_input_fixtures',
              '_write_engineering_gates',
              '_audit_engineering_queue',
              'cmd_engineering_self_test',
          ]
          missing = [name for name in names if name not in functions]
          if missing:
              raise SystemExit(f'missing expected self-test functions: {missing}')

          first = functions[names[0]]
          last = functions[names[-1]]
          if first.lineno >= last.end_lineno:
              raise SystemExit('unexpected self-test function ordering')
          lines = source.splitlines(keepends=True)
          block = ''.join(lines[first.lineno - 1:last.end_lineno])
          for name in names:
              if f'def {name}(' not in block:
                  raise SystemExit(f'extracted block lost {name}')

          header = '''\
          """Non-scientific engineering self-test harness for E8 multitask execution.

          Production/scientific helpers are supplied explicitly by the composition root.
          This module never imports e8_multitask_exp_tuning, preventing an import cycle.
          """

          from __future__ import annotations

          import copy
          import json
          import os
          import shutil
          import threading
          import time
          from collections.abc import Mapping
          from pathlib import Path
          from typing import Any

          import yaml

          _BOUND_HOST: Any | None = None


          def bind_host(host: Any) -> None:
              """Bind the already-initialized composition root as explicit runtime hooks."""

              global _BOUND_HOST
              if _BOUND_HOST is not None and _BOUND_HOST is not host:
                  raise RuntimeError("E8 engineering self-test host changed within one process")
              _BOUND_HOST = host
              direct_names = (
                  "validate_config",
                  "_repo_root",
                  "bank_path",
                  "P0_EXPERIMENT_ID",
                  "stable_config_hash",
                  "with_smoke_overrides",
                  "atomic_jsonl",
                  "atomic_json",
                  "_load_ready_inputs",
                  "_canonical_calibration_identity",
                  "experiment_config",
                  "experiment_id",
                  "model_identity",
                  "_coldstart_methods",
                  "_is_coldstart",
                  "_coldstart_method",
                  "METHOD_DPO",
                  "build_cells",
                  "build_waves",
                  "validate_work_dir",
                  "load_config",
                  "cmd_prepare",
                  "_read_json_object",
                  "_load_prepared",
                  "_require_calibration_gate",
                  "_require_liveness_gate",
                  "sha256_file",
                  "cmd_aggregate",
                  "cmd_audit",
                  "cmd_finalize",
                  "cmd_package",
                  "verify_result_package",
              )
              namespace = globals()
              for name in direct_names:
                  namespace[name] = getattr(host, name)
              namespace["_run_subprocess_cell"] = host._run_subprocess_cell

              def run_dynamic_proxy(*args: Any, **kwargs: Any) -> Any:
                  original = host._run_subprocess_cell
                  host._run_subprocess_cell = namespace["_run_subprocess_cell"]
                  try:
                      return host.cmd_run_dynamic(*args, **kwargs)
                  finally:
                      host._run_subprocess_cell = original

              namespace["cmd_run_dynamic"] = run_dynamic_proxy


          '''
          # Dedent the literal because this script itself lives inside YAML indentation.
          import textwrap
          header = textwrap.dedent(header)
          target_path.write_text(header + block, encoding='utf-8')

          wrapper = '''\
          def _engineering_self_test_config(config: Mapping[str, Any]) -> dict[str, Any]:
              e8_selftest.bind_host(sys.modules[__name__])
              return e8_selftest._engineering_self_test_config(config)


          def cmd_engineering_self_test(
              config: Mapping[str, Any],
              output_root: Path,
              *,
              source_commit: str,
          ) -> dict[str, Any]:
              e8_selftest.bind_host(sys.modules[__name__])
              return e8_selftest.cmd_engineering_self_test(
                  config,
                  output_root,
                  source_commit=source_commit,
              )


          '''
          wrapper = textwrap.dedent(wrapper)
          rebuilt = ''.join(lines[:first.lineno - 1]) + wrapper + ''.join(lines[last.end_lineno:])
          import_anchor = 'from drpo import e8_multitask_runtime as e8_runtime\n'
          selftest_import = 'from drpo import e8_multitask_selftest as e8_selftest\n'
          if import_anchor not in rebuilt:
              raise SystemExit('runtime import anchor missing')
          if selftest_import in rebuilt:
              raise SystemExit('self-test import unexpectedly already present')
          rebuilt = rebuilt.replace(import_anchor, import_anchor + selftest_import, 1)
          source_path.write_text(rebuilt, encoding='utf-8')

          # Sanity checks: implementation authority moved; compatibility facade remains.
          new_main = source_path.read_text(encoding='utf-8')
          new_module = target_path.read_text(encoding='utf-8')
          if new_main.count('def cmd_engineering_self_test(') != 1:
              raise SystemExit('main compatibility command count drifted')
          if '_write_engineering_input_fixtures' in new_main:
              raise SystemExit('fixture implementation remained in main')
          if 'def _write_engineering_input_fixtures(' not in new_module:
              raise SystemExit('fixture implementation missing from new module')
          if 'from drpo import e8_multitask_exp_tuning' in new_module:
              raise SystemExit('new module created a forbidden import cycle')
          print('main lines:', len(new_main.splitlines()))
          print('selftest lines:', len(new_module.splitlines()))
          PY

      - name: Focused validation
        run: |
          python -m py_compile \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_selftest.py
          python -m pytest -q tests/test_e8_multitask_p0.py
          bash tests/test_e8_method_integration_contract.sh
          ruff check \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_selftest.py \
            tests/test_e8_multitask_p0.py
          git diff --check

      - name: Restore ordinary PR Gate and push validated extraction
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin "$BASE_REF"
          git show "origin/${BASE_REF}:.github/workflows/pr-gate-log.yml" > .github/workflows/pr-gate-log.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/pr-gate-log.yml \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_selftest.py
          git diff --cached --check
          git commit -m 'E8: extract engineering self-test harness'
          git push origin "HEAD:${HEAD_REF}"
