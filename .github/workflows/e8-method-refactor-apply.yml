          replace_node(
              'cmd_run_dynamic',
              r'''
              def cmd_run_dynamic(
                  config: Mapping[str, Any],
                  config_path: Path,
                  output_root: Path,
                  *,
                  base_model_path: str,
                  force: bool,
                  retry_incomplete: bool,
              ) -> dict[str, Any]:
                  """Run the cold-start plan through method-agnostic slot scheduling."""

                  if not _is_coldstart(config):
                      raise RuntimeError("Dynamic scheduling is frozen for the cold-start profile only")
                  _require_calibration_gate(config, output_root, base_model_path=base_model_path)
                  _require_liveness_gate(config, output_root, base_model_path=base_model_path)
                  cells = build_cells(config)
                  gpu_ids = tuple(int(value) for value in config["execution"]["gpu_ids"])
                  slots_per_gpu = int(config["execution"]["slots_per_gpu"])
                  seed_barrier = _is_baseline_matrix(config) and bool(
                      config["execution"].get("seed_batch_barriers")
                  )
                  seed_order = (
                      tuple(int(value) for value in config["execution"].get("seed_batch_order", ()))
                      if seed_barrier
                      else None
                  )
                  geometry = e8_orchestration.execution_geometry(
                      cells,
                      gpu_ids=gpu_ids,
                      slots_per_gpu=slots_per_gpu,
                      max_concurrent_cells=int(config["execution"]["max_concurrent_cells"]),
                      seed_barrier=seed_barrier,
                      seed_order=seed_order,
                  )
                  if geometry.slot_count != 16:
                      raise RuntimeError("Declared 16-slot capacity is internally inconsistent")

                  nominal_batch = {
                      cell.key: index
                      for index, wave in enumerate(build_waves(config), 1)
                      for cell in wave
                  }
                  event_path = output_root / "scheduler" / "queue_events.jsonl"
                  event_path.parent.mkdir(parents=True, exist_ok=True)
                  scheduler_run_id = f"queue-{int(time.time())}-{os.getpid()}"
                  task_result_lock = threading.Lock()
                  checkpoint_lock = threading.Lock()
                  task_results: dict[str, dict[str, Any]] = {}
                  recovery_package_value = os.environ.get(
                      "E8_COLDSTART_RECOVERY_PACKAGE", ""
                  ).strip()
                  recovery_package = (
                      Path(recovery_package_value).resolve() if recovery_package_value else None
                  )
                  recovery_interval = int(
                      os.environ.get("E8_COLDSTART_RECOVERY_INTERVAL_CELLS", "5")
                  )
                  if recovery_interval <= 0:
                      raise ValueError("E8_COLDSTART_RECOVERY_INTERVAL_CELLS must be positive")
                  initially_reusable, _ = _reusable_cell_manifests(config, output_root)
                  last_checkpoint_count = (
                      len(initially_reusable) // recovery_interval
                  ) * recovery_interval

                  def record(event: Mapping[str, Any]) -> None:
                      append_jsonl(
                          event_path,
                          {
                              "scheduler_run_id": scheduler_run_id,
                              **dict(event),
                              "unix_time": time.time(),
                          },
                      )

                  def publish_completed_task(task: str) -> None:
                      with task_result_lock:
                          if task in task_results:
                              return
                          rows = _coldstart_completed_task_rows(config, output_root, task)
                          if rows is not None:
                              task_results[task] = _write_coldstart_task_result(
                                  config, output_root, task, rows
                              )

                  def run_cell(cell: Cell, slot: int, gpu_id: int) -> Mapping[str, Any]:
                      del slot
                      cell_root = output_root / "cells" / cell.key
                      manifest_path = cell_root / "cell_manifest.json"
                      reusable_complete = False
                      if manifest_path.is_file():
                          try:
                              reusable_complete = bool(
                                  json.loads(manifest_path.read_text(encoding="utf-8")).get(
                                      "complete"
                                  )
                              )
                          except (OSError, json.JSONDecodeError):
                              reusable_complete = False
                      child_force = force or (
                          retry_incomplete and cell_root.exists() and not reusable_complete
                      )
                      result = _run_subprocess_cell(
                          config_path=config_path.resolve(),
                          output_root=output_root.resolve(),
                          base_model_path=base_model_path,
                          cell=cell,
                          gpu_id=gpu_id,
                          force=child_force,
                      )
                      if int(result["returncode"]) == 0:
                          try:
                              completed_manifest = _read_json_object(manifest_path)
                              if (
                                  completed_manifest.get("complete") is not True
                                  or completed_manifest.get("evaluation_status") != "complete"
                                  or completed_manifest.get("nan_inf_failure") is not False
                              ):
                                  raise RuntimeError(
                                      "child returned zero without a complete finite cell"
                                  )
                          except (
                              OSError,
                              ValueError,
                              TypeError,
                              RuntimeError,
                              json.JSONDecodeError,
                          ) as exc:
                              result["returncode"] = 75
                              result["cell_completion_error"] = (
                                  f"{type(exc).__name__}: {exc}"
                              )
                      result["nominal_batch"] = nominal_batch[cell.key]
                      return result

                  def after_success(cell: Cell, row: Mapping[str, Any]) -> None:
                      nonlocal last_checkpoint_count
                      mutable = row if isinstance(row, dict) else dict(row)
                      if recovery_package is not None:
                          try:
                              with checkpoint_lock:
                                  current_reusable, _ = _reusable_cell_manifests(
                                      config, output_root
                                  )
                                  completed_count = len(current_reusable)
                                  if completed_count >= last_checkpoint_count + recovery_interval:
                                      checkpoint = _publish_recovery_checkpoint(
                                          config,
                                          output_root,
                                          package_output=recovery_package,
                                      )
                                      last_checkpoint_count = int(
                                          checkpoint["completed_cells"]
                                      )
                                      mutable["recovery_checkpoint"] = checkpoint["package"]
                                      mutable["recovery_checkpoint_completed_cells"] = (
                                          last_checkpoint_count
                                      )
                          except Exception:
                              mutable["returncode"] = 74
                              raise
                      publish_completed_task(cell.task)

                  results = list(
                      e8_orchestration.run_dynamic_queue(
                          cells,
                          gpu_ids=gpu_ids,
                          slots_per_gpu=slots_per_gpu,
                          max_concurrent_cells=geometry.slot_count,
                          seed_barrier=seed_barrier,
                          seed_order=seed_order,
                          callbacks=e8_orchestration.SchedulerCallbacks(
                              run_cell=run_cell,
                              record_event=record,
                              after_success=after_success,
                          ),
                      )
                  )
                  results.sort(key=lambda row: str(row["cell_key"]))
                  failures = [row for row in results if int(row["returncode"]) != 0]
                  returned_keys = {str(row["cell_key"]) for row in results}
                  completed_keys = {
                      str(row["cell_key"])
                      for row in results
                      if int(row["returncode"]) == 0
                  }
                  unscheduled = [cell.key for cell in cells if cell.key not in returned_keys]
                  seed_expected = dict(geometry.expected_cells_by_seed) if seed_barrier else {}
                  seed_completed = (
                      {
                          seed: sum(
                              int(row["returncode"]) == 0 and int(row["seed"]) == seed
                              for row in results
                          )
                          for seed in geometry.seed_order
                      }
                      if seed_barrier
                      else {}
                  )
                  protocol_diagnostic = (
                      _countdown_protocol_diagnostic(
                          config,
                          output_root,
                          destination=(
                              output_root
                              / "scheduler"
                              / "countdown_protocol_diagnostic.json"
                          ),
                      )
                      if not failures and not unscheduled
                      else {
                          "status": "PENDING",
                          "result_gate": False,
                          "controls_task_transfer_release": False,
                      }
                  )
                  manifest = {
                      "schema_version": 1,
                      "experiment_id": experiment_id(config),
                      "scheduler": "dynamic_slot_queue",
                      "scheduler_run_id": scheduler_run_id,
                      "wave_barriers": False,
                      "wave_count": len(build_waves(config)),
                      "wave_count_role": (
                          "seed_local_nominal_capacity_audit_only"
                          if seed_barrier
                          else "nominal_audit_geometry_only_not_scheduling_barrier"
                      ),
                      "seed_batch_barriers": seed_barrier,
                      "seed_batch_order": list(geometry.seed_order) if seed_barrier else [],
                      "seed_batch_expected_cells": {
                          str(key): value for key, value in seed_expected.items()
                      },
                      "seed_batch_completed_cells": {
                          str(key): value for key, value in seed_completed.items()
                      },
                      "execution_class": _execution_class(config),
                      "slot_count": geometry.slot_count,
                      "gpu_ids": list(gpu_ids),
                      "slots_per_gpu": slots_per_gpu,
                      "countdown_protocol_diagnostic": protocol_diagnostic,
                      "countdown_result_controls_transfer_release": False,
                      "expected_cells": len(cells),
                      "completed_cells": len(completed_keys),
                      "results": results,
                      "failed_cells": [row["cell_key"] for row in failures],
                      "unscheduled_cells": unscheduled,
                      "queue_events": str(event_path.resolve()),
                      "analysis_ready_tasks": sorted(task_results),
                      "task_results": task_results,
                      "complete": (
                          not failures
                          and not unscheduled
                          and len(completed_keys) == len(cells)
                      ),
                      "scientific_status": (
                          "not_run" if _is_engineering_self_test(config) else "pilot"
                      ),
                      "engineering_placeholder_backend": _is_engineering_self_test(config),
                  }
                  atomic_json(output_root / "scheduler" / "dynamic_run.json", manifest)
                  if failures or unscheduled:
                      raise RuntimeError(
                          "Cold-start scheduling stopped fail-closed; "
                          f"failed={manifest['failed_cells']} unscheduled={len(unscheduled)}"
                      )
                  return manifest
              ''',
              kind=ast.FunctionDef,
          )

          # Method-specific terminal invariants now dispatch through MethodSpec.
          old_audit = '''            if cell.method == METHOD_DPO and (value.get("reference_initial_state_sha256") != value.get("reference_terminal_state_sha256") or value.get("reference_trainable") is not False):\n                dpo_reference_identity_failures.append(cell.key)\n'''
          new_audit = '''            method_audit = _method_spec(cell.method).audit_record(cell, value)\n            if not method_audit.passed:\n                bucket = _method_spec(cell.method).audit_failure_bucket\n                if bucket == "dpo_reference_identity_failures":\n                    dpo_reference_identity_failures.append(cell.key)\n                else:\n                    terminal_contract_failures.append(cell.key)\n'''
          replace_once(old_audit, new_audit, 'terminal method audit')

          target.write_text(source, encoding='utf-8')

          # Wire generic orchestration plan projection and preserve caller-set error codes.
          orchestration = Path('src/drpo/e8_multitask_orchestration.py')
          orch = orchestration.read_text(encoding='utf-8')
          insert_marker = '\n\n@dataclass(frozen=True)\nclass SchedulerCallbacks:'
          if insert_marker not in orch:
              raise RuntimeError('orchestration SchedulerCallbacks marker missing')
          plan_helper = r'''

          def plan_rows(
              batches: Sequence[Sequence[TCell]],
              *,
              gpu_ids: Sequence[int],
              project_cell: Callable[[TCell], Mapping[str, Any]],
          ) -> list[dict[str, Any]]:
              """Materialize deterministic plan rows without interpreting method parameters."""

              if not gpu_ids:
                  raise ValueError("gpu_ids must be non-empty")
              rows: list[dict[str, Any]] = []
              seen: list[TCell] = []
              for batch_index, batch in enumerate(batches, start=1):
                  for slot, cell in enumerate(batch):
                      row: dict[str, Any] = {
                          "wave": batch_index,
                          "nominal_batch": batch_index,
                          "slot": slot,
                          "gpu_id": int(gpu_ids[slot % len(gpu_ids)]),
                          "cell_key": cell.key,
                          "task": cell.task,
                          "method": cell.method,
                      }
                      projected = dict(project_cell(cell))
                      collisions = sorted(set(row).intersection(projected))
                      if collisions:
                          raise ValueError(
                              f"Method plan projection attempted to overwrite: {collisions}"
                          )
                      row.update(projected)
                      row.update({"seed": int(cell.seed), "stage": cell.stage})
                      rows.append(row)
                      seen.append(cell)
              validate_unique_cell_keys(seen)
              return rows
          '''
          orch = orch.replace(insert_marker, textwrap.dedent(plan_helper).rstrip() + insert_marker, 1)
          old_after = '''                except Exception as exc:  # Keep failure evidence in scheduler output.\n                    succeeded = False\n                    raw["returncode"] = 1\n                    raw["error"] = f"after_success {type(exc).__name__}: {exc}"\n'''
          new_after = '''                except Exception as exc:  # Keep failure evidence in scheduler output.\n                    succeeded = False\n                    existing_code = int(raw.get("returncode", 0))\n                    raw["returncode"] = existing_code if existing_code != 0 else 1\n                    raw["error"] = f"after_success {type(exc).__name__}: {exc}"\n'''
          if old_after not in orch:
              raise RuntimeError('orchestration after_success block missing')
          orch = orch.replace(old_after, new_after, 1)
          orchestration.write_text(orch, encoding='utf-8')

          # Preserve public result schema while allowing generic opaque grouping.
          results_path = Path('src/drpo/e8_multitask_results.py')
          results_source = results_path.read_text(encoding='utf-8')
          tree = ast.parse(results_source)
          node = next(item for item in tree.body if isinstance(item, ast.FunctionDef) and item.name == 'common_result_record')
          lines = results_source.splitlines(keepends=True)
          common_replacement = textwrap.dedent(r'''
          def common_result_record(
              cell: CellLike,
              value: Mapping[str, Any],
              *,
              source: str,
              project_method: Callable[[CellLike], MethodResultProjection],
              project_metrics: Callable[[Mapping[str, Any]], Mapping[str, Any]],
          ) -> ResultRecord:
              """Build one record without exposing opaque parameters in public artifacts."""

              projection = project_method(cell)
              compatibility = dict(projection.compatibility_columns)
              reserved = sorted(_RESERVED_COMMON_COLUMNS.intersection(compatibility))
              if reserved:
                  raise ValueError(
                      f"Method compatibility projection uses reserved columns: {reserved}"
                  )
              public: dict[str, Any] = {
                  "source": source,
                  "task": cell.task,
                  "method": cell.method,
              }
              _checked_merge(
                  public,
                  compatibility,
                  label="Method compatibility projection",
              )
              public.update(
                  {
                      "seed": int(cell.seed),
                      "stage": cell.stage,
                      "cell_key": cell.key,
                  }
              )
              _checked_merge(
                  public,
                  dict(project_metrics(value)),
                  label="Metric projection",
              )
              return ResultRecord(
                  public=public,
                  method_parameters=dict(projection.parameters),
              )
          ''').lstrip('\n')
          results_source = ''.join(lines[:node.lineno - 1]) + common_replacement + ''.join(lines[node.end_lineno:])
          tree = ast.parse(results_source)
          node = next(item for item in tree.body if isinstance(item, ast.FunctionDef) and item.name == 'grouped_curve')
          lines = results_source.splitlines(keepends=True)
          grouped_replacement = textwrap.dedent(r'''
          def grouped_curve(
              records: Sequence[ResultRecord],
              *,
              metric_names: Sequence[str] = (),
              group_order: Callable[[str, str, Mapping[str, Any]], Any] | None = None,
              project_group: Callable[[str, Mapping[str, Any]], Mapping[str, Any]] | None = None,
              aggregate_metrics: Callable[[Sequence[ResultRecord]], Mapping[str, Any]] | None = None,
          ) -> list[dict[str, Any]]:
              """Create deterministic public method curves from opaque parameter identities."""

              grouped = group_parameter_records(records)
              entries: list[tuple[Any, str, str, str, list[ResultRecord]]] = []
              for (task, method, identity), group in grouped.items():
                  parameters = dict(group[0].method_parameters)
                  if any(
                      parameter_identity(record.method_parameters) != identity
                      for record in group
                  ):
                      raise RuntimeError(
                          "Method parameter identity changed inside one aggregation group"
                      )
                  sort_value = (
                      group_order(task, method, parameters)
                      if group_order is not None
                      else (task, method, identity)
                  )
                  entries.append((sort_value, task, method, identity, group))

              output: list[dict[str, Any]] = []
              for _, task, method, _, group in sorted(entries, key=lambda item: item[0]):
                  parameters = dict(group[0].method_parameters)
                  row: dict[str, Any] = {"task": task, "method": method}
                  if project_group is not None:
                      _checked_merge(
                          row,
                          dict(project_group(method, parameters)),
                          label="Grouped method compatibility projection",
                      )
                  metrics = (
                      dict(aggregate_metrics(group))
                      if aggregate_metrics is not None
                      else mean_metrics(group, metric_names)
                  )
                  _checked_merge(row, metrics, label="Grouped metric projection")
                  output.append(row)
              return output
          ''').lstrip('\n')
          results_source = ''.join(lines[:node.lineno - 1]) + grouped_replacement + ''.join(lines[node.end_lineno:])
          results_path.write_text(results_source, encoding='utf-8')
          PY
          python /tmp/refactor_e8.py
      - name: Static compile
        run: |
          python -m py_compile \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_orchestration.py \
            src/drpo/e8_multitask_results.py \
            src/drpo/e8_multitask_runtime.py
      - name: Method contract regression
        run: bash tests/test_e8_method_integration_contract.sh
      - name: Focused E8 regression
        run: pytest -q tests/test_e8_multitask_p0.py
      - name: Ruff
        run: ruff check src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_orchestration.py src/drpo/e8_multitask_results.py src/drpo/e8_multitask_runtime.py
      - name: Commit generated refactor and remove one-shot workflow
        run: |
          git diff --check
          git rm .github/workflows/e8-method-refactor-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_orchestration.py src/drpo/e8_multitask_results.py
          git commit -m 'refactor: wire E8 method contract through generic layers'
          git push origin HEAD:dev/e8-method-integration-cost-refactor-01
