                          inputs=inputs,
                          splits=splits,
                          base_model_path=base_model_path,
                          task=task,
                          force=force,
                      )
              ''').lstrip('\n')
          func_text = func_text[:start] + new_cold + func_text[end:]
          source = ''.join(lines[: cmd.lineno - 1]) + func_text + ''.join(lines[cmd.end_lineno :])

          replace_node(
              '_write_csv',
              r'''
              def _write_csv(path: Path, rows: Sequence[Mapping[str, Any]]) -> None:
                  e8_results.write_csv(path, rows)
              ''',
              kind=ast.FunctionDef,
          )

          replace_node(
              '_coldstart_result_row',
              r'''
              def _coldstart_result_row(
                  config: Mapping[str, Any],
                  cell: Cell,
                  value: Mapping[str, Any],
                  *,
                  source: str,
              ) -> dict[str, Any]:
