          )

          replace_node(
              'train_cell',
              r'''
              def train_cell(
                  cell: Cell,
                  *,
                  inputs: TaskInputs,
                  split_manifest: Mapping[str, Any],
                  base_model_path: str,
                  config: Mapping[str, Any],
                  output_root: Path,
                  force: bool,
                  updates_override: int | None = None,
                  engineering_liveness: bool = False,
              ) -> dict[str, Any]:
                  root_name = "liveness" if engineering_liveness else "cells"
                  failure_root = output_root / root_name / cell.key
                  try:
                      if _is_coldstart(config):
                          return _method_spec(cell.method).train_cold(
                              cell,
                              inputs=inputs,
                              split_manifest=split_manifest,
                              base_model_path=base_model_path,
                              config=config,
                              output_root=output_root,
                              force=force,
                              updates_override=updates_override,
                              engineering_liveness=engineering_liveness,
                          )
                      return _train_cell_impl(
                          cell,
                          inputs=inputs,
                          split_manifest=split_manifest,
                          base_model_path=base_model_path,
                          config=config,
                          output_root=output_root,
                          force=force,
                          updates_override=updates_override,
                          engineering_liveness=engineering_liveness,
                      )
                  except Exception as exc:
                      failure_root.mkdir(parents=True, exist_ok=True)
                      atomic_json(
                          failure_root / "failure.json",
                          {
                              "schema_version": 1,
                              "experiment_id": experiment_id(config),
                              "cell_key": cell.key,
                              "error_type": type(exc).__name__,
                              "error": str(exc),
                              "traceback": traceback.format_exc(),
                              "scientific_status": "not_run" if engineering_liveness else "pilot",
                              "nan_inf_failure": (
                                  "non-finite" in str(exc).lower()
                                  or "nan/inf" in str(exc).lower()
                              ),
                              "complete": False,
                          },
                      )
                      raise
              ''',
              kind=ast.FunctionDef,
          )

          # Canonical liveness grid selection is method-owned.
          marker = 'def _cmd_canonical_cold_liveness('
          pos = source.index(marker)
          local = source[pos:]
          old = '''    method = method or _coldstart_method(config)\n    if method == METHOD_ASYMRE:\n        grid_path = _canonical_asymre_grid_path()\n    elif method == METHOD_TOPR:\n        grid_path = _canonical_topr_grid_path()\n    else:\n        grid_path = Path(str(record["round1_grid"]))\n'''
          if old not in local:
              raise RuntimeError('canonical liveness selection block missing')
          local = local.replace(
              old,
              '    method = method or _coldstart_method(config)\n'
              '    method_spec = _method_spec(method)\n'
              '    if method_spec.canonical_liveness_grid is None:\n'
              '        raise RuntimeError(f"{method} does not use canonical paper-runtime liveness")\n'
              '    grid_path = method_spec.canonical_liveness_grid(config, record)\n',
              1,
          )
          source = source[:pos] + local

          # Replace only the cold-start dispatch block of cmd_liveness; preserve legacy non-cold path.
          tree = ast.parse(source)
          cmd = next(item for item in tree.body if isinstance(item, ast.FunctionDef) and item.name == 'cmd_liveness')
          lines = source.splitlines(keepends=True)
          func_text = ''.join(lines[cmd.lineno - 1 : cmd.end_lineno])
          start = func_text.index('    if _is_coldstart(config):\n')
          end = func_text.index('    if rho is None:\n', start)
          new_cold = textwrap.dedent(r'''
                  if _is_coldstart(config):
                      splits, inputs = _load_ready_inputs(
                          output_root,
                          config,
                          base_model_path=base_model_path,
                      )
                      if _is_baseline_matrix(config):
                          if task != "countdown":
                              raise RuntimeError(
                                  "Baseline-matrix liveness is launched once from the Countdown anchor"
                              )
                          results: dict[str, Any] = {}
                          for method in _coldstart_methods(config):
                              spec = _method_spec(method)
                              method_task = spec.liveness_task(config)
                              results[method] = spec.liveness_runner(
                                  config=config,
                                  config_path=config_path,
                                  output_root=output_root,
                                  inputs=inputs,
                                  splits=splits,
                                  base_model_path=base_model_path,
                                  task=method_task,
                                  force=force,
                              )
                          return {
                              "schema_version": 1,
                              "experiment_id": experiment_id(config),
                              "methods": results,
                              "complete": all(
                                  bool(value.get("complete")) for value in results.values()
                              ),
                              "scientific_status": "not_run",
                          }
                      method = _coldstart_method(config)
                      spec = _method_spec(method)
                      expected_task = spec.liveness_task(config)
                      if task != expected_task:
                          raise RuntimeError(
                              f"{method} liveness anchor must be {expected_task}"
