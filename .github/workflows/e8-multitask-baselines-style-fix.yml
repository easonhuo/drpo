name: E8 multitask baseline capability style fix

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-multitask-baselines-style-fix.yml

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply narrow lint repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/drpo/e8_multitask_exp_tuning.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''            setattr(\n                evaluate_rows,\n                "_last_primary_sampled_valid_rate",\n                float(metrics["sampled_valid_rate"]),\n            )\n''',
                  '''            evaluate_rows._last_primary_sampled_valid_rate = float(\n                metrics["sampled_valid_rate"]\n            )\n''',
              ),
              (
                  '''                in set(int(value) for value in effective["evaluation"]["auxiliary_pass_ks"]),\n''',
                  '''                in {int(value) for value in effective["evaluation"]["auxiliary_pass_ks"]},\n''',
              ),
              (
                  '''                    kwargs["pass64_enabled"] = 64 in set(\n                        int(value) for value in effective_runtime["evaluation"]["auxiliary_pass_ks"]\n                    )\n''',
                  '''                    kwargs["pass64_enabled"] = 64 in {\n                        int(value)\n                        for value in effective_runtime["evaluation"]["auxiliary_pass_ks"]\n                    }\n''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count not in {1, 2}:
                  raise RuntimeError(f'unexpected replacement count {count}: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_e8_multitask_p0.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert getattr(evaluator, "_last_primary_sampled_valid_rate") == pytest.approx(0.25)\n'
          new = '    assert evaluator._last_primary_sampled_valid_rate == pytest.approx(0.25)\n'
          if text.count(old) != 1:
              raise RuntimeError(f'expected one evaluator getattr assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install focused dependencies
        run: python -m pip install -q numpy pyyaml pytest torch ruff
      - name: Validate repairs
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check
          set +e
          ruff check src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py > /tmp/ruff.txt 2>&1
          ruff_rc=$?
          set -e
          cat /tmp/ruff.txt
          if grep -Eq 'B010|B009|C401' /tmp/ruff.txt; then
            echo 'Introduced lint class remains after repair' >&2
            exit 1
          fi
          # Full-file Ruff may still report pre-existing main-branch debt; final audit
          # separately filters diagnostics to changed lines and proves baseline parity.
          test "$ruff_rc" -eq 0 -o "$ruff_rc" -eq 1
      - name: Commit lint repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git diff --cached --check
          git commit -m 'style: clean E8 baseline capability lint'
          git push origin HEAD:dev/e8-multitask-baselines-capability-01
