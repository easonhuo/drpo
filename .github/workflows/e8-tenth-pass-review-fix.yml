name: E8 Tenth Pass Review Fix

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'dev/e8-config-driven-sweep-01'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply tenth-pass scalar-contract fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target, found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          py = Path("src/drpo/e8_multitask_exp_tuning.py")
          tests = Path("tests/test_e8_multitask_p0.py")

          replace_once(
              py,
              '''def _configured_bool(value: Any, label: str) -> bool:
              if not isinstance(value, bool):
                  raise ValueError(f"{label} must be boolean")
              return value


def experiment_id(config: Mapping[str, Any]) -> str:
''',
              '''def _configured_bool(value: Any, label: str) -> bool:
              if not isinstance(value, bool):
                  raise ValueError(f"{label} must be boolean")
              return value


def _configured_number(value: Any, label: str) -> float:
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  raise ValueError(f"{label} must be a finite numeric scalar")
              numeric = float(value)
              if not math.isfinite(numeric):
                  raise ValueError(f"{label} must be a finite numeric scalar")
              return numeric


def _validate_coldstart_scalar_contract(config: Mapping[str, Any]) -> None:
              parent = config.get("parent", {})
              if _configured_bool(
                  parent.get("qualified_banks_required"),
                  "parent.qualified_banks_required",
              ) is not True:
                  raise ValueError("Cold-start requires qualified P0 banks")

              reference = config["reference"]
              for field in ("optimizer_updates", "validation_rows_seen", "test_rows_seen"):
                  _configured_seed(reference.get(field), f"reference.{field}")

              model = config["model"]
              for field in ("lora_rank", "lora_alpha", "max_length", "max_new_tokens"):
                  _configured_seed(model.get(field), f"model.{field}")
              _configured_number(model.get("lora_dropout"), "model.lora_dropout")
              if _configured_bool(
                  model.get("gradient_checkpointing"), "model.gradient_checkpointing"
              ) is not True:
                  raise ValueError("Cold-start gradient_checkpointing must remain true")

              split = config["split"]
              for field in (
                  "p0_train_rows",
                  "p0_validation_rows",
                  "p0_test_rows",
                  "countdown_train_rows",
                  "countdown_validation_rows",
                  "hash_seed",
              ):
                  _configured_seed(split.get(field), f"split.{field}")
              if _configured_bool(
                  split.get("test_access_allowed"), "split.test_access_allowed"
              ) is not False:
                  raise ValueError("Cold-start test access must remain forbidden")
              if _configured_bool(
                  split.get("countdown_subsampling_forbidden"),
                  "split.countdown_subsampling_forbidden",
              ) is not True:
                  raise ValueError("Countdown subsampling must remain forbidden")

              training = config["training"]
              for field in (
                  "optimizer_updates",
                  "micro_batch",
                  "gradient_accumulation",
                  "evaluation_every_updates",
              ):
                  _configured_seed(training.get(field), f"training.{field}")
              for field in (
                  "learning_rate",
                  "weight_decay",
                  "warmup_ratio",
                  "max_grad_norm",
              ):
                  _configured_number(training.get(field), f"training.{field}")
              late = training.get("late_window_updates")
              if isinstance(late, (str, bytes)) or not isinstance(late, Sequence):
                  raise ValueError("training.late_window_updates must be an integer sequence")
              tuple(
                  _configured_seed(value, "training.late_window_updates entry")
                  for value in late
              )
              if _configured_bool(
                  training.get("early_stopping"), "training.early_stopping"
              ) is not False:
                  raise ValueError("Cold-start early stopping must remain false")
              if _configured_bool(
                  training.get("terminal_adapter_required"),
                  "training.terminal_adapter_required",
              ) is not True:
                  raise ValueError("Cold-start terminal adapter must remain required")

              evaluation = config["evaluation"]
              for field in (
                  "greedy_prompt_rows",
                  "passk_prompt_rows",
                  "pass_k",
                  "batch_size",
                  "max_new_tokens",
                  "generation_seed",
              ):
                  _configured_seed(evaluation.get(field), f"evaluation.{field}")
              auxiliary = evaluation.get("auxiliary_pass_ks")
              if isinstance(auxiliary, (str, bytes)) or not isinstance(auxiliary, Sequence):
                  raise ValueError("evaluation.auxiliary_pass_ks must be an integer sequence")
              tuple(
                  _configured_seed(value, "evaluation.auxiliary_pass_ks entry")
                  for value in auxiliary
              )
              temperature = _configured_number(
                  evaluation.get("sampling_temperature"),
                  "evaluation.sampling_temperature",
              )
              top_p = _configured_number(evaluation.get("top_p"), "evaluation.top_p")
              generation_seed = _configured_seed(
                  evaluation.get("generation_seed"), "evaluation.generation_seed"
              )
              if (
                  not math.isclose(temperature, 0.8, rel_tol=0.0, abs_tol=1.0e-12)
                  or not math.isclose(top_p, 0.95, rel_tol=0.0, abs_tol=1.0e-12)
                  or generation_seed != 2026070801
              ):
                  raise ValueError("Cold-start stochastic evaluation protocol drifted")

              negative = config["negative_sampling"]
              _configured_seed(
                  negative.get("negatives_per_prompt"),
                  "negative_sampling.negatives_per_prompt",
              )
              expected_negative_flags = {
                  "near_far_selection": False,
                  "selection_stop_gradient": True,
                  "weight_sum_normalization": False,
                  "gradient_budget_matching": False,
              }
              for field, expected in expected_negative_flags.items():
                  if _configured_bool(
                      negative.get(field), f"negative_sampling.{field}"
                  ) is not expected:
                      raise ValueError(f"Cold-start negative_sampling.{field} drifted")

              calibration = config["remoteness_calibration"]
              expected_calibration_flags = {
                  "enabled": False,
                  "detached": True,
                  "extra_square": False,
                  "gradient_rms_matching": False,
              }
              for field, expected in expected_calibration_flags.items():
                  if _configured_bool(
                      calibration.get(field), f"remoteness_calibration.{field}"
                  ) is not expected:
                      raise ValueError(f"Cold-start remoteness_calibration.{field} drifted")

              runtime = config.get("task_runtime", {})
              for task in config["suite"]["tasks"]:
                  task_runtime = runtime.get(task, {})
                  for field in (
                      "max_length",
                      "max_new_tokens",
                      "evaluation_batch_size",
                      "greedy_prompt_rows",
                      "passk_prompt_rows",
                  ):
                      _configured_seed(task_runtime.get(field), f"task_runtime.{task}.{field}")
                  aux = task_runtime.get("auxiliary_pass_ks")
                  if isinstance(aux, (str, bytes)) or not isinstance(aux, Sequence):
                      raise ValueError(
                          f"task_runtime.{task}.auxiliary_pass_ks must be an integer sequence"
                      )
                  tuple(
                      _configured_seed(
                          value, f"task_runtime.{task}.auxiliary_pass_ks entry"
                      )
                      for value in aux
                  )

              selection = config.get("selection", {})
              if _configured_bool(
                  selection.get("finite_required"), "selection.finite_required"
              ) is not True:
                  raise ValueError("Cold-start selection.finite_required must remain true")
              if _configured_bool(
                  selection.get("report_grid_edge"), "selection.report_grid_edge"
              ) is not True:
                  raise ValueError("Cold-start selection.report_grid_edge must remain true")


def experiment_id(config: Mapping[str, Any]) -> str:
''',
          )

          replace_once(
              py,
              '''    expected_parent = EXPERIMENT_ID if profile == SWEEP_PROFILE_DENSE else P0_EXPERIMENT_ID
              if config.get("parent", {}).get("experiment_id") != expected_parent:
                  raise ValueError("Unexpected parent experiment")

              tasks = tuple(config.get("suite", {}).get("tasks", ()))
''',
              '''    expected_parent = EXPERIMENT_ID if profile == SWEEP_PROFILE_DENSE else P0_EXPERIMENT_ID
              if config.get("parent", {}).get("experiment_id") != expected_parent:
                  raise ValueError("Unexpected parent experiment")
              if _is_coldstart(config):
                  _validate_coldstart_scalar_contract(config)

              tasks = tuple(config.get("suite", {}).get("tasks", ()))
''',
          )

          replace_once(
              py,
              '''        selection = config.get("selection", {})
              if (
                  selection.get("primary_metric") != "validation_late_window_pass8_mean"
                  or not bool(selection.get("finite_required", False))
                  or selection.get("terminal_valid_rate_role")
                  != "diagnostic_only_not_selection_eligibility"
                  or tuple(selection.get("tie_breakers", ()))
                  != (
                      "validation_terminal_pass8",
                      "validation_late_window_greedy_mean",
                      "smaller_lambda",
                  )
              ):
                  raise ValueError("Cold-start selection policy drifted")
''',
              '''        selection = config.get("selection", {})
              if (
                  selection.get("primary_metric") != "validation_late_window_pass8_mean"
                  or selection.get("finite_required") is not True
                  or selection.get("report_grid_edge") is not True
                  or selection.get("terminal_valid_rate_role")
                  != "diagnostic_only_not_selection_eligibility"
                  or tuple(selection.get("tie_breakers", ()))
                  != (
                      "validation_terminal_pass8",
                      "validation_late_window_greedy_mean",
                      "smaller_lambda",
                  )
              ):
                  raise ValueError("Cold-start selection policy drifted")
''',
          )

          text = tests.read_text(encoding="utf-8")
          marker = '''def test_generic_coldstart_execution_requires_exact_yaml_types() -> None:\n'''
          extra = '''def test_generic_coldstart_remaining_scalar_contract_is_exact_typed_and_frozen() -> None:\n    from drpo import e8_multitask_exp_tuning as exp_tuning\n\n    config = exp_tuning.load_config(\n        Path("configs/e8_multitask_exp_lambda_curve_completion.yaml")\n    )\n    config["experiment_id"] = "EXT-C-E8-MULTITASK-EXP-SCALAR-LOCK-UNSEEN-TEST"\n\n    cases = (\n        (("parent", "qualified_banks_required"), "true", "must be boolean"),\n        (("reference", "optimizer_updates"), 0.9, "non-negative integer"),\n        (("model", "lora_rank"), 32.9, "non-negative integer"),\n        (("model", "gradient_checkpointing"), "true", "must be boolean"),\n        (("split", "p0_train_rows"), 5000.9, "non-negative integer"),\n        (("split", "test_access_allowed"), 0, "must be boolean"),\n        (("training", "optimizer_updates"), 1200.9, "non-negative integer"),\n        (("training", "learning_rate"), "5e-5", "finite numeric scalar"),\n        (("training", "early_stopping"), 0, "must be boolean"),\n        (("evaluation", "pass_k"), 8.9, "non-negative integer"),\n        (("evaluation", "sampling_temperature"), "0.8", "finite numeric scalar"),\n        (("negative_sampling", "negatives_per_prompt"), 16.9, "non-negative integer"),\n        (("negative_sampling", "selection_stop_gradient"), 1, "must be boolean"),\n        (("remoteness_calibration", "detached"), 1, "must be boolean"),\n        (("selection", "finite_required"), "false", "must be boolean"),\n        (("selection", "report_grid_edge"), 1, "must be boolean"),\n    )\n    for path, invalid, message in cases:\n        bad = copy.deepcopy(config)\n        bad[path[0]][path[1]] = invalid\n        with pytest.raises(ValueError, match=message):\n            exp_tuning.validate_config(bad)\n\n    bad = copy.deepcopy(config)\n    bad["task_runtime"]["word_sorting"]["max_length"] = 512.9\n    with pytest.raises(ValueError, match="non-negative integer"):\n        exp_tuning.validate_config(bad)\n\n    bad = copy.deepcopy(config)\n    bad["task_runtime"]["countdown"]["auxiliary_pass_ks"] = [True]\n    with pytest.raises(ValueError, match="non-negative integer"):\n        exp_tuning.validate_config(bad)\n\n\ndef test_generic_coldstart_stochastic_evaluation_protocol_is_frozen() -> None:\n    from drpo import e8_multitask_exp_tuning as exp_tuning\n\n    config = exp_tuning.load_config(\n        Path("configs/e8_multitask_exp_lambda_curve_completion.yaml")\n    )\n    config["experiment_id"] = "EXT-C-E8-MULTITASK-EXP-EVAL-LOCK-UNSEEN-TEST"\n    for field, value in (\n        ("sampling_temperature", 0.7),\n        ("top_p", 0.9),\n        ("generation_seed", 2026070802),\n    ):\n        bad = copy.deepcopy(config)\n        bad["evaluation"][field] = value\n        with pytest.raises(ValueError, match="stochastic evaluation protocol drifted"):\n            exp_tuning.validate_config(bad)\n\n\n'''
          if marker not in text or "test_generic_coldstart_remaining_scalar_contract_is_exact_typed_and_frozen" in text:
              raise SystemExit("cannot insert tenth-pass scalar-contract tests")
          tests.write_text(text.replace(marker, extra + marker, 1), encoding="utf-8")
          PY
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy PyYAML
      - name: Compile and shell syntax
        run: |
          PYTHONPATH=src python -m py_compile src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh scripts/bootstrap_e8_multitask_exp_coldstart.sh scripts/run_e8_multitask_exp_lambda_completion.sh
      - name: Run full E8 multitask regression tests
        run: PYTHONPATH=src python -m pytest -q tests/test_e8_multitask_p0.py
      - name: Patch hygiene
        run: git diff --check
      - name: Commit validated fixes and remove one-shot workflow
        run: |
          git rm .github/workflows/e8-tenth-pass-review-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'E8: lock remaining scalar and evaluation contract'
          git push origin HEAD:dev/e8-config-driven-sweep-01
