name: E8 Tenth Pass Review Fix

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'dev/e8-config-driven-sweep-01'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply tenth-pass fixes
        run: python scripts/e8_tenth_pass_review_fix.py
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy PyYAML
      - name: Compile and shell syntax
        run: |
          PYTHONPATH=src python -m py_compile src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh scripts/bootstrap_e8_multitask_exp_coldstart.sh scripts/run_e8_multitask_exp_lambda_completion.sh
      - name: Run full E8 multitask regression tests
        run: PYTHONPATH=src python -m pytest -q tests/test_e8_multitask_p0.py
      - name: Patch hygiene
        run: git diff --check
      - name: Commit validated fixes and remove one-shot tooling
        run: |
          git rm .github/workflows/e8-tenth-pass-review-fix.yml scripts/e8_tenth_pass_review_fix.py .e8-tenth-pass-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'E8: lock remaining scalar and evaluation contract'
          git push origin HEAD:dev/e8-config-driven-sweep-01
