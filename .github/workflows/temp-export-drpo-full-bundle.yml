name: TEMP export verified DRPO full bundle

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read
  actions: read

jobs:
  export-full-bundle:
    if: github.event.pull_request.head.ref == 'dev/paper-kdd2027-major-text-results-03'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - run: python -m pip install --quiet matplotlib numpy
      - name: Reproduce verified source tree
        run: |
          set -euo pipefail
          python .github/temp_apply_drpo_manuscript.py
          python scripts/generate_kdd2027_stage_a.py
          python scripts/postprocess_kdd2027_stage_a.py
          python paper/kdd2027/verify_content_lock.py
          echo '043e6cfcd7fc7abe3c2baf17c4f4fc1d883199f58c89ccd21103a683c6c90326  paper/kdd2027/main.tex' | sha256sum --check --strict
      - name: Download verified TeX Live 2025 build outputs
        uses: actions/download-artifact@v4
        with:
          name: drpo-kdd2027-major-text-results-v2
          path: imported-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 30205520002
      - name: Assemble clean final commit and full bundle
        shell: bash
        run: |
          set -euo pipefail
          cp imported-artifact/releases/DRPO_KDD2027_STAGE_A.pdf paper/releases/DRPO_KDD2027_STAGE_A.pdf
          cp imported-artifact/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt paper/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt
          cp imported-artifact/releases/DRPO_KDD2027_OVERLEAF.zip paper/releases/DRPO_KDD2027_OVERLEAF.zip
          expected_pdf="$(awk -F= '$1 == "pdf_sha256" {print $2}' paper/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt)"
          actual_pdf="$(sha256sum paper/releases/DRPO_KDD2027_STAGE_A.pdf | awk '{print $1}')"
          test "$actual_pdf" = "$expected_pdf"
          grep -Fxq 'content_lock=PASS' paper/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt
          grep -Fxq 'render_gate=PASS' paper/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt
          test "$(unzip -Z1 paper/releases/DRPO_KDD2027_OVERLEAF.zip | grep -Ec '^figures/.*\.pdf$')" -eq 9

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-publish-countdown-source.yml
          git rm .github/workflows/temp-run-approved-drpo-import.yml
          git rm .github/workflows/temp-run-approved-drpo-import-v2.yml
          git rm .github/workflows/temp-debug-approved-import.yml
          git rm .github/workflows/temp-debug-stage-import.yml
          git rm .github/workflows/temp-export-drpo-full-bundle.yml
          git rm .github/temp_apply_drpo_manuscript.py
          git add \
            .github/workflows/build-kdd2027-stage-a.yml \
            paper/kdd2027/CONTENT_LOCK.txt \
            paper/kdd2027/README.md \
            paper/kdd2027/build.sh \
            paper/kdd2027/figures/fig_app_countdown_asymre_parameter_response.pdf \
            paper/kdd2027/figures/fig_app_countdown_topr_parameter_response.pdf \
            paper/kdd2027/main.tex \
            paper/kdd2027/source_locked.tex \
            paper/kdd2027/verify_content_lock.py \
            paper/overleaf/figures/fig_app_countdown_asymre_parameter_response.pdf \
            paper/overleaf/figures/fig_app_countdown_topr_parameter_response.pdf \
            paper/overleaf/main_replacement.tex \
            paper/releases/DRPO_KDD2027_STAGE_A.pdf \
            paper/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt \
            paper/releases/DRPO_KDD2027_OVERLEAF.zip \
            scripts/generate_kdd2027_stage_a.py \
            scripts/postprocess_kdd2027_stage_a.py
          git diff --cached --check
          git commit -m 'PAPER-KDD2027-MAJOR-TEXT-RESULTS-01: replace manuscript and release PDF'
          mkdir -p exported
          git bundle create exported/DRPO_KDD2027_MAJOR_TEXT_RESULTS_FULL.bundle --all
          git format-patch --stdout origin/main..HEAD > exported/DRPO_KDD2027_MAJOR_TEXT_RESULTS.patch
          git rev-parse HEAD > exported/FINAL_COMMIT.txt
          git rev-parse HEAD^{tree} > exported/FINAL_TREE.txt
          git rev-parse origin/main^{tree} > exported/BASE_TREE.txt
          git diff --name-status origin/main..HEAD > exported/CHANGED_FILES.txt
      - name: Upload full bundle and verified release
        uses: actions/upload-artifact@v4
        with:
          name: drpo-kdd2027-full-bundle
          path: |
            exported/*
            paper/releases/DRPO_KDD2027_STAGE_A.pdf
            paper/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt
            paper/releases/DRPO_KDD2027_OVERLEAF.zip
          if-no-files-found: error
          retention-days: 30
