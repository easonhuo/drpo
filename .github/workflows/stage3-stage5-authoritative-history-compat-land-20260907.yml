name: Land Stage3 Stage5 authoritative history compatibility repair

on:
  push:
    branches:
      - automation/stage3-stage5-authoritative-history-compat-20260907

permissions:
  contents: write

jobs:
  normalize-test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout clean target branch
        uses: actions/checkout@v4
        with:
          ref: dev/stage3-stage5-authoritative-history-compat-20260907
          fetch-depth: 0
          path: target
          persist-credentials: true

      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: 8a21fd16e63ea96a0cde2a477353d24562624655
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Checkout immutable repair carrier
        uses: actions/checkout@v4
        with:
          ref: 01e0fb1d15a1d089a2852d8525bde968f5212be6
          fetch-depth: 1
          path: carrier
          persist-credentials: false

      - name: Verify locked refs
        shell: bash
        run: |
          set -euo pipefail
          BASE=8a21fd16e63ea96a0cde2a477353d24562624655
          test "$(git -C target rev-parse HEAD)" = "$BASE"
          test "$(git -C trusted rev-parse HEAD)" = "$BASE"
          test "$(git -C carrier rev-parse HEAD)" = "01e0fb1d15a1d089a2852d8525bde968f5212be6"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: target/pyproject.toml

      - name: Install repository development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e './target[dev]'

      - name: Apply deterministic compatibility repair
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          cp ../carrier/tools/tmp_stage3_stage5_repair_20260907.py tools/tmp_stage3_stage5_repair_20260907.py
          python tools/tmp_stage3_stage5_repair_20260907.py
          rm tools/tmp_stage3_stage5_repair_20260907.py
          git diff --check

      - name: Focused compatibility regression
        working-directory: target
        run: python -m pytest tests/test_handoff_delta_shadow.py -q

      - name: Refresh overdue Full Acceptance before registering current update
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_handoff_delta_acceptance.py \
            --repo-root . \
            --tier full \
            --reason successful_relevant_update_interval_reached \
            --reason calendar_interval_with_relevant_update_reached \
            --reason after_critical_semantic_mismatch_fix \
            --report docs/handoff_deltas/GOV-STAGE3-STAGE5-AUTH-HISTORY-COMPAT-2026-09-07/FULL_ACCEPTANCE_REPORT.json \
            | tee "$RUNNER_TEMP/stage3-stage5-full-acceptance.json"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/handoff_deltas/GOV-STAGE3-STAGE5-AUTH-HISTORY-COMPAT-2026-09-07/FULL_ACCEPTANCE_REPORT.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if payload.get('status') != 'PASS' or payload.get('tier') != 'full':
              raise SystemExit('Full Acceptance did not pass')
          print('covered_updates=' + str(payload['coverage']['successful_real_observation_count']))
          PY

      - name: Author schema-v3 governance delta against locked base
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import yaml

          BASE = '8a21fd16e63ea96a0cde2a477353d24562624655'
          UPDATE_ID = 'GOV-STAGE3-STAGE5-AUTH-HISTORY-COMPAT-2026-09-07'
          sys.path.insert(0, str(Path('../trusted/scripts').resolve()))
          import handoff_delta_shadow as shadow

          handoff = subprocess.check_output(['git', 'show', f'{BASE}:docs/handoff.md'], text=True)
          registry = subprocess.check_output(['git', 'show', f'{BASE}:experiments/registry.yaml'], text=True)
          content = (
              '- **Stage-3 / Stage-5 authoritative-history compatibility repair '
              '(`GOV-STAGE3-STAGE5-AUTH-HISTORY-COMPAT-2026-09-07`)：**Stage-3 observation '
              'ledger 现在继承 Stage-5 已冻结的 schema-v3 Git-history 语义：允许 authoritative '
              'delta / materialization report 在 side branch 上完成 pre-integration authoring/revision，'
              '但只承认唯一 first-parent integration commit，并继续 fail-closed 拒绝 integration 后的'
              '任何路径修改或字节漂移。同时 Stage-3 仅跳过 Stage-5 verifier 以 content-addressed '
              '`legacy_inert_update_ids` 明确隔离的历史 schema-v3 delta；任何未被 Stage-5 明确隔离且'
              '缺失 `MATERIALIZATION_REPORT.json` 的条目仍然拒绝。该修复只解决治理层 Stage-3 / '
              'Stage-5 兼容性，不改变任何 DRPO / SNA2C 科学结论、实验职责、变量、seed、阈值或结果。'
              '由于本次修复发生时累计更新数与日历周期均已触发 Full Acceptance，且属于 critical '
              'semantic mismatch repair，本更新同步刷新 durable Full Acceptance coverage。'
          )
          operations = [{
              'operation_id': 'append-stage3-stage5-authoritative-history-compat-repair',
              'op': 'append_to_section',
              'heading_path': [
                  '0. 研究与执行原则（每次新会话首先阅读）',
                  '0.1 当前执行门禁',
              ],
              'block_id': 'stage3-stage5-authoritative-history-compat-repair-2026-09-07',
              'content': content,
          }]
          rendered = shadow.render(handoff, operations)
          shadow.verify_history_preservation(handoff, rendered.text, operations)
          delta = {
              'schema_version': 3,
              'update_id': UPDATE_ID,
              'mode': 'authoritative',
              'base': {
                  'commit': BASE,
                  'handoff_sha256': shadow.sha256_text(handoff),
                  'registry_sha256': shadow.sha256_text(registry),
              },
              'renderer_version': 1,
              'operations': operations,
              'registry': {'mode': 'unchanged'},
              'expected': {
                  'exact_base_candidate_sha256': shadow.sha256_text(rendered.text),
              },
          }
          path = Path('docs/handoff_deltas') / UPDATE_ID / 'HANDOFF_DELTA.yaml'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              yaml.safe_dump(delta, sort_keys=False, allow_unicode=True),
              encoding='utf-8',
          )
          print('base_handoff_sha256=' + delta['base']['handoff_sha256'])
          print('base_registry_sha256=' + delta['base']['registry_sha256'])
          print('candidate_sha256=' + delta['expected']['exact_base_candidate_sha256'])
          PY
          git diff --check

      - name: Create temporary source-patch commit
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/handoff_delta_shadow.py \
            tests/test_handoff_delta_shadow.py \
            docs/handoff_deltas/GOV-STAGE3-STAGE5-AUTH-HISTORY-COMPAT-2026-09-07/HANDOFF_DELTA.yaml \
            docs/handoff_deltas/GOV-STAGE3-STAGE5-AUTH-HISTORY-COMPAT-2026-09-07/FULL_ACCEPTANCE_REPORT.json
          git diff --cached --check
          git commit -m 'Stage3 Stage5 compatibility: temporary source patch'
          echo "SOURCE_PATCH_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate authoritative delta intent with trusted Stage5
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python ../trusted/scripts/handoff_authority.py validate-delta \
            --repo-root . \
            --delta docs/handoff_deltas/GOV-STAGE3-STAGE5-AUTH-HISTORY-COMPAT-2026-09-07/HANDOFF_DELTA.yaml \
            --source-patch-commit "$SOURCE_PATCH_COMMIT" \
            --json

      - name: Trusted Stage5 normalization
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          BASE=8a21fd16e63ea96a0cde2a477353d24562624655
          python ../trusted/scripts/handoff_authority.py normalize \
            --repo-root . \
            --trusted-repo-root ../trusted \
            --current-before "$BASE" \
            --source-base "$BASE" \
            --source-patch-commit "$SOURCE_PATCH_COMMIT" \
            --json | tee "$RUNNER_TEMP/stage5-normalization.json"

      - name: Enforce Stage5 normalization write boundary
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          report = 'docs/handoff_deltas/GOV-STAGE3-STAGE5-AUTH-HISTORY-COMPAT-2026-09-07/MATERIALIZATION_REPORT.json'
          allowed_exact = {'docs/handoff.md', report}
          allowed_prefix = 'docs/handoff_shadow/stage4/minimal/generated/'
          out = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          paths = []
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              paths.append(path)
          bad = sorted(
              path for path in paths
              if path not in allowed_exact and not path.startswith(allowed_prefix)
          )
          if bad:
              raise SystemExit('Unexpected normalization paths: ' + ', '.join(bad))
          if 'docs/handoff.md' not in paths or report not in paths:
              raise SystemExit('Stage5 normalization did not materialize required files')
          print('\n'.join(paths))
          PY
          git diff --check

      - name: Collapse to one clean final commit on locked base
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          BASE=8a21fd16e63ea96a0cde2a477353d24562624655
          DELTA=docs/handoff_deltas/GOV-STAGE3-STAGE5-AUTH-HISTORY-COMPAT-2026-09-07/HANDOFF_DELTA.yaml
          MATERIALIZATION=docs/handoff_deltas/GOV-STAGE3-STAGE5-AUTH-HISTORY-COMPAT-2026-09-07/MATERIALIZATION_REPORT.json
          FULL=docs/handoff_deltas/GOV-STAGE3-STAGE5-AUTH-HISTORY-COMPAT-2026-09-07/FULL_ACCEPTANCE_REPORT.json
          git reset --soft "$BASE"
          git add -A
          git diff --cached --check
          git commit -m 'Fix Stage3 Stage5 authoritative history compatibility'
          FINAL_HEAD=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^1)" = "$BASE"
          test "$(git log --diff-filter=A --format=%H -- "$DELTA")" = "$FINAL_HEAD"
          test "$(git log --diff-filter=A --format=%H -- "$MATERIALIZATION")" = "$FINAL_HEAD"
          test "$(git log --diff-filter=A --format=%H -- "$FULL")" = "$FINAL_HEAD"
          echo "FINAL_HEAD=$FINAL_HEAD" >> "$GITHUB_ENV"

      - name: Required authority and governance gates
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python scripts/handoff_authority.py verify --repo-root . --json
          python scripts/handoff_delta_shadow.py acceptance-status --repo-root . --require-current --json
          python scripts/handoff_delta_shadow.py auto-check --repo-root .
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .
          python scripts/validate_governance_rule_inventory.py --repo-root .
          python scripts/validate_formal_execution_channel.py --repo-root .
          python -m ruff check scripts/handoff_delta_shadow.py tests/test_handoff_delta_shadow.py
          git diff --check "$BASE"..HEAD

      - name: Canonical test selection and execution
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          BASE=8a21fd16e63ea96a0cde2a477353d24562624655
          python scripts/select_update_tests.py \
            --repo . --base "$BASE" --head HEAD --mode auto --json \
            | tee "$RUNNER_TEMP/canonical-test-plan.json"
          python scripts/select_update_tests.py \
            --repo . --base "$BASE" --head HEAD --mode auto --execute --json \
            2>&1 | tee "$RUNNER_TEMP/canonical-tests.log"

      - name: Confirm clean validated worktree
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"

      - name: Push validated repair to target branch
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/dev/stage3-stage5-authoritative-history-compat-20260907
          echo "pushed=$(git rev-parse HEAD)"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-stage5-compat-diagnostics
          path: |
            ${{ runner.temp }}/stage3-stage5-full-acceptance.json
            ${{ runner.temp }}/stage5-normalization.json
            ${{ runner.temp }}/canonical-test-plan.json
            ${{ runner.temp }}/canonical-tests.log
          if-no-files-found: warn
