name: Land Stage3 Stage5 authoritative history compatibility repair

on:
  push:
    branches:
      - automation/stage3-stage5-authoritative-history-compat-20260907

permissions:
  contents: write

jobs:
  maintenance-test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout clean target branch
        uses: actions/checkout@v4
        with:
          ref: dev/stage3-stage5-authoritative-history-compat-20260907
          fetch-depth: 0
          path: target
          persist-credentials: true

      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: 8a21fd16e63ea96a0cde2a477353d24562624655
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Checkout immutable repair carrier
        uses: actions/checkout@v4
        with:
          ref: 01e0fb1d15a1d089a2852d8525bde968f5212be6
          fetch-depth: 1
          path: carrier
          persist-credentials: false

      - name: Verify locked refs
        shell: bash
        run: |
          set -euo pipefail
          BASE=8a21fd16e63ea96a0cde2a477353d24562624655
          test "$(git -C target rev-parse HEAD)" = "$BASE"
          test "$(git -C trusted rev-parse HEAD)" = "$BASE"
          test "$(git -C carrier rev-parse HEAD)" = "01e0fb1d15a1d089a2852d8525bde968f5212be6"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: target/pyproject.toml

      - name: Install repository development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e './target[dev]'

      - name: Apply deterministic compatibility repair
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          cp ../carrier/tools/tmp_stage3_stage5_repair_20260907.py tools/tmp_stage3_stage5_repair_20260907.py
          python tools/tmp_stage3_stage5_repair_20260907.py
          rm tools/tmp_stage3_stage5_repair_20260907.py
          git diff --check

      - name: Focused compatibility regression
        working-directory: target
        run: python -m pytest tests/test_handoff_delta_shadow.py -q

      - name: Refresh overdue Full Acceptance
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          FULL=docs/handoff_deltas/GOV-STAGE3-STAGE5-HISTORY-COMPAT-FULL-ACCEPTANCE-2026-09-07/FULL_ACCEPTANCE_REPORT.json
          python scripts/run_handoff_delta_acceptance.py \
            --repo-root . \
            --tier full \
            --reason successful_relevant_update_interval_reached \
            --reason calendar_interval_with_relevant_update_reached \
            --reason after_critical_semantic_mismatch_fix \
            --report "$FULL" \
            | tee "$RUNNER_TEMP/stage3-stage5-full-acceptance.json"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/handoff_deltas/GOV-STAGE3-STAGE5-HISTORY-COMPAT-FULL-ACCEPTANCE-2026-09-07/FULL_ACCEPTANCE_REPORT.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if payload.get('status') != 'PASS' or payload.get('tier') != 'full':
              raise SystemExit('Full Acceptance did not pass')
          if payload.get('corpus_audit', {}).get('all_stored_reports_revalidated') is not True:
              raise SystemExit('Full Acceptance did not revalidate the stored corpus')
          print('covered_updates=' + str(payload['coverage']['successful_real_observation_count']))
          PY

      - name: Record authorized maintenance scope
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          BASE = '8a21fd16e63ea96a0cde2a477353d24562624655'
          AUTH = 'GOV-STAGE3-STAGE5-HISTORY-COMPAT-MAINTENANCE-2026-09-07'
          CLAIM = 'GOV-STAGE3-STAGE5-HISTORY-COMPAT-MAINTENANCE-01'
          script = Path('scripts/handoff_delta_shadow.py')
          digest = hashlib.sha256(script.read_bytes()).hexdigest()
          auth_path = Path('docs/governance_stage_authorizations') / f'{AUTH}.yaml'
          auth_path.write_text(f'''schema_version: 1
authorization_id: {AUTH}
kind: maintenance
change_class: compatibility_fix
claim_id: {CLAIM}
approval_record: user_approved_continue_stage3_stage5_history_compat_repair_2026_09_07
base_commit: {BASE}
stage_ids:
- stage_3
authorized_stage_statuses:
  stage_3: shadow_active
authorized_file_hashes:
  scripts/handoff_delta_shadow.py: {digest}
scope:
- align_stage3_authoritative_history_resolution_with_stage5_first_parent_integration_semantics
- honor_only_stage5_content_addressed_legacy_inert_quarantine_for_missing_schema_v3_materialization_report
- preserve_fail_closed_behavior_for_all_other_missing_reports_postintegration_touches_and_byte_drift
- add_focused_regressions_for_legacy_inert_skip_and_unlisted_missing_report_rejection
- refresh_overdue_full_acceptance_after_critical_semantic_mismatch_repair
excluded_scope:
- change_handoff_or_registry_write_authority
- change_schema_v3_shapes_or_supported_operations
- add_or_strengthen_scientific_or_experiment_gates
- modify_scientific_code_configs_seeds_thresholds_results_or_claims
- broaden_legacy_inert_quarantine_beyond_stage5_verified_content_addressed_ids
rollback_plan:
- revert_the_stage3_history_compatibility_change_tests_authorization_and_full_acceptance_checkpoint_together
- preserve_all_existing_handoff_delta_materialization_and_scientific_history
remaining_uncertainties:
- the_compatibility_fix_is_bounded_to_history_shapes_already_accepted_by_stage5
- the_single_historical_legacy_inert_delta_remains_quarantined_not_promoted
''', encoding='utf-8')
          scope_path = Path('docs/scopes') / f'{CLAIM}.md'
          scope_path.write_text(f'''# Stage 3 / Stage 5 authoritative-history compatibility maintenance

Base: `main@{BASE}`

This maintenance repair fixes a governance compatibility mismatch exposed while landing the E8 wide-right-tail result closure. Stage 5 already accepts bounded pre-integration side-branch history and content-addresses one historical inert schema-v3 anomaly; Stage 3 still assumed a simpler history and attempted to require a materialization report for every schema-v3 delta.

The repair makes Stage 3 use the same bounded first-parent integration semantics and inherit only the exact `legacy_inert_update_ids` returned by the Stage 5 verifier. Every other missing materialization report, post-integration touch, ambiguous integration, or byte drift remains fail-closed. No handoff content, registry state, scientific implementation, experiment variable, seed, threshold, result, or scientific claim is changed by this maintenance update.

A fresh Full Acceptance is required and persisted because both scheduled triggers were overdue and this is a critical semantic mismatch repair.
''', encoding='utf-8')
          print('authorized_script_sha256=' + digest)
          PY
          git diff --check

      - name: Maintenance governance validation before commit
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python scripts/handoff_authority.py verify --repo-root . --json
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .
          python -m ruff check scripts/handoff_delta_shadow.py tests/test_handoff_delta_shadow.py
          python -m compileall -q scripts/handoff_delta_shadow.py tests/test_handoff_delta_shadow.py
          git diff --check

      - name: Commit maintenance after-image
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          BASE=8a21fd16e63ea96a0cde2a477353d24562624655
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/handoff_delta_shadow.py \
            tests/test_handoff_delta_shadow.py \
            docs/governance_stage_authorizations/GOV-STAGE3-STAGE5-HISTORY-COMPAT-MAINTENANCE-2026-09-07.yaml \
            docs/scopes/GOV-STAGE3-STAGE5-HISTORY-COMPAT-MAINTENANCE-01.md \
            docs/handoff_deltas/GOV-STAGE3-STAGE5-HISTORY-COMPAT-FULL-ACCEPTANCE-2026-09-07/FULL_ACCEPTANCE_REPORT.json
          git diff --cached --check
          git commit -m 'Fix Stage3 Stage5 authoritative history compatibility'
          FINAL_HEAD=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^1)" = "$BASE"
          echo "FINAL_HEAD=$FINAL_HEAD" >> "$GITHUB_ENV"

      - name: Required post-commit authority and governance gates
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          BASE=8a21fd16e63ea96a0cde2a477353d24562624655
          python scripts/handoff_authority.py verify --repo-root . --json
          python scripts/handoff_delta_shadow.py acceptance-status --repo-root . --require-current --json
          python scripts/handoff_delta_shadow.py auto-check --repo-root .
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .
          python scripts/validate_governance_rule_inventory.py --repo-root .
          python scripts/validate_formal_execution_channel.py --repo-root .
          python -m ruff check scripts/handoff_delta_shadow.py tests/test_handoff_delta_shadow.py
          git diff --check "$BASE"..HEAD

      - name: Canonical test selection and execution
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          BASE=8a21fd16e63ea96a0cde2a477353d24562624655
          python scripts/select_update_tests.py \
            --repo . --base "$BASE" --head HEAD --mode auto --json \
            | tee "$RUNNER_TEMP/canonical-test-plan.json"
          python scripts/select_update_tests.py \
            --repo . --base "$BASE" --head HEAD --mode auto --execute --json \
            2>&1 | tee "$RUNNER_TEMP/canonical-tests.log"

      - name: Confirm clean validated worktree
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"

      - name: Push validated repair to target branch
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/dev/stage3-stage5-authoritative-history-compat-20260907
          echo "pushed=$(git rev-parse HEAD)"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-stage5-compat-maintenance-diagnostics
          path: |
            ${{ runner.temp }}/stage3-stage5-full-acceptance.json
            ${{ runner.temp }}/canonical-test-plan.json
            ${{ runner.temp }}/canonical-tests.log
          if-no-files-found: warn
