name: E8 P2 Cleanup (temporary)

on:
  push:
    branches:
      - dev/e8-multitask-training-splits-01
    paths:
      - .github/workflows/e8-p2-cleanup-temp.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Verify cleanup candidates have no external repository consumers
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            RowDataset
            _move_batch
            _stack_encoded
            _trainable_state_sha256
            _raw_gradient_norm
            _calibration_rows
            _generate_completions
          )
          for symbol in "${candidates[@]}"; do
            hits="$(git grep -n -F "$symbol" -- '*.py' \
              ':!src/drpo/e8_multitask_exp_tuning.py' \
              ':!src/drpo/e8_multitask_warmstart_training.py' || true)"
            if [[ -n "$hits" ]]; then
              echo "Refusing to remove $symbol; repository consumers remain:"
              echo "$hits"
              exit 1
            fi
          done

      - name: Remove stale P2 compatibility debris
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/drpo/e8_multitask_exp_tuning.py')
          text = path.read_text(encoding='utf-8')

          def remove_once(line: str, label: str) -> None:
              global text
              count = text.count(line)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(line, '', 1)

          # These aliases were transitional P2 surface only and have no repository
          # consumers. Keep the compatibility symbols explicitly retained by the
          # P2 scope (distance/taper, reference loader, calibration identity/task,
          # completion stats/current extremes/evaluator, and split loader).
          for line, label in (
              ('RowDataset = e8_warmstart.RowDataset\n', 'RowDataset alias'),
              ('_move_batch = e8_warmstart._move_batch\n', '_move_batch alias'),
              ('_stack_encoded = e8_warmstart._stack_encoded\n', '_stack_encoded alias'),
              ('_trainable_state_sha256 = e8_warmstart._trainable_state_sha256\n', '_trainable_state_sha256 alias'),
              ('_raw_gradient_norm = e8_warmstart._raw_gradient_norm\n', '_raw_gradient_norm alias'),
              ('_calibration_rows = e8_warmstart._calibration_rows\n', '_calibration_rows alias'),
              ('_generate_completions = e8_warmstart._generate_completions\n', '_generate_completions alias'),
              ('    import torch.nn.functional as F\n', 'stale torch.nn.functional import'),
              ('    F = None  # type: ignore[assignment]\n', 'stale torch.nn.functional fallback'),
          ):
              remove_once(line, label)

          # The retained compatibility surface must still exist after cleanup.
          retained = (
              'normalized_distance = e8_warmstart.normalized_distance',
              'taper_weight = e8_warmstart.taper_weight',
              'completion_stats_batch = e8_warmstart.completion_stats_batch',
              '_select_current_extremes = e8_warmstart._select_current_extremes',
              '_load_reference_model = e8_warmstart._load_reference_model',
              '_calibration_identity = e8_warmstart._calibration_identity',
              'calibrate_task = e8_warmstart.calibrate_task',
              'evaluate_model = e8_warmstart.evaluate_model',
              '_load_cell_splits = e8_warmstart._load_cell_splits',
          )
          for snippet in retained:
              if snippet not in text:
                  raise SystemExit(f'retained compatibility surface missing: {snippet}')

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_warmstart_training.py
          git diff --check
          git diff --stat

      - name: Focused P2 regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_e8_multitask_p0.py -q
          bash tests/test_e8_method_integration_contract.sh
          ruff check \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_warmstart_training.py

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/e8-p2-cleanup-temp.yml
          git config user.name 'drpo-p2-cleanup-bot'
          git config user.email 'drpo-p2-cleanup-bot@users.noreply.github.com'
          git add src/drpo/e8_multitask_exp_tuning.py
          git diff --cached --check
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No cleanup diff produced'; exit 1; }
          git commit -m 'refactor: clean P2 composition aliases'
          git push origin HEAD:dev/e8-multitask-training-splits-01
