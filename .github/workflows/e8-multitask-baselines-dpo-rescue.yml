name: E8 multitask DPO capability rescue

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-multitask-baselines-dpo-rescue.yml

permissions:
  contents: write

jobs:
  rescue-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract and run DPO patcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/e8-multitask-baselines-dpo-impl.yml').read_text(encoding='utf-8')
          prefix = '      - name: Apply DPO capability patch\n        shell: bash\n        run: |\n'
          suffix = '      - name: Install focused dependencies\n'
          start = source.index(prefix) + len(prefix)
          end = source.index(suffix, start)
          block = source[start:end]

          # The source workflow is intentionally being used only as a patch payload.
          # Its outer run-block lines carry ten YAML spaces, while the embedded raw
          # Python strings contain scientific/test code whose own indentation must
          # remain byte-for-byte intact. Strip the YAML prefix only outside r'''...'''.
          extracted = []
          in_raw = False
          for line in block.splitlines():
              if in_raw:
                  extracted.append(line)
                  if line.strip() == "'''":
                      in_raw = False
                  continue
              normalized = line[10:] if line.startswith('          ') else line
              extracted.append(normalized)
              if normalized.rstrip().endswith("r'''"):
                  in_raw = True
          if in_raw:
              raise RuntimeError('unterminated raw triple-quoted payload in DPO patcher')
          Path('/tmp/dpo_patch.sh').write_text('\n'.join(extracted) + '\n', encoding='utf-8')
          PY
          bash /tmp/dpo_patch.sh
      - name: Install focused dependencies
        run: python -m pip install -q numpy pyyaml pytest
      - name: Validate DPO capability
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check
      - name: Commit DPO capability
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git diff --cached --check
          git commit -m 'feat: add config-driven E8 multitask DPO capability'
          git push origin HEAD:dev/e8-multitask-baselines-capability-01
