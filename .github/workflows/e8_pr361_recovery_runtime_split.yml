name: E8 PR361 Recovery Runtime Split

on:
  push:
    branches:
      - dev/e8-multitask-recovery-runtime-split-01

permissions:
  contents: write

concurrency:
  group: e8-pr361-recovery-runtime-split
  cancel-in-progress: true

jobs:
  transform-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Run recovery/runtime transformation
        run: |
          python .github/e8_pr361_transform.py
          python .github/e8_pr361_test_transform.py

      - name: Structural checks
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          main_path = Path('src/drpo/e8_multitask_exp_tuning.py')
          runtime_path = Path('src/drpo/e8_multitask_runtime.py')
          main = main_path.read_text(encoding='utf-8')
          runtime = runtime_path.read_text(encoding='utf-8')
          if 'e8_multitask_exp_tuning' in runtime:
              raise SystemExit('runtime module names composition root')
          expected_runtime = {
              'read_json_object',
              'successful_attempt_matches_current_identity',
              'effective_recovery_config',
              'reusable_cell_manifests',
              'recovery_stage_plan',
              'hardlink_file',
              'replace_path_prefix',
              'recovery_checkpoint_snapshot',
              'compact_logs',
          }
          runtime_defs = {
              node.name
              for node in ast.parse(runtime).body
              if isinstance(node, ast.FunctionDef)
          }
          missing = expected_runtime - runtime_defs
          if missing:
              raise SystemExit(f'missing runtime functions: {sorted(missing)}')
          if 'import tarfile\n' in main or 'import zipfile\n' in main:
              raise SystemExit('stale main-runner archive imports remain')
          print('structural recovery/runtime split checks passed')
          PY

      - name: Python compile
        run: python -m compileall -q src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_runtime.py tests/test_e8_multitask_p0.py

      - name: Focused E8 regression
        run: python -m pytest -q tests/test_e8_multitask_p0.py

      - name: Ruff changed Python files
        run: ruff check src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_runtime.py tests/test_e8_multitask_p0.py

      - name: Handoff authority
        run: python scripts/handoff_authority.py verify --repo-root .

      - name: Governance stage validation
        run: python scripts/validate_governance_pipeline_stage_status.py --repo-root .

      - name: Characterize inherited main failures
        run: |
          git worktree add /tmp/pr361-base 9d41a784e05dbc8cff1a67379cc3227a926984d8
          set +e
          (
            cd /tmp/pr361-base
            PYTHONPATH=/tmp/pr361-base/src python -m pytest -q \
              tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells \
              tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test
          ) | tee /tmp/pr361-base-failures.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -q '2 failed' /tmp/pr361-base-failures.log

      - name: Broad pytest excluding characterized base failures
        run: |
          python -m pytest -q \
            --deselect=tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py::test_asymre_boundary_dense_has_eight_points_and_sixteen_paired_cells \
            --deselect=tests/test_runspec_results_delivery.py::test_countdown_temporarily_uses_held_out_evaluation_in_place_of_test

      - name: Report line counts
        run: wc -l src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_runtime.py

      - name: Commit successful split and remove temporary files
        run: |
          rm -f .github/e8_pr361_transform.py .github/e8_pr361_test_transform.py .github/workflows/e8_pr361_recovery_runtime_split.yml
          git config user.name 'easonhuo'
          git config user.email 'huoyusen1@126.com'
          git add -A
          git status --short
          git commit -m 'Refactor E8 recovery runtime into runtime module'
          git push origin HEAD:dev/e8-multitask-recovery-runtime-split-01
