name: Temporary lambda completion launcher fix

on:
  push:
    branches:
      - dev/e8-multitask-lambda-completion-clean-02

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-lambda-completion-clean-02
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply launcher and liveness patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              assert count == 1, (path, count, old[:120])
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          config = Path('configs/e8_multitask_exp_lambda_completion.yaml')
          text = config.read_text(encoding='utf-8')
          marker = 'historical_curve_anchor:\n'
          assert marker in text and 'engineering_liveness:' not in text
          text = text.replace(
              marker,
              'engineering_liveness:\n'
              '  task: countdown\n'
              '  lambda: 0.916290732\n'
              '  role: canonical_runtime_smoke_only_not_scientific_cell\n'
              'historical_curve_anchor:\n',
              1,
          )
          config.write_text(text, encoding='utf-8')

          py = Path('src/drpo/e8_multitask_exp_tuning.py')
          old = '''    if task not in config["suite"]["tasks"]:\n        raise ValueError(f"Unknown liveness task: {task}")\n    if rho not in _task_rhos(config, task):\n        raise ValueError("Liveness rho must be one frozen grid point")\n    splits, inputs = _load_ready_inputs(\n'''
          new = '''    if task not in config["suite"]["tasks"]:\n        raise ValueError(f"Unknown liveness task: {task}")\n    frozen_rhos = _task_rhos(config, task)\n    liveness_config = config.get("engineering_liveness", {})\n    configured_anchor_lambda = None\n    if isinstance(liveness_config, Mapping) and str(liveness_config.get("task", "")) == task:\n        value = liveness_config.get("lambda")\n        if value is not None:\n            configured_anchor_lambda = float(value)\n    configured_anchor_rho = (\n        math.exp(-configured_anchor_lambda) if configured_anchor_lambda is not None else None\n    )\n    if rho not in frozen_rhos and not (\n        configured_anchor_rho is not None\n        and math.isclose(rho, configured_anchor_rho, rel_tol=0.0, abs_tol=1.0e-15)\n    ):\n        raise ValueError("Liveness point must be a configured grid point or engineering anchor")\n    splits, inputs = _load_ready_inputs(\n'''
          replace_once(py, old, new)
          old = '''    lambda_value = None\n    if _uses_task_lambdas(config):\n        lambda_value = next(\n            value\n            for value in _task_lambdas(config, task)\n            if math.isclose(math.exp(-value), rho, rel_tol=0.0, abs_tol=1.0e-15)\n        )\n'''
          new = '''    lambda_value = None\n    if _uses_task_lambdas(config):\n        lambda_value = next(\n            (\n                value\n                for value in _task_lambdas(config, task)\n                if math.isclose(math.exp(-value), rho, rel_tol=0.0, abs_tol=1.0e-15)\n            ),\n            configured_anchor_lambda,\n        )\n'''
          replace_once(py, old, new)

          shell = Path('scripts/run_e8_multitask_exp_coldstart.sh')
          replace_once(
              shell,
              'EXPERIMENT_ID="EXT-C-E8-MULTITASK-EXP-COLDSTART-01"\nCONFIG_PATH="${E8_COLDSTART_CONFIG:-${ROOT_DIR}/configs/e8_multitask_exp_coldstart.yaml}"\n',
              'EXPERIMENT_ID="${E8_COLDSTART_EXPERIMENT_ID:-EXT-C-E8-MULTITASK-EXP-COLDSTART-01}"\n'
              'CONFIG_PATH="${E8_COLDSTART_CONFIG:-${ROOT_DIR}/configs/e8_multitask_exp_coldstart.yaml}"\n'
              'CONFIG_SOURCE_REL="${E8_COLDSTART_CONFIG_SOURCE_REL:-configs/e8_multitask_exp_coldstart.yaml}"\n',
          )
          replace_once(
              shell,
              '''liveness() {\n  check_source\n  activate_runtime\n  CUDA_VISIBLE_DEVICES=0 LOCAL_RANK=0 run_module liveness \\\n    --task countdown \\\n    --lambda 0.916290732 \\\n    --base-model-path "${MODEL_DIR}"\n}\n''',
              '''liveness() {\n  check_source\n  activate_runtime\n  local liveness_task\n  local liveness_lambda\n  read -r liveness_task liveness_lambda < <(python - "${CONFIG_PATH}" <<'PY'\nimport sys\nimport yaml\nconfig = yaml.safe_load(open(sys.argv[1], encoding="utf-8"))\nanchor = config.get("engineering_liveness") or {}\nif anchor:\n    print(str(anchor["task"]), float(anchor["lambda"]))\nelse:\n    print("countdown", 0.916290732)\nPY\n)\n  CUDA_VISIBLE_DEVICES=0 LOCAL_RANK=0 run_module liveness \\\n    --task "${liveness_task}" \\\n    --lambda "${liveness_lambda}" \\\n    --base-model-path "${MODEL_DIR}"\n}\n''',
          )
          text = shell.read_text(encoding='utf-8')
          count = text.count('--source-file configs/e8_multitask_exp_coldstart.yaml')
          assert count == 2, count
          text = text.replace('--source-file configs/e8_multitask_exp_coldstart.yaml', '--source-file "${CONFIG_SOURCE_REL}"')
          shell.write_text(text, encoding='utf-8')

          successor = Path('scripts/run_e8_multitask_exp_lambda_completion.sh')
          successor.write_text(
              '#!/usr/bin/env bash\n'
              'set -euo pipefail\n\n'
              'ROOT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"\n'
              'export E8_COLDSTART_EXPERIMENT_ID="EXT-C-E8-MULTITASK-EXP-LAMBDA-COMPLETION-01"\n'
              'export E8_COLDSTART_CONFIG="${ROOT_DIR}/configs/e8_multitask_exp_lambda_completion.yaml"\n'
              'export E8_COLDSTART_CONFIG_SOURCE_REL="configs/e8_multitask_exp_lambda_completion.yaml"\n'
              'export E8_COLDSTART_RUN_ID="${E8_COLDSTART_RUN_ID:-E8_MULTITASK_EXP_LAMBDA_COMPLETION_01}"\n'
              'exec bash "${ROOT_DIR}/scripts/run_e8_multitask_exp_coldstart.sh" "$@"\n',
              encoding='utf-8',
          )
          PY
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile and shell syntax
        run: |
          python -m compileall -q src tests
          bash -n scripts/run_e8_multitask_exp_coldstart.sh scripts/run_e8_multitask_exp_lambda_completion.sh
      - name: Targeted tests
        run: >-
          python -m pytest -q tests/test_e8_multitask_p0.py
          -k 'lambda_completion or lambda_only_canonical_transport_is_exactly_equivalent or exp_coldstart_matrix_is_208_cells_in_13_hard_waves'
      - name: Full multitask test file
        run: python -m pytest -q tests/test_e8_multitask_p0.py
      - name: Fatal Ruff
        run: ruff check --select E9,F63,F7,F82 src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
      - name: Scientific-core identity gate
        run: |
          git diff --quiet 5260ca58ecb67509838a1e5480f6dcaafdb7a773 -- \
            src/drpo/countdown_qwen_arena_onefile.py \
            src/drpo/countdown_e8_alpha1_c_scan_common.py \
            src/drpo/countdown_e8_alpha1_c_scan_runtime.py \
            src/drpo/countdown_e8_alpha1_c_scan_trainer.py \
            src/drpo/countdown_e8_alpha1_highc_scan_common.py \
            src/drpo/countdown_e8_alpha1_highc_scan_runtime.py
      - name: Config-only successor facts gate
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          text = Path('src/drpo/e8_multitask_exp_tuning.py').read_text(encoding='utf-8')
          tree = ast.parse(text)
          forbidden = {'8000', '9000'}
          literals = {str(node.value) for node in ast.walk(tree) if isinstance(node, ast.Constant)}
          assert not (forbidden & literals), forbidden & literals
          assert '34.538776395' not in text
          assert '11.5' not in text
          assert '40.0' not in text
          assert '30.0' not in text
          assert '26.0' not in text
          PY
      - name: Commit validated launcher support
        run: |
          rm .github/workflows/tmp-e8-lambda-launch-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configs/e8_multitask_exp_lambda_completion.yaml src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py scripts/run_e8_multitask_exp_coldstart.sh scripts/run_e8_multitask_exp_lambda_completion.sh .github/workflows/tmp-e8-lambda-launch-fix.yml
          git commit -m 'E8: add config-driven successor launch support'
          git push origin HEAD:dev/e8-multitask-lambda-completion-clean-02
