name: TEMP publish KDD compressed release PDF

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  publish-release:
    if: github.event.pull_request.head.ref == 'dev/paper-kdd2027-compression-batch1-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/paper-kdd2027-compression-batch1-01
          fetch-depth: 0

      - name: Check whether canonical release already matches main.tex
        id: release_state
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(sha256sum paper/kdd2027/main.tex | awk '{print $1}')"
          echo "main_sha=${main_sha}" >> "$GITHUB_OUTPUT"
          current=false
          if [[ -s paper/releases/DRPO_KDD2027_STAGE_A.pdf ]] && \
             [[ -s paper/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt ]] && \
             grep -Fxq "main_tex_sha256=${main_sha}" paper/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt; then
            current=true
          fi
          echo "current=${current}" >> "$GITHUB_OUTPUT"

      - name: Verify locked source and local assets
        if: steps.release_state.outputs.current != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_kdd2027_stage_a.py
          python scripts/postprocess_kdd2027_stage_a.py
          python paper/kdd2027/verify_content_lock.py
          git diff --exit-code -- paper/kdd2027/main.tex paper/kdd2027/verify_content_lock.py paper/kdd2027/build.sh paper/kdd2027/README.md paper/kdd2027/CONTENT_LOCK.txt
          required_figures=(
            figure1_external_gradient_d4rl9.pdf
            fig_6_3_1_source_heatmap.pdf
            fig_6_3_2_rescue_plot.pdf
            fig_6_4_1_phase_transition.pdf
            fig_6_4_2_leftfig_bigtext_legend_protocol.pdf
            fig_app_d4rl9_gradient_panels.pdf
            fig_app_countdown_taper_coefficient_response.pdf
          )
          for figure in "${required_figures[@]}"; do
            test -s "paper/kdd2027/figures/${figure}"
          done
          test -s paper/kdd2027/example_paper.bib
          test -s paper/kdd2027/missing_references.bib

      - name: Install PDF audit tools
        if: steps.release_state.outputs.current != 'true'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y poppler-utils

      - name: Compile canonical release with TeX Live 2025
        if: steps.release_state.outputs.current != 'true'
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2025
          os: debian
          run: |
            set -euo pipefail
            cd paper/kdd2027
            rm -f BUILD_AUDIT.txt PDFINFO.txt PDFFONTS.txt main.log main.blg
            pdflatex --version > TEXLIVE_ENVIRONMENT.txt
            latexmk -C main.tex >/dev/null 2>&1 || true
            latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
            test -s main.pdf
            grep -Fq 'TeX Live 2025' TEXLIVE_ENVIRONMENT.txt

      - name: Audit compiled canonical release
        if: steps.release_state.outputs.current != 'true'
        env:
          DRPO_SKIP_LATEX_COMPILE: '1'
        shell: bash
        run: |
          set -euo pipefail
          bash paper/kdd2027/build.sh
          grep -Fxq 'pages=27' paper/kdd2027/BUILD_AUDIT.txt
          grep -Fxq 'required_figures=7' paper/kdd2027/BUILD_AUDIT.txt
          grep -Fxq 'content_lock=PASS' paper/kdd2027/BUILD_AUDIT.txt
          grep -Fxq 'latex_diagnostics=PASS' paper/kdd2027/BUILD_AUDIT.txt
          grep -Fxq 'font_embedding=PASS' paper/kdd2027/BUILD_AUDIT.txt
          grep -Fxq 'render_gate=PASS' paper/kdd2027/BUILD_AUDIT.txt

      - name: Commit canonical release PDF and audit
        if: steps.release_state.outputs.current != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paper/releases
          cp paper/kdd2027/main.pdf paper/releases/DRPO_KDD2027_STAGE_A.pdf
          main_sha="$(sha256sum paper/kdd2027/main.tex | awk '{print $1}')"
          pdf_sha="$(sha256sum paper/releases/DRPO_KDD2027_STAGE_A.pdf | awk '{print $1}')"
          {
            echo 'claim=PAPER-KDD2027-COMPRESSION-8PAGE-01'
            echo "source_commit=${GITHUB_SHA}"
            echo "main_tex_sha256=${main_sha}"
            echo 'source_sha256=e806281a5f244e5ee3c437626e3705ba84124705bb57d954326b35d92f933765'
            echo 'canonical_content_sha256=d5f312cecc39b23e9f49224df837da8c7fede18cc1f9d5421565508f3cb3c069'
            echo 'pages=27'
            echo 'main_text_pages=8'
            echo 'required_figures=7'
            echo 'texlive_version=2025'
            echo "pdf_sha256=${pdf_sha}"
            echo 'content_lock=PASS'
            echo 'latex_diagnostics=PASS'
            echo 'font_embedding=PASS'
            echo 'render_gate=PASS'
          } > paper/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/releases/DRPO_KDD2027_STAGE_A.pdf paper/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt
          git commit -m 'PAPER-KDD2027-COMPRESSION-8PAGE-RELEASE-01: publish canonical PDF'
          git push origin HEAD:dev/paper-kdd2027-compression-batch1-01
