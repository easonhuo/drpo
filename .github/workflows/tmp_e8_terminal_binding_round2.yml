name: Temporary E8 terminal chain closure round2

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/tmp_e8_terminal_binding_round2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install validation dependencies
        run: python -m pip install pyyaml pytest ruff numpy
      - name: Apply validate and publish
        run: bash .github/workflows/tmp_e8_terminal_binding_round2_fix.sh
