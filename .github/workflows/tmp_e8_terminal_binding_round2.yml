          marker = '## Terminal chain mutation closure (2026-09-11)'
          if marker not in text:
              text += '''\n\n## Terminal chain mutation closure (2026-09-11)\n\nContinued pre-run review found that the already-authorized terminal-evidence contract must bind not only the aggregate to the exact cell-manifest set, but also the terminal audit to the exact scheduler result/event bytes it audited and the aggregate summary to its user-facing derived CSV/diagnostic files. Otherwise a post-audit scheduler-event mutation, or a post-aggregate derived-output mutation, could leave stale downstream completion markers apparently usable.\n\nFor the formal baseline matrix, `aggregate_summary.json` therefore records and revalidates SHA-256 for `all_cells.csv`, `plot_curve_points.csv`, `task_summary.csv`, and `countdown_protocol_diagnostic.json`. `terminal_audit.json` records and revalidates SHA-256 for `scheduler/dynamic_run.json` and `scheduler/queue_events.jsonl`, in addition to its existing cell-manifest-set and aggregate-summary bindings. Recovery planning, finalize/package completion markers, and successful-attempt reuse must reject stale or mutated members of this chain. Packaged completed-attempt reuse must byte-match these bound scheduler and aggregate artifacts to the live workload.\n\nThis closes the already-approved exact scheduler-event identity and terminal evidence binding requirements; it introduces no new scientific threshold or experiment responsibility. The 176 cells, seeds `[4000,5000]`, hard seed barrier, AsymRE/TOPR/DPO grids, 1,200-update horizon, optimizer/evaluator settings, historical PR #268 DPO semantics, and **not_run** status are unchanged.\n'''
              path.write_text(text, encoding='utf-8')
          PY
          git add docs/scopes/E8_MULTITASK_BASELINES_CAPABILITY_DEV.md
          git diff --cached --check
          git commit -m 'docs: close E8 terminal chain mutation semantics'

