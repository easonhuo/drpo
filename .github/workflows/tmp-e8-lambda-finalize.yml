name: Temporary E8 lambda finalize repair

on:
  push:
    branches:
      - dev/e8-multitask-lambda-completion-repair-03-finalize

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-lambda-completion-repair-03-finalize
          fetch-depth: 0
      - name: Apply validate and commit final repair
        shell: bash
        run: |
          sed -i 's/text = text.rstrip() + section + "\\n"/text = text.rstrip() + section.rstrip() + "\\n"/' .github/tmp_e8_finalize_apply.sh
          bash .github/tmp_e8_finalize_apply.sh
