name: TEMP debug approved DRPO import

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  debug-transform:
    if: github.event.pull_request.head.ref == 'dev/paper-kdd2027-major-text-results-03'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Run transformation with compact diagnostics
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile

          lines = Path('.github/workflows/temp-publish-countdown-source.yml').read_text(encoding='utf-8').splitlines()
          marker = '- name: Apply approved Countdown manuscript changes'
          start = next(i for i, line in enumerate(lines) if line.strip() == marker)
          run_line = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
          run_indent = len(lines[run_line]) - len(lines[run_line].lstrip())
          out = []
          for line in lines[run_line + 1:]:
              if line.strip():
                  indent = len(line) - len(line.lstrip())
                  if indent <= run_indent:
                      break
                  out.append(line[run_indent + 2:])
              else:
                  out.append('')
          script = '\n'.join(out) + '\n'
          script = script.replace(
              "test \"$(git rev-parse HEAD^)\" = 'fd38cf0ce7a08a31ae2d601c343e83f1656811b7'",
              "test \"$(git merge-base HEAD fd38cf0ce7a08a31ae2d601c343e83f1656811b7)\" = 'fd38cf0ce7a08a31ae2d601c343e83f1656811b7'",
              1,
          )
          with tempfile.NamedTemporaryFile('w', suffix='.sh', delete=False) as handle:
              handle.write(script)
              path = handle.name
          result = subprocess.run(['bash', path], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          report = '\n'.join([
              'SCRIPT_FIRST_LINES',
              '\n'.join(script.splitlines()[:12]),
              'SCRIPT_OUTPUT',
              result.stdout,
              f'RETURN_CODE={result.returncode}',
          ])
          Path('debug-import.txt').write_text(report, encoding='utf-8')
          print(report[-12000:])
          raise SystemExit(result.returncode)
          PY
      - name: Upload compact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drpo-import-debug
          path: debug-import.txt
          if-no-files-found: error
          retention-days: 2
