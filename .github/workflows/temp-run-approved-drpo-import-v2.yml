name: TEMP run approved DRPO manuscript import v2

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  import-build-publish:
    if: github.event.pull_request.head.ref == 'dev/paper-kdd2027-major-text-results-03'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Install plotting and PDF audit dependencies
        run: |
          python -m pip install --quiet matplotlib numpy
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y poppler-utils zip

      - name: Apply approved manuscript source and figure updates
        run: python .github/temp_apply_drpo_manuscript.py

      - name: Regenerate and verify exact manuscript
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_kdd2027_stage_a.py
          python scripts/postprocess_kdd2027_stage_a.py
          python paper/kdd2027/verify_content_lock.py
          echo '043e6cfcd7fc7abe3c2baf17c4f4fc1d883199f58c89ccd21103a683c6c90326  paper/kdd2027/main.tex' | sha256sum --check --strict
          echo 'e64b74012a050f61e87c1601a301f2c5c452a9421d7e570d28098c74eb21a966  paper/kdd2027/source_locked.tex' | sha256sum --check --strict
          cmp paper/kdd2027/source_locked.tex paper/overleaf/main_replacement.tex

      - name: Compile with TeX Live 2025
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2025
          os: debian
          run: |
            cd paper/kdd2027
            rm -f BUILD_AUDIT.txt PDFINFO.txt PDFFONTS.txt main.log main.blg
            pdflatex --version | tee TEXLIVE_ENVIRONMENT.txt
            latexmk -C main.tex >/dev/null 2>&1 || true
            latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
            test -s main.pdf
            grep -Fq 'TeX Live 2025' TEXLIVE_ENVIRONMENT.txt

      - name: Audit PDF and assemble release files
        shell: bash
        env:
          DRPO_SKIP_LATEX_COMPILE: '1'
        run: |
          set -euo pipefail
          bash paper/kdd2027/build.sh
          mkdir -p paper/releases
          cp paper/kdd2027/main.pdf paper/releases/DRPO_KDD2027_STAGE_A.pdf
          pages="$(awk -F= '$1 == "pages" {print $2}' paper/kdd2027/BUILD_AUDIT.txt)"
          rendered_pages="$(awk -F= '$1 == "rendered_pages" {print $2}' paper/kdd2027/BUILD_AUDIT.txt)"
          [[ "$pages" =~ ^[1-9][0-9]*$ ]]
          [[ "$rendered_pages" == "$pages" ]]
          grep -Fxq 'required_figures=9' paper/kdd2027/BUILD_AUDIT.txt
          {
            echo 'claim=PAPER-KDD2027-MAJOR-TEXT-RESULTS-01'
            echo "build_input_commit=${GITHUB_SHA}"
            echo 'main_tex_sha256=043e6cfcd7fc7abe3c2baf17c4f4fc1d883199f58c89ccd21103a683c6c90326'
            cat paper/kdd2027/BUILD_AUDIT.txt
            echo 'main_text_pages=8'
            echo 'all_pages_rendered_for_visual_audit=PASS'
          } > paper/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt
          rm -f paper/releases/DRPO_KDD2027_OVERLEAF.zip
          (
            cd paper/kdd2027
            zip -r ../releases/DRPO_KDD2027_OVERLEAF.zip \
              main.tex acmart.cls ACM-Reference-Format.bst \
              example_paper.bib missing_references.bib figures README.md
          )
          test "$(unzip -Z1 paper/releases/DRPO_KDD2027_OVERLEAF.zip | grep -Ec '^figures/.*\.pdf$')" -eq 9

      - name: Commit approved manuscript and release to dev branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-publish-countdown-source.yml
          git rm .github/workflows/temp-run-approved-drpo-import.yml
          git rm .github/workflows/temp-run-approved-drpo-import-v2.yml
          git rm .github/workflows/temp-debug-approved-import.yml
          git rm .github/temp_apply_drpo_manuscript.py
          git add \
            .github/workflows/build-kdd2027-stage-a.yml \
            paper/kdd2027/CONTENT_LOCK.txt \
            paper/kdd2027/README.md \
            paper/kdd2027/build.sh \
            paper/kdd2027/figures/fig_app_countdown_asymre_parameter_response.pdf \
            paper/kdd2027/figures/fig_app_countdown_topr_parameter_response.pdf \
            paper/kdd2027/main.tex \
            paper/kdd2027/source_locked.tex \
            paper/kdd2027/verify_content_lock.py \
            paper/overleaf/figures/fig_app_countdown_asymre_parameter_response.pdf \
            paper/overleaf/figures/fig_app_countdown_topr_parameter_response.pdf \
            paper/overleaf/main_replacement.tex \
            paper/releases/DRPO_KDD2027_STAGE_A.pdf \
            paper/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt \
            paper/releases/DRPO_KDD2027_OVERLEAF.zip \
            scripts/generate_kdd2027_stage_a.py \
            scripts/postprocess_kdd2027_stage_a.py
          git diff --cached --check
          git commit -m 'PAPER-KDD2027-MAJOR-TEXT-RESULTS-01: replace manuscript and release PDF'
          git push origin HEAD:dev/paper-kdd2027-major-text-results-03

      - name: Upload compiled release and visual audit material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drpo-kdd2027-major-text-results-v2
          path: |
            paper/kdd2027/main.pdf
            paper/kdd2027/BUILD_AUDIT.txt
            paper/kdd2027/PDFINFO.txt
            paper/kdd2027/PDFFONTS.txt
            paper/kdd2027/TEXLIVE_ENVIRONMENT.txt
            paper/kdd2027/main.log
            paper/kdd2027/main.blg
            paper/kdd2027/renders/page-*.png
            paper/releases/DRPO_KDD2027_STAGE_A.pdf
            paper/releases/DRPO_KDD2027_STAGE_A_AUDIT.txt
            paper/releases/DRPO_KDD2027_OVERLEAF.zip
          if-no-files-found: warn
          retention-days: 30
