name: Temporary E8 successor delta materialization

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/tmp_e8_successor_delta.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure and install validation dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m pip install pyyaml pytest ruff numpy
      - name: Author, normalize, validate, and publish successor delta
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD)"
          git worktree add --detach /tmp/e8-trusted "${BASE}"
          git worktree add --detach /tmp/e8-source "${BASE}"

          (
            cd /tmp/e8-source
            BASE="${BASE}" python - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import sys
          from pathlib import Path

          import yaml

          sys.path.insert(0, str(Path("scripts").resolve()))
          import handoff_delta_shadow as shadow

          base = os.environ["BASE"]
          update_id = "EXT-C-E8-MULTITASK-BASELINE-MATRIX-01-RECOVERY-TERMINAL-EVIDENCE-CORRECTION-2026-09-11"
          delta_dir = Path("docs/handoff_deltas") / update_id
          delta_path = delta_dir / "HANDOFF_DELTA.yaml"
          if delta_dir.exists():
              raise SystemExit(f"delta already exists: {delta_dir}")

          handoff_path = Path("docs/handoff.md")
          registry_path = Path("experiments/registry.yaml")
          handoff_text = handoff_path.read_text(encoding="utf-8")
          registry_before = registry_path.read_text(encoding="utf-8")

          old = "    seed_batch_temporal_event_history_check: true\n"
          if registry_before.count(old) != 1:
              raise SystemExit(
                  "expected exactly one legacy seed_batch_temporal_event_history_check=true"
              )
          registry_after = registry_before.replace(
              old,
              "    seed_batch_temporal_event_history_check: false\n",
              1,
          )
          anchor = (
              "    temporal_condition: "
              "max_seed_4000_successful_finish_time_le_min_seed_5000_start_time\n"
          )
          if registry_after.count(anchor) != 1:
              raise SystemExit("expected exactly one E8 temporal_condition anchor")
          registry_after = registry_after.replace(
              anchor,
              anchor
              + "    recovery_reuse_eligibility_scope: global_seed_chronology\n"
              + "    later_seed_reuse_requires_all_earlier_seed_reuse_eligible: true\n"
              + "    aggregate_cell_manifest_set_sha256_check: true\n"
              + "    aggregate_artifact_sha256_check: true\n"
              + "    scheduler_dynamic_run_sha256_check: true\n"
              + "    scheduler_queue_events_sha256_check: true\n"
              + "    completed_attempt_live_vs_packaged_terminal_byte_check: true\n",
              1,
          )
          registry_path.write_text(registry_after, encoding="utf-8")

          content = (
              "- **E8 multitask baseline recovery / terminal-evidence successor correction "
              "(`EXT-C-E8-MULTITASK-BASELINE-MATRIX-01`)：**本条覆盖旧字段名可能造成的歧义，"
              "不改动已冻结的 176-cell 科学矩阵、8 个 transfer tasks、seeds `[4000,5000]`、"
              "AsymRE/TOPR/DPO 网格、1200-update horizon、optimizer 或 historical Countdown "
              "PR #268 DPO 语义。`scheduler/queue_events.jsonl` 的 wall-clock 时间明确**不**作为 "
              "seed chronology 科学证据；其职责仅为 exact cell identity、无重复/无缺失和 "
              "`execution_origin` 审计，因此 registry 中旧的 `seed_batch_temporal_event_history_check` "
              "退役为 `false`。真正的 seed-4000→5000 时间顺序继续只由各 cell manifest 中持久化的 "
              "`scientific_execution_provenance.started_unix/successful_finish_unix` 证明。recovery reuse "
              "按全局 seed chronology 计算：任一较早 seed 需要重跑时，所有较晚 seed 的旧 reuse 一并失效；"
              "reuse 必须保留原始 scientific provenance，禁止把 complete-but-reuse-invalid cell 重新打时间戳。"
              "终态证据链进一步 fail-closed：aggregate 绑定当前全部 cell-manifest bytes 与 deterministic "
              "aggregate CSV/diagnostic bytes；terminal audit 绑定 aggregate、`scheduler/dynamic_run.json` 和 "
              "`queue_events.jsonl` bytes；`RUN_COMPLETE.json` 继续绑定 audit/aggregate/scheduler evidence，"
              "completed-attempt fast path 还要求 live terminal evidence 与 packaged workload 对应文件逐字节一致。"
              "任何 post-aggregate / post-audit mutation 都必须使 recovery/finalize/reuse 退回到相应阶段。"
              "科学状态继续为 **not_run**，本修正既不启动实验，也不授予 merge/launch permission。"
          )
          operations = [
              {
                  "operation_id": "append-e8-baseline-recovery-terminal-evidence-correction",
                  "op": "append_to_section",
                  "heading_path": [
                      "0. 研究与执行原则（每次新会话首先阅读）",
                      "0.1 当前执行门禁",
                  ],
                  "block_id": "e8-multitask-baseline-recovery-terminal-evidence-correction-2026-09-11",
                  "content": content,
              }
          ]
          candidate = shadow.render(handoff_text, operations).text
          evidence = [
              "docs/scopes/E8_MULTITASK_BASELINES_CAPABILITY_DEV.md",
              "src/drpo/e8_multitask_exp_tuning.py",
              "tests/test_e8_multitask_p0.py",
              "experiments/registry.yaml",
          ]
          changes = [
              {
                  "change_id": "retire-queue-event-temporal-authority",
                  "kind": "update_field",
                  "entity_id": "EXT-C-E8-MULTITASK-BASELINE-MATRIX-01",
                  "field_path": ["terminal_audit", "seed_batch_temporal_event_history_check"],
                  "from": True,
                  "to": False,
                  "reason": "Queue-event wall time is not authoritative scientific seed chronology.",
                  "evidence": evidence,
              },
              {
                  "change_id": "record-global-recovery-reuse-scope",
                  "kind": "update_field",
                  "entity_id": "EXT-C-E8-MULTITASK-BASELINE-MATRIX-01",
                  "field_path": ["terminal_audit", "recovery_reuse_eligibility_scope"],
                  "from": None,
                  "to": "global_seed_chronology",
                  "reason": "Recovery eligibility is evaluated across the ordered seed batches.",
                  "evidence": evidence,
              },
              {
                  "change_id": "record-later-seed-reuse-cascade",
                  "kind": "update_field",
                  "entity_id": "EXT-C-E8-MULTITASK-BASELINE-MATRIX-01",
                  "field_path": ["terminal_audit", "later_seed_reuse_requires_all_earlier_seed_reuse_eligible"],
                  "from": None,
                  "to": True,
                  "reason": "An earlier-seed rerun invalidates reuse of all later-seed old evidence.",
                  "evidence": evidence,
              },
              {
                  "change_id": "record-cell-manifest-set-binding",
                  "kind": "update_field",
                  "entity_id": "EXT-C-E8-MULTITASK-BASELINE-MATRIX-01",
                  "field_path": ["terminal_audit", "aggregate_cell_manifest_set_sha256_check"],
                  "from": None,
                  "to": True,
                  "reason": "Aggregate identity binds the exact ordered current cell-manifest set.",
                  "evidence": evidence,
              },
              {
                  "change_id": "record-aggregate-artifact-binding",
                  "kind": "update_field",
                  "entity_id": "EXT-C-E8-MULTITASK-BASELINE-MATRIX-01",
                  "field_path": ["terminal_audit", "aggregate_artifact_sha256_check"],
                  "from": None,
                  "to": True,
                  "reason": "Aggregate identity binds deterministic reporting CSV and diagnostic bytes.",
                  "evidence": evidence,
              },
              {
                  "change_id": "record-scheduler-manifest-binding",
                  "kind": "update_field",
                  "entity_id": "EXT-C-E8-MULTITASK-BASELINE-MATRIX-01",
                  "field_path": ["terminal_audit", "scheduler_dynamic_run_sha256_check"],
                  "from": None,
                  "to": True,
                  "reason": "Terminal audit binds scheduler/dynamic_run.json bytes.",
                  "evidence": evidence,
              },
              {
                  "change_id": "record-queue-event-binding",
                  "kind": "update_field",
                  "entity_id": "EXT-C-E8-MULTITASK-BASELINE-MATRIX-01",
                  "field_path": ["terminal_audit", "scheduler_queue_events_sha256_check"],
                  "from": None,
                  "to": True,
                  "reason": "Terminal audit binds scheduler/queue_events.jsonl bytes for identity/origin audit.",
                  "evidence": evidence,
              },
              {
                  "change_id": "record-live-package-terminal-byte-binding",
                  "kind": "update_field",
                  "entity_id": "EXT-C-E8-MULTITASK-BASELINE-MATRIX-01",
                  "field_path": ["terminal_audit", "completed_attempt_live_vs_packaged_terminal_byte_check"],
                  "from": None,
                  "to": True,
                  "reason": "Completed-attempt reuse requires live terminal evidence to match packaged bytes.",
                  "evidence": evidence,
              },
          ]
          delta = {
              "schema_version": 3,
              "update_id": update_id,
              "mode": "authoritative",
              "base": {
                  "commit": base,
                  "handoff_sha256": shadow.sha256_text(handoff_text),
                  "registry_sha256": shadow.sha256_text(registry_before),
              },
              "renderer_version": 1,
              "operations": operations,
              "registry": {
                  "mode": "expected_after",
                  "exact_base_after_sha256": shadow.sha256_text(registry_after),
                  "changes": changes,
              },
              "expected": {
                  "exact_base_candidate_sha256": shadow.sha256_text(candidate),
              },
          }
          delta_dir.mkdir(parents=True)
          delta_path.write_text(
              yaml.safe_dump(delta, sort_keys=False, allow_unicode=True),
              encoding="utf-8",
          )
          PY
            git add experiments/registry.yaml docs/handoff_deltas
            git commit -m "docs: author E8 terminal evidence successor delta"
          )
          SOURCE_COMMIT="$(git -C /tmp/e8-source rev-parse HEAD)"

          cp /tmp/e8-source/experiments/registry.yaml experiments/registry.yaml
          UPDATE_ID="EXT-C-E8-MULTITASK-BASELINE-MATRIX-01-RECOVERY-TERMINAL-EVIDENCE-CORRECTION-2026-09-11"
          mkdir -p "docs/handoff_deltas/${UPDATE_ID}"
          cp "/tmp/e8-source/docs/handoff_deltas/${UPDATE_ID}/HANDOFF_DELTA.yaml" \
             "docs/handoff_deltas/${UPDATE_ID}/HANDOFF_DELTA.yaml"

          python /tmp/e8-trusted/scripts/handoff_authority.py validate-delta \
            --repo-root . \
            --delta "docs/handoff_deltas/${UPDATE_ID}/HANDOFF_DELTA.yaml" \
            --source-patch-commit "${SOURCE_COMMIT}" \
            --json

          python /tmp/e8-trusted/scripts/handoff_authority.py normalize \
            --repo-root . \
            --trusted-repo-root /tmp/e8-trusted \
            --current-before "${BASE}" \
            --source-base "${BASE}" \
            --source-patch-commit "${SOURCE_COMMIT}" \
            --json

          git rm -f .github/workflows/tmp_e8_successor_delta.yml
          git add -A
          git commit -m "docs: register E8 recovery terminal evidence correction"

          python scripts/handoff_authority.py verify --repo-root . --json
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .
          python -m pytest -q tests/test_e8_multitask_p0.py
          ruff check src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          PYTHONPATH=src python scripts/preflight_e8_multitask_config.py \
            --config configs/e8_multitask_baseline_matrix_formal.yaml
          git diff --check HEAD^ HEAD
          test "$(git status --porcelain)" = ""
          git push origin HEAD:dev/e8-multitask-baselines-capability-01
