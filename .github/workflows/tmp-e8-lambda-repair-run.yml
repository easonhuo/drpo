name: Temporary E8 lambda repair runner

on:
  push:
    branches:
      - dev/e8-multitask-lambda-completion-repair-02

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-lambda-completion-repair-02
          fetch-depth: 0
      - name: Apply and validate repair
        shell: bash
        run: |
          sed -i '/36f0ac540edc5b399e9a30ea4bd0a30c030808aa79477cb6e3db28f5688d898d/d' .github/tmp_e8_lambda_repair_apply.sh
          bash .github/tmp_e8_lambda_repair_apply.sh
