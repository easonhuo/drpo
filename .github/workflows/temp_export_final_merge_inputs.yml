name: TEMP export final manuscript merge inputs

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/paper-kdd2027-batch2-preview-20260726
          fetch-depth: 0
      - name: Collect exact merge inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f4ecddfc58ad11a2f7a7082e79a9e0038b25d582"
          mkdir -p final_merge_inputs/paper/kdd2027 final_merge_inputs/paper/overleaf final_merge_inputs/scripts final_merge_inputs/.github/workflows
          cp paper/kdd2027/main.tex final_merge_inputs/paper/kdd2027/
          cp paper/kdd2027/source_locked.tex final_merge_inputs/paper/kdd2027/
          cp paper/kdd2027/verify_content_lock.py final_merge_inputs/paper/kdd2027/
          cp paper/kdd2027/build.sh final_merge_inputs/paper/kdd2027/
          cp paper/kdd2027/example_paper.bib final_merge_inputs/paper/kdd2027/
          cp paper/kdd2027/missing_references.bib final_merge_inputs/paper/kdd2027/
          cp paper/kdd2027/acmart.cls final_merge_inputs/paper/kdd2027/
          cp paper/kdd2027/ACM-Reference-Format.bst final_merge_inputs/paper/kdd2027/
          cp paper/overleaf/main_replacement.tex final_merge_inputs/paper/overleaf/
          cp .github/workflows/build-kdd2027-stage-a.yml final_merge_inputs/.github/workflows/
          cp scripts/generate_kdd2027_stage_a.py final_merge_inputs/scripts/
          cp scripts/postprocess_kdd2027_stage_a.py final_merge_inputs/scripts/
          cp -r paper/kdd2027/figures final_merge_inputs/paper/kdd2027/
          git show 620758fd2f2bc1037a26a791c7e9521d814f6814:paper/kdd2027/main.tex > final_merge_inputs/paper/kdd2027/main_base_620758f.tex
          git diff 620758fd2f2bc1037a26a791c7e9521d814f6814..f4ecddfc58ad11a2f7a7082e79a9e0038b25d582 -- paper/kdd2027/main.tex > final_merge_inputs/batch1_main.patch
          sha256sum final_merge_inputs/paper/kdd2027/* final_merge_inputs/paper/overleaf/* > final_merge_inputs/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: temp-final-manuscript-merge-inputs
          path: final_merge_inputs/
          if-no-files-found: error
