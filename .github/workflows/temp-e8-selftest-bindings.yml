name: TEMP E8 self-test binding cleanup

on:
  push:
    branches:
      - dev/e8-multitask-training-splits-01

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev/e8-multitask-training-splits-01

      - name: Configure git
        run: |
          git config user.name "drpo-selftest-bindings-bot"
          git config user.email "drpo-selftest-bindings-bot@users.noreply.github.com"

      - name: Document P4 scope before implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/scopes/E8_MULTITASK_TRAINING_SPLITS.md")
          text = path.read_text(encoding="utf-8")
          marker = "\n## Validation\n"
          if "## P4 — call-scoped self-test bindings" in text:
              raise SystemExit("P4 scope already exists unexpectedly")
          if text.count(marker) != 1:
              raise SystemExit(f"Expected one validation marker, found {text.count(marker)}")
          p4 = r'''
## P4 — call-scoped self-test bindings

After P2/P3 have established explicit call-scoped binding objects for the historical trainer and canonical bridge, P4 removes the transitional process-global `bind_host()` dependency surface from `e8_multitask_selftest.py`. This is a code-only composition cleanup; it does not add a new Python path and does not change the engineering self-test's evidence semantics.

P4 must preserve the stable `e8_multitask_exp_tuning.py` compatibility entry points and all existing self-test behavior: placeholder-only execution, intentional return-code-73 failure, preserved unscheduled work, recovery, dynamic refill, repeated-run idempotence, aggregate/audit/finalize/package execution, package reopen verification, tamper rejection, and `scientific_status=not_run`.

The self-test module receives composition-root dependencies through an explicit per-call `SelfTestBindings` object. The temporary `_run_subprocess_cell` substitution required by the engineering scheduler exercise remains exception-safe and is scoped to one self-test invocation; P4 must not introduce another process-global host binding or reverse import to `e8_multitask_exp_tuning.py`.

P4 does not alter scheduler semantics, scientific method code, frozen variables, experiment status, launch authorization, or any formal-result gate. No scientific training run is part of P4.
'''
          path.write_text(text.replace(marker, "\n" + p4 + marker), encoding="utf-8")
          PY
          git add docs/scopes/E8_MULTITASK_TRAINING_SPLITS.md
          git diff --cached --check
          git commit -m "docs: freeze P4 self-test binding cleanup [skip ci]"
          git push origin HEAD:dev/e8-multitask-training-splits-01

      - name: Refactor self-test to call-scoped bindings
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def section(text: str, start: str, end: str) -> tuple[str, str, str]:
              i = text.index(start)
              j = text.index(end, i)
              return text[:i], text[i:j], text[j:]

          selftest_path = Path("src/drpo/e8_multitask_selftest.py")
          text = selftest_path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "from collections.abc import Mapping\nfrom pathlib import Path\n",
              "from collections.abc import Mapping\nfrom dataclasses import dataclass\nfrom pathlib import Path\n",
              "selftest dataclass import",
          )
          start = text.index("# bind_host() overwrites these placeholders")
          end = text.index("def _engineering_self_test_config", start)
          binding_block = '''@dataclass(frozen=True)\nclass SelfTestBindings:\n    """Call-scoped dependencies supplied by the E8 composition root."""\n\n    host: Any\n\n\n_INTENTIONAL_FAILURE_RETURNCODE = 73\n\n\n'''
          text = text[:start] + binding_block + text[end:]

          text = replace_once(
              text,
              "def _engineering_self_test_config(config: Mapping[str, Any]) -> dict[str, Any]:\n",
              "def _engineering_self_test_config(\n    config: Mapping[str, Any],\n    *,\n    bindings: SelfTestBindings,\n) -> dict[str, Any]:\n    host = bindings.host\n",
              "self-test config signature",
          )
          text = replace_once(text, "    validate_config(updated)\n", "    host.validate_config(updated)\n", "validate config binding")

          pre, body, post = section(text, "def _write_engineering_input_fixtures(", "def _write_engineering_gates(")
          body = replace_once(
              body,
              "    output_root: Path,\n) -> tuple[Path, Path, Path, Path]:\n",
              "    output_root: Path,\n    *,\n    bindings: SelfTestBindings,\n) -> tuple[Path, Path, Path, Path]:\n    host = bindings.host\n",
              "input fixture signature",
          )
          for old, new in (
              ("_repo_root()", "host._repo_root()"),
              ("atomic_jsonl(", "host.atomic_jsonl("),
              ("P0_EXPERIMENT_ID", "host.P0_EXPERIMENT_ID"),
              ("stable_config_hash(", "host.stable_config_hash("),
              ("atomic_json(", "host.atomic_json("),
          ):
              body = body.replace(old, new)
          text = pre + body + post

          pre, body, post = section(text, "def _write_engineering_gates(", "def _audit_engineering_queue(")
          body = replace_once(
              body,
              "    base_model_path: str,\n) -> None:\n    splits, _ = _load_ready_inputs",
              "    base_model_path: str,\n    bindings: SelfTestBindings,\n) -> None:\n    host = bindings.host\n    splits, _ = host._load_ready_inputs",
              "engineering gate signature",
          )
          for old, new in (
              ("_canonical_calibration_identity(", "host._canonical_calibration_identity("),
              ("experiment_config.", "host.experiment_config."),
              ("atomic_json(", "host.atomic_json("),
              ("experiment_id(", "host.experiment_id("),
              ("stable_config_hash(", "host.stable_config_hash("),
              ("model_identity(", "host.model_identity("),
              ("_coldstart_methods(", "host._coldstart_methods("),
              ("_is_coldstart(", "host._is_coldstart("),
              ("_coldstart_method(", "host._coldstart_method("),
              ("METHOD_DPO", "host.METHOD_DPO"),
          ):
              body = body.replace(old, new)
          text = pre + body + post

          pre, body, post = section(text, "def _audit_engineering_queue(", "def _intentional_failure_evidence(")
          body = replace_once(
              body,
              "    scheduler: Mapping[str, Any],\n) -> dict[str, Any]:\n    cells = build_cells(config)\n",
              "    scheduler: Mapping[str, Any],\n    *,\n    bindings: SelfTestBindings,\n) -> dict[str, Any]:\n    host = bindings.host\n    cells = host.build_cells(config)\n",
              "queue audit signature",
          )
          body = body.replace("build_waves(config)", "host.build_waves(config)")
          text = pre + body + post

          pre, body, post = section(text, "def cmd_engineering_self_test(", "\n", ) if False else (None, None, None)
          # cmd_engineering_self_test is the final function in this module.
          cmd_start = text.index("def cmd_engineering_self_test(")
          head, body = text[:cmd_start], text[cmd_start:]
          body = replace_once(
              body,
              "    source_commit: str,\n) -> dict[str, Any]:\n",
              "    source_commit: str,\n    bindings: SelfTestBindings,\n) -> dict[str, Any]:\n",
              "self-test command signature",
          )
          body = replace_once(
              body,
              "    \"\"\"Exercise the delivery pipeline with an isolated, non-scientific backend.\"\"\"\n\n",
              "    \"\"\"Exercise the delivery pipeline with an isolated, non-scientific backend.\"\"\"\n\n    host = bindings.host\n",
              "self-test command host",
          )
          body = body.replace("_is_coldstart(config)", "host._is_coldstart(config)")
          body = body.replace("validate_work_dir(output_root)", "host.validate_work_dir(output_root)")
          body = body.replace("_engineering_self_test_config(config)", "_engineering_self_test_config(config, bindings=bindings)")
          body = body.replace(
              "_write_engineering_input_fixtures(self_test_config, output_root)",
              "_write_engineering_input_fixtures(self_test_config, output_root, bindings=bindings)",
          )
          gate_call = '''        _write_engineering_gates(\n            self_test_config,\n            output_root,\n            base_model_path=str(base_model),\n        )'''
          gate_call_bound = '''        _write_engineering_gates(\n            self_test_config,\n            output_root,\n            base_model_path=str(base_model),\n            bindings=bindings,\n        )'''
          if body.count(gate_call) != 2:
              raise SystemExit(f"engineering gate call: expected two matches, found {body.count(gate_call)}")
          body = body.replace(gate_call, gate_call_bound)
          for old, new in (
              ("cmd_prepare(", "host.cmd_prepare("),
              ("load_config(", "host.load_config("),
              ("_read_json_object(", "host._read_json_object("),
              ("_load_prepared(", "host._load_prepared("),
              ("_require_calibration_gate(", "host._require_calibration_gate("),
              ("_require_liveness_gate(", "host._require_liveness_gate("),
              ("build_cells(", "host.build_cells("),
              ("stable_config_hash(", "host.stable_config_hash("),
              ("experiment_id(", "host.experiment_id("),
              ("atomic_json(", "host.atomic_json("),
              ("sha256_file(", "host.sha256_file("),
              ("cmd_run_dynamic(", "host.cmd_run_dynamic("),
              ("cmd_aggregate(", "host.cmd_aggregate("),
              ("cmd_audit(", "host.cmd_audit("),
              ("cmd_finalize(", "host.cmd_finalize("),
              ("cmd_package(", "host.cmd_package("),
              ("verify_result_package(", "host.verify_result_package("),
              ('globals()["_run_subprocess_cell"]', "host._run_subprocess_cell"),
              ("cell: Cell,", "cell: Any,"),
          ):
              body = body.replace(old, new)
          body = body.replace(
              "_audit_engineering_queue(self_test_config, output_root, resumed)",
              "_audit_engineering_queue(self_test_config, output_root, resumed, bindings=bindings)",
          )
          text = head + body

          forbidden = (
              "def bind_host(",
              "_BOUND_HOST",
              'globals()["_run_subprocess_cell"]',
              "validate_config: Any = None",
          )
          for fragment in forbidden:
              if fragment in text:
                  raise SystemExit(f"self-test still contains forbidden process-global binding fragment: {fragment}")
          if text.count("class SelfTestBindings") != 1:
              raise SystemExit("SelfTestBindings was not created exactly once")
          selftest_path.write_text(text, encoding="utf-8")

          root_path = Path("src/drpo/e8_multitask_exp_tuning.py")
          root = root_path.read_text(encoding="utf-8")
          canonical = '''def _canonical_bridge() -> e8_canonical_bridge.CanonicalBridge:\n    return e8_canonical_bridge.build_bridge(\n        e8_canonical_bridge.CanonicalBridgeBindings(host=sys.modules[__name__])\n    )\n\n'''
          if root.count(canonical) != 1:
              raise SystemExit("canonical bridge anchor did not match exactly once")
          root = root.replace(
              canonical,
              canonical + '''\ndef _selftest_bindings() -> e8_selftest.SelfTestBindings:\n    return e8_selftest.SelfTestBindings(host=sys.modules[__name__])\n\n''',
              1,
          )
          old_wrapper = '''def _engineering_self_test_config(config: Mapping[str, Any]) -> dict[str, Any]:\n    e8_selftest.bind_host(sys.modules[__name__])\n    return e8_selftest._engineering_self_test_config(config)\n\n\ndef cmd_engineering_self_test(\n    config: Mapping[str, Any],\n    output_root: Path,\n    *,\n    source_commit: str,\n) -> dict[str, Any]:\n    e8_selftest.bind_host(sys.modules[__name__])\n    return e8_selftest.cmd_engineering_self_test(\n        config,\n        output_root,\n        source_commit=source_commit,\n    )\n'''
          new_wrapper = '''def _engineering_self_test_config(config: Mapping[str, Any]) -> dict[str, Any]:\n    return e8_selftest._engineering_self_test_config(\n        config,\n        bindings=_selftest_bindings(),\n    )\n\n\ndef cmd_engineering_self_test(\n    config: Mapping[str, Any],\n    output_root: Path,\n    *,\n    source_commit: str,\n) -> dict[str, Any]:\n    return e8_selftest.cmd_engineering_self_test(\n        config,\n        output_root,\n        source_commit=source_commit,\n        bindings=_selftest_bindings(),\n    )\n'''
          if root.count(old_wrapper) != 1:
              raise SystemExit(f"composition wrapper expected once, found {root.count(old_wrapper)}")
          root = root.replace(old_wrapper, new_wrapper, 1)
          if "e8_selftest.bind_host" in root:
              raise SystemExit("composition root still calls e8_selftest.bind_host")
          root_path.write_text(root, encoding="utf-8")
          PY

      - name: Static structure assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("src/drpo/e8_multitask_selftest.py").read_text(encoding="utf-8")
          r = Path("src/drpo/e8_multitask_exp_tuning.py").read_text(encoding="utf-8")
          assert "class SelfTestBindings" in s
          assert "def bind_host(" not in s
          assert "_BOUND_HOST" not in s
          assert "host._run_subprocess_cell = placeholder_cell_runner" in s
          assert "finally:\n        host._run_subprocess_cell = original_runner" in s
          assert "def _selftest_bindings()" in r
          assert "e8_selftest.bind_host" not in r
          PY

      - name: Compile
        run: |
          python -m py_compile \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_selftest.py \
            src/drpo/e8_multitask_warmstart_training.py \
            src/drpo/e8_multitask_canonical_bridge.py \
            tests/test_e8_multitask_p0.py

      - name: Focused regression
        run: |
          pytest -q tests/test_e8_multitask_p0.py

      - name: Method integration contract
        run: |
          bash tests/test_e8_method_integration_contract.sh

      - name: Ruff
        run: |
          ruff check \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_selftest.py \
            tests/test_e8_multitask_p0.py

      - name: Governance and authority checks
        run: |
          python3 scripts/handoff_authority.py verify --repo-root .
          python3 scripts/validate_governance_pipeline_stage_status.py --repo-root .
          git diff --check

      - name: Broad pytest
        run: |
          pytest -q

      - name: Commit validated P4 source
        run: |
          git add src/drpo/e8_multitask_exp_tuning.py src/drpo/e8_multitask_selftest.py
          git diff --cached --check
          git commit -m "refactor: make E8 self-test bindings call-scoped [skip ci]"
          git push origin HEAD:dev/e8-multitask-training-splits-01

      - name: Remove temporary workflow
        if: always()
        run: |
          git reset --hard HEAD
          git rm .github/workflows/temp-e8-selftest-bindings.yml
          git commit -m "chore: remove temporary P4 workflow [skip ci]"
          git push origin HEAD:dev/e8-multitask-training-splits-01
