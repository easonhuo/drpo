name: TEMP compile KDD Batch 1 directly

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  compile-direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/paper-kdd2027-compression-batch1-01
          fetch-depth: 0

      - name: Compile current KDD source with TeX Live 2025
        uses: xu-cheng/texlive-action@v3
        with:
          run: |
            set -u
            cd paper/kdd2027
            set +e
            latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex > direct_compile_stdout.txt 2>&1
            latex_status=$?
            set -e

            undefined=0
            if test -f main.log && grep -Eq 'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations' main.log; then
              undefined=1
            fi

            pages=unknown
            if test -f main.pdf && command -v pdfinfo >/dev/null 2>&1; then
              pages="$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')"
            fi
            pdf_bytes=0
            if test -f main.pdf; then
              pdf_bytes="$(wc -c < main.pdf | tr -d ' ')"
            fi

            {
              echo "latex_status=${latex_status}"
              echo "undefined_refs_or_citations=${undefined}"
              echo "pages=${pages}"
              echo "pdf_bytes=${pdf_bytes}"
            } > direct_compile_audit.txt
            cat direct_compile_audit.txt
            tail -n 120 direct_compile_stdout.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temp-kdd-batch1-direct-compile
          path: |
            paper/kdd2027/main.pdf
            paper/kdd2027/main.log
            paper/kdd2027/direct_compile_stdout.txt
            paper/kdd2027/direct_compile_audit.txt
          if-no-files-found: warn

      - name: Enforce successful direct compile
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'latex_status=0' paper/kdd2027/direct_compile_audit.txt
          grep -Fxq 'undefined_refs_or_citations=0' paper/kdd2027/direct_compile_audit.txt
          test -s paper/kdd2027/main.pdf
