name: E8 Multitask AsymRE Capability Repair

"on":
  push:
    branches:
      - dev/e8-multitask-asymre-capability-01

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-asymre-capability-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute scoped patcher embedded in the first workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/e8-multitask-asymre-capability-dev.yml')
          text = source.read_text(encoding='utf-8')
          prefix = (
              '      - name: Apply scoped AsymRE capability edits\n'
              '        shell: bash\n'
              '        run: |\n'
          )
          suffix = '      - name: Install focused test dependencies\n'
          start = text.index(prefix) + len(prefix)
          end = text.index(suffix, start)
          block = text[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          path = Path('/tmp/e8_asymre_patcher.sh')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/e8_asymre_patcher.sh

      - name: Install focused test dependencies
        run: python -m pip install -q numpy pyyaml pytest ruff

      - name: Compile and run focused regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py -k 'asymre_capability'
          python -m ruff check \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          git diff --check

      - name: Commit implementation and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm \
            .github/workflows/e8-multitask-asymre-capability-dev.yml \
            .github/workflows/e8-multitask-asymre-capability-repair.yml
          git add \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          git diff --cached --check
          git commit -m 'feat: add config-driven E8 multitask AsymRE capability'
          git push origin HEAD:dev/e8-multitask-asymre-capability-01
