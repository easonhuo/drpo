name: TEMP E8 baseline install and validation

on:
  pull_request:
    branches:
      - dev/e8-multitask-exp-tuning-01
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-and-validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.ref == 'dev/e8-multitask-topr-asymre-tuning-01')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-topr-asymre-tuning-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct approved source and apply reviewed safety repair
        shell: bash
        run: |
          set -euo pipefail
          transport=.github/e8-baseline-source
          printf '%s  %s\n' c6f78776b020b61ca1b3771bd4a4fe164c3979349fbcac976d2db88d3b8d9b60 "$transport/part00" | sha256sum --check --strict
          printf '%s  %s\n' 3b8286d6b2b26494279ebde4b929313e434557b15609727171ef7ff7ae963373 "$transport/part01" | sha256sum --check --strict
          printf '%s  %s\n' 26180fe4b5d9c37d25e8bed4fa5bee19e6ade1defa0d5b752896cfc9bea6abfa "$transport/part02" | sha256sum --check --strict
          printf '%s  %s\n' ab7ff6e5eabb57f6638d76c1b99f8fc96133dc7c3d15a31b7a977a91e69021de "$transport/part03" | sha256sum --check --strict
          printf '%s  %s\n' e3fb3b6c16ac57e4b0e675c9832fe1a953a07e5a76df4ad13803c62235adb59b "$transport/part04" | sha256sum --check --strict
          printf '%s  %s\n' 705ca98aaac3bd3c6c783469f56278e673c450a3e5100c80da29e66ee568dbb9 "$transport/part05" | sha256sum --check --strict
          printf '%s  %s\n' 4a61ecb945e92e8a504a8759c2b4ccf1c54dc1611d3bb89e16aa9f4d6c9d5376 "$transport/part06" | sha256sum --check --strict
          printf '%s  %s\n' 7b323930081235746ca2378d6d08e6cb83d52e25d5a57235af6e94c304e04aaa "$transport/part07" | sha256sum --check --strict
          printf '%s  %s\n' 33eee958917b2081674a0897e647122adaa1802808c0b0cdbfd6b55b368872e4 "$transport/part08" | sha256sum --check --strict
          cat "$transport"/part{00,01,02,03,04,05,06,07,08} | base64 --decode > /tmp/e8_multitask_baseline_tuning.py
          printf '%s  %s\n' f04733be4f5d01d5be681cb2b4d4ba8833bc4a9a7f088051a30937c257e792b9 /tmp/e8_multitask_baseline_tuning.py | sha256sum --check --strict
          cp "$transport/patch_source.txt" /tmp/patch_baseline.py
          python /tmp/patch_baseline.py
          printf '%s  %s\n' dd29b36f7d9ff011c6f00a623d81936b3e4ec21d4d9039afe50e75f39883da73 /tmp/e8_multitask_baseline_tuning.py | sha256sum --check --strict
          test "$(wc -l < /tmp/e8_multitask_baseline_tuning.py)" -eq 1389
          python -m py_compile /tmp/e8_multitask_baseline_tuning.py
          grep -q 'src/drpo/e8_multitask_baseline_tuning.py' docs/scopes/EXT-C-E8-MULTITASK-TOPR-ASYMRE-TUNING-01.md
          install -m 0644 /tmp/e8_multitask_baseline_tuning.py src/drpo/e8_multitask_baseline_tuning.py

      - name: Install project test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Format source and append targeted tests
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format src/drpo/e8_multitask_baseline_tuning.py
          python -m ruff check --fix src/drpo/e8_multitask_baseline_tuning.py
          cp .github/e8-baseline-source/test_append.txt /tmp/test_append.py
          python -m ruff format /tmp/test_append.py
          marker='def test_multitask_baseline_tuning_has_exact_80_cell_five_wave_matrix'
          if ! grep -q "$marker" tests/test_e8_multitask_p0.py; then
            cat /tmp/test_append.py >> tests/test_e8_multitask_p0.py
          fi
          grep -q "$marker" tests/test_e8_multitask_p0.py
          python -m ruff format tests/test_e8_multitask_p0.py
          python -m ruff check --fix tests/test_e8_multitask_p0.py

      - name: Run exact matrix and targeted validation
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check src/drpo/e8_multitask_baseline_tuning.py tests/test_e8_multitask_p0.py
          python -m ruff format --check src/drpo/e8_multitask_baseline_tuning.py tests/test_e8_multitask_p0.py
          python -m py_compile src/drpo/e8_multitask_baseline_tuning.py tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_topr_asymre_tuning.sh
          tmp_dir="$(mktemp -d)"
          scripts/run_e8_multitask_topr_asymre_tuning.sh \
            --output-root "$tmp_dir/output" plan > "$tmp_dir/plan_stdout.json"
          python - "$tmp_dir/output/plan.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          plan = json.loads(Path(sys.argv[1]).read_text())
          assert plan['cell_count'] == 80
          assert plan['wave_sizes'] == [16, 16, 16, 16, 16]
          assert sum(row['method'] == 'joint_fitted_reference_beta_topr' for row in plan['rows']) == 40
          assert sum(row['method'] == 'asymre' for row in plan['rows']) == 40
          assert all(row['task'] != 'countdown' for row in plan['rows'])
          PY
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check

      - name: Commit validated implementation and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf .github/e8-baseline-source .github/e8-baseline-source-v2
          git add \
            src/drpo/e8_multitask_baseline_tuning.py \
            tests/test_e8_multitask_p0.py \
            .github/e8-baseline-source \
            .github/e8-baseline-source-v2
          git commit -m 'EXT-C-E8-MULTITASK-TOPR-ASYMRE-TUNING-01: install validated implementation'
          git push origin HEAD:dev/e8-multitask-topr-asymre-tuning-01
