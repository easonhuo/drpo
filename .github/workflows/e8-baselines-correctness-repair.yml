name: E8 baseline correctness repair

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-baselines-correctness-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch correctness gaps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runner_path = Path('src/drpo/e8_multitask_exp_tuning.py')
          tests_path = Path('tests/test_e8_multitask_p0.py')
          runner = runner_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          runner = replace_once(
              runner,
              '"""Paper-aligned exponential-taper response tuning on frozen multitask banks.\n\n'
              'The module keeps the P0 occurrence/gradient diagnostic separate from downstream\n'
              'method tuning.  The cold-start profile dispatches every scientific update to\n'
              'the byte-locked paper Countdown trainer.  Task adapters may change only data\n'
              'schema, verifier, and explicitly whitelisted length/evaluation-batch fields.\n'
              '"""',
              '"""Paper-aligned multitask cold-start baseline orchestration on frozen banks.\n\n'
              'The module keeps the P0 occurrence/gradient diagnostic separate from downstream\n'
              'method tuning.  EXP, AsymRE, and TOPR dispatch to the byte-locked paper trainers;\n'
              'DPO ports the audited PR #268 semantics because no canonical DPO runtime is merged\n'
              'on main.  Task adapters may change only the explicitly governed task-interface\n'
              'fields.\n'
              '"""',
              'module docstring',
          )

          runner = replace_once(
              runner,
              '    delta_v: float | None = None\n    beta: float | None = None\n',
              '    delta_v: float | None = None\n    beta: float | None = None\n'
              '    dpo_initialization: str | None = None\n',
              'Cell DPO initialization field',
          )
          runner = replace_once(
              runner,
              '        if self.method == METHOD_DPO:\n'
              '            if self.beta is None:\n'
              '                raise AssertionError("Canonical DPO cell requires beta")\n'
              '            tag = f"{self.beta:.12g}".replace("-", "m").replace(".", "p")\n'
              '            return f"{self.task}__canonical_dpo_beta{tag}__seed{self.seed}"\n',
              '        if self.method == METHOD_DPO:\n'
              '            if self.beta is None:\n'
              '                raise AssertionError("Canonical DPO cell requires beta")\n'
              '            if self.dpo_initialization is None:\n'
              '                raise AssertionError("Canonical DPO cell requires initialization identity")\n'
              '            tag = f"{self.beta:.12g}".replace("-", "m").replace(".", "p")\n'
              '            return (\n'
              '                f"{self.task}__canonical_dpo_beta{tag}__"\n'
              '                f"init_{self.dpo_initialization}__seed{self.seed}"\n'
              '            )\n',
              'DPO key initialization identity',
          )

          runner = replace_once(
              runner,
              'def _canonical_asymre_grid_path() -> Path:\n'
              '    path = (_repo_root() / CANONICAL_ASYMRE_GRID).resolve()\n'
              '    if not path.is_file():\n'
              '        raise FileNotFoundError(f"Canonical AsymRE grid is missing: {path}")\n'
              '    return path\n',
              'def _canonical_asymre_grid_path() -> Path:\n'
              '    path = (_repo_root() / CANONICAL_ASYMRE_GRID).resolve()\n'
              '    if not path.is_file():\n'
              '        raise FileNotFoundError(f"Canonical AsymRE grid is missing: {path}")\n'
              '    return path\n\n\n'
              'def _canonical_topr_grid_path() -> Path:\n'
              '    path = (_repo_root() / CANONICAL_TOPR_GRID).resolve()\n'
              '    if not path.is_file():\n'
              '        raise FileNotFoundError(f"Canonical TOPR grid is missing: {path}")\n'
              '    return path\n',
              'canonical TOPR grid resolver',
          )
          topr_resolve_count = runner.count('CANONICAL_TOPR_GRID.resolve()')
          if topr_resolve_count < 3:
              raise RuntimeError(f'TOPR resolver: expected >=3 uses, found {topr_resolve_count}')
          runner = runner.replace('CANONICAL_TOPR_GRID.resolve()', '_canonical_topr_grid_path()')

          runner = replace_once(
              runner,
              'def _coldstart_method_cell(\n'
              '    task: str,\n'
              '    method: str,\n'
              '    seed: int,\n'
              '    stage: str,\n'
              '    value: float,\n'
              '    *,\n'
              '    lambda_only: bool,\n'
              ') -> Cell:\n'
              '    if method == METHOD_ASYMRE:\n'
              '        return Cell(task, method, None, seed, stage, delta_v=value)\n'
              '    if method in {METHOD_TOPR, METHOD_DPO}:\n'
              '        return Cell(task, method, None, seed, stage, beta=value)\n'
              '    if method == METHOD_EXPONENTIAL:\n',
              'def _coldstart_method_cell(\n'
              '    task: str,\n'
              '    method: str,\n'
              '    seed: int,\n'
              '    stage: str,\n'
              '    value: float,\n'
              '    *,\n'
              '    lambda_only: bool,\n'
              '    dpo_initialization: str | None = None,\n'
              ') -> Cell:\n'
              '    if method == METHOD_ASYMRE:\n'
              '        return Cell(task, method, None, seed, stage, delta_v=value)\n'
              '    if method == METHOD_TOPR:\n'
              '        return Cell(task, method, None, seed, stage, beta=value)\n'
              '    if method == METHOD_DPO:\n'
              '        if dpo_initialization is None:\n'
              '            raise ValueError("DPO cell construction requires initialization identity")\n'
              '        return Cell(\n'
              '            task, method, None, seed, stage, beta=value,\n'
              '            dpo_initialization=dpo_initialization,\n'
              '        )\n'
              '    if method == METHOD_EXPONENTIAL:\n',
              'method-aware cell builder',
          )
          runner = replace_once(
              runner,
              '        lambda_only = (\n'
              '            method == METHOD_EXPONENTIAL\n'
              '            and config["sweep"]["parameterization"] == "paper_lambda_c1"\n'
              '        )\n'
              '        countdown_values = _task_method_values(config, "countdown")\n',
              '        lambda_only = (\n'
              '            method == METHOD_EXPONENTIAL\n'
              '            and config["sweep"]["parameterization"] == "paper_lambda_c1"\n'
              '        )\n'
              '        dpo_initialization = (\n'
              '            str(config["dpo"]["initialization_mode"])\n'
              '            if method == METHOD_DPO\n'
              '            else None\n'
              '        )\n'
              '        countdown_values = _task_method_values(config, "countdown")\n',
              'build_cells DPO initialization',
          )
          call_marker = '                    lambda_only=lambda_only,\n                )'
          if runner.count(call_marker) != 2:
              raise RuntimeError(f'cell construction calls: expected 2, found {runner.count(call_marker)}')
          runner = runner.replace(
              call_marker,
              '                    lambda_only=lambda_only,\n'
              '                    dpo_initialization=dpo_initialization,\n'
              '                )',
          )

          runner = replace_once(
              runner,
              '                    "delta_v": cell.delta_v,\n'
              '                    "beta": cell.beta,\n'
              '                    "rho": cell.rho,\n',
              '                    "delta_v": cell.delta_v,\n'
              '                    "beta": cell.beta,\n'
              '                    "dpo_initialization": cell.dpo_initialization,\n'
              '                    "rho": cell.rho,\n',
              'plan DPO initialization',
          )
          runner = replace_once(
              runner,
              '            "delta_v": cell.delta_v,\n'
              '            "beta": cell.beta,\n'
              '            "rho": cell.rho,\n',
              '            "delta_v": cell.delta_v,\n'
              '            "beta": cell.beta,\n'
              '            "dpo_initialization": cell.dpo_initialization,\n'
              '            "rho": cell.rho,\n',
              'cell identity DPO initialization',
          )

          runner = replace_once(
              runner,
              '    if (\n'
              '        _is_coldstart(config)\n'
              '        and _coldstart_method(config) != METHOD_DPO\n'
              '        and not _is_engineering_self_test(config)\n'
              '    ):\n',
              '    if _is_coldstart(config) and not _is_engineering_self_test(config):\n',
              'cmd_calibrate common bank derivation',
          )
          runner = replace_once(
              runner,
              '    if (\n'
              '        _coldstart_method(config) != METHOD_DPO\n'
              '        and not _is_engineering_self_test(config)\n'
              '    ):\n',
              '    if not _is_engineering_self_test(config):\n',
              'cmd_calibrate_task common bank derivation',
          )

          runner = replace_once(
              runner,
              '            "paper_formula": (\n'
              '                "delegated_to_existing_canonical_asymre"\n'
              '                if cell.method == METHOD_ASYMRE\n'
              '                else "alpha*exp(-c*(current_sequence_surprisal/2))"\n'
              '            ),\n',
              '            "paper_formula": (\n'
              '                "delegated_to_existing_canonical_asymre"\n'
              '                if cell.method == METHOD_ASYMRE\n'
              '                else (\n'
              '                    "delegated_to_existing_joint_fitted_reference_beta_topr"\n'
              '                    if cell.method == METHOD_TOPR\n'
              '                    else "alpha*exp(-c*(current_sequence_surprisal/2))"\n'
              '                )\n'
              '            ),\n',
              'TOPR paper formula provenance',
          )

          runner = replace_once(
              runner,
              '            "dpo_initialization_mode": str(config["dpo"]["initialization_mode"]),\n'
              '            "shared_sft_adapter_identity": (\n',
              '            "dpo_initialization_mode": str(config["dpo"]["initialization_mode"]),\n'
              '            "reference_remoteness_bank_identity_hash": record.get(\n'
              '                "reference_remoteness_bank_identity_hash"\n'
              '            ),\n'
              '            "canonical_train_sha256": record["train_sha256"],\n'
              '            "shared_sft_adapter_identity": (\n',
              'DPO bank provenance',
          )

          runner = replace_once(
              runner,
              '        best_dir = cell_root / "supplementary_best_adapter"\n'
              '        terminal_dir = cell_root / "terminal_adapter"\n'
              '        metric_rows: list[dict[str, Any]] = []\n'
              '        best_pass8 = -math.inf\n'
              '        optimizer_update_norms: list[float] = []\n'
              '        initial_pair_margin_max_abs: float | None = None\n'
              '        tolerance = float(config["dpo"]["initial_pair_margin_max_abs_tolerance"])\n',
              '        best_dir = cell_root / "supplementary_best_adapter"\n'
              '        terminal_dir = cell_root / "terminal_adapter"\n'
              '        last_finite_dir = cell_root / "last_finite_adapter"\n'
              '        metric_rows: list[dict[str, Any]] = []\n'
              '        best_pass8 = -math.inf\n'
              '        optimizer_update_norms: list[float] = []\n'
              '        initial_pair_margin_max_abs: float | None = None\n'
              '        tolerance = float(config["dpo"]["initial_pair_margin_max_abs_tolerance"])\n'
              '        numerical_failure: str | None = None\n'
              '        stop_reason = "max_steps"\n'
              '        terminal_step = 0\n'
              '        last_finite_step = 0\n',
              'DPO failure state',
          )
          runner = replace_once(
              runner,
              '        for update in range(1, updates + 1):\n'
              '            loss_total = 0.0\n'
              '            pair_margin_total = 0.0\n'
              '            preference_accuracy_total = 0.0\n'
              '            saturation_total = 0.0\n'
              '            for accumulation_index in range(accumulation):\n',
              '        for update in range(1, updates + 1):\n'
              '            loss_total = 0.0\n'
              '            pair_margin_total = 0.0\n'
              '            preference_accuracy_total = 0.0\n'
              '            saturation_total = 0.0\n'
              '            abort_update = False\n'
              '            for accumulation_index in range(accumulation):\n',
              'DPO abort state',
          )
          runner = replace_once(
              runner,
              '                    if initial_pair_margin_max_abs > tolerance:\n'
              '                        raise RuntimeError(\n'
              '                            "DPO initial policy/reference pair margin exceeds exact-copy tolerance"\n'
              '                        )\n',
              '                    if initial_pair_margin_max_abs > tolerance:\n'
              '                        numerical_failure = "initial_policy_reference_pair_margin_mismatch"\n'
              '                        stop_reason = numerical_failure\n'
              '                        abort_update = True\n'
              '                        break\n',
              'DPO initial pair failure preservation',
          )
          runner = replace_once(
              runner,
              '                if not bool(torch.isfinite(loss)):\n'
              '                    raise RuntimeError(f"{cell.key} non-finite DPO loss at update {update}")\n',
              '                if not bool(torch.isfinite(loss)):\n'
              '                    numerical_failure = f"nonfinite_loss_at_step_{update}"\n'
              '                    stop_reason = numerical_failure\n'
              '                    abort_update = True\n'
              '                    break\n',
              'DPO nonfinite loss preservation',
          )
          runner = replace_once(
              runner,
              '                saturation_total += float((logits.detach().abs() >= 10.0).float().mean().cpu())\n\n'
              '            gradient_norm = torch.nn.utils.clip_grad_norm_(\n',
              '                saturation_total += float((logits.detach().abs() >= 10.0).float().mean().cpu())\n\n'
              '            if abort_update:\n'
              '                break\n\n'
              '            gradient_norm = torch.nn.utils.clip_grad_norm_(\n',
              'DPO abort before optimizer',
          )
          runner = replace_once(
              runner,
              '            if not bool(torch.isfinite(gradient_norm)):\n'
              '                raise RuntimeError(f"{cell.key} non-finite DPO gradient at update {update}")\n',
              '            if not bool(torch.isfinite(gradient_norm)):\n'
              '                numerical_failure = f"nonfinite_gradient_at_step_{update}"\n'
              '                stop_reason = numerical_failure\n'
              '                break\n',
              'DPO nonfinite gradient preservation',
          )
          runner = replace_once(
              runner,
              '            if not arena.optimizer_step_with_last_finite_guard(optimizer, policy_parameters):\n'
              '                raise RuntimeError(f"{cell.key} non-finite DPO parameters at update {update}")\n'
              '            scheduler.step()\n'
              '            optimizer.zero_grad(set_to_none=True)\n',
              '            if not arena.optimizer_step_with_last_finite_guard(optimizer, policy_parameters):\n'
              '                numerical_failure = f"nonfinite_parameters_at_step_{update}"\n'
              '                stop_reason = numerical_failure\n'
              '                break\n'
              '            scheduler.step()\n'
              '            optimizer.zero_grad(set_to_none=True)\n'
              '            terminal_step = update\n'
              '            last_finite_step = update\n',
              'DPO nonfinite parameter preservation',
          )

          runner = replace_once(
              runner,
              '        activate_policy()\n'
              '        terminal_policy_sha256 = _parameter_sequence_sha256(policy_parameters)\n'
              '        reference_terminal_sha256 = _parameter_sequence_sha256(reference_parameters)\n'
              '        if reference_terminal_sha256 != reference_initial_sha256:\n'
              '            raise RuntimeError("Frozen DPO reference changed during policy optimization")\n'
              '        if terminal_policy_sha256 == policy_initial_sha256:\n'
              '            raise RuntimeError("DPO policy parameters did not change")\n'
              '        model.save_pretrained(terminal_dir, safe_serialization=True)\n'
              '        tokenizer.save_pretrained(terminal_dir)\n'
              '        terminal_identity = model_identity(base_model_path, str(terminal_dir))["adapter"]\n\n'
              '        if engineering_liveness:\n'
              '            summary: dict[str, Any] = {\n'
              '                "engineering_liveness": True,\n'
              '                "optimizer_updates": updates,\n'
              '                "evaluation_status": "not_applicable",\n'
              '            }\n'
              '            scientific_status = "not_run"\n'
              '        else:\n'
              '            evaluations = read_jsonl(evaluation_path)\n'
              '            summary = _summarize_evaluations(evaluations, config)\n'
              '            scientific_status = "pilot"\n',
              '        activate_policy()\n'
              '        terminal_policy_sha256 = _parameter_sequence_sha256(policy_parameters)\n'
              '        reference_terminal_sha256 = _parameter_sequence_sha256(reference_parameters)\n'
              '        if reference_terminal_sha256 != reference_initial_sha256:\n'
              '            raise RuntimeError("Frozen DPO reference changed during policy optimization")\n'
              '        policy_parameters_changed = terminal_policy_sha256 != policy_initial_sha256\n'
              '        final_adapter_dir = last_finite_dir if numerical_failure else terminal_dir\n'
              '        model.save_pretrained(final_adapter_dir, safe_serialization=True)\n'
              '        tokenizer.save_pretrained(final_adapter_dir)\n'
              '        terminal_identity = model_identity(base_model_path, str(final_adapter_dir))["adapter"]\n'
              '        if numerical_failure is not None:\n'
              '            append_jsonl(\n'
              '                training_path,\n'
              '                {\n'
              '                    "update": terminal_step,\n'
              '                    "numerical_failure": numerical_failure,\n'
              '                    "stop_reason": stop_reason,\n'
              '                    "last_finite_step": last_finite_step,\n'
              '                    "reference_role": "exact_frozen_initial_policy",\n'
              '                    "test_data_used": False,\n'
              '                },\n'
              '            )\n\n'
              '        if engineering_liveness:\n'
              '            summary: dict[str, Any] = {\n'
              '                "engineering_liveness": True,\n'
              '            }\n'
              '            scientific_status = "not_run"\n'
              '        else:\n'
              '            evaluations = read_jsonl(evaluation_path)\n'
              '            summary = (\n'
              '                _summarize_evaluations(evaluations, config)\n'
              '                if numerical_failure is None\n'
              '                else {}\n'
              '            )\n'
              '            scientific_status = "pilot"\n',
              'DPO terminal/failure checkpoint behavior',
          )

          runner = replace_once(
              runner,
              '            "terminal_trainable_state_sha256": terminal_policy_sha256,\n'
              '            "initialization_state_sha256": policy_initial_sha256,\n'
              '            "terminal_adapter": str(terminal_dir.resolve()),\n'
              '            "terminal_adapter_identity": terminal_identity,\n',
              '            "terminal_trainable_state_sha256": terminal_policy_sha256,\n'
              '            "initialization_state_sha256": policy_initial_sha256,\n'
              '            "policy_parameters_changed": policy_parameters_changed,\n'
              '            "terminal_checkpoint_kind": (\n'
              '                "last_finite" if numerical_failure else "terminal"\n'
              '            ),\n'
              '            "terminal_adapter": str(final_adapter_dir.resolve()),\n'
              '            "terminal_adapter_identity": terminal_identity,\n',
              'DPO terminal manifest checkpoint identity',
          )
          runner = replace_once(
              runner,
              '            "optimizer_updates": updates,\n'
              '            "nan_inf_failure": False,\n'
              '            "test_partition_accessed": False,\n'
              '            "complete": True,\n'
              '            "scientific_status": scientific_status,\n',
              '            "optimizer_updates": terminal_step,\n'
              '            "optimizer_updates_requested": updates,\n'
              '            "last_finite_step": last_finite_step,\n'
              '            "numerical_failure": numerical_failure,\n'
              '            "stop_reason": stop_reason,\n'
              '            "nan_inf_failure": bool(\n'
              '                numerical_failure is not None and numerical_failure.startswith("nonfinite_")\n'
              '            ),\n'
              '            "evaluation_status": (\n'
              '                "complete" if numerical_failure is None else "incomplete"\n'
              '            ),\n'
              '            "test_partition_accessed": False,\n'
              '            "complete": numerical_failure is None,\n'
              '            "scientific_status": scientific_status,\n',
              'DPO structured completion status',
          )
          runner = replace_once(
              runner,
              '        if not engineering_liveness:\n'
              '            result.update(\n'
              '                {\n'
              '                    "best_step": summary["supplementary_best_step"],\n'
              '                    "terminal_step": updates,\n'
              '                    "stop_reason": "max_steps",\n'
              '                    "validation_best_pass8": summary["supplementary_best_pass8"],\n'
              '                    "validation_terminal_pass8": summary["validation_terminal_pass8"],\n'
              '                    "validation_best_greedy": summary["supplementary_best_greedy"],\n'
              '                    "validation_terminal_greedy": summary["validation_terminal_greedy"],\n'
              '                    "validation_best_greedy_valid_rate": max(\n'
              '                        float(row["greedy_valid_rate"]) for row in read_jsonl(evaluation_path)\n'
              '                    ),\n'
              '                    "validation_terminal_greedy_valid_rate": summary[\n'
              '                        "validation_terminal_greedy_valid_rate"\n'
              '                    ],\n'
              '                }\n'
              '            )\n',
              '        if not engineering_liveness and numerical_failure is None:\n'
              '            result.update(\n'
              '                {\n'
              '                    "best_step": summary["supplementary_best_step"],\n'
              '                    "terminal_step": terminal_step,\n'
              '                    "validation_best_pass8": summary["supplementary_best_pass8"],\n'
              '                    "validation_terminal_pass8": summary["validation_terminal_pass8"],\n'
              '                    "validation_best_greedy": summary["supplementary_best_greedy"],\n'
              '                    "validation_terminal_greedy": summary["validation_terminal_greedy"],\n'
              '                    "validation_best_greedy_valid_rate": max(\n'
              '                        float(row["greedy_valid_rate"]) for row in read_jsonl(evaluation_path)\n'
              '                    ),\n'
              '                    "validation_terminal_greedy_valid_rate": summary[\n'
              '                        "validation_terminal_greedy_valid_rate"\n'
              '                    ],\n'
              '                }\n'
              '            )\n',
              'DPO success-only evaluation summary',
          )

          runner = replace_once(
              runner,
              '        beta,\n    )\n    result = train_cell(\n',
              '        beta,\n'
              '        str(config["dpo"]["initialization_mode"]),\n'
              '    )\n'
              '    result = train_cell(\n',
              'DPO liveness Cell initialization',
          )

          runner = replace_once(
              runner,
              '                "source": "current",\n'
              '                "task": cell.task,\n'
              '                "method": cell.method,\n'
              '                "delta_v": cell.delta_v,\n'
              '                "beta": cell.beta,\n'
              '                "rho": cell.rho,\n',
              '                "source": "current",\n'
              '                "task": cell.task,\n'
              '                "method": cell.method,\n'
              '                "delta_v": cell.delta_v,\n'
              '                "beta": cell.beta,\n'
              '                "dpo_initialization": cell.dpo_initialization,\n'
              '                "rho": cell.rho,\n',
              'per-task row DPO initialization',
          )
          runner = replace_once(
              runner,
              '            "delta_v": row.get("delta_v"),\n'
              '            "lambda": row["lambda"],\n',
              '            "delta_v": row.get("delta_v"),\n'
              '            "beta": row.get("beta"),\n'
              '            "dpo_initialization": row.get("dpo_initialization"),\n'
              '            "lambda": row["lambda"],\n',
              'per-task plot method parameters',
          )
          runner = replace_once(
              runner,
              '            "source": "dense" if _is_dense(config) else "current",\n'
              '            "task": cell.task,\n'
              '            "method": cell.method,\n'
              '            "delta_v": cell.delta_v,\n'
              '            "beta": cell.beta,\n'
              '            "rho": cell.rho,\n',
              '            "source": "dense" if _is_dense(config) else "current",\n'
              '            "task": cell.task,\n'
              '            "method": cell.method,\n'
              '            "delta_v": cell.delta_v,\n'
              '            "beta": cell.beta,\n'
              '            "dpo_initialization": cell.dpo_initialization,\n'
              '            "rho": cell.rho,\n',
              'aggregate row DPO initialization',
          )
          runner = replace_once(
              runner,
              '        "task", "method", "seed", "stage", "late_window_pass8_mean",\n',
