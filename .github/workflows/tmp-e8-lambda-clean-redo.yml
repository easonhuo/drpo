name: Temporary clean lambda completion rewrite

on:
  push:
    branches:
      - dev/e8-multitask-lambda-completion-clean-02

permissions:
  contents: write

jobs:
  rewrite-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-lambda-completion-clean-02
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rewrite wrapper generically
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/drpo/e8_multitask_exp_tuning.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              assert count == 1, (count, old[:120])
              text = text.replace(old, new, 1)

          replace_once(
              'COLDSTART_EXPERIMENT_ID = "EXT-C-E8-MULTITASK-EXP-COLDSTART-01"\nSUPPORTED_EXPERIMENT_IDS = (EXPERIMENT_ID, DENSE_EXPERIMENT_ID, COLDSTART_EXPERIMENT_ID)',
              'COLDSTART_EXPERIMENT_ID = "EXT-C-E8-MULTITASK-EXP-COLDSTART-01"\nLAMBDA_COMPLETION_EXPERIMENT_ID = "EXT-C-E8-MULTITASK-EXP-LAMBDA-COMPLETION-01"\nSUPPORTED_EXPERIMENT_IDS = (\n    EXPERIMENT_ID,\n    DENSE_EXPERIMENT_ID,\n    COLDSTART_EXPERIMENT_ID,\n    LAMBDA_COMPLETION_EXPERIMENT_ID,\n)',
          )
          replace_once(
              'def _is_coldstart(config: Mapping[str, Any]) -> bool:\n    return sweep_profile(config) == SWEEP_PROFILE_COLDSTART\n\n\ndef _is_engineering_self_test',
              'def _is_coldstart(config: Mapping[str, Any]) -> bool:\n    return sweep_profile(config) == SWEEP_PROFILE_COLDSTART\n\n\ndef _is_lambda_only_coldstart(config: Mapping[str, Any]) -> bool:\n    return _is_coldstart(config) and str(config.get("sweep", {}).get("parameterization", "")) == "paper_lambda_c1"\n\n\ndef _is_engineering_self_test',
          )
          replace_once(
              '            current_experiment != COLDSTART_EXPERIMENT_ID\n',
              '            current_experiment not in (COLDSTART_EXPERIMENT_ID, LAMBDA_COMPLETION_EXPERIMENT_ID)\n',
          )

          start_marker = '''    else:\n        task_lambda = sweep.get("task_lambda")\n        if not isinstance(task_lambda, Mapping) or set(task_lambda) != set(tasks):\n            raise ValueError("Cold-start task_lambda must contain the exact nine tasks")\n'''
          end_marker = '\n        initialization = config.get("initialization", {})\n'
          start = text.index(start_marker, text.index('    sweep = config["sweep"]'))
          end = text.index(end_marker, start)
          new_block = '''    else:\n        task_lambda = sweep.get("task_lambda")\n        if not isinstance(task_lambda, Mapping) or set(task_lambda) != set(tasks):\n            raise ValueError("Cold-start task_lambda must contain the exact nine tasks")\n        transfer_tasks = set(tasks) - {"countdown"}\n        grid_hashes = sweep.get("task_grid_hashes")\n        provenance = sweep.get("task_grid_provenance")\n        if not isinstance(grid_hashes, Mapping) or set(grid_hashes) != transfer_tasks:\n            raise ValueError("Transfer task-grid hashes must cover the exact eight tasks")\n        if not isinstance(provenance, Mapping) or set(provenance) != transfer_tasks:\n            raise ValueError("Transfer task-grid provenance must cover the exact eight tasks")\n        if any(not str(provenance[task]).strip() for task in transfer_tasks):\n            raise ValueError("Transfer task-grid provenance entries must be non-empty")\n        for task in transfer_tasks:\n            values = _task_lambdas(config, str(task))\n            if len(values) != len(set(values)):\n                raise ValueError(f"{task} contains duplicate Exp coefficients")\n            if stable_hash(list(values)) != str(grid_hashes[task]):\n                raise ValueError(f"{task} coefficient grid does not match its configured hash")\n\n        countdown_values = _task_lambdas(config, "countdown")\n        countdown_sentinels = _tuple_floats(sweep.get("countdown_sentinel_coefficients", ()))\n        if countdown_values != countdown_sentinels:\n            raise ValueError("Countdown task_lambda and sentinel coefficients must agree")\n        countdown_seeds = tuple(int(value) for value in sweep.get("countdown_seed_offsets", ()))\n        positive_seeds = tuple(\n            int(value) for value in sweep.get("transfer_positive_only_seed_offsets", ())\n        )\n        if len(countdown_seeds) != len(set(countdown_seeds)):\n            raise ValueError("Countdown seed offsets must be unique")\n        if len(positive_seeds) != len(set(positive_seeds)):\n            raise ValueError("Transfer Positive-only seed offsets must be unique")\n\n        if current_experiment == COLDSTART_EXPERIMENT_ID:\n            expected_countdown = (\n                0.105360516,\n                0.430782916,\n                0.916290732,\n                1.897119985,\n                2.302585093,\n                2.995732274,\n            )\n            if countdown_values != expected_countdown:\n                raise ValueError("Countdown sentinel coefficients drifted")\n            if countdown_seeds != PAPER_SEED_OFFSETS:\n                raise ValueError("Countdown must preserve the two paper seed offsets")\n            if positive_seeds != (4000, 5000, 6000, 7000):\n                raise ValueError("Transfer Positive-only must use the four frozen historical seed streams")\n            if int(sweep.get("task_transfer_seed_offset", -1)) != 4000:\n                raise ValueError("Transfer Exp response-shape localization must use seed 4000")\n            if int(sweep.get("tuning_seed", -1)) != 4000:\n                raise ValueError("Cold-start tuning_seed must remain 4000")\n            expected_hashes = {\n                "word_sorting": "d24edbd6099f1d4f081318b305e62b39834db7ab94af6b4279d706f94e8d6de3",\n                "spiral_matrix": "805966b9e3e1774e748d1d96ca64667e23276782681e15c1e072e5536a02199a",\n                "mini_sudoku": "2340c4729b70ae5bafb7b6bf07049f38056b18368749bba3b967b4bbd950e29c",\n                "maze": "399732f8572faf670a0486cd5f838d3956bfa56cabbb5ae79b8521fbbfc45d33",\n                "word_ladder": "4fff6be5b923b9071ae0ee949e734087330463072d9be02015a661e51a2689e4",\n                "knights_knaves": "37f675c933e909ac1ca8a6464c8ed72497758b31d1c8a82c855cad10961c4cab",\n                "graph_color": "65c02a38a4339888d2e485c277fa1668a5e0309fab857e3ae2b2b2c0dc862f9d",\n                "wikisql": "e42e516dbbe0bfd0f9fd00f5dec22949f88503253a2235c8c81bd908af4779a0",\n            }\n            if dict(grid_hashes) != expected_hashes:\n                raise ValueError("Historical transfer task-grid hashes drifted")\n            for task in transfer_tasks:\n                if len(_task_lambdas(config, str(task))) != 20:\n                    raise ValueError(f"{task} must contain exactly 20 historical Exp coefficients")\n            if int(sweep.get("expected_cells", -1)) != 208:\n                raise ValueError("Historical cold-start must contain exactly 208 cells")\n        else:\n            if not _is_lambda_only_coldstart(config):\n                raise ValueError("Lambda-completion cold-start must use paper_lambda_c1")\n            int(sweep["tuning_seed"])\n            int(sweep["task_transfer_seed_offset"])\n            expected_cells = len(countdown_seeds) * (2 + len(countdown_values))\n            expected_cells += sum(\n                len(positive_seeds) + len(_task_lambdas(config, str(task)))\n                for task in transfer_tasks\n            )\n            if int(sweep.get("expected_cells", -1)) != expected_cells:\n                raise ValueError(\n                    f"Configured cold-start cell count must equal its expanded matrix ({expected_cells})"\n                )\n'''
          text = text[:start] + new_block + text[end:]

          old_exec = '''    expected_waves = 13 if profile == SWEEP_PROFILE_COLDSTART else (\n        7 if profile == SWEEP_PROFILE_DENSE else 5\n    )\n'''
          new_exec = '''    expected_waves = (\n        math.ceil(int(config["sweep"]["expected_cells"]) / expected_capacity)\n        if profile == SWEEP_PROFILE_COLDSTART\n        else (7 if profile == SWEEP_PROFILE_DENSE else 5)\n    )\n'''
          replace_once(old_exec, new_exec)

          start = text.index('    if _is_coldstart(config):\n', text.index('def build_cells'))
          end = text.index('    coarse = _tuple_floats', start)
          build_block = '''    if _is_coldstart(config):\n        lambda_only = _is_lambda_only_coldstart(config)\n        cells: list[Cell] = []\n        countdown_coefficients = _task_lambdas(config, "countdown")\n        for seed_offset in tuple(int(value) for value in config["sweep"]["countdown_seed_offsets"]):\n            cells.append(\n                Cell("countdown", METHOD_POSITIVE_ONLY, None, seed_offset, "countdown_sentinel")\n            )\n            cells.append(\n                Cell("countdown", METHOD_GLOBAL, 1.0, seed_offset, "countdown_sentinel", 0.0)\n            )\n            cells.extend(\n                Cell(\n                    "countdown",\n                    METHOD_EXPONENTIAL,\n                    None if lambda_only else math.exp(-coefficient),\n                    seed_offset,\n                    "countdown_sentinel",\n                    coefficient,\n                )\n                for coefficient in countdown_coefficients\n            )\n        positive_seeds = tuple(\n            int(value) for value in config["sweep"]["transfer_positive_only_seed_offsets"]\n        )\n        exp_seed = int(config["sweep"]["task_transfer_seed_offset"])\n        for task in tasks:\n            if task == "countdown":\n                continue\n            cells.extend(\n                Cell(task, METHOD_POSITIVE_ONLY, None, seed_offset, "task_transfer")\n                for seed_offset in positive_seeds\n            )\n            cells.extend(\n                Cell(\n                    task,\n                    METHOD_EXPONENTIAL,\n                    None if lambda_only else math.exp(-coefficient),\n                    exp_seed,\n                    "task_transfer",\n                    coefficient,\n                )\n                for coefficient in _task_lambdas(config, task)\n            )\n        result = tuple(cells)\n        expected = int(config["sweep"]["expected_cells"])\n        if len(result) != expected or len({cell.key for cell in result}) != expected:\n            raise AssertionError(f"Internal cold-start identity failure: expected {expected} cells")\n        return result\n'''
          text = text[:start] + build_block + text[end:]

          start = text.index('    if _is_coldstart(config):\n', text.index('def build_waves'))
          end = text.index('    coarse = tuple(cell for cell in cells', start)
          waves_block = '''    if _is_coldstart(config):\n        waves = tuple(\n            tuple(cells[index : index + capacity]) for index in range(0, len(cells), capacity)\n        )\n        expected_sizes = [capacity] * (len(cells) // capacity)\n        if len(cells) % capacity:\n            expected_sizes.append(len(cells) % capacity)\n        if (\n            len(waves) != int(config["execution"]["expected_waves"])\n            or [len(wave) for wave in waves] != expected_sizes\n        ):\n            raise AssertionError("Cold-start wave geometry does not match the configured matrix")\n        return waves\n'''
          text = text[:start] + waves_block + text[end:]

          old_diag_start = text.index('def _countdown_protocol_diagnostic(')
          old_diag_end = text.index('\ndef cmd_run_dynamic(', old_diag_start)
          diag_func = '''def _countdown_protocol_diagnostic(\n    config: Mapping[str, Any],\n    output_root: Path,\n    *,\n    destination: Path | None = None,\n) -> dict[str, Any]:\n    """Audit configured Countdown cells without making them a scientific result gate."""\n\n    countdown_cells = [cell for cell in build_cells(config) if cell.task == "countdown"]\n    if _is_engineering_self_test(config):\n        diagnostic = {\n            "schema_version": 1,\n            "experiment_id": experiment_id(config),\n            "status": "NOT_RUN_ENGINEERING",\n            "countdown_cells": len(countdown_cells),\n            "result_gate": False,\n            "controls_task_transfer_release": False,\n            "scientific_evidence": False,\n        }\n    elif not countdown_cells:\n        diagnostic = {\n            "schema_version": 1,\n            "experiment_id": experiment_id(config),\n            "status": "NOT_APPLICABLE_NO_CONFIGURED_COUNTDOWN_CELLS",\n            "countdown_cells": 0,\n            "identity_failures": [],\n            "result_gate": False,\n            "controls_task_transfer_release": False,\n            "scientific_evidence": False,\n        }\n    else:\n        expected_sources = dict(config["canonical_coldstart"]["expected_git_blob_shas"])\n        identity_failures: list[str] = []\n        for cell in countdown_cells:\n            path = output_root / "cells" / cell.key / "cell_manifest.json"\n            if not path.is_file():\n                identity_failures.append(f"{cell.key}:missing")\n                continue\n            value = json.loads(path.read_text(encoding="utf-8"))\n            if (\n                value.get("complete") is not True\n                or value.get("evaluation_status") != "complete"\n                or value.get("nan_inf_failure") is not False\n                or value.get("countdown_protocol_exact") is not True\n                or value.get("canonical_dispatch")\n                != "countdown_e8_alpha1_highc_scan_runtime.worker"\n                or value.get("canonical_source_git_blob_shas") != expected_sources\n                or int(value.get("terminal_step", -1)) != 1200\n                or value.get("stop_reason") != "max_steps"\n            ):\n                identity_failures.append(f"{cell.key}:protocol_identity")\n        diagnostic = {\n            "schema_version": 1,\n            "experiment_id": experiment_id(config),\n            "status": "PASS" if not identity_failures else "FAIL",\n            "countdown_cells": len(countdown_cells),\n            "identity_failures": identity_failures,\n            "result_gate": False,\n            "controls_task_transfer_release": False,\n            "scientific_evidence": True,\n        }\n    if destination is not None:\n        atomic_json(destination, diagnostic)\n    return diagnostic\n\n'''
          text = text[:old_diag_start] + diag_func + text[old_diag_end + 1:]

          replace_once(
              '''    expected = [cell for cell in build_cells(config) if cell.task == task]\n    expected_count = 16 if task == "countdown" else 24\n    if len(expected) != expected_count:\n        raise AssertionError(f"{task} expected {expected_count} cold-start cells")\n''',
              '''    expected = [cell for cell in build_cells(config) if cell.task == task]\n    if not expected:\n        return None\n''',
          )
          replace_once(
              '        "expected_cells": 16 if task == "countdown" else 24,\n',
              '        "expected_cells": len(rows),\n',
          )
          replace_once(
              '            "the terminal 208-cell aggregate remains the final reporting authority."\n',
              '            "the terminal aggregate remains the final reporting authority."\n',
          )

          replace_once(
              '''    summaries: dict[str, Any] = {}\n    summary_rows: list[dict[str, Any]] = []\n    for task_value in config["suite"]["tasks"]:\n        task = str(task_value)\n        task_rows = [row for row in rows if row["task"] == task]\n        positive_rows = [row for row in task_rows if row["method"] == METHOD_POSITIVE_ONLY]\n        global_rows = [row for row in task_rows if row["method"] == METHOD_GLOBAL]\n        exp_rows = [row for row in task_rows if row["method"] == METHOD_EXPONENTIAL]\n        expected_counts = (2, 2, 12) if task == "countdown" else (4, 0, 20)\n        if (len(positive_rows), len(global_rows), len(exp_rows)) != expected_counts:\n            raise RuntimeError(f"{task} cold-start cell counts differ from {expected_counts}")\n''',
              '''    summaries: dict[str, Any] = {}\n    summary_rows: list[dict[str, Any]] = []\n    configured_cells = build_cells(config)\n    for task_value in config["suite"]["tasks"]:\n        task = str(task_value)\n        expected_task_cells = [cell for cell in configured_cells if cell.task == task]\n        if not expected_task_cells:\n            continue\n        task_rows = [row for row in rows if row["task"] == task]\n        positive_rows = [row for row in task_rows if row["method"] == METHOD_POSITIVE_ONLY]\n        global_rows = [row for row in task_rows if row["method"] == METHOD_GLOBAL]\n        exp_rows = [row for row in task_rows if row["method"] == METHOD_EXPONENTIAL]\n        expected_counts = tuple(\n            sum(cell.method == method for cell in expected_task_cells)\n            for method in (METHOD_POSITIVE_ONLY, METHOD_GLOBAL, METHOD_EXPONENTIAL)\n        )\n        if (len(positive_rows), len(global_rows), len(exp_rows)) != expected_counts:\n            raise RuntimeError(f"{task} cold-start cell counts differ from {expected_counts}")\n''',
          )
          replace_once(
              '        "transfer_positive_only_seed_count": 4,\n',
              '        "transfer_positive_only_seed_count": len(config["sweep"]["transfer_positive_only_seed_offsets"]),\n',
          )

          replace_once(
              '''        aggregate_complete = aggregate_path.is_file() and int(\n            json.loads(aggregate_path.read_text(encoding="utf-8")).get("cell_count", 0)\n        ) == len(cells) and reproduction_gate_status == (\n            "NOT_RUN_ENGINEERING" if _is_engineering_self_test(config) else "PASS"\n        )\n''',
              '''        has_countdown_cells = any(cell.task == "countdown" for cell in cells)\n        expected_protocol_status = (\n            "NOT_RUN_ENGINEERING"\n            if _is_engineering_self_test(config)\n            else (\n                "PASS"\n                if has_countdown_cells\n                else "NOT_APPLICABLE_NO_CONFIGURED_COUNTDOWN_CELLS"\n            )\n        )\n        aggregate_complete = aggregate_path.is_file() and int(\n            json.loads(aggregate_path.read_text(encoding="utf-8")).get("cell_count", 0)\n        ) == len(cells) and reproduction_gate_status == expected_protocol_status\n''',
          )

          path.write_text(text, encoding='utf-8')

          cfg = Path('configs/e8_multitask_exp_lambda_completion.yaml')
          ctext = cfg.read_text(encoding='utf-8')
          ctext = ctext.replace('  countdown_role: diagnostic_regression_sentinel_not_result_gate\n', '  countdown_role: predecessor_only_no_new_scientific_cells\n')
          ctext = ctext.replace('  positive_only_seed_count_per_transfer_task: 4\n', '  positive_only_seed_count_per_transfer_task: 2\n')
          ctext = ctext.replace('  causal_identification_environment: D-U1\n', '  scientific_role: external_validity_response_shape\n')
          cfg.write_text(ctext, encoding='utf-8')

          tests = Path('tests/test_e8_multitask_p0.py')
          ttext = tests.read_text(encoding='utf-8')
          marker = '\ndef test_lambda_completion_config_drives_lambda_only_cells() -> None:\n'
          assert marker not in ttext
          ttext += r'''\n\ndef test_lambda_completion_config_drives_lambda_only_cells() -> None:\n    from drpo import e8_multitask_exp_tuning as exp_tuning\n\n    config = exp_tuning.load_config(Path("configs/e8_multitask_exp_lambda_completion.yaml"))\n    cells = exp_tuning.build_cells(config)\n    assert len(cells) == int(config["sweep"]["expected_cells"])\n    assert not any(cell.task == "countdown" for cell in cells)\n    positive_seeds = sorted(int(value) for value in config["sweep"]["transfer_positive_only_seed_offsets"])\n    for task in config["suite"]["p0_tasks"]:\n        task_cells = [cell for cell in cells if cell.task == task]\n        positive = [cell for cell in task_cells if cell.method == exp_tuning.METHOD_POSITIVE_ONLY]\n        exponential = [cell for cell in task_cells if cell.method == exp_tuning.METHOD_EXPONENTIAL]\n        assert sorted(cell.seed for cell in positive) == positive_seeds\n        assert [cell.lambda_value for cell in exponential] == [\n            float(value) for value in config["sweep"]["task_lambda"][task]\n        ]\n        assert all(cell.rho is None for cell in exponential)\n\n    waves = exp_tuning.build_waves(config)\n    assert len(waves) == int(config["execution"]["expected_waves"])\n    assert sum(len(wave) for wave in waves) == len(cells)\n    assert all(0 < len(wave) <= int(config["execution"]["max_concurrent_cells"]) for wave in waves)\n    assert [cell.key for wave in waves for cell in wave] == [cell.key for cell in cells]\n\n\n@pytest.mark.skipif(torch is None, reason="Torch is unavailable in the test runtime")\ndef test_lambda_completion_frozen_domain_transport_is_exactly_equivalent() -> None:\n    from drpo import countdown_e8_alpha1_highc_scan_common as paper_common\n    from drpo import e8_multitask_exp_tuning as exp_tuning\n\n    config = exp_tuning.load_config(Path("configs/e8_multitask_exp_lambda_completion.yaml"))\n    lambdas = sorted(\n        {\n            float(value)\n            for task in config["suite"]["p0_tasks"]\n            for value in config["sweep"]["task_lambda"][task]\n        }\n    )\n    row_index = torch.tensor([0, 0, 1, 1], dtype=torch.long)\n    unique_counts = torch.tensor([2, 2], dtype=torch.long)\n    seed = int(config["sweep"]["task_transfer_seed_offset"])\n\n    for lambda_value in lambdas:\n        historical = exp_tuning.Cell(\n            "maze", exp_tuning.METHOD_EXPONENTIAL, math.exp(-lambda_value), seed, "historical", lambda_value\n        )\n        successor = exp_tuning.Cell(\n            "maze", exp_tuning.METHOD_EXPONENTIAL, None, seed, "successor", lambda_value\n        )\n        assert historical.key == successor.key\n        assert float(historical.lambda_value).hex() == float(successor.lambda_value).hex()\n\n        historical_lp = torch.tensor(\n            [-0.25, -1.0, -4.0, -9.0], dtype=torch.float64, requires_grad=True\n        )\n        successor_lp = historical_lp.detach().clone().requires_grad_(True)\n        historical_weights = paper_common.continuous_exp_weights(\n            historical_lp, alpha=1.0, c=float(historical.lambda_value)\n        )\n        successor_weights = paper_common.continuous_exp_weights(\n            successor_lp, alpha=1.0, c=float(successor.lambda_value)\n        )\n        assert torch.equal(historical_weights, successor_weights)\n        historical_loss = paper_common.mean_unique_negative_term(\n            historical_lp, historical_weights, row_index, unique_counts\n        )\n        successor_loss = paper_common.mean_unique_negative_term(\n            successor_lp, successor_weights, row_index, unique_counts\n        )\n        assert torch.equal(historical_loss, successor_loss)\n        assert torch.equal(\n            torch.autograd.grad(historical_loss, historical_lp)[0],\n            torch.autograd.grad(successor_loss, successor_lp)[0],\n        )\n'''
          tests.write_text(ttext, encoding='utf-8')
          PY
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Targeted tests
        run: >-
          python -m pytest -q tests/test_e8_multitask_p0.py
          -k 'lambda_completion or lambda_only_canonical_transport_is_exactly_equivalent or exp_coldstart_matrix_is_208_cells_in_13_hard_waves'
      - name: Fatal Ruff
        run: ruff check --select E9,F63,F7,F82 src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
      - name: Scientific-core identity gate
        run: |
          git diff --quiet 5260ca58ecb67509838a1e5480f6dcaafdb7a773 -- \
            src/drpo/countdown_qwen_arena_onefile.py \
            src/drpo/countdown_e8_alpha1_c_scan_common.py \
            src/drpo/countdown_e8_alpha1_c_scan_runtime.py \
            src/drpo/countdown_e8_alpha1_c_scan_trainer.py \
            src/drpo/countdown_e8_alpha1_highc_scan_common.py \
            src/drpo/countdown_e8_alpha1_highc_scan_runtime.py
      - name: Commit clean implementation
        run: |
          rm .github/workflows/tmp-e8-lambda-clean-redo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configs/e8_multitask_exp_lambda_completion.yaml src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py .github/workflows/tmp-e8-lambda-clean-redo.yml
          git commit -m 'E8: make lambda completion config-driven'
          git push origin HEAD:dev/e8-multitask-lambda-completion-clean-02
