name: TEMP E8 Exp source reconstruction

on:
  push:
    branches:
      - dev/e8-multitask-exp-tuning-01
    paths:
      - .github/e8-exp-source/e8_multitask_exp_tuning.py.gz
      - .github/workflows/temp-e8-exp-reconstruct.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-e8-exp-source-reconstruction
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-exp-tuning-01
          fetch-depth: 0

      - name: Reconstruct exact leakage-safe reviewed source
        shell: bash
        run: |
          set -euo pipefail
          gzip_file=.github/e8-exp-source/e8_multitask_exp_tuning.py.gz
          printf '%s  %s\n' \
            'cd206ca89e66938c280579b6748fd9c2d00b86d398c12d1245aba3aecbc2bae6' \
            "$gzip_file" | sha256sum --check --strict
          gzip --decompress --stdout "$gzip_file" > /tmp/e8_multitask_exp_tuning.py
          printf '%s  %s\n' \
            '4fb580228e1832f6f04f47cf28ff4fdca665698dc435bb3ebd1a655eefa564c4' \
            '/tmp/e8_multitask_exp_tuning.py' | sha256sum --check --strict
          test "$(wc -l < /tmp/e8_multitask_exp_tuning.py)" -eq 2370
          python -m py_compile /tmp/e8_multitask_exp_tuning.py
          install -m 0644 /tmp/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_exp_tuning.py
          printf '%s  %s\n' \
            '4fb580228e1832f6f04f47cf28ff4fdca665698dc435bb3ebd1a655eefa564c4' \
            'src/drpo/e8_multitask_exp_tuning.py' | sha256sum --check --strict

      - name: Commit reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/drpo/e8_multitask_exp_tuning.py
          if git diff --cached --quiet; then
            echo 'Exact source already present.'
            exit 0
          fi
          git commit -m 'EXT-C-E8-MULTITASK-EXP-TUNING-01: install leakage-safe reviewed source'
          git push origin HEAD:dev/e8-multitask-exp-tuning-01

# Triggered through the Contents API so the push workflow is scheduled.
