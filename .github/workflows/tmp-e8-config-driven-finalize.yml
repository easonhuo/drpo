name: Temporary E8 config-driven finalize

on:
  push:
    branches:
      - dev/e8-config-driven-sweep-01
    paths:
      - .github/workflows/tmp-e8-config-driven-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0

      - name: Apply reviewed config-driven fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path("src/drpo/e8_multitask_exp_tuning.py")
          text = core.read_text(encoding="utf-8")
          old = '''        if countdown_seeds and not countdown_values:\n            raise ValueError("Countdown seeds require configured Countdown lambda sentinels")\n'''
          new = '''        if bool(countdown_values) != bool(countdown_seeds):\n            raise ValueError(\n                "Countdown lambda grid and seed offsets must be enabled or disabled together"\n            )\n'''
          assert old in text
          text = text.replace(old, new, 1)
          core.write_text(text, encoding="utf-8")

          runner = Path("scripts/run_e8_multitask_exp_coldstart.sh")
          text = runner.read_text(encoding="utf-8")
          start = text.index("SUCCESSOR_SOURCE_ARGS=()")
          end = text.index('case "${RUN_CLASS}" in', start)
          text = text[:start] + text[end:]
          text = "".join(
              line for line in text.splitlines(keepends=True)
              if "SUCCESSOR_SOURCE_ARGS" not in line
          )
          runner.write_text(text, encoding="utf-8")

          for name in (
              "configs/e8_multitask_exp_lambda_completion.yaml",
              "configs/e8_multitask_exp_lambda_curve_completion.yaml",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              assert text.count("    countdown: *id002\n") == 1, name
              path.write_text(
                  text.replace("    countdown: *id002\n", "    countdown: []\n", 1),
                  encoding="utf-8",
              )

          tests = Path("tests/test_e8_multitask_p0.py")
          text = tests.read_text(encoding="utf-8")
          marker = '''def test_lambda_curve_completion_aggregate_accepts_zero_positive_only(tmp_path: Path) -> None:\n'''
          assert text.count(marker) == 1
          addition = '''def test_coldstart_countdown_enablement_is_config_consistent() -> None:\n    from drpo import e8_multitask_exp_tuning as exp_tuning\n\n    config = exp_tuning.load_config(Path("configs/e8_multitask_exp_coldstart.yaml"))\n\n    values_without_seeds = copy.deepcopy(config)\n    values_without_seeds["sweep"]["countdown_seed_offsets"] = []\n    with pytest.raises(ValueError, match="enabled or disabled together"):\n        exp_tuning.validate_config(values_without_seeds)\n\n    seeds_without_values = copy.deepcopy(config)\n    seeds_without_values["sweep"]["task_lambda"]["countdown"] = []\n    with pytest.raises(ValueError, match="enabled or disabled together"):\n        exp_tuning.validate_config(seeds_without_values)\n\n\ndef test_generic_coldstart_runner_has_no_successor_id_control_flow() -> None:\n    runner = Path("scripts/run_e8_multitask_exp_coldstart.sh").read_text(encoding="utf-8")\n    assert "SUCCESSOR_SOURCE_ARGS" not in runner\n    assert "EXT-C-E8-MULTITASK-EXP-LAMBDA-COMPLETION-01" not in runner\n    assert "EXT-C-E8-MULTITASK-EXP-LAMBDA-CURVE-COMPLETION-02" not in runner\n\n\n'''
          text = text.replace(marker, addition + marker, 1)
          old_assert = '''    assert not any(cell.task == "countdown" for cell in cells)\n'''
          assert old_assert in text
          text = text.replace(
              old_assert,
              '''    assert config["sweep"]["task_lambda"]["countdown"] == []\n    assert not any(cell.task == "countdown" for cell in cells)\n''',
              1,
          )
          tests.write_text(text, encoding="utf-8")
          PY

      - name: Validate semantic behavior without GPU
        shell: bash
        run: |
          python -m pip install -q "numpy==1.26.4" "PyYAML==6.0.2"
          export PYTHONPATH="$PWD/src"
          python -m py_compile src/drpo/e8_multitask_exp_tuning.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          python - <<'PY'
          import copy
          from pathlib import Path
          from drpo import e8_multitask_exp_tuning as e8

          cold = e8.load_config(Path("configs/e8_multitask_exp_coldstart.yaml"))
          completion = e8.load_config(Path("configs/e8_multitask_exp_lambda_completion.yaml"))
          curve = e8.load_config(Path("configs/e8_multitask_exp_lambda_curve_completion.yaml"))
          assert len(e8.build_cells(cold)) == 208
          assert len(e8.build_cells(completion)) == 199
          assert len(e8.build_cells(curve)) == 140
          assert completion["sweep"]["task_lambda"]["countdown"] == []
          assert curve["sweep"]["task_lambda"]["countdown"] == []
          assert [len(w) for w in e8.build_waves(completion)] == [16] * 12 + [7]
          assert [len(w) for w in e8.build_waves(curve)] == [16] * 8 + [12]

          synthetic = copy.deepcopy(curve)
          synthetic["experiment_id"] = "EXT-C-E8-MULTITASK-EXP-UNSEEN-SYNTHETIC"
          synthetic["sweep"]["task_transfer_seed_offset"] = 5000
          synthetic["sweep"]["tuning_seed"] = 5000
          synthetic["sweep"]["transfer_positive_only_seed_offsets"] = [8000, 9000]
          synthetic["sweep"]["task_lambda"]["maze"] = []
          synthetic["sweep"]["task_lambda"]["word_sorting"] = [13.0, 15.0, 18.0]
          for task in synthetic["suite"]["p0_tasks"]:
              synthetic["sweep"]["task_grid_hashes"][task] = e8.stable_hash(
                  list(synthetic["sweep"]["task_lambda"][task])
              )
          active = [
              task for task in synthetic["suite"]["p0_tasks"]
              if synthetic["sweep"]["task_lambda"][task]
          ]
          synthetic["sweep"]["expected_cells"] = sum(
              len(synthetic["sweep"]["transfer_positive_only_seed_offsets"])
              + len(synthetic["sweep"]["task_lambda"][task])
              for task in active
          )
          synthetic["execution"].pop("expected_waves", None)
          e8.validate_config(synthetic)
          assert len(e8.build_cells(synthetic)) == synthetic["sweep"]["expected_cells"]

          values_without_seeds = copy.deepcopy(cold)
          values_without_seeds["sweep"]["countdown_seed_offsets"] = []
          try:
              e8.validate_config(values_without_seeds)
          except ValueError as exc:
              assert "enabled or disabled together" in str(exc)
          else:
              raise AssertionError("Countdown values without seeds must fail")

          seeds_without_values = copy.deepcopy(cold)
          seeds_without_values["sweep"]["task_lambda"]["countdown"] = []
          try:
              e8.validate_config(seeds_without_values)
          except ValueError as exc:
              assert "enabled or disabled together" in str(exc)
          else:
              raise AssertionError("Countdown seeds without values must fail")

          runner = Path("scripts/run_e8_multitask_exp_coldstart.sh").read_text()
          assert "SUCCESSOR_SOURCE_ARGS" not in runner
          assert "EXT-C-E8-MULTITASK-EXP-LAMBDA-COMPLETION-01" not in runner
          assert "EXT-C-E8-MULTITASK-EXP-LAMBDA-CURVE-COMPLETION-02" not in runner
          PY
          git diff --check

      - name: Commit finalized fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-e8-config-driven-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/drpo/e8_multitask_exp_tuning.py \
                  scripts/run_e8_multitask_exp_coldstart.sh \
                  configs/e8_multitask_exp_lambda_completion.yaml \
                  configs/e8_multitask_exp_lambda_curve_completion.yaml \
                  tests/test_e8_multitask_p0.py \
                  .github/workflows/tmp-e8-config-driven-finalize.yml
          git commit -m "E8: close config-driven sweep gaps"
          git push origin HEAD:dev/e8-config-driven-sweep-01
