name: E8 multitask TOPR capability finalize

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-multitask-baselines-topr-finalize.yml

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply TOPR capability patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str, count: int, label: str) -> str:
              observed = text.count(old)
              if observed != count:
                  raise RuntimeError(f"{label}: expected {count} matches, found {observed}")
              return text.replace(old, new, count)

          config_path = Path('src/drpo/e8_experiment_config.py')
          text = config_path.read_text(encoding='utf-8')
          text = replace_exact(
              text,
              'COLDSTART_METHOD_ASYMRE = "asymre"\nASYMRE_PARAMETERIZATION = "asymre_delta_v"\n',
              'COLDSTART_METHOD_ASYMRE = "asymre"\nCOLDSTART_METHOD_TOPR = "joint_fitted_reference_topr"\nASYMRE_PARAMETERIZATION = "asymre_delta_v"\nTOPR_PARAMETERIZATION = "joint_fitted_reference_beta_topr"\n',
              1,
              'config constants',
          )
          marker = '''def task_delta_vs(config: Mapping[str, Any], task: str) -> tuple[float, ...]:\n    raw = _sequence(\n        config["sweep"]["task_delta_v"][task],\n        f"{task} delta_v grid",\n    )\n    return tuple(_number(value, f"{task} delta_v value") for value in raw)\n\n\n'''
          replacement = marker + '''def task_betas(config: Mapping[str, Any], task: str) -> tuple[float, ...]:\n    raw = _sequence(\n        config["sweep"]["task_beta"][task],\n        f"{task} beta grid",\n    )\n    values = tuple(_number(value, f"{task} beta value") for value in raw)\n    if any(value < 0.0 for value in values):\n        raise ValueError(f"{task} TOPR beta values must be non-negative")\n    return values\n\n\n'''
          text = replace_exact(text, marker, replacement, 1, 'task_betas helper')
          old = '''    elif method == COLDSTART_METHOD_ASYMRE:\n        if sweep.get("parameterization") != ASYMRE_PARAMETERIZATION:\n            raise ValueError("AsymRE cold-start requires asymre_delta_v parameterization")\n        task_values = _mapping(sweep.get("task_delta_v"), "sweep.task_delta_v")\n        if set(task_values) != set(tasks):\n            raise ValueError("Cold-start task_delta_v must contain the exact nine tasks")\n        read_values = task_delta_vs\n    else:\n        raise ValueError(f"Unsupported sweep.method for cold-start: {method}")\n'''
          new = '''    elif method == COLDSTART_METHOD_ASYMRE:\n        if sweep.get("parameterization") != ASYMRE_PARAMETERIZATION:\n            raise ValueError("AsymRE cold-start requires asymre_delta_v parameterization")\n        task_values = _mapping(sweep.get("task_delta_v"), "sweep.task_delta_v")\n        if set(task_values) != set(tasks):\n            raise ValueError("Cold-start task_delta_v must contain the exact nine tasks")\n        read_values = task_delta_vs\n    elif method == COLDSTART_METHOD_TOPR:\n        if sweep.get("parameterization") != TOPR_PARAMETERIZATION:\n            raise ValueError(\n                "Joint Fitted-Reference beta-TOPR requires joint_fitted_reference_beta_topr parameterization"\n            )\n        task_values = _mapping(sweep.get("task_beta"), "sweep.task_beta")\n        if set(task_values) != set(tasks):\n            raise ValueError("Cold-start task_beta must contain the exact nine tasks")\n        read_values = task_betas\n    else:\n        raise ValueError(f"Unsupported sweep.method for cold-start: {method}")\n'''
          text = replace_exact(text, old, new, 1, 'TOPR sweep validation')
          old = '''    expected_formula = (\n        "A_equals_R_minus_delta_v"\n        if method == COLDSTART_METHOD_ASYMRE\n        else "alpha_times_exp_minus_c_times_current_sequence_surprisal_div_2"\n    )\n'''
          new = '''    expected_formula = {\n        COLDSTART_METHOD_ASYMRE: "A_equals_R_minus_delta_v",\n        COLDSTART_METHOD_TOPR: "joint_fitted_reference_beta_ratio_taper",\n    }.get(method, "alpha_times_exp_minus_c_times_current_sequence_surprisal_div_2")\n'''
          text = replace_exact(text, old, new, 1, 'TOPR formula contract')
          config_path.write_text(text, encoding='utf-8')

          tuning_path = Path('src/drpo/e8_multitask_exp_tuning.py')
          text = tuning_path.read_text(encoding='utf-8')
          old = '''CANONICAL_ASYMRE_GRID = Path(\n    "configs/countdown_e8_oracle_offline_v2_asymre_deltav_scan_0p5b.yaml"\n)\nMETHOD_POSITIVE_ONLY = "positive_only"\nMETHOD_EXPONENTIAL = "exponential"\nMETHOD_ASYMRE = "asymre"\nMETHOD_GLOBAL = "global"\n'''
          new = '''CANONICAL_ASYMRE_GRID = Path(\n    "configs/countdown_e8_oracle_offline_v2_asymre_deltav_scan_0p5b.yaml"\n)\nCANONICAL_TOPR_GRID = Path(\n    "configs/countdown_e8_oracle_offline_v2_joint_fitted_reference_beta_topr_dense_0p5b.yaml"\n)\nMETHOD_POSITIVE_ONLY = "positive_only"\nMETHOD_EXPONENTIAL = "exponential"\nMETHOD_ASYMRE = "asymre"\nMETHOD_TOPR = "joint_fitted_reference_topr"\nMETHOD_GLOBAL = "global"\n'''
          text = replace_exact(text, old, new, 1, 'TOPR constants')
          text = replace_exact(
              text,
              '    lambda_value: float | None = None\n    delta_v: float | None = None\n',
              '    lambda_value: float | None = None\n    delta_v: float | None = None\n    beta: float | None = None\n',
              1,
              'Cell beta field',
          )
          old = '''        if self.method == METHOD_ASYMRE:\n            if self.delta_v is None:\n                raise AssertionError("AsymRE cell requires delta_v")\n            tag = f"{self.delta_v:.12g}".replace("-", "m").replace(".", "p")\n            return f"{self.task}__asymre_delta_v{tag}__seed{self.seed}"\n        if self.lambda_value is not None:\n'''
          new = '''        if self.method == METHOD_ASYMRE:\n            if self.delta_v is None:\n                raise AssertionError("AsymRE cell requires delta_v")\n            tag = f"{self.delta_v:.12g}".replace("-", "m").replace(".", "p")\n            return f"{self.task}__asymre_delta_v{tag}__seed{self.seed}"\n        if self.method == METHOD_TOPR:\n            if self.beta is None:\n                raise AssertionError("Joint Fitted-Reference TOPR cell requires beta")\n            tag = f"{self.beta:.12g}".replace("-", "m").replace(".", "p")\n            return f"{self.task}__joint_fitted_reference_topr_beta{tag}__seed{self.seed}"\n        if self.lambda_value is not None:\n'''
          text = replace_exact(text, old, new, 1, 'TOPR cell key')
          old = '''def _task_method_values(config: Mapping[str, Any], task: str) -> tuple[float, ...]:\n    if _coldstart_method(config) == METHOD_ASYMRE:\n        return experiment_config.task_delta_vs(config, task)\n    return _task_lambdas(config, task)\n'''
          new = '''def _task_method_values(config: Mapping[str, Any], task: str) -> tuple[float, ...]:\n    method = _coldstart_method(config)\n    if method == METHOD_ASYMRE:\n        return experiment_config.task_delta_vs(config, task)\n    if method == METHOD_TOPR:\n        return experiment_config.task_betas(config, task)\n    return _task_lambdas(config, task)\n'''
          text = replace_exact(text, old, new, 1, 'TOPR task values')
          old = '''            if method == METHOD_ASYMRE:\n                cells.extend(\n                    Cell(\n                        "countdown", METHOD_ASYMRE, None, seed_offset, "countdown_sentinel", None, delta_v\n                    )\n                    for delta_v in countdown_values\n                )\n            else:\n'''
          new = '''            if method == METHOD_ASYMRE:\n                cells.extend(\n                    Cell(\n                        "countdown", METHOD_ASYMRE, None, seed_offset, "countdown_sentinel", None, delta_v\n                    )\n                    for delta_v in countdown_values\n                )\n            elif method == METHOD_TOPR:\n                cells.extend(\n                    Cell(\n                        "countdown", METHOD_TOPR, None, seed_offset, "countdown_sentinel", None, None, beta\n                    )\n                    for beta in countdown_values\n                )\n            else:\n'''
          text = replace_exact(text, old, new, 1, 'TOPR countdown cells')
          old = '''            if method == METHOD_ASYMRE:\n                cells.extend(\n                    Cell(\n                        task, METHOD_ASYMRE, None, method_seed, "task_transfer", None, delta_v\n                    )\n                    for delta_v in values\n                )\n            else:\n'''
          new = '''            if method == METHOD_ASYMRE:\n                cells.extend(\n                    Cell(\n                        task, METHOD_ASYMRE, None, method_seed, "task_transfer", None, delta_v\n                    )\n                    for delta_v in values\n                )\n            elif method == METHOD_TOPR:\n                cells.extend(\n                    Cell(\n                        task, METHOD_TOPR, None, method_seed, "task_transfer", None, None, beta\n                    )\n                    for beta in values\n                )\n            else:\n'''
          text = replace_exact(text, old, new, 1, 'TOPR transfer cells')
          # Add beta to every generic Cell identity/result row that already carries delta_v.
          old = '"delta_v": cell.delta_v,\n'
          occurrences = text.count(old)
          if occurrences < 3:
              raise RuntimeError(f'TOPR beta identity: expected >=3 delta_v fields, found {occurrences}')
          text = text.replace(old, '"delta_v": cell.delta_v,\n                    "beta": cell.beta,\n', 1)
          # The remaining occurrences have 12-space indentation.
          old12 = '            "delta_v": cell.delta_v,\n'
          remaining = text.count(old12)
          if remaining < 2:
              raise RuntimeError(f'TOPR beta identity: expected >=2 indented delta_v fields, found {remaining}')
          text = text.replace(old12, '            "delta_v": cell.delta_v,\n            "beta": cell.beta,\n')
          old = '''def _paper_grid_for_cell(record: Mapping[str, Any], cell: Cell) -> Path:\n    if cell.method == METHOD_ASYMRE:\n        return _canonical_asymre_grid_path()\n    if cell.task != "countdown":\n'''
          new = '''def _paper_grid_for_cell(record: Mapping[str, Any], cell: Cell) -> Path:\n    if cell.method == METHOD_ASYMRE:\n        return _canonical_asymre_grid_path()\n    if cell.method == METHOD_TOPR:\n        return CANONICAL_TOPR_GRID.resolve()\n    if cell.task != "countdown":\n'''
          text = replace_exact(text, old, new, 1, 'TOPR grid choice')
          old = '''    if cell.method == METHOD_ASYMRE:\n        grid_source_path = _canonical_asymre_grid_path()\n    else:\n'''
          new = '''    if cell.method == METHOD_ASYMRE:\n        grid_source_path = _canonical_asymre_grid_path()\n    elif cell.method == METHOD_TOPR:\n        grid_source_path = CANONICAL_TOPR_GRID.resolve()\n    else:\n'''
          text = replace_exact(text, old, new, 1, 'TOPR source grid')
          old = '''                arena.completion_stats = lambda model, batch: {\n                    "seq_lp": -arena.sequence_surprisal_only(model, batch)\n                }\n'''
          new = '''                arena.completion_stats = lambda model, batch: {\n                    "seq_lp": -arena.sequence_surprisal_only(model, batch),\n                    "lengths": (batch["labels"] != -100).sum(dim=1),\n                }\n'''
          text = replace_exact(text, old, new, 1, 'TOPR sequence-length bridge')
          old = '''    if cell.method == METHOD_ASYMRE:\n        if cell.delta_v is None:\n            raise AssertionError("AsymRE cell has no delta_v")\n        paper_family = METHOD_ASYMRE\n        alpha = 1.0 + float(cell.delta_v)\n        coefficient = 0.0\n    else:\n'''
          new = '''    if cell.method == METHOD_ASYMRE:\n        if cell.delta_v is None:\n            raise AssertionError("AsymRE cell has no delta_v")\n        paper_family = METHOD_ASYMRE\n        alpha = 1.0 + float(cell.delta_v)\n        coefficient = 0.0\n    elif cell.method == METHOD_TOPR:\n        if cell.beta is None:\n            raise AssertionError("Joint Fitted-Reference TOPR cell has no beta")\n        paper_family = METHOD_TOPR\n        alpha = 1.0\n        coefficient = float(cell.beta)\n    else:\n'''
          text = replace_exact(text, old, new, 1, 'TOPR dispatch')
          text = replace_exact(
              text,
              '        "delta_v": cell.delta_v,\n        "canonical_summary": str(canonical_summary_path.resolve()),\n',
              '        "delta_v": cell.delta_v,\n        "beta": cell.beta,\n        "canonical_summary": str(canonical_summary_path.resolve()),\n',
              1,
              'TOPR canonical result beta',
          )
          old = '''    if family == METHOD_ASYMRE:\n        delta_v = float(liveness["representative_delta_v"])\n        return Cell(\n  "countdown",\n  METHOD_ASYMRE,\n  None,\n  int(seed_offsets[0]),\n  "liveness",\n  None,\n  delta_v,\n        )\n    coefficient = float(liveness["representative_c"])\n'''
          new = '''    if family == METHOD_ASYMRE:\n        delta_v = float(liveness["representative_delta_v"])\n        return Cell(\n  "countdown",\n  METHOD_ASYMRE,\n  None,\n  int(seed_offsets[0]),\n  "liveness",\n  None,\n  delta_v,\n        )\n    if family == METHOD_TOPR:\n        beta = float(liveness["representative_c"])
        return Cell(\n            "countdown", METHOD_TOPR, None, int(seed_offsets[0]), "liveness", None, None, beta\n        )\n    coefficient = float(liveness["representative_c"])\n'''
          text = replace_exact(text, old, new, 1, 'TOPR liveness cell')
          old = '''    grid_path = (\n        _canonical_asymre_grid_path()\n        if _coldstart_method(config) == METHOD_ASYMRE\n        else Path(str(record["round1_grid"]))\n    )\n'''
          new = '''    method = _coldstart_method(config)\n    if method == METHOD_ASYMRE:\n        grid_path = _canonical_asymre_grid_path()\n    elif method == METHOD_TOPR:\n        grid_path = CANONICAL_TOPR_GRID.resolve()\n    else:\n        grid_path = Path(str(record["round1_grid"]))\n'''
          text = replace_exact(text, old, new, 1, 'TOPR liveness grid')
          tuning_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_e8_multitask_p0.py')
          tests = test_path.read_text(encoding='utf-8')
          if 'def _topr_capability_test_config()' not in tests:
              tests += r'''


def _topr_capability_test_config() -> dict:
    from drpo import e8_multitask_exp_tuning as exp_tuning

    config = copy.deepcopy(
        yaml.safe_load(
            Path("configs/e8_multitask_exp_lambda_curve_completion.yaml").read_text(
                encoding="utf-8"
            )
        )
    )
    config["experiment_id"] = "DEV-E8-MULTITASK-TOPR-CAPABILITY-TEST"
    sweep = config["sweep"]
    sweep["method"] = "joint_fitted_reference_topr"
    sweep["parameterization"] = "joint_fitted_reference_beta_topr"
    sweep.pop("task_lambda", None)
    sweep["task_beta"] = {task: [] for task in config["suite"]["tasks"]}
    for task in config["suite"]["p0_tasks"]:
        sweep["task_beta"][task] = [0.25, 1.0]
    sweep["countdown_seed_offsets"] = []
    sweep["countdown_include_positive_only"] = False
    sweep["include_global_endpoint"] = False
    sweep["transfer_positive_only_seed_offsets"] = []
    sweep["task_transfer_seed_offset"] = 4000
    sweep["tuning_seed"] = 4000
    sweep["expected_cells"] = 16
    config["execution"]["expected_waves"] = 1
    config["canonical_coldstart"]["formula"] = "joint_fitted_reference_beta_ratio_taper"
    exp_tuning.validate_config(config)
    return config


def test_topr_capability_is_config_driven_and_identity_safe(tmp_path: Path) -> None:
    from drpo import e8_multitask_exp_tuning as exp_tuning

    config = _topr_capability_test_config()
    cells = exp_tuning.build_cells(config)
    assert len(cells) == 16
    assert {cell.method for cell in cells} == {exp_tuning.METHOD_TOPR}
    assert {cell.seed for cell in cells} == {4000}
    assert {cell.beta for cell in cells} == {0.25, 1.0}
    assert all(cell.lambda_value is None and cell.rho is None for cell in cells)
    assert len({cell.key for cell in cells}) == 16
    assert all("__joint_fitted_reference_topr_beta" in cell.key for cell in cells)

    plan = exp_tuning.write_plan(config, tmp_path)
    assert plan["cell_count"] == 16
    assert plan["wave_sizes"] == [16]
    assert {row["beta"] for row in plan["rows"]} == {0.25, 1.0}
    assert all(row["lambda"] is None for row in plan["rows"])


def test_topr_capability_dispatches_existing_joint_reference_kernel() -> None:
    import inspect

    from drpo import e8_multitask_exp_tuning as exp_tuning

    source = inspect.getsource(exp_tuning._train_canonical_cold_cell)
    assert "paper_family = METHOD_TOPR" in source
    assert "coefficient = float(cell.beta)" in source
    assert "family=paper_family" in source
    assert "joint_topr_negative_weights" not in source
    assert "branch_balanced_reference_loss" not in source


def test_topr_liveness_uses_existing_joint_reference_profile() -> None:
    from drpo import e8_multitask_exp_tuning as exp_tuning

    cell = exp_tuning._canonical_cold_liveness_cell(exp_tuning.CANONICAL_TOPR_GRID.resolve())
    assert cell.method == exp_tuning.METHOD_TOPR
    assert cell.beta == pytest.approx(0.25)
    assert cell.seed == 4000
'''
              test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Install focused dependencies
        run: python -m pip install -q numpy pyyaml pytest
      - name: Validate TOPR capability
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check
      - name: Commit TOPR capability
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git diff --cached --check
          git commit -m 'feat: add config-driven E8 multitask TOPR capability'
          git push origin HEAD:dev/e8-multitask-baselines-capability-01
