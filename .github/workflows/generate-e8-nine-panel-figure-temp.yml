name: Generate E8 nine-panel figure assets

on:
  push:
    branches:
      - dev/manuscript-iclr2027-9task-gradient-fig-01
    paths:
      - '.github/workflows/generate-e8-nine-panel-figure-temp.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install plotting and lint dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib ruff
      - name: Validate plotting code and inputs
        run: |
          ruff check scripts/figures/plot_e8_multitask_countdown_nine_panel.py
          python -m py_compile scripts/figures/plot_e8_multitask_countdown_nine_panel.py
          python scripts/figures/plot_e8_multitask_countdown_nine_panel.py --verify-only
      - name: Generate PNG and PDF
        run: python scripts/figures/plot_e8_multitask_countdown_nine_panel.py
      - name: Audit outputs
        run: |
          test -s paper/iclr2027/figures/fig_e8_multitask_countdown_gradient_nine_panel.png
          test -s paper/iclr2027/figures/fig_e8_multitask_countdown_gradient_nine_panel.pdf
          file paper/iclr2027/figures/fig_e8_multitask_countdown_gradient_nine_panel.png
          file paper/iclr2027/figures/fig_e8_multitask_countdown_gradient_nine_panel.pdf
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/iclr2027/figures/fig_e8_multitask_countdown_gradient_nine_panel.png \
                  paper/iclr2027/figures/fig_e8_multitask_countdown_gradient_nine_panel.pdf
          git commit -m 'MANUSCRIPT-ICLR2027-9TASK-GRADIENT-FIG-01: add generated figure assets'
          git push
