name: Cleanup manuscript sync transport

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'dev/paper-kdd2027-latest-content-sync-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove temporary transport and diagnostics
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -rf .github/kdd-sync-payload
          rm -f \
            .github/workflows/diagnose-kdd2027-latest-content-sync.yml \
            .github/workflows/diagnose2-kdd2027-latest-content-sync.yml \
            .github/workflows/diagnose3-kdd2027-latest-content-sync.yml \
            .github/workflows/diagnose4-kdd2027-latest-content-sync.yml \
            .github/workflows/export-overleaf-pdf-preview.yml \
            .github/workflows/materialize-kdd2027-latest-content-sync.yml \
            .github/workflows/materialize2-kdd2027-latest-content-sync.yml \
            .github/workflows/materialize3-kdd2027-latest-content-sync.yml \
            .github/workflows/materialize4-kdd2027-latest-content-sync.yml \
            .github/workflows/materialize5-kdd2027-latest-content-sync.yml \
            paper/overleaf/AUTHOR_PREVIEW_TRIGGER.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'PAPER-KDD2027-LATEST-CONTENT-SYNC-01: remove temporary sync transport'
          git push origin "HEAD:${HEAD_BRANCH}"
