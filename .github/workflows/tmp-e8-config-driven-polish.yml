name: Temporary E8 config-driven polish

on:
  push:
    branches:
      - dev/e8-config-driven-sweep-01
    paths:
      - .github/workflows/tmp-e8-config-driven-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0

      - name: Polish generic metadata handling
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path("src/drpo/e8_multitask_exp_tuning.py")
          s = core.read_text()
          old = '''def experiment_id(config: Mapping[str, Any]) -> str:\n    value = config.get("experiment_id")\n    if not isinstance(value, str) or not value.strip():\n        raise ValueError("experiment_id must be a non-empty string")\n    return value\n'''
          new = '''def experiment_id(config: Mapping[str, Any]) -> str:\n    value = config.get("experiment_id")\n    allowed = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789._-"\n    if (\n        not isinstance(value, str)\n        or not 1 <= len(value) <= 128\n        or not value[0].isalnum()\n        or any(character not in allowed for character in value)\n    ):\n        raise ValueError(\n            "experiment_id must match [A-Za-z0-9][A-Za-z0-9._-]{0,127}"\n        )\n    return value\n'''
          assert s.count(old) == 1
          core.write_text(s.replace(old, new, 1))

          runner = Path("scripts/run_e8_multitask_exp_coldstart.sh")
          s = runner.read_text()
          old = '''while IFS= read -r source_rel; do\n  [[ -n "${source_rel}" ]] || continue\n  source_path="${ROOT_DIR}/${source_rel}"\n'''
          new = '''while IFS= read -r source_rel; do\n  [[ -n "${source_rel}" ]] || continue\n  [[ "${source_rel}" != "scripts/run_e8_multitask_exp_coldstart.sh" ]] || continue\n  source_path="${ROOT_DIR}/${source_rel}"\n'''
          assert s.count(old) == 1
          runner.write_text(s.replace(old, new, 1))

          tests = Path("tests/test_e8_multitask_p0.py")
          s = tests.read_text()
          marker = 'def test_coldstart_config_rejects_non_integer_seeds() -> None:\n'
          test = '''def test_experiment_id_is_generic_but_well_formed() -> None:\n    from drpo import e8_multitask_exp_tuning as exp_tuning\n\n    config = exp_tuning.load_config(\n        Path("configs/e8_multitask_exp_lambda_curve_completion.yaml")\n    )\n    config["experiment_id"] = "NEW-E8.SWEEP_01"\n    assert exp_tuning.experiment_id(config) == "NEW-E8.SWEEP_01"\n    for invalid in ("", " bad", "bad id", "bad/id", "-bad"):\n        bad = copy.deepcopy(config)\n        bad["experiment_id"] = invalid\n        with pytest.raises(ValueError, match="experiment_id"):\n            exp_tuning.validate_config(bad)\n\n\n'''
          assert s.count(marker) == 1
          s = s.replace(marker, test + marker, 1)
          tests.write_text(s)
          PY
          python -m py_compile src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          git diff --check

      - name: Verify frozen and unseen configs
        run: |
          python -m pip install -q "numpy==1.26.4" "PyYAML==6.0.2"
          export PYTHONPATH="$PWD/src"
          python - <<'PY'
          import copy
          from pathlib import Path
          from drpo import e8_multitask_exp_tuning as e8
          for name, count in (
              ("configs/e8_multitask_exp_coldstart.yaml", 208),
              ("configs/e8_multitask_exp_lambda_completion.yaml", 199),
              ("configs/e8_multitask_exp_lambda_curve_completion.yaml", 140),
          ):
              config = e8.load_config(Path(name))
              assert len(e8.build_cells(config)) == count
          config = e8.load_config(Path("configs/e8_multitask_exp_lambda_curve_completion.yaml"))
          config["experiment_id"] = "UNSEEN-E8.CONFIG_01"
          e8.validate_config(config)
          bad = copy.deepcopy(config)
          bad["experiment_id"] = "bad id"
          try:
              e8.validate_config(bad)
          except ValueError:
              pass
          else:
              raise AssertionError("malformed experiment ID must fail")
          PY

      - name: Commit polish and remove temporary workflow
        run: |
          rm .github/workflows/tmp-e8-config-driven-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "E8: harden generic sweep metadata"
          git push origin HEAD:dev/e8-config-driven-sweep-01
