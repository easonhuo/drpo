name: E8 baseline matrix correctness audit v2

on:
  push:
    branches:
      - dev/e8-multitask-baselines-capability-01
    paths:
      - .github/workflows/e8-baseline-matrix-correctness-audit-v2.yml

permissions:
  contents: read

jobs:
  correctness-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit dependencies
        run: python -m pip install -e . pytest pyyaml ruff

      - name: Compile and full E8 multitask regression
        run: |
          python -m py_compile \
            src/drpo/e8_experiment_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py

      - name: Independent matrix and scientific invariants
        shell: bash
        run: |
          python - <<'PY'
          import inspect
          import runpy
          import subprocess
          import tempfile
          from collections import Counter
          from pathlib import Path

          import torch
          from drpo import e8_experiment_config as ec
          from drpo import e8_multitask_exp_tuning as rt

          for name, relpath in ec.CANONICAL_COLDSTART_PATHS.items():
              expected = ec.CANONICAL_COLDSTART_BLOB_SHAS[name]
              observed = subprocess.check_output(
                  ['git', 'hash-object', '--', relpath], text=True
              ).strip()
              assert observed == expected, (name, relpath, expected, observed)

          test_ns = runpy.run_path('tests/test_e8_multitask_p0.py')
          make_matrix = test_ns['_baseline_matrix_capability_test_config']
          config = make_matrix(shared_sft=False)
          assert ec.coldstart_methods(config) == (
              rt.METHOD_ASYMRE, rt.METHOD_TOPR, rt.METHOD_DPO
          )
          assert ec.task_transfer_seeds(config) == (4000, 5000)

          cells = rt.build_cells(config)
          assert len(cells) == 176
          assert len({cell.key for cell in cells}) == 176
          assert {cell.seed for cell in cells} == {4000, 5000}
          assert {cell.task for cell in cells} == set(config['suite']['p0_tasks'])
          assert all(cell.task != 'countdown' for cell in cells)
          counts = Counter(cell.method for cell in cells)
          assert counts == Counter({
              rt.METHOD_ASYMRE: 80,
              rt.METHOD_TOPR: 48,
              rt.METHOD_DPO: 48,
          }), counts
          for task in config['suite']['p0_tasks']:
              assert sum(cell.task == task for cell in cells) == 22
          with tempfile.TemporaryDirectory() as tmp:
              plan = rt.write_plan(config, Path(tmp))
              assert plan['cell_count'] == 176
              assert plan['wave_sizes'] == [16] * 11

          shared = make_matrix(shared_sft=True)
          shared_cells = rt.build_cells(shared)
          dpo_cells = [c for c in shared_cells if c.method == rt.METHOD_DPO]
          other_cells = [c for c in shared_cells if c.method != rt.METHOD_DPO]
          assert {c.dpo_initialization for c in dpo_cells} == {'shared_sft_adapter'}
          assert all(c.dpo_initialization is None for c in other_cells)
          assert shared['initialization']['source'] == 'base_model'
          assert shared['reference']['checkpoint_kind'] == 'fresh_lora_from_base_model'

          train_source = inspect.getsource(rt.train_cell)
          assert 'if cell.method == METHOD_DPO' in train_source
          assert '_train_canonical_dpo_transfer_cell' in train_source
          assert 'if _coldstart_method(config) == METHOD_DPO' not in train_source

          matrix_agg = inspect.getsource(rt._aggregate_coldstart_matrix_unranked)
          assert '"method_ranking_allowed": False' in matrix_agg
          assert '"significance_claim_allowed": False' in matrix_agg
          assert '"parameter_selection_deferred_to_reviewed_protocol": True' in matrix_agg

          values = torch.tensor([1.0, 3.0, 10.0])
          row_index = torch.tensor([0, 0, 1], dtype=torch.long)
          unique_counts = torch.tensor([2, 1], dtype=torch.long)
          paper_common = __import__(
              'drpo.countdown_e8_alpha1_highc_scan_common', fromlist=['dummy']
          )
          actual = rt._dpo_prompt_balanced_mean(
              values, row_index, unique_counts, paper_common=paper_common
          )
          expected = torch.tensor(((1.0 + 3.0) / 2.0 + 10.0) / 2.0)
          assert torch.allclose(actual, expected), (actual, expected)

          dpo_source = inspect.getsource(rt._train_canonical_dpo_transfer_cell)
          for token in (
              'full_sequence_log_probability',
              'policy_chosen[row_index]',
              '- policy_rejected',
              '- reference_chosen[row_index]',
              '+ reference_rejected',
              'F.softplus(-logits)',
              'initial_pair_margin_max_abs',
              'reference_terminal_sha256 != reference_initial_sha256',
          ):
              assert token in dpo_source, token

          paper_source = inspect.getsource(rt._train_canonical_cold_cell)
          assert 'joint_topr_negative_weights' not in paper_source
          assert 'branch_balanced_reference_loss' not in paper_source
          assert 'paper_family = METHOD_ASYMRE' in paper_source
          assert 'paper_family = METHOD_TOPR' in paper_source

          assert ec.task_delta_vs({
              'sweep': {'task_delta_v': {'maze': [-1.0, 0.0, 0.1]}}
          }, 'maze') == (-1.0, 0.0, 0.1)

          print('BASELINE_MATRIX_INVARIANTS_PASS')
          PY

      - name: Scope diff and lint audit
        shell: bash
        run: |
          base=8a21fd16e63ea96a0cde2a477353d24562624655
          git diff --check "${base}...HEAD"
          mapfile -t files < <(git diff --name-only "${base}...HEAD" | grep -v '^.github/')
          printf '%s\n' "${files[@]}"
          expected=(
            docs/scopes/E8_MULTITASK_ASYMRE_CAPABILITY_DEV.md
            docs/scopes/E8_MULTITASK_BASELINES_CAPABILITY_DEV.md
            src/drpo/e8_experiment_config.py
            src/drpo/e8_multitask_exp_tuning.py
            tests/test_e8_multitask_p0.py
          )
          [[ "${#files[@]}" -eq "${#expected[@]}" ]]
          for i in "${!expected[@]}"; do
            [[ "${files[$i]}" == "${expected[$i]}" ]]
          done
          python -m ruff check src/drpo/e8_experiment_config.py tests/test_e8_multitask_p0.py
          python -m ruff check src/drpo/e8_multitask_exp_tuning.py --ignore BLE001,B023
