name: E8 Final Correctness Repair V4 Once

on:
  push:
    branches:
      - dev/e8-config-driven-sweep-01
    paths:
      - .github/workflows/e8-final-correctness-repair-v4-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify unchanged business base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6d5de82dab8606e84bbe5c86cc7d983cec736244"
          unexpected="$(git diff --name-only 4834c21421567744e2087612c741f537438f87c1 HEAD | grep -Ev '^\.github/workflows/e8-final-correctness-repair(-v3|-v4)?-once\.yml$' || true)"
          test -z "${unexpected}"
          git diff --quiet origin/main -- .github/workflows/code-change-budget.yml

      - name: Reconstruct and apply reviewed correctness repair
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          source = Path('.github/workflows/e8-final-correctness-repair-v3-once.yml').read_text(encoding='utf-8')
          match = re.search(r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 -d \| gzip -d >/tmp/e8_patch\.py", source)
          if match is None:
              raise SystemExit('could not recover reviewed patch payload from V3 workflow')
          Path('/tmp/e8_patch.py').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          python /tmp/e8_patch.py

      - name: Install complete project validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pip install --disable-pip-version-check ruff==0.9.10 pytest==8.3.4 numpy==1.26.4 PyYAML==6.0.2

      - name: Validate focused and repository-wide after-image
        run: |
          set -euo pipefail
          python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py scripts/preflight_e8_multitask_config.py tests/test_e8_multitask_p0.py
          python -m ruff check src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py scripts/preflight_e8_multitask_config.py tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh
          python scripts/preflight_e8_multitask_config.py --config configs/e8_multitask_exp_coldstart.yaml >/tmp/preflight-coldstart.json
          python scripts/preflight_e8_multitask_config.py --config configs/e8_multitask_exp_lambda_completion.yaml >/tmp/preflight-completion.json
          python scripts/preflight_e8_multitask_config.py --config configs/e8_multitask_exp_lambda_curve_completion.yaml >/tmp/preflight-curve.json
          python -m pytest -q tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_experiment_artifact_protocol.py tests/test_experiment_artifact_hardening.py
          python -m pytest -q
          git diff --check
          git diff --quiet origin/main -- .github/workflows/code-change-budget.yml

      - name: Commit validated after-image and remove temporary artifacts
        run: |
          set -euo pipefail
          git rm .github/workflows/e8-final-correctness-repair-once.yml .github/workflows/e8-final-correctness-repair-v3-once.yml .github/workflows/e8-final-correctness-repair-v4-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md scripts/bootstrap_e8_multitask_exp_coldstart.sh scripts/run_e8_multitask_exp_coldstart.sh src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git commit -m "fix(e8): close bootstrap and successful-reuse identity gaps"
          git push origin HEAD:dev/e8-config-driven-sweep-01
          git push origin --delete tmp-noop tmp-e8-fix-stage tmp-cleanup-test tmp-cleanup-test-2 tmp-cleanup-test-3 || true
