name: E8 P3 Extract v2 (temporary)

on:
  push:
    branches:
      - dev/e8-multitask-training-splits-01
    paths:
      - .github/workflows/e8-p3-extract-temp-v2.yml

permissions:
  contents: write

jobs:
  extract-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Reuse validated extraction steps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/e8-p3-extract-temp.yml').read_text(encoding='utf-8').splitlines()
          wanted = [
              'Extract canonical bridge mechanically',
              'Apply safe lint cleanup',
              'Compile and focused regression',
              'Broad regression excluding only base-proven failures',
          ]

          def extract(name: str) -> str:
              marker = f'      - name: {name}'
              try:
                  i = workflow.index(marker)
              except ValueError as exc:
                  raise SystemExit(f'missing step: {name}') from exc
              run_idx = None
              for j in range(i + 1, len(workflow)):
                  if workflow[j].startswith('      - name: '):
                      break
                  if workflow[j] == '        run: |':
                      run_idx = j
                      break
              if run_idx is None:
                  raise SystemExit(f'missing run block for: {name}')
              body = []
              for j in range(run_idx + 1, len(workflow)):
                  line = workflow[j]
                  if line.startswith('      - name: '):
                      break
                  if line.startswith('          '):
                      body.append(line[10:])
                  else:
                      body.append(line)
              return '\n'.join(body).rstrip() + '\n'

          out = Path('/tmp/e8_p3_steps')
          out.mkdir(parents=True, exist_ok=True)
          for idx, name in enumerate(wanted, 1):
              path = out / f'{idx}.sh'
              path.write_text(extract(name), encoding='utf-8')
              path.chmod(0o755)
              print(path)
          PY

          echo '=== running extraction ==='
          bash /tmp/e8_p3_steps/1.sh
          echo '=== running safe lint cleanup ==='
          bash /tmp/e8_p3_steps/2.sh

          # Standard-library dependencies belong to the bridge module itself, not to
          # the composition-root host binding surface. TaskInstance is annotation-only
          # under postponed annotations and needs no runtime binding.
          python - <<'PY'
          import importlib
          import re
          from pathlib import Path

          bridge_path = Path('src/drpo/e8_multitask_canonical_bridge.py')
          text = bridge_path.read_text(encoding='utf-8')

          host_only_removals = (
              '    TaskInstance = host.TaskInstance\n',
              '    contextmanager = host.contextmanager\n',
              '    csv = host.csv\n',
              '    hashlib = host.hashlib\n',
              '    importlib = host.importlib\n',
          )
          for needle in host_only_removals:
              if text.count(needle) != 1:
                  raise SystemExit(f'expected exactly one generated host binding: {needle.strip()}')
              text = text.replace(needle, '', 1)

          import_anchor = 'from __future__ import annotations\n\n'
          direct_imports = (
              'import csv\n'
              'import hashlib\n'
              'import importlib\n'
              'from contextlib import contextmanager\n\n'
          )
          if text.count(import_anchor) != 1:
              raise SystemExit('canonical bridge future-import anchor missing')
          text = text.replace(import_anchor, import_anchor + direct_imports, 1)
          bridge_path.write_text(text, encoding='utf-8')

          host = importlib.import_module('drpo.e8_multitask_exp_tuning')
          bindings = re.findall(r'^    ([A-Za-z_]\w*) = host\.\1$', text, flags=re.MULTILINE)
          missing = sorted(name for name in bindings if not hasattr(host, name))
          if missing:
              raise SystemExit(f'bridge host bindings missing after lint cleanup: {missing}')
          print(f'validated_host_bindings={len(bindings)}')
          PY

          echo '=== running compile and focused regression ==='
          bash /tmp/e8_p3_steps/3.sh
          echo '=== running broad regression ==='
          bash /tmp/e8_p3_steps/4.sh

      - name: Commit validated P3 extraction and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/e8-p3-extract-temp.yml .github/workflows/e8-p3-extract-temp-v2.yml
          git add \
            src/drpo/e8_multitask_exp_tuning.py \
            src/drpo/e8_multitask_canonical_bridge.py \
            tests/test_e8_multitask_p0.py
          git config user.name 'drpo-p3-extraction-bot'
          git config user.email 'drpo-p3-extraction-bot@users.noreply.github.com'
          git commit -m 'refactor: extract E8 canonical cold-start bridge'
          git push origin HEAD:dev/e8-multitask-training-splits-01
