name: E8 dynamic refill restore audit

on:
  push:
    branches:
      - audit/e8-dynamic-refill-restore-20260820

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct frozen three-file patch
        shell: bash
        run: |
          set -euo pipefail
          cat .drpo_audit/e8_dynamic_refill_patch.part*.b64 | tr -d '\n' | base64 -d > /tmp/update.patch
          sha256sum /tmp/update.patch

      - name: Exact BASE checkout and scope gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=4b7c991cd8797412830cb34f76dfe35cc09eb90f
          git worktree add --detach /tmp/drpo-base "$BASE"
          cd /tmp/drpo-base
          git apply --check /tmp/update.patch
          git apply /tmp/update.patch
          git add -A
          printf '%s\n' \
            configs/e8_multitask_exp_coldstart.yaml \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py | sort > /tmp/expected_names
          git diff --cached --name-only "$BASE" | sort > /tmp/base_actual_names
          diff -u /tmp/expected_names /tmp/base_actual_names
          git diff --cached --check
          EXPECTED_TREE="$(git write-tree)"
          echo "EXPECTED_TREE=$EXPECTED_TREE" >> "$GITHUB_ENV"

      - name: Apply exact patch to staging tree
        shell: bash
        run: |
          set -euo pipefail
          BASE=4b7c991cd8797412830cb34f76dfe35cc09eb90f
          git apply --check /tmp/update.patch
          git apply /tmp/update.patch
          rm -rf .drpo_audit
          rm -f .github/workflows/e8_dynamic_refill_restore_audit.yml
          git add -A
          ACTUAL_TREE="$(git write-tree)"
          test "$ACTUAL_TREE" = "$EXPECTED_TREE"
          printf '%s\n' \
            configs/e8_multitask_exp_coldstart.yaml \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py | sort > /tmp/expected_names
          git diff --cached --name-only "$BASE" | sort > /tmp/actual_names
          diff -u /tmp/expected_names /tmp/actual_names
          git diff --cached --check

      - name: Exact YAML semantic guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          base_sha = "4b7c991cd8797412830cb34f76dfe35cc09eb90f"
          path = "configs/e8_multitask_exp_coldstart.yaml"
          before = yaml.safe_load(subprocess.check_output(["git", "show", f"{base_sha}:{path}"], text=True))
          after = yaml.safe_load(Path(path).read_text(encoding="utf-8"))
          assert before["execution"]["wave_barriers"] is True
          assert after["execution"]["wave_barriers"] is False
          before["execution"]["wave_barriers"] = False
          assert before == after, "YAML changed outside execution.wave_barriers"
          PY

      - name: Install project and dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Compile and lint changed Python
        run: |
          python -m compileall -q src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          ruff check src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py

      - name: Run full multitask test file
        run: pytest -q tests/test_e8_multitask_p0.py

      - name: Stress dynamic refill ten times
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "dynamic-refill stress iteration $i"
            pytest -q tests/test_e8_multitask_p0.py -k 'scheduler_refills_freed_slots'
          done

      - name: Commit validated materialized tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'drpo-audit'
          git config user.email 'drpo-audit@users.noreply.github.com'
          git commit -m 'E8 coldstart: materialize validated dynamic refill scheduler'
          git push origin HEAD:audit/e8-dynamic-refill-restore-20260820
