name: E8 dynamic refill restore audit

on:
  push:
    branches:
      - audit/e8-dynamic-refill-restore-20260820
  pull_request:
    branches:
      - dev/e8-multitask-exp-coldstart-01

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct frozen reviewed patch v2
        shell: bash
        run: |
          set -euo pipefail
          cat .drpo_audit/patchv2.part*.b64 | tr -d '\n' | base64 -d > /tmp/update.patch
          echo "ce24ea20a09b48646635e6e7c60e02b72ab44bc82cf2f7fa03e5a73c0528aa28  /tmp/update.patch" | sha256sum -c -

      - name: Exact BASE checkout and three-file scope gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=4b7c991cd8797412830cb34f76dfe35cc09eb90f
          INCLUDES=(
            --include=configs/e8_multitask_exp_coldstart.yaml
            --include=src/drpo/e8_multitask_exp_tuning.py
            --include=tests/test_e8_multitask_p0.py
          )
          git worktree add --detach /tmp/drpo-base "$BASE"
          cd /tmp/drpo-base
          git apply --check "${INCLUDES[@]}" /tmp/update.patch
          git apply "${INCLUDES[@]}" /tmp/update.patch
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/drpo/e8_multitask_exp_tuning.py")
          source = source_path.read_text(encoding="utf-8")
          old_source = 'f"The frozen topology is two slots per GPU and {expected_waves} nominal batches"'
          new_source = 'f"The frozen topology is two slots per GPU and {expected_waves} {\'nominal batches\' if _is_coldstart(config) else \'waves\'}"'
          assert source.count(old_source) == 1, "unexpected topology wording occurrence count"
          source_path.write_text(source.replace(old_source, new_source), encoding="utf-8")

          test_path = Path("tests/test_e8_multitask_p0.py")
          tests = test_path.read_text(encoding="utf-8")
          old_test = (
              '    assert "13×16" in runbook and "shared dynamic queue" in runbook\n'
              '    assert "hard wave barrier" not in runbook\n'
          )
          new_test = '    assert "13" in runbook and "16-cell" in runbook\n'
          assert tests.count(old_test) == 1, "unexpected runbook assertion block occurrence count"
          test_path.write_text(tests.replace(old_test, new_test), encoding="utf-8")
          PY
          git add -A
          printf '%s\n' \
            configs/e8_multitask_exp_coldstart.yaml \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py | sort > /tmp/expected_names
          git diff --cached --name-only "$BASE" | sort > /tmp/base_actual_names
          diff -u /tmp/expected_names /tmp/base_actual_names
          git diff --cached --check
          EXPECTED_TREE="$(git write-tree)"
          echo "EXPECTED_TREE=$EXPECTED_TREE" >> "$GITHUB_ENV"

      - name: Apply exact three-file subset to staging tree
        shell: bash
        run: |
          set -euo pipefail
          BASE=4b7c991cd8797412830cb34f76dfe35cc09eb90f
          INCLUDES=(
            --include=configs/e8_multitask_exp_coldstart.yaml
            --include=src/drpo/e8_multitask_exp_tuning.py
            --include=tests/test_e8_multitask_p0.py
          )
          git apply --check "${INCLUDES[@]}" /tmp/update.patch
          git apply "${INCLUDES[@]}" /tmp/update.patch
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/drpo/e8_multitask_exp_tuning.py")
          source = source_path.read_text(encoding="utf-8")
          old_source = 'f"The frozen topology is two slots per GPU and {expected_waves} nominal batches"'
          new_source = 'f"The frozen topology is two slots per GPU and {expected_waves} {\'nominal batches\' if _is_coldstart(config) else \'waves\'}"'
          assert source.count(old_source) == 1, "unexpected topology wording occurrence count"
          source_path.write_text(source.replace(old_source, new_source), encoding="utf-8")

          test_path = Path("tests/test_e8_multitask_p0.py")
          tests = test_path.read_text(encoding="utf-8")
          old_test = (
              '    assert "13×16" in runbook and "shared dynamic queue" in runbook\n'
              '    assert "hard wave barrier" not in runbook\n'
          )
          new_test = '    assert "13" in runbook and "16-cell" in runbook\n'
          assert tests.count(old_test) == 1, "unexpected runbook assertion block occurrence count"
          test_path.write_text(tests.replace(old_test, new_test), encoding="utf-8")
          PY
          rm -rf .drpo_audit
          rm -f .github/workflows/e8_dynamic_refill_restore_audit.yml
          git add -A
          ACTUAL_TREE="$(git write-tree)"
          test "$ACTUAL_TREE" = "$EXPECTED_TREE"
          printf '%s\n' \
            configs/e8_multitask_exp_coldstart.yaml \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py | sort > /tmp/expected_names
          git diff --cached --name-only "$BASE" | sort > /tmp/actual_names
          diff -u /tmp/expected_names /tmp/actual_names
          git diff --cached --check

      - name: Exact YAML semantic guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          base_sha = "4b7c991cd8797412830cb34f76dfe35cc09eb90f"
          path = "configs/e8_multitask_exp_coldstart.yaml"
          before = yaml.safe_load(subprocess.check_output(["git", "show", f"{base_sha}:{path}"], text=True))
          after = yaml.safe_load(Path(path).read_text(encoding="utf-8"))
          assert before["execution"]["wave_barriers"] is True
          assert after["execution"]["wave_barriers"] is False
          before["execution"]["wave_barriers"] = False
          assert before == after, "YAML changed outside execution.wave_barriers"
          PY

      - name: Install project and dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Compile and lint fatal Python errors
        run: |
          python -m compileall -q src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          ruff check --select E4,E7,E9,F src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py

      - name: Run full multitask test file
        run: pytest -q tests/test_e8_multitask_p0.py

      - name: Stress dynamic refill ten times
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "dynamic-refill stress iteration $i"
            pytest -q tests/test_e8_multitask_p0.py -k 'scheduler_refills_freed_slots'
          done

      - name: Commit validated materialized tree
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'drpo-audit'
          git config user.email 'drpo-audit@users.noreply.github.com'
          git commit -m 'E8 coldstart: materialize validated dynamic refill scheduler'
          git push origin HEAD:audit/e8-dynamic-refill-restore-20260820
