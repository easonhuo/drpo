name: E8 Third Pass Review Fix

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: e8-third-pass-review-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'dev/e8-config-driven-sweep-01'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply third-pass fixes
        run: python scripts/e8_third_pass_review_fix.py

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy PyYAML

      - name: Compile and shell syntax
        run: |
          PYTHONPATH=src python -m py_compile src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh scripts/bootstrap_e8_multitask_exp_coldstart.sh

      - name: Run E8 orchestration regression tests
        run: >-
          PYTHONPATH=src python -m pytest -q tests/test_e8_multitask_p0.py
          -k 'coldstart or lambda_completion or lambda_curve_completion or experiment_id_is_generic or runner_and_bootstrap or generic_countdown_grid or config_id_parser'

      - name: Patch hygiene
        run: git diff --check

      - name: Commit validated fixes and remove one-shot tooling
        run: |
          git rm scripts/e8_third_pass_review_fix.py .github/workflows/e8-third-pass-review-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'E8: harden liveness reuse and config identity parsing'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
