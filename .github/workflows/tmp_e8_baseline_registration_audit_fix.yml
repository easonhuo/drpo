name: tmp-e8-baseline-registration-audit-fix
on:
  push:
    branches: [dev/e8-multitask-baselines-capability-01]
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - name: Verify exact retry base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "50cd7c7c3e938d6cb9c00ef7a2ec0d8ce4d93322"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/tmp_e8_baseline_registration_audit_fix.yml"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install documentation tooling
        run: python -m pip install pyyaml
      - name: Freeze registration source before code repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          import sys
          import textwrap
          from pathlib import Path

          import yaml

          ROOT = Path.cwd()
          MAIN = "8a21fd16e63ea96a0cde2a477353d24562624655"
          UPDATE_ID = "EXT-C-E8-MULTITASK-BASELINE-MATRIX-01-FORMAL-REGISTRATION-2026-09-10"
          EXPERIMENT_ID = "EXT-C-E8-MULTITASK-BASELINE-MATRIX-01"
          sys.path.insert(0, str((ROOT / "scripts").resolve()))
          import handoff_delta_shadow as shadow

          def git_show(path: str) -> str:
              return subprocess.check_output(
                  ["git", "show", f"{MAIN}:{path}"], text=True
              )

          # 1) Resolve the stale scope header without deleting the historical capability record.
          scope_path = ROOT / "docs/scopes/E8_MULTITASK_BASELINES_CAPABILITY_DEV.md"
          scope = scope_path.read_text(encoding="utf-8")
          old = (
              "## Status\n\n"
              "Code-only development scope. No scientific experiment is launched by this change, and no final baseline-comparison experiment ID, hyperparameter grid, initialization choice, RunSpec, ranking, or result claim is frozen here.\n"
          )
          new = (
              "## Status\n\n"
              "This scope began as code-only capability development. The later owner-authorized September-7 protocol closure recorded below now freezes the successor formal experiment ID, exact 176-cell hyperparameter matrix, fresh-LoRA DPO initialization, paired transfer seeds, hard seed-batch ordering, and formal terminal-audit responsibilities. The scientific experiment itself remains **not_run**: no 176-cell training run, result, significance claim, convergence claim, or method ranking is produced by this development work. Earlier capability-only exclusions are retained as historical scope and are superseded only where the later owner-authorized closure explicitly says so.\n"
          )
          if scope.count(old) != 1:
              raise SystemExit("stale scope Status block did not match exactly once")
          scope_path.write_text(scope.replace(old, new, 1), encoding="utf-8")

          # 2) Register exactly one new experiment entity while preserving unrelated registry bytes.
          registry_path = ROOT / "experiments/registry.yaml"
          current_registry = registry_path.read_text(encoding="utf-8")
          base_registry = git_show("experiments/registry.yaml")
          if current_registry != base_registry:
              raise SystemExit("branch registry already differs from authoritative main; refusing broad rewrite")
          if f"- id: {EXPERIMENT_ID}\n" in current_registry:
              raise SystemExit("formal baseline matrix experiment is already registered")
          marker = "\nallowed_execution_states:\n"
          if current_registry.count(marker) != 1:
              raise SystemExit("registry insertion marker is not unique")
          entity = textwrap.dedent(
              f"""
              - id: {EXPERIMENT_ID}
                environment: EXT-C
                name: e8_multitask_baseline_matrix_formal
                status: not_run
                scientific_status: not_run
                role: external_validity_finite_horizon_baseline_comparison
                execution_class: formal
                registration_state: formal_protocol_registered_not_run
                claim: >-
                  On the exact eight P0 transfer tasks and frozen model-independent banks, compare
                  AsymRE, Joint Fitted-Reference beta-TOPR, and canonical PR-268-semantics DPO under
                  matched training/evaluation budgets using the frozen paired transfer seeds. This is
                  finite-horizon external-validity evidence; Countdown is reused rather than rerun,
                  and convergence or universal method-ranking claims are excluded.
                code_entrypoint: src/drpo/e8_multitask_exp_tuning.py
                config_entrypoint: configs/e8_multitask_baseline_matrix_formal.yaml
                protocol_scope: docs/scopes/E8_MULTITASK_BASELINES_CAPABILITY_DEV.md
                model:
                  identity: Qwen2.5-0.5B-Instruct
                  initialization: pretrained_base_plus_fresh_lora
                  parameterization: lora
                tasks:
                  transfer: [word_sorting, spiral_matrix, mini_sudoku, maze, word_ladder, knights_knaves, graph_color, wikisql]
                  reused_external: [countdown]
                data:
                  p0_train_rows_per_task: 5000
                  p0_validation_rows_per_task: 500
                  p0_test_rows_per_task: 500
                  negatives_per_prompt: 16
                  test_access_allowed: false
                  bank_role: shared_frozen_qualified_p0_banks
                methods:
                  asymre:
                    parameterization: asymre_delta_v
                    delta_v: [-1.0, -0.9, -0.75, -0.5, 0.0]
                  joint_fitted_reference_topr:
                    parameterization: joint_fitted_reference_beta_topr
                    beta: [0.25, 0.5, 1.0]
                  canonical_dpo:
                    parameterization: canonical_dpo_beta
                    beta: [0.05, 0.1, 0.2]
                    initialization: base_model_fresh_lora
                    semantics_source: historical_countdown_pr268
                controls:
                - shared_model_and_frozen_bank_budget
                - countdown_reused_without_new_cells
                - no_positive_only_or_global_cells_in_this_matrix
                seeds:
                  development_seeds: [4000, 5000]
                  held_out_seeds: []
                  role: paired_transfer_comparison
                training:
                  optimizer_updates: 1200
                  early_stopping: false
                  micro_batch: 1
                  gradient_accumulation: 8
                  learning_rate: 5.0e-05
                  weight_decay: 0.01
                  warmup_ratio: 0.03
                  max_grad_norm: 1.0
                matrix:
                  expected_cells: 176
                  asymre_cells: 80
                  topr_cells: 48
                  dpo_cells: 48
                scheduling:
                  scheduler: dynamic_slot_queue
                  max_concurrent_cells: 16
                  seed_batch_order: [4000, 5000]
                  seed_batch_expected_cells: {{4000: 88, 5000: 88}}
                  hard_seed_barrier: all_88_seed_4000_cells_finish_successfully_before_any_seed_5000_scientific_cell_starts
                metrics:
                  primary: validation_late_window_pass8_mean
                  supplementary: [validation_terminal_pass8, validation_late_window_greedy_mean, validation_terminal_greedy]
                  structure_diagnostic: greedy_and_sampled_valid_rate
                terminal_audit:
                  required: true
                  fixed_terminal_step: 1200
                  stop_reason: max_steps
                  test_partition_accessed: false
                  nan_inf_required_absent: true
                  dpo_frozen_reference_identity_required: true
                  seed_batch_summary_check: true
                  seed_batch_temporal_event_history_check: true
                  temporal_event_source: scheduler/queue_events.jsonl
                  temporal_condition: max_seed_4000_successful_finish_time_le_min_seed_5000_start_time
                reporting_separation:
                - task_performance
                - valid_or_structure_diagnostic
                - nan_inf_numerical_failure
                non_claims:
                - convergence_or_steady_state
                - universal_method_ranking
                - statistical_significance_before_terminal_audit
                execution:
                  state: registered
                  scientific_run_started: false
                evidence:
                  scientific_run_completed: false
                  terminal_audited: false
              """
          ).strip("\n") + "\n"
          updated_registry = current_registry.replace(marker, "\n" + entity + marker, 1)
          parsed = yaml.safe_load(updated_registry)
          matches = [e for e in parsed["experiments"] if e.get("id") == EXPERIMENT_ID]
          if len(matches) != 1:
              raise SystemExit("registered experiment did not parse exactly once")
          registry_path.write_text(updated_registry, encoding="utf-8")

          # 3) Author one schema-v3 delta against authoritative main. The Stage-5 normalizer
          # will materialize docs/handoff.md; this script never edits handoff directly.
          base_handoff = git_show("docs/handoff.md")
          handoff_content = (
              "- **E8 multitask baseline formal matrix registration (`EXT-C-E8-MULTITASK-BASELINE-MATRIX-01`)：**"
              "正式协议已登记但仍为 **not_run**。冻结矩阵为 8 个 P0 transfer tasks × 2 seeds × "
              "(AsymRE 5 + TOPR 3 + DPO 3) = `176` cells；Countdown 仅复用既有外部有效性结果，不新增 cell。"
              "AsymRE `delta_v=[-1.0,-0.9,-0.75,-0.5,0.0]`，TOPR `beta=[0.25,0.5,1.0]`，"
              "DPO `beta=[0.05,0.1,0.2]` 且使用 `base_model_fresh_lora`，保持 historical Countdown PR #268 DPO 语义不变。"
              "seeds 固定为 `[4000,5000]`，硬顺序要求是 seed-4000 的 88 个 cell 全部成功结束后，才允许任何 seed-5000 scientific cell 启动。"
              "terminal audit 除复核 `scheduler/dynamic_run.json` 的 batch summary 外，还必须独立读取同一 `scheduler_run_id` 的 "
              "`scheduler/queue_events.jsonl`，验证 seed-4000 成功 finish 计数、seed-5000 start/成功 finish 计数以及 "
              "`max(seed4000 successful finish time) <= min(seed5000 start time)`。固定 1200 updates 通过全部终态审计后最多登记为 "
              "**finite_step_validated**，不得写成 convergence/steady state，也不得预设 universal method ranking。"
              "任务性能、valid/support-structure diagnostic 与 NaN/Inf numerical failure 继续分开报告。"
              "本登记不重新引入 registry/READY 作为 launch permission；正式启动仍须满足当前治理规定的 exact commit、provenance、recovery、supervision、terminal audit 与 artifact 要求。"
          )
          operations = [
              {
                  "operation_id": "append-e8-multitask-baseline-matrix-formal-registration",
                  "op": "append_to_section",
                  "heading_path": [
                      "0. 研究与执行原则（每次新会话首先阅读）",
                      "0.1 当前执行门禁",
                  ],
                  "block_id": "e8-multitask-baseline-matrix-formal-registration-2026-09-10",
                  "content": handoff_content,
              }
          ]
          candidate = shadow.render(base_handoff, operations).text
          delta = {
              "schema_version": 3,
              "update_id": UPDATE_ID,
              "mode": "authoritative",
              "base": {
                  "commit": MAIN,
                  "handoff_sha256": shadow.sha256_text(base_handoff),
                  "registry_sha256": shadow.sha256_text(base_registry),
              },
              "renderer_version": 1,
              "operations": operations,
              "registry": {
                  "mode": "expected_after",
                  "exact_base_after_sha256": shadow.sha256_text(updated_registry),
                  "changes": [
                      {
                          "change_id": "add-e8-multitask-baseline-matrix-formal",
                          "kind": "add_entity",
                          "entity_id": EXPERIMENT_ID,
                          "evidence": [
                              "configs/e8_multitask_baseline_matrix_formal.yaml",
                              "docs/scopes/E8_MULTITASK_BASELINES_CAPABILITY_DEV.md",
                              "experiments/registry.yaml",
                              "src/drpo/e8_multitask_exp_tuning.py",
                              "tests/test_e8_multitask_p0.py",
                          ],
                      }
                  ],
              },
              "expected": {
                  "exact_base_candidate_sha256": shadow.sha256_text(candidate),
              },
          }
          delta_path = ROOT / "docs/handoff_deltas" / UPDATE_ID / "HANDOFF_DELTA.yaml"
          delta_path.parent.mkdir(parents=True, exist_ok=False)
          delta_path.write_text(
              yaml.safe_dump(delta, sort_keys=False, allow_unicode=True),
              encoding="utf-8",
          )
          PY
          git diff --check
          git add docs/scopes/E8_MULTITASK_BASELINES_CAPABILITY_DEV.md experiments/registry.yaml docs/handoff_deltas/EXT-C-E8-MULTITASK-BASELINE-MATRIX-01-FORMAL-REGISTRATION-2026-09-10/HANDOFF_DELTA.yaml
          git commit -m "docs: register E8 baseline formal protocol"
      - name: Materialize Stage-5 handoff authority
        shell: bash
        run: |
          set -euo pipefail
          MAIN=8a21fd16e63ea96a0cde2a477353d24562624655
          DOC_COMMIT=$(git rev-parse HEAD)
          git worktree add --detach /tmp/drpo-trusted "$MAIN"
          python /tmp/drpo-trusted/scripts/handoff_authority.py validate-delta \
            --repo-root "$GITHUB_WORKSPACE" \
            --delta docs/handoff_deltas/EXT-C-E8-MULTITASK-BASELINE-MATRIX-01-FORMAL-REGISTRATION-2026-09-10/HANDOFF_DELTA.yaml \
            --source-patch-commit "$DOC_COMMIT"
          python /tmp/drpo-trusted/scripts/handoff_authority.py normalize \
            --repo-root "$GITHUB_WORKSPACE" \
            --trusted-repo-root /tmp/drpo-trusted \
            --current-before "$MAIN" \
            --source-base "$MAIN" \
            --source-patch-commit "$DOC_COMMIT" \
            --json > /tmp/e8-normalize.json
          git diff --check
          git add docs/handoff.md \
            docs/handoff_deltas/EXT-C-E8-MULTITASK-BASELINE-MATRIX-01-FORMAL-REGISTRATION-2026-09-10/MATERIALIZATION_REPORT.json \
            docs/handoff_shadow/stage4/minimal/generated
          git commit -m "docs: materialize E8 baseline registration"
          python /tmp/drpo-trusted/scripts/handoff_authority.py verify --repo-root "$GITHUB_WORKSPACE"
          python /tmp/drpo-trusted/scripts/validate_governance_pipeline_stage_status.py --repo-root "$GITHUB_WORKSPACE"
      - name: Repair independent seed-barrier terminal audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/drpo/e8_multitask_exp_tuning.py")
          text = path.read_text(encoding="utf-8")
          old = '''    seed_batch_protocol_complete: bool | None = None\n    if _is_baseline_matrix(config):\n        sp = output_root / "scheduler" / "dynamic_run.json"\n        scheduler = json.loads(sp.read_text(encoding="utf-8")) if sp.is_file() else {}\n        order = [int(v) for v in config["execution"]["seed_batch_order"]]\n        expected = {str(seed): sum(cell.seed == seed for cell in cells) for seed in order}\n        seed_batch_protocol_complete = scheduler.get("seed_batch_barriers") is True and scheduler.get("seed_batch_order") == order and scheduler.get("seed_batch_expected_cells") == expected and scheduler.get("seed_batch_completed_cells") == expected and scheduler.get("complete") is True\n    all_complete = not missing and not incomplete and not nan_inf and not terminal_contract_failures and not dpo_reference_identity_failures and inherited_complete and aggregate_complete and seed_batch_protocol_complete is not False\n'''
          new = '''    seed_batch_protocol_complete: bool | None = None\n    seed_batch_temporal_order_complete: bool | None = None\n    if _is_baseline_matrix(config):\n        scheduler_path = output_root / "scheduler" / "dynamic_run.json"\n        scheduler = (\n            json.loads(scheduler_path.read_text(encoding="utf-8"))\n            if scheduler_path.is_file()\n            else {}\n        )\n        order = [int(value) for value in config["execution"]["seed_batch_order"]]\n        expected = {str(seed): sum(cell.seed == seed for cell in cells) for seed in order}\n        seed_batch_protocol_complete = (\n            scheduler.get("seed_batch_barriers") is True\n            and scheduler.get("seed_batch_order") == order\n            and scheduler.get("seed_batch_expected_cells") == expected\n            and scheduler.get("seed_batch_completed_cells") == expected\n            and scheduler.get("complete") is True\n        )\n\n        # Independently audit the append-only event history for the same scheduler run.\n        # The summary alone is not sufficient evidence that a later seed batch did not\n        # start before the preceding batch had finished successfully.\n        seed_batch_temporal_order_complete = False\n        event_path = output_root / "scheduler" / "queue_events.jsonl"\n        scheduler_run_id = str(scheduler.get("scheduler_run_id", ""))\n        if event_path.is_file() and scheduler_run_id:\n            try:\n                event_rows: list[dict[str, Any]] = []\n                for line in event_path.read_text(encoding="utf-8").splitlines():\n                    if not line.strip():\n                        continue\n                    row = json.loads(line)\n                    if not isinstance(row, dict):\n                        raise TypeError("queue event must be a JSON object")\n                    if str(row.get("scheduler_run_id", "")) == scheduler_run_id:\n                        event_rows.append(row)\n\n                successful_finishes = {\n                    seed: [\n                        row\n                        for row in event_rows\n                        if row.get("event") == "finish"\n                        and row.get("seed") == seed\n                        and row.get("returncode") == 0\n                    ]\n                    for seed in order\n                }\n                starts = {\n                    seed: [\n                        row\n                        for row in event_rows\n                        if row.get("event") == "start" and row.get("seed") == seed\n                    ]\n                    for seed in order\n                }\n                counts_complete = bool(order) and all(\n                    len(successful_finishes[seed]) == expected[str(seed)] for seed in order\n                )\n                counts_complete = counts_complete and all(\n                    len(starts[seed]) == expected[str(seed)] for seed in order[1:]\n                )\n                temporal_complete = counts_complete\n                for previous_seed, next_seed in zip(order, order[1:]):\n                    previous_finish_times = [\n                        float(row["unix_time"]) for row in successful_finishes[previous_seed]\n                    ]\n                    next_start_times = [float(row["unix_time"]) for row in starts[next_seed]]\n                    times = previous_finish_times + next_start_times\n                    if (\n                        not previous_finish_times\n                        or not next_start_times\n                        or not all(math.isfinite(value) for value in times)\n                        or max(previous_finish_times) > min(next_start_times)\n                    ):\n                        temporal_complete = False\n                        break\n                seed_batch_temporal_order_complete = temporal_complete\n            except (OSError, json.JSONDecodeError, KeyError, TypeError, ValueError):\n                seed_batch_temporal_order_complete = False\n\n    all_complete = (\n        not missing\n        and not incomplete\n        and not nan_inf\n        and not terminal_contract_failures\n        and not dpo_reference_identity_failures\n        and inherited_complete\n        and aggregate_complete\n        and seed_batch_protocol_complete is not False\n        and seed_batch_temporal_order_complete is not False\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit(f"audit replacement expected once, found {text.count(old)}")
          text = text.replace(old, new, 1)
          old_field = '        "seed_batch_protocol_complete": seed_batch_protocol_complete,\n'
          new_field = old_field + '        "seed_batch_temporal_order_complete": seed_batch_temporal_order_complete,\n'
          if text.count(old_field) != 1:
              raise SystemExit("audit output field replacement did not match once")
          text = text.replace(old_field, new_field, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Add temporal-audit regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_e8_multitask_p0.py")
          text = path.read_text(encoding="utf-8")
          old = '''    p0.atomic_json(tmp_path / "scheduler" / "dynamic_run.json", {"complete":True,"seed_batch_barriers":True,"seed_batch_order":[4000,5000],"seed_batch_expected_cells":{"4000":88,"5000":88},"seed_batch_completed_cells":{"4000":88,"5000":88}})\n    audit=exp_tuning.cmd_audit(config,tmp_path)\n    assert audit["all_training_and_evaluation_complete"] is True\n    assert audit["scientific_status"] == "finite_step_validated"\n    victim=cells[0]; path=tmp_path / "cells" / victim.key / "cell_manifest.json"\n    value=json.loads(path.read_text()); value["terminal_step"]=1199; p0.atomic_json(path,value)\n    failed=exp_tuning.cmd_audit(config,tmp_path)\n    assert failed["scientific_status"] == "pilot" and victim.key in failed["terminal_contract_failures"]\n'''
          new = '''    scheduler_run_id = "formal-terminal-audit-test"\n    p0.atomic_json(\n        tmp_path / "scheduler" / "dynamic_run.json",\n        {\n            "complete": True,\n            "scheduler_run_id": scheduler_run_id,\n            "seed_batch_barriers": True,\n            "seed_batch_order": [4000, 5000],\n            "seed_batch_expected_cells": {"4000": 88, "5000": 88},\n            "seed_batch_completed_cells": {"4000": 88, "5000": 88},\n        },\n    )\n    events = [\n        {\n            "scheduler_run_id": "stale-prior-run",\n            "event": "start",\n            "seed": 5000,\n            "unix_time": 0.0,\n        }\n    ]\n    seed_4000 = [cell for cell in cells if cell.seed == 4000]\n    seed_5000 = [cell for cell in cells if cell.seed == 5000]\n    for index, cell in enumerate(seed_4000):\n        events.extend(\n            [\n                {\n                    "scheduler_run_id": scheduler_run_id,\n                    "event": "start",\n                    "cell_key": cell.key,\n                    "seed": 4000,\n                    "unix_time": float(index),\n                },\n                {\n                    "scheduler_run_id": scheduler_run_id,\n                    "event": "finish",\n                    "cell_key": cell.key,\n                    "seed": 4000,\n                    "returncode": 0,\n                    "unix_time": 1000.0 + float(index),\n                },\n            ]\n        )\n    for index, cell in enumerate(seed_5000):\n        events.extend(\n            [\n                {\n                    "scheduler_run_id": scheduler_run_id,\n                    "event": "start",\n                    "cell_key": cell.key,\n                    "seed": 5000,\n                    "unix_time": 2000.0 + float(index),\n                },\n                {\n                    "scheduler_run_id": scheduler_run_id,\n                    "event": "finish",\n                    "cell_key": cell.key,\n                    "seed": 5000,\n                    "returncode": 0,\n                    "unix_time": 3000.0 + float(index),\n                },\n            ]\n        )\n    event_path = tmp_path / "scheduler" / "queue_events.jsonl"\n    p0.atomic_jsonl(event_path, events)\n\n    audit = exp_tuning.cmd_audit(config, tmp_path)\n    assert audit["seed_batch_protocol_complete"] is True\n    assert audit["seed_batch_temporal_order_complete"] is True\n    assert audit["all_training_and_evaluation_complete"] is True\n    assert audit["scientific_status"] == "finite_step_validated"\n\n    bad_events = [dict(row) for row in events]\n    bad_start = next(\n        row\n        for row in bad_events\n        if row.get("scheduler_run_id") == scheduler_run_id\n        and row.get("event") == "start"\n        and row.get("seed") == 5000\n    )\n    bad_start["unix_time"] = 1.0\n    p0.atomic_jsonl(event_path, bad_events)\n    temporal_failed = exp_tuning.cmd_audit(config, tmp_path)\n    assert temporal_failed["seed_batch_protocol_complete"] is True\n    assert temporal_failed["seed_batch_temporal_order_complete"] is False\n    assert temporal_failed["all_training_and_evaluation_complete"] is False\n    assert temporal_failed["scientific_status"] == "pilot"\n\n    p0.atomic_jsonl(event_path, events)\n    victim = cells[0]\n    path = tmp_path / "cells" / victim.key / "cell_manifest.json"\n    value = json.loads(path.read_text())\n    value["terminal_step"] = 1199\n    p0.atomic_json(path, value)\n    failed = exp_tuning.cmd_audit(config, tmp_path)\n    assert failed["scientific_status"] == "pilot"\n    assert victim.key in failed["terminal_contract_failures"]\n'''
          if text.count(old) != 1:
              raise SystemExit(f"formal audit test replacement expected once, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          git add src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git commit -m "fix: independently audit E8 seed barrier history"
      - name: Install test dependencies
        run: python -m pip install -e . pytest ruff
      - name: Full focused validation
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m py_compile src/drpo/e8_experiment_config.py src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          pytest -q tests/test_e8_multitask_p0.py
          ruff check src/drpo/e8_experiment_config.py tests/test_e8_multitask_p0.py
          ruff check src/drpo/e8_multitask_exp_tuning.py --ignore BLE001,B023
          git diff --check
          python - <<'PY'
          import inspect
          from drpo import e8_multitask_exp_tuning as e
          source = inspect.getsource(e._train_canonical_dpo_transfer_cell)
          required = (
              "full_sequence_log_probability",
