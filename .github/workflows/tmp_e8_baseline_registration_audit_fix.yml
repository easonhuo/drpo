name: tmp-e8-baseline-registration-audit-fix
on:
  push:
    branches: [dev/e8-multitask-baselines-capability-01]
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-baselines-capability-01
          fetch-depth: 0
      - name: Verify restored scientific tree
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t other < <(git diff --name-only 50cd7c7c3e938d6cb9c00ef7a2ec0d8ce4d93322 HEAD | grep -v '^\.github/workflows/tmp_e8_baseline_registration_audit_fix.yml$' || true)
          test "${#other[@]}" -eq 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Replay corrected exact-event workflow
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          import subprocess

          import yaml

          previous = subprocess.check_output(
              [
                  "git",
                  "show",
                  "0fd58b939d391401c61498934da4e48219163031:.github/workflows/tmp_e8_baseline_registration_audit_fix.yml",
              ],
              text=True,
          )
          workflow = yaml.safe_load(previous)
          step = next(
              item
              for item in workflow["jobs"]["validate-and-commit"]["steps"]
              if item.get("name") == "Replay reviewed workflow with exact event identity"
          )
          command = step["run"]

          replacements = [
              (
                  "old_registry_audit = '''                  seed_batch_temporal_event_history_check: true\\n                  temporal_event_source: scheduler/queue_events.jsonl'''",
                  "old_registry_audit = '''        seed_batch_temporal_event_history_check: true\\n        temporal_event_source: scheduler/queue_events.jsonl'''",
              ),
              (
                  "new_registry_audit = '''                  seed_batch_temporal_event_history_check: true\\n                  seed_batch_event_cell_identity_check: exact_expected_cell_keys_no_duplicates\\n                  temporal_event_source: scheduler/queue_events.jsonl'''",
                  "new_registry_audit = '''        seed_batch_temporal_event_history_check: true\\n        seed_batch_event_cell_identity_check: exact_expected_cell_keys_no_duplicates\\n        temporal_event_source: scheduler/queue_events.jsonl'''",
              ),
              (
                  "old_handoff = '''              \"`scheduler/queue_events.jsonl`，验证 seed-4000 成功 finish 计数、seed-5000 start/成功 finish 计数以及 \"\\n              \"`max(seed4000 successful finish time) <= min(seed5000 start time)`。固定 1200 updates 通过全部终态审计后最多登记为 \"'''",
                  "old_handoff = '''    \"`scheduler/queue_events.jsonl`，验证 seed-4000 成功 finish 计数、seed-5000 start/成功 finish 计数以及 \"\\n    \"`max(seed4000 successful finish time) <= min(seed5000 start time)`。固定 1200 updates 通过全部终态审计后最多登记为 \"'''",
              ),
              (
                  "new_handoff = '''              \"`scheduler/queue_events.jsonl`，验证每个 seed 的 start 与 successful-finish `cell_key` 集合都与冻结的 88 个预期 cell 完全一致、无重复、无缺失，随后再验证 \"\\n              \"`max(seed4000 successful finish time) <= min(seed5000 start time)`。固定 1200 updates 通过全部终态审计后最多登记为 \"'''",
                  "new_handoff = '''    \"`scheduler/queue_events.jsonl`，验证每个 seed 的 start 与 successful-finish `cell_key` 集合都与冻结的 88 个预期 cell 完全一致、无重复、无缺失，随后再验证 \"\\n    \"`max(seed4000 successful finish time) <= min(seed5000 start time)`。固定 1200 updates 通过全部终态审计后最多登记为 \"'''",
              ),
              (
                  "scope_path.write_text(scope.rstrip() + audit_closure + \"\\n\", encoding=\"utf-8\")",
                  "scope_path.write_text(scope.rstrip() + audit_closure.rstrip() + \"\\n\", encoding=\"utf-8\")",
              ),
          ]
          for old, new in replacements:
              if command.count(old) != 1:
                  raise SystemExit(f"nested replay normalization fragment count={command.count(old)}")
              command = command.replace(old, new, 1)

          env = os.environ.copy()
          env["PYTHONPATH"] = "."
          result = subprocess.run(
              ["bash", "-euo", "pipefail", "-c", command],
              env=env,
              text=True,
          )
          raise SystemExit(result.returncode)
          PY
