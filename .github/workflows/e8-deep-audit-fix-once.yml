def test_deep_audit_external_cli_rejects_untracked_generic_config(tmp_path: Path) -> None:
    import os
    import subprocess
    import sys

    import yaml

    source = Path("configs/e8_multitask_exp_lambda_curve_completion.yaml")
    config = yaml.safe_load(source.read_text(encoding="utf-8"))
    config["experiment_id"] = "EXT-C-E8-MULTITASK-UNTRACKED-CLI-TEST"
    candidate = tmp_path / "untracked_generic.yaml"
    candidate.write_text(yaml.safe_dump(config, sort_keys=False), encoding="utf-8")
    environment = os.environ.copy()
    environment["PYTHONPATH"] = str(Path("src").resolve())
    completed = subprocess.run(
        [
