name: E8 Stale Success Reuse Fix Once

on:
  push:
    paths:
      - .github/workflows/e8-deep-audit-fix-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify starting head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "421b59e2627aec42891529368bc20fbb2223296f"
          git diff --quiet origin/main -- .github/workflows/code-change-budget.yml

      - name: Apply owner-approved stale-success correction
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          protocol_path = Path("docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md")
          protocol = protocol_path.read_text(encoding="utf-8")
          heading = "## 2026-09-02 owner-approved stale-success reuse correction"
          if heading not in protocol:
              protocol += """

          ## 2026-09-02 owner-approved stale-success reuse correction

          This section narrowly supersedes the 2026-09-02 gate-liquidation statement only for the completed-attempt fast path. The repository owner explicitly approved this correction after confirming that `reuse_successful_attempt()` was introduced recently as part of automatic recovery and can otherwise return an old successful artifact after the reviewed source or selected config has changed.

          - A previously successful attempt may be returned directly only when its recorded `source_provenance.source_commit` equals the current `E8_COLDSTART_EXPECTED_COMMIT` and its prepared experiment/config identity equals the config selected for the current invocation.
          - For engineering self-test reuse, the expected config identity is the internal placeholder config deterministically derived from the current reviewed config; the external reviewed config is not reclassified as a placeholder config.
          - Missing or mismatched identity makes the old success ineligible for the fast path. The old attempt/artifact is preserved; execution falls through to the normal new-attempt/recovery path.
          - This approval does **not** restore the broader third-audit execution identity: no model-snapshot hash, dependency/runtime fingerprint, backend/run-class fingerprint, or expanded stale-recovery gate is added.
          - The separately discussed external `engineering_self_test.placeholder_backend` blocker is **not** added.
          - This is an engineering correctness fix only. It changes no scientific config, data, seed, lambda, optimizer/training rule, canonical trainer/loss, metric, result status, or method ranking.
          """
          protocol_path.write_text(protocol, encoding="utf-8")

          tuning_path = Path("src/drpo/e8_multitask_exp_tuning.py")
          tuning = tuning_path.read_text(encoding="utf-8")
          marker = "\ndef _effective_recovery_config(\n"
          helper = '''\ndef _successful_attempt_matches_current_identity(\n    config: Mapping[str, Any],\n    workload_root: Path,\n    *,\n    source_commit: str,\n) -> bool:\n    \"\"\"Return whether a completed attempt belongs to the current source/config identity.\"\"\"\n\n    try:\n        provenance = _read_json_object(workload_root / \"source_provenance.json\")\n        prepare = _read_json_object(workload_root / \"prepare_manifest.json\")\n    except (OSError, ValueError, TypeError, json.JSONDecodeError):\n        return False\n    return (\n        provenance.get(\"source_commit\") == source_commit\n        and prepare.get(\"experiment_id\") == experiment_id(config)\n        and prepare.get(\"config_hash\") == stable_config_hash(config)\n    )\n\n\n'''
          if "def _successful_attempt_matches_current_identity(" not in tuning:
              if tuning.count(marker) != 1:
                  raise SystemExit("could not locate recovery-config insertion point")
              tuning = tuning.replace(marker, helper + marker.lstrip("\n"), 1)
          tuning_path.write_text(tuning, encoding="utf-8")

          runner_path = Path("scripts/run_e8_multitask_exp_coldstart.sh")
          runner = runner_path.read_text(encoding="utf-8")
          old = '''  [[ -f "${artifact}" && -f "${latest}/workload/aggregate/plot_curve_points.csv" ]] || return 1\n  python "${ROOT_DIR}/scripts/verify_experiment_package_hardened.py" \\\n    --repo-root "${ROOT_DIR}" "${artifact}" >/dev/null || return 1\n'''
          new = '''  [[ -f "${artifact}" && -f "${latest}/workload/aggregate/plot_curve_points.csv" ]] || return 1\n  python - "${latest}/workload" "${CONFIG_PATH}" "${EXPECTED_COMMIT}" "${MODE}" <<'PY_REUSE' >/dev/null || return 1\nfrom pathlib import Path\nimport sys\n\nfrom drpo.e8_multitask_exp_tuning import (\n    _engineering_self_test_config,\n    _successful_attempt_matches_current_identity,\n    load_config,\n)\n\nworkload_root = Path(sys.argv[1])\nconfig = load_config(Path(sys.argv[2]))\nmode = sys.argv[4]\nif mode == "self-test":\n    config = _engineering_self_test_config(config)\nelif mode != "full":\n    raise SystemExit(1)\nraise SystemExit(\n    0\n    if _successful_attempt_matches_current_identity(\n        config, workload_root, source_commit=sys.argv[3]\n    )\n    else 1\n)\nPY_REUSE\n  python "${ROOT_DIR}/scripts/verify_experiment_package_hardened.py" \\\n    --repo-root "${ROOT_DIR}" "${artifact}" >/dev/null || return 1\n'''
          if "_successful_attempt_matches_current_identity" not in runner:
              if runner.count(old) != 1:
                  raise SystemExit("could not locate successful-attempt fast path")
              runner = runner.replace(old, new, 1)
          runner_path.write_text(runner, encoding="utf-8")

          test_path = Path("tests/test_e8_multitask_p0.py")
          tests = test_path.read_text(encoding="utf-8")
          test_name = "def test_successful_attempt_reuse_requires_current_source_and_config"
          if test_name not in tests:
              tests += '''\n\n\ndef test_successful_attempt_reuse_requires_current_source_and_config(tmp_path: Path) -> None:\n    from drpo import e8_multitask_exp_tuning as exp_tuning\n\n    config = exp_tuning.load_config(\n        Path("configs/e8_multitask_exp_lambda_curve_completion.yaml")\n    )\n    workload = tmp_path / "workload"\n    source_commit = "a" * 40\n    p0.atomic_json(\n        workload / "source_provenance.json",\n        {"source_commit": source_commit},\n    )\n    p0.atomic_json(\n        workload / "prepare_manifest.json",\n        {\n            "experiment_id": exp_tuning.experiment_id(config),\n            "config_hash": exp_tuning.stable_config_hash(config),\n        },\n    )\n\n    assert exp_tuning._successful_attempt_matches_current_identity(\n        config, workload, source_commit=source_commit\n    )\n    assert not exp_tuning._successful_attempt_matches_current_identity(\n        config, workload, source_commit="b" * 40\n    )\n\n    changed = copy.deepcopy(config)\n    changed["experiment_id"] = "EXT-C-E8-MULTITASK-STALE-REUSE-OTHER-CONFIG"\n    assert not exp_tuning._successful_attempt_matches_current_identity(\n        changed, workload, source_commit=source_commit\n    )\n\n    (workload / "source_provenance.json").unlink()\n    assert not exp_tuning._successful_attempt_matches_current_identity(\n        config, workload, source_commit=source_commit\n    )\n\n    runner = Path("scripts/run_e8_multitask_exp_coldstart.sh").read_text(encoding="utf-8")\n    reuse = runner.split("\\nreuse_successful_attempt() {\\n", 1)[1].split(\n        "\\nselect_next_attempt() {\\n", 1\n    )[0]\n    assert "_successful_attempt_matches_current_identity" in reuse\n    assert reuse.index("_successful_attempt_matches_current_identity") < reuse.index(\n        "verify_experiment_package_hardened.py"\n    )\n'''
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install focused test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 PyYAML==6.0.2 pytest==8.3.4 ruff==0.9.10
          python -m pip install --no-deps -e .

      - name: Validate stale-success correction
        run: |
          set -euo pipefail
          python -m py_compile src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          python -m ruff check src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_e8_multitask_p0.py
          git diff --check
          git diff --quiet origin/main -- .github/workflows/code-change-budget.yml

      - name: Commit validated business after-image and remove temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/e8-deep-audit-fix-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/experiments/E8_CONFIG_DRIVEN_SWEEP_REVIEW_FIX_PROTOCOL.md \
            scripts/run_e8_multitask_exp_coldstart.sh \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          git commit -m "fix(e8): bind successful attempt reuse to current identity"
          git push origin HEAD:dev/e8-config-driven-sweep-01
