def test_deep_audit_canonical_liveness_records_actual_smoke_identity() -> None:
    import math

    from drpo import e8_multitask_exp_tuning as exp_tuning

    actual = exp_tuning._canonical_liveness_cell(
        {
            "cell": {
                "name": "base_continuous_exp_alpha1_c0p69314718_seed4000",
                "method": "continuous_exp",
                "family": "exponential",
                "alpha": 1.0,
                "c": 0.693147181,
                "seed_offset": 4000,
            }
        }
    )
    assert actual.task == "countdown"
    assert actual.method == exp_tuning.METHOD_EXPONENTIAL
    assert actual.lambda_value == 0.693147181
    assert actual.seed == 4000
    assert math.isclose(actual.rho, math.exp(-0.693147181), rel_tol=0.0, abs_tol=1.0e-15)


