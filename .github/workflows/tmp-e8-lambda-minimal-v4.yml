name: Temporary E8 lambda minimal v4

on:
  push:
    branches:
      - dev/e8-multitask-lambda-completion-minimal-04

permissions:
  contents: write

jobs:
  minimalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-multitask-lambda-completion-minimal-04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize frozen successor config and regression tests
        run: |
          git show 42df8590677fe95e0b021a2d80f4b8a923f72b13:configs/e8_multitask_exp_lambda_completion.yaml > configs/e8_multitask_exp_lambda_completion.yaml
          sed -i 's/profile: eight_task_lambda_completion_v1/profile: eight_task_coldstart_lambda_v1/' configs/e8_multitask_exp_lambda_completion.yaml
          git show 42df8590677fe95e0b021a2d80f4b8a923f72b13:tests/test_e8_multitask_p0.py > tests/test_e8_multitask_p0.py
          cat > scripts/run_e8_multitask_exp_lambda_completion.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          export E8_COLDSTART_CONFIG="${ROOT_DIR}/configs/e8_multitask_exp_lambda_completion.yaml"
          export E8_COLDSTART_RUN_ID="${E8_COLDSTART_RUN_ID:-E8_MULTITASK_EXP_LAMBDA_COMPLETION_01}"
          exec bash "${ROOT_DIR}/scripts/run_e8_multitask_exp_coldstart.sh" "$@"
          EOF
          chmod +x scripts/run_e8_multitask_exp_lambda_completion.sh
      - name: Apply minimal config-driven wrapper compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/drpo/e8_multitask_exp_tuning.py')
          text = path.read_text(encoding='utf-8')

          old = '''COLDSTART_EXPERIMENT_ID = "EXT-C-E8-MULTITASK-EXP-COLDSTART-01"\nSUPPORTED_EXPERIMENT_IDS = (EXPERIMENT_ID, DENSE_EXPERIMENT_ID, COLDSTART_EXPERIMENT_ID)\n'''
          new = '''COLDSTART_EXPERIMENT_ID = "EXT-C-E8-MULTITASK-EXP-COLDSTART-01"\nLAMBDA_COMPLETION_EXPERIMENT_ID = "EXT-C-E8-MULTITASK-EXP-LAMBDA-COMPLETION-01"\nSUPPORTED_EXPERIMENT_IDS = (\n    EXPERIMENT_ID, DENSE_EXPERIMENT_ID, COLDSTART_EXPERIMENT_ID, LAMBDA_COMPLETION_EXPERIMENT_ID\n)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''            current_experiment != COLDSTART_EXPERIMENT_ID\n            or len(tasks) != 9\n'''
          new = '''            current_experiment not in (COLDSTART_EXPERIMENT_ID, LAMBDA_COMPLETION_EXPERIMENT_ID)\n            or len(tasks) != 9\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        if tuple(int(value) for value in sweep.get("countdown_seed_offsets", ())) != (\n            PAPER_SEED_OFFSETS\n        ):\n            raise ValueError("Countdown must preserve the two paper seed offsets")\n'''
          new = '''        expected_countdown_seeds = (\n            () if current_experiment == LAMBDA_COMPLETION_EXPERIMENT_ID else PAPER_SEED_OFFSETS\n        )\n        if tuple(int(value) for value in sweep.get("countdown_seed_offsets", ())) != expected_countdown_seeds:\n            raise ValueError("Countdown seed offsets drifted")\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        if transfer_positive_seeds != (4000, 5000, 6000, 7000):\n            raise ValueError("Transfer Positive-only must use the four frozen historical seed streams")\n'''
          new = '''        if current_experiment == LAMBDA_COMPLETION_EXPERIMENT_ID:\n            if not transfer_positive_seeds or len(transfer_positive_seeds) != len(set(transfer_positive_seeds)):\n                raise ValueError("Successor Positive-only seed offsets must be non-empty and unique")\n        elif transfer_positive_seeds != (4000, 5000, 6000, 7000):\n            raise ValueError("Transfer Positive-only must use the four frozen historical seed streams")\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        if not isinstance(grid_hashes, Mapping) or dict(grid_hashes) != expected_hashes:\n            raise ValueError("Transfer task-grid hashes drifted")\n'''
          new = '''        if not isinstance(grid_hashes, Mapping) or set(grid_hashes) != transfer_tasks:\n            raise ValueError("Transfer task-grid hashes must cover the exact eight tasks")\n        if current_experiment != LAMBDA_COMPLETION_EXPERIMENT_ID and dict(grid_hashes) != expected_hashes:\n            raise ValueError("Historical transfer task-grid hashes drifted")\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''            if len(values) != 20 or len(set(values)) != 20:\n                raise ValueError(f"{task} must contain exactly 20 distinct Exp coefficients")\n'''
          new = '''            if len(values) != len(set(values)) or (\n                current_experiment != LAMBDA_COMPLETION_EXPERIMENT_ID and len(values) != 20\n            ):\n                raise ValueError(f"{task} Exp coefficient grid has invalid cardinality")\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        if int(sweep.get("expected_cells", -1)) != 208:\n            raise ValueError("Cold-start must contain 16 Countdown plus 8x24 transfer cells")\n'''
          new = '''        expanded_cells = len(expected_countdown_seeds) * (2 + len(countdown_sentinels)) + sum(\n            len(transfer_positive_seeds) + len(_task_lambdas(config, str(task)))\n            for task in transfer_tasks\n        )\n        if int(sweep.get("expected_cells", -1)) != expanded_cells:\n            raise ValueError("Cold-start expected_cells must match the configured matrix")\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    if _is_coldstart(config):\n        cells: list[Cell] = []\n        countdown_coefficients = _task_lambdas(config, "countdown")\n'''
          new = '''    if _is_coldstart(config):\n        cells: list[Cell] = []\n        lambda_only = experiment_id(config) == LAMBDA_COMPLETION_EXPERIMENT_ID\n        countdown_coefficients = _task_lambdas(config, "countdown")\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''                    math.exp(-coefficient),\n                    seed_offset,\n'''
          new = '''                    None if lambda_only else math.exp(-coefficient),\n                    seed_offset,\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''                    math.exp(-coefficient),\n                    exp_seed,\n'''
          new = '''                    None if lambda_only else math.exp(-coefficient),\n                    exp_seed,\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        result = tuple(cells)\n        if len(result) != 208 or len({cell.key for cell in result}) != 208:\n            raise AssertionError("Internal 208-cell cold-start identity failure")\n        return result\n'''
          new = '''        result = tuple(cells)\n        expected_cells = int(config["sweep"]["expected_cells"])\n        if len(result) != expected_cells or len({cell.key for cell in result}) != expected_cells:\n            raise AssertionError("Internal cold-start cell identity failure")\n        return result\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        if len(waves) != 13 or any(len(wave) != 16 for wave in waves):\n            raise AssertionError("Cold-start geometry must be 13 exact 16-cell scheduling waves")\n'''
          new = '''        if (\n            not waves\n            or len(waves) != int(config["execution"]["expected_waves"])\n            or any(len(wave) != capacity for wave in waves[:-1])\n            or not 0 < len(waves[-1]) <= capacity\n        ):\n            raise AssertionError("Cold-start waves must fill capacity except possibly the final wave")\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    expected = [cell for cell in build_cells(config) if cell.task == task]\n    expected_count = 16 if task == "countdown" else 24\n    if len(expected) != expected_count:\n        raise AssertionError(f"{task} expected {expected_count} cold-start cells")\n'''
          new = '''    expected = [cell for cell in build_cells(config) if cell.task == task]\n    expected_count = len(expected)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        "expected_cells": 16 if task == "countdown" else 24,\n'''
          new = '''        "expected_cells": expected_count,\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''            "the terminal 208-cell aggregate remains the final reporting authority."\n'''
          new = '''            "the terminal aggregate remains the final reporting authority."\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        expected_counts = (2, 2, 12) if task == "countdown" else (4, 0, 20)\n        if (len(positive_rows), len(global_rows), len(exp_rows)) != expected_counts:\n'''
          new = '''        configured_cells = [cell for cell in build_cells(config) if cell.task == task]\n        if not configured_cells:\n            continue\n        expected_counts = tuple(\n            sum(cell.method == method for cell in configured_cells)\n            for method in (METHOD_POSITIVE_ONLY, METHOD_GLOBAL, METHOD_EXPONENTIAL)\n        )\n        if (len(positive_rows), len(global_rows), len(exp_rows)) != expected_counts:\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''            "status": "PASS" if not identity_failures and len(countdown_cells) == 16 else "FAIL",\n'''
          new = '''            "status": "PASS" if not identity_failures and (\n                len(countdown_cells) == 16 or experiment_id(config) == LAMBDA_COMPLETION_EXPERIMENT_ID\n            ) else "FAIL",\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''            "scientific_evidence": True,\n'''
          new = '''            "scientific_evidence": experiment_id(config) != LAMBDA_COMPLETION_EXPERIMENT_ID,\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate minimal successor
        run: |
          python -m compileall -q src tests
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh
          python -m pytest -q tests/test_e8_multitask_p0.py
          ruff check --select E9,F63,F7,F82 src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git diff --quiet 5260ca58ecb67509838a1e5480f6dcaafdb7a773 -- scripts/run_e8_multitask_exp_coldstart.sh
          git diff --quiet 5260ca58ecb67509838a1e5480f6dcaafdb7a773 -- \
            src/drpo/countdown_qwen_arena_onefile.py \
            src/drpo/countdown_e8_alpha1_c_scan_common.py \
            src/drpo/countdown_e8_alpha1_c_scan_runtime.py \
            src/drpo/countdown_e8_alpha1_c_scan_trainer.py \
            src/drpo/countdown_e8_alpha1_highc_scan_common.py \
            src/drpo/countdown_e8_alpha1_highc_scan_runtime.py
      - name: Matrix, lambda-only and regression gates
        run: |
          python - <<'PY'
          from pathlib import Path
          from drpo import e8_multitask_exp_tuning as m

          successor = m.load_config(Path('configs/e8_multitask_exp_lambda_completion.yaml'))
          cells = m.build_cells(successor)
          assert len(cells) == successor['sweep']['expected_cells'] == 199
          assert sum(c.method == m.METHOD_EXPONENTIAL for c in cells) == 183
          assert sum(c.method == m.METHOD_POSITIVE_ONLY for c in cells) == 16
          assert not any(c.task == 'countdown' for c in cells)
          assert all(c.rho is None and c.lambda_value is not None for c in cells if c.method == m.METHOD_EXPONENTIAL)
          assert [len(w) for w in m.build_waves(successor)] == [16] * 12 + [7]

          historical = m.load_config(Path('configs/e8_multitask_exp_coldstart.yaml'))
          old_cells = m.build_cells(historical)
          assert len(old_cells) == 208
          assert [len(w) for w in m.build_waves(historical)] == [16] * 13
          assert all(c.rho is not None for c in old_cells if c.method == m.METHOD_EXPONENTIAL)

          source = Path('src/drpo/e8_multitask_exp_tuning.py').read_text(encoding='utf-8')
          for forbidden in ('8000', '9000', '34.538776395', '40.0', '30.0', '26.0', '== 199'):
              assert forbidden not in source, forbidden
          assert 'eight_task_lambda_completion_v1' not in source
          PY
          python - <<'PY'
          import subprocess
          base='5260ca58ecb67509838a1e5480f6dcaafdb7a773'
          path='src/drpo/e8_multitask_exp_tuning.py'
          out=subprocess.check_output(['git','diff','--numstat',base,'--',path], text=True).strip()
          print(out)
          added, deleted, _ = out.split('\t')
          assert int(added) + int(deleted) <= 80, out
          PY
      - name: Commit clean minimal implementation
        run: |
          rm .github/workflows/tmp-e8-lambda-minimal-v4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configs/e8_multitask_exp_lambda_completion.yaml \
            scripts/run_e8_multitask_exp_lambda_completion.sh \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py \
            .github/workflows/tmp-e8-lambda-minimal-v4.yml
          git commit -m 'E8: minimal config-driven lambda completion'
          git push origin HEAD:dev/e8-multitask-lambda-completion-minimal-04
