name: E8 Redundancy Optimization Once

on:
  push:
    branches: [dev/e8-config-driven-sweep-01]
    paths:
      - .github/workflows/e8-redundancy-optimization-once.yml

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-config-driven-sweep-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply redundancy-only simplification
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          config_path = Path("src/drpo/e8_experiment_config.py")
          text = config_path.read_text(encoding="utf-8")
          start = text.index("def _validate_scalar_types(config: Mapping[str, Any]) -> None:\n")
          end = text.index("\ndef _validate_implementation_contract", start)
          replacement = '''def _validate_scalar_types(config: Mapping[str, Any]) -> None:
              for section, fields in {
                  "reference": ("optimizer_updates", "validation_rows_seen", "test_rows_seen"),
                  "initialization": ("optimizer_updates", "seed"),
                  "split": (
                      "p0_train_rows",
                      "p0_validation_rows",
                      "p0_test_rows",
                      "countdown_train_rows",
                      "countdown_validation_rows",
                      "hash_seed",
                  ),
                  "evaluation": ("generation_seed",),
                  "negative_sampling": ("negatives_per_prompt",),
              }.items():
                  values = _mapping(config.get(section), section)
                  for field in fields:
                      _integer(values.get(field), f"{section}.{field}")

              for section, fields in {
                  "model": ("lora_rank", "lora_alpha", "max_length", "max_new_tokens"),
                  "training": (
                      "optimizer_updates",
                      "micro_batch",
                      "gradient_accumulation",
                      "evaluation_every_updates",
                  ),
                  "evaluation": (
                      "greedy_prompt_rows",
                      "passk_prompt_rows",
                      "pass_k",
                      "batch_size",
                      "max_new_tokens",
                  ),
              }.items():
                  values = _mapping(config.get(section), section)
                  for field in fields:
                      _integer(values.get(field), f"{section}.{field}", positive=True)

              for section, fields in {
                  "parent": ("qualified_banks_required",),
                  "initialization": ("external_adapter_allowed", "deterministic_fresh_lora"),
                  "model": ("gradient_checkpointing",),
                  "split": ("test_access_allowed", "countdown_subsampling_forbidden"),
                  "training": ("early_stopping", "terminal_adapter_required"),
                  "negative_sampling": (
                      "near_far_selection",
                      "selection_stop_gradient",
                      "weight_sum_normalization",
                      "gradient_budget_matching",
                  ),
                  "remoteness_calibration": (
                      "enabled",
                      "detached",
                      "extra_square",
                      "gradient_rms_matching",
                  ),
                  "selection": ("finite_required", "report_grid_edge"),
              }.items():
                  values = _mapping(config.get(section), section)
                  for field in fields:
                      _boolean(values.get(field), f"{section}.{field}")

              training = _mapping(config.get("training"), "training")
              late = tuple(
                  _integer(value, "training.late_window_updates entry", positive=True)
                  for value in _sequence(
                      training.get("late_window_updates"), "training.late_window_updates"
                  )
              )
              if not late or tuple(sorted(set(late))) != late:
                  raise ValueError("training.late_window_updates must be sorted and unique")
              optimizer_updates = int(training["optimizer_updates"])
              evaluation_every = int(training["evaluation_every_updates"])
              if late[-1] > optimizer_updates:
                  raise ValueError("training.late_window_updates may not exceed optimizer_updates")
              if any(update != optimizer_updates and update % evaluation_every != 0 for update in late):
                  raise ValueError(
                      "training.late_window_updates must fall on configured evaluation updates "
                      "or the terminal optimizer update"
                  )

              model = _mapping(config.get("model"), "model")
              dropout = _number(model.get("lora_dropout"), "model.lora_dropout")
              if not 0.0 <= dropout < 1.0:
                  raise ValueError("model.lora_dropout must be in [0, 1)")

              evaluation = _mapping(config.get("evaluation"), "evaluation")
              tuple(
                  _integer(value, "evaluation.auxiliary_pass_ks entry", positive=True)
                  for value in _sequence(
                      evaluation.get("auxiliary_pass_ks"), "evaluation.auxiliary_pass_ks"
                  )
              )
              top_p = _number(evaluation.get("top_p"), "evaluation.top_p")
              if not 0.0 < top_p <= 1.0:
                  raise ValueError("evaluation.top_p must be in (0, 1]")
              temperature = _number(
                  evaluation.get("sampling_temperature"), "evaluation.sampling_temperature"
              )
              if temperature <= 0.0:
                  raise ValueError("evaluation.sampling_temperature must be positive")

              learning_rate = _number(training.get("learning_rate"), "training.learning_rate")
              if learning_rate <= 0.0:
                  raise ValueError("training.learning_rate must be positive")
              warmup_ratio = _number(training.get("warmup_ratio"), "training.warmup_ratio")
              if not 0.0 <= warmup_ratio < 1.0:
                  raise ValueError("training.warmup_ratio must be in [0, 1)")
              weight_decay = _number(training.get("weight_decay"), "training.weight_decay")
              if weight_decay < 0.0:
                  raise ValueError("training.weight_decay must be non-negative")
              max_grad_norm = _number(training.get("max_grad_norm"), "training.max_grad_norm")
              if max_grad_norm <= 0.0:
                  raise ValueError("training.max_grad_norm must be positive")
          '''
          replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in replacement.splitlines()) + "\n"
          text = text[:start] + replacement + text[end:]

          old = '''    active_transfer: list[str] = []
              for task in transfer_tasks:
                  values = task_lambdas(config, task)
                  if len(set(values)) != len(values):
                      raise ValueError(f"{task} lambda grid contains duplicates")
                  if stable_hash(list(values)) != str(hashes[task]):
                      raise ValueError(f"{task} lambda grid does not match task_grid_hashes")
                  if not str(provenance[task]).strip():
                      raise ValueError(f"{task} task-grid provenance must be non-empty")
                  if values:
                      active_transfer.append(task)

              expanded = len(countdown_seeds) * (1 + int(countdown_positive) + len(countdown_values)) + sum(
                  len(positive_seeds) + int(include_global) + len(task_lambdas(config, task))
                  for task in active_transfer
              )
          '''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines()) + "\n"
          new = '''    transfer_cell_count = 0
              for task in transfer_tasks:
                  values = task_lambdas(config, task)
                  if len(set(values)) != len(values):
                      raise ValueError(f"{task} lambda grid contains duplicates")
                  if stable_hash(list(values)) != str(hashes[task]):
                      raise ValueError(f"{task} lambda grid does not match task_grid_hashes")
                  if not str(provenance[task]).strip():
                      raise ValueError(f"{task} task-grid provenance must be non-empty")
                  if values:
                      transfer_cell_count += len(positive_seeds) + int(include_global) + len(values)

              expanded = (
                  len(countdown_seeds) * (1 + int(countdown_positive) + len(countdown_values))
                  + transfer_cell_count
              )
          '''
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines()) + "\n"
          if old not in text:
              raise SystemExit("sweep duplicate-expansion block not found")
          text = text.replace(old, new, 1)
          config_path.write_text(text, encoding="utf-8")

          preflight_path = Path("scripts/preflight_e8_multitask_config.py")
          text = preflight_path.read_text(encoding="utf-8")
          text = text.replace("\nimport yaml\n", "\n", 1)
          old = '''    resolved, relative, blob = experiment_config.require_tracked_config(config_path, repo_root)
              value = yaml.safe_load(resolved.read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise TypeError("Configuration root must be a mapping")
              experiment_config.validate_profile_experiment_id(value)
              experiment_config.validate_historical_config_identity(resolved, value, repo_root=repo_root)
              tuning.validate_config(value)
          '''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines()) + "\n"
          new = '''    resolved, relative, blob = experiment_config.require_tracked_config(config_path, repo_root)
              value = tuning.load_config(resolved)
          '''
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines()) + "\n"
          if old not in text:
              raise SystemExit("preflight duplicate-loader block not found")
          preflight_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          tuning_path = Path("src/drpo/e8_multitask_exp_tuning.py")
          text = tuning_path.read_text(encoding="utf-8")
          old = '''    current_experiment = experiment_id(config)
              profile = sweep_profile(config)
              if profile not in (SWEEP_PROFILE_RHO, SWEEP_PROFILE_DENSE, SWEEP_PROFILE_COLDSTART):
                  raise ValueError(f"Unsupported sweep profile: {profile}")
              experiment_config.validate_profile_experiment_id(config)
          '''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines()) + "\n"
          new = '''    profile = sweep_profile(config)
              experiment_config.validate_profile_experiment_id(config)
          '''
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines()) + "\n"
          if old not in text:
              raise SystemExit("tuning duplicate profile-validation block not found")
          text = text.replace(old, new, 1)
          old = '''        if (
                  current_experiment != DENSE_EXPERIMENT_ID
                  or len(tasks) != 7
                  or len(set(tasks)) != 7
                  or set(tasks) != _dense_tasks()
              ):
          '''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines()) + "\n"
          new = '''        if len(tasks) != 7 or len(set(tasks)) != 7 or set(tasks) != _dense_tasks():
          '''
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines()) + "\n"
          if old not in text:
              raise SystemExit("dense redundant experiment-id block not found")
          tuning_path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Validate optimized implementation
        run: |
          python -m py_compile \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            src/drpo/e8_multitask_exp_tuning.py \
            tests/test_e8_multitask_p0.py
          ruff check \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py \
            tests/test_e8_multitask_p0.py
          ruff format --check \
            src/drpo/e8_experiment_config.py \
            scripts/preflight_e8_multitask_config.py
          bash -n scripts/run_e8_multitask_exp_coldstart.sh
          bash -n scripts/bootstrap_e8_multitask_exp_coldstart.sh
          bash -n scripts/run_e8_multitask_exp_lambda_completion.sh
          python -m pytest -q tests/test_e8_multitask_p0.py
          python -m pytest -q tests/test_countdown_e8_oracle_offline_v2_alpha1_highc_scan.py -k 'not reciprocal and not asymre'
          python scripts/preflight_e8_multitask_config.py --repo-root . --config configs/e8_multitask_exp_coldstart.yaml >/tmp/e8-preflight-cold.json
          python scripts/preflight_e8_multitask_config.py --repo-root . --config configs/e8_multitask_exp_lambda_completion.yaml >/tmp/e8-preflight-completion.json
          python scripts/preflight_e8_multitask_config.py --repo-root . --config configs/e8_multitask_exp_lambda_curve_completion.yaml >/tmp/e8-preflight-curve.json
          python scripts/handoff_authority.py verify --repo-root .
          python scripts/validate_governance_pipeline_stage_status.py --repo-root .
          git diff --check
          git diff --stat

      - name: Commit optimization and self-remove
        run: |
          rm -f .github/workflows/e8-redundancy-optimization-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor(e8): remove redundant config validation"
          git push origin HEAD:dev/e8-config-driven-sweep-01
