name: E8 dynamic-slot repair workflow fixer

on:
  push:
    branches:
      - dev/e8-dynamic-slot-repair-work-20260820
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev/e8-multitask-exp-coldstart-01

permissions:
  contents: write

jobs:
  fix-temporary-worker:
    if: github.head_ref == '' || github.head_ref == 'dev/e8-dynamic-slot-repair-work-20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/e8-dynamic-slot-repair-work-20260820
          fetch-depth: 0

      - name: Scope the duplicate test-anchor replacement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/e8-dynamic-slot-repair-temp.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index('          drift_anchor = (\n')
          end_marker = '          test_path.write_text(tests, encoding="utf-8")\n'
          end = text.index(end_marker, start)
          replacement = '''          drift_start = tests.index(\n              "def test_exp_coldstart_rejects_adapter_runtime_or_grid_drift() -> None:"\n          )\n          drift_end = tests.index(\n              "\\ndef test_exp_coldstart_imports_locked_kernel_and_forbids_multitask_loader(",\n              drift_start,\n          )\n          drift_block = tests[drift_start:drift_end]\n          drift_anchor = (\n              '    changed = json.loads(json.dumps(config))\\n'\n              '    changed["execution"]["slots_per_gpu"] = 1\\n'\n              '    with pytest.raises(ValueError, match="two slots"):\\n'\n              '        exp_tuning.validate_config(changed)\\n'\n          )\n          drift_block = replace_once(\n              drift_block,\n              drift_anchor,\n              drift_anchor\n              + '    changed = json.loads(json.dumps(config))\\n'\n              + '    changed["execution"]["wave_barriers"] = True\\n'\n              + '    with pytest.raises(ValueError, match="recovery/OOM"):\\n'\n              + '        exp_tuning.validate_config(changed)\\n',\n              "barrier drift guard",\n          )\n          tests = tests[:drift_start] + drift_block + tests[drift_end:]\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit fixer and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/e8-dynamic-slot-repair-fix-temp.yml
          git config user.name 'drpo-validation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/e8-dynamic-slot-repair-temp.yml .github/workflows/e8-dynamic-slot-repair-fix-temp.yml
          git commit -m 'chore: fix dynamic-slot repair test anchor'
          git push origin HEAD:dev/e8-dynamic-slot-repair-work-20260820
