name: Temporary retry approved Table 1+2 merge v6

on:
  push:
    branches:
      - dev/manuscript-table1-table2-merge-01
    paths:
      - .github/workflows/_tmp_retry_table_merge_v6.yml

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev/manuscript-table1-table2-merge-01

      - name: Prepare approved apply and verify scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          src = Path('.github/workflows/_tmp_apply_table_merge_v6.yml')
          text = src.read_text(encoding='utf-8')

          def extract(name: str) -> str:
              marker = f'      - name: {name}\n'
              start = text.index(marker)
              run_marker = '        run: |\n'
              body_start = text.index(run_marker, start) + len(run_marker)
              next_step = text.find('\n      - name:', body_start)
              body = text[body_start:] if next_step < 0 else text[body_start:next_step]
              lines = []
              for line in body.splitlines():
                  if line.startswith('          '):
                      line = line[10:]
                  lines.append(line)
              return '\n'.join(lines) + '\n'

          apply = extract('Apply exactly approved manuscript edits')
          apply = apply.replace(
              "test \"$(git rev-parse HEAD^)\" = 'aefafc4ce4c6100b42e7eef93fd3dcc572481bf7'",
              "test \"$(git rev-parse HEAD^^)\" = 'aefafc4ce4c6100b42e7eef93fd3dcc572481bf7'",
          )
          apply = apply.replace(
              "test \"$(git rev-parse 'HEAD^:paper/overleaf/main_replacement.tex')\" = '9fad6a78d96b9cc7a306efa7d6f06c8003427629'",
              "test \"$(git rev-parse 'HEAD^^:paper/overleaf/main_replacement.tex')\" = '9fad6a78d96b9cc7a306efa7d6f06c8003427629'",
          )
          verify = extract('Verify generated ICLR main.tex matches approved after-image')
          Path('/tmp/apply-approved.sh').write_text(apply, encoding='utf-8')
          Path('/tmp/verify-approved.sh').write_text(verify, encoding='utf-8')
          PY
          chmod +x /tmp/apply-approved.sh /tmp/verify-approved.sh

      - name: Install ICLR build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            latexmk \
            poppler-utils \
            curl unzip zip
          python3 -m pip install -r scripts/figures/requirements.txt

      - name: Apply exactly approved manuscript edits
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/apply-approved.sh
          git rm .github/workflows/_tmp_retry_table_merge_v6.yml
          git commit --amend --no-edit

      - name: Verify generated ICLR main.tex matches approved after-image
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/verify-approved.sh

      - name: Compile ICLR paper
        shell: bash
        run: |
          set -euo pipefail
          bash paper/iclr2027/build.sh

      - name: Push approved branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:dev/manuscript-table1-table2-merge-01
