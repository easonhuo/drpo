name: E8 coverage-remoteness one-off edit

on:
  push:
    branches:
      - dev/e8-multitask-coverage-remoteness-01

permissions:
  contents: write

jobs:
  apply-reviewed-edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev/e8-multitask-coverage-remoteness-01
      - name: Apply reviewed source edit
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/edit_e8.py
          python /tmp/edit_e8.py
      - name: Static and targeted checks
        shell: bash
        run: |
          python -m py_compile src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git diff --check
          python -m pip install --quiet numpy PyYAML pytest
          PYTHONPATH=src python -m pytest -q tests/test_e8_multitask_p0.py -k 'coverage_first_class_quotas or within_class_rank_spread or coverage_remoteness_selection'
          PYTHONPATH=src python - <<'PY'
          from drpo.e8_multitask_exp_tuning import build_cells, build_waves, load_config
          config = load_config('configs/e8_multitask_exp_coldstart.yaml')
          assert len(build_cells(config)) == 208
          assert [len(wave) for wave in build_waves(config)] == [16] * 13
          print('208-cell/13-wave frozen geometry preserved')
          PY
      - name: Commit source edit and remove one-off workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/e8-coverage-remoteness-oneoff.yml
          git add src/drpo/e8_multitask_exp_tuning.py tests/test_e8_multitask_p0.py
          git diff --cached --check
          git commit -m 'E8 coldstart: combine error coverage with remoteness spread'
          git push origin HEAD:dev/e8-multitask-coverage-remoteness-01
