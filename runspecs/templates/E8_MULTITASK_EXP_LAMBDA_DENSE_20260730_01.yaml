    E8_DENSE_PARENT_OUTPUT_ROOT=/root/experiment_output/e8_multitask_exp_tuning_01
    E8_DENSE_BASE_MODEL_PATH=/root/models/Qwen2.5-0.5B-Instruct
    E8_DENSE_OUTPUT_ROOT=outputs/e8/e8_multitask_exp_lambda_dense_001
    bash scripts/run_e8_multitask_exp_lambda_dense.sh full
  retryable_exit_codes: [137, 143]
  checkpoint_globs:
    - outputs/e8/e8_multitask_exp_lambda_dense_001/plan.json
    - outputs/e8/e8_multitask_exp_lambda_dense_001/inherited/parent_snapshot.json
    - outputs/e8/e8_multitask_exp_lambda_dense_001/calibration/calibration_manifest.json
    - outputs/e8/e8_multitask_exp_lambda_dense_001/waves/all_waves.json
    - outputs/e8/e8_multitask_exp_lambda_dense_001/terminal_audit.json
  backoff_seconds: 60

