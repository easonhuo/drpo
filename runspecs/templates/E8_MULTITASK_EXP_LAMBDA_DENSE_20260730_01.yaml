purpose: >-
  Resolve task-local exponential-taper response shapes on seven external
  discrete tasks using exactly sixteen lambda cells per task and one task per
  sixteen-slot wave. Reuse the immutable predecessor split, train-only
  reference adapters, and Positive-only anchors; rerun lambda-dependent
  calibration; preserve the fixed training and validation contracts; and
  automatically deliver text-first evidence. This single-seed development
  stage does not establish significance, convergence, universal superiority,
  or categorical causal identification.

entrypoint:
  cwd: repo_root
  command: >-
    E8_DENSE_EXPECTED_COMMIT=9af9155b9651c0b271368855cfb779d50a6c1adc
    E8_DENSE_PARENT_OUTPUT_ROOT=/root/experiment_output/e8_multitask_exp_tuning_01
    E8_DENSE_BASE_MODEL_PATH=/root/models/Qwen2.5-0.5B-Instruct
    E8_DENSE_OUTPUT_ROOT=outputs/e8/e8_multitask_exp_lambda_dense_001
    bash scripts/run_e8_multitask_exp_lambda_dense.sh full

recovery:
