success_criteria:
  - source checkout is clean and exactly matches implementation commit 9af9155b9651c0b271368855cfb779d50a6c1adc
  - predecessor identity is E8_MULTITASK_EXP_TUNING_20260729_01 at drpo-results commit 26cf09102e4eaea9b58844fac158dc3cfc33314d
  - predecessor plan, split, reference, and aggregate artifacts match their frozen SHA-256 identities
  - Countdown and Spiral Matrix are not present in the new training matrix
  - the exact task set is word sorting, Mini Sudoku, maze, word ladder, knights and knaves, graph coloring, and WikiSQL
  - the matrix contains 112 exponential cells, seven waves, and exactly 16 cells from one task in every wave
  - every task contains 15 new lambda values and one exact predecessor-selected bridge lambda
  - no Positive-only cell is rerun and Positive-only comparisons use the inherited predecessor anchor
  - all cells preserve tuning seed 2026072904 and this stage remains single-seed shape discovery
  - the exact predecessor train, validation, and unopened test partitions are inherited without repartitioning
  - each inherited reference is the exact train-only 100-update task adapter and has seen zero validation and test rows
  - lambda-dependent initial-gradient calibration is rerun for all 16 lambda values on every task
  - one two-update adapter-change and fresh-process reload liveness gate passes before the first full wave
  - Qwen2.5-0.5B-Instruct, LoRA rank 32, alpha 64, dropout 0.05, and the parent optimizer contract remain unchanged
  - every cell performs exactly 1200 optimizer updates with microbatch 1 and gradient accumulation 8
  - validation is evaluated every 100 updates and the late window remains updates 800, 900, 1000, 1100, and 1200
  - all 112 cell manifests are complete and contain no NaN or Inf failure
  - aggregation emits 112 new rows, 56 inherited anchors, and a combined 168-point response table
  - selected grid-edge status, strong-taper boundary status, inherited Positive-only delta, and same-lambda bridge delta are recorded per task
  - graph coloring is reported only as a saturation control
  - task performance, validity or structure diagnostics, and NaN or Inf failure are reported separately
  - the test partition remains unopened
  - no significance, convergence, universal superiority, formal ranking, or categorical causal claim is inferred
  - completed text-first evidence is delivered to drpo-results ingest/e8

