  implementation freeze 452e9fefdca94e25d4cae2422ea2e0ada8ec01fe on the
  reviewed dev/e8-multitask-exp-coldstart-01 branch. Transfer-task banks preserve
  the source P0 error-class sequence and span frozen-reference mean-token
  surprisal within each class. The frozen 208-cell, 1200-update, fresh-LoRA
  scientific protocol is unchanged. Scheduling uses one shared queue over 16
  persistent GPU slots with immediate refill; 13 x 16 is nominal audit geometry
  only and is not a hard scheduling barrier. No universal best coefficient,
  improvement, or convergence claim is assumed.

