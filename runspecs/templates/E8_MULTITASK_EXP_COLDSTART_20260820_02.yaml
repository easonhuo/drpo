purpose: >-
  Execute the repaired nine-task E8 cold-start Exp response-shape pilot from
  implementation freeze 4702c2e97af8df0f26a9e1ceb5a45084cdc1235d. Transfer-task
  banks preserve the source P0 error-class sequence and span frozen-reference
  mean-token surprisal within each class. The frozen 208-cell, 1200-update,
  fresh-LoRA scientific protocol is unchanged. Scheduling uses one shared queue
  over 16 persistent GPU slots with immediate refill; 13 x 16 is nominal audit
  geometry only and is not a hard scheduling barrier. No universal best
  coefficient, improvement, or convergence claim is assumed.

entrypoint:
  cwd: repo_root
  command: >-
    E8_COLDSTART_RUN_ID=E8_MULTITASK_EXP_COLDSTART_20260820_02
    E8_COLDSTART_BOOTSTRAP_PARENT=outputs/e8/E8_MULTITASK_EXP_COLDSTART_20260820_02
