success_criteria:
  - RunSpec lane executor remains the top-level governed execution authority
  - the checked-in RunSpec entrypoint remains scripts/bootstrap_e8_multitask_exp_coldstart.sh full
  - bootstrap full continues to call the reviewed scripts/run_e8_multitask_exp_coldstart.sh full workload entrypoint
  - registry contains exactly one EXT-C-E8-MULTITASK-EXP-COLDSTART-01 entry with implementation_state implemented and execution_gate state ready
  - registry implementation_commit is exactly 4702c2e97af8df0f26a9e1ceb5a45084cdc1235d
  - registry runspec_id is exactly E8_MULTITASK_EXP_COLDSTART_20260820_02
  - exactly one READY RunSpec exists for this experiment
  - protected scientific paths are unchanged after implementation freeze 4702c2e97af8df0f26a9e1ceb5a45084cdc1235d
  - full bootstrap fails closed rather than switching a selected source checkout to another commit
  - reference-remoteness calibration records source error-class sequence and within-class frozen-reference surprisal statistics before training
  - every transfer prompt preserves the source P0 error-class sequence
  - every selected error class with at least two slots includes its class-local near and far reference-surprisal endpoints
  - no numerical remoteness-spread threshold is introduced
  - nine tasks and exactly 208 frozen cells use the existing 1200-update no-early-stop fresh-LoRA protocol
  - scheduling uses exactly 16 persistent slots over one shared pending queue with immediate refill and no hard wave barrier
  - 13 x 16 remains nominal audit or recovery geometry only and never becomes a scheduling or scientific gate
  - current-policy surprisal is recomputed each update for the Exp taper
  - task-performance degradation, support or structure events, and NaN/Inf numerical failure are reported separately
  - terminal aggregate and terminal audit complete before scientific interpretation
  - the completed text-first review package is delivered to drpo-results ingest/e8

