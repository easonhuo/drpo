  Execute the registered nine-task E8 cold-start Exp response-shape study from
  the reviewed canonical cold-start kernels. Preserve the frozen 208-cell,
  13-wave, 16-cell concurrency, 1200-update, fresh-LoRA protocol and the
  reference-surprisal rank-spread selection of 16 verified-wrong negatives per
  transfer prompt. This run may support only the registered response-shape and
  localization claims; it does not authorize convergence, universal best-c,
  significance, or formal cross-method ranking claims.

entrypoint:
