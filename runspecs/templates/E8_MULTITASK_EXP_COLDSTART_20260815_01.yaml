success_criteria:
  - bootstrap resolves authoritative origin/main and executes a clean isolated checkout
  - bootstrap invokes scripts/run_e8_multitask_exp_coldstart.sh full on the resolved main commit
  - registry contains exactly one EXT-C-E8-MULTITASK-EXP-COLDSTART-01 entry with implementation_state implemented and execution_gate state ready
  - exactly one READY RunSpec exists for this experiment
  - all protected cold-start scientific paths are unchanged from repo_commit to execution main
  - nine tasks and exactly 208 frozen cells are executed in 13 hard waves with at most 16 concurrent cells
  - every cell uses the frozen 1200-update no-early-stop fresh-LoRA protocol
  - transfer-task reference banks use 16 evenly spaced frozen-reference surprisal ranks including both extremes
  - current-policy surprisal is recomputed each update for the Exp taper
  - engineering self-test and liveness evidence are never reported as scientific results
  - fixed-horizon completion is not reported as convergence or steady state
  - task-performance degradation, support or structure events, and NaN/Inf numerical failure are reported separately
  - terminal aggregate and terminal audit complete before scientific interpretation

