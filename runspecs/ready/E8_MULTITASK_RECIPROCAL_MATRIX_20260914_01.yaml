success_criteria:
  - config expands to exactly 128 unique scientific cells
  - the exact eight P0 transfer tasks each contain both reciprocal families and four frozen lambda points for each family
  - Reciprocal-Linear lambda is exactly [1, 3, 7, 19]
  - Reciprocal-Quadratic lambda is exactly [1, 9, 49, 361]
  - transfer seed offsets are exactly [4000, 5000]
  - seed 4000 completes before seed 5000 begins
  - Countdown launches zero new scientific cells
  - every cell uses fresh zero-update LoRA initialization with no warm start or external adapter
  - every cell preserves the frozen 1200-update training, evaluation, data-bank, and negative-consumer contracts
  - test_data_used remains false and the test partition remains unopened
  - terminal audit verifies all expected cells and aggregate completeness before any method ranking
  - task performance, valid or structure diagnostics, and NaN or Inf numerical failure remain separate report dimensions
  - fixed 1200 updates are not described as convergence or steady state
  - completed text-first evidence is delivered to drpo-results ingest/e8

