success_criteria:
  - all grid, branch, manifest, aggregate, and audit identities equal EXT-H-E7-SQEXP-GAE-HOPPER-REPLAY-POSBASE-500K-01
  - dataset is exactly hopper-medium-replay-v2
  - the matrix contains exactly sixty-six fresh branches from baselines 0 through 10 and seeds 200, 201, 202, 203, 208, and 209
  - held-out seeds 204 through 207 are untouched
  - every branch uses Positive-only; no branch uses a DRPO negative actor contribution
  - every branch uses canonical A2C, a jointly updated critic, and trajectory-snapshot GAE lambda 0.95
  - every branch reaches exactly 500000 optimizer updates with evaluation every 20000 updates and ten evaluation episodes
  - every branch uses batch size 512 and the trajectory-snapshot refresh interval is derived from batch 512
  - actor and critic optimizer learning rates both remain exactly 0.0003
  - shifted advantage equals raw trajectory-snapshot GAE minus the branch fixed baseline before the Positive-only mask
  - no replay sample is deleted or masked before lookup; shifted advantages at or below zero contribute zero actor weight
  - branch manifests retain first and latest raw and shifted advantage statistics
  - every branch retains the complete per-snapshot effective-positive-fraction series
  - complete twenty-five-point evaluation trajectories are retained for every branch
  - aggregate files report early mean 20k-200k, middle mean 220k-340k, late mean 360k-500k, final 500k, slope 200k-500k, and best-to-final drop
  - all-six mean, median, standard deviation, worst-two-seed late mean, and paired differences against baseline zero are reported
  - failed and low-performing runs are not deleted
  - task-performance degradation, support or variance boundary, rollout failure, and NaN or Inf remain separately reported
  - no task-collapse rate is asserted because no task-performance-collapse threshold is registered
  - fixed 500000-update horizon is not convergence or steady-state evidence
  - terminal audit observes exactly sixty-six branches and passes before result delivery
  - completed text-first evidence is delivered to drpo-results branch ingest/e7

