purpose: >
  Execute a sixty-six-branch, 500,000-update Hopper-medium-replay pilot that
  isolates Positive-only and raises its raw trajectory-snapshot GAE admission
  threshold with fixed baselines 0 through 10. Use six development seeds,
  preserve complete evaluation and snapshot-diagnostic trajectories, and measure
  whether a stricter Positive-only target set improves finite-horizon performance
  or retention. This pilot does not establish convergence, steady state,
  task-collapse rates, universal superiority, or a formal method ranking.

