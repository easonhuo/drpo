  command: >-
    E7_HR_POSBASE_GRID=configs/e7_hopper_replay_positive_only_baseline_500k.json
    E7_HR_POSBASE_WORK_DIR=outputs/e7/hopper_replay_positive_only_baseline_500k_001
    E7_HR_POSBASE_MAX_WORKERS=66
    bash scripts/run_e7_hopper_replay_positive_only_baseline_500k.sh run

