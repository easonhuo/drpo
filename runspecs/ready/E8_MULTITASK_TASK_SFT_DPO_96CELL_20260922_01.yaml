success_criteria:
  - execution resolves refs/heads/main through the canonical easonhuo/drpo origin and uses a clean isolated checkout
  - protected scientific paths remain unchanged from repo_commit 7b2d185cfb39c565cb3ac7bcf01341b1f418b871
  - experiment identity is EXT-C-E8-MULTITASK-TASK-SFT-DPO-96CELL-01 and execution class is formal
  - tracked config expands to exactly 96 unique scientific cells across the eight P0 transfer tasks only
  - countdown launches zero new scientific cells
  - every task uses beta values exactly 0.0, 0.05, 0.1, 0.2, 0.5, and 1.0 with seed labels exactly 4000 and 5000
  - each task reuses one deterministic train-only task_positive_warmstart_100 adapter with 100 SFT optimizer updates and the frozen P0 warm-start recipe
  - task-SFT seed identity remains P0 base seed 2026072900 plus the existing deterministic task offset
  - canonical reference-bank and DPO runtime seed base remains 2026070803
  - beta zero performs zero DPO optimizer updates and preserves exact initial-policy, terminal-policy, and frozen-reference state-hash equality
  - the two beta-zero seed labels per task must agree on the zero-update terminal contract and measured step-zero validation metrics before aggregation collapses them to one independent replicate
  - beta-zero grouped statistics expose effective independent seed count one and do not fabricate seed uncertainty, pair-margin probes, gradient probes, or optimizer-step probes
  - positive-beta cells preserve canonical PR-268 chosen/rejected construction, summed completion log probability, exact frozen initial-policy reference, pair margin, softplus or sigmoid DPO loss, zero label smoothing, and prompt-balanced unique-negative aggregation
  - positive-beta cells use exactly 1200 optimizer updates with the frozen optimizer, evaluation cadence, max-length, and held-out-validation contracts
  - no hard-negative mining, near or far selection, distance taper, value network, or current-policy-surprisal training weight is introduced into DPO
  - execution preserves GPU ids 0 through 7, two cells per GPU, 16 maximum concurrent cells, dynamic scheduling, and the frozen six-wave geometry
  - test_data_used remains false and the test partition remains unopened
  - the hardened E8 runner returns zero only after required workload completion, terminal audit, source and config provenance, and guarded-package checks
  - task performance, valid or structure diagnostics, and NaN or Inf numerical failure remain separate report dimensions
  - fixed 1200 updates are not described as convergence or steady state
  - no statistical-significance, asymptotic, universal-superiority, or method-ranking claim is inferred without the terminal audit and separate reviewed analysis
  - completed text-first evidence is delivered to drpo-results ingest/e8

