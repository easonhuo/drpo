purpose: >-
  Execute the reviewed 96-cell E8 task-SFT canonical-DPO beta-response study
  exactly as frozen in configs/e8_multitask_task_sft_dpo_96cell.yaml. The run
  covers only the eight P0 transfer tasks, with one deterministic train-only
  task-positive SFT warm-start adapter per task, beta values
  [0.0, 0.05, 0.1, 0.2, 0.5, 1.0], and DPO seed labels 4000 and 5000.
  Beta zero is an exact SFT-only no-DPO-update control: its two seed labels are
  duplicate execution rows sharing the same SFT adapter and evaluation seed and
  contribute one independent static-control replicate per task after the
  fail-closed duplicate-consistency audit. Positive-beta cells preserve the
  canonical PR-268 DPO semantics and run for 1200 optimizer updates. Countdown
  launches no new cell and the test partition remains unopened. This RunSpec is
  an optional immutable execution snapshot and delivery convenience; it does not
  authorize convergence, statistical significance, asymptotic claims, or a
  universal method ranking.

