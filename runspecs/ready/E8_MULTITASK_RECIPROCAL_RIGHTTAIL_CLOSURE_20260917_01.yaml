purpose: >-
  Execute the reviewed 108-cell E8 reciprocal right-tail response-closure sweep
  exactly as frozen in configs/e8_multitask_reciprocal_righttail_closure_108.yaml.
  The sweep extends matched taper-strength levels through level 11 on the seven
  still-insufficiently-closed transfer tasks, while launching no new Spiral Matrix
  or Countdown cells. Knights & Knaves Quadratic and both Graph Color arms backfill
  previously unrun matched levels 5 through 8 before extending through levels 9 to
  11. The two paired seeds remain 4000 and 5000 with the hard seed barrier, every
  cell remains fixed at 1200 optimizer updates from fresh zero-update LoRA, and the
  test partition remains unopened. This RunSpec is an optional immutable execution
  snapshot and delivery convenience; it does not authorize convergence,
  significance, steady-state, asymptotic, or universal method-ranking claims.

