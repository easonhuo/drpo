purpose: >-
  Execute the reviewed 60-cell E8 reciprocal follow-up exactly as frozen in
  configs/e8_multitask_reciprocal_linear_graphcolor_closure_60.yaml. The sweep
  extends only the still-open Reciprocal-Linear right tails for Word Sorting,
  Spiral Matrix, Mini Sudoku, and Word Ladder, and densifies only the low-strength
  Graph Color region for both Reciprocal-Linear and Reciprocal-Quadratic. The two
  paired seeds remain 4000 and 5000 with the hard seed barrier, every cell remains
  fixed at 1200 optimizer updates from fresh zero-update LoRA, no previously
  completed scientific cell is rerun, and the test partition remains unopened.
  This RunSpec is an optional immutable execution snapshot and delivery convenience;
  it does not authorize convergence, significance, steady-state, asymptotic, or
  universal method-ranking claims.

