success_criteria:
  - execution resolves refs/heads/main through the canonical easonhuo/drpo origin and uses a clean isolated checkout
  - protected scientific paths remain unchanged from repo_commit d61c52c72c94225af3b79c481efe6480bb9b4f9b
  - experiment identity is EXT-C-E8-MULTITASK-RECIPROCAL-LINEAR-GRAPHCOLOR-CLOSURE-01 and execution class is formal
  - tracked config expands to exactly 60 unique scientific cells
  - Reciprocal-Linear uses lambdas 601, 901, 1351, 2025, 3037 on word_sorting, mini_sudoku, and word_ladder only
  - Reciprocal-Linear uses lambdas 181, 271, 401, 601, 901 on spiral_matrix only
  - Reciprocal-Linear uses lambdas 2, 4, 5, 10, 14 on graph_color only
  - Reciprocal-Quadratic uses lambdas 4, 16, 25, 100, 196 on graph_color only
  - Graph Color densification preserves lambda_quadratic equal to lambda_linear squared at every newly added paired point
  - maze, knights_knaves, wikisql, and countdown launch zero new scientific cells
  - no Reciprocal-Quadratic cells are launched outside Graph Color
  - paired transfer seeds remain exactly 4000 and 5000 with the seed batch barrier preserved
  - every cell preserves the frozen 1200-update training, evaluation, optimizer, fresh-LoRA, data-bank, and negative-consumer contracts
  - no previously completed Reciprocal cell, Positive-only cell, or Global endpoint cell is rerun
  - test_data_used remains false and the test partition remains unopened
  - the hardened E8 runner returns zero only after required workload completion, terminal audit, source/config provenance, and guarded-package checks
  - task performance, valid or structure diagnostics, and NaN or Inf numerical failure remain separate report dimensions
  - fixed 1200 updates are not described as convergence or steady state
  - Graph Color endpoint shape is not attributed to faster convergence without trajectory evidence
  - no significance, asymptotic, universal superiority, or method-ranking claim is inferred without the registered terminal audit
  - completed text-first evidence is delivered to drpo-results ingest/e8

