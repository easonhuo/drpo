  - experiment identity is EXT-C-E8-MULTITASK-EXP-LAMBDA-WIDE-RIGHTTAIL-03 and execution class is pilot
  - tracked config expands to exactly 100 unique Exp cells with 20 cells each for word_sorting, mini_sudoku, maze, knights_knaves, and wikisql
