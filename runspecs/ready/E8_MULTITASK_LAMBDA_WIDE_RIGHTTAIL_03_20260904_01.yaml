  Execute the reviewed five-task, single-seed E8 Exp-lambda wide-right-tail
  pilot exactly as frozen in the tracked config and protocol. The run adds 20
  new lambda cells each for Word Sorting, Mini Sudoku, Maze, Knights & Knaves,
  and WikiSQL (100 cells total), launches no cells for Countdown, Spiral Matrix,
  Word Ladder, or Graph Coloring, and preserves the existing 1200-update
  config-driven cold-start implementation. This RunSpec is execution and
  delivery plumbing only; it does not authorize convergence, significance,
  steady-state, asymptotic, or universal method-ranking claims.

