purpose: >-
  Execute the unified 36-run Hopper-medium-replay p/q, advantage-refresh,
  raw-IS and Q2 intervention protocol. Reuse the original 24 cold-start
  branches and add only 12 frozen-advantage Far-zero/Far-cap and dedicated
  Global controls. Each paired worker matches actual full-parameter
  pre-clipping negative-gradient norms between its two trajectories on every
  update. One eight-GPU pool schedules 24 independent and six pair jobs.
  This is fixed-budget external-validity evidence, not a convergence or
  steady-state method-ranking claim. No training has been launched by
  creating this snapshot.

