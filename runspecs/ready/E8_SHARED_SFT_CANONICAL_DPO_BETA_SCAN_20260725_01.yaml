  command: >-
    E8_WARM_DPO_EXPECTED_COMMIT=2836e44527f7bd73f07a11bff81aaa37ff26e2aa
    E8_WARM_DPO_WORK_ROOT=outputs/e8/shared_sft_warmstarted_dpo_001
    E8_WARM_DPO_FORMAL_RUN_AUTHORIZED=1
    bash scripts/run_countdown_e8_shared_sft_canonical_dpo_beta_scan.sh full

recovery:
