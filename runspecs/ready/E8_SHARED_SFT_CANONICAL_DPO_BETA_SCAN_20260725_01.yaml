purpose: >-
  Execute a two-stage external-validity pilot on the frozen E8 V2 bank. First,
  train exactly one one-epoch oracle-positive SFT LoRA adapter and persist it once.
  Second, initialize every canonical sigmoid-DPO cell from that identical read-only
  adapter, copy the initialized policy exactly to a permanently frozen reference
  before update 1, and scan eight beta values over two paired development seeds.
  The foundation model is shared by path and is not merged or duplicated. Preserve
  the fixed 1200-step DPO horizon, prompt-balanced all-unique-negative loss,
  structurally disjoint held-out evaluation, no-test-access boundary, terminal
  audit, and separate task/support/numerical reporting. This run does not test the
  DRPO/TOPR remoteness mechanism and does not authorize convergence, steady state,
  significance, best-beta, or formal method-ranking claims.

entrypoint:
