success_criteria:
  - source checkout is clean and every protected implementation path is unchanged from commit 2836e44527f7bd73f07a11bff81aaa37ff26e2aa
  - the shared V2 oracle-SFT stage executes exactly once with seed 2026070700, exactly one epoch, no adaptive metric stopping, and no test access
  - SFT_COMPLETE.json and SFT_WARMSTART_GATE.json both exist and identify the same persisted epoch_1_adapter
  - the shared adapter config and single LoRA weight file match the SHA-256 values recorded by the SFT gate
  - no SFT adapter is merged into or saved as a duplicated full Qwen foundation model
  - every one of the sixteen DPO cell run identities records the exact same shared-SFT adapter path and hashes
  - every DPO cell copies its initialized policy adapter exactly to a permanently frozen reference before update 1 and satisfies the 1e-5 initial pair-margin tolerance
  - beta values are exactly 0.01, 0.03, 0.05, 0.1, 0.2, 0.3, 0.5, and 1.0
  - paired development seed offsets are exactly 4000 and 5000, yielding sixteen unique cells
  - execution uses GPU 0 and 1 with two cells per GPU and four full waves
  - the beta=0.1 two-step warm-started DPO liveness and fresh-process policy/reference checkpoint reload gates pass before the full matrix
  - every full DPO cell uses exactly 1200 optimizer updates, no early stopping, Greedy and Pass@8 every 100 updates, and Pass@64 every 200 updates
  - every expected cell summary is present, failed cells are explicitly indexed, and aggregate/terminal_audit.json exists
  - the held-out evaluation split never enters the training loss and the separate test split is not accessed
  - task-performance degradation, valid-structure or support behavior, and NaN/Inf numerical failure are reported separately
  - fixed 1200-step training is not reported as convergence, steady state, saturation proof, significance, best-beta selection, or formal method ranking

