purpose: >-
  Execute the reviewed 128-cell E8 Global-alpha transfer response sweep exactly
  as frozen in configs/e8_multitask_global_alpha_128.yaml. The run covers only
  the eight P0 transfer tasks, with alpha values [1/128, 1/64, 1/32, 1/16,
  1/8, 1/4, 1/2, 1] and paired seed labels 4000 and 5000. Global-alpha uses the
  existing canonical negative branch with constant weight alpha and c=0.
  Positive-only alpha=0 and Countdown are historical references and launch no
  new scientific cell. Every scientific cell remains fixed at 1200 optimizer
  updates from fresh zero-update LoRA, and the test partition remains unopened.
  This RunSpec is an optional immutable execution snapshot and delivery
  convenience; it does not authorize convergence, significance, steady-state,
  asymptotic, or universal method-ranking claims.

