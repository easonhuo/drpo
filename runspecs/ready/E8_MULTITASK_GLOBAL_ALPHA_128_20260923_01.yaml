    - outputs/e8/E8_MULTITASK_GLOBAL_ALPHA_128_20260923_01/recovery/CONFIG_PREFLIGHT.json
    - outputs/e8/E8_MULTITASK_GLOBAL_ALPHA_128_20260923_01/recovery/SETUP_COMPLETE.json
    - outputs/e8/E8_MULTITASK_GLOBAL_ALPHA_128_20260923_01/guard/attempt-*/workload/scheduler/dynamic_run.json
    - outputs/e8/E8_MULTITASK_GLOBAL_ALPHA_128_20260923_01/guard/attempt-*/workload/aggregate/plot_curve_points.csv
    - outputs/e8/E8_MULTITASK_GLOBAL_ALPHA_128_20260923_01/guard/attempt-*/workload/terminal_audit.json
  backoff_seconds: 60

