success_criteria:
  - execution resolves refs/heads/main through the canonical easonhuo/drpo origin and uses a clean isolated checkout
  - protected scientific paths remain unchanged from repo_commit 7fa7fcbc62f3606a1b7926d323c89e22e14289d5
  - experiment identity is EXT-C-E8-MULTITASK-GLOBAL-ALPHA-SWEEP-01 and execution class is formal
  - tracked config expands to exactly 128 unique scientific cells across the eight P0 transfer tasks only
  - countdown launches zero new scientific cells
  - every task uses alpha values exactly 0.0078125, 0.015625, 0.03125, 0.0625, 0.125, 0.25, 0.5, and 1.0
  - every task uses seed labels exactly 4000 and 5000
  - Global-alpha dispatch uses the existing canonical constant negative weighting with c equal to zero
  - Positive-only alpha zero is reused as a historical endpoint and is not retrained
  - every scientific cell starts from fresh zero-update LoRA and uses exactly 1200 optimizer updates
  - model, optimizer, evaluation cadence, task-local context lengths, frozen banks, and all-unique-negative consumer match the frozen E8 transfer contract
  - execution preserves GPU ids 0 through 7, two cells per GPU, 16 maximum concurrent cells, dynamic scheduling, and eight nominal 16-cell waves
  - test_data_used remains false and the test partition remains unopened
  - the hardened E8 runner returns zero only after required workload completion, terminal audit, source and config provenance, and guarded-package checks
  - task performance, valid or structure diagnostics, and NaN or Inf numerical failure remain separate report dimensions
  - fixed 1200 updates are not described as convergence or steady state
  - no statistical-significance, asymptotic, universal-superiority, or method-ranking claim is inferred from this finite-horizon response sweep
  - completed text-first evidence is delivered to drpo-results ingest/e8

