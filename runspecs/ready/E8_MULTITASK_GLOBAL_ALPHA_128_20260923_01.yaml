    E8_COLDSTART_BOOTSTRAP_ROOT=/root/drpo-e8-global-alpha-128-runspec-20260923-01
    E8_COLDSTART_TARGET_REF=refs/heads/main
    E8_COLDSTART_EXPERIMENT_ID=EXT-C-E8-MULTITASK-GLOBAL-ALPHA-SWEEP-01
    E8_COLDSTART_CONFIG=configs/e8_multitask_global_alpha_128.yaml
    E8_COLDSTART_RUN_ID=E8_MULTITASK_GLOBAL_ALPHA_128_20260923_01
    E8_COLDSTART_RUN_CLASS=formal
    E8_COLDSTART_REQUIRE_ORIGIN_MAIN=1
    E8_COLDSTART_GUARD_ROOT=outputs/e8/E8_MULTITASK_GLOBAL_ALPHA_128_20260923_01/guard
    E8_COLDSTART_RECOVERY_ROOT=outputs/e8/E8_MULTITASK_GLOBAL_ALPHA_128_20260923_01/recovery
    bash scripts/bootstrap_e8_multitask_exp_coldstart.sh full

