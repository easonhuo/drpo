purpose: >-
  Execute the reviewed 104-cell E8 reciprocal right-tail completion exactly as
  frozen in configs/e8_multitask_reciprocal_righttail_104.yaml. Reciprocal-Linear
  adds four right-tail lambda points on seven transfer tasks; Reciprocal-Quadratic
  adds four right-tail lambda points on six transfer tasks. Graph Color launches
  no new cells and Knights & Knaves launches no new Quadratic cells. The two paired
  seeds remain 4000 and 5000 with the hard seed barrier, each cell remains fixed at
  1200 optimizer updates from fresh zero-update LoRA, Countdown launches zero new
  cells, and the test partition remains unopened. This RunSpec is an optional
  execution snapshot and delivery convenience; it does not authorize convergence,
  significance, steady-state, asymptotic, or universal method-ranking claims.

