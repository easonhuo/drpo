  - Reciprocal-Linear uses lambdas 31, 49, 81, 121 on word_sorting, spiral_matrix, mini_sudoku, maze, word_ladder, knights_knaves, and wikisql only
  - Reciprocal-Quadratic uses lambdas 961, 2401, 6561, 14641 on word_sorting, spiral_matrix, mini_sudoku, maze, word_ladder, and wikisql only
