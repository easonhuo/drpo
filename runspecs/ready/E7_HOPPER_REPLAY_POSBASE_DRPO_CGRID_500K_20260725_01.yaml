success_criteria:
  - all identities equal EXT-H-E7-SQEXP-GAE-HOPPER-REPLAY-POSBASE-DRPO-CGRID-500K-01
  - dataset is exactly hopper-medium-replay-v2
  - the matrix is exactly twenty controls by nine development seeds for 180 branches
  - baselines are exactly 0, 4, 5, and 6; DRPO scales are exactly 0.06, 0.08, 0.10, and 0.125
  - development seeds are 200, 201, 202, 203, 208, 209, 210, 211, and 212; held-out 204 through 207 remain untouched
  - canonical A2C, jointly updated critic, trajectory-snapshot GAE lambda 0.95, batch 512, and actor/critic LR 0.0003 remain unchanged
  - every successful branch reaches 500000 updates with evaluation every 20000 updates and ten episodes; no result-conditioned early stop or pruning occurs
  - raw trajectory-snapshot GAE is shifted by the fixed baseline before sign split without deleting or masking replay samples
  - positive shifted advantages remain unattenuated; Positive-only zeros negative shifted advantages; DRPO applies only the detached thresholded squared-exponential taper
  - taper lambda is 1, threshold is 0, and reference distance is 2
  - complete evaluation, advantage-snapshot, near/far effective-mass, raw-gradient, Adam-update, log-standard-deviation, and support-boundary trajectories are retained
  - paired DRPO-minus-Positive-only at common baseline and shifted-DRPO-minus-baseline-zero at common scale are reported
  - the frozen finite-horizon screening order is applied without claiming convergence, steady state, held-out confirmation, or formal method ranking
  - task-performance degradation, support or variance boundary, rollout failure, and NaN or Inf are separately reported; task-collapse rate is not adjudicated
  - terminal audit observes exactly 180 branches and passes before text-first delivery to drpo-results branch ingest/e7

