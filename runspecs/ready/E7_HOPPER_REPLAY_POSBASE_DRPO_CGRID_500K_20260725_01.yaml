purpose: >
  Execute a 180-branch, 500,000-update Hopper-medium-replay pilot crossing four
  fixed raw trajectory-snapshot GAE baselines with four thresholded
  squared-exponential DRPO remoteness scales, while retaining Positive-only at
  every baseline. Use nine development seeds and preserve complete evaluation,
  snapshot, geometry, raw-gradient, Adam-update, and support-boundary
  diagnostics. This pilot screens finite-horizon baseline-by-control interactions;
  it does not establish convergence, steady state, held-out confirmation,
  task-collapse rates, universal superiority, or a formal method ranking.

