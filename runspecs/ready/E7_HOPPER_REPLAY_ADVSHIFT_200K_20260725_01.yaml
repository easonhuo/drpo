purpose: >
  Execute a twenty-branch, 200,000-update Hopper-medium-replay pilot that applies
  one fixed positive baseline to raw trajectory-snapshot GAE before the DRPO
  positive/negative sign split. Compare Positive-only, current DRPO with baseline
  zero, and DRPO baselines 0.25, 0.5, and 1.0 on four difficult development
  seeds. Preserve every sample, seed, checkpoint trajectory, and shift statistic.
  This short-horizon screen may qualify a longer confirmation but does not
  establish convergence, steady state, task-collapse rates, universal
  superiority, or a formal method ranking.

entrypoint:
  cwd: repo_root
  command: >-
    E7_HR_ADVSHIFT_GRID=configs/e7_hopper_replay_advshift_200k.json
    E7_HR_ADVSHIFT_WORK_DIR=outputs/e7/hopper_replay_advshift_200k_001
    E7_HR_ADVSHIFT_MAX_WORKERS=20
    bash scripts/run_e7_hopper_replay_advshift_200k.sh run

recovery:
  enabled: true
  max_attempts: 2
  resume_command: >-
    E7_HR_ADVSHIFT_GRID=configs/e7_hopper_replay_advshift_200k.json
    E7_HR_ADVSHIFT_WORK_DIR=outputs/e7/hopper_replay_advshift_200k_001
    E7_HR_ADVSHIFT_MAX_WORKERS=20
    bash scripts/run_e7_hopper_replay_advshift_200k.sh run
  retryable_exit_codes: [137, 143]
  checkpoint_globs:
    - outputs/e7/hopper_replay_advshift_200k_001/EXECUTION_PLAN.json
    - outputs/e7/hopper_replay_advshift_200k_001/RUN_IDENTITY.json
    - outputs/e7/hopper_replay_advshift_200k_001/branches/**/COMPLETED.json
    - outputs/e7/hopper_replay_advshift_200k_001/branches/**/FAILED.json
  backoff_seconds: 60

policy:
  existing_script_required: true
  forbid_new_launcher: true
  forbid_hparam_change: true
  forbid_cross_lane: true
  scientific_aggregation_allowed: true
  formal_evidence_allowed: false

outputs:
  run_dir: outputs/e7/hopper_replay_advshift_200k_001
  summary_file: outputs/e7/hopper_replay_advshift_200k_001/RUN_SUMMARY.json
  audit_file: outputs/e7/hopper_replay_advshift_200k_001/aggregate/terminal_audit.json

success_criteria:
  - all grid, branch, manifest, aggregate, and audit identities equal EXT-H-E7-SQEXP-GAE-HOPPER-REPLAY-ADVSHIFT-200K-01
  - dataset is exactly hopper-medium-replay-v2
  - the matrix contains exactly twenty fresh branches from five controls and seeds 200, 202, 203, and 208
  - controls are exactly Positive-only baseline 0, DRPO baseline 0, and DRPO baselines 0.25, 0.5, and 1.0
  - held-out seeds 204 through 207 are untouched
  - every branch uses canonical A2C, a jointly updated critic, and trajectory-snapshot GAE lambda 0.95
  - every branch reaches exactly 200000 optimizer updates with evaluation every 20000 updates and ten evaluation episodes
  - every branch uses batch size 512 and the trajectory-snapshot refresh interval is derived from batch 512
  - actor and critic optimizer learning rates both remain exactly 0.0003
  - DRPO branches keep remoteness scale 0.08, threshold 0, taper lambda 1, and reference distance 2
  - shifted advantage equals raw trajectory-snapshot GAE minus the branch fixed baseline before sign classification
  - no sample is deleted or masked and positive-to-negative crossings remain in the actor objective
  - branch manifests retain first and latest raw and shifted advantage sign fractions
  - complete ten-point evaluation trajectories are retained for every branch
  - aggregate files report early mean 20k-100k, late mean 120k-200k, final 200k, slope 100k-200k, and best-to-final drop
  - paired comparisons are reported against both Positive-only and baseline-zero DRPO
  - failed and low-performing runs are not deleted
  - task-performance degradation, support or variance boundary, rollout failure, and NaN or Inf remain separately reported
  - no task-collapse rate is asserted because no task-performance-collapse threshold is registered
  - fixed 200000-update horizon is not convergence or steady-state evidence
  - terminal audit observes exactly twenty branches and passes before result delivery
  - completed text-first evidence is delivered to drpo-results branch ingest/e7

